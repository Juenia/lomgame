# 事件卡文本片段池：卡片正文只写骨架，细节由这里拼
# 用法：在卡片的 texts.priv / texts.group 里写 {{气味}}，渲染时按 seed 随机取一条
fragments:
  气味:
    - 潮湿的煤灰味
    - 廉价香水的甜腻
    - 铁锈和雨水的味道
    - 旧纸与蜡的味道
    - 某种说不出名字的腥气
  声音:
    - 有人在楼上走动
    - 远处传来一声汽笛
    - 巷子里有很轻的争执
    - 钟敲了十三下
    - 有人在低声数数
  人影:
    - 一个撑着黑伞的人停在路口
    - 两个搬运工抬着没有标记的木箱
    - 一个孩子在数墙砖
    - 一位老先生在灯下看报纸
  收获:
    - 你把这些记进本子
    - 你把东西收好，没有回头
    - 你确认了一下身后没人跟着
    - 你决定明天再来一趟
  卜象:
    - 你看见一座倒过来的钟楼，指针停在你生日那天
    - 牌面朝下，但你已经知道是哪一张
    - 有人在你背后翻了一页书，然后停下
    - 一条河分成两条，两条都通向同一个地方
    - 你数到第七下的时候，钟声已经停了
    - 一只鸟落在你肩上，说了句你听不懂的话
    - 镜子里的门开着，但你没有走过去
    - 灰雾里伸出一只手，手上戴着你的戒指
    - 你看见自己在写字，写的是别人的名字
    - 命运线在某人身上打了结，你看不清是谁
  动静:
    - 门自己合上了
    - 灯芯爆了一下
    - 地板在某个位置响了一声
    - 有什么东西轻轻碰到了你的鞋尖
