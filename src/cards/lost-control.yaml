# 失控文本池（W5：12 → 30 条，按途径分）
# 支持 {{片段}} 模板语法（片段池见 src/cards/fragments.yaml）；以 {{ 开头必须加引号
lost_control:
  # 愚者途径：幻觉、预言、身份错位
  seer:
    - "你听见有人在用你的声音说话，从很远的地方。等你回过神，手里多了一样不属于你的东西。"
    - "镜子里的你比你慢了半拍，然后先笑了一下。"
    - "{{卜象}}。你确信这不是比喻。"
    - "你数了三遍自己的手指，第三遍多了一根。"
    - "你把今天说过的话重新想了一遍，发现有一句不是你想说的。"
    - "有东西在你耳边报了一个名字，你答应了，才想起那是你自己的名字。"
    - "你看见了三条未来，每一条里你都在做同一件你不记得做过的事。"
    - "纸牌自己翻开了，牌面是你现在站着的地方。"
    - "你发现自己正在用别人的笔迹写字，而那句话是对的。"
    - "街上的钟同时响了，只有你听见了第十三下。"
  # 战士途径：暴怒、失控的暴力、血脉沸腾
  warrior:
    - "你的手先动了，脑子还没跟上。地上的人不是你要找的那个。"
    - "血的味道让你清醒，也让你想再闻一次。"
    - "{{动静}}。你发现自己已经把门拆下来了，而你不记得为什么。"
    - "有人在喊你的名字，你回头时手已经抬起来了。"
    - "你听见自己心跳的声音变成了鼓点，越敲越快，最后你跟着它动了。"
    - "你不知道自己在打什么，只知道不能停。"
    - "醒来时你的指节全是血，而你并不觉得疼。"
    - "有人挡在你和目标之间，你没有绕过去。"
    - "{{声音}}。你把它当成了挑衅。"
    - "你终于安静下来，因为你周围已经没有能出声的东西了。"
  # 不眠者途径：梦魇、失序、被黑暗注视
  sleepless:
    - "你醒着，但你的梦还在继续，它走在你的前面。"
    - "你已经连续第七个夜晚没有闭眼，而梦替你睡了，也替你做了决定。"
    - "{{动静}}。你在梦里听过这个声音，那时它还不会说话。"
    - "你确定自己锁了门，但你在门外，手里拿着钥匙。"
    - "有人在黑暗里叫你的名字，用的是你自己的语调。"
    - "你数着呼吸想睡着，数到第几个的时候，呼吸不再听你的。"
    - "你看见自己的影子先动了，然后你才动。"
    - "你想起一件从未发生过的往事，细节完整得可怕。"
    - "{{气味}}。你循着它走了很久，最后回到自己床上。"
    - "你终于睡着了，而醒着的那个你留在了原地。"
  # M2.76：以下四条途径原本没有专属失控文本 —— 它们的玩家失控时抽到的是
  # **别人途径的句子**（走 pool.all 的兜底）。这一轮补齐，7 条途径各有 10 条。
  #
  # 水手途径：海、风暴、溺水、咆哮、盐
  sailor:
    - "你张开嘴，出来的不是话，是风。"
    - "你的皮肤上结了一层盐，你把它刮下来，底下还是盐。"
    - "{{动静}}。你听见的是一段很长的、往下沉的声音，而你并不在水里。"
    - "有人在很远的地方喊你回去，你发现自己正朝着反方向走，而且走得很快。"
    - "你捏碎了手里的杯子，因为没有别的东西可以捏。"
    - "海在你的耳朵里涨潮，一次比一次高，你开始跟着它呼吸。"
    - "你数了数身上的伤口，都是咸的。"
    - "{{气味}}。你以为那是岸，跑过去之后发现是更深的水。"
    - "你对着空处吼了一整夜，天亮时嗓子是哑的，而海面很平。"
    - "你终于安静下来，因为你已经在水底了。"
  # 完美者途径：机械、齿轮、拆解、精确、蒸汽
  perfect:
    - "你把自己拆开看了一下，装回去的时候多出来一颗螺丝。"
    - "你听见关节里有齿轮在转，而你没有装过齿轮。"
    - "你把桌上的东西全摆成一条直线，摆完之后你又把它们全推倒，再摆一遍。"
    - "{{声音}}。你判断出它的频率，然后你发现自己已经算了很久。"
    - "你的手在做一件很精确的事，精确到你不该会。"
    - "蒸汽从你的袖口冒出来，你不觉得烫。"
    - "你数着心跳，数到一百二十的时候，它开始按拍子走。"
    - "你盯着一个人的脸看了很久，你在看他的接缝在哪里。"
    - "你修好了那件东西，修好之后它开始自己动。"
    - "你终于停下来，因为你身上已经没有可以再拆的零件了。"
  # 阅读者途径：知识、书页、推理、记录、眼睛
  reader:
    - "你读完了那一页，然后你发现你在读的是自己的名字，写了很多遍。"
    - "有人在你脑子里翻书，翻得很快，你不认识那些字，但你懂。"
    - "{{卜象}}。你把它记了下来，记完才发现你没有带笔。"
    - "你推理出了一些事情，那些事情还没有发生。"
    - "你看着一个人的时候，先看到的是他身上的注释。"
    - "你说了三句话，每一句都是正确的，而且每一句都让人退后一步。"
    - "你把今天发生的事按顺序写了一遍，写到一半发现顺序不对。"
    - "{{气味}}。你查到了它是什么，然后你希望自己没查。"
    - "有东西在很远的地方合上了一本书，你的头跟着疼了一下。"
    - "你终于合上书，因为你已经把该忘的都记住了。"
  # 母亲途径：生长、根须、孕育、腐烂、土地
  mother:
    - "你的指尖长出细小的根须，它们朝着有水的地方去了。"
    - "你把种子按进土里，按得太深了，你听见底下有什么在应你。"
    - "{{动静}}。那不是从外面来的，是从你身体里面。"
    - "你蹲在院子里很久，久到膝盖生了根。"
    - "有什么在你身体里长大，长得很有耐心，一点都不急。"
    - "你尝了一口土，觉得味道是对的。"
    - "你替一株枯了的植物难过了一整天，然后你把它埋了，埋得很仔细。"
    - "{{气味}}。你跟着它走，走到了一片比你来得更早的地方。"
    - "你数了数今年收成，数字对得上，但你总觉得少了一季。"
    - "你终于站起来，因为你脚下的东西已经不需要你了。"
  # ============================================================================
  # M2.76：15 条新途径的失控文本（各 10 条）
  #
  # 为什么必须补：lost-control.ts 的 PATHWAYS 现在从 PATHWAY_LABELS **派生**（22 条），
  # 所以「哪几条途径有文本」不再是一份会漂的手抄清单 —— 缺一条就当场报 error。
  # 这正是那次修复的目的：加途径时不再安静地少读一半。
  # ============================================================================
  door:
    - "你走进一扇门，出来的时候街景换了 —— 你没走错，是门走错了。"
    - "你数了数今天进过的门，多了一扇，而你想不起它开在哪里。"
    - "你把手按在墙上，墙后面有另一只手也按着。"
    - "你的影子比你早一步穿过了门框。"
    - "你走过的地方开始出现不属于这里的走廊。"
    - "有人隔着门叫你的名字，声音是从你背后来的。"
    - "你发现自己站在一间没有出口的房间里，而你刚刚才从外面进来。"
    - "你摸了摸口袋，里面是一把你不记得拿过的钥匙。"
    - "门在你身后关上了，而它本来不该有关上的时候。"
    - "你终于停下来，因为你已经分不清哪一扇是进来的那扇。"
  sun:
    - "你的指尖开始发亮，亮得能照见骨头。"
    - "有人说了一句谎，你听见自己身体里有什么在烧。"
    - "光从你的眼睛里出来，而不是进去。"
    - "你在阴影里站不住 —— 阴影会自己退开。"
    - "有人向你求饶，而你只想让他站到光里去。"
    - "你的影子变得很短，短到几乎不存在。"
    - "你开口的时候，周围的人同时眯起了眼。"
    - "你烧掉了一样不属于你的东西，而你不后悔。"
    - "正午在你身边停住了，一直停着。"
    - "你终于暗下来，因为你周围已经没有影子可照。"
  corpse_collector:
    - "你数了数自己的心跳，数到第三下就不确定了。"
    - "有一具尸体的姿势和你睡着时一模一样。"
    - "你替一个陌生人合上了眼睛，合了三次。"
    - "你身上开始有那种味道，洗不掉。"
    - "死掉的东西在你身边安静得不太正常。"
    - "你对着空椅子说了一句话，椅子动了。"
    - "你的手很凉，凉得连自己都不想碰。"
    - "你路过坟场的时候，里面的东西都转过来看你。"
    - "你替自己念了一段悼词，念得很顺。"
    - "你终于安静下来，因为你已经很久没有呼吸了。"
  error:
    - "你明明走的是直线，却回到了原点。"
    - "你把手伸进抽屉，摸到的是三天后的东西。"
    - "有人叫你的名字，你应了，然后发现自己答错了。"
    - "你做的每一件事都发生了两次，只有一次被记住。"
    - "你的手指穿过了桌子 —— 不是穿过去，是桌子让开了。"
    - "你把一句话说了两遍，第二遍的意思不一样。"
    - "你发现自己站在一个不该存在的位置上。"
    - "你偷了一样东西，然后忘了自己偷了什么。"
    - "规则在你面前失效了，而你知道是你弄坏的。"
    - "你终于停下来，因为你已经不在原来的地方了。"
  mystery_pryer:
    - "你抬头看星，星星在看你。"
    - "你读到一句话，那句话是写给还没出生的人的。"
    - "你把不该知道的事记住了，而且忘不掉。"
    - "有东西在你耳边报出一串数字，你本能地记了下来。"
    - "你翻开一本没有字的书，读出了内容。"
    - "你窥见了一角，那一角也窥见了你。"
    - "你藏在心里的东西开始自己说话。"
    - "你算出了一个结论，然后决定不告诉任何人。"
    - "你站在星的下面，站成了它们的一部分。"
    - "你终于闭上了眼，因为你已经把该看的都看了。"
  spectator:
    - "你发现自己正在旁观自己做事。"
    - "你做了一个梦，醒来时别人还在那个梦里。"
    - "有人在你面前说了真话，你听见的是他觉得的真话。"
    - "你笑了一下，而你的脸没有动。"
    - "你把一个人的记忆翻了一遍，像翻一本别人的书。"
    - "你站在人群里，人群不知道你在。"
    - "你想了一件事，那件事就发生了 —— 而且不是你做的。"
