    - "你的牙变得比昨天尖。"
    - "你在暗处看得比亮处清楚。"
    - "有人受伤了，你花了一点力气才没有走过去。"
    - "血的味道让你想起一种很久没吃的东西。"
    - "你数了数自己的心跳，它在按别人的节奏跳。"
    - "你在镜子里看见自己的眼睛变了一下颜色。"
    - "你终于停下来，因为再喝一口就回不去了。"
  arbiter:
    - "你听见自己在给一件小事定罪。"
    - "有人插队，你判了他三年。"
    - "你的话变成了规矩，谁不听就会痛。"
    - "你判了自己的罪，然后照做了。"
    - "契约在你手上有重量 —— 撕不掉的那种。"
