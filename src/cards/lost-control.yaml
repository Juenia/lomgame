  - "你避开镜子走了一整天。"
  - "你终于敢闭上眼睛，虽然梦里还有人在等你。"

# ============================================================================
# 堕落形态（M2.76）
#
# 失控不是「随机抽一句话」，而是**进入该途径特有的一个形态** —— 形态决定后果。
# 在这之前，HP / MAD / 持续天数是 NUMERIC.tick 里的三个全局常数，与途径无关。
#
# 每条途径**可以有任意多个形态**（加形态 = 往这里加一段，不改代码）：
#   min_seq  从哪一序列起可选（数字越小越高）；9 = 新号也能进
#   weight   同途径内的抽取权重（必须 > 0）
#   hp_loss_min / hp_loss_max  闭区间（两个字段而不是元组：后者后台编辑不了）
#   mad_gain / cor_gain        定值
#
# 数值口径（对着途径的主题写，不是随手填的）：
#   · **精神型**（愚者 / 阅读者 / 不眠者）：HP 损失低、MAD 高 —— 失控伤的是脑子
#   · **肉体型**（战士 / 母亲）：HP 损失高、MAD 低 —— 失控伤的是身子
#   · **污染型**（完美者 / 水手）：COR 高于其它途径 —— 失控留下的是洗不掉的东西
#   · 高序列形态（min_seq 4—5）在同类里更重：越往上越压不住
#
# ⚠️ 全局缺省（NUMERIC.tick.lostControlHpMin/Max/Mad）仍然有效：
#    该途径没写形态、或当前序列够不着任何形态时，走的就是它。
# ============================================================================
