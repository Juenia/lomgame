# 原著依据：《诡秘之主》途径「命运之轮」序列 5「赢家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：能有限度地给予敌人厄运，让目标变得较为倒霉
id: seq52_monster
name: 让他倒霉
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:monster'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    他追了你三条街。
    你什么都没做 —— 你只是**看着他跑**。
    第四条街上他踩到了一块松动的石板。
    你听见了很响的一声。你没有回头。
  group: 那个人昨天追人追到一半摔了。
daily_limit: 1

options:
  - key: '1'
    label: 不回头，走掉
    effects: [ { dig: 5 } ]
    text: |
      你走了。身后那一声之后是骂声。
      **骂得很有力气** —— 说明人没事。
  - key: '2'
    label: 停下来听那一声
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你停下来。那声响很闷，像是什么东西磕在石头上。
      **然后是喘气** —— 喘了很久才起来。
  - key: '3'
    label: 回去看一眼
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你回去了。他坐在地上抱着脚。
      **而他抬头看的时候** —— 你已经转过身了。
