# 原著依据：《诡秘之主》途径「红祭司」序列 5「收割者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：精准：能让任何攻击精准命中预定位置，可精确操纵离开身体的火球火鸦，让一团巨大火球一分为百
id: seq52_hunter
name: 分成一百份
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    那颗火球有半个人那么大。
    你把它推出去了 —— **推出去的时候它散成了很多份**。
    很难数清有多少，但每一份都落在该落的地方。
    对面那个院子，一扇窗都没碎。
  group: 那座院子昨晚烧了一角，别的什么都没碰。
daily_limit: 1

options:
  - key: '1'
    label: 走过去看看院子里的人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走过去。院子里的人都趴在窗底下。
      **一个都没伤** —— 而他们的窗玻璃是热的。
  - key: '2'
    label: 再来一次，这次数清多少份
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你又推了一次。这次你数了：一百零七份。
      **而你自己都不知道为什么是这个数** —— 你只是想数。
  - key: '3'
    label: 把散出去的火收回来
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你伸手收。它们全都回来了，一片不少。
      **而回来的火是热的** —— 烫手，烫得你把袖子卷了起来。
