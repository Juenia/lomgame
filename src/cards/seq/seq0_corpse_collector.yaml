# 原著依据：《诡秘之主》途径「死神」序列 0「死神」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：死亡权柄：死亡升到概念领域 —— 生命会死，记忆会死，联系会死，事物存在的烙印也会死；哪怕非凡特性不灭，面对它也会短暂死亡
id: seq0_corpse_collector
name: 死亡本身
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:corpse_collector'
  min_seq: 0
  max_seq: 0
effects:
  - { cor: 6 }
  - { hp: 4 }
texts:
  priv: |
    你父亲死的那天，你在旁边。
    **他死的时候不只是人没了** —— 你发现你关于他的记忆也在淡。
    他坐过的那把椅子，别人搬走了，没有人觉得少了什么。
    你拼命想他的脸。想不起来了。
  group: 那家人把老人的东西全清了，说留着没用。
daily_limit: 1

options:
  - key: '1'
    label: 试着把那张脸想起来
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你想了整整一夜。
      **想到天亮的时候你想起了一道眉毛** —— 只有一道，另一边空着。
  - key: '2'
    label: 去把那把椅子找回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了旧货市场，找到了那把椅子。
      **椅背上有一道他刻的印子** —— 刻的是你的名字。
  - key: '3'
    label: 接受想不起来这件事
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你不再想了。你把它按下去，去干别的事。
      **而第二天你连自己想过这件事都不太确定** —— 那才是最干净的死法。
