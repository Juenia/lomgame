# 事件卡链（M2.87）—— **三级链的第三段（终点）**。
# 前置链：第一段设 `favor` → 第二段读它、设 `favor_repaid` → 本卡读 `favor_repaid`。
# 本卡**不再设新 flag** —— 链到此为止。
id: chain3_favor_repaid
name: 他留了一样东西
trigger:
  type: daily
  weight: 10
  cond:
    - 'flag:favor_repaid'
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    两清之后他再没出现过。
    半个月后你收到一个包裹，没有署名。
    **里面是一把钥匙**，很旧，配不上你见过的任何一把锁。
    你把它收进抽屉，和别的东西放在一起。
  group: 有人收到一个没有署名的包裹，里面是一把旧钥匙。
daily_limit: 1
