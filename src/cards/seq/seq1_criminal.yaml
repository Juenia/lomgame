# 原著依据：《诡秘之主》途径「深渊」序列 1「污秽君王」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握污秽、污染、腐蚀与火焰权柄；污秽之王：肮脏、罪恶、不干净事物的掌控者
id: seq1_criminal
name: 脏东西听你的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 1
  max_seq: 1
effects:
  - { cor: 5 }
  - { hp: 2 }
texts:
  priv: |
    你抬了抬手。
    **那条河里的东西都出来了** —— 烂的、锈的、沉的，所有脏的全浮上来。
    它们排成一排，等你说话。
    你说了一句什么，它们就散了，散回原来的地方。
  group: 那条河昨天清了一天，今天又浑了。
daily_limit: 1

options:
  - key: '1'
    label: 让它们散回去
    effects: [ { dig: 5 } ]
    text: |
      你说了一句。它们散了，散回原来的地方。
      **河面安静下来** —— 而水比刚才浑。
  - key: '2'
    label: 挑出其中最脏的一样留着
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你留了一样。它在你手里是软的。
      **而它一直在往你袖子里面钻** —— 你握紧了才停住。
  - key: '3'
    label: 让它们把河底的东西翻上来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      它们翻了。河底有一辆沉了很久的车。
      **车里还有东西** —— 你没有下去看，你只是记住了位置。
