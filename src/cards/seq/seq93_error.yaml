# 原著依据：《诡秘之主》途径「错误」序列 9「偷盗者」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：敏捷之手：提升手腕和指头的稳定性和灵活度
id: seq93_error
name: 手稳了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:error'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    你把那枚硬币立在桌上，用手指按着。
    **手一点都没抖。**
    你以前做不到这个 —— 你记得自己以前做不到。
    你把硬币翻过来，又立了一次。还是不抖。
  group: 有人在桌上立了一晚上的硬币。
daily_limit: 1

options:
  - key: '1'
    label: 把硬币收起来
    effects: [ { dig: 5 } ]
    text: |
      你把硬币收进兜里，出门了。
      **走在路上的时候你一直觉得有点不对** —— 而那点不对你没有细想。
  - key: '2'
    label: 再试一次，这次换左手
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你换了左手。还是稳。
      **而你记得自己以前右手都做不到** —— 这件事你比谁都清楚。
  - key: '3'
    label: 找个更难的东西试
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你拿了根针，立在桌上。针立住了。
      **而窗外没有风，屋里也没有** —— 它立得毫无道理。
