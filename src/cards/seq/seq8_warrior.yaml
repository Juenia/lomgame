# 原著依据：《诡秘之主》途径「黄昏巨人」序列 8「格斗家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：格斗方面的专家，能凭借身体减弱某些超自然力量带来的影响
id: seq8_warrior
name: 什么也没感觉到
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    对面那个人抬起手，念了一句什么。
    你等着 —— 什么都没发生。
    你回头看了一眼，身后几个人抱着头倒在地上。
    **只有你站着。而你没有做任何事。**
  group: 那条街上倒了几个人，只有一个是站着走开的。
daily_limit: 1

options:
  - key: '1'
    label: 回头看看倒下的人
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      身后几个人抱着头倒在地上，有人还在小声哼。
      **只有你站着。而你没有做任何事。**
  - key: '2'
    label: 走回去把他们扶起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你一个个把人扶到墙边。他们缓过来之后看你，眼神有点不一样。
      你没解释 —— **解释不通的事，解释只会让人更怕**。
  - key: '3'
    label: 让他再念一次
    effects: [ { dig: 6, hp: 2, mad: 2 } ]
    text: |
      第二遍。这次你感觉到了 —— **像有人隔着很厚的布推了你一下**。
      他念完自己也愣了，因为他看见你皱了一下眉。
