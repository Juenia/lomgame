# 原著依据：《诡秘之主》途径「白塔」序列 4「预言家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：开始掌握命运领域较高层次的知识，获得预言能力；可掌星界秘术
id: seq4_reader
name: 三种可能
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { mad: 2 }
texts:
  priv: |
    你坐下来，把三种可能看了一遍。
    第一种是你死，第二种是他死，第三种是你们都活着但别的东西死了。
    **第三种最不清楚**，但最可能是真的。
    你选了吗？没有。你只是知道了，然后接着过日子。
  group: 有人坐在窗前看了一下午，什么也没做。
daily_limit: 1

options:
  - key: '1'
    label: 什么都不做，接着过日子
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你接着过日子。那三种可能还在。
      **而它们每天都在变** —— 只有第三种一直没变。
  - key: '2'
    label: 把第三种写在纸上
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你写了。写完发现纸上只有两个字。
      **是那个「别的东西」的名字** —— 而那个名字你认识。
  - key: '3'
    label: 想办法让第一种不发生
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你动了一点。第一种可能没了。
      **而第二种变得很清楚** —— 清楚到你能看见日期。
