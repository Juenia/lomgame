# 原著依据：《诡秘之主》途径「母亲」序列 7「丰收祭司」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：促进生物繁衍和生长；双手按地可让约三十米内的种子植物快不少地生长
id: seq7_mother
name: 邻居在数日子
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 2 }
  - { dig: 1 }
texts:
  priv: |
    你把手按在地上，按了一会儿。
    三天之后，那块地的苗比旁边高出一截。
    **你没有做别的。**
    而隔壁那块地的主人，这两天总往你这边看。
  group: 那块地的收成好得不像话，而主人不肯说用了什么。
daily_limit: 1

options:
  - key: '1'
    label: 第二天再按一次
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      苗又高了一截。
      而隔壁那块地的主人 —— **开始拿绳子量你家的地界**。
  - key: '2'
    label: 停下来，让苗自己长
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你不再按了。苗长到了自然的高度。
      **比隔壁高一点，但不算离谱** —— 这大概是最不容易惹事的那个高度。
  - key: '3'
    label: 拎点种子去找邻居聊聊
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他接了那半袋种子。
      **但没让你进门** —— 他站在门口跟你说了三句话，都是天气。
