# 原著依据：《诡秘之主》途径「审判者」序列 9「仲裁人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：魅力与权威还会让与仲裁人发生冲突的生物不自觉想要屈服
id: seq92_arbiter
name: 他自己退开了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    那个人冲过来的时候，你没有躲。
    你只是站在那里看着他。
    **他停了。** 在自己都没反应过来的时候停的。
    然后他往后退了半步 —— 那半步不是他要退的。
  group: 那条街上的争执散了，没有人动手。
daily_limit: 1

options:
  - key: '1'
    label: 让他走
    effects: [ { dig: 4 } ]
    text: |
      你侧身让开了路。他快步走了。
      **走出十几步之后他回头看了一眼** —— 然后走得更快了。
  - key: '2'
    label: 问他刚才为什么要退
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他答不上来。
      **他一直在看自己的脚** —— 那半步像是被人替他迈的。
  - key: '3'
    label: 让他再退半步
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你让他又退了半步。
      **他后退的时候在看你的眼睛** —— 而他在哭。
