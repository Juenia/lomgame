# 原著依据：《诡秘之主》途径「被缚者」序列 4「木偶」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能操纵一定范围内全部无生命物品；能变成秘术木偶、神奇纸人等物品
id: seq4_prisoner
name: 整条街的东西都动了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 4 }
  - { dig: 2 }
texts:
  priv: |
    围你的人有五个。
    你抬起手，往下一按。
    **整条街的东西都动了** —— 桌椅、木箱、铁皮桶，还有他们手里的刀。
    刀自己转了向。你走过去的时候，他们全都松了手。
  group: 那条街上的东西昨晚全倒了，倒得很整齐。
daily_limit: 1

options:
  - key: '1'
    label: 走过去，什么都不做
    effects: [ { dig: 5 } ]
    text: |
      你走过去。他们全都松了手。
      **刀落在地上** —— 而他们看着自己的手，像是不认识。
  - key: '2'
    label: 让那些东西归位
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你抬手。桌椅、木箱、铁皮桶全都回了原位。
      **刀留在地上** —— 你没有让它们回去。
  - key: '3'
    label: 再按一次，这次对着人
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又按了一次。那五个人都跪了下去。
      **而他们手里已经没有东西了** —— 他们只是跪着。
