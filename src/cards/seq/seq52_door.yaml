# 原著依据：《诡秘之主》途径「门」序列 5「旅行家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：闪现：相当于短距离旅行，于短距离内不断闪现，一个人制造出围攻的效果
id: seq52_door
name: 一个人围住一群人
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:door'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { dig: 2 }
texts:
  priv: |
    他们五个围成一个圈。
    你先是在圈外，然后在他们背后，然后又回到圈里。
    **每一次都只有一瞬间。**
    等他们乱起来的时候，你已经在街对面了。
  group: 那五个人昨天在巷子里转了半宿，说被围住了。
daily_limit: 1

options:
  - key: '1'
    label: 走到街对面站着
    effects: [ { dig: 5 } ]
    text: |
      你走到街对面站着看。他们五个还在圈里打转。
      **打了一会儿才有人发现你要找的人不在里面** —— 而你已经在对面了。
  - key: '2'
    label: 回头看看他们还在不在原处
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。他们还在转。
      **五个人围着一个空的圈** —— 而中间什么都没有。
  - key: '3'
    label: 再围一次，这次不出声
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又围了一次。这次他们连脚步声都听不见。
      **只有一个人忽然停下来** —— 他往你这边看，看了很久。
