# 原著依据：《诡秘之主》途径「审判者」序列 7「审讯者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可在手上召唤出烙铁等虚幻刑具，直接对灵体造成伤害；精神刺穿
id: seq7_arbiter
name: 他看不见它
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    你把手伸过去，掌心里多了样东西 —— 烧红的，但不烫你。
    对面那个人看不见它。
    他只是开始发抖，抖得椅子腿在地上响。
    **你还没问第一个问题。**
  group: 审讯室里的椅子一直在响，而里面只有一个坐着的人。
daily_limit: 1

options:
  - key: '1'
    label: 把手收回来，先不问
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把东西收了。他的抖停了。
      **他知道你收了什么** —— 只是看不见。所以他比刚才更怕。
  - key: '2'
    label: 问第一个问题
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你问了。他答得很快，快到不像想过的。
      **而答的不是你问的那件事** —— 他答的是他一直在想的那件。
  - key: '3'
    label: 把它举到他能看见的地方
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把它举到他眼前，松了手。他看见了。
      **然后他开始喊** —— 喊到嗓子哑，而没有人进来。
