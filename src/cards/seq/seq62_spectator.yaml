# 原著依据：《诡秘之主》途径「空想家」序列 6「催眠师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：心理学隐身：利用心理盲点躲藏于暗中，让自身处于意识死角，达成就在面前却看不到的效果
id: seq62_spectator
name: 意识死角
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:spectator'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    他们进屋搜了一遍。
    **你就在门后面站着。**
    带头那个人往门后看了一眼 —— 看过去了。
    他们走了。你把门掩上，等了两分钟才动。
  group: 那间屋子被搜了三遍，什么都没找到。
daily_limit: 1

options:
  - key: '1'
    label: 等两分钟再动
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你等了两分钟才动。外面的脚步声已经远了。
      **而你手心全是汗** —— 你在裤子上擦了两下。
  - key: '2'
    label: 从门后走出来，看看屋里
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走出来看。屋里被翻得很整齐。
      **他们连抽屉都合上了** —— 一个都没留缝。
  - key: '3'
    label: 跟出去看他们搜哪
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你跟出去了。他们去了隔壁。
      **而隔壁住的是你认识的人** —— 你昨天还跟他喝过茶。
