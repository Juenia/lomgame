# 原著依据：《诡秘之主》途径「魔女」序列 8「教唆者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有对别人情绪、欲望和恶念的感知能力，提升了思考和分析能力
id: seq82_assassin
name: 他在怕什么
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    你和他隔着一张桌子坐着。
    你什么都没问，只是看着他。
    **你看见了** —— 他怕的那个东西在他左边，而他一直往右靠。
    你端起杯子喝了一口。你现在知道该说什么了。
  group: 那个人昨天在酒馆里说了一件他从来不说的事。
daily_limit: 1

options:
  - key: '1'
    label: 站起来，坐到他的左边去
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你换了位子，坐到他左边。
      **他一直往右靠** —— 靠到椅背上，退无可退。而他没有站起来。
  - key: '2'
    label: 什么都不说，把那杯茶喝完
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你喝完茶就走了。他一直在原地坐着。
      **而你记住了他怕的那一边** —— 下次不用再看不就知道了。
  - key: '3'
    label: 把那个东西是什么说出来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。他猛地站起来，撞翻了椅子。
      **而他没有否认** —— 他只是站在那儿，看着自己左边的空气。
