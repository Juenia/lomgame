# 原著依据：《诡秘之主》途径「暴君」序列 5「海洋歌者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：能制造出润滑的效果
id: seq52_sailor
name: 滑得抓不住
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sailor'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    有人从后面抱住了你。
    **他滑了。** 不是你没站稳 —— 是他抱不住。
    他自己也愣了一下。
    你往前走两步，把他带得踉跄。
  group: 码头上那个人说抱了三次都没抱住。
daily_limit: 1

options:
  - key: '1'
    label: 走过去把他扶起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把他扶起来。他一直在看自己的手。
      **手心里全是汗** —— 而他明明什么都没抓过。
  - key: '2'
    label: 问他要不要再来一次
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      他试了。这次他抱住了三秒。
      **三秒之后又滑了** —— 而他这次连自己滑了都没察觉。
  - key: '3'
    label: 走开，不说话
    effects: [ { dig: 5 } ]
    text: |
      你走开了。身后他又试了一次。
      **而你听见他骂了一声** —— 骂得很短。
