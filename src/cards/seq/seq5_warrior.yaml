# 原著依据：《诡秘之主》途径「黄昏巨人」序列 5「守护者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：很少会受到伤害；单膝跪地将巨剑插在身前，浮现晨曦光芒竖起无形墙壁，可为同伴承担伤害
id: seq5_warrior
name: 身后一个都没倒
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 4 }
  - { dig: 1 }
texts:
  priv: |
    你单膝跪下，把剑插进地里。
    **光亮起来了** —— 从剑上，往上漫。
    左边的墙看不见，但你摸得到。
    那一下之后，你身后的人一个都没倒。你自己吐了口血。
  group: 那条巷子里有人跪着，身后站着几个好好的人。
daily_limit: 1

options:
  - key: '1'
    label: 把剑拔起来，站起来
    effects: [ { dig: 3, hp: 2 } ]
    text: |
      你站起来，把剑从地里拔出来。墙散了。
      身后的人一个都没倒 —— **你自己吐了口血**，吐在鞋面上。
  - key: '2'
    label: 跪着多撑一会儿
    effects: [ { dig: 6, hp: 4, mad: 2 } ]
    text: |
      你又撑了一段时间。看得见的边缘开始裂，像冰。
      松开的时候你的膝盖**已经不听使唤了**。
  - key: '3'
    label: 回头看清身后是谁
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你回头看了一眼。有四个人 —— **你只认识其中一个**。
      那个不认识你的，正在看你插在地上的剑。
