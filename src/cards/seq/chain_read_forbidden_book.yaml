# 事件卡链（M2.87）—— **后续卡**：只有触发过前置卡的人才抽得到。
# 前置：daily_019 第三排架子后面（设 flag `read_forbidden_book`）
# 判据：`cond: flag:read_forbidden_book`。
#
# ⚠️ 这一类此前**一条都没有**：全库 29 张卡设了 flag，而要求 flag 的卡是 **0 张** ——
#    flag 设了就再没有人读，等于写了一半的链。这张是它的后半段。
id: chain_read_forbidden_book
name: 记的不一样
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:read_forbidden_book'
effects:
  - { dig: 4 }
  - { mad: 2 }
texts:
  priv: |
    你还记得那本书里的一段。
    你今天跟人提起来，他说**书里不是那么写的**。
    你们翻回去看 —— 他记的对。
    但你还记得你读过的那一段。
  group: 有人为了一段书上的话跟人争了很久。
daily_limit: 1
