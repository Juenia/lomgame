# 原著依据：《诡秘之主》途径「错误」序列 8「诈骗师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：质变的卓越观察；较强的魅力；口才；思维误导
id: seq8_error
name: 我自己差点信了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    你对那个人说了个谎 —— 编得很顺，你自己都听不出破绽。
    他信了。点头，走了。
    你站在原地把刚才那段话又过了一遍。
    **过到第三遍的时候，你发现自己有点记不清哪句是真的了。**
  group: 有人说完一段话之后，自己站在原地发了很久的呆。
daily_limit: 1

options:
  - key: '1'
    label: 站着把那段话再过一遍
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你过了第三遍。哪句是真的，你说不清了。
      **而你记得自己本来是知道的** —— 就在他走之前。
  - key: '2'
    label: 追上去告诉他那是假的
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你追上去了。他听完愣了一下。
      **然后说「我知道」** —— 说完就走了，走得比刚才快。
  - key: '3'
    label: 把那段话写下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你写下来了。写到一半停了。
      **后面那几句你想不起来自己有没有说过** —— 而纸上是有的。
