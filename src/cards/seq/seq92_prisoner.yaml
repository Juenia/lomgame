# 原著依据：《诡秘之主》途径「被缚者」序列 9「囚犯」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握诸多犯罪技巧，比如用铁丝开锁、用汤勺挖地道，擅长用随手得到的任何物品杀人
id: seq92_prisoner
name: 铁丝
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:prisoner'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    门上那把锁很旧了，但装得很正。
    你从地上捡了根铁丝，弯了两下。
    **锁开了。** 你推门进去，把门带上。
    出来的时候你把铁丝插回了原来的地方。
  group: 那扇门昨晚开了又关，锁是好的。
daily_limit: 1

options:
  - key: '1'
    label: 进去看看里面有什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走进去。屋里很干净，什么都没有。
      **只有墙上留着一道铅笔线** —— 画到一半就断了。
  - key: '2'
    label: 把铁丝留在这儿，不带回去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把铁丝插回了原来的地方。
      **第二天你路过那扇门** —— 铁丝还在，而门开着一条缝。
  - key: '3'
    label: 再来一次，这次不进去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又开了锁，站在门口没进去。
      **里面的空气是往外走的** —— 而屋里没有窗。
