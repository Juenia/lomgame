# 原著依据：《诡秘之主》途径「错误」序列 7「解密学者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：卓越观察也额外有了对细微线索、蛛丝马迹的观察
id: seq72_error
name: 撕口
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:error'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
texts:
  priv: |
    你翻到那页的时候先看见的是纸边。
    撕口不齐 —— 中间有一处往回卷了一下。
    **那说明撕的人当时手在抖。**
    你把书合上，记住了那一页的页码：一百零三。
  group: 旧书铺里有人翻了一本书，只看了一眼纸边就走了。
daily_limit: 1

options:
  - key: '1'
    label: 记下页码，把书放回去
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把书合上放回原处。
      **走出书铺之后你才发现自己一直在数** —— 数到一百零三就停了。
  - key: '2'
    label: 去查这一百零三页写的是什么
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你回去找那本书。**书架那一格是空的** —— 老板说那本书从来没有人借过。
  - key: '3'
    label: 问老板这本书是谁送来的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说是个女人，半年前。**他还记得她的手套是湿的** —— 而那天下了一整天的雨。
