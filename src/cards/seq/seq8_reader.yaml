# 原著依据：《诡秘之主》途径「白塔」序列 8「推理学员」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：观察力提升，逻辑思维能力提升，仪式魔法的专家
id: seq8_reader
name: 从窗户进来的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
texts:
  priv: |
    屋里被翻得很乱，门是从外面锁的。
    你在门口站了两分钟，没有进去。
    「从窗户，」你说，「而且他不高。」
    他们把窗户打开 —— 窗台下有一小撮被蹭掉的灰。
  group: 有人在门口站了两分钟，说出了小偷的身高。
daily_limit: 1

options:
  - key: '1'
    label: 站在门口再看一遍
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你又站了两分钟。这次你看见了别的。
      **他进来之前在窗上敲了三下** —— 敲得很轻，像在跟谁打招呼。
  - key: '2'
    label: 告诉他们他是怎么进来的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你说了。他们把窗台量了一遍。
      **而量出来的高度对不上** —— 差了两寸，正好是一双鞋的厚度。
  - key: '3'
    label: 自己从窗户翻进去
    effects: [ { dig: 7, hp: 2, cor: 3, mad: 3 } ]
    text: |
      你翻进去了。落地的时候你的膝盖弯了。
      **而那个人的脚印显示他没有弯** —— 他是直接站住的。
