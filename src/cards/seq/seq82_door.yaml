# 原著依据：《诡秘之主》途径「门」序列 8「戏法大师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：黑幕：如同魔术师，凭空创造一片无光的幕布用来隐藏事物
id: seq82_door
name: 没有光的地方
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:door'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    那间屋子只有一扇门。
    你走进去，抬手一挥。
    **黑了下来** —— 不是关灯那种黑，是连边缘都看不见的黑。
    你在黑里把东西收好，收了幕走了。
  group: 那间屋里昨晚黑了一阵，里面的人说什么也看不见。
daily_limit: 1

options:
  - key: '1'
    label: 在黑里站一会儿
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你站着没动。黑里有一种声音。
      **很轻，像是有人在很远的地方翻书** —— 而这里没有书。
  - key: '2'
    label: 把黑收走，看看屋里的人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你收了。屋里亮起来。那几个人还站在原地。
      **而他们看的是同一个方向** —— 那里什么都没有。
  - key: '3'
    label: 什么都不做，直接走
    effects: [ { dig: 5 } ]
    text: |
      你就这么走了。身后那句「看不见」你听得很清楚。
      **而你已经在门外了** —— 门外是白天。
