# 原著依据：《诡秘之主》途径「被缚者」序列 6「活尸」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：动作迅捷，全速奔跑时速度比处于最高峰的蒸汽列车还快
id: seq62_prisoner
name: 比蒸汽列车快
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:prisoner'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    你追那辆马车追了两条街。
    车夫回头看了一眼，然后开始抽马。
    **你还是追上了。** 你伸手抓住车辕的时候，轮子还在转。
    车夫把缰绳扔了。
  group: 昨天有辆马车在街上狂奔，最后自己停下的。
daily_limit: 1

options:
  - key: '1'
    label: 松手，让他走
    effects: [ { dig: 5 } ]
    text: |
      你松了手。马车跑出去一段才慢下来。
      **车夫一直没有回头** —— 而他的手一直在抖。
  - key: '2'
    label: 问车夫在跑什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他答不上来。
      **他说后面有人追** —— 而后面的街上什么都没有。
  - key: '3'
    label: 低头看看自己的腿
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你低头看。裤腿上全是泥。
      **而这两条街都是石板路** —— 你刚才跑过的地方没有一块泥。
