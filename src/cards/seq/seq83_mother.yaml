# 原著依据：《诡秘之主》途径「母亲」序列 8「医师」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：缝合灵魂：可以治疗灵魂创伤；理论上也可以切割灵魂
id: seq83_mother
name: 缝起来
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
  - { mp: 2 }
texts:
  priv: |
    那个人坐在那儿，一动不动，眼睛是空的。
    「你放轻松，」你说。
    **他松下来了。** 你在那个层面上做了两个钟头的手术。
    做完他抬头看你，问：「刚才怎么了？」
  group: 那个呆坐了两天的人，昨天忽然说话了。
daily_limit: 1

options:
  - key: '1'
    label: 告诉他刚才什么都没发生
    effects: [ { dig: 4 } ]
    text: |
      你说：「你打了个盹。」
      他信了，站起来活动了一下肩膀 —— **动作比两天前顺得多**。
  - key: '2'
    label: 让他再坐一会儿，把里面的东西看全
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      他又坐了两个钟头。
      第二个钟头里他自己说了三句话 —— **而他完全不记得自己说过**。
  - key: '3'
    label: 问他这两天看见了什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说他一直在一个很亮的地方坐着，不冷也不渴。
      **而那个地方，你刚才去过。**
