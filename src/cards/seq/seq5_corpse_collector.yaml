# 原著依据：《诡秘之主》途径「死神」序列 5「看门人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可感应冥界入口，将烙印固化在掌心，关键时刻召唤出来将目标吸入门后
id: seq5_corpse_collector
name: 掌心的烙印
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    你把手掌摊开。
    **掌心那个烙印是热的。**
    对面的东西扑过来的时候，你把手往前一送 —— 它不见了。
    你把手收回来，握了握。烙印还在，比刚才淡了一点。
  group: 有人说那间屋子里原本有东西，后来没了。
daily_limit: 1

options:
  - key: '1'
    label: 摊开手，看看烙印还剩多少
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你摊开手。烙印淡了。
      **但形状变了** —— 像一个字的偏旁，而你不认得那个字。
  - key: '2'
    label: 再收一个东西进去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又把手伸出去。这次收进来的东西比上次大。
      **烙印一下深了很多** —— 深到你能看见它在你皮肤底下动。
  - key: '3'
    label: 把这件事记下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记下了：一次淡化多少、形状变成什么样。
      **写到最后你发现它在往下走** —— 从掌心往手腕，一天半寸。
