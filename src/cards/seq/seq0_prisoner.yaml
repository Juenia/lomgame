# 原著依据：《诡秘之主》途径「被缚者」序列 0「被缚者」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：权柄集中在诅咒、束缚（节制）、异类和物品；能在序列 0 层次初步涉及象征应用，能完成所有类型的诅咒
id: seq0_prisoner
name: 所有的诅咒
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:prisoner'
  min_seq: 0
  max_seq: 0
effects:
  - { cor: 6 }
  - { hp: 4 }
texts:
  priv: |
    那个人的名字你没有说出口，只在心里过了一遍。
    **然后他就开始不顺了。** 先是生意，然后是家里，然后是身体。
    你没有做任何仪式，也没有用任何东西。
    你只是记住了他的名字。
  group: 那家人这两年一直在出事，找了好几个神父。
daily_limit: 1

options:
  - key: '1'
    label: 试着把那个名字忘掉
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你试着忘。忘到第三天的时候你想起了另一个名字。
      **而那个人你也认识** —— 你赶紧把思绪掐断了。
  - key: '2'
    label: 再把那个名字想一遍
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又想了一遍。这次是他儿子开始不顺。
      **而他儿子今年八岁** —— 你昨天还在街上见过他。
  - key: '3'
    label: 去他家门口站一会儿
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你去了。他家门口挂着一串新符。
      **而符是从里往外挂的** —— 挂符的人知道自己在防什么。
