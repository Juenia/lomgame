# 原著依据：《诡秘之主》途径「黄昏巨人」序列 3「银骑士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：守护力量实质化成银色全身盔甲；水银化：整个人融化成一滩流淌的银色金属液体，可飞快移动
id: seq3_warrior
name: 一滩银色的东西
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 5 }
  - { dig: 1 }
texts:
  priv: |
    刀砍在盔甲上，声音很脆。
    你没有还手 —— 你**化了**。
    整个人成一滩银色的东西，贴着地面滑出去十几米。
    重新站起来的时候，对面那个人的刀还举着，人已经找不到你了。
  group: 那条巷子的地面上有一道银色的印子，洗不掉。
daily_limit: 1

options:
  - key: '1'
    label: 站起来，把盔甲收回去
    effects: [ { dig: 3 } ]
    text: |
      银色退下去的时候像水被吸回布里。
      你活动了一下肩膀 —— **没有一处疼**，这才是最不习惯的。
  - key: '2'
    label: 贴着地再滑一段，试试能多远
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      你滑过整条巷子，在墙上撞了一下才停。
      撞那一下不疼，但**你知道了刹车在哪**。
  - key: '3'
    label: 把那道银印留着
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你没擦。第二天那道印子还在，水冲不掉。
      路过的人绕着它走 —— **没人问那是什么**。
