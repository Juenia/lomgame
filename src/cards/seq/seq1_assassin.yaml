# 原著依据：《诡秘之主》途径「魔女」序列 1「末日」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：末日权柄：可在指定区域内带来完整的末日，让包括命运在内的万事万物纠缠终结，是矛盾的总爆发
id: seq1_assassin
name: 完整的末日
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 1
  max_seq: 1
effects:
  - { cor: 5 }
  - { mad: 3 }
texts:
  priv: |
    你指定了那片区域。
    **里面所有的事一起结束了** —— 不打不相干的，不认识的，连一棵树上的两片叶子。
    没有火，没有声音。就是都结束了。
    你在外面站着，看了一会儿，转身走了。
  group: 那个镇子一夜之间没了，没有人知道为什么。
daily_limit: 1

options:
  - key: '1'
    label: 不回头，走开
    effects: [ { dig: 5 } ]
    text: |
      你转身走了。走了很久都没有回头。
      **而身后那片安静一直跟着你** —— 直到你过了两个路口才听见鸟叫。
  - key: '2'
    label: 回去看看还剩什么
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你走回去了。什么都没有，连地基都不平。
      **像那块地方从来没被用过** —— 而昨天那里有一条街。
  - key: '3'
    label: 在边上站着，多看一会儿
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你站了很久。天黑了又亮。
      **而那块地方一直空着** —— 连草都不长。
