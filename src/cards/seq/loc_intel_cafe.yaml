# 地点专属（M2.87）。地点：「情报咖啡馆」（intel_cafe，危险度 2）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_intel_cafe
name: 最里面那个位子
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:情报咖啡馆'
effects:
  - { dig: 4 }
  - { cor: 1 }
texts:
  priv: |
    老板把你引到最里面那个位子。
    「有人想认识你，」他说，「但他不在这儿。」
    **桌上放着一张纸**，上面写着一个时间，一个地点。
    你把纸收起来。老板已经回吧台了。
  group: 情报咖啡馆最里面那个位子，昨天有人坐了一下午。
daily_limit: 1

options:
  - key: '1'
    label: 按纸上那个时间地点去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你去了。那地方是一间关着门的仓库。
      **而门是虚掩的** —— 你推门的时候，里面有人说了一句「来了」。
  - key: '2'
    label: 问老板是谁想认识你
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他摇头，说不知道。
      **而他说这话的时候** —— 他一直在擦同一个杯子。
  - key: '3'
    label: 把纸留下，坐一会儿再走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把纸推回桌上，坐了一刻钟。
      **走的时候纸还在那儿** —— 而你走后再看，纸上多了一行字。
