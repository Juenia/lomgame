# 原著依据：《诡秘之主》途径「命运之轮」序列 8「机器」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有恐怖的计算能力和精准的控制力，成为格斗、射击等领域的天赋者
id: seq82_monster
name: 算得出来
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:monster'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你把那枚硬币抛起来的时候，已经在算了。
    **风速、距离、它落下来会弹几下。**
    你伸手接住，看都没看。
    对面那个人把同样的硬币抛了三次，掉了三次。
  group: 有人在桌上抛硬币，接了十次没掉过一次。
daily_limit: 1

options:
  - key: '1'
    label: 让他再抛一次
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他又抛了一次。这次接住了。
      **而他接的时候手是抖的** —— 接住之后他看了你一眼。
  - key: '2'
    label: 把风速也算进去，再抛一次
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你又抛了一次，这次把风也算进去了。
      **它落在你手心里弹了两下** —— 和你算的一模一样。
  - key: '3'
    label: 告诉他是怎么算的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你说了。他听完试了一遍。
      **第一次就接住了** —— 而他自己都不敢信。
