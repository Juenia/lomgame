# 原著依据：《诡秘之主》途径「错误」序列 5「窃梦者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：窃取来的能力可用半小时，若不使用可保存一周；伪装（盗天机）可伪装成其他神灵的信徒窃取回应制作符咒
id: seq52_error
name: 存一个星期
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:error'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    你从他那拿了一样东西 —— 不是实物，是那个能力。
    **你没有立刻用。** 你把它放着。
    第三天你才动它。用得很顺手。
    用完就没了。你再看他，他已经不会了。
  group: 那个人昨天还在用的本事，今天一点也使不出来。
daily_limit: 1

options:
  - key: '1'
    label: 把它们都用在自己身上
    effects: [ { dig: 6, hp: 2, cor: 2 } ]
    text: |
      你用了。身体比平时轻。
      **而他的脸色一天比一天差** —— 他不知道自己少了什么，只觉得累。
  - key: '2'
    label: 还给他
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你还回去了。他当场就能使出来了。
      **而他不记得自己丢过** —— 他甚至谢谢你来看他。
  - key: '3'
    label: 再拿一样
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又拿了一样，这次是记忆。
      **他第二天不认识自己的儿子** —— 而那孩子一直在门口等他叫名字。
