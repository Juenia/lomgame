# 原著依据：《诡秘之主》途径「黑暗」序列 8「午夜诗人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：擅长用不同风格的诗篇对周围的生灵造成不同的影响，让敌人精神恍惚、让队友安静、让目标恐惧
id: seq82_sleepless
name: 念一段
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sleepless'
  min_seq: 8
  max_seq: 8
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    门口那两个人堵着，一个拿着棍。
    你靠着墙，念了一段。
    **很短，四句。**
    念到第三句的时候，拿棍那个的手开始抖了。
  group: 那两个人昨天在门口站了很久，后来自己走了。
daily_limit: 1

options:
  - key: '1'
    label: 把最后一句念完
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你念完了。拿棍那个人把棍扔了。
      **而另一个人一直在哭** —— 蹲在地上哭。
  - key: '2'
    label: 问他们为什么堵门
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他们说有人让他们来的。
      **而那个人他们从来没见过** —— 只记得他给了钱。
  - key: '3'
    label: 再念一段，这次换一段
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你换了另一段。这次两个人一起跪下了。
      **而街上路过的人什么都没看见** —— 他们绕着走过去了。
