# 原著依据：《诡秘之主》途径「倒吊人」序列 9「秘祈人」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：或多或少都会出现认知、观点上的扭曲，且容易失控
id: seq93_secrets_supplicant
name: 观点变了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 9
  max_seq: 9
effects:
  - { cor: 3 }
  - { mad: 2 }
texts:
  priv: |
    你以前觉得那件事是不对的。
    今天你又说了一遍那件事，说的时候没有停。
    **说完了你才想起来：以前我不是这么想的。**
    你想了想以前是怎么想的。想不起来了。
  group: 那个人最近说话的方式变了，熟人都有点不习惯。
daily_limit: 1

options:
  - key: '1'
    label: 努力想以前是怎么想的
    effects: [ { dig: 6, cor: 2, mad: 4 } ]
    text: |
      你想了很久。想不起来。
      **而你记得自己以前是能想起来的** —— 那件事你以前天天想。
  - key: '2'
    label: 找个人问问自己以前什么样
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了。他说你以前不这么说话。
      **而他没说哪里不一样** —— 他说不上来。
  - key: '3'
    label: 再说一遍那件事
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又说了。这次连停都没停。
      **说完你甚至觉得这话本来就该这么说** —— 而昨天你还不是这个想法。
