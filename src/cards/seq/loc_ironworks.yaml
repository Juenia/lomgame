# 地点专属（M2.87）。地点：「铁工厂」（ironworks，危险度 3）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_ironworks
name: 炉子里的手
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:铁工厂'
effects:
  - { hp: -2 }
  - { dig: 2 }
texts:
  priv: |
    你在炉子边上干活，热气烤得脸疼。
    有东西从炉口伸出来 —— 你看清了，**是一只手**。
    你退了两步，撞到了后面的人。
    「怎么了？」他问。你再看，炉子里只有火。
  group: 铁工厂有个工人昨天在炉子边上摔了一跤，说什么也不肯再靠近。
daily_limit: 1

options:
  - key: '1'
    label: 再往炉口看一眼
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你又看了一眼。炉子里只有火。
      **而炉口的铁沿上有一道印** —— 五个指头，按进去的。
  - key: '2'
    label: 拉住那个摔跤的工人问
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他什么也不肯说。
      **而他一直不往炉子那边看** —— 他看的是门。
  - key: '3'
    label: 把炉子熄了，等它凉
    effects: [ { dig: 7, hp: 2, cor: 3, mad: 3 } ]
    text: |
      你把火熄了，守在那儿等。等了一个钟头。
      **炉膛里凉透了之后** —— 那只手还在，是铁的。
