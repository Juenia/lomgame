# 事件卡链（M2.87）—— **链的第二段**（三级链的中间那一环）。
# 前置：设 flag `owes_favor` 的那张卡
# 自身：要 `flag:owes_favor`，并**设出** `favor_repaid`（供第三段读）
id: chain2_owes_favor
name: 还了
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:owes_favor'
effects:
  - { dig: 3 }
  - { hp: -2 }
  - { flag: favor_repaid }
texts:
  priv: |
    那件事你办完了 —— 办得不轻松。
    他去看了看，回来点了头。
    **「两清了，」** 他说。
    你说好。他走的时候没有回头，你也没有。
  group: 有人办完一件事之后，那个人就再没出现过。
daily_limit: 1
