# 原著依据：《诡秘之主》途径「太阳」序列 3「正义导师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：形成符合太阳途径的正义准则，获得一定的契约与秩序权柄
id: seq3_sun
name: 我说了算
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 3 }
  - { mp: 3 }
texts:
  priv: |
    两边都在说他有理。
    你听完了，说了一句：「**按这个来。**」
    两边都安静了。有一个人想说什么，张了张嘴，没说。
    **因为他们都知道，你说的那个就是规矩。**
  group: 那桩纠纷昨天结了，两边都没再闹。
daily_limit: 1

options:
  - key: '1'
    label: 看那个想说话的人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看他。他把话咽了回去。
      **而他的手一直在捏自己的衣角** —— 捏了很久。
  - key: '2'
    label: 再定一条规矩
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又定了一条。两边都没有异议。
      **连问都没人问** —— 他们只是点头。
  - key: '3'
    label: 问他们原来打算怎么办
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。两边说的完全不一样。
      **差得像两件事** —— 而他们说的是同一件事。
