# 原著依据：《诡秘之主》途径「死神」序列 7「通灵者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：灵感极强，闭着眼也能感应到周围隐藏的灵；能与自然灵和亡魂沟通
id: seq7_corpse_collector
name: 七个
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { mad: 2 }
texts:
  priv: |
    你在这间屋子里闭上眼。
    **七个。** 靠窗两个，壁炉边一个，角落里四个。
    而这屋里活着的人，你数过，是五个。
    你睁开眼，什么都没说，找了个空位坐下 —— 挑了个没人坐的地方。
  group: 那间屋子挤得站不下人，而有人坚持说还有空位。
daily_limit: 1

options:
  - key: '1'
    label: 挑个没人坐的地方坐下
    effects: [ { dig: 5 } ]
    text: |
      你挑了个角落里的空位坐下。
      **旁边那四个让了让** —— 屋里活着的人什么也没看见。
  - key: '2'
    label: 看看那七个在做什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你闭眼又看了一眼。靠窗那两个在往外看。
      **一直在看同一条街** —— 从你进门到现在，一眼都没挪。
  - key: '3'
    label: 对其中一个说句话
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你对角落里那四个中的一个说了句话。
      **屋里活着的人全看向了你** —— 他们听见的是你在自言自语。
