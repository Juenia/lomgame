# 原著依据：《诡秘之主》途径「空想家」序列 0「空想家」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：空想权柄（幻想成真）：所想象的物品必将具现，所幻想的国度必将降临，所宣称的未来必将上演成为现实
id: seq0_spectator
name: 所宣称的未来必将上演
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:spectator'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 7 }
  - { cor: 4 }
texts:
  priv: |
    有个人在街上大声说了一句话。
    **说的是明年会发生什么。** 他说得很详细，连日子都有。
    听的人都笑他。
    第二年，一件一件地发生了。他那时候已经不在了。
  group: 去年有人在街上说过今年的事，说过的人都记得。
daily_limit: 1

options:
  - key: '1'
    label: 把他说的话记下来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你记了。第二年一件一件对上了。
      **而你记的那张纸上的日子比他还准** —— 准到你自己都不敢再看。
  - key: '2'
    label: 自己也站上台阶说一句
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你说了。听的人都笑。
      **而你在笑的人里看见了你自己** —— 站在最外面，也在笑。
  - key: '3'
    label: 什么都不做，走开
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走了。身后他还在说。
      **而他说的第二句你以前听过** —— 在上一个说这话的人嘴里。
