# 原著依据：《诡秘之主》途径「审判者」序列 7「审讯者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可在手上召唤出烙铁等虚幻刑具，可直接对灵体造成伤害，需有接触
id: seq72_arbiter
name: 烙铁
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    那东西没有身体，飘在半人高的地方。
    你把手伸过去。
    **掌心里多了一块红的。** 它不知道那是什么。
    你按上去的时候，它发出了一声很像人的声音。
  group: 那间屋子里昨晚有东西叫过，很短。
daily_limit: 1

options:
  - key: '1'
    label: 把手收回来
    effects: [ { dig: 4 } ]
    text: |
      你把手背到身后。它还飘在那里，慢慢散开。
      **那声叫的尾音还在屋里** —— 你听了很久。
  - key: '2'
    label: 再按一次，问它一句
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又按了一次。这次它回答了一个字。
      **那个字你听过** —— 但想不起来在哪听过，越想越想不起来。
  - key: '3'
    label: 摊开手看看那块红还在不在
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你摊开手。红的还在，而且比刚才亮一点。
      **像是它在你手心里养着** —— 你把手合上了。
