# 地点专属（M2.87）。地点：「东区贫民窟」（backlund_slum，危险度 3）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_backlund_slum
name: 他们都知道
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:东区贫民窟'
effects:
  - { hp: -2 }
  - { dig: 3 }
texts:
  priv: |
    你走进那条巷子，两边的人都停下来看你。
    没有人说话，也没有人挡路。
    **他们都在让 —— 让得很快，像是知道你要去哪。**
    你走到巷尾，那里有一扇门，开着的。
  group: 东区那条巷子里，昨天所有人都给一个陌生人让了路。
daily_limit: 1

options:
  - key: '1'
    label: 走到巷尾那扇门前
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走到门前。门开着，里面很暗。
      **而门后面有一个人在等你** —— 他什么都没说，只是让了让。
  - key: '2'
    label: 停下来问旁边的人
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了。他摇头，往后退了半步。
      **而他退的时候一直看着巷尾** —— 不是看你。
  - key: '3'
    label: 不进那扇门，转身走
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你转身走了。两边的人又开始做自己的事。
      **而走出巷口的时候** —— 你听见身后所有的门一起关上了。
