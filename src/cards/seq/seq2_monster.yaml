# 原著依据：《诡秘之主》途径「命运之轮」序列 2「先知」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分命运权柄（涵盖好运、厄运、预知）；福祸之言可在 30 公里内给予生灵好运或厄运
id: seq2_monster
name: 三十公里
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 4 }
  - { mad: 1 }
texts:
  priv: |
    你站在城门口，看着那些进出的人。
    **三十公里**，够了。
    你没有说话 —— 你只是在心里分了两拨。
    那一整天，城里的人有的顺得离谱，有的倒了一整天的霉。
  group: 昨天城里一半的人顺得反常，一半的人倒霉得反常。
daily_limit: 1

options:
  - key: '1'
    label: 站在城门口看一整天
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你站到天黑。进出的每个人你都分了拨。
      **而他们不知道** —— 有个人还朝你点了点头。
  - key: '2'
    label: 把两拨人换一换
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你换了一下。当天顺的那个人第二天倒了一整天。
      **而他还以为是运气** —— 他在门口骂了一刻钟。
  - key: '3'
    label: 走开，让他们自己过
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走开了。身后城里有人在笑，有人在骂。
      **都很响** —— 走到两条街外还听得见。
