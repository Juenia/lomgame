# 原著依据：《诡秘之主》途径「黑暗」序列 4「守夜人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：越黑暗的环境实力越强、恢复越快；在正午阳光下会被削弱；可给予别人厄运；擅长对付灵体
id: seq4_sleepless
name: 越黑越强
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 3 }
  - { mp: 3 }
texts:
  priv: |
    你走进那条没有灯的巷子，觉得好多了。
    **越黑越舒服** —— 伤口在合，脑子也清楚。
    你抬手摸了一下墙，墙那边有个东西在动。
    你过去了。它没有出来。
  group: 那条巷子昨晚有位守夜人走过。
daily_limit: 1

options:
  - key: '1'
    label: 往巷子深处走
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你往里走。越走越清楚。
      **而身后那段路上所有的灯都灭了** —— 一盏接一盏。
  - key: '2'
    label: 去找那个在动的东西
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你找过去了。它贴着墙。
      **而它比墙更黑** —— 黑到你只能靠墙的形状认出它在哪。
  - key: '3'
    label: 站在巷口，不进去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你站在巷口。里面的黑比外面深。
      **而你不想再往里走了** —— 这是你今晚第一次有这个念头。
