# 原著依据：《诡秘之主》途径「错误」序列 3「欺瞒导师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：欺瞒：可误导敌人、对自然规则进行欺诈；窃取三种能力；伪装
id: seq3_error
name: 规律也能骗
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    他出手的时候，你骗了一下 —— **骗的不是他，是那条规则。**
    火没有着起来，因为这一小片地方暂时「不是可燃的」。
    他愣住了。他从来没有见过这种事。
    你在他愣的时候走开了。
  group: 那间屋子的火怎么也点不着，换了几个人都不行。
daily_limit: 1

options:
  - key: '1'
    label: 在他愣的时候走开
    effects: [ { dig: 5 } ]
    text: |
      你走开了。他站在原地，手还举着。
      **你走到街口的时候回头看了一眼** —— 他还在试。
  - key: '2'
    label: 告诉他刚才发生了什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。他听完脸色变了。
      **因为他是靠这条规则吃饭的人** —— 规则能骗，那他这十几年算什么。
  - key: '3'
    label: 让那片地方恢复
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你松了手。火一下就着了起来。
      **烧到了他的袖子** —— 而他连拍都没拍，只是看着那团火。
