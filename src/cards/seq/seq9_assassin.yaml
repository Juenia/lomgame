# 原著依据：《诡秘之主》途径「魔女」序列 9「刺客」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：能短时间内让身体获得羽毛般的轻盈，拥有鹰的视力和黑暗视觉
id: seq9_assassin
name: 从窗台下来
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 1 }
  - { dig: 2 }
texts:
  priv: |
    三楼那扇窗你够不着梯子，于是直接从窗台跨了出去。
    落地的声音比你想的小。膝盖没有弯，甚至没有怎么用力。
    站起来的时候你抬头看了一眼刚才的高度 —— 那个高度不该是这样的。
  group: 巷子里有个人从三楼下来，没有人看见他是怎么下来的。
daily_limit: 1

options:
  - key: '1'
    label: 抬头再看一眼那个高度
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你又抬头看了一遍。那个高度不该是这样的。
      **你刚才下来的时候没觉得高** —— 而现在它看起来有三层半。
  - key: '2'
    label: 再上去一次，这次走楼梯
    effects: [ { dig: 6, hp: 1 } ]
    text: |
      你上了楼，从窗台往下看。这一次那个高度是对的。
      **也就是说，刚才不对的是你** —— 你在那三秒里比三层楼更轻。
  - key: '3'
    label: 从楼顶再跳一次
    effects: [ { dig: 7, hp: 3, mad: 3 } ]
    text: |
      你上了楼顶，跨出去。落地的时候膝盖还是没有弯。
      **而你落地的地方比你想的远了半条街** —— 你回头看了看自己该落在哪。
