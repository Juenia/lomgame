# 原著依据：《诡秘之主》途径「黑暗」序列 9「不眠者」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：夜越深，精力越充沛，力量、敏捷、思维、灵感也会愈发超越普通人
id: seq93_sleepless
name: 夜里更好
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sleepless'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { mp: 3 }
texts:
  priv: |
    白天你一直昏昏沉沉的。
    天黑下来之后你才醒过来 —— 是真的醒。
    **思路一下清楚了**，手也稳了。
    你坐在窗边等到后半夜，一点都不想睡。
  group: 那扇窗整个晚上都亮着。
daily_limit: 1

options:
  - key: '1'
    label: 坐到后半夜
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你坐着。一点都不想睡。
      **而你的手比白天稳得多** —— 你端了杯水，一滴没洒。
  - key: '2'
    label: 试试白天做不好的那件事
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你做了一遍。一次就成了。
      **而白天你试了七次** —— 每一次都差一点。
  - key: '3'
    label: 白天逼自己睡
    effects: [ { dig: 6, hp: 2, mad: 3 } ]
    text: |
      你白天躺下了。躺了四个钟头，眼睛一直睁着。
      **起来的时候头更沉** —— 而天黑下来之后又清醒了。
