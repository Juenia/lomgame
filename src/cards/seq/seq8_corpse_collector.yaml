# 原著依据：《诡秘之主》途径「死神」序列 8「掘墓人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能初步沟通附近少量的灵；死亡之眼：从更高的层次俯视敌人，找出弱点
id: seq8_corpse_collector
name: 坟地里不止我一个
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { mad: 2 }
texts:
  priv: |
    你在坟地边站了一会儿，因为有人一直在说话。
    声音很轻，讲的是一件很久以前的事 —— 讲得很慢，像怕人听不清。
    你听完了大半，才想起来自己是一个人来的。
    **你回头看了一眼来路。那条路上只有你自己的脚印。**
  group: 有人在那片坟地边站了很久，像在听谁说话。
daily_limit: 1

options:
  - key: '1'
    label: 回头看看那条来路
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回头。那条路上只有你自己的脚印。
      **而刚才那段话还在继续往下讲** —— 讲到第三句的时候，你听见它换了个方向。
  - key: '2'
    label: 站着把它讲完
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你站到它讲完。最后一句是：「**就在你站的地方。**」
      你低头看了看脚下 —— 那块土比旁边松。
  - key: '3'
    label: 问它是谁在讲
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你问了。声音停了。
      **停了很久，然后换了一个人接着讲** —— 讲的是另一件事，另一个年份。
