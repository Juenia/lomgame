# 原著依据：《诡秘之主》途径「被缚者」序列 9「囚犯」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：身体强壮，知觉敏锐，往往同时拥有沉默的外表和疯狂的内心；擅长用随手得到的任何物品杀人
id: seq9_prisoner
name: 汤勺
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { mad: 1 }
texts:
  priv: |
    你在储物间找到一把汤勺。
    你不知道自己为什么拿它。等你回过神，墙根已经缺了一块。
    你把汤勺放下 —— 放下的时候才发现，柄已经被握弯了。
    **你没有用力。**
  group: 那间储物间的墙上多了一个洞，没有人承认是自己挖的。
daily_limit: 1

options:
  - key: '1'
    label: 把汤勺放回去
    effects: [ { dig: 5 } ]
    text: |
      你把汤勺放回储物间，摆在原来的位置。
      **摆得很正** —— 而柄上那道弯你还按不回去。
  - key: '2'
    label: 看看墙根那个洞有多深
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你蹲下来看。洞不深，但很圆。
      **圆得像被含过** —— 而你手上一点灰都没有。
  - key: '3'
    label: 再找一样东西试试
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你拿了一把铁匙，按在墙上。
      **墙塌了半尺** —— 而铁匙是完好的，连变形都没有。
