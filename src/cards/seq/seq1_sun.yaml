# 原著依据：《诡秘之主》途径「太阳」序列 1「纯白天使」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分神圣与秩序权柄；神圣之国：创造足以覆盖贝克兰德的虚幻国度，内里布满太阳光芒，克制黑暗途径
id: seq1_sun
name: 神圣之国
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 5 }
  - { mp: 4 }
texts:
  priv: |
    你把那个国度张开了。
    **大到能盖住一整座城** —— 里面没有影子，没有暗处。
    有些东西在光里直接没了。
    你收回它的时候，天已经亮了。
  group: 昨晚那座城里的影子都很淡。
daily_limit: 1

options:
  - key: '1'
    label: 站在里面看它有多亮
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着看。里面没有一处是暗的。
      **连墙角都亮** —— 而墙角本来是最暗的地方。
  - key: '2'
    label: 把范围再扩大一点
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又扩了一点。外面那些东西开始往地里钻。
      **钻得很急** —— 而它们钻进去的地方，土是黑的。
  - key: '3'
    label: 收了它，去看看城里的人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你收了。街上的人都站在原地看着自己的手。
      **他们的影子很淡** —— 淡得像被人擦过一遍。
