# 事件卡链（M2.87）—— **新链的第二段**。
# 前置：没做到（设 flag `broke_a_promise`）
# ⚠️ 这一段**只有触发过前置卡的人才抽得到** —— 这就是「链」的定义。
id: chain_broke_a_promise
name: 他开始提了
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:broke_a_promise'
effects:
  - { cor: 3 }
  - { dig: 2 }
texts:
