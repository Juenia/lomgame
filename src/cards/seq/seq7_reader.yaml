# 原著依据：《诡秘之主》途径「白塔」序列 7「守知者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：武器精通、格斗大师、推理大师、仪式魔法大师；可借助非凡手段解析并还原一定区域内发生过的事
id: seq7_reader
name: 三天前
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你在那间空屋里站着，没有翻任何东西。
    「三天前，两个人，」你说，「一个从门进来，一个本来就在。」
    跟你来的人愣住了。
    **你说完才意识到，自己刚才不是在推理，是在看。**
  group: 有人在空屋里站了一会儿，说出了三天前的事。
daily_limit: 1

options:
  - key: '1'
    label: 再看一遍那间屋子
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又看了一遍。这次看见了第三个。
      **他一直站在门后** —— 从头到尾没动过。
  - key: '2'
    label: 问他信不信
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了。他摇头。
      **而他的手一直在摸自己的袖口** —— 摸了十几下。
  - key: '3'
    label: 把那两个人是谁说出来
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你说了名字。跟你来的人脸色变了。
      **因为其中一个是他自己** —— 而他不记得自己来过。
