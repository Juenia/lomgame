# 原著依据：《诡秘之主》途径「空想家」序列 9「观众」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能像旁观者一样审视世俗社会里的「演员」，从表情、举止、口癖、不为人知的动作窥见他人真实想法
id: seq92_spectator
name: 他在演给谁看
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:spectator'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你在茶座上坐了一个下午。
    对面那个人一直在说话，说得很好。
    **但你看见他说话的时候左手一直在抠桌沿。**
    他说完了，笑得很好看。你没有接话。
  group: 那天茶座上的人聊得很热闹，散得也很快。
daily_limit: 1

options:
  - key: '1'
    label: 看他的左手在抠什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看他的手。他在抠桌沿上一道旧痕。
      **抠了很多年** —— 那道痕已经深了，深得能卡住指甲。
  - key: '2'
    label: 问他今天为什么来
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你问了。他笑了很久。
      **笑完说「想来就来」** —— 而他说这话的时候手停了。
  - key: '3'
    label: 坐着不动，看他什么时候停
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你坐着不动。他一直在说。
      **说到茶座要打烊** —— 而他中间没有喝过一口茶。
