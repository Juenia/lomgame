# 原著依据：《诡秘之主》途径「黑暗」序列 6「安魂师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：安魂：安抚灵魂，抹平对手的欲望和情绪；能直接看见灵体生物
id: seq6_sleepless
name: 哭声停了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 6
  max_seq: 6
effects:
  - { mp: 2 }
  - { hp: 2 }
texts:
  priv: |
    隔壁那家的小孩哭了两个钟头。
    你过去敲了门，站在门口说了一句话。
    **哭声停了。**
    孩子的母亲愣住了，一直跟你说谢谢。而你看的是屋里另一个角落 —— 那里站着个东西，刚才也在哭。
  group: 哭了半宿的孩子忽然安静了。
daily_limit: 1

options:
  - key: '1'
    label: 看看角落里那个东西
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你看它。它没有脸。
      **而它刚才在哭** —— 哭得比孩子还响。
  - key: '2'
    label: 跟孩子的母亲说没事了
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说了。她一直跟你说谢谢。
      **而她的孩子** —— 一直在看那个角落。
  - key: '3'
    label: 对那个东西说一句话
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你说了。它转过头。
      **而它转的方向** —— 是朝着那孩子的。
