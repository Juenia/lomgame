# 原著依据：《诡秘之主》途径「倒吊人」序列 4「黑骑士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：化身为两米三四的小巨人，通体覆盖黑色冰冷盔甲，只有眼睛位置闪烁两团深红光芒
id: seq4_secrets_supplicant
name: 两米三四
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 5 }
  - { cor: 2 }
texts:
  priv: |
    你站直的时候头顶快碰到门框了。
    **两米三四** —— 盔甲是自己长出来的，黑的，冰冷的。
    对面那个人抬头看你，往后退，撞到了墙上。
    你低头看他。他不知道你在看哪里 —— 因为你的眼睛是两团深红。
  group: 那条巷子里的人说昨晚看见一个很高很黑的东西。
daily_limit: 1

options:
  - key: '1'
    label: 低头看他
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你低头。他不知道你在看哪里。
      **因为你的眼睛是两团深红** —— 而他在看那两团东西。
  - key: '2'
    label: 把盔甲收回去
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你收了。衣服全破了。
      **而你自己一点伤都没有** —— 连擦痕都没有。
  - key: '3'
    label: 伸手把他扶起来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你伸手。他整个人被你拎了起来。
      **像拎一只猫** —— 而他是个两百斤的男人。
