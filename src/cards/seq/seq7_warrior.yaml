# 原著依据：《诡秘之主》途径「黄昏巨人」序列 7「武器大师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：任何武器拿到手中都能以大师级水准使用，包括非凡武器与封印物，并降低负面影响带来的伤害
id: seq7_warrior
name: 第一次就响了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    那把枪卡壳了三次，主人骂了三次。
    他递过来让你看看。
    你接住，抬起来，扣了一下 —— **第一次就响了。**
    你把枪还回去。他接过去，又试了一次。还是卡。
  group: 那把一直卡壳的枪，到了别人手里第一下就响了。
daily_limit: 1

options:
  - key: '1'
    label: 把枪还回去
    effects: [ { dig: 3 } ]
    text: |
      你把它递回去。他接过去，又试了一次。还是卡。
      **他看了你一会儿，没说话。**
  - key: '2'
    label: 再扣一下，看是不是每次都响
    effects: [ { dig: 5, hp: 1 } ]
    text: |
      第二下也响。第三下也响。
      你把它放回桌上 —— **枪还是那把枪，问题不在枪**。
  - key: '3'
    label: 拆开看看里面是什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把它拆了。里面很干净 ——
      **干净得不像用过十年的枪**。零件上连火药渣都没有。
