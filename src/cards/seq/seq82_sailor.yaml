# 原著依据：《诡秘之主》途径「暴君」序列 8「暴怒之民」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：暴怒一击：积攒愤怒而发出的恐怖一击
id: seq82_sailor
name: 积攒
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sailor'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
  - { mad: 2 }
texts:
  priv: |
    你等了三天。
    这三天里你把每一件事都记着 —— 一件一件地攒。
    **第三天下午你出手了。** 只有一下。
    那面墙上的裂缝从中间一直通到房梁。
  group: 那面墙昨天裂了，裂得很整齐。
daily_limit: 1

options:
  - key: '1'
    label: 走过去看那面墙
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走过去看。裂缝很直。
      **直得像用尺画的** —— 而墙上没有别的痕迹。
  - key: '2'
    label: 再攒三天
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又等了三天。第四天你出手的时候，对面那栋楼的窗全碎了。
      **而你只挥了一下** —— 那一下是往前挥的。
  - key: '3'
    label: 把裂缝画下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你在本子上画了那道裂缝。画到一半你发现它不是直的。
      **它偏了一点** —— 偏的方向正对着海。
