# 原著依据：《诡秘之主》途径「完美者」序列 7「鉴定师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可以不用占卜、不依靠推理，快速鉴定神奇物品；能直觉把握大部分超凡物品的能力和问题
id: seq7_perfect
name: 两秒钟
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
texts:
  priv: |
    摊主把那枚戒指递过来，说它很安全，戴了三年。
    你拿在手里两秒。
    **「不能用。」** 你把它放回去。
    摊主的脸僵了一下 —— 那一瞬间你确定自己是对的。
  group: 旧货摊上有人拿起一枚戒指，看了一眼就放下了。
daily_limit: 1

options:
  - key: '1'
    label: 再拿起来看两秒
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你又拿起来看了两秒。这次你看清了自己在看什么 ——
      **戒指内圈有一道很细的裂纹**，而它不在外面。
  - key: '2'
    label: 告诉他为什么不能用
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你说：「它裂了。」
      他把戒指翻过来看了很久 —— **然后把它从摊子上撤了下去**。
  - key: '3'
    label: 什么都不说，走开
    effects: [ { dig: 4 } ]
    text: |
      你把它放回去就走了。
      身后摊主一直看着你的背影 —— **他后来把那枚戒指收进了箱子底**。
