# 原著依据：《诡秘之主》途径「母亲」序列 6「生物学家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能杂交各种生物产生奇怪产物，成为半神前这些产物缺少灵魂
id: seq62_mother
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq6_mother 撞了同一个名字，从本卡正文里另取一个短语。
name: 它不会叫
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    笼子里那两只按书上说不该能生出东西。
    第三天早上多了一只 —— 很小，看不出像谁。
    **它不会叫。** 你把它捧起来看了很久。
    它睁着眼睛，但里面什么都没有。
  group: 那间屋子里养的东西一直没出过声。
daily_limit: 1

options:
  - key: '1'
    label: 把它放回笼子里
    effects: [ { dig: 4 } ]
    text: |
      你把它放回去，扣上笼门。
      **它一直睁着眼睛** —— 你走开十步之后它才动了一下。
  - key: '2'
    label: 再养一只，看是不是也不叫
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      第二只也不叫。
      但它睁着的眼睛里**这次有一点东西** —— 你看了很久，没看出来是什么。
  - key: '3'
    label: 把它放开
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你打开了笼门，退开两步。它没有动。
      **它在等你自己走开** —— 而你走了。第二天笼子是空的，门还开着。
