# 原著依据：《诡秘之主》途径「完美者」序列 7「鉴定师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能直觉地把握到大部分超凡物品的能力和问题，能尽量规避危险地使用它们
id: seq72_perfect
name: 不能戴
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:perfect'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
texts:
  priv: |
    摊主说这枚戒指很安全，戴了三年。
    你接过来，翻了一下，又还给他。
    **你没有戴。** 你也说不清为什么 —— 只是那圈内壁上有一道很细的划痕，方向不对。
    摊主自己戴上试了试，说没事。第二天他换了只手戴。
  group: 旧货摊上有人拿起一枚戒指看了一眼就放下了；第二天摊主换了只手戴。
daily_limit: 1

options:
  - key: '1'
    label: 把戒指买下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你买下了。摊主收钱的手很稳 ——
      **稳得不像刚戴过那枚戒指**。你把戒指放进口袋，没有回头。
  - key: '2'
    label: 告诉他内壁那道划痕
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      他低头看了很久，说自己戴了三年没注意过。
      你们一起看着那道划痕 —— **它是从里往外划的**。
  - key: '3'
    label: 放回摊上，什么也不说
    effects: [ { dig: 3 } ]
    text: |
      你把它搁回绒布上，走了。
      **有些事说了没用** —— 他要不是个爱惜东西的人，那道划痕不会只划那么浅。
  - key: '4'
    label: 第二天去看看他换了哪只手
    effects: [ { dig: 6, cor: 1, mad: 1 } ]
    text: |
      他换成了左手。
      你站得远，但看得清 —— **那只手腕上有一圈很淡的印子**，比划痕宽。
