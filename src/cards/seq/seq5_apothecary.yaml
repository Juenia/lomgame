# 原著依据：《诡秘之主》途径「月亮」序列 5「深红学者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：满月：能让一定范围内的区域处于满月状态，灵性滋生，灵感增强
id: seq5_apothecary
name: 今晚是新月
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { cor: 1 }
texts:
  priv: |
    你把窗帘拉开。
    **外面是新月** —— 天上只有一线，什么都照不亮。
    但屋里亮着，那种很淡的红，像有人在月光底下点了灯。
    你站在那片红里，觉得自己能看见很多东西。
  group: 那户人家昨晚亮着灯，而昨晚是新月。
daily_limit: 1

options:
  - key: '1'
    label: 走进那片红光里
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走进那片红。墙上的东西开始透光。
      **你看得见隔壁屋里的人在做什么** —— 而他知道有人在看，只是不知道是谁。
  - key: '2'
    label: 把窗帘拉上
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你拉上窗帘。屋里暗下来。
      **但那点红还在，只是看不见了** —— 你隔着布也能觉出它的位置。
  - key: '3'
    label: 到院子里抬头看月亮
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      天上那道线比刚才宽了一点。
      **而它不该长得这么快** —— 新月到上弦要七天，你刚才看了不到一刻钟。
