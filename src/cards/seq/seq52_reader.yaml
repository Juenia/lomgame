# 原著依据：《诡秘之主》途径「白塔」序列 5「秘术导师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：刚晋升时能自然地从全知权柄掌控者那里获得六到十三种秘术，之后靠学习和自创
id: seq52_reader
name: 六到十三种
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:reader'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 4 }
  - { mp: 2 }
texts:
  priv: |
    晋升那天晚上你睡不着。
    **脑子里多了东西** —— 你数了一下，九种。
    每一种都不太一样，有一种你完全不知道是干什么的。
    你把它记在本子上，写了两个字：待查。
  group: 有人前天开始在本子上记一些看不懂的东西。
daily_limit: 1

options:
  - key: '1'
    label: 把那九种都试一遍
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你试了。试到第五种的时候你停了。
      **那一种用完你会忘记自己的名字** —— 而你想不起是谁告诉你的。
  - key: '2'
    label: 只查那一种不知道的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你去查了。查了三天。
      **最后在一本旧书的夹页里看见了它的名字** —— 而那一页被撕掉过。
  - key: '3'
    label: 把本子收起来，先睡
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你把本子压在枕头底下睡了。
      **睡着之后你梦见九扇门** —— 而第九扇是开着的。
