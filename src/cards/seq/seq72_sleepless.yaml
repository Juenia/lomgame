# 原著依据：《诡秘之主》途径「黑暗」序列 7「梦魇」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：塑梦：让梦境如自己设想的那样发展，引导目标展现秘密或给予恐惧
id: seq72_sleepless
name: 塑梦
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sleepless'
  min_seq: 7
  max_seq: 7
effects:
  - { mp: 2 }
  - { mad: 2 }
texts:
  priv: |
    你在他的梦里搭了一间屋子。
    屋子有窗，窗外是他小时候住的地方。
    **他站在窗边看了很久**，然后开始说话。
    醒来之后他什么都不记得。你什么都记得。
  group: 有人一觉醒来，说昨晚梦见小时候的家。
daily_limit: 1

options:
  - key: '1'
    label: 在梦里再搭一间屋子
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你又搭了一间。这次窗外是一条河。
      **而他在窗边站了很久** —— 比上次久。
  - key: '2'
    label: 问他在想什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你问了。他说他在等一个人回来。
      **而那个人他已经忘了是谁** —— 他只知道要等。
  - key: '3'
    label: 第二天白天再去找他
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。他看见你的时候愣了一下。
      **而他什么都没说** —— 只是给你让了个座。
