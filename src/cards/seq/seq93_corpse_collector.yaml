# 原著依据：《诡秘之主》途径「死神」序列 9「收尸人」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：天然具备灵视，能直接看见部分恶灵
id: seq93_corpse_collector
name: 天然灵视
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:corpse_collector'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    那口棺材停在堂屋里，家里人在守。
    你进去上了香，看了一眼。
    **棺材上面坐着一个。** 也在守着，低着头。
    你上完香就出来了。你没有告诉任何人。
  group: 那家办丧事的时候，来吊唁的人都觉得屋里很冷。
daily_limit: 1

options:
  - key: '1'
    label: 上完香就走，什么都不说
    effects: [ { dig: 5 } ]
    text: |
      你上完香就出来了。
      **走出来之后你才发觉手心是凉的** —— 香灰的热一点都没烫到你。
  - key: '2'
    label: 对那个坐在棺材上的人点点头
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你点头了。它抬起头看了你一眼。
      **而屋里的人说他们闻到了香灰的味道** —— 明明香早就烧完了。
  - key: '3'
    label: 告诉家里人他一直在守着
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。家里人没有一个害怕。
      **老太太只是抹了抹眼泪** —— 说了句「我知道」。
