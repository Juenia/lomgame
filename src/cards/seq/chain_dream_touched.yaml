# 事件卡链（M2.87）—— **后续卡**：只有触发过前置卡的人才抽得到。
# 前置：daily_009 / daily_026 / mortal_dream / path_sleepless_002（设 flag `dream_touched`）
# 判据：`cond: flag:dream_touched`。
#
# ⚠️ 这一类此前**一条都没有**：全库 29 张卡设了 flag，而要求 flag 的卡是 **0 张** ——
#    flag 设了就再没有人读，等于写了一半的链。这张是它的后半段。
id: chain_dream_touched
name: 分不清了
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:dream_touched'
effects:
  - { mad: 3 }
  - { dig: 2 }
texts:
  priv: |
    昨天你在梦里跟人说了话。
    今天在街上，那个人跟你打了招呼。
    **你确定自己从没见过他。**
    他也确定你们认识 —— 他说你们昨天聊了很久。
  group: 有人说在街上遇到了一个昨天刚认识的人，但他想不起在哪认识的。
daily_limit: 1
