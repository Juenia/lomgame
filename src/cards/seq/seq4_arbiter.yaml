# 原著依据：《诡秘之主》途径「审判者」序列 4「律令法师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：律令：能制定宽泛的限制并维持一段时间（最短三十秒最长一刻钟）
id: seq4_arbiter
name: 神秘减弱现实增强
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    对面抬手，掌心里浮起一层黑的东西。
    「**神秘减弱，现实增强。**」你说。
    那层黑散了。他愣住，又试了一次 —— 还是没有。
    「现在只能打了，」你说。
  group: 那场架打到一半，对面的人忽然什么也用不出来了。
daily_limit: 1

options:
  - key: '1'
    label: 让他走
    effects: [ { dig: 4 } ]
    text: |
      你侧身让开了路。他扶着墙走了，走几步回头看一眼。
      **他一直看到拐弯为止** —— 而你一直站在原地。
  - key: '2'
    label: 再宣布一次，范围扩到整条街
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      街上所有的东西都「实」了一层。
      **而你自己也开始觉得累** —— 那是身体在提醒你，这条街也在你身上。
  - key: '3'
    label: 问他是从哪学的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他喘着气说了个名字。
      **那个名字你在一本书的扉页上见过** —— 就是被划掉的那个。
