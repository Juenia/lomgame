# 原著依据：《诡秘之主》途径「母亲」序列 6「生物学家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：对生物特性有深刻了解；能杂交各种生物产生奇怪产物；自身能产生剧毒
id: seq6_mother
name: 笼子里那两只
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    笼子里那两只按书上说不该能生出东西。
    第三天早上，多了一只 —— 很小，看不出像谁。
    你戴着厚手套把它捧起来。
    **手套上有一小块焦了。**
  group: 那间屋子里养的东西，邻居说晚上会叫。
daily_limit: 1

options:
  - key: '1'
    label: 把手套脱下来检查
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      焦的那一块**不是烧的**。
      它是塌下去的 —— 像被什么从里面吸了一口。
  - key: '2'
    label: 养它几天再看看
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      第四天它开始长了。
      **长得比按书上算的快三倍** —— 而那本书上没有写它吃什么。
  - key: '3'
    label: 连笼子一起烧掉
    effects: [ { dig: 7, hp: 2, cor: 2 } ]
    text: |
      火点了三次才着，烧的时候有股很甜的味道。
      **烧完之后笼子的铁架还是完整的** —— 而里面的东西没了。
