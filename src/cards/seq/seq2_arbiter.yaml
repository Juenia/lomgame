# 原著依据：《诡秘之主》途径「审判者」序列 2「平衡者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：平衡：可分割战场，将混战的几方划分在不同区域并保证实力平衡；在其结束前天使圣者都无法干涉别的战斗
id: seq2_arbiter
name: 谁也别插手
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 4 }
  - { dig: 2 }
texts:
  priv: |
    街上五方人打成一团，血溅到了墙上。
    你走进去，抬手划了几道。
    **他们分开了。** 每一方在自己的那一块里，谁也过不去。
    有个东西想从天上插手 —— 它进不来。你在里面站了很久。
  group: 那条街上的混战打了一整天，没有人越界。
daily_limit: 1

options:
  - key: '1'
    label: 站在中间不动
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你站了很久。五方人各自在自己的那一块里喘气。
      **谁都没能跨过那几道线** —— 而线是什么样子，他们谁也说不清。
  - key: '2'
    label: 再多划几道，把他们彻底分开
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你又划了几道。一条街被劈成了五块。
      **而中间那条是你站着的** —— 他们绕着你走，没有人敢碰你的衣角。
  - key: '3'
    label: 让天上那个东西进来看看
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你松了一处。它进到一半就停了。
      **它看见你在里面** —— 而它在半空停了很久，然后退了出去。
