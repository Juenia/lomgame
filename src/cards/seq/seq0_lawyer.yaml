# 原著依据：《诡秘之主》途径「黑皇帝」序列 0「黑皇帝」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：核心是秩序阴影象征下的独裁者权柄，另有大部分混乱权柄；下位有扭曲、利用、定义、阶层等权柄
id: seq0_lawyer
name: 独裁者
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:lawyer'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { cor: 4 }
texts:
  priv: |
    那座城的规矩换了。
    **没有公告，没有人宣布** —— 只是从某一天起，所有人都知道该怎么做了。
    有人试过不照做。他自己也不知道为什么，走到一半就折回来了。
    那座城现在很整齐。
  group: 那座城的人这两年都不太一样。
daily_limit: 1

options:
  - key: '1'
    label: 在城里走一圈
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你走了一圈。每个人都在做自己该做的事。
      **而他们看你的眼神是平的** —— 不敬，也不怕。
  - key: '2'
    label: 找个人试试让他不照做
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你让一个卖菜的今天别摆摊。他站住了。
      **站了一刻钟** —— 然后还是把摊子摆开了，摆得很整齐。
  - key: '3'
    label: 把那条规矩收一点回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你松了一点。第二天街上有人大声说了句话。
      **而他自己吓了一跳** —— 赶紧四下看了看。
