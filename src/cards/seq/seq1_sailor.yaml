# 原著依据：《诡秘之主》途径「暴君」序列 1「雷神」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：天罚：从天而降的巨大闪电，附带瓦解、净化、摧毁等力量，对试图超越自然或超出物质的目标有弱点攻击般威能
id: seq1_sailor
name: 天罚
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 5 }
  - { mp: 4 }
texts:
  priv: |
    那个东西想越过那条线。
    你抬头看了一眼天。
    **闪电下来了** —— 不是一道，是一整片，从天顶直贯到地上。
    落点很干净，周围什么都没碰。
  group: 昨晚那道雷把一棵树劈成了灰，别的树都在。
daily_limit: 1

options:
  - key: '1'
    label: 站着看它落完
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看完了。落点周围的草是直的。
      **一根都没弯** —— 而风是从天上来的。
  - key: '2'
    label: 再看一眼那条线
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又看了一眼。线还在那儿。
      **而线外面站着一个人** —— 他正在看你，没有动。
  - key: '3'
    label: 走过去看看那棵树
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走过去。地上没有坑。
      **只有一层很细的灰** —— 铺得很平，像被人扫过。
