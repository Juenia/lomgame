# 原著依据：《诡秘之主》途径「深渊」序列 3「呓语者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握一定污染权柄，主要在心灵与精神方面：说出的话能让非凡者失控、重创、精神混乱或遭诅咒
id: seq3_criminal
name: 听了就忘不掉
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 3
  max_seq: 3
effects:
  - { cor: 4 }
  - { mad: 2 }
texts:
  priv: |
    你跟他说了三句话。
    第一句他没反应，第二句他皱起眉，第三句之后他跪下了。
    **你说的话没有恶意。** 你是想安慰他的。
    他后来再没跟人提过那天。
  group: 那个人从那天之后就不太说话了。
daily_limit: 1

options:
  - key: '1'
    label: 闭嘴，什么都不再说
    effects: [ { dig: 5 } ]
    text: |
      你闭了嘴，转身走了。
      **走到街口你回头看了一次** —— 他还跪在那儿。
  - key: '2'
    label: 换一种说法再说一遍
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你换了说法，意思一样。他抬起头看你。
      **眼里有你不想看的东西** —— 那不是恨，是认出来了。
  - key: '3'
    label: 去他家看看他现在怎么样
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你去了。他坐在屋里。
      **桌上摆着三张纸** —— 上面写着你说的那三句话，一字不差。
