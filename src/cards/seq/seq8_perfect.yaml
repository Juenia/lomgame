# 原著依据：《诡秘之主》途径「完美者」序列 8「考古学家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有足够的历史知识、野外生存知识以及遗迹相关的禁忌知识
id: seq8_perfect
name: 哪块砖不能踩
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
texts:
  priv: |
    那片废墟看着没什么特别，同行的人已经往里头走了十几步。
    「站住。」你说，「左边第三块。」
    他低头看 —— 那块砖比旁边低了一线。
    **你不知道自己是怎么知道的。但你知道那是真的。**
  group: 有人在废墟门口叫住了同伴，只因为一块砖。
daily_limit: 1

options:
  - key: '1'
    label: 让他自己低头看
    effects: [ { dig: 4 } ]
    text: |
      他低头看那块砖，看了半天，说：「你怎么看出来的？」
      **你答不上来** —— 你确实是「看」出来的，但那不是用眼睛。
  - key: '2'
    label: 跟他一起把这一段绕过去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你们贴着墙根绕了过去。走过去之后他回头看了一眼那块砖。
      **那块砖现在在他眼里也是「不能踩的那一块」了** —— 你把这个本事传了一半出去。
  - key: '3'
    label: 自己走一遍，试试会不会踩错
    effects: [ { dig: 6, hp: 2, mad: 1 } ]
    text: |
      你走了。脚落在第二块和第四块上。
      **第三块你没碰** —— 而你到现在也说不出为什么。
