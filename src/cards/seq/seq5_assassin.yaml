# 原著依据：《诡秘之主》途径「魔女」序列 5「痛苦」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：魅惑变为可主动使用的能力；被魅惑的敌人会心软，舍不得下狠手
id: seq5_assassin
name: 他放下了刀
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 1 }
  - { dig: 2 }
texts:
  priv: |
    他把刀举起来了。
    你抬起头，看了他一眼。
    **他放下了。** 手在抖，但刀确实放下了。
    「你走吧，」他说。声音很难听。
  group: 有人举着刀站了很久，最后把刀放下了。
daily_limit: 1

options:
  - key: '1'
    label: 就这么走过去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你从他身边走过，没有加快脚步。
      **他一直举着手** —— 直到你拐过弯，他才把刀扔在地上。
  - key: '2'
    label: 问他为什么把刀举起来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他答不上来。他只是摇头，然后把刀踢到墙角。
      **踢的时候他一直在看自己的手** —— 像那手不是他的。
  - key: '3'
    label: 把刀捡起来还给他
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你弯腰捡起刀，递过去。
      **他接了** —— 而这一次他没有举起来。他只是握着，握了很久。
