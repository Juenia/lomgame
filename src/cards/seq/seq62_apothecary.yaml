# 原著依据：《诡秘之主》途径「月亮」序列 6「魔药教授」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：提前做好准备、预先服食了对应药水的魔药教授总是非常难以应对
id: seq62_apothecary
name: 提前喝下去
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    你出门之前喝了两瓶东西。
    一瓶是苦的，一瓶没有味道。
    **刀砍进来的时候，伤口没有出血。**
    对面那个人愣了一下。你趁那一下把他的手按住了。
  group: 有人被砍了一刀，衣服破了，地上没有血。
daily_limit: 1

options:
  - key: '1'
    label: 趁那一下把他的手按住
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      你按住他的手腕，把刀夺了过来。他退了三步。
      **地上没有血** —— 他低头看了很久，脸色比你还白。
  - key: '2'
    label: 让他砍第二刀
    effects: [ { dig: 7, hp: 4, mad: 2 } ]
    text: |
      第二刀进来的时候你数着。
      **第一刀没出血，第二刀出了** —— 你知道了药效能顶多久，代价是肩上多了一道。
  - key: '3'
    label: 回家把配方和顺序记下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你记下了两瓶的先后和间隔。
      **这一页以后能救命** —— 前提是你还记得清当时是怎么喝的。
