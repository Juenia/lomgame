# 原著依据：《诡秘之主》途径「被缚者」序列 7「狼人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：狼人化后力量、敏捷、速度进一步提升，可将全速追逐灰狼甩远
id: seq72_prisoner
name: 追上灰狼
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:prisoner'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 4 }
  - { mad: 1 }
texts:
  priv: |
    你追了它两个钟头。
    它一直在前面，不远不近。
    **第三个钟头你超过了它。** 它回头看了一眼，眼里第一次有了别的东西。
    你停下来。它跑掉了。
  group: 林子里昨天有人跑得比狼还快，猎人都不信。
daily_limit: 1

options:
  - key: '1'
    label: 停下来，看它跑掉
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你停下了。它跑出很远才回头。
      **回头之后又跑了一段** —— 而它一直朝同一个方向看。
  - key: '2'
    label: 再追一次
    effects: [ { dig: 7, hp: 2, cor: 3, mad: 3 } ]
    text: |
      你又追了一次。这次你没有超它。
      **你跟着它跑到了一片没去过的地方** —— 那里没有树，也没有草。
  - key: '3'
    label: 去找那些猎人
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。他们不肯信。
      **而其中一个一直看你的鞋** —— 你的鞋底是干净的。
