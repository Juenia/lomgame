# 原著依据：《诡秘之主》途径「错误」序列 1「时之虫」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：来自时空之王的弱化时间权柄；可召唤古老石制壁钟虚影；能将一定范围内最近的历史以画面展现；可窃取时间
id: seq1_error
name: 斑驳的壁钟
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 5 }
  - { mp: 3 }
texts:
  priv: |
    你把手一举，头顶浮起一座钟。
    **很旧，斑驳，指针在倒着走。**
    墙上的画面动了起来 —— 三天前这里发生过什么，一帧一帧地过。
    画面停在一个人脸上。你把钟收了。
  group: 那面墙上昨晚亮过一阵，像有影子在动。
daily_limit: 1

options:
  - key: '1'
    label: 把画面停在那个脸上多看一会儿
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你停住了。那张脸你认得。
      **而三天前他不在这儿** —— 他三天前在另一座城，你亲眼看见过他。
  - key: '2'
    label: 把钟往前拨
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你往前拨。画面变成了还没发生的事。
      **而你只看了一眼就收了钟** —— 那一帧里有你自己。
  - key: '3'
    label: 收钟，在墙上做个记号
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你收钟，在那面墙上划了一道。
      **记号第二天就没了** —— 而墙上的画面你记住了。
