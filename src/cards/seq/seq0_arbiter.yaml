# 原著依据：《诡秘之主》途径「审判者」序列 0「审判者」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：秩序权柄（下位有规则、律法、规律等）：能在一定程度上修改世界的底层规则；能为世界制定新的规则（非底层，可永久起效）
id: seq0_arbiter
name: 底层规则
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:arbiter'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { hp: 3 }
texts:
  priv: |
    你在纸上写了一行字，然后把它划掉了。
    **从那天开始，有一件事变得不一样了。** 没有人说得清是哪一件。
    只是过了几年，人们发现有些事不再可能发生了。
    而没有人记得它曾经可能过。
  group: 这些年有些事变了，没有人记得它变过。
daily_limit: 1

options:
  - key: '1'
    label: 把那行字留着
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把纸收进箱底。
      **上面被划掉的那行字，在灯下还看得见一点** —— 你不打算再看第二眼。
  - key: '2'
    label: 再写一行，再划掉
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      第二条划掉之后，你把纸放下。
      **而你自己也想不起来自己写的是什么了** —— 想不起来，正是它生效的样子。
  - key: '3'
    label: 去找那些「不再可能」的事
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你找到了三件。
      **其中最要紧的一件，是你自己以前做过的** —— 而现在你连怎么做都想不起来。
