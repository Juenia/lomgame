# 原著依据：《诡秘之主》途径「暴君」序列 0「暴君」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：造物象征衍化而来的部分雷霆权柄（电与磁）：能发出强烈电磁风暴破坏所有信息结构；暴君权柄：万王之王，下分威慑、愤怒、部分恐惧权柄
id: seq0_sailor
name: 万王之王
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:sailor'
  min_seq: 0
  max_seq: 0
effects:
  - { hp: 6 }
  - { mp: 5 }
texts:
  priv: |
    那天海上所有的罗盘都转了。
    **不是失灵，是所有指针同时指向了一个方向。**
    电报房里所有的机器一起烧了。
    没有人知道那个方向有什么。后来也没有人再提。
  group: 那天所有罗盘同时指向了一个方向，只持续了一刻钟。
daily_limit: 1

options:
  - key: '1'
    label: 跟着指针指的方向看一眼
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你抬头看。那个方向什么都没有。
      **而你的眼睛疼了一整天** —— 到晚上才好。
  - key: '2'
    label: 把罗盘收起来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把罗盘收进箱子。第二天打开的时候它还是指着那个方向。
      **而别的罗盘都好了** —— 街上的人说那只是磁暴。
  - key: '3'
    label: 去电报房看看
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你去了。机器烧得很匀。
      **铜线圈全化了** —— 而木头壳子一点没动。
