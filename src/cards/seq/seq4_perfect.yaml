# 原著依据：《诡秘之主》途径「完美者」序列 4「炼金术士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：炼成：就地取材快速制造临时人偶与器物；能为自己制造的物品注入灵魂
id: seq4_perfect
name: 就地取材
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    你手边只有几张旧报纸、一段绳子和一块煤。
    你把手按上去。
    **站起来一个东西** —— 不像人，但能动，能听你的。
    它做完该做的事就散了。散的时候你听见了一声很短的气音。
  group: 那间屋子的地上只剩一堆碎报纸。
daily_limit: 1

options:
  - key: '1'
    label: 让它做完事，看它散掉
    effects: [ { dig: 4 } ]
    text: |
      它做完该做的事，站了一会儿，散了。
      地上只剩一堆碎报纸 —— **摆成一个不是它自己弄出来的形状**。
  - key: '2'
    label: 再做一个，这次做得更像人
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你多花了半个钟头。它站起来的时候你会想跟它说话。
      **而没有说话的对象** —— 那半个钟头你花在了脸上。
  - key: '3'
    label: 问它一句：你疼吗
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      它不动了，站了一会儿，然后散得比上次快。
      **散的时候那声气音是短的** —— 你到现在还在想那算不算回答。
  - key: '4'
    label: 把地上的碎报纸收拾干净
    effects: [ { dig: 3, dp: 1 } ]
    text: |
      你把碎报纸收进袋子。
      有一片上写着字 —— **你把它留了下来**。
