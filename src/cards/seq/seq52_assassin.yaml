# 原著依据：《诡秘之主》途径「魔女」序列 5「痛苦」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：疾病：能制造多种病原体分布在三十多米范围内，随掌握与消化范围可达五十米
id: seq52_assassin
name: 三十米
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 3 }
  - { mad: 1 }
texts:
  priv: |
    你走过那个院子的时候什么都没做。
    **三十米。** 你在心里量过。
    第三天院子里的人开始咳。
    你又去看了一次，站在院墙外面，听了一会儿走了。
  group: 那个院子的人这几天都在咳，说是着了凉。
daily_limit: 1

options:
  - key: '1'
    label: 站在院墙外听一会儿
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你听着里面的咳嗽声。一、二、三。
      **你数得出来是几个人** —— 而昨天是五个。
  - key: '2'
    label: 第二天再去看一眼
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你又去了。院子里挂出了白布。
      **而你在墙外站着** —— 站了很久才走。
  - key: '3'
    label: 再走一遍，这次只覆盖一半
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走了第三遍，这次只覆盖院子的一半。
      **第二天咳嗽的人只剩一半** —— 而他们住在同一边。
