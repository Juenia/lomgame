# 原著依据：《诡秘之主》途径「黄昏巨人」序列 0「黄昏巨人」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：神国黄昏之地；部分神圣权柄、黄昏权柄、战斗权柄（下位有力、巨大、摧毁、守护等）、部分代行权柄
id: seq0_warrior
name: 黄昏之地
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:warrior'
  min_seq: 0
  max_seq: 0
effects:
  - { hp: 7 }
  - { dig: 4 }
texts:
  priv: |
    你在那片地方待到过傍晚。
    **那里的黄昏很长** —— 太阳一直不下去，天一直是橘色的。
    你在那儿站着，觉得自己很老，也很结实。
    出来之后你看了一眼表：只过了十分钟。
  group: 那片地方的天一直是傍晚的颜色。
daily_limit: 1

options:
  - key: '1'
    label: 在橘色里多站一会儿
    effects: [ { dig: 4 } ]
    text: |
      你站到腿有点酸 —— 而天没有暗。
      这里的黄昏**不会结束**。你忽然明白为什么这里让人觉得自己结实：**它不催你**。
  - key: '2'
    label: 对着空气打一拳
    effects: [ { dig: 5, hp: 1 } ]
    text: |
      声音比预想的闷，像是打在很厚的东西上。
      你收回手，指节有点疼 —— **这个地方是有底的**。
  - key: '3'
    label: 把来路记下来
    effects: [ { dig: 6, cor: 1, mad: 2 } ]
    text: |
      你边走边记路标：一棵歪树、一段断墙、一个没有井盖的井。
      出来之后你再想那几个路标 —— **一个都不存在**。
  - key: '4'
    label: 看一眼表，确认过了多久
    effects: [ { dig: 3, dp: 1 } ]
    text: |
      十分钟。
      你在里面站了那么久，外面只过了十分钟。**这笔账以后要算清楚。**
