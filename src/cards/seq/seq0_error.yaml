# 原著依据：《诡秘之主》途径「错误」序列 0「错误」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：能通过以假代真的方式窃取模仿对象的某些权限；可通过制造漏洞回避攻击；能混淆分身与本体；可分离出两个序列 1 级分身
id: seq0_error
name: 以假代真
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:error'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { mp: 4 }
texts:
  priv: |
    他们把你围住了，这一次是真的围住了。
    **你笑了。**
    「你们围的是哪一个？」你问。
    他们回头看 —— 身后还站着一个你。而刚才那个慢慢糊了。
  group: 那伙人围了三次，三次围的都不对。
daily_limit: 1

options:
  - key: '1'
    label: 把那个假的收回去
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你收了。他们回头看的时候身后什么都没有。
      **而你还在原地** —— 他们转回来的时候，你已经不在那儿了。
  - key: '2'
    label: 再做两个假的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又做了两个。五个人围着三个你。
      **而哪一个都不对** —— 他们最后散开的时候，谁也不敢回头看。
  - key: '3'
    label: 问他们为什么来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了一句。他们互相看了一眼。
      **带头那个说不上来** —— 他说是别人叫他来的，而那个人他也不认识。
