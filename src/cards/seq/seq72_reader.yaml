# 原著依据：《诡秘之主》途径「白塔」序列 7「守知者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可借助非凡手段解析并且还原一定区域内所发生过的事件
id: seq72_reader
name: 还原
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:reader'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 4 }
  - { mp: 1 }
texts:
  priv: |
    你伸手摸了一下桌角。
    **那里的灰被推开过** —— 推的方向是往左，力度很小。
    「有人在这儿坐过，」你说，「坐的时候一直在动左手。」
    跟你来的人没说话，只是把椅子拉开看了一眼 ——
    椅子上有一道浅浅的划痕，正合左手的指甲。
  group: 有人在空屋里摸了一下桌角，然后让人去看椅子。
daily_limit: 1

options:
  - key: '1'
    label: 把椅子翻过来看
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把椅子翻过来。划痕在背面更深。
      **深到木头上有一小块翘起** —— 而那要很多天。
  - key: '2'
    label: 问他为什么不说话
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      他沉默了一会儿，说他昨天来过一趟。
      **而他昨天是一个人来的** —— 他今天才叫上你。
  - key: '3'
    label: 站起来走到窗边
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走到窗边往外看。街上有人正抬头看这扇窗。
      **而你认得那张脸** —— 他是三天前从这里出去的那个。
