# 事件卡链（M2.87）—— **链的第二段**（三级链的中间那一环）。
# 前置：设 flag `marked_by_party` 的那张卡
# 自身：要 `flag:marked_by_party`，并**设出** `party_trust_broken`（供第三段读）
id: chain2_marked_by_party
name: 说破了
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:marked_by_party'
effects:
  - { dig: 3 }
  - { cor: 3 }
  - { flag: party_trust_broken }
texts:
  priv: |
    你把他拉到一边，问了。
    他没有否认，也没有解释。
    **「你什么时候发现的？」** 他只问了这一句。
    「刚才，」你说。他点了一下头，走了。
  group: 那几个人昨天散伙了，谁都不肯说为什么。
daily_limit: 1
