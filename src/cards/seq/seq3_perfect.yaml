# 原著依据：《诡秘之主》途径「完美者」序列 3「奥秘学者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：汲取：能从周围五公里内的生物处抽取生命力；解离：发射光芒破坏绝大多数物品结构
id: seq3_perfect
name: 抽走
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 4 }
  - { cor: 2 }
texts:
  priv: |
    你把周围**五公里**过了一遍。
    没有杀人 —— 你只是各抽了一点点，每人少活那么几天。
    抽完之后你在原地站了一会儿，觉得好多了。
    你抬头看，树上的叶子黄了几片。
  group: 那一片的树昨天忽然黄了，园丁说不上来为什么。
daily_limit: 1

options:
  - key: '1'
    label: 停在原地，感受一下
    effects: [ { dig: 4 } ]
    text: |
      你站了一会儿，觉得好多了。
      **代价是树上那几片黄叶** —— 它们黄得很均匀，不像秋天。
  - key: '2'
    label: 再走一遍，这次远一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      十公里。回来的时候你的手不抖了。
      **那不是好事** —— 上一次你抖了半个钟头。
  - key: '3'
    label: 走过去看看那些树
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你捡起一片叶子。它黄得**像被抽干了**，而不是像秋天。
      你把叶子收起来 —— **这是这笔账唯一的凭据**。
  - key: '4'
    label: 出城找个没人的地方待着
    effects: [ { dig: 3, mad: -1 } ]
    text: |
      你在坡上坐到天黑。
      **那几天你没有再抽第二遍** —— 你自己也不知道是在等什么。
