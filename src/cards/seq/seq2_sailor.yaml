# 原著依据：《诡秘之主》途径「暴君」序列 2「天灾」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：风暴化身：能掀起足以摧毁一个大城市的飓风暴雨；恐惧之音：让上百公里内的生灵极度恐惧并服从
id: seq2_sailor
name: 摧毁一座城的飓风
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 5 }
  - { mp: 4 }
texts:
  priv: |
    你站在海边的礁石上。
    **风暴是从你身上起来的** —— 先是衣角，然后是整片海。
    那座城的人后来描述：天黑了，风里有个声音，所有人都不想动。
    风停的时候，城还在。因为你想让它还在。
  group: 昨天没起风，气象台说那股风暴消失了。
daily_limit: 1

options:
  - key: '1'
    label: 让风停下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把风收了。海面慢慢平下来。
      **而城里的人还在往地窖跑** —— 他们跑了很久才发现风停了。
  - key: '2'
    label: 让风再大一点
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你松了一点。风里那个声音清楚了。
      **而城里有人开始往海边走** —— 走得很慢，像在听什么。
  - key: '3'
    label: 回头看看那座城
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回头看。城的灯还亮着。
      **一盏都没灭** —— 而你刚才明明看见屋顶被掀走了。
