# 原著依据：《诡秘之主》途径「白塔」序列 8「推理学员」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：观察力提升，逻辑思维能力提升，仪式魔法的专家
id: seq82_reader
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq8_reader 撞了同一个名字，从本卡正文里另取一个短语。
name: 而且他不高
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:reader'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
texts:
  priv: |
    你只看了一眼门口的擦痕。
    **擦痕是一直往里走的** —— 而它到门框那儿就断了。
    「他是从窗户进来的，」你说，「而且他不高。」
    他们打开窗户 —— 窗台下的灰被蹭掉一小撮，
    高度正对着一个孩子的膝盖。
  group: 有人只看了一眼门口的擦痕，就让人去开窗户。
daily_limit: 1

options:
  - key: '1'
    label: 让他们去看门框上那道擦痕
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他们看了。擦痕到门框那儿就断了。
      **而门框上没有对应的痕迹** —— 说明进来的东西比门框矮得多。
  - key: '2'
    label: 问他们屋里丢的是什么
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他们说了。丢的是一盒糖。
      **而你刚才在窗台上看见了一小片糖纸** —— 粘在灰里。
  - key: '3'
    label: 自己进去，走到窗边往下看
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走到窗边往下看。楼下的院子里有一个小孩在玩。
      **他抬头看了你一眼** —— 然后继续玩，玩得很专心。
