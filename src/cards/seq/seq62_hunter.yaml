# 原著依据：《诡秘之主》途径「红祭司」序列 6「阴谋家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能随意将火焰塑造成不同外形，比如鞭子和马刀
id: seq62_hunter
name: 鞭子和马刀
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你把火抓在手里，拉了一下。
    **它成了一根鞭子。** 红得发亮。
    你甩出去，缠住了对面的刀。
    刀化了。你还站着。
  group: 那把刀昨天化在地上，只剩一摊铁。
daily_limit: 1

options:
  - key: '1'
    label: 把鞭子收回来
    effects: [ { dig: 5 } ]
    text: |
      你手腕一收，鞭子回到手里，灭了。
      **那摊铁还在地上** —— 而你已经走过去了。
  - key: '2'
    label: 再拉一下，看能变什么
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你又拉了一下。这次它变成了一把很短的刀。
      **而刀背上还有火在走** —— 走的很慢，像在找路。
  - key: '3'
    label: 走过去看那摊铁
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走过去看。铁是摊平的。
      **平得像被压过** —— 而不像被烧过。
