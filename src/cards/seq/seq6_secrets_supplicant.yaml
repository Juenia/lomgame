# 原著依据：《诡秘之主》途径「倒吊人」序列 6「蔷薇主教」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：让身体如蜡烛般融化，化成黏稠的血肉渗透入地面移动或躲到其他人体内
id: seq6_secrets_supplicant
name: 他从我身上踩过去
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 6
  max_seq: 6
effects:
  - { cor: 3 }
  - { hp: 2 }
texts:
  priv: |
    追你的人在门口停下了。
    你来不及跑 —— 于是你**融进了地板**。
    他从你上面踩过去，在屋里翻了一遍，骂了一句，走了。
    你重新聚起来的时候，衣服上有一块怎么洗都洗不掉的印子。
  group: 那间屋子的地板一直有一块颜色很深。
daily_limit: 1

options:
  - key: '1'
    label: 重新聚起来，看看那块印子
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你低头看。印子在袖口。
      **而它是从里面透出来的** —— 你翻过来看里衬，里衬是干净的。
  - key: '2'
    label: 顺着他的脚印追出去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你追出去了。他走得不快。
      **而你跟到街口就停下了** —— 因为你忽然想不起自己为什么要追。
  - key: '3'
    label: 再融一次，这次试试移动
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又融了一次，往前挪了一段。
      **挪的过程中你听见了屋里所有的声音** —— 一起涌进来，而你分不出哪一个是自己的。
