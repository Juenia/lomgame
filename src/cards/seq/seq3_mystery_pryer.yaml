# 原著依据：《诡秘之主》途径「隐者」序列 3「预言大师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：真切接触窥秘权柄；预言：可预言自己某个选择的后果，或窥探接下来最好的选择
id: seq3_mystery_pryer
name: 最好的那个选择
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 4 }
  - { mad: 1 }
texts:
  priv: |
    你把摆在面前的三条路各看了一遍。
    第一条走到一半就断了，第二条会有人死，**第三条最好**。
    你选了第三条。
    走在路上你一直在想：那第二条里的人，本来是谁。
  group: 有人站在路口很久，最后走了一条很绕的路。
daily_limit: 1

options:
  - key: '1'
    label: 走第三条，不回头
    effects: [ { dig: 4 } ]
    text: |
      你走了。
      走到一半你回头看了一眼 —— **那条断掉的路还在那儿断着**。
  - key: '2'
    label: 把三条路重看一遍，确认
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你重看了一遍。第三条最好，而**第二条也不差**。
      差的只是那一个人的命。
  - key: '3'
    label: 记住第二条里那个人是谁
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你想起来了。**那是一个你认识的人**。
      而在你选的这条路上，他从没出现过 —— 你也不打算去问为什么。
