# 原著依据：《诡秘之主》途径「红祭司」序列 1「征服者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：征服：让目标身心灵都想要臣服；被彻底征服者永远效忠；可直接操控生物身体按自己意志行动
id: seq1_hunter
name: 永远效忠
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 4 }
  - { dig: 2 }
texts:
  priv: |
    你站在他对面，说了一句：「**跪下。**」
    他跪了 —— 不是被按下去的，是自己跪的。
    他抬头看你，眼睛里有东西。
    从那天起他就没再走过。
  group: 那个人从那天之后一直跟着别人，谁劝都不走。
daily_limit: 1

options:
  - key: '1'
    label: 让他起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说：「起来。」他站起来了。
      **而他的眼睛一直没离开你** —— 从那天起就没离开过。
  - key: '2'
    label: 问他是谁
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说了个名字。而那个名字你听过。
      **在一份阵亡名单上** —— 你昨天刚翻过那一页。
  - key: '3'
    label: 再对他下一道命令
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你下了。他做得很快。
      **快得不像人** —— 而做完他又站回了原来的位置，一步不差。
