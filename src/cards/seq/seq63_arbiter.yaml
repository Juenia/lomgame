# 原著依据：《诡秘之主》途径「审判者」序列 6「法官」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：囚禁：制造层层透明墙壁与粘稠透明液体，将目标凝固在原地，灵体也难以透过
id: seq63_arbiter
name: 凝固在原地
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你往前推了一下掌。
    **空气变稠了。** 看不见，但摸得到。
    他在里面动，动得很慢，像在水里。
    你在外面看着他，等他不动了才走开。
  group: 那条巷子里有人站了整整两个小时没动。
daily_limit: 1

options:
  - key: '1'
    label: 看着他不动，然后走开
    effects: [ { dig: 5 } ]
    text: |
      你站在外面看着。他还在动，只是越来越慢。
      **等他不怎么动了，你才转身** —— 走的时候听见身后很轻的一声。
  - key: '2'
    label: 把他从里面放出来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你松了手。他一下跪在地上，喘得像刚跑完十里地。
      **他抬头看你的第一件事是摸自己的胳膊** —— 他以为断了。
  - key: '3'
    label: 再加厚一层
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又推了一下。他连眼睛都转不动了。
      **而你在他面前站了很久** —— 看着那双还在动的眼珠。
