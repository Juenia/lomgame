# 原著依据：《诡秘之主》途径「倒吊人」序列 1「暗天使」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：黑暗权柄：可变出一片漆黑粘稠、满是堕落气息的海洋，将敌人攻击吞噬；或在敌人身上染黑液干扰
id: seq1_secrets_supplicant
name: 一片黑的海
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 1
  max_seq: 1
effects:
  - { cor: 5 }
  - { hp: 3 }
texts:
  priv: |
    那一击过来的时候，你**张开了一片海**。
    黑的，粘的，不流动 —— 那一击落进去，就没有了。
    连声音都没有。
    你把海收起来的时候，地上一点水迹都没留。
  group: 那间屋子昨晚有一股说不出的味道，今天没了。
daily_limit: 1

options:
  - key: '1'
    label: 把海收起来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你收了。地上一点水迹都没留。
      **而地砖的颜色深了一块** —— 深的正好是刚才那片海的形状。
  - key: '2'
    label: 伸手进去摸摸看
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你伸手进去摸。里面是软的。
      **而它一直在往下沉** —— 你的手够不到底。
  - key: '3'
    label: 再张开一次
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又张开了一次。这次那片海大了很多。
      **而它开始往外漫** —— 你赶紧收了回去。
