# 原著依据：《诡秘之主》途径「审判者」序列 3「混乱猎手」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：审判之剑：对混乱之物做出一次直接审判，无法躲避，目标越混乱效果越强
id: seq3_arbiter
name: 审判之剑
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    那东西身上全是乱的 —— 形状在变，颜色也在变。
    「**审判。**」你说。
    剑落下来的时候它没有躲。躲不了。
    它散得很干净，像从来没存在过。
  group: 那间屋子里的东西昨晚没了，一点痕迹都没留。
daily_limit: 1

options:
  - key: '1'
    label: 收剑，把屋子检查一遍
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走了一圈。地板上连灰都没有。
      **而刚才那东西在这儿待了三天** —— 三天里它一直坐在那张椅子上。
  - key: '2'
    label: 蹲下来看它散掉的地方
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你蹲下来看。那块地板的颜色比别处淡。
      **像被晒过** —— 而这是间没有窗的屋子。
  - key: '3'
    label: 对着下一个目标再用一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你抬头看窗外。街上那个人回头看了你一眼。
      **然后他开始跑** —— 而你不知道自己是什么时候把剑举起来的。
