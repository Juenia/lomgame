# 地点专属（M2.87）。地点：「莱茵河」（rhine_river，危险度 3）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_rhine_river
name: 河底的石阶
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:莱茵河'
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    水很清，能看见底下。
    河底有一段石阶 —— 修得很整齐，一级一级往下。
    **是往更深处去的。**
    你没有下去。你在岸边坐了一会儿。
  group: 莱茵河底有一段石阶，修得很好，不知道去哪。
daily_limit: 1

options:
  - key: '1'
    label: 下水顺着石阶走两步
    effects: [ { dig: 7, hp: 2, cor: 3, mad: 4 } ]
    text: |
      你下去了。水很凉。石阶很稳。
      **走到第三步的时候** —— 你脚下的那一级比上面宽得多。
  - key: '2'
    label: 在岸边坐着看它通到哪
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你坐着看。石阶一直往下，看不到头。
      **而水到某一个深度就看不见了** —— 那一层的水是黑的。
  - key: '3'
    label: 问河上的人这段石阶的事
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      他们说不清。
      **而船家说他爷爷那辈就有** —— 那时候河比现在浅。
