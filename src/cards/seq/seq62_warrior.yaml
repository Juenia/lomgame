# 原著依据：《诡秘之主》途径「黄昏巨人」序列 6「黎明骑士」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：光之风暴：将晨曦之剑插入地面让它崩解，光芒碎片组成闪烁而狂暴的锐利飓风，切割阴影与邪异
id: seq62_warrior
name: 光之风暴
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:warrior'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 4 }
  - { dig: 2 }
texts:
  priv: |
    你把剑插进地里。
    **它碎了** —— 碎成数不清的光点。
    那些光点转了起来，越转越快，成了一阵风。
    等风停下，那条巷子里所有的暗处都没有了。
  group: 那条巷子昨晚亮过一次，亮得像白天。
daily_limit: 1

options:
  - key: '1'
    label: 等风停下来，看清这条巷子
    effects: [ { dig: 4 } ]
    text: |
      风停了。那条巷子里**所有的暗处都没有了** ——
      连墙缝里都干净。你以前不知道这条巷子有这么长。
  - key: '2'
    label: 伸手去接那些光点
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      光点穿过你的手指，没有散。
      你合掌的时候它们在里面转了一下 —— **像被关住的东西**。
  - key: '3'
    label: 站在风的正中间不动
    effects: [ { dig: 7, mad: 3, hp: 3 } ]
    text: |
      那些光从你身上切过去，像刀子。
      你站到风停为止。**身上没有伤口，但你三天听不清声音。**
