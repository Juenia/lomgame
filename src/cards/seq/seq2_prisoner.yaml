# 原著依据：《诡秘之主》途径「被缚者」序列 2「古代邪物」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有直接攻击和影响灵体的能力；部分诅咒权柄；变形诅咒可让被映在眼眸内的目标变成其他生物
id: seq2_prisoner
name: 映在眼里
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 2
  max_seq: 2
effects:
  - { cor: 4 }
  - { hp: 3 }
texts:
  priv: |
    他站在你面前，很强，很自信。
    **你看了他一眼。** 就一眼。
    他僵住了 —— 手还是举着的，但已经不是手了。
    一只很小的东西落在地上，你绕开它走了。
  group: 那个人昨天还在，今天不见了，他家里人说养了只不认识的鸟。
daily_limit: 1

options:
  - key: '1'
    label: 绕开那只小东西走
    effects: [ { dig: 5 } ]
    text: |
      你绕开它走了。它在原地扑了一下。
      **而你走出去之后** —— 身后就没有声音了。
  - key: '2'
    label: 低头看看那是什么
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你低头看。是一只很小的鸟。
      **它已经不动了** —— 而它的眼睛还在转，跟着你转。
  - key: '3'
    label: 去他家里看看
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你去了。他家里人说养了只不认识的鸟。
      **而那只鸟一看见你就飞了** —— 飞得很高，一下就没了。
