# 原著依据：《诡秘之主》途径「红祭司」序列 9「猎人」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：获得一些野生植物、动物器官的知识，受伤后能迅速找到合格的止血药
id: seq93_hunter
name: 止血药
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    你在林子里割了手，血流得不少。
    你没有慌 —— 你蹲下来，在脚边摘了三样东西。
    **揉碎了按上去，血止住了。**
    你把手举起来看了看。这套东西你从没学过。
  group: 有人从林子里出来，手上缠着草叶。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下，接着走
    effects: [ { dig: 5 } ]
    text: |
      你把手放下，出了林子。
      **走到路上你才发觉** —— 手上的草叶还在，而血一点没渗出来。
  - key: '2'
    label: 把那三样东西认清楚
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你摘了三样又看了看：一种叶子带齿的，一种开小黄花的，
      **还有一种你不认识** —— 而它才是止血的那个。
  - key: '3'
    label: 再割一刀试试
    effects: [ { dig: 7, hp: 3, cor: 3 } ]
    text: |
      你又割了一刀，这次深一点。血止得更快。
      **而你没有再摘第三样** —— 你记住了它的样子。
