# 原著依据：《诡秘之主》途径「门」序列 1「星之匙」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有定位权柄：自身永不迷失并让敌人无法定位；时空迷宫：可制造时间混乱或空间循环的迷宫
id: seq1_door
name: 时间就是空间
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 5 }
  - { mp: 3 }
texts:
  priv: |
    他追着你进了那条巷子。
    你在墙上刻了一刀。
    **他在那里走了四十分钟。** 走过的每一步都回到原点 —— 但天在变黑。
    你早走了。
  group: 那条巷子有人走了一夜都没走出去。
daily_limit: 1

options:
  - key: '1'
    label: 走掉，不回头
    effects: [ { dig: 5 } ]
    text: |
      你走出巷口，拐了弯。
      **身后没有一点声音** —— 那不是安静，那是他在原地走。
  - key: '2'
    label: 站在巷口看他走
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你站在巷口。他走了四十分钟。
      **而天在变黑** —— 他一直在原点，而他的影子越来越长。
  - key: '3'
    label: 走进去陪他走一段
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走进去了。你和他一起走。
      **而你走了三步就出来了** —— 他在里面喊了一声，你没有回头。
