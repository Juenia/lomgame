# 原著依据：《诡秘之主》途径「门」序列 9「学徒」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：学徒们追寻着自由的足迹，不管是墙壁还是大门，都无法阻止他们通过
id: seq92_door
name: 一堵墙
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:door'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    那条巷子是死的，尽头是墙。
    后面的人追得很紧。
    你走到墙前面，伸手按了一下。
    **墙是软的。** 你走过去，墙合上了。
  group: 那条死巷昨天有人进去，没有人出来。
daily_limit: 1

options:
  - key: '1'
    label: 走过去，不停
    effects: [ { dig: 5 } ]
    text: |
      你走过去。墙在你经过的时候张开了。
      **身后传来追你的人撞在墙上的声音** —— 很闷。
  - key: '2'
    label: 回头看看墙合上没有
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。墙合上了。
      **平平整整，连砖缝都对得上** —— 而刚才你是从那里过来的。
  - key: '3'
    label: 再按一次，这次不进去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又按了一次。墙是软的。
      **而这一次你感觉到里面有什么东西也在按** —— 从另一侧。
