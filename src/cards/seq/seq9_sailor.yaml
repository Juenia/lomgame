# 原著依据：《诡秘之主》途径「暴君」序列 9「水手」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：拥有卓越的力量；在水中灵活得仿佛海族；平衡：哪怕在暴风雨笼罩的船上，也能自由行走如大地
id: seq9_sailor
name: 像在平地
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    船在浪里横过来，甲板斜得像一面墙。
    别人抓着缆绳趴着，你从船头走到船尾，手里还端着杯子。
    水没有洒出来。
    老水手看了你一眼，什么也没说 —— 但那一眼里有些别的东西。
  group: 甲板上所有人都趴着的时候，有个人在走路。
daily_limit: 1

options:
  - key: '1'
    label: 把杯子搁在栏杆上
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把杯子搁在栏杆上。它稳稳地站着。
      **而甲板还在斜** —— 斜到那些人抓的缆绳都绷直了。
  - key: '2'
    label: 回头看那些趴着的人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。他们都在看你。
      **而他们没有一个人站起来** —— 连老水手也没有。
  - key: '3'
    label: 走到船尾去看后面的浪
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走到船尾。浪比船高出一倍。
      **而船底是干的** —— 你摸了摸栏杆，一点水都没有。
