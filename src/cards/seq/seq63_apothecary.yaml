# 原著依据：《诡秘之主》途径「月亮」序列 6「魔药教授」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：药水有保质期，不同种类可能冲突带来不好的影响，魔药教授会尽量控制每次服食的种类和数量
id: seq63_apothecary
name: 会冲突
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: -2 }
  - { dig: 3 }
texts:
  priv: |
    你算错了。
    两瓶东西在肚子里撞上了，从胸口一直烧到指尖。
    **你蹲在墙根吐了很久。**
    吐完之后你在本子上把这两样划掉了，旁边写了两个字：不能同服。
  group: 有人在巷子里吐了半个钟头，起来之后一直在写东西。
daily_limit: 1

options:
  - key: '1'
    label: 把禁忌写清楚一点
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你在「不能同服」旁边又补了一行：
      **间隔不足两个时辰，会烧穿胃** —— 这个「两个时辰」是你用一晚换来的。
  - key: '2'
    label: 弄明白它们为什么冲突
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你翻了三本书。
      **那两样东西的药性走的是同一条路** —— 而那条路只有一条，谁先上谁说了算。
  - key: '3'
    label: 再试一次，这次减一半
    effects: [ { dig: 6, hp: 3, cor: 2 } ]
    text: |
      你减了一半。这次烧到喉咙就停了。
      **而你知道剂量线在哪了** —— 就在那半瓶之间。
