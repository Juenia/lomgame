# 原著依据：《诡秘之主》途径「隐者」序列 1「知识皇帝」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：知识皇帝：能利用灵界汇聚的信息，能影响七光；更深入的神秘知识权柄：能将实质力量赋予抽象知识
id: seq1_mystery_pryer
name: 把力量给知识
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 5 }
  - { mp: 3 }
texts:
  priv: |
    你把那本书翻开，读了一页。
    **那一页上的字开始发烫** —— 不是热，是它们变成了能用的东西。
    你把它合上，手里多了一点力气。
    「知识就是力量」这句话，在你这里是字面意思。
  group: 那本旧书昨天翻了页，今天自己回到了原处。
daily_limit: 1

options:
  - key: '1'
    label: 把书合上，收好那点力气
    effects: [ { dig: 4 } ]
    text: |
      你合上书，把手在裤子上擦了擦。
      **那点力气是凉的** —— 像刚从井里提上来的水。
  - key: '2'
    label: 再读一页
    effects: [ { dig: 7, mad: 2, hp: 2 } ]
    text: |
      第二页的字也开始烫。
      你低头看手背 —— **浮起了一行很淡的印子**，正是刚读过的那几行。
  - key: '3'
    label: 查这本书是谁写的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      扉页上有一个名字，被人用力划掉了。
      你把它对着光看 —— **划痕下面还看得见笔画**。
