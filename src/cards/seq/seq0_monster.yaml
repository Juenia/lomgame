# 原著依据：《诡秘之主》途径「命运之轮」序列 0「命运之轮」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：一定程度上等于命运的化身，能于命运长河中遨游；命运象征衍化而来的命运权柄，既是好运也是厄运，更擅长预知
id: seq0_monster
name: 既是好运也是厄运
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:monster'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { mad: 2 }
texts:
  priv: |
    **你看见了那条河。**
    很长，分叉很多，每一条上都有人。
    你看见有人在这条上活到八十，在另一条上死在二十。
    你没有改。你看了一会儿，退了出来。你说不清自己是什么感觉。
  group: 那位算命的老头昨天说他看见过一些东西，然后就不肯再说了。
daily_limit: 1

options:
  - key: '1'
    label: 退出来，记住自己看见了什么
    effects: [ { dig: 7, dp: 1 } ]
    text: |
      你记住了三段。其中一段上的人你认得。
      **他还活着** —— 而你昨天刚见过他。
  - key: '2'
    label: 在河上改一笔
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你改了一笔。那一条上的光暗了一下。
      **而你不知道改的是谁** —— 你只是改了一条最亮的。
  - key: '3'
    label: 再看一遍自己那条
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你找了自己那条。它分叉最多。
      **而每一条都还在往前长** —— 你看不出哪一条是现在这条。
