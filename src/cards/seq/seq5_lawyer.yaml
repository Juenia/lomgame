# 原著依据：《诡秘之主》途径「黑皇帝」序列 5「混乱导师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：混乱：使目标或区域出现混乱，让攻击难以落到自己身上，让距离的衡量标准混乱
id: seq5_lawyer
name: 砍偏了一尺
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    刀是冲你脖子来的。
    **它砍偏了 —— 偏了整整一尺。**
    那个人愣了一下，又砍了一刀。还是偏。
    你站在原地，看着他砍了四次，一次都没沾到。
  group: 那场架打得很奇怪，一个人砍了四次都没砍到。
daily_limit: 1

options:
  - key: '1'
    label: 站着看他砍第五次
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他砍了第五次。这次偏得更多 —— 偏了两尺。
      **而他砍完自己站在那里看了很久** —— 看的是自己的手。
  - key: '2'
    label: 往旁边挪一步
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你挪了一步。他的刀跟着偏了一尺。
      **而你没动过他的手** —— 你连看都没看那把刀。
  - key: '3'
    label: 让他把刀放下
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你说了一句。他把刀放下了。
      **放得很慢** —— 眼睛一直盯着你，直到刀落地。
