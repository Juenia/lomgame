# 原著依据：《诡秘之主》途径「完美者」序列 2「知识导师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可转化为与文明画卷有关的信息生物；一定规律权柄：能对物理规律进行一定程度的改变
id: seq2_perfect
name: 规律松了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 4 }
  - { mp: 2 }
texts:
  priv: |
    你把屋里那盆水点着了。
    **它烧起来了** —— 蓝的，不烫手。
    看的人都不敢动。
    「规律不是不可以商量的，」你说。然后你把火收了起来。
  group: 有人亲眼看见一盆水烧了起来。
daily_limit: 1

options:
  - key: '1'
    label: 把火收起来
    effects: [ { dig: 4 } ]
    text: |
      你伸手一按，蓝色的火灭了。水还是水，凉的。
      看的人过了好几秒才敢动 —— **他们刚才看见的不是火，是「那件事可以商量」**。
  - key: '2'
    label: 让它一直烧着
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走了。第二天那盆水还在烧。
      屋里的人已经不再看它了 —— **习惯是最快的那一步**。
  - key: '3'
    label: 再试一样别的东西
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你点着了墙。砖烧起来了，蓝的。
      你把它按回去的时候手在抖 —— **墙回来之后，屋里那股冷气还在**。
  - key: '4'
    label: 告诉他们为什么能烧
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你讲了一半就停了。
      听的人里有一个在记 —— **那比火本身麻烦得多**。
