# 原著依据：《诡秘之主》途径「魔女」序列 9「刺客」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能短时间内让身体获得羽毛般的轻盈，拥有鹰的视力和黑暗视觉
id: seq93_assassin
name: 鹰的视力
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    隔了两条街，你看见了那扇窗。
    **窗台上有一道新划痕。** 别人看不见，你看得见。
    你顺着视线找下去，在楼下的石缝里找到了对应的痕迹。
    你没有上去。你只是记住了那个位置。
  group: 有人在街口站了很久，一直看着同一扇窗。
daily_limit: 1

options:
  - key: '1'
    label: 记住位置，转身走开
    effects: [ { dig: 5 } ]
    text: |
      你转身走了。走出去两条街，你在纸上画了那扇窗的位置。
      **画得很准** —— 你只看了一眼。
  - key: '2'
    label: 上楼去看看那扇窗
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你上去了。窗是锁的，窗台上有半个鞋印。
      **比你的小一号** —— 而那道划痕是新划的，就在鞋印旁边。
  - key: '3'
    label: 在楼下等那个人回来
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你等到半夜。回来的不是一个人，是两个。
      **其中一个一直低着头** —— 而另一个走路的姿势你认得。
