# 原著依据：《诡秘之主》途径「门」序列 6「记录官」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：记录：能以精神为笔、灵体为纸，记录并使用其他人展现的非凡能力
id: seq6_door
name: 我来到我看见我记录
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
texts:
  priv: |
    他出手的时候你在旁边看着，看得很仔细。
    「我来到，我看见，我记录。」你念完这句，手心里多了点东西。
    **你也能了 —— 用一次。**
    他回头看你，你把手背到身后。
  group: 那个人只是看着，什么也没做 —— 但他记住了。
daily_limit: 1

options:
  - key: '1'
    label: 把手背到身后，什么都不做
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把手背到身后。他看着你，看了很久。
      **然后转回去接着练** —— 而他念的时候比刚才慢了一拍。
  - key: '2'
    label: 当场把那一次用掉
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你用掉了。手心里那样东西不见了。
      **而对面那面墙多了一道痕** —— 很浅，像被手指划过。
  - key: '3'
    label: 问他这句话是从哪来的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说是别人教的。而教他的人三年前就死了。
      **他说的那个名字你认得** —— 而你也认识那个人。
