# 原著依据：《诡秘之主》途径「月亮」序列 7「吸血鬼」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：颜值提升，魅力提升
id: seq73_apothecary
name: 颜值
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    你照镜子的时候停了一下。
    还是你，眉眼都是你的。
    **但有些东西变了** —— 说不清是哪一处。
    出门的时候，街上的人看你的时间比以前长。
  group: 那家铺子的老板娘最近总往街上多看几眼。
daily_limit: 1

options:
  - key: '1'
    label: 对着镜子多看一会儿
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你看了很久。
      **是眼睛下面那条线变了** —— 它比昨天浅，而昨天你刚熬了一夜。
  - key: '2'
    label: 出门走走，看别人怎么看
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你走了两条街。有三个陌生人回头看你。
      **而他们看的不是你穿什么** —— 你看得出来那种眼神。
  - key: '3'
    label: 再调一次，让它更明显些
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你照着镜子又调了一次。
      **这一次你自己都愣了两秒** —— 镜子里那个人，你有点陌生。
