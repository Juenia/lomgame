# 原著依据：《诡秘之主》途径「隐者」序列 6「卷轴教授」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能制作卷轴，念出咒文后卷轴燃烧并释放其中能力
id: seq6_mystery_pryer
name: 纸烧完的时候
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 6
  max_seq: 6
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你从袖子里抽出一卷纸，念了三个词。
    纸自己烧了起来 —— 很快，像被谁从里面点着了。
    **烧完的时候那面墙塌了。**
    你把剩下的灰捻了捻，收好。还有两卷。
  group: 那面墙塌了，而站在旁边的人手里只有一张纸。
daily_limit: 1

options:
  - key: '1'
    label: 再抽一卷，烧同一面墙
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      第二卷也烧完了。
      **那面墙后面露出一扇门** —— 门框是石头的，而整栋楼都是砖的。
  - key: '2'
    label: 把灰收好，留着
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你把灰捻了捻，收进一个小瓶。
      **那点灰比纸重** —— 掂在手里你才知道烧掉的到底是什么。
  - key: '3'
    label: 问旁边那个人看见了什么
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说只看见一张纸。
      而你看见他手里那张纸的角 —— **是焦的**。
