# 原著依据：《诡秘之主》途径「隐者」序列 0「隐者」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：知识（信息）象征下偏神秘的那部分权柄；可让下属途径的真神乃至序列 1、2 化身成庞杂的信息洪流
id: seq0_mystery_pryer
name: 信息洪流
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { mp: 4 }
texts:
  priv: |
    那个人在你面前**散开了**。
    不是死，是散成一股一股的东西 —— 很杂，很多，像一整座图书馆被吹散。
    那些东西从你身边过去的时候，你听见了很多句话。
    等它重新聚起来，那个人还是那个人，但他看了你一眼。
  group: 有人亲眼看见一个人散开又聚起来。
daily_limit: 1

options:
  - key: '1'
    label: 站着受完那阵洪流
    effects: [ { dig: 7, mad: 3, cor: 2 } ]
    text: |
      你没有躲。一整座图书馆从你身上过了一遍。
      **你记住了其中三句** —— 代价是之后三天你说话会串行。
  - key: '2'
    label: 伸手从里面抓一句
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你抓了一句。
      **那不是给活人听的话** —— 你把它攥在手里，它一直有点烫。
  - key: '3'
    label: 等他聚起来，问他什么感觉
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说没有感觉。
      而他看你那一眼是**认出来了** —— 他认出你刚才也在里面。
