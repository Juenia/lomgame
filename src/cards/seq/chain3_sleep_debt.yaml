# 事件卡链（M2.87）—— **三级链的第三段（终点）**。
# 前置链：第一段设 `sleep` → 第二段读它、设 `sleep_debt` → 本卡读 `sleep_debt`。
# 本卡**不再设新 flag** —— 链到此为止。
id: chain3_sleep_debt
name: 补不回来了
trigger:
  type: daily
  weight: 10
  cond:
    - 'flag:sleep_debt'
effects:
  - { hp: -3 }
  - { mad: 3 }
texts:
  priv: |
    你开始睡很久 —— 一睡就是十几个钟头。
    醒来还是累。
    **今天你睡了二十个钟头**，醒来的时候天又黑了。
    你坐在床上，分不清是早上还是晚上。
  group: 那个人这两天一直没出门。
daily_limit: 1
