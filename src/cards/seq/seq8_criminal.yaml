# 原著依据：《诡秘之主》途径「深渊」序列 8「折翼天使」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：从此失去良知，与恶欲同流；能得到些恶魔的类法术能力
id: seq8_criminal
name: 没有阻力
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 8
  max_seq: 8
effects:
  - { cor: 2 }
  - { hp: 2 }
texts:
  priv: |
    你在想一个很坏的办法。
    想完之后你等了一下 —— 等心里那点不该有的东西起来。
    **什么都没有。** 没有犹豫，没有恶心，什么都没有。
    你把这件事记了下来。不是记给别人看的，是记给自己看的。
  group: 那天之后，他做事的语气变了。
daily_limit: 1

options:
  - key: '1'
    label: 把这件事记下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你写了三行。写完把纸折起来。
      **折的时候手很稳** —— 而这件事本身就该让你不稳。
  - key: '2'
    label: 再想一个更坏的
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又想了一个。这次你连等都没等。
      **想完就直接做了** —— 做完你才想起自己本来是要等的。
  - key: '3'
    label: 试着让自己恶心一次
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你对着镜子试了很久。最后你笑了一下。
      **而你自己都不知道那算不算成功** —— 镜子里那个人看着挺正常。
