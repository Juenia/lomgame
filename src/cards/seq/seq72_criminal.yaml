# 原著依据：《诡秘之主》途径「深渊」序列 7「连环杀手」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能对占卜和通灵进行有效干扰
id: seq72_criminal
name: 占卜不到
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:criminal'
  min_seq: 7
  max_seq: 7
effects:
  - { cor: 2 }
  - { dig: 2 }
texts:
  priv: |
    有人来查过。
    他们带了占卜师，一个很老的。
    她站在门口算了一会儿，摇头说这里没有东西。
    **你就在门后面站着。** 她走的时候往这边看了一眼，什么也没看见。
  group: 那间屋子被查过三次，什么都没查到。
daily_limit: 1

options:
  - key: '1'
    label: 站在门后等她走远
    effects: [ { dig: 5 } ]
    text: |
      你站在门后没动。脚步声一点点远了。
      **而她刚才站的地方** —— 地板上留了一个很浅的鞋印。
  - key: '2'
    label: 跟出去看她往哪走
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你跟了出去。她走出十几步停了一下。
      **然后径直往东边去了** —— 那边没有铺子，也没有人住。
  - key: '3'
    label: 让她再算一次，这次你收着
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      第二天她又来了。这次她算了很久。
      **算到最后她把牌收起来** —— 说「这里有人，但不算数」。
