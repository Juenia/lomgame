# 原著依据：《诡秘之主》途径「魔女」序列 8「教唆者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：教唆：主动使用可以让周围的人产生好感，诱发目标心底的某些念头或欲望
id: seq8_assassin
name: 他自己说的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    你跟酒馆里那个人聊了一刻钟，聊的都是天气和价钱。
    他忽然放下杯子，说了一件事 —— 一件他本来绝不会说的事。
    说完他自己愣住了。
    **你什么都没问。你只是让他自己想起来的。**
  group: 酒馆里有人忽然说了一件不该在这里说的事。
daily_limit: 1

options:
  - key: '1'
    label: 把话接回天气上
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说：「今年冬天来得晚。」
      **他松了一口气** —— 但一直在转自己的杯子，转了很久。
  - key: '2'
    label: 把他刚说的话重复一遍
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你把那句话原样重复了一次。他脸白了。
      **因为他刚才说的，不是他该知道的事** —— 他自己也刚意识到这一点。
  - key: '3'
    label: 问他是怎么想起来的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      他答不上来。他只说了一句：「**是你让我想的。**」
      说完他把钱压在杯子底下就走了 —— 走的时候没有看你。
