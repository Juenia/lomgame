# 原著依据：《诡秘之主》途径「黑皇帝」序列 9「律师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：擅长发现并利用规则的漏洞和对手的薄弱之处，靠秩序打击对手，创造出利于自身的氛围
id: seq92_lawyer
name: 按规矩赢
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:lawyer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
texts:
  priv: |
    那场官司本来是要输的。
    你把那几页条款翻了两遍，找到了一个逗号。
    **就凭那个逗号，你把整件事翻了过来。**
    对方律师到最后都没明白自己输在哪。
  group: 那桩本来必输的官司，昨天翻了。
daily_limit: 1

options:
  - key: '1'
    label: 把那个逗号指给他看
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你指给他看。他看了很久。
      **然后开始翻自己那份** —— 翻得很快，翻到纸都皱了。
  - key: '2'
    label: 不提那个逗号，让他自己找
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你没提。他找了三天。
      **第三天他来找你** —— 问是不是你。而你没有答。
  - key: '3'
    label: 把那一页撕下来留着自己用
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你撕了下来，收进内袋。
      **那份卷宗从此少了一页** —— 而归档的人什么都没发现。
