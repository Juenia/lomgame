# 原著依据：《诡秘之主》途径「审判者」序列 9「仲裁人」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：应对意外的出色格斗能力
id: seq93_arbiter
name: 格斗的底子
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 3 }
texts:
  priv: |
    酒馆里那把椅子是冲你后脑来的。
    你没有回头，往侧面让了半步。
    **让得很准** —— 椅腿擦着耳朵过去，砸在桌上。
    你转过身的时候，那个人还没把椅子放下来。
  group: 酒馆里那把椅子没砸到人，砸坏了桌子。
daily_limit: 1

options:
  - key: '1'
    label: 不回头，接着喝酒
    effects: [ { dig: 4 } ]
    text: |
      你端起杯子喝了一口。
      **那个人把椅子放下，坐回了自己的位子** —— 而他的酒还剩一半。
  - key: '2'
    label: 回头看看是谁
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回头。他站着没动。
      **而你认得他袖口那道磨痕** —— 那是常年握刀的人，不是喝多了的。
  - key: '3'
    label: 转过身，正对着他
    effects: [ { dig: 7, hp: 2, mad: 2 } ]
    text: |
      你把杯子放下，转过身。
      **他手里那把椅子举了很久** —— 最后放下了，放得很轻。
