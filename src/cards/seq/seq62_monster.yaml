# 原著依据：《诡秘之主》途径「命运之轮」序列 6「灾祸教士」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能主动引来不同程度的灾祸将目标波及；精神风暴直接影响对方精神体带来眩晕或心智迷失
id: seq62_monster
name: 越滚越大
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:monster'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    他跑的时候你什么都没做。
    先是被绊了一下，然后撞翻了摊子，然后有人揪住了他。
    **每一步都比上一步更糟。**
    你在街对面看着，一直没动。
  group: 那个人昨天跑了一路，一路上都在出事。
daily_limit: 1

options:
  - key: '1'
    label: 站着看到底
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你看到最后。他被两个人按在地上。
      **而他一直在喊不是他** —— 喊到嗓子哑。
  - key: '2'
    label: 走过去把摊子扶起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你过去把摊子扶正了。摊主谢了你。
      **而他的眼神一直在往街那头瞟** —— 瞟那个被按住的人。
  - key: '3'
    label: 再给他加一点
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又加了一点。第二天他连门都没敢出。
      **有人说他在家里坐了一整天** —— 坐的是一把断了一条腿的椅子。
