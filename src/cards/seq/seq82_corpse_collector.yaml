# 原著依据：《诡秘之主》途径「死神」序列 8「掘墓人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：死亡之眼：能进入灵性世界与死灵国度，从更高层次俯视敌人，找出重要节点
id: seq82_corpse_collector
name: 从上面看
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:corpse_collector'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 4 }
  - { cor: 2 }
texts:
  priv: |
    你站在地上，但你在**往下看**。
    那东西在你眼里成了一个结构 —— 像一张图，有几处是空的。
    **那几处就是它的弱点。**
    你睁开眼，抬手打在最空的那一处。
  group: 那东西昨天倒在一个很奇怪的位置上。
daily_limit: 1

options:
  - key: '1'
    label: 记住那几处空的位置
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你记下了位置。
      **那几处不在它身上，在它旁边** —— 像影子缺了几个角。
  - key: '2'
    label: 再打一处
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      你又打了一处。它缩了一下。
      **而缩的时候，那处空的地方暴露得更明显了** —— 你已经不用再去看第二遍。
  - key: '3'
    label: 试着往下再看得深一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你看得更深了。这次你看见的不是结构，是它的记忆。
      **里面有几张脸** —— 全是活人的，而其中一个你认得。
