# 原著依据：《诡秘之主》途径「月亮」序列 8「驯兽师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能辅助动物承受魔药成为超凡生物
id: seq82_apothecary
name: 它听得懂
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    那条狗瘦得只剩骨头，你给它喂了点东西。
    喂到第三天，你拿了一小瓶药出来。
    **它自己凑过来了。** 你不知道它怎么知道这是给它准备的。
    喂下去之后它抖了很久，然后站了起来 —— 眼睛是新的。
  group: 那条流浪狗跟了一个人走，再没见过。
daily_limit: 1

options:
  - key: '1'
    label: 再喂它一次
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      第四天它自己把碗推了过来。
      **它记得时间** —— 而狗不该记得时间，它连今天星期几都不知道。
  - key: '2'
    label: 跟着它走
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      它带你走了七条街，停在一扇门前。
      **门里有味道** —— 和你手里那瓶药一个味道，只是浓得多。
  - key: '3'
    label: 把剩下的药收起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把瓶子收进怀里。它看了你一眼。
      **那眼神像是失望** —— 而一条狗不该有那种眼神。
