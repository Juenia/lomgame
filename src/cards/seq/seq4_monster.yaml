# 原著依据：《诡秘之主》途径「命运之轮」序列 4「厄运法师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：厄运领域：目标进入一定范围后自然染上厄运（100~300 米）
id: seq4_monster
name: 一百米
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 2 }
  - { mad: 2 }
texts:
  priv: |
    他走进这条街的时候，你往旁边让了让。
    **一百米**，你在心里量过。
    他先是被绊了一下，然后伞骨断了，再然后鞋跟掉了。
    他很生气地骂了一句，走了。你站在原地，什么也没做。
  group: 那个人今天出门就没顺过，说是撞了邪。
daily_limit: 1

options:
  - key: '1'
    label: 看着他倒霉完
    effects: [ { dig: 5 } ]
    text: |
      你看完了。他骂完就走了。
      **而你一直站在原来的地方** —— 一步都没挪。
  - key: '2'
    label: 走过去看那块绊他的石头
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走过去。石板是平的。
      **而你刚才明明看见它翘起来过** —— 你蹲下来按了按，纹丝不动。
  - key: '3'
    label: 把范围再拉长一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把范围拉长了。他走到街尾的时候，天忽然下起了雨。
      **而别的街上没下** —— 你站在雨线外面，衣服是干的。
