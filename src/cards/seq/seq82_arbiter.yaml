# 原著依据：《诡秘之主》途径「审判者」序列 8「治安官」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可以指定一片区域为自己的辖区，约一个小镇；对辖区越熟悉越能发挥
id: seq82_arbiter
name: 辖区
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你在这条街上走了三个月，认识了每一个人。
    三个月之后的某天，你站住，在心里把这条街划了下来。
    **从那一刻起，街上发生了什么你都知道。**
    包括刚才那扇窗后面有人在看你。
  group: 那条街最近很太平，说不出为什么。
daily_limit: 1

options:
  - key: '1'
    label: 把那扇窗后面的人找出来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你抬头看。窗帘动了一下。
      **而你记住了那是第几户** —— 这条街上每一扇窗你都知道后面是谁。
  - key: '2'
    label: 把辖区再扩大一条街
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你又走了三个月。第二条街划进来的那天，你一夜没睡。
      **不是睡不着，是不能睡** —— 那一条街上发生的事，你现在全知道。
  - key: '3'
    label: 什么都不做，接着往前走
    effects: [ { dig: 5 } ]
    text: |
      你走完了这条街。
      **而你知道后面每一扇窗后面是谁** —— 这让你走路慢了很多。
