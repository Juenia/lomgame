# 原著依据：《诡秘之主》途径「月亮」序列 4「巫王」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能活到一千岁，之后必然衰败；需封印自身、沉眠于古堡深处的棺材内延续生命
id: seq4_apothecary
name: 棺材里的东西
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 4 }
  - { cor: 2 }
texts:
  priv: |
    你在一座古堡的地窖里找到了那口棺材。
    上面没有灰 —— 有人定期来擦。
    你把耳朵贴上去，里面有很轻的动静，像谁在翻身。
    **你没有打开它。** 你在旁边站了一会儿，然后出去了。
  group: 那座古堡的地窖里有一口棺材，一直有人打理。
daily_limit: 1

options:
  - key: '1'
    label: 站着听完那点动静
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你站了半个钟头。里面翻了三下身，然后安静了。
      **像是知道外面有人** —— 而且它不在乎。
  - key: '2'
    label: 把棺材上的灰擦干净
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把角落那点灰也擦了。擦的时候你摸到棺盖上刻了一行字。
      **那行字是你认得的写法** —— 而你不记得自己在哪里见过。
  - key: '3'
    label: 打开它
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你掀开了棺盖。
      **里面的东西已经醒了很久了** —— 它睁着眼，没有动，像在等你先说话。
