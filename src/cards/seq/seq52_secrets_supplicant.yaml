# 原著依据：《诡秘之主》途径「倒吊人」序列 5「牧羊人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：一次只能驱使一个灵魂；半神层次的灵体可以直接外放，但一次也只能一个
id: seq52_secrets_supplicant
name: 换一个
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 3 }
  - { dig: 2 }
texts:
  priv: |
    你在里面挑了一个。
    **换出来的那个很不高兴** —— 你能感觉到。
    新进去的那个安静下来了。
    「别闹，」你说，「下次叫你。」
  group: 那个人这两天一直在自言自语。
daily_limit: 1

options:
  - key: '1'
    label: 问新进去的那个感觉怎么样
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。它答得很慢。
      **说里面很暗** —— 但不难受。
  - key: '2'
    label: 把换出来的那个也安排好
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把它安置在屋角。它一直没动。
      **而屋里的温度低了两度** —— 你看了温度计。
  - key: '3'
    label: 再换一个
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又换了一个。这次进去的那个一直在笑。
      **笑得停不下来** —— 而你开始觉得那声音很熟。
