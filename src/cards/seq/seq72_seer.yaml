# 原著依据：《诡秘之主》途径「愚者」序列 7「魔术师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：火焰跳跃：借助灵界的特殊，在三十米范围内自身留下的火种和原本就有的火焰之间闪现
id: seq72_seer
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq52_assassin 撞了同一个名字，从本卡正文里另取一个短语。
name: 巷子两头的火
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:seer'
  min_seq: 7
  max_seq: 7
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你事先在巷子两头各点了一小堆火。
    他们堵住了这头。
    **你跳了。** 三十米。
    从另一头出来的时候，鞋底踩灭了那点火。
  group: 那条巷子两头昨天都有火，很小。
daily_limit: 1

options:
  - key: '1'
    label: 把两头的火种留着
    effects: [ { dig: 3 } ]
    text: |
      你回到那条巷子，在两处墙根各埋了一点引火的东西。
      这两堆火现在**只属于你** —— 三十米之内，你随时能回来。
  - key: '2'
    label: 贴着墙回去看清楚是谁
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      你从另一头绕回来，贴着墙根往那头发看。
      他们还在原地，正在纳闷人是怎么没的。**脸你看清了。**
  - key: '3'
    label: 再跳一次，试试能多远
    effects: [ { dig: 6, hp: 2, mad: 2 } ]
    text: |
      你把火种往外挪了几步，再跳。
      落点差了半尺，膝盖磕在石头上 —— 但**你知道了自己的边界在哪**。
  - key: '4'
    label: 这条路以后不走了
    effects: [ { dig: 2, dp: 1 } ]
    text: |
      你绕了很远的路回家。
      有些路走过一次就够了，**知道能跳过去，比再跳一次有用**。
