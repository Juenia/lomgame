# 原著依据：《诡秘之主》途径「黑皇帝」序列 1「弑序亲王」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分扭曲与定义权柄：通过重新定义与扭曲让原本秩序有利于自身，比如定义什么是替身、什么是本体
id: seq1_lawyer
name: 定义
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 4 }
  - { cor: 3 }
texts:
  priv: |
    刀插进你胸口的时候，你没有倒。
    「**这个不算我，**」你说。
    然后你从门后走了出来 —— 一直是你在门后。
    地上那个「你」慢慢糊了。他把刀拔出来，又插了一次，插的还是那个。
  group: 那个人捅了一个人三次，三次捅的都不对。
daily_limit: 1

options:
  - key: '1'
    label: 从门后走出来，看着他
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走出来了。他举着刀看你。
      **然后他又低头看地上那个** —— 而地上那个正在慢慢糊。
  - key: '2'
    label: 再说一句定义
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又定义了一次。这次地上那个也起来了。
      **屋里有三个你** —— 而他握着刀，不知道该对着哪一个。
  - key: '3'
    label: 让开，让他走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你让开了。他扶着门框出去。
      **走的时候一直没有背对你** —— 他是倒着走出去的。
