# 原著依据：《诡秘之主》途径「母亲」序列 2「荒芜主母」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握大地、荒芜、丰收、生命的部分权柄；可在任何环境下创造可食用植物，并在五十公里范围内促进生长
id: seq2_mother
name: 五十公里
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 5 }
  - { dig: 3 }
texts:
  priv: |
    那片戈壁已经三年没下过雨。
    你蹲下来，把手按在石头上。
    **五十公里。** 你能感觉到那个范围。
    第三天有人路过，看见那片石头缝里长出了能吃的东西。
  group: 那片三年没长东西的戈壁，忽然能种活了。
daily_limit: 1

options:
  - key: '1'
    label: 把范围再往东扩二十公里
    effects: [ { dig: 7, hp: 3, mad: 2 } ]
    text: |
      你推过去。推完之后你跪在地上喘了很久。
      **抬头的时候，东边那片石头缝里已经在冒绿了。**
  - key: '2'
    label: 守在这儿，等它长起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你守了三天。第三天有人在石头缝里摘了第一个果子。
      他没敢吃，先拿给你看 —— **你咬了一口，甜的。**
  - key: '3'
    label: 告诉附近的人这块地能种了
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他们不信，直到自己看见。
      那天晚上有人在你门口放了一小袋种子 —— **你收下了，没有敲门道谢。**
