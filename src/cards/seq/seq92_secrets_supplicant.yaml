# 原著依据：《诡秘之主》途径「倒吊人」序列 9「秘祈人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握了一定的祭祀知识和少量仪式魔法
id: seq92_secrets_supplicant
name: 祭祀的知识
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    桌上摊着一张纸，上面画着一个圆。
    你没有照着画，只是看了一眼。
    **你知道那个圆缺了什么。**
    你没有补上去 —— 有些仪式不该在这里完成。
  group: 有人在桌上画了一个缺口的圆，画完就走了。
daily_limit: 1

options:
  - key: '1'
    label: 把那张纸收起来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把纸折好收进怀里。第二天再打开。
      **那个缺口自己补上了** —— 补的线比你见过的任何一种都细。
  - key: '2'
    label: 问是谁画的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他们说不知道。
      **而纸是从一本旧书里撕下来的** —— 那本书还在架子上，缺了一页。
  - key: '3'
    label: 把缺口补上去
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你补了。补完的那一刻，屋里所有的蜡烛都亮了。
      **而它们本来没点** —— 一根都没点。
