# 原著依据：《诡秘之主》途径「太阳」序列 7「太阳神官」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：召唤圣光净化死灵；制造圣水
id: seq7_sun
name: 杯底的东西没了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 7
  max_seq: 7
effects:
  - { mp: 2 }
  - { hp: 2 }
texts:
  priv: |
    那壶水放了两天，杯底沉着一层黑的。
    你把它倒进杯子里，念了一句。
    **水变清了 —— 不是滤过的那种清，是杯底那点黑东西没了。**
    你喝了一口。味道很淡，像雨后的空气。
  group: 有人这两天一直在喝同一壶水，说它变干净了。
daily_limit: 1

options:
  - key: '1'
    label: 再倒一杯看看
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又倒了一杯。杯底是空的。
      **而那壶水是两天前的** —— 你记得很清楚。
  - key: '2'
    label: 把壶拿去给别人看
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你拿去了。他们都说这壶水本来就干净。
      **因为他们没看见杯底那层黑** —— 只有你看见了。
  - key: '3'
    label: 再念一句，对着别的东西
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你对着窗台上的花念了一句。花开了。
      **而它昨天已经枯了** —— 花瓣都是脆的。
