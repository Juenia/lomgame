# 原著依据：《诡秘之主》途径「命运之轮」序列 1「巨蛇」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分循环权柄（及下位保存与选择权柄）；遇到难以摆脱的危险可重启循环、逆转为胚胎
id: seq1_monster
name: 重启
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 5 }
  - { mad: 3 }
texts:
  priv: |
    你被围在中间，退路全断了。
    **你重启了。**
    再睁开眼的时候你躺在一个很暖的地方，什么都不记得，什么都不会。
    过了很久很久，你才重新长成现在这样。而这是第几次，你也说不清。
  group: 有人说那个人的长相跟十年前一模一样。
daily_limit: 1

options:
  - key: '1'
    label: 接受这一次的长相
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你照了照镜子。还是那张脸。
      **它一整年都没变过** —— 而别人一年要老一点。
  - key: '2'
    label: 想办法把这一次记住
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你开始写东西。写到第三本的时候你翻回第一本。
      **那上面的字你不认识** —— 而当天的日期你看得懂。
  - key: '3'
    label: 去查自己是第几次
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你查了。城里最早的记录是七十年。
      **而记录里有一张画像** —— 画得很像你，连眉毛的走向都一样。
