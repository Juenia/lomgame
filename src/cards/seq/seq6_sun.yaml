# 原著依据：《诡秘之主》途径「太阳」序列 6「公证人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可对非凡知识真实性做出公证；公证有效的能力可得到短暂提升，无效的会被削弱或驱散
id: seq6_sun
name: 这是真的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 6
  max_seq: 6
effects:
  - { mp: 2 }
  - { hp: 2 }
texts:
  priv: |
    那个人说他手里那块石头是有效的。
    「不，」你说，「**这是真的**。」
    石头亮了一下 —— 比刚才亮得多。
    那个人看着自己的手，脸色变了。他不知道自己拿的是什么。
  group: 旧货摊上那块石头忽然亮了一下，摊主愣住了。
daily_limit: 1

options:
  - key: '1'
    label: 让他把石头收起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说了。他把石头塞回了口袋。
      **而他的手一直在抖** —— 抖到扣不上扣子。
  - key: '2'
    label: 看看那块石头到底是什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看了。它不是石头。
      **它是某样东西的一小块** —— 而那样东西他这辈子都没见过。
  - key: '3'
    label: 再说一句，这次说得更肯定
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又说了。这次石头亮得整条街都看见了。
      **而摊主已经跑了** —— 他跑了，石头还在摊上。
