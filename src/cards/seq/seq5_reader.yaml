# 原著依据：《诡秘之主》途径「白塔」序列 5「秘术导师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握独特罕见的秘术，甚至能自行发明创造属于自己的法术
id: seq5_reader
name: 只对我有用
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    你花了两个月，发明了一个法术。
    很短，念起来像一句话的一半。
    **它只对你自己有用** —— 别人念了，什么也不会发生。
    你把这句话记在本子上，写在最末一页。
  group: 有人对着一页纸念了很久，然后笑了。
daily_limit: 1

options:
  - key: '1'
    label: 把这句话再念一遍
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又念了一遍。屋里什么都没变。
      **而你手里多了一点点凉** —— 凉得很轻，像握着一枚冰过的硬币。
  - key: '2'
    label: 把这句给别人念
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你让他念。他念完了，什么也没发生。
      **而他一直在看你** —— 念完之后他往后退了半步。
  - key: '3'
    label: 把本子最后那页烧了
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你把最后那页撕下来烧了。
      **灰是白的** —— 白得像纸没烧过，只是干了。
