# 原著依据：《诡秘之主》途径「红祭司」序列 2「天气术士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有让人追随效忠的魅力；火焰提升为紫色；对火焰的掌控大幅提升
id: seq2_hunter
name: 他们自己跟来的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 4 }
  - { dig: 2 }
texts:
  priv: |
    你从街上走过去，没有说一句话。
    走到街尾回头看 —— **后面跟了十几个人。**
    他们也不知道自己为什么跟着。
    其中有一个跪下来，说他愿意效忠。你说：「起来。」他没起来。
  group: 那条街上昨天有十几个人跟着一个人走，都不认识他。
daily_limit: 1

options:
  - key: '1'
    label: 回头让他们散开
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回头说：「散了吧。」散了一半。
      **剩下那几个站得更近** —— 近到你能听见他们的呼吸。
  - key: '2'
    label: 问那个跪着的人为什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说不知道。
      **他抬头看你的时候眼里有东西** —— 那东西你也说不上来。
  - key: '3'
    label: 继续走，让他们跟着
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你接着走。跟的人越来越多。
      **走到城门口的时候已经有四十几个** —— 而守门的人没有拦。
