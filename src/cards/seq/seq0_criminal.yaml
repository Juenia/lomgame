# 原著依据：《诡秘之主》途径「深渊」序列 0「深渊」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：部分堕落权柄：让所有身处其中者必然堕落，不仅诱发而且制造；部分污秽权柄
id: seq0_criminal
name: 让所有人堕落的环境
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:criminal'
  min_seq: 0
  max_seq: 0
effects:
  - { cor: 6 }
  - { mad: 3 }
texts:
  priv: |
    那条巷子以前只是脏。
    **现在不一样了。** 走进去的人出来之后都不太对。
    先是赌钱，然后是别的。半年之后那条巷子里的人什么都做得出来。
    他们谁都不觉得是自己变坏了。他们觉得世界本来就是这样。
  group: 那条巷子这两年越来越不太平。
daily_limit: 1

options:
  - key: '1'
    label: 在巷口站一会儿，看着他们
    effects: [ { dig: 6, cor: 3, mad: 2 } ]
    text: |
      你站了一刻钟。走出来的人没有一个看你。
      **而那才是你留下的东西** —— 他们不看，是因为他们不觉得有什么可看的。
  - key: '2'
    label: 让巷子扩到隔壁那条街
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你走过去了。第二天隔壁那条街也开始了。
      **先是赌，然后是别的** —— 而没人说得清是从哪一天开始的。
  - key: '3'
    label: 把巷子里的东西收回来一点
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你收了一点回来。巷子里的人当天晚上都睡了很久。
      **而第二天他们又聚在了一起** —— 收回来那一点，一天就长回去了。
