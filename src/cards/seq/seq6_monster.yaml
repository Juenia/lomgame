# 原著依据：《诡秘之主》途径「命运之轮」序列 6「灾祸教士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：会被动遭遇各种可预见的灾祸；能主动引来不同程度的灾祸
id: seq6_monster
name: 招牌掉了下来
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 2 }
  - { mad: 2 }
texts:
  priv: |
    你从那家铺子门口路过。
    什么都没做 —— 你连头都没抬。
    **招牌掉了下来**，砸在门槛上，碎成两半。
    店主跑出来骂天。你走过去了，走得很快。
  group: 那家铺子的招牌昨天自己掉下来了。
daily_limit: 1

options:
  - key: '1'
    label: 走快一点，离开
    effects: [ { dig: 5 } ]
    text: |
      你走得很快。身后店主还在骂天。
      **骂到一半停了** —— 大概是他自己也不知道该骂谁。
  - key: '2'
    label: 回头看那块招牌
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。断口是新的。
      **而招牌的另外半边还挂在那儿** —— 风一吹就晃，晃得很轻。
  - key: '3'
    label: 再从那家铺子门口走一次
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又走了一次。这次掉的是屋檐的一块瓦。
      **落在他脚边半尺的地方** —— 而他抬头看了看天。
