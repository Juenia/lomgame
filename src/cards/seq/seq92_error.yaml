# 原著依据：《诡秘之主》途径「错误」序列 9「偷盗者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：卓越观察：能直接感应到十米内的贵重物品，但无法分辨具体是什么
id: seq92_error
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq8_sun 撞了同一个名字，从本卡正文里另取一个短语。
name: 第三样在谁身上
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:error'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你站在街口，**知道十米内有三样值钱的东西。**
    两样在铺子里，锁着。
    **第三样在一个人身上** —— 你知道在哪个口袋，但不知道是什么。
    你没有动。有些事知道就够了。
  group: 有人在街口站了一会儿，什么都没做就走了。
daily_limit: 1

options:
  - key: '1'
    label: 什么都不做，走开
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走了。走出去十几步，那种感觉没了。
      **而你知道那个人还在那儿** —— 因为第三样还在他口袋里。
  - key: '2'
    label: 看清是哪一个
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你回头看了一眼。是个卖报的小孩。
      **而他也在看你** —— 他已经看了一会儿了。
  - key: '3'
    label: 把那第三样拿出来看看
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你走过去，从他口袋里把它拿了出来。
      **是一枚扣子** —— 而你不知道它为什么算值钱。
