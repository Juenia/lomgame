# 原著依据：《诡秘之主》途径「魔女」序列 7「女巫」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能干扰别人的占卜
id: seq73_assassin
name: 占卜被搅了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    占卜师在对面坐着，闭上了眼睛。
    她算了很久，眉头越皱越紧。
    **「不对，」** 她说，「今天算不出来。」
    你端起茶喝了一口。你什么都没做，只是想了一下。
  group: 那位占卜师昨天算了三次都是空的。
daily_limit: 1

options:
  - key: '1'
    label: 喝完茶，结账走人
    effects: [ { dig: 4 } ]
    text: |
      你把茶喝完，付了钱。
      **她一直坐在那儿没动** —— 而你走出门口的时候听见她在洗牌。
  - key: '2'
    label: 问她算的是什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      她说了。算的是你的名字。
      **而她根本不知道你叫什么** —— 她只是听人说过有这么一个人。
  - key: '3'
    label: 让她再算一次，这次你不动
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      她闭上眼，算了很久。
      **然后她睁眼看你，一句话没说就把牌收起来了** —— 收得很快。
