# 原著依据：《诡秘之主》途径「月亮」序列 0「月亮」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：月亮（生殖、繁殖等意象），代表灵性、植物、美丽、召唤、动物、人类、部分生命、部分黑暗与诡异；本身不是权柄而是象征
id: seq0_apothecary
name: 月亮换了位置
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:apothecary'
  min_seq: 0
  max_seq: 0
effects:
  - { hp: 5 }
  - { cor: 3 }
texts:
  priv: |
    那天晚上月亮**换了位置**。
    所有人都在看 —— 它不在该在的地方了。
    然后所有的植物都开始长。院子里的树第二天早上开了花。
    而那天夜里生下来的孩子，据说一生都不哭。
  group: 那天晚上月亮的位置不对，看见的人都说不出话。
daily_limit: 1

options:
  - key: '1'
    label: 记住它换到了哪儿
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你抬头看了很久。
      **它不在任何一张星图上画过的位置上** —— 你把它记在心里，比画下来准。
  - key: '2'
    label: 去看那些开了花的树
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      院子里的树开的是白花，比正常的早两个月。
      你摘了一朵 —— **第二天它就枯了**，而树上那些还开着。
  - key: '3'
    label: 去找那个不哭的孩子
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你找到了那户人家。孩子睁着眼看你，一声不响。
      他母亲说：「**他从来没哭过。**」—— 而他说这句话的时候，孩子在看你身后的门。
