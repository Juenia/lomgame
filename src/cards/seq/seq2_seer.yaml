# 原著依据：《诡秘之主》途径「愚者」序列 2「奇迹师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可借助过去的灵之虫复活，上限四次；能影响未来概率；可从历史孔隙召唤
id: seq2_seer
name: 第四次
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 5 }
  - { dig: 3 }
texts:
  priv: |
    这是第四次了。
    **你知道这是最后一次** —— 前三次你都记得，记得很清楚。
    你把手伸进那道缝里，从里面拿出了一样东西。
    那东西在很多年前就不存在了。
  group: 有人在一天之内从死里回来过好几次。
daily_limit: 1

options:
  - key: '1'
    label: 把东西收好，不再伸手
    effects: [ { dig: 4 } ]
    text: |
      你把它放进内袋，那道缝慢慢合上了。
      **第四次已经用掉了。** 剩下的每一次抬手，都要先想清楚值不值。
  - key: '2'
    label: 再伸一次手，看看还有什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你摸到了另一件东西。它在你手心里动了一下 —— **它认得你**。
      你把它拿出来的时候，那道缝没有立刻合上。
  - key: '3'
    label: 先把前三次的死法理清楚
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      三次都想得起来，三次都不同。
      你把它们排成一排看 —— **三次里有一次不是意外**。
