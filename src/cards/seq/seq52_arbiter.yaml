# 原著依据：《诡秘之主》途径「审判者」序列 5「惩戒骑士」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：有神秘学意义上的自我限制，擅长对抗审讯和交流；惩戒：可选定惩戒目标
id: seq52_arbiter
name: 我说的算
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    他一直在问，问得很凶。
    你一句都没答 —— 你只是选了。
    **第二天他摔断了腿。**
    第三天他来道歉，态度完全不一样了。
  group: 那个人前天还很凶，昨天就变了。
daily_limit: 1

options:
  - key: '1'
    label: 不解释，让他自己琢磨
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他道了歉就走了。
      **他走后你才把袖子放下来** —— 手心里全是汗。
  - key: '2'
    label: 告诉他为什么
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你说了。他听完脸色更白。
      **而他没有再问第三个问题** —— 他是聪明人，知道该在哪里停。
  - key: '3'
    label: 再用一次，看看底线在哪
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你对着一个路人试了一次。他第二天也摔断了腿。
      **而这一次你只是想看看** —— 这句话你自己听着都不像自己说的。
