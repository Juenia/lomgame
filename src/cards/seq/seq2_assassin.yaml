# 原著依据：《诡秘之主》途径「魔女」序列 2「灾难」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有天灾领域能力（暴雪、洪水、海啸、地震）；灾难还涵盖人祸，甚至能指向部分权柄与抽象概念
id: seq2_assassin
name: 天灾和人祸
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 2
  max_seq: 2
effects:
  - { cor: 3 }
  - { hp: 3 }
texts:
  priv: |
    你没有针对谁。
    你只是**想了一下**。
    第二天那座城下了雪 —— 六月。
    你看报纸的时候把那一页折了起来。
  group: 南方那座城下了六月雪，说是百年不遇。
daily_limit: 1

options:
  - key: '1'
    label: 把报纸那一页收好
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把那一页剪下来，夹进书里。
      **剪的时候你手很稳** —— 稳到自己都意外。
  - key: '2'
    label: 去那座城看看
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你去了。城里的人在铲雪。
      **六月，他们在铲雪** —— 而没有人问为什么，他们只是铲。
  - key: '3'
    label: 再想一次，想别的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你想了别的。第二天报纸上又有一页。
      **而这一次你没有剪** —— 你把它折起来，扔进了炉子。
