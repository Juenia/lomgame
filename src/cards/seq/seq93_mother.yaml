# 原著依据：《诡秘之主》途径「母亲」序列 9「耕种者」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能通过观察云朵、风等自然现象预测之后一段时间的天气
id: seq93_mother
name: 云和风
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你没有抬头，只是把手伸出窗外停了停。
    风是从下面上来的 —— **这个季节，这个方向的风会带来雨**。
    你说三天后有大雨。旁人说天这么晴。
    第三天下午，雨来了，比你说的还早两个钟头。
  group: 有人摸着风说三天后有雨，第三天真的下了。
daily_limit: 1

options:
  - key: '1'
    label: 告诉地里的人，让他们收仓
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他们收了半仓。
      第三天雨来的时候，**剩下那半仓泡了** —— 你说的是「有雨」，没说「有多大」。
  - key: '2'
    label: 再摸一次风，确认
    effects: [ { dig: 4 } ]
    text: |
      风还是从下面上来的。
      这一次你摸出了它**比刚才凉** —— 那才是雨要来的真正信号，你之前只是碰巧说对了。
  - key: '3'
    label: 记下来：什么风对应什么雨
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记了三年。
      第三年的时候你已经不用摸了 —— **看一眼天就知道，连湿气都能闻出来**。
  - key: '4'
    label: 试着让它早一点下
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你站在地里把手举起来。风停了一下，又走了。
      雨比原来早了两个钟头 —— **而你到现在都不知道那是不是你做的**。
