# 原著依据：《诡秘之主》途径「门」序列 0「门」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：门之概念（含空间、封印等权柄）：能打开或关上整个世界所有与门这个概念相关的事物
id: seq0_door
name: 所有的门
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:door'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { mp: 4 }
texts:
  priv: |
    **全世界的门同时开了一下。**
    城里所有的锁都弹开了。关着的、锁着的、封着的。
    只开了一下，然后又都合上。
    有几个人在这一个瞬间走了很远。
  group: 那天全城的锁同时弹开过一次，铁匠铺忙了半个月。
daily_limit: 1

options:
  - key: '1'
    label: 趁那一瞬间走很远
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你迈了一步。落地的时候你在城的另一头。
      **而那一瞬间已经过去了** —— 你回头看，街上的锁都还锁着。
  - key: '2'
    label: 记住哪几扇门开了
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你记下了位置。其中一扇是城里唯一没有锁的门。
      **而它本来有** —— 你昨天还从那扇门前走过。
  - key: '3'
    label: 自己再来一次
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你又推了一下。只有你面前那扇开了。
      **而它后面不是原来的房间** —— 里面比外面亮得多。
