# 原著依据：《诡秘之主》途径「倒吊人」序列 7「隐修士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：藏入阴影：可躲藏在阴影中，运用阴影的力量隐蔽地跟踪敌人
id: seq7_secrets_supplicant
name: 阴影让开了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 7
  max_seq: 7
effects:
  - { cor: 2 }
  - { dig: 2 }
texts:
  priv: |
    你退进墙角的阴影里，准备躲一会儿。
    **然后你发现你不需要躲** —— 影子自己往两边让开了，给你腾出一块地方。
    你站在那儿，看着街上的人一个个走过去。
    有一个人回头看了这个角落一眼，什么也没看见，走了。
  group: 那个墙角一直有影子，只是比别处深一点。
daily_limit: 1

options:
  - key: '1'
    label: 站在那块地方看街上的人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着看。走过去的人都没有往这边看。
      **只有一个人回头了** —— 回头之后他又往前走了。
  - key: '2'
    label: 试着往阴影里再走一步
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你往里走了一步。街上安静了。
      **而那不是安静** —— 是你听不见了，连自己的呼吸都听不见。
  - key: '3'
    label: 走出来，回头看那个墙角
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走出来回头看。那个墙角的影子比别处深。
      **而它是空的** —— 你刚才明明站在那里。
