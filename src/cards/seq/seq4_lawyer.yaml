# 原著依据：《诡秘之主》途径「黑皇帝」序列 4「堕落伯爵」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：赠予：能直接将某种负面状态赠予目标；利用：可让状态保持更长时间或提前结束
id: seq4_lawyer
name: 现在只想钱
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 4
  max_seq: 4
effects:
  - { cor: 2 }
  - { dig: 2 }
texts:
  priv: |
    那个人本来要动手的。
    你看了他一眼 —— **只是看了一眼**。
    他站在原地，手慢慢放下来。
    旁边的人后来说：他那天一直在数自己口袋里的钱，数了一下午。
  group: 有人昨天忽然开始反复数钱，谁叫都不理。
daily_limit: 1

options:
  - key: '1'
    label: 再看他一眼
    effects: [ { dig: 6, cor: 3, mad: 2 } ]
    text: |
      你又看了一眼。他口袋里掉了一张钱在地上。
      **而他连捡都忘了** —— 他还在数手里那叠。
  - key: '2'
    label: 把他口袋里的钱掏出来数
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你掏出来数了。一共十七张。
      **而他一直在旁边看着你数** —— 看到最后他伸手把数好的接了过去。
  - key: '3'
    label: 走开，让他自己醒
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走开了。第二天他又来数。
      **而他数的是同一叠** —— 一张都没少。
