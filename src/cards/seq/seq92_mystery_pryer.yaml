# 原著依据：《诡秘之主》途径「隐者」序列 9「窥秘人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：窥秘之眼比同序列看到的更多；还能看到周围正常看不到或不该看到的东西，正常无法关闭
id: seq92_mystery_pryer
name: 关不掉
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 4 }
  - { mad: 2 }
texts:
  priv: |
    你不想看，但你**关不掉**。
    街上每个人身上都叠着别的东西，墙上也有，天上也有。
    你低着头走路，走得很快。
    回到屋里关上门，那些东西还在门后面。
  group: 那个人走路一直低着头，别人跟他打招呼他都没听见。
daily_limit: 1

options:
  - key: '1'
    label: 逼自己抬头走
    effects: [ { dig: 6, mad: 3, cor: 2 } ]
    text: |
      你抬着头走了半条街。每个人都叠着别的东西。
      **有一个人的肩上坐着个小孩** —— 而那小孩在看你。
  - key: '2'
    label: 回家把门窗都堵上
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你把所有的缝都堵了，连钥匙孔都塞了纸。
      **门后面的东西还在** —— 它不出声，但你知道它在。
  - key: '3'
    label: 试着对其中一个说话
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你对着街上一个人身后的东西说了句话。
      **那个人停下来，回头看了一眼自己的肩膀** —— 他什么都没看见，但他打了个寒战。
