# 原著依据：《诡秘之主》途径「被缚者」序列 3「沉默门徒」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能附身在物体上；可在长久沉默中酝酿极致诅咒；变形诅咒：目标在一定时间内变成其他生物
id: seq3_prisoner
name: 张开嘴
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 3
  max_seq: 3
effects:
  - { cor: 3 }
  - { dig: 2 }
texts:
  priv: |
    那个人在骂你。
    你没有回嘴 —— 你只是张开了嘴，做出一个无声的尖啸。
    **他变成了一只鸟。** 很小的那种，落在地上扑了两下。
    你看了它一会儿，转身走了。他在你身后叫，但鸟叫不好听。
  group: 有人昨天晚上在街上看见一只鸟，一直在撞同一扇窗。
daily_limit: 1

options:
  - key: '1'
    label: 不再看它，走开
    effects: [ { dig: 5 } ]
    text: |
      你走了。身后那只鸟一直在叫。
      **叫得很难听** —— 而它一边叫一边往你这边跳。
  - key: '2'
    label: 回头看那只鸟在做什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。它在撞同一扇窗。
      **撞了很多次** —— 而窗是关着的，它每次都撞在同一个地方。
  - key: '3'
    label: 再张开一次嘴
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又张开嘴。这次没有声音。
      **而那只鸟掉了下来** —— 你把它捡起来，放进口袋。
