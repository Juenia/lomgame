# 原著依据：《诡秘之主》途径「深渊」序列 2「鲜血大公」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：恶意化身：恶意不灭，魔鬼不死 —— 可在目标心灵埋下恶意的种子，本体毁灭后能在其心里复活
id: seq2_criminal
name: 心里那颗种子
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 2
  max_seq: 2
effects:
  - { cor: 4 }
  - { hp: 3 }
texts:
  priv: |
    「你杀不死我，」你说。
    他不信，动了手。
    你确实倒了 —— 但他没走两步就停住了。
    **因为在刚才那一瞬间，你把一粒种子放进去了。** 他低头看自己的手，手在抖。
  group: 那个人杀了仇家，之后每天都不太对劲。
daily_limit: 1

options:
  - key: '1'
    label: 看她能撑多久
    effects: [ { dig: 6, cor: 3, mad: 2 } ]
    text: |
      你在地上躺着看她。她抖了三天。
      **第三天她来找你** —— 说想找个人说说话。
  - key: '2'
    label: 把种子收回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你想了一下，把它收了。她当场坐在地上。
      **像是卸了什么** —— 而她连自己卸了什么都说不出来。
  - key: '3'
    label: 再放一颗，放深一点
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又放了一颗。这次她连抖都没抖。
      **她只是安静下来** —— 安静得不像话。
