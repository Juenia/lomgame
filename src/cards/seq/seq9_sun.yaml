# 原著依据：《诡秘之主》途径「太阳」序列 9「歌颂者」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：体质得到增强；赞美太阳，用歌声带来勇气和力量，带来虔诚和服从；能消解恐惧
id: seq9_sun
name: 一句歌
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    巷口有个小孩在哭，怎么哄都不停。
    你从他旁边过，随口哼了一句 —— 没词，是小时候听来的调子。
    哭声停了。他抬头看你，眼睛很亮。
    **你自己心里那点说不清的东西也轻了一些。**
  group: 巷口的哭声停得很突然。
daily_limit: 1

options:
  - key: '1'
    label: 把那句哼完
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你哼完了。他一直在听。
      **听完他笑了** —— 然后就跑了，跑得很快。
  - key: '2'
    label: 问他是谁家的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了。他摇头。
      **而他一直在看巷子另一头** —— 那里什么都没有。
  - key: '3'
    label: 再哼一句别的
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又哼了一句。这次巷子两边的窗都亮了。
      **一盏接一盏** —— 而那些屋里的人早就睡了。
