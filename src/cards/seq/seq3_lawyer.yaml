# 原著依据：《诡秘之主》途径「黑皇帝」序列 3「狂乱法师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分阶层权柄：威严源自名义、阶位与实力，已可实质化为武器；嗓音也能让灵体颤抖
id: seq3_lawyer
name: 上位者
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    你开口的时候并没有喊。
    就是很平常地说了一句话。
    **屋里那个东西在抖。** 它没有形体，但你能看见它在抖。
    你说完第二句，它散了。
  group: 那间闹了很久的屋子，昨天安静了一夜。
daily_limit: 1

options:
  - key: '1'
    label: 说第三句
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了第三句。屋里安静下来。
      **安静得能听见隔壁的钟** —— 而那口钟昨天就停了。
  - key: '2'
    label: 退出去，回头看那间屋子
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你退出去看。屋子还是那间屋子。
      **而窗玻璃上有一道裂** —— 从里面裂的。
  - key: '3'
    label: 问旁边的人刚才听见了什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他说没听见什么。
      **只是觉得刚才有点冷** —— 而他说这话的时候在搓手。
