# 原著依据：《诡秘之主》途径「错误」序列 9「偷盗者」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：窃取：可以轻松窃取走目标口袋内的物品而不被发现；卓越观察：能直接感应到十米内的贵重物品
id: seq9_error
name: 什么时候拿的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你从人群里穿过去，走到街对面才发现手里多了样东西。
    是个小皮夹 —— 你完全不记得自己伸手。
    你回头看了一眼，失主还在原地跟人说话。
    你把皮夹放进自己口袋，走了两步，又停下来。**手比脑子快这件事，是要付代价的。**
  group: 街上有人的皮夹不见了，而他一直站在原地没动过。
daily_limit: 1

options:
  - key: '1'
    label: 把皮夹放回去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走回去了。皮夹回到他口袋里的时候他还在说话。
      **而他什么都没发觉** —— 你退开的时候他甚至往你这边笑了一下。
  - key: '2'
    label: 看看里面有什么
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你打开看了。里面有一张照片。
      **照片上的人你认得** —— 而那个人三年前就搬走了。
  - key: '3'
    label: 再试一次，这次盯着自己的手
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你盯着自己的手走进人群。它动了。
      **而你没有让它动** —— 你把手指一根根掰开的时候，它在用力。
