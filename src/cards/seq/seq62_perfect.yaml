# 原著依据：《诡秘之主》途径「完美者」序列 6「机械专家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：仪式魔法的水平会得到提升
id: seq62_perfect
name: 仪式也更好了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:perfect'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 2 }
  - { mp: 2 }
texts:
  priv: |
    同样的仪式，你做得比上个月快。
    **不是手快，是知道哪里可以省。**
    三样材料变成了两样，时间少了一半。
    效果没变。
  group: 那个人做仪式用的东西一次比一次少。
daily_limit: 1

options:
  - key: '1'
    label: 把省下来的材料扔掉
    effects: [ { dig: 4 } ]
    text: |
      你把那样东西扔进了炉子。
      看着它烧完你才知道 —— **原来省下来的可以这么多**，而以前你从没数过。
  - key: '2'
    label: 再省一样试试
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你把两样都去掉了。仪式还是成了。
      **成的时候屋里的空气薄了一层** —— 你吸了一口气，有点不够。
  - key: '3'
    label: 把改进写下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你写下省掉的是哪一样、为什么能省。
      **这一页以后比仪式本身值钱** —— 仪式会忘，写法不会。
