# 原著依据：《诡秘之主》途径「红祭司」序列 5「收割者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：弱点侦察：双眸变铁黑色，从神秘学角度发现目标的弱点；收割：附加到攻击上收割生命
id: seq5_hunter
name: 眼睛变黑了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你看着他的时候，眼前的东西变了 —— 他身上有几处颜色不一样。
    你自己看不见自己的眼睛。
    **但你看见他往后退了。**
    「你眼睛怎么了？」他问。你没答。
  group: 有人说昨晚看见一双眼睛是黑的。
daily_limit: 1

options:
  - key: '1'
    label: 把目光移开
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你把目光移开了。他身上那几处颜色恢复了正常。
      **而你眼前花了一会儿** —— 花到你看不清他的脸。
  - key: '2'
    label: 盯着那几处看
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你盯着看。其中一处开始动了。
      **它在他身上移了半寸** —— 而他一点感觉都没有。
  - key: '3'
    label: 告诉他自己看到了什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。他低头看自己的胸口。
      **那里什么都没有** —— 而他在看，看得很认真。
