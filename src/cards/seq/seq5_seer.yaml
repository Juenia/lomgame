# 原著依据：《诡秘之主》途径「愚者」序列 5「秘偶大师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能看到灵体之线；能通过操纵灵体之线直接影响目标的精神体、星灵体、心智体和以太体，控制对方身躯
id: seq5_seer
name: 你动了一下手指
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    你看得见他身上的线 —— 很细，从后脑一直垂到地上。
    **你动了一下手指。**
    他跟着动了，动作很自然，像自己要那么做。
    他自己都没有察觉。你把手放下了。
  group: 有人在街上走得好好的，忽然停下来，又走了。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下，走开
    effects: [ { dig: 3, mad: -1 } ]
    text: |
      你把手放回袖子里。他继续往前走，走了几步又停下来挠了挠头。
      **他什么都没发现。** 你自己却发现手心出了汗。
  - key: '2'
    label: 让他停下来，看清他要去哪
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      他停在原地两秒，然后转了个方向 —— 朝本来不打算去的那条街。
      你跟着走了半条街，**知道他今晚要去见谁了**。
  - key: '3'
    label: 试一句他还不知道的话
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      他张嘴说了一句不是他本意的话，说完自己皱起眉，站了很久。
      你松开手。他摇摇头走了 —— **而那句话里有你真想知道的东西**。
  - key: '4'
    label: 低头看看自己身上的线
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你自己后脑那根线也在垂着，长度和他那根差不多。
      **只不过现在没有人拉。** 你伸手碰了碰，指尖一阵麻。
