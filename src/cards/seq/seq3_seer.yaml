# 原著依据：《诡秘之主》途径「愚者」序列 3「古代学者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：神性提升，能分化的灵之虫达到六百条；能依靠灵之虫完成神灵的扮演，让它们依循本能倾听祈祷
id: seq3_seer
name: 六百条
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { mp: 3 }
texts:
  priv: |
    你把自己分了出去 —— **六百条。**
    它们散在城里，各做各的事，有的在檐下，有的在井边。
    有一条听见了有人在祈祷。
    它把那句话带了回来。你听见了，然后没有回应。
  group: 有人在教堂里祈祷了很久，说好像有人应了一声。
daily_limit: 1

options:
  - key: '1'
    label: 不回应那声祈祷
    effects: [ { dig: 4 } ]
    text: |
      你听见了，然后没有回应。
      那条虫在檐下停了很久 —— **神不该随便应人**，你比谁都清楚这一点。
  - key: '2'
    label: 借那条虫的嘴答一句
    effects: [ { dig: 6, mad: 2 } ]
    text: |
      你说了一句话。教堂里那个人跪下了，跪了很久。
      你收线的时候发觉，**那句话你并没有想好要说什么。**
  - key: '3'
    label: 把六百条全收回来，清点一下
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      散出去的时候是六百条，回来的时候少了两条。
      你不知道它们在哪里没的 —— **这是这一档第一次让你觉得不安全**。
