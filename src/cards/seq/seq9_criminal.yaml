# 原著依据：《诡秘之主》途径「深渊」序列 9「罪犯」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：身和心都处于恶欲的统治之下；有着强壮的身体，敏锐的知觉和各种犯罪能力
id: seq9_criminal
name: 锁开得太快了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { cor: 1 }
texts:
  priv: |
    那扇门上挂着一把老式的锁，你想都没想就把手伸了过去。
    锁开得比你想的快。快到你自己愣了一下 —— 停在那儿，手指还搭在锁孔上。
    你把手收回来，在裤子上擦了擦。**不是因为脏。**
  group: 有人在那栋空房子门口站了很久，最后什么也没拿。
daily_limit: 1

options:
  - key: '1'
    label: 把手擦干净，离开
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把手在裤子上擦了擦就走了。
      **那栋空房子你后来再没去过** —— 而你想不起来自己为什么要站在那里。
  - key: '2'
    label: 回头看看锁还在不在
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你回头看了一眼。锁挂在门上，是锁着的。
      **而刚才是你开的** —— 你没有进去，也没有拿。
  - key: '3'
    label: 再开一次，这次慢一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又把手伸过去了。这次你刻意放慢。
      **而它照样一下就开了** —— 慢的是你，不是那把锁。
