# 原著依据：《诡秘之主》途径「倒吊人」序列 7「隐修士」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：召唤阴影：可召唤源自阴影世界的生物，但召唤出来的很可能不受控制，甚至以召唤者为食
id: seq72_secrets_supplicant
name: 召唤来的
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 7
  max_seq: 7
effects:
  - { cor: 3 }
  - { mad: 2 }
texts:
  priv: |
    你按仪式念完了。
    **来的是一个你不认识的东西。** 它没有形状，但很饿。
    它没有攻击你 —— 它看了你一会儿，走了。
    你在原地站着，直到腿不抖了。
  group: 那间屋子的地板上有一块印子，擦不掉。
daily_limit: 1

options:
  - key: '1'
    label: 站着等腿不抖
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你站着等。抖了一刻钟才停。
      **而地板上的印子还在** —— 你一直看着它。
  - key: '2'
    label: 低头看地板上那块印子
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你低头看。印子是圆的。
      **而它比刚才淡了一点** —— 你确定刚才是深的。
  - key: '3'
    label: 再念一次，这次叫清楚一点
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又念了一遍。这次来的东西有形状了。
      **而它比上次近了一步** —— 你能感觉到它站的位置。
