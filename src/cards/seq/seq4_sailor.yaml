# 原著依据：《诡秘之主》途径「暴君」序列 4「灾难主祭」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：龙卷风：剧烈的风与空气碰撞发出爆炸般动静，恐怖飓风盘旋出现，将地上东西卷上半空
id: seq4_sailor
name: 拔地而起
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 3 }
  - { mp: 3 }
texts:
  priv: |
    你站在码头中间，把手抬起来。
    先是很小的旋，然后是**爆炸一样的动静**。
    **龙卷拔地而起** —— 直蹿天空，把缆绳、木桶、整条跳板都卷了上去。
    风停了之后，地上干净得像刚扫过。
  group: 昨天码头上刮了一阵风，只刮了一小会儿。
daily_limit: 1

options:
  - key: '1'
    label: 收手，让风散掉
    effects: [ { dig: 5 } ]
    text: |
      你收了手。风一下就散了。
      **天上还留着螺旋的痕迹** —— 过了很久才散完。
  - key: '2'
    label: 看看被卷上去的东西落哪了
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你抬头看。它们在天上转。
      **转了很久才落下来** —— 落在码头外面，一件都没砸到人。
  - key: '3'
    label: 再抬一次手
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又抬了一次。这次龙卷有两道。
      **而它们中间隔着一段干净的天** —— 那段天里什么都没有。
