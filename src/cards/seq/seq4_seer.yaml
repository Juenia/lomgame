# 原著依据：《诡秘之主》途径「愚者」序列 4「诡法师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可将自己或他人的伤口和疾病转移给替身纸人；火焰跳跃距离近千米；无面人能力提升
id: seq4_seer
name: 伤在纸人身上
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    刀进去的时候你手里攥着一个纸人。
    你把它捏了一下。
    **纸人破了个口子** —— 很整齐，跟刀口一样。
    你身上什么都没有。你把纸人收进袖子，走了。
  group: 有人在巷子里被人捅了一刀，第二天照常出门。
daily_limit: 1

options:
  - key: '1'
    label: 把纸人收进袖子
    effects: [ { dig: 3 } ]
    text: |
      纸人进了袖子。那个口子很整齐 —— **你以后可以照着剪**。
  - key: '2'
    label: 替巷子里那个人也挡一次
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他靠在墙上喘气，不知道自己刚才捡了条命。
      你从他身边走过去。**这件事他不会知道，也不必知道。**
  - key: '3'
    label: 看看这纸人还能顶几次
    effects: [ { dig: 5, hp: 2 } ]
    text: |
      你在自己手背上划了一道，纸人又破了个口子 —— 但小了很多。
      **它只能替你挨有限的几次。** 这个数你得早点知道。
