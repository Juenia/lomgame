# 原著依据：《诡秘之主》途径「暴君」序列 7「航海家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：对磁场、洋流、风向、云朵有直觉把握；航海家掌舵的船从不会在大海上迷路
id: seq7_sailor
name: 海图上没有
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 7
  max_seq: 7
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你在甲板上闭着眼站了一会儿。
    「左前方有礁，」你说，「不远。」
    船长翻了海图 —— 那一片是空的。
    半个钟头之后，瞭望手喊了起来。
  group: 那条船昨天绕开了一片海图上没有的东西。
daily_limit: 1

options:
  - key: '1'
    label: 站在甲板上等它出现
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着等。半个钟头之后瞭望手喊了起来。
      **而他喊的位置** —— 和你说的一样。
  - key: '2'
    label: 再闭眼听一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又闭了眼。这次听见的东西更多。
      **左边是礁** —— 而右边是别的东西，那个东西在动。
  - key: '3'
    label: 问船长为什么要走这条航线
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说是上面定的。
      **而他昨天刚把海图换过一张** —— 换的是最新版，比旧的少了几块。
