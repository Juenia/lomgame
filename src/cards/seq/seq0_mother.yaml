# 原著依据：《诡秘之主》途径「母亲」序列 0「母亲」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：神国丰饶乐土；上位权柄：母亲、大地、自然、部分死亡、部分生命；下位权柄：荒芜、治疗
id: seq0_mother
name: 丰饶乐土
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:mother'
  min_seq: 0
  max_seq: 0
effects:
  - { hp: 6 }
  - { dig: 4 }
texts:
  priv: |
    你在梦里到过那个地方。
    **那里的东西一直在长** —— 草、树、果子，都在长，长完了自己落下来，又长。
    你在那儿坐了一会儿，不饿，不渴，不困。
    醒过来的时候枕头是湿的。
  group: 有人睡了三天，醒来说去了一个地方。
daily_limit: 1

options:
  - key: '1'
    label: 醒来先把那个地方画下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你醒来第一件事是画。画到一半你停了 ——
      **因为那里没有边界**。你画到哪里，它就在哪里继续。
  - key: '2'
    label: 试着把那里的东西带回来
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你攥了一把土在手里醒过来。手里是空的。
      **但指甲缝里有泥** —— 你洗了三天才洗掉。
  - key: '3'
    label: 再去一次
    effects: [ { dig: 6, mad: 2 } ]
    text: |
      你闭上眼，又回去了。这次你在那里看见了别人。
      他在割草，**没有抬头** —— 而你确定他听见你来了。
