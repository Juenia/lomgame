# 原著依据：《诡秘之主》途径「母亲」序列 3「抬棺人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：恶灵化：能让十公里内所有死者变成可怕恶灵并为自己战斗；与母亲途径的死亡回归权柄相连
id: seq3_mother
name: 十公里
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 3
  max_seq: 3
effects:
  - { cor: 4 }
  - { hp: 3 }
texts:
  priv: |
    **十公里。** 你在心里量了一下，够了。
    你把手往下一按。
    然后你听见了 —— 从很远的地方开始，一层一层地响起来。
    **它们在往这边走。** 你站在原地等。
  group: 那片墓地昨晚有动静，守墓的人跑了。
daily_limit: 1

options:
  - key: '1'
    label: 站着等它们过来
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      它们从十公里外一层一层地过来。
      到跟前你才发现 —— **它们不看你**。它们只是路过，往别的地方去。
  - key: '2'
    label: 把手按下去，让它们停下
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你按住了。地下安静下来。
      **而你的手指开始发黑** —— 从指尖往上，到第二个指节停住了。
  - key: '3'
    label: 退出墓园，让它们走
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你退到围墙外面。
      那天晚上守墓的人没回来 —— **第二天也没有**。
