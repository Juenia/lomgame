# 原著依据：《诡秘之主》途径「隐者」序列 5「星象师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：星海穿梭：能让船只借星光飞跃
id: seq52_mystery_pryer
name: 借星光
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { dig: 2 }
texts:
  priv: |
    船在海上，风停了。
    你抬头看了一眼那些星。
    **船动了。** 不是被风推的，是被什么托起来的。
    天亮的时候，已经到了。
  group: 那条船一夜之间走完了三天的路。
daily_limit: 1

options:
  - key: '1'
    label: 让它继续托着走
    effects: [ { dig: 5 } ]
    text: |
      你躺回舱里，听着水声。
      天亮的时候已经到了 —— **船工说他这辈子没见过这么平的夜**。
  - key: '2'
    label: 抬头看清是哪几颗星
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你数了：七颗，连成一条不像任何星座的线。
      你把这个形状记下来 —— **它不在星图上**。
  - key: '3'
    label: 试着自己托一次
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你抬手。船停了半秒，然后走得更快。
      **而你的鼻子开始流血** —— 滴在甲板上，一颗一颗很整齐。
