# 地点专属（M2.87）。地点：「普利兹港」（pritz，危险度 2）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_pritz
name: 港口的口音
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:普利兹港'
effects:
  - { dig: 2 }
texts:
  priv: |
    码头上的工人来自很多地方，口音很杂。
    今天有个人跟你搭话，说的是本地的腔调。
    **但有几个词的念法不对** —— 不是外地人学本地，是本地人故意改的。
    你答了两句，走开了。
  group: 码头上有人操着一口不对的本地话。
daily_limit: 1

options:
  - key: '1'
    label: 多听几句，找出哪几个词不对
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你多听了一会儿。三个词的念法不对。
      **而这三个词都是地名** —— 都是这条街上的地名。
  - key: '2'
    label: 跟上去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你跟着他走了一段。他在第三个路口拐了进去。
      **而那条巷子是死的** —— 你走进去的时候里面没有人。
  - key: '3'
    label: 问他是哪儿人
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      他说他是本地人，从小在这儿。
      **而他说这话的时候** —— 把「这儿」说得很轻。
