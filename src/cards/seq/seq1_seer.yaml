# 原著依据：《诡秘之主》途径「愚者」序列 1「诡秘侍者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：再生：若物品的构成材料曾有灵体，可唤起相应灵体之线让物品成为自己的秘偶，并使与该物品有深层联系的生灵也转为秘偶
id: seq1_seer
name: 把线唤起来
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 5 }
  - { cor: 3 }
texts:
  priv: |
    你把那把椅子转了过来，摸了摸扶手。
    **这根木头以前是棵树，树是活的。**
    线起来了。椅子动了动。
    然后坐在椅子上那个人也动了 —— 他自己都没有察觉。
  group: 那间屋子里的东西昨天都挪了位置，摆得很整齐。
daily_limit: 1

options:
  - key: '1'
    label: 松手，让椅子变回椅子
    effects: [ { dig: 3 } ]
    text: |
      线落下去，椅子安安静静待在原处。
      你退出去的时候顺手把它摆正了 —— **没必要让人看出来**。
  - key: '2'
    label: 让整间屋子的东西都动一遍
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      第二天屋里的东西全换了位置，摆得很整齐。
      屋主回来看了半天，说不上哪里不对。
  - key: '3'
    label: 顺着线去找那个坐着的人
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      线从他后脑垂下来，一直垂到街对面。
      你顺着走了三条街，站在一栋楼下面 —— **他住这儿**。
