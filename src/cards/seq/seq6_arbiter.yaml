# 原著依据：《诡秘之主》途径「审判者」序列 6「法官」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可用古赫密斯语等超自然语言对一定区域立下新规则，区域内事物都须遵守
id: seq6_arbiter
name: 这条街上不许跑
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    有个贼从巷子里窜出来，正冲你这边跑。
    你抬起手，念了一句谁也没听懂的话。
    **他还在跑，但跑不动了** —— 腿在动，人没往前。
    你走过去的时候，他脸上全是汗。
  group: 那条巷子里有人跑着跑着就停在原地了。
daily_limit: 1

options:
  - key: '1'
    label: 走过去问他跑什么
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      「跑什么。」他喘着气说了三个字。
      **而你听见了街那头有人在喊** —— 喊的是他的名字。
  - key: '2'
    label: 把他放开
    effects: [ { dig: 4 } ]
    text: |
      你手一松，他摔在地上。爬起来的时候他已经不跑了。
      **他只是走，走得很快** —— 快到你得小跑才跟得上。
  - key: '3'
    label: 把这条规则留在这条街上
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你走的时候没有解除它。
      **第二天这条街上所有人都在慢慢走** —— 而他们谁也不知道原因。
