# 原著依据：《诡秘之主》途径「倒吊人」序列 6「蔷薇主教」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：血肉炸弹：自身或撕下的一部分如炸弹般膨胀炸开，血肉化作风暴席卷周围，可腐蚀物体
id: seq62_secrets_supplicant
name: 血肉炸弹
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 6
  max_seq: 6
effects:
  - { cor: 3 }
  - { hp: 3 }
texts:
  priv: |
    你把手背上的一小块撕了下来。
    **它在你掌心里鼓起来**，然后没了。
    那面墙被糊了一层东西，开始往下掉渣。
    你把手背举起来看了看。已经合上了。
  group: 那面墙昨天烂了一块，怎么修都修不好。
daily_limit: 1

options:
  - key: '1'
    label: 举起手看看那块
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你举起手看。已经合上了。
      **而合上的地方比别处白** —— 白得像一开始就少了什么。
  - key: '2'
    label: 再撕一块，这次大一点
    effects: [ { dig: 7, hp: 4, cor: 4, mad: 4 } ]
    text: |
      你又撕了一块。这次的动静比上次大得多。
      **而那面墙整面塌了** —— 塌下来的时候是湿的。
  - key: '3'
    label: 走过去看那面墙
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走过去看。墙上的东西还在往下掉渣。
      **而它带着一股甜味** —— 甜得很腻。
