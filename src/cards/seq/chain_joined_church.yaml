# 事件卡链（M2.87）—— **后续卡**：只有触发过前置卡的人才抽得到。
# 前置：daily_014 新徽记（设 flag `joined_church`）
# 判据：`cond: flag:joined_church`。
#
# ⚠️ 这一类此前**一条都没有**：全库 29 张卡设了 flag，而要求 flag 的卡是 **0 张** ——
#    flag 设了就再没有人读，等于写了一半的链。这张是它的后半段。
id: chain_joined_church
name: 第一件事
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:joined_church'
effects:
  - { dig: 2 }
  - { mp: 2 }
texts:
  priv: |
    徽记别在里侧，别人看不见。
    第三天上头给了你第一件事。
    **很简单** —— 去一条街上待一个下午，看谁进出。
    你去了。回来之后你要写一份东西，但没人告诉你写给谁。
  group: 那间教堂新来了个很年轻的执事。
daily_limit: 1
