# 原著依据：《诡秘之主》途径「黑暗」序列 7「梦魇」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能自由出入熟睡者的梦里；入梦、塑梦
id: seq7_sleepless
name: 他在梦里并不意外
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 7
  max_seq: 7
effects:
  - { mp: 3 }
  - { mad: 2 }
texts:
  priv: |
    睡前你想了一个人的脸。
    那天晚上你进了他的梦 —— 一间没有窗的屋子，他在里面坐着。
    他抬头看见你，**并不意外**。
    「你来了，」他说。你在梦里退了一步。
  group: 那两个人白天从不说话，而他们都说梦见过对方。
daily_limit: 1

options:
  - key: '1'
    label: 问他等了多久
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你问了。他说不记得了。
      **而屋里没有钟** —— 墙上只有一个钉子。
  - key: '2'
    label: 退出去，不再进他的梦
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你退了。第二天白天你见到他。
      **他跟你点了点头** —— 像是早就认识。
  - key: '3'
    label: 在梦里坐下来陪他
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你坐下了。他给你倒了一杯水。
      **而杯子里什么都没有** —— 而你端起来喝了。
