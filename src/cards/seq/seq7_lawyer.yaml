# 原著依据：《诡秘之主》途径「黑皇帝」序列 7「贿赂者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：核心能力贿赂：通过给予目标实际或象征意义上的贿赂产生各种效果（削弱/魅惑）
id: seq7_lawyer
name: 一枚硬币
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    你给了他一枚硬币 —— 不值几个钱。
    他收下，捏在手里搓了两下。
    然后他看你的眼神变了。
    **你什么话都没说。** 而他已经开始想，你是不是个好人。
  group: 有人在巷口给过路的人发硬币，收下的人都跟他聊了很久。
daily_limit: 1

options:
  - key: '1'
    label: 收下他的信任，什么都不说
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你点点头走了。第二天他在巷口等你。
      **手里捏着那枚硬币** —— 他把它搓得发亮。
  - key: '2'
    label: 再给他一枚
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你又给了一枚。他把两枚一起搓。
      **搓了很久** —— 然后问你有没有什么要办的事。
  - key: '3'
    label: 问他觉得你是什么人
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      他想了很久。最后说你像个不着急的人。
      **说完他自己笑了** —— 而笑完他往后退了半步。
