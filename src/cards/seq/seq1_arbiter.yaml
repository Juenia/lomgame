# 原著依据：《诡秘之主》途径「审判者」序列 1「秩序之手」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分秩序权柄：能为整片战场、所有敌人或整座城市制定许多新规则（非底层），能修改或暂时去除原有规则
id: seq1_arbiter
name: 新的规则
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 5 }
  - { hp: 2 }
texts:
  priv: |
    你站在城门上说了一句。
    **这座城里从今天起不许说谎。**
    第一天有几百个人张不开嘴。
    第二天，生意做不下去了。
  group: 那座城这两天没人谈成生意。
daily_limit: 1

options:
  - key: '1'
    label: 站在城门上看着他们装下去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他们开始用手比划，用眼神，用纸。
      **从此那座城的人写字比说话多** —— 而纸价涨了三倍。
  - key: '2'
    label: 把规则改小一点
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你改成：「做生意时不许说谎。」第二天生意恢复了。
      **而价格都变得很老实** —— 老实到你一眼就看出哪些人不会再来了。
  - key: '3'
    label: 再站上城门说一句
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又站上城门说了一句：「这座城里从今天起不许偷。」
      **当晚城里所有的手都静了一下** —— 包括你自己的。
