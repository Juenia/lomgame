# 原著依据：《诡秘之主》途径「完美者」序列 9「通识者」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：记忆、学习和实践能力的非凡化；核心能力是唤醒记忆，能记起自己看过的所有知识
id: seq9_perfect
name: 第三行
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
texts:
  priv: |
    有人在饭桌上问起一个很偏的问题。
    你没读过那本书，但你翻过 —— 十年前，图书馆，第三排。
    你顺口把那一页的第三行念了出来，一字不差。
    桌上安静了一下。**你自己也在想：那本书我到底看没看过？**
  group: 有人随口背出了一段十年前的书，一字不差。
daily_limit: 1

options:
  - key: '1'
    label: 接着往下背
    effects: [ { dig: 6, mad: 1 } ]
    text: |
      你背了半页。停下来的时候你自己都愣了 ——
      **你没读过这本书。**
  - key: '2'
    label: 说记不清了
    effects: [ { dig: 4 } ]
    text: |
      你把话收住，端起杯子喝了一口。
      **桌上的人已经开始聊别的了** —— 只有你知道自己刚才差点说漏什么。
  - key: '3'
    label: 回去找那本书
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      第三排那本书还在。你翻到那一页 ——
      **第三行是空的。** 前后两行都在，中间那一行没了。
  - key: '4'
    label: 问自己：这算记得，还是算别的
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你坐了很久。
      **你想起的是字，不是内容** —— 而字是从哪来的，你不知道。
