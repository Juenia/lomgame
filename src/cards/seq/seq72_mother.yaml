# 原著依据：《诡秘之主》途径「母亲」序列 7「丰收祭司」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：治疗方面的能力有了拓展，可以治疗植物和农田的疾病
id: seq72_mother
name: 田里的病
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    那块田的麦子黄了一半，农人说救不回来了。
    你走进田里，蹲下来，摸了一把土。
    **「是根上的病，」** 你说，「还有救。」
    三天之后那片黄的地方返青了。
  group: 那块田的麦子黄了又绿，农人说是老天开眼。
daily_limit: 1

options:
  - key: '1'
    label: 告诉农人该怎么治
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把该做的说了。他记不住。
      你就一样一样写在他手上 —— **写完他已经把前两样忘了**。
  - key: '2'
    label: 沿着田埂把整块地摸一遍
    effects: [ { dig: 7, hp: 2, mad: 2 } ]
    text: |
      你走了一圈。走到最后几垄的时候，膝盖软了一下。
      **那是力气用完了的信号** —— 而田里已经返青了一半。
  - key: '3'
    label: 把返青的事瞒下来
    effects: [ { dig: 4 } ]
    text: |
      你没提。农人说老天开眼。
      **你让他这么以为** —— 而他明天还会来浇那块地。
