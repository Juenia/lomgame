# 原著依据：《诡秘之主》途径「隐者」序列 8「格斗学者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：寻求事物背后的秘密，而格斗也属于事物的一种，掌握着许多流派的格斗术
id: seq8_mystery_pryer
name: 他为什么那样出拳
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你打赢了。对方躺在地上喘。
    你没有看他，你在想刚才那一拳 —— 他为什么要那样出，那个角度是从哪个流派来的。
    你蹲下来问了一句。他愣住了。
    **赢不赢这件事，你已经不太在意了。**
  group: 打赢的那个人蹲下来问对方问题，问了很久。
daily_limit: 1

options:
  - key: '1'
    label: 把他扶起来，接着问
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把他扶到墙边。他说了一个流派的名称。
      **那个流派三十年前就断了** —— 而他今年二十四。
  - key: '2'
    label: 自己再打一遍那个角度
    effects: [ { dig: 6, hp: 1 } ]
    text: |
      你对着空气打了一遍。找到了。
      **但那一下要的力气不在肩上** —— 你现在才明白自己之前白练了三年。
  - key: '3'
    label: 不再打了，回去查那个流派
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你翻了三天书。
      **那个流派最后一次出现，是在一张死亡名单上** —— 名单上第七个名字被墨水盖住了。
