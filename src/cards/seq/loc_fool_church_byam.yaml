# 地点专属（M2.87）。地点：「愚者教会（拜亚姆）」（fool_church_byam，危险度 1）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_fool_church_byam
name: 没有人讲道
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:愚者教会（拜亚姆）'
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    这座教堂没有神像，也没有讲道的人。
    椅子摆得很整齐，都朝着一个方向。
    你在那儿坐了一刻钟，**什么都没发生**。
    但出去的时候，你觉得心里那块堵着的东西松了一点。
  group: 愚者教会（拜亚姆）里从来没有讲过道，来的人却越来越多。
daily_limit: 1

options:
  - key: '1'
    label: 再坐一会儿
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你又坐了半个钟头。还是什么都没发生。
      **而你出去的时候** —— 那块堵着的东西又松了一点。
  - key: '2'
    label: 看那些椅子朝着哪个方向
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看了一圈。所有椅子朝的是同一面墙。
      **而那面墙上什么都没有** —— 白墙，连裂缝都没有。
  - key: '3'
    label: 问来的人为什么来
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你问了三个。三个说的都不一样。
      **而三个人都说了同一句话** —— 「坐一会儿就好了」。
