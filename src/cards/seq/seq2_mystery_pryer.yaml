# 原著依据：《诡秘之主》途径「隐者」序列 2「贤者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：一定的神秘知识权柄及粗浅的删除、修改权柄；核心是对信息的掌控，可将身体虚化分解成知识洪流
id: seq2_mystery_pryer
name: 变成信息
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 4 }
  - { mp: 3 }
texts:
  priv: |
    追你的人堵住了三个路口。
    你**虚了** —— 身体散成一股一股的东西，很杂，像很多页纸叠在一起。
    从他们中间过去的时候，有一个下意识地挥手赶了赶。
    重新成形的时候你已经过了两个街区。
  group: 有人说那条街上忽然起了一阵风，风里像有纸。
daily_limit: 1

options:
  - key: '1'
    label: 继续往前走，不停
    effects: [ { dig: 5 } ]
    text: |
      你没停。风穿过了两条街。
      路上有人抬头看了看天 —— **他们闻到了一股旧纸的味道**。
  - key: '2'
    label: 多飘一段再成形
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你多飘了一段。成形的地方是你**十岁那年住过的巷子口**。
      你自己也不知道为什么会是那儿。
  - key: '3'
    label: 在那状态里多待一会儿
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你多待了一阵。重新聚起来的时候，你少了一件事的记忆。
      **你到现在都不知道少了哪一件** —— 而那正是最难受的地方。
