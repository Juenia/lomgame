# 原著依据：《诡秘之主》途径「空想家」序列 9「观众」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：从表情、举止、口癖、不为人知的动作窥见他人的真实想法
id: seq93_spectator
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq8_assassin 撞了同一个名字，从本卡正文里另取一个短语。
name: 那你说说当时你在哪
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:spectator'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    那个人一直在否认，说了很多遍。
    「我没有，」他说，「我真的没有。」
    **你说：「那你说说当时你在哪。」**
    他答了。答完之后他自己安静了。
  group: 那个人昨天被问了一句话就不说话了。
daily_limit: 1

options:
  - key: '1'
    label: 等他自己答完
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你等他说完。他答完之后安静了。
      **而屋里没有人接话** —— 连一直在敲的笔都停了。
  - key: '2'
    label: 再问一句
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你又问了一句。他抬头看你。
      **而他的眼神是空的** —— 像是那句话问的不是他。
  - key: '3'
    label: 说一句「我知道了」
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说了。他站起来走了。
      **走的时候撞了一下门框** —— 而门框离他很远。
