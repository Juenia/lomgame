# 原著依据：《诡秘之主》途径「月亮」序列 1「美神」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：较低层次的美之权柄：「美」的具象化，容貌与魅力就是她最强的能力，所有看到的人都会受影响
id: seq1_apothecary
name: 看见她的人
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 1
  max_seq: 1
effects:
  - { cor: 3 }
  - { dig: 2 }
texts:
  priv: |
    她进门的时候，屋里所有的声音都停了。
    **不是因为她美** —— 是因为看见的人都动不了。
    有个人的杯子从手里滑下去，砸在地上，他都没有低头看。
    她走到最里面的位子坐下来。没有人敢坐她对面。
  group: 那家酒馆昨晚安静了一整晚。
daily_limit: 1

options:
  - key: '1'
    label: 站在原地不动
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你也没动。不是不能动 ——
      **是不知道动了会发生什么**。她坐下的那一刻，屋里才重新有了声音。
  - key: '2'
    label: 走过去，坐到她对面
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你拉开椅子坐下。她抬头看了你一眼。
      **就那一眼** —— 你把刚才想说什么忘得干干净净。
  - key: '3'
    label: 弯腰把地上的杯子捡起来
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你捡起杯子，放回桌上，又给那人倒了一杯。
      **全屋只有你动了** —— 而她笑了一下，那是今晚唯一一点声音。
