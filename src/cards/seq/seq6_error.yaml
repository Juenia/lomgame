# 原著依据：《诡秘之主》途径「错误」序列 6「盗火人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：窃取：能短暂地窃取别人的非凡能力为己用，越了解越容易窃到想要的那项
id: seq6_error
name: 那道光在我手里
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    他抬手的那一刻，你看见他身边浮起一层光。
    很干净，很亮 —— 你盯着那层光看了一瞬。
    **然后那层光在你手里了。**
    他愣在原地，把手翻过来看了一遍又一遍。
  group: 有人在街上抬起手，然后呆住了。
daily_limit: 1

options:
  - key: '1'
    label: 看他要多久才发现
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着看。他把手翻了三遍。
      **第四遍的时候他开始冒汗** —— 而他还是没抬头看你。
  - key: '2'
    label: 把光还给他
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你还回去了。那层光又浮起来。
      **而他一直在看你** —— 看的是你的手，不是脸。
  - key: '3'
    label: 当着他的面用一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你用了。光从你手里出去，比他用的时候亮。
      **他退了两步** —— 而他的手一直举着，像是在等它回来。
