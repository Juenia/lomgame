# 原著依据：《诡秘之主》途径「错误」序列 8「诈骗师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：精神干扰：能让目标产生一定的幻觉
id: seq82_error
name: 他自己走神了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:error'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    他站在门口，正要喊人。
    你看了一眼他脚边。
    **他低头了。** 那里什么都没有 —— 但他看见了。
    等他抬起头，你已经不在原来的位置了。
  group: 那个人在门口站了一会儿，说刚才好像看见什么了。
daily_limit: 1

options:
  - key: '1'
    label: 趁他低头的时候走开
    effects: [ { dig: 5 } ]
    text: |
      你走了。他抬起头的时候门口已经没人。
      **而他站在原地，把脚边看了一遍又一遍。**
  - key: '2'
    label: 再指一次，看他还低不低头
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你又指了一下。他又低头了。
      **而这次他看见了什么** —— 他脸色变了，往后退了一步。
  - key: '3'
    label: 走过去问他看见了什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你问了。他张了张嘴。
      **然后说「没什么」** —— 说得很快，快到你确定那不是实话。
