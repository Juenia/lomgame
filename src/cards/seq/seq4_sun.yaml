# 原著依据：《诡秘之主》途径「太阳」序列 4「无暗者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：净化：从身体向外散发一圈又一圈温暖光辉，净化堕落、污秽、腐蚀、黑暗、疾病等领域的力量
id: seq4_sun
name: 一圈一圈
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 3 }
  - { mp: 3 }
texts:
  priv: |
    你站在那间屋子的中央。
    光从你身上一圈一圈地漫出去 —— 不刺眼，温的。
    地板上那些黑的东西缩了，缩到墙角，然后没了。
    **你站着没动。** 屋子里的味道也淡了。
  group: 那间租不出去的屋子，昨天有人进去待了一刻钟。
daily_limit: 1

options:
  - key: '1'
    label: 站着不动，看光漫到哪里
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着。光漫到门口就停了。
      **一步都没出去** —— 而门是开着的。
  - key: '2'
    label: 往前走一步
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走了一步。光跟着你走。
      **而身后那一片又开始黑了** —— 黑得比原来还快。
  - key: '3'
    label: 把光收回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你收了。屋里的味道又回来了。
      **比刚才淡一点** —— 但它确实回来了。
