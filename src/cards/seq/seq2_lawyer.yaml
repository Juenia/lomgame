# 原著依据：《诡秘之主》途径「黑皇帝」序列 2「熵之公爵」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：熵：与之战斗越久，自身能力、思维和状态越是随机混乱，最终陷入奇怪的寂灭
id: seq2_lawyer
name: 打着打着就乱了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 2
  max_seq: 2
effects:
  - { cor: 3 }
  - { dig: 3 }
texts:
  priv: |
    他打得很凶，前十分钟占尽上风。
    第二十分钟他的招式开始重复。
    第四十分钟他在原地转圈，嘴里念着不相干的东西。
    **第五十分钟他跪下了，表情很安静。** 你从头到尾没还过手。
  group: 那场架打了一个钟头，赢的人一下都没还手。
daily_limit: 1

options:
  - key: '1'
    label: 站着不还手，看他打完
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你站到第五十分钟。他跪下的时候表情很安静。
      **而你一句话都没说** —— 你从头到尾只是站着。
  - key: '2'
    label: 问他现在还知不知道自己在打什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他张了张嘴。
      **然后开始说一件跟他毫无关系的事** —— 说他小时候院子里有棵树。
  - key: '3'
    label: 把他扶起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把他扶起来。他站不稳。
      **而他的手一直在抓空气** —— 抓了很久才停。
