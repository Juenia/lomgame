# 原著依据：《诡秘之主》途径「隐者」序列 9「窥秘人」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：窥秘之眼：可以观察目标的星灵体、以太体和心智体状态
id: seq9_mystery_pryer
name: 他身后站着什么
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你看着对面那张脸，正常地跟他说话。
    但你看见的是另一层：他身后站着个形状，很淡，跟他自己差不多高。
    「你怎么了？」他问。
    「没什么，」你说。**你决定不告诉他 —— 因为那个形状正在看他，而它已经看了很久了。**
  group: 有人聊到一半忽然不说话了，眼睛看着对面人的肩膀后面。
daily_limit: 1

options:
  - key: '1'
    label: 继续聊下去，装作没看见
    effects: [ { dig: 5, mad: 1 } ]
    text: |
      你把话接了下去。他放松了些，又说了两句。
      **那个形状一直在看** —— 你看得出来它在听你们说话。
  - key: '2'
    label: 告诉他
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你说了。他回头看了一眼，什么都没看见。
      **但从那天起他不再背对着门坐** —— 他自己也不知道为什么。
  - key: '3'
    label: 问那个形状一句话
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你看着它说：「你想说什么。」
      **对面那张脸忽然停了半秒** —— 而他还在等你接刚才那句话。
