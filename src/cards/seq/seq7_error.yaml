# 原著依据：《诡秘之主》途径「错误」序列 7「解密学者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：神秘学知识，灵性直觉增强，观察、联想和推导能力提升；能从蛛丝马迹还原真相
id: seq7_error
name: 撕它的那个人
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
texts:
  priv: |
    那本日记缺了一页 —— 撕口很整齐，是从上面扯的。
    你看了一会儿，知道了撕它的人那天晚上去了哪里。
    **你也不知道自己是怎么知道的**，但顺序在脑子里自己排好了。
    你把日记合上，放回原处。
  group: 有人在旧书铺里翻了一本日记，只看了撕口那几页。
daily_limit: 1

options:
  - key: '1'
    label: 把日记合上，放回原处
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把它放回架子上，摆正。
      **而你已经知道了那个人的去处** —— 知道之后你就没法装作不知道了。
  - key: '2'
    label: 去那个地方看看
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你去了。那里是一间关着门的铺子。
      **门上的锁是新的** —— 而铺子已经关了七年。
  - key: '3'
    label: 问老板这本日记是哪来的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说是收来的，一箱书里夹着的。
      **而他说那箱书是同一个人的** —— 那个人他没见过，只见过对方的手。
