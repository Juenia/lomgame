# 原著依据：《诡秘之主》途径「魔女」序列 7「女巫」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：隐形：抬起右手在脸前一抹，配合咒文将荧光粉末洒在身上，身影一寸寸消失
id: seq7_assassin
name: 没有人让路
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你在脸前抹了一下，把粉末洒在身上。
    然后你从人群里走过去 —— 走得很慢，几乎是散步。
    **没有人让路，也没有人撞到你。**
    走到街对面你才想起：刚才有个小孩一直看着你这边。
  group: 集市上有人凭空出现了，就在卖花摊子前面。
daily_limit: 1

options:
  - key: '1'
    label: 接着往前走，不回头
    effects: [ { dig: 5 } ]
    text: |
      你走到街对面，站了一会儿才想起那个小孩。
      **而你没有回去。** 你只是把这件事记住了 —— 记住了有一双眼睛看得见你。
  - key: '2'
    label: 回去找那个小孩
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你回去了。摊子还在，小孩不在了。
      **卖花的人说他刚才一直指着你站的地方** —— 说那里「有个人，又好像没有」。
  - key: '3'
    label: 再抹一次，这次不洒粉末
    effects: [ { dig: 7, hp: 2, mad: 3 } ]
    text: |
      你只抹了脸，没洒粉末。这一次有人让路了。
      **他们让得很自然** —— 像本来就要让，像你本来就该从那里过。
