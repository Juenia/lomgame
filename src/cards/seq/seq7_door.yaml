# 原著依据：《诡秘之主》途径「门」序列 7「占星人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：占星术：使用水晶球进行占卜
id: seq7_door
name: 同一个日子
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    水晶球里的雾散了三次。
    你把它摇匀，再等一次 —— 散开之后还是那个日子。
    第四次你没有摇。
    **你把球收进了柜子最里面。**
  group: 有人对着一个水晶球坐了一整个下午，最后把它锁了起来。
daily_limit: 1

options:
  - key: '1'
    label: 把柜子锁上
    effects: [ { dig: 5 } ]
    text: |
      你把柜子锁上，钥匙放进抽屉。
      **屋里安静下来** —— 而你知道它就在柜子里，一动不动。
  - key: '2'
    label: 再拿出来看最后一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又拿出来了。这次雾散开之后还是那个日子。
      **而球面上多了一道裂** —— 你没碰过它。
  - key: '3'
    label: 去查那个日子是什么日子
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你查了。那天城里出过一件事。
      **而记录里只写了一行** —— 后面的纸被撕了，撕口很整齐。
