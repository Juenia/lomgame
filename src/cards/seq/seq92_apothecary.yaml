# 原著依据：《诡秘之主》途径「月亮」序列 9「药师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：对毒素的抗性比较强
id: seq92_apothecary
name: 尝一口就知道
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    那瓶药摆在桌上，没有标签。
    你倒了一点在舌尖上。
    **麻了一下，然后不麻了。**
    你把瓶子放回原处，记下了它是什么。
  group: 药铺的学徒昨天尝了一瓶没标签的药，人没事。
daily_limit: 1

options:
  - key: '1'
    label: 把配方反推出来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你在纸上写下了七味。
      **写到第七味的时候你停了** —— 那一味现在买不到，而你认得它的名字。
  - key: '2'
    label: 再来一口，尝准一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      第二口你尝出了底层那点苦。
      **而苦味下面是甜的** —— 那不该出现在这种药里。
  - key: '3'
    label: 放回原处，什么都不说
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把它放回去，位置分毫不差。
      **学徒第二天来取的时候没有发觉** —— 而你一直在等他发觉。
