# 原著依据：《诡秘之主》途径「黑暗」序列 9「不眠者」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：黑夜的眷者，哪怕没有光照，也具备卓越的视力；夜越深，精力越充沛
id: seq9_sleepless
name: 第三夜
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 9
  max_seq: 9
effects:
  - { mp: 3 }
  - { dig: 1 }
texts:
  priv: |
    你已经两夜没有睡了。第三夜你干脆没上床。
    天黑下来的时候你反而清醒了 —— 越黑越清醒。
    天快亮的那一刻，是你这一周里最清醒的时候。
    **你知道这不对。但你没有困。**
  group: 那扇窗连着三夜都亮着灯，而里面的人白天照常出门。
daily_limit: 1

options:
  - key: '1'
    label: 不睡了，坐着等天亮
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你坐着。天快亮的时候你最清醒。
      **清到你能听见两条街外的说话声** —— 而窗是关着的。
  - key: '2'
    label: 数一数已经几夜了
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你数了。三夜。
      **而你白天照常出门** —— 没有人看出来，连你母亲都没有。
  - key: '3'
    label: 逼自己闭上眼
    effects: [ { dig: 7, hp: 3, cor: 2, mad: 3 } ]
    text: |
      你闭上眼。眼前是黑的，但你没睡。
      **你就那么躺了两个钟头** —— 一直到天亮，一个梦都没有。
