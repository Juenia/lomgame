# 原著依据：《诡秘之主》途径「黄昏巨人」序列 7「武器大师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：只要是武器就能以大师级水准使用，包括非凡武器与封印物，并有效降低负面影响带来的伤害
id: seq72_warrior
name: 封印物也顺手
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:warrior'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    那把剑是封印物，谁拿谁出事。
    你接过来的时候手麻了一下。
    **然后就好了** —— 顺手得像用了十年。
    旁边的人往后退了几步。你没有回头。
  group: 那件封印物昨天被一个人拿起来了，他一点事都没有。
daily_limit: 1

options:
  - key: '1'
    label: 把封印物还回去
    effects: [ { dig: 4 } ]
    text: |
      你把它递回去。接的人犹豫了一下才伸手。
      他握住剑柄的时候，**你看见他手背上的青筋起来了**。
  - key: '2'
    label: 拿着它试一次
    effects: [ { dig: 6, hp: 2, mad: 2 } ]
    text: |
      你挥了一下。剑走得很顺 —— 顺到你自己都愣了一下。
      收势的时候**手又开始麻了**，比刚才厉害。
  - key: '3'
    label: 问一句：这剑原来是谁的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      没人答。往后退的那几个人里，有一个转身走了。
      走出去十几步之后他回头看了你一眼 —— **那一眼不是害怕**。
