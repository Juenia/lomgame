# 原著依据：《诡秘之主》途径「黑皇帝」序列 8「野蛮人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可怕的力量，很强的体魄，出类拔萃的精神方面的抵抗能力；不能依靠法律的，就用力量解决
id: seq8_lawyer
name: 门框裂了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
texts:
  priv: |
    那扇门锁着，屋里没人应声。
    你伸手推了一下 —— 不重。
    门开了。**是门框裂了，不是锁坏了。**
    你站在门口，把手放下来，看了自己手掌一眼。上面什么都没有。
  group: 那栋楼的一扇门被推开了，门框裂着。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下来，走进去
    effects: [ { dig: 5 } ]
    text: |
      你把手放下来，走了进去。
      **屋里没人** —— 而桌子上有一杯还热的茶。
  - key: '2'
    label: 回头看那道裂缝
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。裂缝是从门框中间往外走的。
      **而门框是石头的** —— 石头上不该有这种走向的裂。
  - key: '3'
    label: 去推隔壁那扇门
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你推了隔壁那扇。这次裂的是锁。
      **而门框好好的** —— 你忽然明白：裂的从来不是门。
