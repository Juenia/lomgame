# 原著依据：《诡秘之主》途径「黑暗」序列 6「安魂师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能直接看见灵体生物；利用安魂既能影响目标也能治疗队友的情绪状态
id: seq62_sleepless
name: 直接看见
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sleepless'
  min_seq: 6
  max_seq: 6
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你走进那间屋子，第一眼就看见了。
    **它站在窗帘后面**，一直站着。
    屋里的人谁都看不见它，只是觉得冷。
    你走过去，说了一句话。它散了。
  group: 那家人说屋里一直很冷，昨天忽然不冷了。
daily_limit: 1

options:
  - key: '1'
    label: 走过去跟它说一句话
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走过去说了一句。它散了。
      **而屋里的人什么都没听见** —— 他们只觉得忽然不冷了。
  - key: '2'
    label: 看它站在那儿多久了
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你站着看。它一直站着。
      **而窗帘下面的地板已经磨白了一块** —— 磨了很多年。
  - key: '3'
    label: 告诉那家人屋里有什么
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你说了。他们互相看了一眼。
      **而老太太说她早就知道** —— 她说她小时候就见过它。
