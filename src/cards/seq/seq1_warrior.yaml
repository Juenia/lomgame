# 原著依据：《诡秘之主》途径「黄昏巨人」序列 1「神明之手」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：简化的代行权柄：可代表自身效忠的神明或旧日展现威能、降下神罚，但只能短暂而节制，否则会逐渐丧失心智成为奴仆
id: seq1_warrior
name: 代行
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 6 }
  - { mad: 3 }
texts:
  priv: |
    你举起手的时候，那只手不太像你的了。
    **有东西从上面下来** —— 不是光，不是声音，是一种「被看见」的感觉。
    底下那片东西全化了。
    你把手放下来，喘了很久。刚才那一下，你差点没回来。
  group: 那片地方昨晚被削平了，像被什么按了一下。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下，先把气喘匀
    effects: [ { dig: 3, mad: -1 } ]
    text: |
      你扶着膝盖喘了很久。**刚才那一下，你差点没回来。**
      喘匀之后你才发现，袖子里的手还在抖。
  - key: '2'
    label: 再举一次，这次举慢一点
    effects: [ { dig: 6, mad: 3, cor: 2 } ]
    text: |
      你举得慢。下来的东西也慢 —— **你多看了它一眼**。
      就那一眼，你之后三天做梦都是那个颜色。
  - key: '3'
    label: 问它一句：你是谁的
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      没有回答。
      但你手心那条线动了一下 —— **像是有人隔着很远拉了拉绳子**。
