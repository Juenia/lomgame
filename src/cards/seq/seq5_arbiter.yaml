# 原著依据：《诡秘之主》途径「审判者」序列 5「惩戒骑士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：惩戒：可选定惩戒目标，包括触犯法律或道德、违背自身规则、攻击过自己的
id: seq5_arbiter
name: 他一直在摔
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    你选了他。
    那天下午他先是摔了一跤，然后杯子碎了划到手，出门被马惊了一下。
    **第三次的时候他跪在地上不肯起来了。**
    你从街对面走过去，没有看他。
  group: 那个人这几天一直不顺，说是撞了邪。
daily_limit: 1

options:
  - key: '1'
    label: 停下，不再选他
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你收回了那个念头。
      **他跪在地上，过了一会儿自己站起来了** —— 拍了拍膝盖上的土，走了。
  - key: '2'
    label: 走过去把他扶起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把他扶到路边坐下。
      **他抬头看你，说了句谢谢** —— 而你不知道该不该受这一句。
  - key: '3'
    label: 站着看他能撑到第几次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你站着没动。第四次之后他不再站起来了。
      **而你还站在街对面** —— 直到天黑你才走。
