# 原著依据：《诡秘之主》途径「门」序列 5「旅行家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：旅行家之门：能进行灵界穿梭，同时可感应外界、自我定位
id: seq5_door
name: 从另一座城市走出来
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 2 }
  - { mp: 2 }
texts:
  priv: |
    你走进那条巷子。
    走了七步 —— 巷子只有五步长。
    **你从另一座城市的巷口走了出来。**
    你回头看了一眼，身后是墙。
  group: 有人在廷根失踪了两天，又在普利兹出现了。
daily_limit: 1

options:
  - key: '1'
    label: 回头看那堵墙
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。身后是墙。
      **而墙上有一道很细的缝** —— 正好一个人的宽。
  - key: '2'
    label: 再走一次，这次数着步数
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你回去了。这次你数着。
      **第六步的时候你已经不在这条巷子里了** —— 而第七步落在别处的地上。
  - key: '3'
    label: 走回去找原来那条巷子
    effects: [ { dig: 5, cor: 2 } ]
    text: |
      你找了半天。那条五步长的巷子还在。
      **只是走七步也出不去** —— 你走了三遍，每次都回到巷口。
