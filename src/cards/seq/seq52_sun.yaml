# 原著依据：《诡秘之主》途径「太阳」序列 5「光之祭司」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：召唤圣光质变为神圣之光：身体后仰双臂张开，一道恢弘纯净的炽烈光柱从天降下，笼罩敌人
id: seq52_sun
name: 双臂张开
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sun'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { hp: 2 }
texts:
  priv: |
    那东西太大了，压得人抬不起头。
    你身体后仰，把双臂张开。
    **光柱从天而降** —— 很粗，很静，落下来的时候没有声音。
    那东西在光里没有了。
  group: 有人昨天在空地上张开双臂站了一会儿，天上就亮了。
daily_limit: 1

options:
  - key: '1'
    label: 保持这个姿势看它消失
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看完了。它消失的地方。
      **地上留下一个圆** —— 很干净，连灰都没有。
  - key: '2'
    label: 把双臂放下
    effects: [ { dig: 5, cor: 2, mad: -1 } ]
    text: |
      你放下了。天上那道光柱还在。
      **过了一会儿才散** —— 散的时候没有声音。
  - key: '3'
    label: 再张一次，对着别的地方
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又张了一次。这次光柱落下去的地方是城那边。
      **而那边没有东西需要驱散** —— 你只是想看看。
