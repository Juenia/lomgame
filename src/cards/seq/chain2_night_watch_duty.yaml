# 事件卡链（M2.87）—— **链的第二段**（三级链的中间那一环）。
# 前置：设 flag `night_watch_duty` 的那张卡
# 自身：要 `flag:night_watch_duty`，并**设出** `watch_partner`（供第三段读）
id: chain2_night_watch_duty
name: 那个脚步声是谁
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:night_watch_duty'
effects:
  - { dig: 3 }
  - { mp: 1 }
  - { flag: watch_partner }
texts:
  priv: |
    你数过，一共三个人值夜。
    但脚步声一直是四个。
    **今天你问了另外两个：「你们听见了吗？」**
    他们对视了一下，其中一个说：「听见了。」
  group: 值夜的那三个人昨天凑在一起说了很久的话。
daily_limit: 1
