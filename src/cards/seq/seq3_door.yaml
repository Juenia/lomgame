# 原著依据：《诡秘之主》途径「门」序列 3「漫游者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：漫游：与星空星界有关，灵界无法再困住；可进入星空、前往不同星球；空间隐藏可变成空间牢笼
id: seq3_door
name: 上面那些星
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { mp: 3 }
texts:
  priv: |
    你抬头看了一眼那些星。
    **你上去过。** 说不太清是怎么去的，就像推了一扇门。
    上面很冷，也很静，那些星是石头。
    你回来了。回来之后你看天的时候，眼神不太一样。
  group: 有人整夜坐在屋顶上，看着天。
daily_limit: 1

options:
  - key: '1'
    label: 记住上去的路
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你闭眼回想。那扇「门」在的地方你记得。
      **就在头顶偏左那片空处** —— 那里看起来什么都没有。
  - key: '2'
    label: 再上去一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又上去了。这次上面有人在。
      **他背对着你，没有回头** —— 而他的影子是往上看的方向长的。
  - key: '3'
    label: 回屋睡觉，什么都不做
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你躺下了。闭上眼还是那些石头。
      **而你睡着了** —— 早上醒来的时候，枕头是湿的。
