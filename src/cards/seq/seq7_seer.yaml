# 原著依据：《诡秘之主》途径「愚者」序列 7「魔术师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：伤害转移：只要未直接死亡、双手还能动，就能将要害位置的伤口转移至不重要的部位
id: seq7_seer
name: 划到的是手心
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    刀锋进来的时候你来不及躲。
    你感觉到的是**手心**一阵刺痛 —— 而刚才那一刀明明是冲胸口来的。
    你把袖子卷起来看了一眼，胸口什么都没有。
    手心那道口子不深，几天就好。**但你知道自己刚才本该躺下。**
  group: 有人被捅了一刀，第二天照常上工。
daily_limit: 1

options:
  - key: '1'
    label: 包扎好，照常出门
    effects: [ { dig: 3, hp: 2 } ]
    text: |
      手心缠上布，你照旧去了该去的地方。
      有人问你手怎么了，你说裁纸划的。**这话不算撒谎**。
  - key: '2'
    label: 去找那一刀是谁给的
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      你顺着来路往回走。伤口在移，说明下刀的人在附近 —— 这个判断比疼更清楚。
  - key: '3'
    label: 自己再划一刀，看它往哪移
    effects: [ { dig: 7, hp: 4, mad: 3 } ]
    text: |
      你在手背上试了一次。伤口没有留在手背 —— 它去了小臂内侧。
      **你确认了规则，代价是自己挨的这一下。**
  - key: '4'
    label: 找人把这件事说出去
    effects: [ { dig: 2, dp: 1 } ]
    text: |
      你把这件事讲给一个信得过的人听。他听完没说话，只是看了你很久。
      说出来之后，那件事**第一次不再只属于你**。
