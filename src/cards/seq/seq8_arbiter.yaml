# 原著依据：《诡秘之主》途径「审判者」序列 8「治安官」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：只要见过真人、照片或素描就能牢牢记住目标的样子，获得超凡层面上的额外感应
id: seq8_arbiter
name: 三天前在另一个区
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    集市上人很多，你在人群里看见一张脸。
    你不认识他 —— 但你**确定**他三天前在北区出现过，站在一家铺子门口。
    你从没去过那家铺子，也从没见过他。
    你站在原地，看着自己的手。**知道这件事，是要付代价的。**
  group: 集市上有个人站住了，一直盯着一个陌生人的背影。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下，不追
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把手放下了。
      **那个人在人群里拐了个弯就不见了** —— 而你还在原地站着。
  - key: '2'
    label: 去那家铺子看看
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你去了。铺子关着门，窗上贴着「招租」。
      **门缝里有新扫的灰** —— 有人每天来扫，但没开门。
  - key: '3'
    label: 记住他的脸，等他自己出现
    effects: [ { dig: 7, dp: 1 } ]
    text: |
      你把那张脸记住了。三个月后他在同一条街上又出现了一次。
      **而这一次他先看见了你的手** —— 他看的是你的手，不是脸。
