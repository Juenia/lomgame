# 原著依据：《诡秘之主》途径「门」序列 6「记录官」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：对方序列越高失败概率越高；刚晋升时记录序列 4 的能力十几次也未必成功一次
id: seq62_door
name: 十几次也未必成
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:door'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你看了十几遍。
    「我来到，我看见，我记录。」你一遍一遍地念。
    **前十四次都是空的。**
    第十五次手心里有了点东西 —— 很淡，只有一点点。你把拳头握紧了。
  group: 有人对着一堵墙念了一下午同一句话。
daily_limit: 1

options:
  - key: '1'
    label: 把拳头里的东西收好
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把它收进一个小盒。
      **它一直在动** —— 很轻，而它确实是活的。
  - key: '2'
    label: 再来一次，看看能不能多拿一点
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你又念了十几遍。这次手心里是空的。
      **而盒子里那个动得更厉害了** —— 你按着盒子念完的最后一遍。
  - key: '3'
    label: 把那句话写下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你写下来了。写的时候手很顺。
      **顺到你怀疑自己早就写过** —— 而你翻遍了本子，没有。
