# 原著依据：《诡秘之主》途径「审判者」序列 9「仲裁人」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：拥有让人信服的魅力和足够的权威；让与其冲突的生物不自觉想要屈服
id: seq9_arbiter
name: 一句话
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:arbiter'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 1 }
  - { mad: 1 }
texts:
  priv: |
    街上两个人揪着领子在吵，围观的人不敢上前。
    你路过，说了一句 —— 不响，也没抬手。
    两边都停了。他们看看对方，又看看你，然后各自退开。
    你走开之后才发现：**你刚才那句话其实什么也没说。**
  group: 街上那场架忽然停了，没有人看清是怎么停的。
daily_limit: 1

options:
  - key: '1'
    label: 不回头，接着走
    effects: [ { dig: 4 } ]
    text: |
      你走开了。身后两个人各自捡起自己的东西。
      **而他们互相看了一眼** —— 那一眼里有种说不出的东西。
  - key: '2'
    label: 回去想想自己刚才说了什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你想了很久。那句话你确实什么都没说。
      **而他们停下来了** —— 你到现在也没想通中间那一步是怎么过度的。
  - key: '3'
    label: 找两个人再试一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你对着街角两个吵架的商贩说了一句。他们也停了。
      **而这一次你的嘴根本没有动** —— 你只是在心里把那句话过了一遍。
