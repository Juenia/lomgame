# 原著依据：《诡秘之主》途径「黑皇帝」序列 5「混乱导师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：可扭曲自身和目标的概念，使双方对半承担受到的伤害
id: seq52_lawyer
name: 对半承担
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:lawyer'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    他那一刀砍得很实。
    你流了血 —— **他也流了血**，在同一个位置。
    他愣住了，又砍了一刀。
    两刀之后他自己先停了。
  group: 那场架打完，两个人都带着一样的伤。
daily_limit: 1

options:
  - key: '1'
    label: 停下来，看他反应
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你停住了。他也停住了。
      **而他一直在按自己的肩膀** —— 按的是你流血的那个位置。
  - key: '2'
    label: 再让他砍一刀
    effects: [ { dig: 7, hp: 3, cor: 3, mad: 3 } ]
    text: |
      他砍了第三刀。你肩上又多了一道。
      **而他也多了一道** —— 在同一个地方，连长度都一样。
  - key: '3'
    label: 告诉他这是怎么回事
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你说了。他听完把刀扔了，扔得很远。
      **然后蹲下来** —— 蹲了很久都没起来。
