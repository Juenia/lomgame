# 原著依据：《诡秘之主》途径「门」序列 8「戏法大师」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：冰冻：快速降温、凝霜或制造薄冰，射线有效距离不超过十米
id: seq83_door
name: 雾里多了一块冰
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:door'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { hp: -1 }
texts:
  priv: |
    他追进那条巷子，你回头指了一下。
    **地上结了一层薄冰** —— 只有掌心大小，正好在他落脚的地方。
    他滑了。你听见了骨头磕在石头上的声音。
    你没有回头去看。
  group: 那条巷子昨天有人摔断了腿，地上却什么都没有。
daily_limit: 1

options:
  - key: '1'
    label: 不回头，走掉
    effects: [ { dig: 5 } ]
    text: |
      你走出巷子，拐了两个弯。
      **身后那声喘气越来越远** —— 而你一直没有回头看。
  - key: '2'
    label: 站着把那声响听完
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你站着听。骨头磕石头的声音只有一下。
      **然后是喘气** —— 很长，中间断了一次。
  - key: '3'
    label: 回去把那块冰收起来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走回去了。冰已经化了。
      **而地上那块地方是干的** —— 旁边全是湿的。
