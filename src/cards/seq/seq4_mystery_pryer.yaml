# 原著依据：《诡秘之主》途径「隐者」序列 4「神秘学家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：根据解析的血液不同，擅长的方面与拥有的能力会有不同
id: seq4_mystery_pryer
name: 血的来源
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    那管血在灯下是暗红的，比起人血稀一点。
    你把它放在舌尖沾了一点，然后吐掉。
    **你知道了它是什么东西的。** 也知道自己以后会往哪边走。
    你把剩下的倒了，瓶子洗干净放回原处。
  group: 有人在药铺买了一管很奇怪的血。
daily_limit: 1

options:
  - key: '1'
    label: 把瓶子洗干净放回去
    effects: [ { dig: 4 } ]
    text: |
      你冲了三遍，搁回原处。
      走的时候药铺老板看了你一眼 —— **他什么都没问**。
  - key: '2'
    label: 再沾一点，尝清楚
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      第二口你尝得更清楚。
      **你知道它来自什么，也知道那东西现在在哪** —— 那是最不该知道的一条。**
  - key: '3'
    label: 查这管血是谁送来的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      药铺说是个外地人。
      描述里有一个细节对不上 —— **那个人没有影子**。
