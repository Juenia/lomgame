# 原著依据：《诡秘之主》途径「愚者」序列 5「秘偶大师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：像操纵木偶一样掌控目标，产生效果前目标几乎没法察觉；一旦初步掌控，对方会思维迟缓、身体僵硬
id: seq52_seer
name: 思维迟缓
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:seer'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    你动了一下手指。
    **他慢了。** 说话慢了半拍，抬手也慢。
    他自己觉得是累了。
    你把手放下。他慢慢跟上来，走在后面。
  group: 那个人这两天反应一直很慢，说不上为什么。
daily_limit: 1

options:
  - key: '1'
    label: 松开手，让他自己走
    effects: [ { dig: 2, mad: -1 } ]
    text: |
      你把手放下。过了十几秒他才跟上来，走在后面。
      那慢掉的半拍**还没回来** —— 你才知道自己刚才压得有多深。
  - key: '2'
    label: 多压一会儿，看他能撑多久
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你数着秒。第四分钟他开始扶墙，第五分钟他跪下了。
      你松开的时候他抬头看你，眼睛里没有害怕 —— **他不知道自己刚才怎么了**。
  - key: '3'
    label: 让他当众出个丑
    effects: [ { dig: 4, cor: 2 } ]
    text: |
      他当着三个人的面把杯子碰倒了，手忙脚乱地道歉。
      没人怀疑。你端着杯子站在旁边，**觉得比想象中没意思**。
  - key: '4'
    label: 用这半拍做点正事
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      趁他慢的那两秒，你看清了他袖口里的东西。
      松开手之后你还站在原地 —— 他没有回头。
