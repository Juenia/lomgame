# 原著依据：《诡秘之主》途径「魔女」序列 9「刺客」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：擅长躲藏在阴影里，拥有灵巧的步伐、敏捷的动作和将全部力量爆发在一击之内的能力
id: seq92_assassin
name: 全部力量在一击里
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 1 }
  - { dig: 3 }
texts:
  priv: |
    你在那个角落里站了两个钟头，没有动。
    他走过来的时候，你只出手一次。
    **全部力量都在那一下里。**
    完事之后你退回了原来的角落。街上的灯还亮着。
  group: 那条巷子里出过事，等有人发现的时候天都亮了。
daily_limit: 1

options:
  - key: '1'
    label: 退回角落，等灯灭
    effects: [ { dig: 5 } ]
    text: |
      你退回原来的角落，站着没动。街上的灯还亮着。
      **而你数着它们一盏一盏灭掉** —— 数到第七盏的时候天快亮了。
  - key: '2'
    label: 走过去看看他还有没有气
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走过去。他还有气。
      **你看了一眼就走了** —— 你没有补第二下，也没有救他。
  - key: '3'
    label: 回去再练一次，这次留三分力
    effects: [ { dig: 7, hp: 3, cor: 3 } ]
    text: |
      你只用了七分。他活下来了。
      **而那比死了更难交代** —— 他记住了你的脸，而你没打算再找他。
