# 原著依据：《诡秘之主》途径「月亮」序列 9「药师」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：擅长调配药剂，驯化并使用植物和失去了生命的动物某部分给人治病；对毒素的抗性比较强
id: seq9_apothecary
name: 第三味是错的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { hp: 2 }
texts:
  priv: |
    你在药铺后间把三味药摆开，闭着眼分。
    分完睁眼 —— 全对。除了第三味：它不是你说的那味，但**是对的**。
    你尝了一小口自己配的东西，先麻后清。你知道自己不会死，这件事你第一次是确定的。
  group: 药铺后间飘出一股甜腥味，甜得不该是药。
daily_limit: 1

options:
  - key: '1'
    label: 把第三味单独包好，写上「对的」
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把它包起来，写上一个字：**对**。
      写完你自己愣了一下 —— 你不认识的药，凭什么写「对的」。
  - key: '2'
    label: 再配一次，按你自己分的来
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你按自己分的配了一剂。先麻后清，和上次一样。
      **而这一次你知道自己不会死** —— 那是一种很奇怪的安全感。
  - key: '3'
    label: 把这件事告诉药铺老板
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      你说了。他看了你很久。
      **然后从柜台底下拿出来一个一模一样的瓶子** —— 里面是空的，标签也撕了。
