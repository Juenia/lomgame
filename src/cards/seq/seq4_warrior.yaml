# 原著依据：《诡秘之主》途径「黄昏巨人」序列 4「猎魔者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：夸张的力量和介于神与人之间的精神；能以带起飓风的高速奔跑；黎明骑士与守护者能力质变
id: seq4_warrior
name: 风在身后
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 4 }
  - { dig: 1 }
texts:
  priv: |
    你跑起来的时候，身后带起了一路的风。
    不是风跟着你，是**你带起了风**。
    街边的窗子响了起来。
    你追上它的时候，它已经没有地方跑了。
  group: 昨晚街上刮过一阵风，很快，像有什么跑过去。
daily_limit: 1

options:
  - key: '1'
    label: 停下来，回头看那条街
    effects: [ { dig: 3 } ]
    text: |
      风还在街上打转，窗子一扇扇响。
      你站在街口看了一会儿 —— **风是你带起来的，可它不听你的**。
  - key: '2'
    label: 再跑一次，这次更快
    effects: [ { dig: 6, hp: 2, mad: 1 } ]
    text: |
      这次窗子碎了，有人喊了一声。
      你停在两条街之外，**肺里一点都不烫** —— 身体在跟上，脑子还没。
  - key: '3'
    label: 把速度压下来，慢慢走回去
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你数着每一步走回去。街上的人从你身边过，谁都没多看一眼。
      **刚才那种速度，人的眼睛根本跟不上** —— 这既是本事，也是藏身之处。
