# 原著依据：《诡秘之主》途径「红祭司」序列 7「纵火家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能隐蔽快捷地开启灵视，看到以太体各部位的颜色；更能察觉是否被人跟踪
id: seq7_hunter
name: 他站了二十分钟
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    你走到街口回头看。
    那个人在报摊前站着 —— 已经二十分钟了。
    而报摊上只有三份报纸，他手里那份早就翻完了。
    你没有再回头。你换了一条路，绕了很远才回家。
  group: 有人今天绕了很远的路才回住处。
daily_limit: 1

options:
  - key: '1'
    label: 不再回头，绕路回家
    effects: [ { dig: 5 } ]
    text: |
      你换了条路，绕了很远。
      **到家的时候天已经黑了** —— 而你没有开灯，先在窗边站了一会儿。
  - key: '2'
    label: 进铺子，从里面看外面
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你进去买了包烟。透过玻璃看出去，他还站在那儿。
      **而他已经不翻报纸了** —— 报纸夹在胳膊底下，人正对着这边。
  - key: '3'
    label: 回去问他在等谁
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走回去了。他抬头看你的时候一点都不意外。
      **像是等你很久了** —— 而他先开的口：「你绕了很远。」
