# 原著依据：《诡秘之主》途径「完美者」序列 0「完美者」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：知识（信息）象征下偏现实的那部分权柄：掌握现实世界已被发现的全部知识并能做一定修改，在大陆层面立即生效，在星球层面迅速生效
id: seq0_perfect
name: 改一改现实
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:perfect'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 7 }
  - { hp: 3 }
texts:
  priv: |
    你翻了一下那本书，找到某一页。
    **你把其中一个数改了。** 很小的一处，改完把书合上。
    第二天，那个东西真的轻了一点。
    没有人发现。因为所有人记的都是新的那个数。
  group: 有些东西变了，没有人记得它变过。
daily_limit: 1

options:
  - key: '1'
    label: 合上书，不再改
    effects: [ { dig: 4 } ]
    text: |
      你把书合上，放回原处。
      **那个数已经是新的了** —— 而没有人记得它旧的。
  - key: '2'
    label: 把那个数改回去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你改回去了。第二天那东西重了一点。
      **而所有人都觉得它本来就该这么重** —— 你改的是数，不是他们的记性。
  - key: '3'
    label: 翻几页，看看还有哪些数
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你翻了三页就合上了。
      **不是不敢改，是不知道该改哪个才对** —— 那一页上全是数，每一个都连着别的东西。
  - key: '4'
    label: 把这本书收好
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把它塞进书架最里面，用别的书挡上。
      **这本书以后还会有人翻到** —— 你能做的只是让它晚一点。
