# 原著依据：《诡秘之主》途径「白塔」序列 6「博学者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：解析：在具备前置知识的情况下解析对手的非凡能力，迅速辨识具体情况、明白擅长和缺陷
id: seq62_reader
name: 解析
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:reader'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 4 }
  - { mp: 1 }
texts:
  priv: |
    他抬手的时候你在看。
    **看的是他怎么抬手** —— 手腕的角度、呼吸的位置。
    「你这一招不能连发，」你说，「间隔大概五秒。」
    他第二次抬手的时候，你数到了三。
  group: 那场架打赢的人，从头到尾只说了两句话。
daily_limit: 1

options:
  - key: '1'
    label: 再数一次他抬手的间隔
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你数了第二次。三秒半。
      **比刚才短了半秒** —— 而他没有加快的意思。
  - key: '2'
    label: 告诉他该怎么改
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。他试了一遍，这次能连发两下。
      **而他看你的眼神变了** —— 他大概在想自己练了几年。
  - key: '3'
    label: 自己也抬手试一遍
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你试了一遍。手腕的角度差了一点。
      **而你知道差在哪** —— 差在他抬手的时候肩膀先动了。
