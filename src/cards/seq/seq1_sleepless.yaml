# 原著依据：《诡秘之主》途径「黑暗」序列 1「厄难骑士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：大天使层面的骑士；厄难：给予敌人厄难；黑暗仆人：黑夜中几乎无法被真正杀死，每次死亡都能从黑暗中回归
id: seq1_sleepless
name: 来自黑暗
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 6 }
  - { cor: 2 }
texts:
  priv: |
    他把你打倒了 —— 第三次。
    **你从黑暗里回来了。** 第四次，第五次。
    他开始怕了，手在抖。
    「你到底要死几次？」他喊。你说：「你猜。」
  group: 那个人被杀了三次，第二天还在街上走。
daily_limit: 1

options:
  - key: '1'
    label: 再站起来一次
    effects: [ { dig: 7, hp: 4, cor: 4, mad: 4 } ]
    text: |
      你站起来了。第六次。
      **而他已经不再打了** —— 他把刀扔了，蹲在地上。
  - key: '2'
    label: 问他为什么杀你
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他说是有人出的钱。
      **而他说不出是谁** —— 他说他只见过那个人一次，在很暗的地方。
  - key: '3'
    label: 走过去把手放在他肩上
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走过去。他站着没动。
      **而你感觉到他整个人在往下沉** —— 像是被什么压住了。
