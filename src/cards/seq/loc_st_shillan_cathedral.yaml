# 地点专属（M2.87）。地点：「圣希尔兰教堂」（st_shillan_cathedral，危险度 1）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_st_shillan_cathedral
name: 烛台少了一根
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:圣希尔兰教堂'
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    祭坛上的烛台一共十二根，你数过很多次。
    今天**只有十一根**。
    你问执事，他说一直就是十一根。
    你再看的时候，十二根。
  group: 圣希尔兰教堂的执事说祭坛从来没变过，有人坚持说少了一根。
daily_limit: 1

options:
  - key: '1'
    label: 再数一遍
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你又数了一遍。这次是十二。
      **而十二根里有十一根是旧的** —— 最靠边那根是新的。
  - key: '2'
    label: 问执事那根哪去了
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      他愣了一下，说他不知道你在说什么。
      **而他一直在看最靠边那个位置** —— 看了三次。
  - key: '3'
    label: 把那根的位置记下来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你在心里记了个数：从左边数第十二根。
      **第二天再来** —— 那一根又不见了，而执事说的话和昨天一样。
