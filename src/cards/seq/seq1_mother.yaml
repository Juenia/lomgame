# 原著依据：《诡秘之主》途径「母亲」序列 1「自然行者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握自然与母亲的部分权柄；自然之子：可改造环境，让深渊都变得适合人类生存；能与大地树林水流山峰矿石成为一体
id: seq1_mother
name: 深渊也能住人
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 1
  max_seq: 1
effects:
  - { hp: 5 }
  - { dig: 3 }
texts:
  priv: |
    那道裂缝底下本来是活不了人的。
    你下去了，在里面待了三天。
    **上来的时候，底下长东西了** —— 能吃的，能烧的，能喝的。
    你把第一捧土带上来给那些人看。
  group: 那条裂缝底下最近有人在下去。
daily_limit: 1

options:
  - key: '1'
    label: 把土给他们看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他们围着那捧土看了很久。
      有人抓了一把放进嘴里尝了尝 —— **然后蹲下去，把脸埋在自己手里。**
  - key: '2'
    label: 再下去一次，多带点上来
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      你带上来三样：一样能吃，一样能烧，还有一样你不知道是什么。
      **那第三样你自己收了起来。**
  - key: '3'
    label: 教他们怎么在底下活
    effects: [ { dig: 7, dp: 1 } ]
    text: |
      你教了七天。第八天你没下去。
      **他们自己下去了** —— 回来的时候手里拎着东西，脸上有泥。
