# 原著依据：《诡秘之主》途径「愚者」序列 8「小丑」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：得到化纸张为飞刀的类法术能力
id: seq82_seer
name: 纸变刀
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:seer'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    桌上有一张废纸，你顺手捏了一下。
    **它硬了。** 边很薄，能割手。
    你把它扔出去，钉在了门框上。
    你走过去把它拔下来，展开 —— 还是纸。
  group: 那家门框上有个很细的口子，像是被纸划的。
daily_limit: 1

options:
  - key: '1'
    label: 把纸收起来，当没发生
    effects: [ { dig: 3 } ]
    text: |
      你把它叠好放进口袋。走之前又回头看了一眼门框上那道口子 —— 它在。
  - key: '2'
    label: 再试一次，这次慢一点
    effects: [ { dig: 5, mad: 1 } ]
    text: |
      你换了一张纸，捏的时候注意了手指的每一节。
      它变硬的过程你**全程看见了** —— 那比变硬本身有用得多。
  - key: '3'
    label: 拿它去试别的东西
    effects: [ { dig: 4, hp: 1 } ]
    text: |
      纸刀切开了桌上的蜡烛，又切开了窗帘的一角。
      收手的时候手指被自己的刀划了一道 —— 你还不太熟。
