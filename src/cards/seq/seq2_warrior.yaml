# 原著依据：《诡秘之主》途径「黄昏巨人」序列 2「荣耀者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：简化的黄昏：可让身体飞快老去、蒸发、于灵界重生；也可延缓衰老；一击中让目标逐渐老化
id: seq2_warrior
name: 飞快老去
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 5 }
  - { cor: 2 }
texts:
  priv: |
    那一刀砍中的时候，你**老了**。
    皮肤塌下去，头发白了，然后又慢慢回来。
    对面那个人看着自己手里的刀，刀身已经锈了。
    「你刚才砍的是什么？」你问。他答不上来。
  group: 那把用了一辈子的刀，昨天忽然锈透了。
daily_limit: 1

options:
  - key: '1'
    label: 摸摸自己的脸
    effects: [ { dig: 4 } ]
    text: |
      是自己的脸，**但皮比记忆里松**。
      你在墙上的玻璃里照了照，眼角的纹路还在 —— 它没跟着回去。
  - key: '2'
    label: 把那把锈刀捡起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      刀锈透了，掂在手里轻得不像是铁的。
      你把它收起来 —— **这是「你刚才砍的是什么」唯一的答案**。
  - key: '3'
    label: 对着镜子再老一次，看能撑多久
    effects: [ { dig: 7, mad: 3, hp: 2 } ]
    text: |
      你看着镜子里的自己一点点塌下去，皮贴着骨头。
      **你数到第七秒才让它回来。** 回来之后你在镜子前坐了很久。
