# 原著依据：《诡秘之主》途径「深渊」序列 6「恶魔」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：力量、速度和防御全面提升（皮肤变异如盔甲），免疫大部分毒素
id: seq6_criminal
name: 一道白印
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 4 }
  - { cor: 1 }
texts:
  priv: |
    刀划过去的时候你听见了声音 —— 那种刮在硬东西上的声音。
    你低头看，只留了一道白印。
    **他往后退了两步。**
    你把手抬起来看了看，皮肤下面是别的颜色。
  group: 有人被砍了一刀，衣服破了，人没事。
daily_limit: 1

options:
  - key: '1'
    label: 把袖子放下来
    effects: [ { dig: 5 } ]
    text: |
      你把袖子放下来，转身走了。
      **身后那个人还举着刀** —— 举了很久才放下。
  - key: '2'
    label: 当着他的面把袖子卷起来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你卷起袖子，让他看。他看了很久。
      **然后他跑了** —— 跑的时候撞翻了一个摊子，摊主在后面骂。
  - key: '3'
    label: 伸手摸那道白印
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你摸了摸那道白印。底下的东西是硬的。
      **而且比皮肤凉** —— 凉得像一块放在屋外的石头。
