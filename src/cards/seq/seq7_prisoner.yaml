# 原著依据：《诡秘之主》途径「被缚者」序列 7「狼人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：恐怖的力量、敏捷和速度，自愈能力出色；狼人化后进一步提升
id: seq7_prisoner
name: 自己合上
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 4 }
texts:
  priv: |
    你用刀把手掌划开，让血流出来 —— 你想看看。
    血还没滴到地上，口子已经开始合了。
    你盯着它，直到只剩一条白线。
    然后你把刀收起来，用清水冲了冲手。**冲的时候你在想别的事。**
  group: 有人把手掌划开了，而第二天手上什么都没有。
daily_limit: 1

options:
  - key: '1'
    label: 把刀收起来，做别的事
    effects: [ { dig: 5 } ]
    text: |
      你把刀收起来，冲了冲手，去干别的了。
      **那一整天你都没再看那只手** —— 而它一直是凉的。
  - key: '2'
    label: 再划一刀，这次深一点
    effects: [ { dig: 7, hp: 3, cor: 3, mad: 3 } ]
    text: |
      你又划了一刀，更深。这次合得慢了一点。
      **而你看见口子里有东西在动** —— 像是有很多很细的线在织。
  - key: '3'
    label: 看看那条白线还在不在
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你摊开手。白线还在。
      **很淡，但位置对得上** —— 而它的方向和你划的那一刀不一样。
