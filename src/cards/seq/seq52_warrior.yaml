# 原著依据：《诡秘之主》途径「黄昏巨人」序列 5「守护者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：一旦转入守护状态放弃攻击，高序列以下很少有人能打破防御，各种类型的伤害都一样
id: seq52_warrior
name: 放弃攻击
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:warrior'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 5 }
  - { dig: 1 }
texts:
  priv: |
    你把剑插进地里，然后**没有再动**。
    他们打了很久。刀、火、还有别的。
    你一直在原地。
    等他们停了，你身后那几个人一个都没伤。
  group: 那条巷子昨晚打了很久，最后谁也没伤到人。
daily_limit: 1

options:
  - key: '1'
    label: 一直站着，等他们停
    effects: [ { dig: 4, hp: 1 } ]
    text: |
      你一直在原地。他们打到手酸。
      停手之后你回头看了一眼 —— **身后那几个人一个都没伤**。
  - key: '2'
    label: 等到第三下再还手
    effects: [ { dig: 6, hp: 3, mad: 1 } ]
    text: |
      你数着：一下、两下 —— 第三下的时候你拔了剑。
      **那一下之后他们不再打了。** 你剑上沾的血不是自己的。
  - key: '3'
    label: 记下每一刀落在哪儿
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      左肩、右腿，还有一样说不出的东西打在胸口。
      前两处你扛住了，**胸口那一下你记住了** —— 那不是兵器。
