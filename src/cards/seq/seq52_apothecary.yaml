# 原著依据：《诡秘之主》途径「月亮」序列 5「深红学者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：对梦魇类影响有天然抵抗力；能力的强弱取决于对月亮领域的了解和研究
id: seq52_apothecary
name: 不怕噩梦
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 3 }
  - { mad: -2 }
texts:
  priv: |
    那东西钻进你的梦了。
    梦里是你小时候住的屋子，门一直响。
    **你站在屋里没有动。** 你知道这是梦，也知道它在哪儿。
    你醒过来的时候天还没亮。屋里什么都没有。
  group: 有人整夜没关灯，早上起来精神很好。
daily_limit: 1

options:
  - key: '1'
    label: 在梦里把那扇门打开
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走过去开门。
      **门后面站着的是你自己** —— 而那个你在说：别开。
  - key: '2'
    label: 记住门响的节奏
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你数了：一长两短，一直重复。
      **那不是风** —— 是有人在敲，而且敲得很有耐心。
  - key: '3'
    label: 醒来之后接着睡
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你翻了个身又睡着了。
      **这一次它没有再来** —— 早上的时候你甚至不确定昨晚有没有响过。
