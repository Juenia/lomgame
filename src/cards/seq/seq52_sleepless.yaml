# 原著依据：《诡秘之主》途径「黑暗」序列 5「灵巫」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：能驱使的灵数量受制于本身灵体强度，此阶段最多四到五个；梦魇范围提升到两百米
id: seq52_sleepless
name: 四到五个
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sleepless'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { cor: 2 }
texts:
  priv: |
    **两百米** —— 你在心里量了一下。
    这附近的梦你都能进去。
    你挑了最远的那一间。
    里面的人睡得很沉。你站在床边看了一会儿，出来了。
  group: 那一片的人这两天都做了差不多的梦。
daily_limit: 1

options:
  - key: '1'
    label: 再进下一个梦
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你又进了一个。那个人在梦里跑。
      **而他跑的路是同一个圈子** —— 他也知道，但是他停不下来。
  - key: '2'
    label: 看看他梦见了什么地方
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着看。他梦见的是这条街。
      **而街上没有人** —— 连他自己都不在。
  - key: '3'
    label: 在梦里跟他说一句话
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你说了。他在梦里停下来。
      **而他转过身的时候，脸上没有五官** —— 而他还在等你把话说完。
