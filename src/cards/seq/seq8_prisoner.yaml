# 原著依据：《诡秘之主》途径「被缚者」序列 8「疯子」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可以主动牺牲理智、爆发欲望来换取力量；对影响精神的非凡能力有强大抵抗力
id: seq8_prisoner
name: 我放开了三秒
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
  - { mad: 3 }
texts:
  priv: |
    你把手按在墙上，做了一个决定。
    **你让自己失控了。三秒。**
    第三秒结束的时候，墙塌了一半，你站在灰里喘气，脑子慢慢回来。
    回来的时候你发现手里攥着一样东西 —— 你不记得什么时候拿的。
  group: 那面墙塌了，站在灰里的人一直在喘。
daily_limit: 1

options:
  - key: '1'
    label: 看看手里攥着什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你摊开手。是一块砖 —— 半块。
      **而它是凉的** —— 凉得像从很深的地方拿出来的。
  - key: '2'
    label: 再放开一次，这次数着秒
    effects: [ { dig: 7, hp: 4, cor: 4, mad: 4 } ]
    text: |
      你数着。第一秒墙开始响，第二秒你听不清自己在想什么，
      **第三秒你把手收了回来** —— 收回来的时候五个指头都在抖。
  - key: '3'
    label: 站着把气先喘匀
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你扶着膝盖喘。灰一直在落。
      **喘匀之后你才听见** —— 外面有人在敲门。
