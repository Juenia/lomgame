# 原著依据：《诡秘之主》途径「空想家」序列 8「读心者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：观察能力深入到气场、以太体等神秘领域
id: seq82_spectator
name: 以太体
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:spectator'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你看那个人，看的不是他的脸。
    **是他外面那一层。** 它今天是灰的，边缘有点散。
    「你昨晚没睡好，」你说。
    他愣住了。他什么都没说，但你知道说对了。
  group: 有人一眼看出对面的人没睡好。
daily_limit: 1

options:
  - key: '1'
    label: 再看他那一层
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又看了一眼。那层灰比刚才更淡。
      **而边缘散得更开** —— 像是被谁扯过。
  - key: '2'
    label: 问他要不要坐一会儿
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说了。他愣了两秒，然后坐下了。
      **一坐下就睡着了** —— 而这里是人来人往的街边。
  - key: '3'
    label: 低头看看自己那一层
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你低头看自己。你那一层是黑的。
      **而它比昨天厚** —— 厚到你能看见它在慢慢动。
