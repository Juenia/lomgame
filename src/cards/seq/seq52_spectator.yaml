# 原著依据：《诡秘之主》途径「空想家」序列 5「梦境行者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：修改：通过对梦境的修改日积月累地影响目标，让对方不知不觉改变，做出原本不会做的事
id: seq52_spectator
name: 日积月累
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:spectator'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    你每天晚上去一趟。
    不做什么 —— 只是把他梦里那扇门挪一寸。
    **第十天他自己提起那件事了。**
    他说他最近想通了。你没有接话。
  group: 那个人这半个月变了，熟人都有点意外。
daily_limit: 1

options:
  - key: '1'
    label: 第十一天再去一趟
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你又去了。这次门自己开了。
      **而你什么都没做** —— 你只是站在床边看着。
  - key: '2'
    label: 问他最近想通了什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他说他突然觉得那件事不值得记恨。
      **而他说这话的时候在笑** —— 笑得有点勉强。
  - key: '3'
    label: 把那扇门挪回去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把门挪回去了。第二天他来找你。
      **而他说不出为什么** —— 他只说昨晚没睡好。
