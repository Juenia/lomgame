# 原著依据：《诡秘之主》途径「魔女」序列 6「欢愉」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：擅长魅惑；能像蜘蛛一样制造近乎无形的细线缠绕目标，减缓其速度
id: seq6_assassin
name: 脚迈不动
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 6
  max_seq: 6
effects:
  - { cor: 1 }
  - { dig: 2 }
texts:
  priv: |
    你在酒馆里坐了一晚上，跟谁都没说几句话。
    出门的时候你发现有人跟着 —— 你加快脚步，他也快。
    走到巷口你忽然迈不动腿了，像被什么缠住。
    **你回头看，他站得不远，笑得很温和。**
  group: 那晚之后有人走路一直不太稳，说是腿麻。
daily_limit: 1

options:
  - key: '1'
    label: 站住不动，等他先说话
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你停下来了。他也停了。
      **站得不远，笑着看你** —— 而你迈不动的那条腿还麻着。
  - key: '2'
    label: 用力挣开往前走
    effects: [ { dig: 6, hp: 2, cor: 2 } ]
    text: |
      你用力往前迈。迈开了。
      **但膝盖响了一声** —— 像被什么细的东西扯了一下才断的。
  - key: '3'
    label: 回头问他想要什么
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你回头问他。他笑得温和，说了三个字。
      **而你没听清是哪三个** —— 你只记得他说话的时候舌头是黑的。
