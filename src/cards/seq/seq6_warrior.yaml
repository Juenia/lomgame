# 原著依据：《诡秘之主》途径「黄昏巨人」序列 6「黎明骑士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：巨人般的力量；能让四五十米内布满明净圣洁的晨曦，破除幻觉、削弱恶灵
id: seq6_warrior
name: 那条巷子亮了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    那条巷子里的东西你本来看不见。
    你把剑举起来 —— **巷子亮了。**
    不是灯那种亮，是清晨第一缕光那种。
    有东西在光里散了，散的时候没有声音。
  group: 那条从未见过太阳的巷子，昨晚亮过一下。
daily_limit: 1

options:
  - key: '1'
    label: 把剑收起来，让光灭掉
    effects: [ { dig: 3 } ]
    text: |
      光收进剑里的时候有一点延迟 —— **像是它不太想回去**。
  - key: '2'
    label: 举着剑多站一会儿
    effects: [ { dig: 5, hp: 2 } ]
    text: |
      光照到了巷子尽头。有东西在光里散了 —— **散的时候没有声音**。
      你举了很久，手臂开始抖才放下。
  - key: '3'
    label: 走进光里，看散掉的是什么
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你走进那片光。散掉的东西已经没有了 ——
      **但地上留下一小片黑**，光绕着它走。
