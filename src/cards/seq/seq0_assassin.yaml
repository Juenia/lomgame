# 原著依据：《诡秘之主》途径「魔女」序列 0「魔女」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：神国与镜中世界息息相关，只有雌性能够存在；在神国内看到不该看见的会立刻变成石像
id: seq0_assassin
name: 镜中世界
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:assassin'
  min_seq: 0
  max_seq: 0
effects:
  - { cor: 5 }
  - { mad: 3 }
texts:
  priv: |
    你照镜子的时候，镜子里多了一个人。
    **她没有动。** 你动，她才动。
    你退了一步，她也退了一步。
    第二天那面镜子碎了。你在碎片里看见了很多张脸。
  group: 那面镜子碎了，碎片里什么都没有。
daily_limit: 1

options:
  - key: '1'
    label: 盯着她看
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你盯着她。她也在盯着你。
      **而她的眼神比你稳** —— 你眨了一下眼，她没有。
  - key: '2'
    label: 转身离开镜子
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你转过身。身后没有脚步声。
      **但你确定她跟了两步** —— 因为你走到门口的时候，镜子里那点光灭了。
  - key: '3'
    label: 把碎片收起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把碎片一片片收进手帕里。
      **其中一片里有一张脸** —— 不是你，也不是她。
