# 原著依据：《诡秘之主》途径「门」序列 8「戏法大师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：闪光、黑幕、转移气体、巨响：凭空制造巨大的声音，伪造爆炸或干扰注意力
id: seq8_door
name: 屋里没有那种声音
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { mp: 1 }
texts:
  priv: |
    你在空屋里打了个响指。
    声音大得像有一面墙塌了 —— 而屋里没有东西能发出这种声音。
    窗玻璃震了一下。街上有人跑过来看，什么也没找到，走了。
    **你站在屋子中间，忽然明白了一件事：声音也可以是一扇门。**
  group: 那间空屋里响过一声，进去看的人什么也没找到。
daily_limit: 1

options:
  - key: '1'
    label: 再打一个响指
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你又打了一个。这次声音更大。
      **而窗玻璃上多了一道裂** —— 从中间往外，像蛛网。
  - key: '2'
    label: 顺着那个声音找过去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你顺着听。声音的源头在屋子正中间的地板下面。
      **而那里什么都没有** —— 地板是整块的。
  - key: '3'
    label: 走出去，把门带上
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你出去了，把门带上。街上的人问你听见没有。
      **你说没有** —— 而你的耳朵还在响。
