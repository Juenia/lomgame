# 原著依据：《诡秘之主》途径「完美者」序列 1「启蒙者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可展现完整文明图卷；一定文明权柄：可让混沌沉淀出秩序、毁灭焕发新生；一定教化权柄
id: seq1_perfect
name: 文明的重量
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 5 }
  - { hp: 3 }
texts:
  priv: |
    你站在那片废墟上，把画卷展开了。
    **很重。** 那不是纸的重，是很多东西压在一起的重。
    底下那些乱的、散的、坏的东西慢慢沉了下去 —— 沉出一点秩序来。
    你收起画卷的时候，那地方能住人了。
  group: 那片废墟最近有人在盖房子。
daily_limit: 1

options:
  - key: '1'
    label: 把画卷收起来
    effects: [ { dig: 4 } ]
    text: |
      你把画卷卷好，系上带子。
      身后那片地方**已经能住人了** —— 有几个人正在量地基。
  - key: '2'
    label: 展开它，多看一会儿
    effects: [ { dig: 6, mad: 2 } ]
    text: |
      画上那些东西在动。
      你看的明明是「以前」，而它是活的 —— **你看久了会分不清哪边是现在**。
  - key: '3'
    label: 用它把这一整片全整平
    effects: [ { dig: 7, cor: 2, hp: 2 } ]
    text: |
      你又展开了一次，撑得比上次久。
      这次沉下去的东西比上次多 —— **包括几个不该沉的**。你收卷的时候手在抖。
  - key: '4'
    label: 朝废墟上那几个人喊一声
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      他们抬头看你。
      你看得出来他们知道刚才发生了什么 —— **他们不知道该谢你还是该怕你**。
