# 原著依据：《诡秘之主》途径「深渊」序列 4「魔鬼」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能让自身某个部分呈现神话生物的特性并长期保持，从而获得独有的奇异效果
id: seq4_criminal
name: 手臂上的鳞
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 3 }
  - { cor: 2 }
texts:
  priv: |
    你把袖子卷起来。
    小臂上有一片鳞 —— 很整齐，像本来就长在那儿。
    你摸了摸，是凉的，比皮肤硬。
    **你没有把它弄掉。** 你把袖子放下来，去街上走了走。
  group: 那个人在大夏天也一直穿着长袖。
daily_limit: 1

options:
  - key: '1'
    label: 把袖子放下来，照常出门
    effects: [ { dig: 5 } ]
    text: |
      你把袖子放下来，出门走了一圈。
      **没有人多看你的胳膊** —— 他们看的是你的脸，而你的脸很正常。
  - key: '2'
    label: 数一数有几片
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你数了：十七片。
      **而昨天是十六片** —— 你昨天也数过，因为你想确认。
  - key: '3'
    label: 试着把它撕下来一片
    effects: [ { dig: 7, hp: 3, cor: 3, mad: 3 } ]
    text: |
      你撕了一片。底下不是肉。
      **是另一片鳞** —— 更亮的那种，而它已经在那儿了。
