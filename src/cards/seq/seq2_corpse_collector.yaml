# 原著依据：《诡秘之主》途径「死神」序列 2「死亡执政官」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：完全的死亡：剥夺一片区域内所有生命力；大多数复活与替身能力对其无效
id: seq2_corpse_collector
name: 完全的死亡
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 2
  max_seq: 2
effects:
  - { cor: 4 }
  - { hp: 4 }
texts:
  priv: |
    你把手按在地上。
    **什么都没有发生。** 没有声音，没有光，没有风。
    然后那片地上的东西开始倒 —— 草、虫、树，所有会动的东西。
    你站起来，眼前是一片死掉的空地。
  group: 那块地到现在还是秃的，种什么死什么。
daily_limit: 1

options:
  - key: '1'
    label: 站着看完整片地
    effects: [ { dig: 5 } ]
    text: |
      你站着看。草倒下去的时候没有声音，虫子的腿还在动。
      **一盏茶的工夫，地上就什么都不剩了。**
  - key: '2'
    label: 退两步，看看边界在哪
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你退了两步。那条线很整齐。
      **整齐到你会以为有人画过** —— 而那条线内侧的土是灰的。
  - key: '3'
    label: 再按一次，试试更大的范围
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又按了一次。这一次那片地大了一倍。
      **而你身后那棵树也倒了** —— 它倒得很慢，中间还响了一声。
