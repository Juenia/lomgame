# 原著依据：《诡秘之主》途径「死神」序列 5「看门人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：能以身体为囚笼，创造一个独属于自己的小型冥界，容纳一定数量的魂体、亡者与自然灵
id: seq52_corpse_collector
name: 以身体为囚笼
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:corpse_collector'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 3 }
  - { hp: 3 }
texts:
  priv: |
    你把那个东西收了。
    **它现在在你身体里。** 你能感觉到它在里面动，很小，很安静。
    你在街上走了一下午，它一直没出声。
    晚上你把它放出来的时候，它比刚才服帖了。
  group: 那个人这两天一直没怎么说话。
daily_limit: 1

options:
  - key: '1'
    label: 让它在里面多待几天
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你留了它三天。第三天开始你能听见它在你胸腔里叹气。
      **那声叹气很像一个人** —— 而你想不起是谁。
  - key: '2'
    label: 把它放出来看看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把它放出来。它在地上转了一圈。
      **然后自己爬回了你身上** —— 你连拦都没来得及拦。
  - key: '3'
    label: 试试能不能装第二个
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又收了一个。两个东西在你身体里撞了一下。
      **你当场跪在了地上** —— 而它们过了一刻钟才安静下来。
