# 原著依据：《诡秘之主》途径「愚者」序列 6「无面人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能精准回忆认识的人的外形、气质与气味，并变化成相应的模样
id: seq6_seer
name: 镜子里不是我的脸
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你在镜子里看见了自己。
    **但那不是你的脸。**
    是很久以前一个认识的人 —— 连他眉角那道疤都在。
    你盯着看了很久，然后学着那个人笑了一下。镜子里的人也笑了。
  group: 有人在镜子前站了很久，一直没动。
daily_limit: 1

options:
  - key: '1'
    label: 闭上眼睛，换回自己
    effects: [ { dig: 3 } ]
    text: |
      再睁开的时候是你自己，**脸色不太好**。
      你在镜子前站了一会儿，确认眼角那道细纹还在。
  - key: '2'
    label: 用这张脸去找那个人
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你站到他面前。他看见「他自己」的时候退了一步，手按在门框上。
      你一句话都没说就走了 —— **有些事做过一次就够他记一辈子**。
  - key: '3'
    label: 把这张脸记熟，以后还能用
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      你把那道疤的位置、笑的时候哪边嘴角先动，一样一样排好收进记忆里。
      那不是怀念 —— 那是**一份随时可以穿上的东西**。
  - key: '4'
    label: 什么都不做，就坐着看他
    effects: [ { dig: 2, mad: -1 } ]
    text: |
      你没有变回去，也没有走。只是看着镜子里那张别人的脸。
      看了很久之后你发觉，**你已经想不起来他说话的声音了** —— 只剩下脸。
