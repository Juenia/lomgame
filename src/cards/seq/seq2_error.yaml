# 原著依据：《诡秘之主》途径「错误」序列 2「命运木马」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能对他人的命运做出手脚让其出现错误；能寄生具有活着特性的神奇物品；能借分身之死看见命运变化
id: seq2_error
name: 钻命运的漏洞
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 4 }
  - { cor: 2 }
texts:
  priv: |
    占卜师说了三次，三次都是他会活着走出那座城。
    你在那张纸上动了点手脚 —— **不是改字，是改那个「会」。**
    第二天他从城门进去，第三天没有出来。
    占卜师又算了一次。这次纸上什么都没写。
  group: 那个占卜师这几天一直在重算同一个人。
daily_limit: 1

options:
  - key: '1'
    label: 把那张纸留着
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把纸收起来了。第二天再拿出来看。
      **上面又是三个字：他会活着。** —— 字是自己长回去的。
  - key: '2'
    label: 问占卜师算了多少次
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说七次。每次都是同一个结果。
      **而他开始怀疑自己的牌** —— 那对占卜师来说是最坏的结局。
  - key: '3'
    label: 再改一个地方
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又动了一次手。这次改的是那个人的名字。
      **第二天城门口没人记得有过这个人** —— 连你也是想了很久才想起来。
