# 原著依据：《诡秘之主》途径「魔女」序列 3「不老」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：青春永驻，诡异难杀，擅长复活与重生；寿命极长；可呈现女性每个阶段的魅力
id: seq3_assassin
name: 第几个身份
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 4 }
  - { cor: 2 }
texts:
  priv: |
    你在镜子前坐了一会儿，然后把脸换了个年纪。
    先是二十出头，然后四十，然后又是二十。
    **你记不清这是第几个身份了。**
    你把镜子盖上，出门去买菜。
  group: 那栋楼里住的那个女人，十年了没变过。
daily_limit: 1

options:
  - key: '1'
    label: 把镜子盖好，出门买菜
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你盖上布，拎起篮子出门。
      **菜贩子叫你「太太」** —— 那是上个身份的叫法，而你没纠正他。
  - key: '2'
    label: 数一数自己用过几张脸
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你数到第七个就停了。
      **因为第八个你想不起来长什么样** —— 而它一定用过。
  - key: '3'
    label: 换回最开始那张
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你换了。镜子里那个人你认得。
      **而他比你记忆中老了十岁** —— 你盯着看了很久，才确定那确实是你。
