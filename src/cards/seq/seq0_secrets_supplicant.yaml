# 原著依据：《诡秘之主》途径「倒吊人」序列 0「倒吊人」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：阴影之主：阴影世界的主宰；暗：偏向包容吞噬一切的黑暗与堕落人心的黑暗；堕落自性；污秽化身
id: seq0_secrets_supplicant
name: 阴影之主
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 0
  max_seq: 0
effects:
  - { cor: 6 }
  - { hp: 4 }
texts:
  priv: |
    那天傍晚，**所有的影子都动了一下。**
    人、树、墙、石头 —— 它们的影子同时转了转头。
    只有一下。然后就不动了。
    你在场，你看得很清楚。你没有跟任何人说。
  group: 那天傍晚影子动过，看见的人都不肯多讲。
daily_limit: 1

options:
  - key: '1'
    label: 再看一眼那些影子
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你又看了一眼。它们都低着头。
      **一个都没有转过来** —— 而你知道它们在忍着。
  - key: '2'
    label: 什么都不说，走开
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走了。那一下之后街上安静了很久。
      **而没有人提** —— 第二天连你自己都差点当成看错了。
  - key: '3'
    label: 对着一面墙的影子说句话
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你说了。它动了一下。
      **而墙没有动** —— 动的只是墙上那层黑。
