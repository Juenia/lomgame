# 原著依据：《诡秘之主》途径「门」序列 9「学徒」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：前提是没有非凡能力限制，或者屏障不算太厚 —— 学徒没法直接穿越一座山峰
id: seq93_door
name: 过不去的地方
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:door'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { hp: -2 }
texts:
  priv: |
    前面是一座山。
    你把手按上去，等了一会儿。
    **没有用。** 太厚了。
    你退回来，绕着走。手心上有一块红。
  group: 有人在山脚下站了很久，最后绕了远路。
daily_limit: 1

options:
  - key: '1'
    label: 退回来，绕路走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你绕了远路。走到半山腰的时候你回头看了一眼。
      **山还是那座山** —— 而手心上那块红还在。
  - key: '2'
    label: 再试一次，用力一些
    effects: [ { dig: 7, hp: 3, cor: 2 } ]
    text: |
      你又按了一次，这次用了力。手心那块红变大了。
      **而山没动** —— 你收手的时候手在抖。
  - key: '3'
    label: 沿着山脚找薄的地方
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走了一圈。有一处比别处薄。
      **而那里立着一块碑** —— 碑上没有字，只有一个手印。
