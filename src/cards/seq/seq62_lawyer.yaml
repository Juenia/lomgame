# 原著依据：《诡秘之主》途径「黑皇帝」序列 6「腐化男爵」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：腐蚀：能让周围十米内的人心灵一点点变得阴暗，变得贪婪，容易做出不理智的选择
id: seq62_lawyer
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq8_sun 撞了同一个名字，从本卡正文里另取一个短语。
name: 坐了一个晚上
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:lawyer'
  min_seq: 6
  max_seq: 6
effects:
  - { cor: 2 }
  - { dig: 2 }
texts:
  priv: |
    你在那间屋里坐了一个晚上。
    什么都没说，只是坐着。
    **第二天那些人开始为一件事争。** 争的是本来谁都不在乎的东西。
    你没有参与。你走了。
  group: 那伙人昨天为了一件小事翻了脸。
daily_limit: 1

options:
  - key: '1'
    label: 走掉，不参与
    effects: [ { dig: 5 } ]
    text: |
      你走了。身后那间屋子的门是开着的。
      **而里面的声音越来越大** —— 你走出十几步才听不见。
  - key: '2'
    label: 留下来看他们争完
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你留下了。他们争到后半夜。
      **最后谁也没赢** —— 而那件事本来不重要，谁都知道。
  - key: '3'
    label: 再坐一个晚上，把线收紧
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又坐了一晚。第二天那伙人散了。
      **三个走了** —— 剩下的两个再没说过话。
