# 原著依据：《诡秘之主》途径「空想家」序列 2「洞察者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：洞察是描述、干扰、安排和空想的基础；心理暗示达到权柄程度，只要认为足够强大就足够强大
id: seq2_spectator
name: 我认为我够强
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 4 }
  - { dig: 3 }
texts:
  priv: |
    对面那个人比你高一整个头，手里拿着刀。
    你看了他一眼，**在心里认为自己比他强。**
    然后你就真的比他强了。
    刀砍在你肩上，你连皮都没破。你自己也愣了一瞬。
  group: 那个瘦弱的人把三个壮汉打退了。
daily_limit: 1

options:
  - key: '1'
    label: 低头看看自己的肩
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你低头看。衣服破了，皮没破。
      **连红都没有** —— 你按了按，一点都不疼。
  - key: '2'
    label: 再认为自己强一点
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又想了一遍。这次你自己都觉得有点怕。
      **而对面那个人已经开始抖了** —— 他离你还有三步。
  - key: '3'
    label: 让他再砍一刀
    effects: [ { dig: 7, hp: 3, cor: 3, mad: 3 } ]
    text: |
      他又砍了一刀。这次刀崩了。
      **而他扔下刀跑了** —— 跑的时候一直在回头看。
