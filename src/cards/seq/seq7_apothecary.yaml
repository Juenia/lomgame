# 原著依据：《诡秘之主》途径「月亮」序列 7「吸血鬼」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：厌恶阳光，以富含灵性的血液为主食；生命提升可活到三百岁
id: seq7_apothecary
name: 想的是别的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 3 }
  - { cor: 1 }
texts:
  priv: |
    正午你躲在窗帘后面，听外面一群小孩跑过去。
    你已经三天没吃东西了。
    刚才脑子里闪过的**不是面包**。
    你把窗帘拉得更紧了一点。
  group: 那户人家白天从不开窗，夜里倒是常有人进出。
daily_limit: 1

options:
  - key: '1'
    label: 把窗帘拉得更紧
    effects: [ { dig: 4, mad: -1 } ]
    text: |
      你把缝也堵上了。屋里彻底暗下来。
      **而外面那群小孩还在跑** —— 你听得见脚步，一步都没乱。
  - key: '2'
    label: 贴着玻璃看看他们
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你拉开一条缝。有个小孩抬头看你。
      **他没有跑** —— 他只是看着你，像在看一件他早就知道的东西。
  - key: '3'
    label: 再忍一个晚上
    effects: [ { dig: 7, hp: 3, mad: 4 } ]
    text: |
      你没出去。天亮的时候你把指甲掐进了自己的掌心。
      **那是你唯一还能压住的东西** —— 而它已经比昨天难压了。
