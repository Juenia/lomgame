# 原著依据：《诡秘之主》途径「完美者」序列 5「天文学家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：虚假星象：伪造出一片虚假的星空迷惑目标或干扰占星；能引起潮汐、电磁紊乱
id: seq5_perfect
name: 星座换了位置
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    你抬头看了一眼天。
    **星座换了位置。**
    旁边那个人也抬头，看了很久，掏出星图对了三遍。
    「不对啊，」他说。你说：「可能今夜云厚。」
  group: 昨晚有个人在街上对着星图站了两个钟头。
daily_limit: 1

options:
  - key: '1'
    label: 抬手招点云，把天遮上
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      云过来了。他抬头再看，什么都没有了。
      **他站在街上很久才走** —— 第二天有人看见他把星图烧了。
  - key: '2'
    label: 告诉他实话
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说是你动的。他看了你一眼，笑了一声，说「你喝多了」。
      **他把星图收起来的时候手是抖的。**
  - key: '3'
    label: 自己也对着星图对一遍
    effects: [ { dig: 4 } ]
    text: |
      你对了三遍。
      **它们不是换了位置 —— 是换了顺序。** 而顺序这种东西，只有看过很多遍的人才会在意。
