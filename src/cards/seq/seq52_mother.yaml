# 原著依据：《诡秘之主》途径「母亲」序列 5「德鲁伊」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：能汲取泥土里的养分和空气，掌握诸多涉及大地的法术：地底潜行、沼泽、自然憎恶、橡树之子
id: seq52_mother
name: 地底潜行
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    后面的追得紧。
    你蹲下来，把手按在地上。
    **土松了。** 你下去了。
    再上来的时候，你在城外那片林子里。
  group: 有人追到一半不见了，地上只有一块松土。
daily_limit: 1

options:
  - key: '1'
    label: 在土里多待一会儿
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你在地里多待了一阵。
      上面有人踩过你的头顶 —— **你听见了他们的对话，一句不漏**。
  - key: '2'
    label: 顺着土脉往更远处走
    effects: [ { dig: 7, hp: 2, mad: 2 } ]
    text: |
      你顺着土一路走，走了很远。
      出来的时候 —— **你在另一座城的郊外**。你连方向都不确定。
  - key: '3'
    label: 抓一把土上来看看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你抓了一把土。土里有根须。
      **在这么深的地方有根须** —— 那是你今晚唯一想不通的事。
