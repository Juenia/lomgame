# 原著依据：《诡秘之主》途径「黑皇帝」序列 6「腐化男爵」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：扭曲：扭曲目标的语言、行动和意图；腐蚀：让周围十米内的人心灵变阴暗
id: seq6_lawyer
name: 他们打起来了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 6
  max_seq: 6
effects:
  - { cor: 2 }
  - { dig: 2 }
texts:
  priv: |
    你在那条街上站了一刻钟，跟谁都没说话。
    回去之后你听说，那两个从小一起长大的人打起来了。
    **为了一点谁也说不清的小事。**
    你把窗户关上，坐下喝茶。
  group: 那对老邻居忽然翻了脸，谁都不知道为什么。
daily_limit: 1

options:
  - key: '1'
    label: 关上窗户，坐下喝茶
    effects: [ { dig: 5 } ]
    text: |
      你把窗户关了，坐下喝茶。
      **茶是凉的** —— 而你一直喝到见底。
  - key: '2'
    label: 第二天去看看那两个人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你去了。一个在补墙，一个在拆墙。
      **而他们中间隔着一道新砌的矮墙** —— 砌得不直。
  - key: '3'
    label: 再在那条街上站一刻钟
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又站了一刻钟。这次是三个人的事。
      **第三天那条街上没有一个人打招呼** —— 连卖菜的都不喊了。
