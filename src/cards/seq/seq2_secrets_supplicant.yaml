# 原著依据：《诡秘之主》途径「倒吊人」序列 2「秽语长老」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：秽语：说自己时每个单词都在提升层次和力量；利用目标回答截取歧义制造言灵；直接诅咒带来堕落污秽
id: seq2_secrets_supplicant
name: 每个字都在抬你
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 2
  max_seq: 2
effects:
  - { cor: 4 }
  - { dig: 3 }
texts:
  priv: |
    你开始说话，说的是自己。
    「我是……我是……我是……」
    **每说一句，你就高一点。** 不是个子，是别的什么。
    对面那个人想开口，你问了他一句什么 —— 他答了。他答的那半句被你拿走用了。
  group: 那天在场的几个人后来都记不清自己说过什么。
daily_limit: 1

options:
  - key: '1'
    label: 接着说下去
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你接着说了五句。说到第五句的时候你没停住。
      **你把对面那个人剩下的半句也拿走了** —— 而他还张着嘴。
  - key: '2'
    label: 停下来，看看自己的手
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你停了。手比刚才长了一点。
      **指甲也长了** —— 而它们比昨天更黑。
  - key: '3'
    label: 问他刚才说了什么
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他想了很久，说记不清了。
      **而他一直在摸自己的喉咙** —— 像是在确认那半句还在不在。
