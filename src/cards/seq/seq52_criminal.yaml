# 原著依据：《诡秘之主》途径「深渊」序列 5「欲望使徒」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：精神冲击：燃烧头上两根弯曲的恶魔角，强行冲击敌人的精神；欲望化身：身体转化为情绪凝成的黑色液体
id: seq52_criminal
name: 燃起来的角
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:criminal'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 3 }
  - { hp: 2 }
texts:
  priv: |
    你头上那两根角烧起来了。
    **它们不是实体** —— 但对面那个人看见了，也感觉到了。
    他抱着头跪了下去。
    你把角收回去，蹲下来看了他一眼。
  group: 有人昨天在街上跪了很久，说头要裂了。
daily_limit: 1

options:
  - key: '1'
    label: 把角收回去
    effects: [ { dig: 5 } ]
    text: |
      你把角收了回去。街上的空气松了一下。
      **他还在跪着** —— 而你已经在十步之外了。
  - key: '2'
    label: 蹲下来看看他
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你蹲下来。他抱着头，一直在说对不起。
      **而你不知道他在跟谁道歉** —— 他也不知道。
  - key: '3'
    label: 让角再烧一会儿
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你没收。街上的人开始往这边看。
      **而他们看见的是你蹲着** —— 旁边的人跪着，头埋在手里。
