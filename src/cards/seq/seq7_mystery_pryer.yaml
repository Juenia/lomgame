# 原著依据：《诡秘之主》途径「隐者」序列 7「巫师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有借助头脑和知识解析、研究、学习乃至创建法术的能力
id: seq7_mystery_pryer
name: 自己推的公式
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    你在一张纸上推了半宿，推出来一个没见过的东西。
    念出来的时候你自己都不确定 —— 有点像咒文，也像一段算术。
    **灯亮了。**
    你没有用任何现成的咒语。你把纸折起来，塞进了书里。
  group: 有人屋里的灯自己亮了，而他不承认点过。
daily_limit: 1

options:
  - key: '1'
    label: 把纸折好，塞进书里
    effects: [ { dig: 4 } ]
    text: |
      你把它夹在第八十七页。
      **那一页本来什么都没有** —— 这样最好找，也最不容易被人翻到。
  - key: '2'
    label: 再推一遍，试试第二步
    effects: [ { dig: 7, mad: 3, cor: 2 } ]
    text: |
      你推了半宿，推到了第二步。
      念出来的时候 —— **屋里的影子全往同一个方向偏了**。窗外没有风。
  - key: '3'
    label: 把公式给别人看
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你给了一个信得过的人。他看了三遍，抬头问你：
      **「这是谁写的？」** —— 而你说不出。
