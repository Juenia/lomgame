# 原著依据：《诡秘之主》途径「红祭司」序列 8「挑衅者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：洞察能力质变，察觉到目标对哪些语言哪些行为更为敏感；主动使用挑衅可精准激怒
id: seq8_hunter
name: 只说了一句
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你在吧台边坐下，看了旁边那个人很久。
    你知道他老婆刚走，知道他昨天输了钱，知道他最恨别人提他父亲。
    **你只说了一句。**
    他动了手 —— 而你在等他动手。
  group: 酒吧里有人被打了一拳，而动手的是先被惹的那个。
daily_limit: 1

options:
  - key: '1'
    label: 等他出手，然后站起来
    effects: [ { dig: 6, hp: 2, cor: 2 } ]
    text: |
      他打了。你没有躲。
      **你站起来的时候他往后退了半步** —— 而他的手还举着。
  - key: '2'
    label: 把那一句再说一遍
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又说了。这次他哭了出来。
      **而拳头一直没再落下来** —— 他就那么站着哭。
  - key: '3'
    label: 换一句别的话说
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你换了一句。他愣住了。
      **因为他不知道你在说什么** —— 而那一句是随口说的。
