# 原著依据：《诡秘之主》途径「倒吊人」序列 8「倾听者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：倾听：能直接听到对应的隐秘存在的耳语；所有的倾听者都是疯子，很难存活超过五年
id: seq8_secrets_supplicant
name: 它一直在说
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 8
  max_seq: 8
effects:
  - { cor: 3 }
  - { mad: 3 }
texts:
  priv: |
    半夜你醒过来，因为有人在说话。
    它一直在说 —— 不是今晚开始的，是很久以前就在说，只是你现在才听得见。
    你捂住耳朵。**没有用，那不是从外面来的。**
    你坐了很久，直到天亮。天亮之后你照样出门，跟人打招呼，笑得跟平常一样。
  group: 那户人家每天都正常出门，但夜里总亮着灯。
daily_limit: 1

options:
  - key: '1'
    label: 坐起来，把它说完
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你坐着听。它说的是一个你没去过的地方。
      **而它说了三个钟头** —— 说到最后你记住了两个词。
  - key: '2'
    label: 试着出声压过它
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你开口说了别的事。它跟着你一起说。
      **而它说的和你说的不是一回事** —— 两句话叠在一起，你分不出哪句是自己的。
  - key: '3'
    label: 天亮之后照常出门
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你出门，跟人打招呼，笑得很正常。
      **没有人发现** —— 而它一直没停，只是白天小一点。
