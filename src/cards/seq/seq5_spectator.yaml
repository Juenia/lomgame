# 原著依据：《诡秘之主》途径「空想家」序列 5「梦境行者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：核心能力：通过对梦境的引导和操纵获取情报、影响敌人
id: seq5_spectator
name: 他在梦里答了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你在他的梦里问了一个问题。
    梦里是一间旧屋子，他坐在桌边，桌上摆着没吃完的饭。
    他抬头看了你一眼，**答了**。
    醒来之后你什么都记得，而他只会觉得昨晚梦见了什么。
  group: 有人一觉醒来，说昨晚梦见了一个从没见过的人。
daily_limit: 1

options:
  - key: '1'
    label: 再问一个问题
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又问了一个。这次他答得很慢。
      **而他的眼睛一直在看桌上的饭** —— 那碗饭一直没动过。
  - key: '2'
    label: 把他的答案记下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记下了。醒来之后你去核。
      **而他说的那件事确实发生过** —— 就在这条街上，三年前。
  - key: '3'
    label: 第二天白天去找他
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。他看见你的时候脸色变了一下。
      **然后说「我梦见过你」** —— 说完他自己愣住了。
