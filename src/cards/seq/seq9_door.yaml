# 原著依据：《诡秘之主》途径「门」序列 9「学徒」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：不管是墙壁，还是大门，都无法阻止他们通过，这就是开门
id: seq9_door
name: 锁还锁着
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
texts:
  priv: |
    你推了一下那扇门。
    它开了 —— 而锁还挂在上面，锁舌还是伸着的。
    你退出去，把门带上，又推了一次。还是开。
    你在门口站了一会儿，最后决定不进去。
  group: 那扇一直锁着的门，今天有人推开了。
daily_limit: 1

options:
  - key: '1'
    label: 决定不进去，走开
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走开了。走出去十几步你回头看了一眼。
      **门关着，而锁还挂着** —— 挂得好好的。
  - key: '2'
    label: 把锁摘下来看看
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你伸手去摘。锁是死的。
      **而门还在往里面开** —— 锁挂着，门开着，两件事同时成立。
  - key: '3'
    label: 从门缝往里看一眼
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你凑过去看。里面是白天。
      **而外面是半夜** —— 你退开的时候，门缝里的光是暖的。
