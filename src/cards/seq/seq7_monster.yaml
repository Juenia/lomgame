# 原著依据：《诡秘之主》途径「命运之轮」序列 7「幸运儿」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：在日常生活里经常遇上出门捡钱、投骰如同期望等事情，但无法控制、有高低起伏
id: seq7_monster
name: 第八次
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 1 }
  - { mad: 2 }
texts:
  priv: |
    你随手把硬币往桌上一抛。
    它立住了 —— 卡在桌板的一条缝里，不倒。
    **这是今天第八次了。**
    头几次你还笑，现在你在想：它什么时候会反过来。
  group: 有人在牌桌上抛硬币，硬币立着不倒。
daily_limit: 1

options:
  - key: '1'
    label: 把硬币收起来
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你把硬币收进口袋。它还是热的。
      **热得不正常** —— 而桌上那道缝不见了。
  - key: '2'
    label: 再来一次，看它会不会倒
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      又抛了一次。它又立住了 —— 第九次。
      **而这次它立在了缝的另一头** —— 那道缝你刚才明明没看见。
  - key: '3'
    label: 把硬币给别人抛
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你递给他。他抛了三次，三次都倒。
      **第三次之后他把硬币推回来了** —— 推得很远。
