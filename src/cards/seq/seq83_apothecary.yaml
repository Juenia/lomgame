# 原著依据：《诡秘之主》途径「月亮」序列 8「驯兽师」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：身体素质大幅度提升，能和很多野兽正面搏斗
id: seq83_apothecary
name: 正面搏斗
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
texts:
  priv: |
    那条野狗扑过来的时候你没有躲。
    你抬手架住，把它掀翻在地上。
    **它没有立刻起来** —— 它愣了一下。
    你也愣了一下。你以前不是这样的。
  group: 巷子里有条狗扑了人，狗输了。
daily_limit: 1

options:
  - key: '1'
    label: 低头看自己的手
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你摊开手。指节上连红都没有。
      **而刚才那一下撞得不轻** —— 你自己听得见响声。
  - key: '2'
    label: 追上去，把它处理掉
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你追上去了。它没有再扑你，只是躺在地上看你。
      **你最后没有动手** —— 而你到现在还在想为什么。
  - key: '3'
    label: 回去想这是从什么时候开始的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你想了很久。
      **大概是上个月你喝完那瓶东西之后** —— 那天之后你再没生过病。
