# 原著依据：《诡秘之主》途径「空想家」序列 9「观众」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：得到出众的精神和敏锐的观察力；能像旁观者一样审视世俗社会里的演员，从表情、举止、口癖窥见他人真实想法
id: seq9_spectator
name: 他在演什么
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你在酒馆角落坐了一晚上，没怎么说话。
    你看出了每个人在演什么：那个笑得最响的人在害怕，那个一直低头的人在算账。
    包括你自己 —— 你也在演一个「只是来喝酒的人」。
    **散场的时候你想：演得最好的是我。**
  group: 角落里那个人坐了一晚上，走的时候谁也没记住他长什么样。
daily_limit: 1

options:
  - key: '1'
    label: 再坐一会儿，看看别人
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又坐了一会儿。那个笑得最响的人先走了。
      **走的时候没有跟任何人打招呼** —— 而他刚才跟每个人都碰过杯。
  - key: '2'
    label: 走过去跟那个低头的人搭话
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你过去了。他一直在算账。
      **而账本上写的全是别人的名字** —— 一个他自己的都没有。
  - key: '3'
    label: 把自己那一层也看清楚
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你看自己。你演的那个「只是来喝酒的人」。
      **而你已经演了很多年** —— 久到你自己都以为那是真的。
