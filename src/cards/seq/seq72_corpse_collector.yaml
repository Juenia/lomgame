# 原著依据：《诡秘之主》途径「死神」序列 7「通灵者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：对亡魂与自然灵而言通灵者像同类，危险性很低，足够友善时它们甚至会主动传递信息
id: seq72_corpse_collector
name: 它们主动说
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:corpse_collector'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 4 }
  - { cor: 1 }
texts:
  priv: |
    你什么都没做，就在那条巷子里站着。
    **有东西自己过来了。** 很轻，靠在你旁边。
    它说了一件很久以前的事 —— 说得很慢，怕你听不懂。
    你说了一声谢谢。它走了。
  group: 那条巷子以前出过事，最近有人在查。
daily_limit: 1

options:
  - key: '1'
    label: 站着听完
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你听完了。它说的事是三十年前的。
      **而它说得很细** —— 细到连当时下雨、谁站在哪一边都说得出来。
  - key: '2'
    label: 问它那件事是谁做的
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      它说了一个名字。
      **而你认得那个名字** —— 那个人的孙子现在还住在这条巷子里。
  - key: '3'
    label: 让它多留一会儿
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你没让它走。它留了下来。
      **一直在你旁边，不出声** —— 但你知道它在，像知道自己的心跳。
