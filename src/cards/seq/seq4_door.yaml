# 原著依据：《诡秘之主》途径「门」序列 4「秘法师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：空间隐藏：可将一个空间区域扭曲，割成两部分并隐藏其中一部分
id: seq4_door
name: 被割走的一角
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    你走进那间屋子，觉得不对。
    屋子是四方的，但走起来比看起来大。
    **有一角被割走了** —— 你摸得到边界，那里什么都没有，连空气都不流动。
    你退出来，把门关上了。
  group: 那间空屋比外面看着大，量过之后又不大。
daily_limit: 1

options:
  - key: '1'
    label: 退出来，把门关上
    effects: [ { dig: 5 } ]
    text: |
      你退出来，把门关上。
      **站在门外看** —— 那间屋子的轮廓是规规矩矩的四方形。
  - key: '2'
    label: 伸手摸摸那道边界
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你伸手。手指碰到的不是墙。
      **那里什么都没有** —— 而你的手停住了，推不过去。
  - key: '3'
    label: 把整间屋子量一遍
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你量了一遍。量出来的数比看起来小。
      **而那一角不在任何一张图纸上** —— 你画了三遍，第三遍的时候笔自己抖了。
