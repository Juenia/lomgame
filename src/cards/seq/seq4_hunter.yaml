# 原著依据：《诡秘之主》途径「红祭司」序列 4「铁血骑士」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有堪比钢铁的勇气，不再被恐惧击倒；依旧会恐惧，只是会被勇气战胜；能操纵多种火焰
id: seq4_hunter
name: 还是会怕
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    你进去之前手是抖的 —— 你摸得到那个抖。
    门推开，里面有东西。
    **你进去了。** 抖还是抖，但脚往前走了。
    出来的时候手还在抖。你把它插进口袋。
  group: 那天晚上有人推开了一扇别人不敢推的门。
daily_limit: 1

options:
  - key: '1'
    label: 把手插进口袋，走开
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把手插进口袋走了。手还在抖。
      **而没人看得出来** —— 你走路的样子很稳。
  - key: '2'
    label: 再推一次那扇门
    effects: [ { dig: 7, hp: 2, cor: 3, mad: 3 } ]
    text: |
      你又推了一次。这次手也抖。
      **而你走进去得更深** —— 深到你看清了那个东西的轮廓。
  - key: '3'
    label: 在台阶上坐下，等手不抖
    effects: [ { dig: 6, mad: -1 } ]
    text: |
      你坐下。抖了一刻钟才停。
      **而你一直在想门里那个东西长什么样** —— 想不起来，只记得它没动。
