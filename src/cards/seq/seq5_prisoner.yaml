# 原著依据：《诡秘之主》途径「被缚者」序列 5「怨魂」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可将自身状态转化为幽影，穿过障碍物、藏身镜子、直接攻击灵魂；不到高序列无法用灵视发现
id: seq5_prisoner
name: 穿墙
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 2 }
  - { hp: 2 }
texts:
  priv: |
    追你的人在门口堵住了。
    你没停 —— **你从墙里过去了。**
    墙很冷，像水，但比水稠。
    你出来的时候回头看了一眼：他们还在那扇门口站着，等着。
  group: 那栋楼里追人追丢了，说人凭空不见了。
daily_limit: 1

options:
  - key: '1'
    label: 出去，不等他们
    effects: [ { dig: 5 } ]
    text: |
      你出了墙，没有停。
      **走到街口你才听见** —— 那扇门后面有人在喊「人呢」。
  - key: '2'
    label: 回头看看那堵墙
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。墙是完整的。
      **而你的肩膀上还挂着灰** —— 灰是干的，一抖就掉。
  - key: '3'
    label: 再穿一次，这次慢一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又穿了一次，走得很慢。墙里不是空的。
      **有东西贴着你过去了** —— 你没有看清是什么，也不想再看。
