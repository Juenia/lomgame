# 原著依据：《诡秘之主》途径「黄昏巨人」序列 9「战士」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：各种武器防具精通，不存在无法使用的武器，各种格斗术掌握
id: seq92_warrior
name: 没见过的兵器
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:warrior'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    架子上那件兵器你从没见过。形状古怪，重心也不对。
    你只看了两眼，就伸手把它**倒过来拿**了。
    旁边的人愣了一下 —— 他们说这东西一直是正着放的。
    「反着才是它的用法，」你说，「你们这十几年都拿反了。」
  group: 有人在架子上把一件老兵器倒过来拿，说以前都拿反了。
daily_limit: 1

options:
  - key: '1'
    label: 把它放回架子上
    effects: [ { dig: 3 } ]
    text: |
      你把它正过来搁回去，什么也没说。
      走出门的时候你回头看了一眼 —— **它还躺在那里，反着才是对的**。
  - key: '2'
    label: 再翻几件，看是不是也拿反了
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      架子上十七件，你找出四件反的。
      主人在旁边看着，脸一点点白 —— **这屋子里的东西他用了半辈子**。
  - key: '3'
    label: 教他们改过来
    effects: [ { dig: 6, hp: 1 } ]
    text: |
      你一件件翻正，示范了两遍。有人学，有人不信。
      那个不信的当晚试了一次 —— **第二天他来问你还有没有别的**。
  - key: '4'
    label: 问一句：这些东西从哪弄来的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他含糊过去了，只说是收来的。
      但你看了一眼墙角 —— **那儿还有一堆没上架的，全是反的**。
