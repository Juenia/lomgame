# 原著依据：《诡秘之主》途径「黑暗」序列 9「不眠者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：每天只需三到四个小时的休息就足够
id: seq92_sleepless
name: 三四小时
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sleepless'
  min_seq: 9
  max_seq: 9
effects:
  - { mp: 3 }
  - { hp: 2 }
texts:
  priv: |
    你躺下的时候天刚亮，起来的时候天还亮着。
    **睡了三个半钟头。** 不困。
    你出门的时候邻居正在吃早饭。
    他问你这么早干嘛去。你说没事，走走。
  group: 那个人每天天不亮就出门，晚上很晚才回。
daily_limit: 1

options:
  - key: '1'
    label: 出门走走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你出了门。街上只有卖早点的摊子刚支起来。
      **你买了两个** —— 而摊主说他还没开张。
  - key: '2'
    label: 回去再躺一会儿
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你躺回去了。躺了两个钟头，一点困意都没有。
      **而天已经大亮** —— 你听见外面的人在陆续出门。
  - key: '3'
    label: 算算自己最近睡了多久
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你算了。三个半钟头。前天三个，大前天两个半。
      **越来越短** —— 而你没有觉得累。
