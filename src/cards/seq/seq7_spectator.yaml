# 原著依据：《诡秘之主》途径「空想家」序列 7「心理医生」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：震慑/龙威：让目标或群体瞬间惊慌混乱；狂乱：引爆目标的情绪
id: seq7_spectator
name: 只是问了个普通问题
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你在诊室里坐着，问了一个很普通的问题。
    对面那个人张了张嘴，**没有出声**。
    他的手指扣在椅子扶手上，指节发白。
    你等了十几秒，把那句话又问了一遍 —— 这次声音放轻了。
  group: 那间诊室的门关了很久，出来的人脸色不好。
daily_limit: 1

options:
  - key: '1'
    label: 把问题再问第三遍
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你又问了一遍。这次他答了。
      **答完之后他自己都不记得说过** —— 他一直在看自己的手。
  - key: '2'
    label: 换一个问题问
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你换了一个。这次他答得很快。
      **而答的是他本来不该知道的事** —— 那是别人告诉他的，而那个人已经死了。
  - key: '3'
    label: 不再问了，站起来走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你站起来走了。他一直没有动。
      **直到门关上** —— 你听见里面椅子响了一声。
