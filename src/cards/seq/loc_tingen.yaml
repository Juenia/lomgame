# 地点专属（M2.87）。地点：「廷根市」（tingen，危险度 1）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_tingen
name: 这座城的第一件怪事
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:廷根市'
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你在这座城里住了很久，早就习惯了。
    今天路过那家旧书店，你忽然停了一下。
    **橱窗里的书换了位置** —— 而老板上个月就死了。
    你在门口站了一会儿。街上的人照常走过。
  group: 廷根那家关了门的旧书店，橱窗里的书换了位置。
daily_limit: 1

options:
  - key: '1'
    label: 推门进去看看
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你推了门。门是开着的。
      **里面很干净** —— 而书架上的灰是新的。
  - key: '2'
    label: 隔一天再来看看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你第二天又路过。书又换回了原来的位置。
      **而橱窗玻璃上有两个手印** —— 从里面按的。
  - key: '3'
    label: 去问隔壁铺子的人
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你问了。他说这店一直有人打理。
      **而他说不出是谁** —— 他只说每个月都有人来交租。
