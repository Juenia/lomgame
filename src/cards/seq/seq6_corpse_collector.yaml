# 原著依据：《诡秘之主》途径「死神」序列 6「死灵导师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可提前控制并驱使亡者和自然灵为自己战斗
id: seq6_corpse_collector
name: 他已经站在我这边
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    他倒下去的时候你并不意外 —— 你早就准备好了。
    尸体动了动，然后站了起来，站到了你这一边。
    剩下那两个人往后退。
    **你什么也没说。你只是往前走了一步。**
  group: 那条街上倒了一个人，然后又站起来一个。
daily_limit: 1

options:
  - key: '1'
    label: 往前再走一步
    effects: [ { dig: 5 } ]
    text: |
      你往前走了一步。那两个人又退了一步。
      **而你身后那个站着的，也跟着迈了一步** —— 步子和你一样。
  - key: '2'
    label: 让他动手
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      他动了。那两个人跑得很快。
      **而他追出去的时候是踮着脚的** —— 脚后跟一直没有落地。
  - key: '3'
    label: 问他还记不记得自己是谁
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你问了他一句。他停下来，转过头看你。
      **那是他今天第一次看人** —— 而他看的是你的手。
