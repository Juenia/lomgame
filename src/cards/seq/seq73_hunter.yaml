# 原著依据：《诡秘之主》途径「红祭司」序列 7「纵火家」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：有了对火焰的操控能力：凝聚压缩，以火球的形式轰炸目标，压缩越久威力越大
id: seq73_hunter
name: 火球
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你把那团火捧在手里，没有扔。
    **你等了十几秒。** 它在手心里越来越小，越来越沉。
    然后你扔了。
    那面墙没了。你站在原地，手心是凉的。
  group: 那面墙昨天塌了，塌得很干净。
daily_limit: 1

options:
  - key: '1'
    label: 摊开手看看掌心
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你摊开手。掌心没有伤。
      **而它是凉的** —— 凉了整整一夜。
  - key: '2'
    label: 再捧一个，这次不扔
    effects: [ { dig: 7, hp: 3, cor: 3, mad: 3 } ]
    text: |
      你又捧了一个。它在你手心里烧了整整一分钟。
      **而你没有扔** —— 一分钟之后它自己灭了。
  - key: '3'
    label: 走过去看那面墙
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走过去看。砖是化过又凝上的。
      **断面很圆** —— 圆得像被什么东西含过。
