# 原著依据：《诡秘之主》途径「暴君」序列 8「暴怒之民」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：愤怒的时候能爆发超越正常许多的攻击，无论力量还是速度都会获得极大提升
id: seq8_sailor
name: 桌子散了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
  - { mad: 1 }
texts:
  priv: |
    那人骂了你一句，很难听。
    你听见自己心里响了一声 —— 像有什么被点着了。
    你抬手，砸在桌上。
    **桌子散了。** 屋里所有人都停了。你慢慢把手收回来，发现自己在发抖。
  group: 酒馆里有张桌子散了，而那人只砸了一下。
daily_limit: 1

options:
  - key: '1'
    label: 慢慢把手收回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把手收回来。它一直在抖。
      **抖了一刻钟才停** —— 而你一直在看它。
  - key: '2'
    label: 低头看看那张桌子
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你低头看。桌子是从中间裂开的。
      **而你的手落在边上** —— 边上一点事都没有。
  - key: '3'
    label: 追出去找那个人
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你追出去了。他跑得很快。
      **而你在两条街外追上了他** —— 他回头看见你的时候，没有再跑。
