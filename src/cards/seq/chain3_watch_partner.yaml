# 本卡**不再设新 flag** —— 链到此为止。
id: chain3_watch_partner
name: 第四个是谁
trigger:
  type: daily
  weight: 10
  cond:
    - 'flag:watch_partner'
effects:
  - { dig: 3 }
  - { mp: 2 }
texts:
  priv: |
    三个人值夜，四个脚步声 —— 这个你们已经认了。
    **今天多到五个了。**
    你们三个站在一起，谁都没有回头看。
    走完最后一圈的时候，脚步声只剩三个。
  group: 值夜的人这两天都是三个一起走。
daily_limit: 1
