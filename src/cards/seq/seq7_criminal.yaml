# 原著依据：《诡秘之主》途径「深渊」序列 7「连环杀手」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握涉及恶魔的诸多知识和仪式；能从深渊召唤恶魔的投影
id: seq7_criminal
name: 它在看
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 7
  max_seq: 7
effects:
  - { cor: 3 }
  - { mad: 2 }
texts:
  priv: |
    你按书上写的做完了最后一个步骤。
    有东西来了 —— 但它没有现身。
    你只是**知道它在看**。屋子里的温度没变，蜡烛没晃，什么都没有。
    你在原地站了很久，直到那种感觉自己退走。
  group: 那间地下室亮了一夜的灯，第二天早上门是从里面锁着的。
daily_limit: 1

options:
  - key: '1'
    label: 站着不动，等它走
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你站了很久。那种感觉慢慢退走了。
      **而退到门口的时候停了一下** —— 停了两秒才真的走。
  - key: '2'
    label: 开口问它一句
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你开口了。屋里什么都没有变。
      **但你确定它听懂了** —— 因为你再问的时候，它没有回应。
  - key: '3'
    label: 把灯吹灭
    effects: [ { dig: 5, hp: 2, cor: 3 } ]
    text: |
      你把灯吹了。黑暗里那种感觉一下子近了。
      **近到你能感觉出它在哪个方向** —— 就在你左手边三步。
