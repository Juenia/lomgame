# 原著依据：《诡秘之主》途径「深渊」序列 9「罪犯」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：有着强壮的身体，敏锐的知觉和各种犯罪能力，不管骑士剑还是别的
id: seq93_criminal
name: 骑士剑也会用
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:criminal'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    墙上挂着那把骑士剑，是这家主人的。
    你从来没学过这个。
    你把它摘下来，掂了掂。
    **顺手。** 你挥了两下，收起来走了。
  group: 那家墙上挂的剑昨天被人动过，摆得跟原来一样。
daily_limit: 1

options:
  - key: '1'
    label: 把剑挂回去，摆成原来的样子
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你挂回去了，摆得和原来一模一样。
      **连剑穗的方向都对** —— 而这一手你也没学过。
  - key: '2'
    label: 再看看墙上别的兵器
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把墙上那几件都看了一遍。
      **每一件你都知道该怎么用** —— 而你从没学过，也不打算学。
  - key: '3'
    label: 把它带走
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把它带走了。出了门你才想起 ——
      **你根本没想过要拿它** —— 你的手先动了。
