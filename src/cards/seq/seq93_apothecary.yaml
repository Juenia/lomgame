# 原著依据：《诡秘之主》途径「月亮」序列 9「药师」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：对于已经发展到终末期的绝症只能缓解症状，无法真正治疗
id: seq93_apothecary
name: 只能缓解
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { mad: 2 }
texts:
  priv: |
    那家人的老母亲躺在床上，已经是最后那几天了。
    你给她调了东西，喂下去。
    **她醒过来了，还吃了半碗粥。**
    她儿子握着你的手一直道谢。你知道这只管三天。
  group: 那家躺了很久的老人昨天坐起来了。
daily_limit: 1

options:
  - key: '1'
    label: 把「只管三天」告诉她儿子
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说了。他握着你的手没有松。
      **但他的力道变了** —— 那一下比刚才重得多。
  - key: '2'
    label: 改方子，试着真的能治
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你改了两味，又试了一次。她这次能下床走两步。
      **而她走的时候在找一个人** —— 那个人已经死了八年。
  - key: '3'
    label: 留下来陪三天
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你留下来了。第三天下午她睡着的时候，
      **你在旁边数着她的呼吸** —— 数到第七十下的时候停了。
