# 原著依据：《诡秘之主》途径「白塔」序列 2「智天使」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：一定的智慧权柄：总能提前看清局势变化，做出最正确最及时的选择；模仿能力达原版 90%
id: seq2_reader
name: 最正确的那个
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 5 }
  - { mad: 1 }
texts:
  priv: |
    你站在门口，把接下来要发生的事过了一遍。
    **三条路，两条会死人。**
    你选了第三条，走得很快，没有回头。
    身后那两条路上的人都活了下来 —— 因为他们没跟上来。
  group: 那天从那栋楼里出来的人，走的是同一条路。
daily_limit: 1

options:
  - key: '1'
    label: 走第三条，不回头
    effects: [ { dig: 5 } ]
    text: |
      你走得很快。身后那两条路上一个人都没有。
      **因为他们没跟上来** —— 而他们也不知道为什么不跟。
  - key: '2'
    label: 回头看看那两条路
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你回头。他们站在原地没动。
      **一直站着** —— 直到你走出他们的视线。
  - key: '3'
    label: 再推一遍接下来要发生的事
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又过了一遍。这次有第四条路。
      **而它昨天还没有** —— 你看了一眼它的尽头，然后把视线移开了。
