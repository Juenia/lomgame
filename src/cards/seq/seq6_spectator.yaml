# 原著依据：《诡秘之主》途径「空想家」序列 6「催眠师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：战斗催眠：能强行催眠敌人做出反常举动，只能维持很短时间
id: seq6_spectator
name: 他打了他的同伴
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 2 }
  - { cor: 2 }
texts:
  priv: |
    两个人围着你，一个拿刀，一个拿棍。
    你看了拿刀的那个一眼。
    **他转身打了他的同伴。**
    等他们回过神来，你已经走出那条巷子了。
  group: 那两个人打起来了，而旁边没有别人。
daily_limit: 1

options:
  - key: '1'
    label: 走出去，不回头
    effects: [ { dig: 5 } ]
    text: |
      你走出巷子，拐了弯。
      **身后的动静一直没停** —— 走了很远还听得见。
  - key: '2'
    label: 回头看他们打到什么时候
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你回头看。他们还在打。
      **而拿棍那个已经倒了** —— 拿刀那个还在打。
  - key: '3'
    label: 在心里再对他们说一句
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又说了一句。这次两个人都停了。
      **停下来之后他们互相看着** —— 谁都没说话，谁都没跑。
