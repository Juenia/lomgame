# 原著依据：《诡秘之主》途径「被缚者」序列 5「怨魂」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：纯物理没有附带特殊力量的武器或枪械无法对怨魂造成伤害，连脑袋都不是要害
id: seq52_prisoner
name: 枪打不动
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:prisoner'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 4 }
  - { cor: 2 }
texts:
  priv: |
    他开了三枪。
    **子弹从你身上穿过去了。** 你感觉到的是风。
    他还在扣扳机，弹夹已经空了。
    你往前走了一步。他把枪扔了。
  group: 那条巷子里响了三枪，第二天没有人出事。
daily_limit: 1

options:
  - key: '1'
    label: 让他走
    effects: [ { dig: 5 } ]
    text: |
      你侧身让开了路。他扶着墙走的。
      **走出去几步他回头看了一眼** —— 看的是你的胸口。
  - key: '2'
    label: 低头看自己身上有没有伤
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你低头看。衣服上有三个洞。
      **而洞边是热的** —— 像是刚从炉子里拿出来。
  - key: '3'
    label: 把那把枪捡起来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把枪捡起来。枪管是烫的。
      **而你握着它的时候** —— 手一点都不抖。
