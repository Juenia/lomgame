# 原著依据：《诡秘之主》途径「太阳」序列 0「太阳」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：神圣：让一切不谐皆受净化、皆被驱散；光：光在，我在，照亮一切，摧毁一切，是能量的本质
id: seq0_sun
name: 光在我在
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:sun'
  min_seq: 0
  max_seq: 0
effects:
  - { hp: 6 }
  - { mp: 5 }
texts:
  priv: |
    那天中午，**太阳亮了一下。**
    不是变热，是变亮 —— 影子全没了，连墙角的都没有。
    只持续了几息。
    而那几息里，所有不干净的东西都散了。
  group: 那天中午的影子都不见了，只持续了几息。
daily_limit: 1

options:
  - key: '1'
    label: 站在原地，受完那几息
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你站着。那几息里你什么都看不见。
      **包括你自己的手** —— 你把它举到眼前，什么都没有。
  - key: '2'
    label: 记住影子是怎么没的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记下了。影子不是淡了。
      **是它们被推到了别的地方** —— 推到你能感觉到，但看不见的地方。
  - key: '3'
    label: 试着让光再来一次
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你试了一次。没有亮。
      **而你脚下的影子深了很多** —— 深得像一个洞。
