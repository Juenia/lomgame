# 原著依据：《诡秘之主》途径「黑暗」序列 3「恐惧主教」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：黑暗之剑：从黑暗深处抽出布满奇异花纹的骨制长剑，结合安眠与恐惧的力量；被黑暗淹没的目标受重创
id: seq3_sleepless
name: 从黑暗里抽出来的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 4 }
  - { cor: 2 }
texts:
  priv: |
    你把手伸进那片黑里。
    **拔出来一把剑** —— 骨头的，上面全是花纹，看不清刻的是什么。
    剑一挥，黑暗就往一个方向涌了过去。
    那边的东西被淹没的时候没有叫。黑暗本来就是安静的。
  group: 那条巷子昨晚黑得很不自然。
daily_limit: 1

options:
  - key: '1'
    label: 把剑举起来看花纹
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你举起来看。花纹是活的。
      **它们在你手里慢慢换位置** —— 换到最后你认出了一个形状。
  - key: '2'
    label: 再伸进去摸一样东西
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又伸手。这次摸到的是一只手。
      **而它握住了你** —— 你挣脱的时候袖子被扯掉了一截。
  - key: '3'
    label: 把剑插回那片黑里
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把它插回去。黑合上了。
      **而剑柄上留了一小块白** —— 白得像骨头。
