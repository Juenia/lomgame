# 原著依据：《诡秘之主》途径「门」序列 2「旅法师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：自我符号：可让自己转化为象征符号；维度之视：可玩具化、缩小化目标物体和场景并收纳
id: seq2_door
name: 符号
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:door'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 4 }
  - { mp: 3 }
texts:
  priv: |
    你把那座房子**收了起来**。
    它变小了，小到一个巴掌，静静躺在你手心里 —— 连屋顶的烟囱都在。
    你把门打开，里面还是原来的样子，人还在里面走动。
    你把它放进箱子，扣上锁。
  group: 那栋房子昨天还在，今天只剩地基。
daily_limit: 1

options:
  - key: '1'
    label: 把箱子收好
    effects: [ { dig: 5 } ]
    text: |
      你把箱子放进柜子，扣上外锁。
      **柜子里安静下来** —— 而你能感觉到它在里面动了一下。
  - key: '2'
    label: 再打开门看一眼
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你打开门。里面的人还在走动。
      **而他们走的是四十年前的那条路线** —— 你认得其中一个人。
  - key: '3'
    label: 把箱子的锁打开
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把锁打开了。它在手心里动了一下。
      **像是想伸展开** —— 你赶紧又扣上了。
