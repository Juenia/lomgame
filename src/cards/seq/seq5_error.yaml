# 原著依据：《诡秘之主》途径「错误」序列 5「窃梦者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可拿走别人的理想和梦境、偷走记忆；窃取范围提升至八十米
id: seq5_error
name: 他不记得了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    他醒来的时候天还没亮透。
    他坐起来，愣了一会儿 —— **不记得昨天做过什么。**
    而你记得。**每一句都记得，连他当时的表情都在。**
    你把手插进口袋，从他家门口走过去了。
  group: 有人昨天做过一件事，今天完全不记得了。
daily_limit: 1

options:
  - key: '1'
    label: 走过去，什么都不说
    effects: [ { dig: 5 } ]
    text: |
      你从他家门口走过去。他坐在床边，看着窗外。
      **而你知道他昨天做过什么** —— 每一句都记得。
  - key: '2'
    label: 回头看他有没有发现
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。他一直在看自己的手。
      **像是那手不是他的** —— 他翻来覆去看了很久。
  - key: '3'
    label: 告诉他昨天做了什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。他听完脸色变了。
      **而他一直在摇头** —— 说不可能，说他昨天在家。
