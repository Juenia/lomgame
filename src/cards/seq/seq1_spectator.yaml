# 原著依据：《诡秘之主》途径「空想家」序列 1「作家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分空想权柄（幻想成真）：所想象的物品必将具现，所幻想的国度必将降临，所宣称的未来必将上演
id: seq1_spectator
name: 幻想成真
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 6 }
  - { cor: 3 }
texts:
  priv: |
    你在纸上写了一句：**「他会来。」**
    写完之后你把纸烧了。
    第二天那个人真的来了 —— 从很远的地方，走了三天。
    他自己也说不清为什么要来。
  group: 那个人走了三天的路，只为了来一个他从没去过的地方。
daily_limit: 1

options:
  - key: '1'
    label: 再写一句
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又写了。这次写的是「他不会走」。
      **而他第二天就走了** —— 走之前还来跟你打了个招呼。
  - key: '2'
    label: 去见他一面
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你去了。他看见你的时候愣了一下。
      **说他好像在哪见过你** —— 而你们从来没见过。
  - key: '3'
    label: 把那点灰收起来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把灰收起来了。灰是暖的。
      **而纸已经烧了一夜** —— 早上你才想起来去看。
