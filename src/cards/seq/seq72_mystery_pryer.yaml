# 原著依据：《诡秘之主》途径「隐者」序列 7「巫师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：巫师施法最简单也要三个动作：集中灵性、勾勒象征符号（或诵念咒文）、借材料施展
id: seq72_mystery_pryer
name: 三个动作
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 7
  max_seq: 7
effects:
  - { mp: 2 }
  - { dig: 3 }
texts:
  priv: |
    你把材料在桌上摆好，一共三样。
    闭眼，在脑子里勾那个符号 —— 勾了三遍才对。
    **念出最后那个词的时候，桌上的蜡烛自己亮了。**
    你把材料收起来。剩下的还能用两次。
  group: 有人屋里昨晚亮过一下，很短暂。
daily_limit: 1

options:
  - key: '1'
    label: 把剩下的材料收好
    effects: [ { dig: 4 } ]
    text: |
      你把它一样样收进袋子，系紧。
      **还能用两次** —— 你现在数得比谁都清楚。
  - key: '2'
    label: 再演一次，这次不看纸
    effects: [ { dig: 6, mad: 2 } ]
    text: |
      你闭着眼。勾到第二遍的时候，桌上的东西自己动了。
      **你没有念最后那个词** —— 而蜡烛亮了。
  - key: '3'
    label: 把那个符号画下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你照着记忆画了一遍，对着看了很久。
      **它不是符号** —— 那是一个字的写法，只是你还不认识那个字。
