# 地点专属（M2.87）。地点：「太阳神殿」（sun_temple，危险度 3）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_sun_temple
name: 影子不对
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:太阳神殿'
effects:
  - { dig: 2 }
  - { mad: 2 }
texts:
  priv: |
    神殿里光线很足，四处都能照到。
    你跪下来的时候看见了自己的影子。
    **它偏了** —— 偏的方向和光来的方向对不上。
    你没有动。过了一会儿，它自己正回来了。
  group: 太阳神殿里有人跪了很久，起来的时候脸是白的。
daily_limit: 1

options:
  - key: '1'
    label: 低头盯着自己的影子
    effects: [ { dig: 6, cor: 3, mad: 4 } ]
    text: |
      你一直盯着。它慢慢正回来了。
      **而正回来之后** —— 它比正常的短一截。
  - key: '2'
    label: 换个位置跪下
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你换了个位置。影子是正的。
      **而你原来跪的那个地方** —— 地砖上有一小块是暗的。
  - key: '3'
    label: 问神殿里的人刚才有没有看见
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      他们都说没看。
      **而其中一个人问你脸色为什么这么白** —— 他说你刚进来的时候不是这个颜色。
