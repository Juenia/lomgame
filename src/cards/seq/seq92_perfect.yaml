# 原著依据：《诡秘之主》途径「完美者」序列 9「通识者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：核心能力是唤醒记忆，能记起自己看过的所有知识
id: seq92_perfect
name: 十年前那一页
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:perfect'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 4 }
texts:
  priv: |
    你顺着那个问题往下说，说了三句。
    第四句的时候你停了 —— **因为你想起了那一页的页脚有一行小字**，
    而你不知道自己为什么会记得页脚。桌上的人还在等你。
    「剩下的我记不清了。」—— 其实你记得，**你只是不想让人知道你连页脚都记得**。
  group: 有人背出一段十年前的书，背到一半自己停住了。
daily_limit: 1

options:
  - key: '1'
    label: 把剩下的也说出来
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你说了。连页脚那一行也说了。
      **说完之后桌上没有人再问问题** —— 他们开始聊别的，聊得很热闹。
  - key: '2'
    label: 就此打住，说记不清了
    effects: [ { dig: 4 } ]
    text: |
      「剩下的我记不清了。」
      他们信了 —— **因为他们自己连那一页都没有印象**。
  - key: '3'
    label: 回去查那本书还在不在
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了图书馆，第三排那本书还在。
      你翻到那一页 —— **页脚是空的**。
  - key: '4'
    label: 问提问的人从哪听来的
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      他愣了一下，说记不清了。
      **一个能问出这种问题的人，不该记不清。** 你把这句话记下了。
