# 原著依据：《诡秘之主》途径「倒吊人」序列 5「牧羊人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：放牧：能将别人的灵魂吞噬到体内并驱使，可有挑选地取用被驱使灵魂的三种能力，最高放牧七个
id: seq5_secrets_supplicant
name: 体内有七个
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 3 }
  - { dig: 2 }
texts:
  priv: |
    **七个。**
    你现在能感觉到他们 —— 有的安静，有的不安分，有一个总在最里面动。
    你挑了其中一个的能力用了一下。
    用完之后那个安静了一会儿。**像在等你再叫它。**
  group: 那个人这两天一直在自言自语，偶尔用别人的语气说话。
daily_limit: 1

options:
  - key: '1'
    label: 再叫一个出来用
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又叫了一个。这次它做得更顺。
      **而用完之后你没有立刻收回去** —— 它在外面多待了一会儿。
  - key: '2'
    label: 静下来数一数他们都在哪
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你静下来数。七个 —— 有一个在最里面，一直在动。
      **而你叫不动它** —— 你试了三次。
  - key: '3'
    label: 问他们是谁
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你问了。有一个答了。
      **而你从来没听过那个名字** —— 它听起来不像任何地方的姓。
