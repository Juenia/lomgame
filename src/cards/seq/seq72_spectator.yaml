# 原著依据：《诡秘之主》途径「空想家」序列 7「心理医生」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：心理暗示：通过动作、语言、媒介暗示目标，让对方不知不觉遵循安排
id: seq72_spectator
name: 暗示
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:spectator'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    你跟他说话的时候，把那支笔转了半圈。
    **他没有注意到。** 但他的手也跟着转了半圈。
    「明天别去码头，」你说。他点头。
    第二天他确实没去。他自己也说不清为什么。
  group: 那个人昨天没去码头，说是心里不舒服。
daily_limit: 1

options:
  - key: '1'
    label: 把笔转回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把笔转了回来。他的手也跟着转回来了。
      **而他自己没发觉** —— 他还在等你把话说完。
  - key: '2'
    label: 再暗示一句别的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又暗示了一句。这次他做了另一件事。
      **而他在做的时候愣了一下** —— 像是忽然想不起为什么。
  - key: '3'
    label: 第二天去码头看看
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你去了码头。那里出事了。
      **而你说不清自己是去看什么** —— 你只是去了。
