# 原著依据：《诡秘之主》途径「完美者」序列 8「考古学家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有足够的历史知识、野外生存知识以及遗迹相关的禁忌知识
id: seq82_perfect
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq8_perfect 撞了同一个名字，从本卡正文里另取一个短语。
name: 左边第三块
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:perfect'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
texts:
  priv: |
    你不只是叫住了他。
    你蹲下来，把那块砖**抠了出来** —— 底下是空的，空的下面还是空的。
    你顺着空洞往里看，看见了下面那一层。
    **「这一片都得塌，」** 你说。同行的人往后退了三步。
  group: 有人在废墟里抠出一块砖，然后让所有人退到了街对面。
daily_limit: 1

options:
  - key: '1'
    label: 把砖放回去，装作什么都没看见
    effects: [ { dig: 4 } ]
    text: |
      你把砖按回去，拍了拍手上的土。
      **同行的人没有再往里走** —— 他们看你的眼神已经不一样了。
  - key: '2'
    label: 让所有人撤到街对面
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他们退到街对面。你数了十分钟。
      **那一段自己塌了** —— 没有响，就是慢慢低下去，像被踩了一脚。
  - key: '3'
    label: 自己下去看看那一层
    effects: [ { dig: 7, hp: 3, cor: 2, mad: 2 } ]
    text: |
      你下去了。下面那一层是**另一条街** —— 只是比上面这条旧很多。
      你在那条街上站了一会儿，抬头能看见自己刚才站的那个洞。
