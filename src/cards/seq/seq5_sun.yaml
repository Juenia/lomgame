# 原著依据：《诡秘之主》途径「太阳」序列 5「光之祭司」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：神圣之光：净化死灵与污秽；掌握各种太阳领域神术
id: seq5_sun
name: 墓地的雾散了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { dig: 1 }
texts:
  priv: |
    那片墓地入夜就起雾，附近的人绕了两年路。
    你走进去，张开双臂。
    **雾散了。** 散得很干净，连草叶都干了。
    你在里面站了一刻钟。出来的时候，鞋上什么也没沾。
  group: 那片墓地昨晚没有起雾，附近的人都在说。
daily_limit: 1

options:
  - key: '1'
    label: 在墓地里站满一刻钟
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着。雾一点都没回来。
      **而草叶上连露水都没有** —— 你摸了一把，是干的。
  - key: '2'
    label: 看一圈那些墓碑
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你看了一圈。每一块的朝向都对着同一个方向。
      **那个方向是你刚才站的地方** —— 一步不差。
  - key: '3'
    label: 再张一次，这次对着旁边的林子
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又张了一次。林子里那些东西全散了。
      **散得连鸟都不叫了** —— 而那林子白天是很吵的。
