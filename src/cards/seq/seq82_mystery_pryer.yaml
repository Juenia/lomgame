# 原著依据：《诡秘之主》途径「隐者」序列 8「格斗学者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：寻求事物背后的秘密，而格斗也属于事物的一种，掌握着许多流派的格斗术
id: seq82_mystery_pryer
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq8_mystery_pryer 撞了同一个名字，从本卡正文里另取一个短语。
name: 那个角度
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你又看了一遍那段录像 —— 那个人的手肘在出拳前**转了一个很奇怪的角度**。
    不是花招。那一下省了半寸，而那半寸决定了这一拳能不能打穿。
    你对着空气试了一遍。第三遍的时候你找到了那个角度。
    **原来他不是在打人，是在打那个人的重心。**
  group: 有人在巷子里对着空气出拳，出了很久。
daily_limit: 1

options:
  - key: '1'
    label: 把录像再看一遍
    effects: [ { dig: 4 } ]
    text: |
      第四遍的时候你看见他收拳时**手指是松的**。
      那一下不是发力，是卸力 —— **他把力还给了地面**。
  - key: '2'
    label: 去问那个人这一招哪学的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他答得很含糊。
      但他说出了一个门派的名字 —— **那个门派三十年前就断了**。
  - key: '3'
    label: 把这招教给别人
    effects: [ { dig: 6, hp: 1 } ]
    text: |
      你教了三个人。只有一个人学会了。
      你问他为什么，他说：「**我也这么矮。**」
  - key: '4'
    label: 对着空气再试五十遍
    effects: [ { dig: 7, hp: 2, mad: 2 } ]
    text: |
      第五十遍的时候你打出了那一下。手肘的角度对了。
      **但你的肩膀脱了力** —— 那一下要的力气不在肩上，你到现在才明白。
