# 原著依据：《诡秘之主》途径「母亲」序列 9「耕种者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：擅于分辨种子，培育它们，用农具比用刀和枪更适合耕种者
id: seq92_mother
name: 分辨种子
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    一把种子摊在桌上，看着都一样。
    你一颗一颗地挑，挑出了其中七颗。
    **这七颗能活。** 其余的都长不出来。
    你把七颗包起来，剩下的倒回去了。
  group: 那块地的苗出得比旁边齐，别人问他怎么弄的，他说不知道。
daily_limit: 1

options:
  - key: '1'
    label: 把那七颗种下去
    effects: [ { dig: 5 } ]
    text: |
      你把七颗埋进土里，浇水，等。
      **第七天出芽，七棵一棵不多一棵不少。**
  - key: '2'
    label: 剩下的也种一块，看是不是真的不长
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把剩下的也种了，就在旁边。
      第七天那块地还是空的 —— **而你已经知道会是这样**。
  - key: '3'
    label: 教别人怎么挑
    effects: [ { dig: 7, dp: 1 } ]
    text: |
      你教了三个人。三个人挑出来的都不一样。
      **而你说不出自己是怎么挑的** —— 你只是看着它们，就知道哪颗能活。
