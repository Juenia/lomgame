# 事件卡链（M2.87）—— **新链的第一段**。
# 触发：任意已入途径的人（`pathway:initiated`）
# 设出 flag `shared_a_secret` → 后续卡 `chain_shared_a_secret`
id: start_shared_a_secret
name: 说出去了一件事
trigger:
  type: daily
  weight: 9
  cond:
    - 'pathway:initiated'
effects:
  - { dig: 2 }
  - { cor: 1 }
  - { flag: shared_a_secret }
texts:
  priv: |
    那件事你憋了很久，今天说出去了。
    说完之后轻松了一点。
    **但也有点空。**
    对面的人一直在听，一句都没插。
  group: 有人在酒馆里说了很久，对面的人一直没说话。
daily_limit: 1

options:
  - key: '1'
    label: 问他为什么不说话
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      他说他在听。
      **而他说这话的时候** —— 他把你面前的杯子往边上挪了挪。
  - key: '2'
    label: 把话收回来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说：「当我没说过。」
      **而他笑了一下** —— 笑的意思是他已经记住了。
  - key: '3'
    label: 再说一件更深的
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又说了。这次说得很快。
      **说完之后那个空的地方更大了** —— 而你居然觉得舒服。
