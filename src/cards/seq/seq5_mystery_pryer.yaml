# 原著依据：《诡秘之主》途径「隐者」序列 5「星象师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：星之巨柱：右手掌心形成旋转的星沙，一颗又一颗星辰浮现
id: seq5_mystery_pryer
name: 掌心的星沙
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mystery_pryer'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { dig: 2 }
texts:
  priv: |
    你把右手摊开。
    **掌心浮起一团沙** —— 很细，在慢慢转。
    转着转着，里面亮起一颗，又一颗。
    你把手合上，沙没了。打开还是空的。
  group: 有人摊开手掌，掌心里亮过一点东西。
daily_limit: 1

options:
  - key: '1'
    label: 把手合上，再打开一次
    effects: [ { dig: 4 } ]
    text: |
      合上，打开。空的。
      **但掌心还留着一点温度** —— 那点温度比沙更实在。
  - key: '2'
    label: 数里面有几颗
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你数到第九颗的时候它散了。
      **而你知道刚才还有第十颗** —— 你只是没来得及数。
  - key: '3'
    label: 让它一直转着
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你摊着手站了很久。沙子转得越来越快。
      **街上的灯一盏盏灭了** —— 不是烧坏，是像被吸走了。
