# 原著依据：《诡秘之主》途径「暴君」序列 6「风眷者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能在自体内刮出狂风、四周盘绕飓风；脚下生成狂风推进，跑速提高一倍以上
id: seq6_sailor
name: 风是从你身上出来的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    你跑起来的时候，街边摊子上的纸全飞了。
    **风是从你身上刮出来的** —— 你身后那一段路，尘土扬了很高。
    追你的人站在原地，被吹得睁不开眼。
    你跑出很远才停下，发现自己在笑。
  group: 那条街上忽然刮起一阵风，只刮了很短一段路。
daily_limit: 1

options:
  - key: '1'
    label: 停下来，回头看那段路
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。尘土还在飘。
      **飘的范围正好是你跑过的那一段** —— 一步都没多。
  - key: '2'
    label: 再跑一次，这次慢一点
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你慢着跑。风小了很多。
      **而身后的尘土还是扬起来了** —— 只是矮了一点。
  - key: '3'
    label: 回去看看追你的人
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回去了。他们还站在原地揉眼睛。
      **而他们看见你的时候** —— 退了半步。
