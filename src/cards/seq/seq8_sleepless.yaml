# 原著依据：《诡秘之主》途径「黑暗」序列 8「午夜诗人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：擅长用不同风格的诗篇对周围的生灵造成不同影响，比如让敌人精神恍惚，让队友安静下来
id: seq8_sleepless
name: 屋里安静了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 8
  max_seq: 8
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    屋里有个人在闹，摔东西，骂人。
    你念了一段诗 —— 很轻，别人听不太清。
    闹的人慢慢坐下来了。
    **所有人都安静了。包括角落里那个一直没出声的人 —— 而他本来就不该出声。**
  group: 那间闹了半宿的屋子，忽然安静下来了。
daily_limit: 1

options:
  - key: '1'
    label: 把那首诗念完
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你念完了。屋里安静得能听见钟摆。
      **而那座钟昨天就停了** —— 你亲手停的。
  - key: '2'
    label: 看看角落里那个人
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你看他。他没有动。
      **而他没有影子** —— 地上那一块是空的，什么都没有。
  - key: '3'
    label: 再念一段
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又念了一段。这次连窗外都安静了。
      **街上没有一个人说话** —— 连狗都不叫。
