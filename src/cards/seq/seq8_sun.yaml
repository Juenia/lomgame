# 原著依据：《诡秘之主》途径「太阳」序列 8「祈光人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：白昼：让周围十米获得光照；祝福；日照：创造仿佛正午烈阳的光芒
id: seq8_sun
name: 十米之内
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 8
  max_seq: 8
effects:
  - { mp: 3 }
  - { hp: 1 }
texts:
  priv: |
    那条巷子没有灯，两边的墙又高。你走进去的时候什么都看不见。
    你抬手做了个动作 —— 什么也没拿。
    **十米之内亮了。** 光是从你身上出来的，很淡，但足够看清脚下的路。
    你走过去，光跟着你。出巷子的时候它自己收了。
  group: 那条没有灯的巷子里，有人看见了一点光。
daily_limit: 1

options:
  - key: '1'
    label: 走到巷子中间，停下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你停在中间。光还亮着。
      **而巷子两头都是黑的** —— 黑得很匀。
  - key: '2'
    label: 试着把范围收小一点
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你收了收。光只剩三尺。
      **刚好照到你脚下** —— 再往前一步就看不见了。
  - key: '3'
    label: 试着照得更远
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你放远了。照到二十米的时候。
      **墙上有东西在动** —— 而它没有影子。
