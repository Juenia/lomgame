# 事件卡链（M2.87）—— **三级链的第三段（终点）**。
# 前置链：第一段设 `lucid` → 第二段读它、设 `lucid_sought` → 本卡读 `lucid_sought`。
# 本卡**不再设新 flag** —— 链到此为止。
id: chain3_lucid_sought
name: 那次之后会忘
trigger:
  type: daily
  weight: 10
  cond:
    - 'flag:lucid_sought'
effects:
  - { cor: 3 }
  - { mad: 3 }
texts:
  priv: |
    你用了第三次。
    清醒的那几分钟里你什么都想明白了。
    **然后忘得比前两次更干净。**
    你只记得自己想过什么，想不起来了。
  group: 有人最近总在本子上记东西，记完自己也不看。
daily_limit: 1
