# 原著依据：《诡秘之主》途径「母亲」序列 8「医师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：即使不开灵视，也能从目标身体的诸多外在表现里看出潜藏的疾病
id: seq82_mother
name: 不用灵视也看得出
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:mother'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你只是跟他握了个手。
    手很暖，握得也有力。
    **但指甲的颜色不对** —— 你见过这种颜色。
    你没有当场说。你记下了他的名字。
  group: 有人跟人握了个手之后，就一直在看自己的手。
daily_limit: 1

options:
  - key: '1'
    label: 把这件事记下来，先不动
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你记下了他的名字，回家写在一张纸上。
      三天之后你去查 —— **那个人三个月前就死了**。
  - key: '2'
    label: 当场问他一句
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      「最近睡得好不好？」
      **他握手的力道忽然重了一下** —— 然后又松开了，笑着说挺好。
  - key: '3'
    label: 跟着他
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你跟了三条街。他进了一间没有招牌的铺子。
      **出来的时候他的指甲是正常的颜色** —— 而他走路的样子变了。
