# 原著依据：《诡秘之主》途径「魔女」序列 6「欢愉」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：细线也能让自己被拉扯着般快速横移到另一个方向
id: seq62_assassin
name: 横移
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 6
  max_seq: 6
effects:
  - { mp: 1 }
  - { dig: 2 }
texts:
  priv: |
    刀落下来的时候，你**横着出去了**。
    不是跑，是被什么拽着出去的。
    你落地的时候站得很稳。
    刀砍在地上，溅起了一小片灰。
  group: 有人在那条巷子里一刀砍空，砍进了地里。
daily_limit: 1

options:
  - key: '1'
    label: 站起来，拍拍身上的灰
    effects: [ { dig: 5 } ]
    text: |
      你拍拍衣服。灰是从刀口那边溅过来的。
      **你站的位置没有变** —— 变的是你和刀之间的那段距离。
  - key: '2'
    label: 回头看他一眼
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你回头。他还保持着落刀的姿势。
      **而他的手腕已经不对了** —— 那个角度不该是人手能扭到的。
  - key: '3'
    label: 再横移一次，这次看清
    effects: [ { dig: 7, hp: 2, mad: 2 } ]
    text: |
      你又试了一次。这一次你看清了。
      **你不是移动，是被人从另一个地方挪过来的** —— 而那“另一个地方”你不记得自己待过。
