# 原著依据：《诡秘之主》途径「深渊」序列 9「罪犯」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：身和心都处于恶欲的统治之下，但良知还未彻底泯灭，还不够冷酷
id: seq92_criminal
name: 良知还在
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:criminal'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { cor: 2 }
texts:
  priv: |
    你已经决定了。
    走到门口的时候你停了一下。
    **那一下很短** —— 短到你自己都差点没察觉。
    然后你还是推门进去了。做完之后在门口吐了。
  group: 那个人做完事之后在门口蹲了很久。
daily_limit: 1

options:
  - key: '1'
    label: 在门口站一会儿
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站在门口没有走。
      **那一下还在** —— 很短，但你知道它还在。
  - key: '2'
    label: 回去把这件事做完
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又进去了。这次那一下更短。
      **短到你自己都没停下来** —— 做完之后你在门口坐了很久。
  - key: '3'
    label: 找个人说说话
    effects: [ { dig: 5, cor: 2, mad: -1 } ]
    text: |
      你找了个人，把话说了一半。
      **他听完没接话** —— 只是站起来给你倒了杯水。
