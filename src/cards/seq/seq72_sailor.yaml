# 原著依据：《诡秘之主》途径「暴君」序列 7「航海家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：是水的朋友，能在水下自由活动超过半个小时
id: seq72_sailor
name: 水下半个钟头
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sailor'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    船底缠住了，要有人下去。
    你说你去。他们给了你一根绳。
    **你在水下待了二十八分钟。**
    上来的时候绳还在手里，人没喘。
  group: 那条船的底昨天有人下去过，上来时衣服都没怎么湿。
daily_limit: 1

options:
  - key: '1'
    label: 把绳解下来还给它们
    effects: [ { dig: 5 } ]
    text: |
      你把绳解下来递回去。
      **他没有接** —— 他一直在看你的衣服。
  - key: '2'
    label: 问他们船底缠的是什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他们说是一段缆绳。
      **而那段缆绳三年前就扔了** —— 扔的时候是你亲眼看的。
  - key: '3'
    label: 再下去一次，这次不带绳
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又下去了，没带绳。这次你在底下待了四十分钟。
      **上来的时候你手里多了一样东西** —— 你没有给他们看。
