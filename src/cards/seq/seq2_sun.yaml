# 原著依据：《诡秘之主》途径「太阳」序列 2「逐光者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：获得太阳与光之权柄：可化光飞行、化为光芒承受伤害并重组身体、锚定太阳不会迷路
id: seq2_sun
name: 化为光
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sun'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 5 }
  - { mp: 4 }
texts:
  priv: |
    那一击打在你身上，你**散了**。
    散成了光 —— 屋子里一时间亮得睁不开眼。
    等光聚回来的时候，你还站在原来的位置上。
    对面那个人已经跪下了。
  group: 那间屋子里亮过一下，亮得很不正常。
daily_limit: 1

options:
  - key: '1'
    label: 重新聚起来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你聚回来了。对面那个人已经跪下了。
      **而他一直在看地上** —— 那里什么都没有。
  - key: '2'
    label: 再散一次，这次慢一点
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又散了一次。这次你能看见整间屋子。
      **包括你自己站的那个位置** —— 那里现在是空的。
  - key: '3'
    label: 走过去扶他起来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你过去了。他抬头看你的时候在哭。
      **而他说不出为什么** —— 他只说眼睛疼。
