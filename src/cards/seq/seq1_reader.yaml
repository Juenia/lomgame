# 原著依据：《诡秘之主》途径「白塔」序列 1「全知之眼」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分全知权柄：可看到目标过去、现在、未来的全部信息；模仿能力与法术效果达到原版 100%
id: seq1_reader
name: 全部信息
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 1
  max_seq: 1
effects:
  - { dig: 6 }
  - { mad: 2 }
texts:
  priv: |
    你看了他一眼。
    **过去、现在、以后，全在。** 包括他会在哪一年死，死的时候身边有谁。
    他问你为什么这样看他。
    「没什么，」你说。你没有告诉他最后那一段。
  group: 那位预言家看了人一眼之后就再没说话。
daily_limit: 1

options:
  - key: '1'
    label: 把最后那一段压下去
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把它压下去了。而它一直在那儿。
      **你想别的事的时候它会浮上来** —— 像水面下的东西。
  - key: '2'
    label: 告诉他
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你说了。他听完笑了。
      **然后问你是哪一年** —— 而你没有答。
  - key: '3'
    label: 再看他一眼，看得更细
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又看了一眼。这次多了一样。
      **他死的时候身边有一个人** —— 而你认得那个人，你今天刚见过。
