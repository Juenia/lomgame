# 原著依据：《诡秘之主》途径「暴君」序列 9「水手」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：幻鳞：隐藏于皮肤下，让人像鱼一样难以被抓住
id: seq92_sailor
name: 鱼一样滑
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sailor'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    你从他手里把胳膊抽出来的时候，没有用力。
    **只是转了一下手腕。** 而他的手就空了。
    「你抹了油？」他问。你把手翻过来给他看 —— 手是干的。
    他又抓了一次，这次用了两只手。还是空。
  group: 码头上那个人抓着别人的胳膊，手是自己松开的。
daily_limit: 1

options:
  - key: '1'
    label: 把手翻过来给他看，什么都不说
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把手翻过来。手是干的。
      **他盯着看了很久** —— 然后把手在自己裤子上擦了两下。
  - key: '2'
    label: 问他抓你做什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他张了张嘴，说他认错人了。
      **而他刚才喊的那个名字** —— 是你三年前用过的。
  - key: '3'
    label: 让他抓第三次，这次不躲
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      他抓了。两只手都扣上了。
      **而他扣住的那一刻，你的胳膊在他手里转了一圈** —— 像水从指缝里过。
