# 地点专属（M2.87）。地点：「贝克兰德」（backlund，危险度 3）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_backlund
name: 首都的雨
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:贝克兰德'
effects:
  - { dig: 2 }
  - { hp: -1 }
texts:
  priv: |
    贝克兰德的雨下起来就没完。
    你在屋檐下站了一个钟头。
    **水面上浮着一层东西** —— 很薄，颜色像油，但没有味道。
    雨停之后那层东西自己散了。
  group: 贝克兰德昨天的雨里浮着一层东西，没人说得出是什么。
daily_limit: 1

options:
  - key: '1'
    label: 伸手去碰那层东西
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你伸出手指碰了一下。它是滑的。
      **而碰过的地方没有留下你的印子** —— 水面自己合上了。
  - key: '2'
    label: 等雨停，看它怎么散
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你等到雨停。它散得很慢。
      **散的方向是往东** —— 那边是码头。
  - key: '3'
    label: 记住它浮在水面的位置
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你记住了。它只浮在屋檐滴水的那一片。
      **而别处的水是干净的** —— 一步之隔。
