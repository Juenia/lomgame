# 原著依据：《诡秘之主》途径「愚者」序列 0「愚者」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：神国诡秘之境：「诡异」象征（又称不可思议象征）与「时空之王」象征带来的可自行创造的神国，自带一定的隐秘
id: seq0_seer
name: 诡秘之境
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:seer'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 7 }
  - { cor: 4 }
texts:
  priv: |
    你记得你去过一个地方。
    **但你说不出那里是什么样子** —— 不是忘了，是那个地方不能被说出来。
    你只记得里面很安静，而且你知道那里有别人。
    你想再去一次。你想不起来怎么去。
  group: 有人一直在找一个他说不清的地方。
daily_limit: 1

options:
  - key: '1'
    label: 不再找那个地方
    effects: [ { dig: 4 } ]
    text: |
      你把这件事按下去。**有些门找不到，就是最好的结果。**
  - key: '2'
    label: 再去一次，这次记下路
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你闭上眼，顺着记忆里那点安静往回走。
      你摸到了边缘 —— 然后听见了里面有人在叫你的名字。**你退出来了。**
  - key: '3'
    label: 找个人问问那个地方
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了。对方听完脸色变了，很久才说了一句：
      「**不要再问**」 —— 他没有说为什么，也没有再看你。
