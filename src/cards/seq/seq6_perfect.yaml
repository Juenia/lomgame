# 原著依据：《诡秘之主》途径「完美者」序列 6「机械专家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可以制造机械奇物和不算强的非凡物品；造的物品负面影响低、效果好
id: seq6_perfect
name: 它太安静了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:perfect'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    你花了十一天，做出来一个东西。
    它按你说的做每一件事，一次都没有错过。
    **唯一的缺点是它太安静了。**
    你把耳朵凑过去，里面什么都没有 —— 但它在动。
  group: 有人屋里那台机器一直转着，听不见声音。
daily_limit: 1

options:
  - key: '1'
    label: 让它停下来
    effects: [ { dig: 4 } ]
    text: |
      你把它停了。屋里一下子安静得不一样。
      **原来刚才那种安静，就是它在出声。**
  - key: '2'
    label: 让它做一件你没吩咐的事
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      它做了。做完之后它转过来对着你，等了七秒。
      **你确定自己没有让它等** —— 你数了两遍。
  - key: '3'
    label: 把它拆开看看
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你拆到第三层就停了。
      **里面那部分你没有做过** —— 它不该在那里，而它在。
  - key: '4'
    label: 留着它，什么都不做
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你让它一直转着。十一天之后你习惯了那种安静。
      **那才是最危险的** —— 习惯之后你就不会再凑过去听了。
