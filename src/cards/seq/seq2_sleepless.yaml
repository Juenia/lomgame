# 原著依据：《诡秘之主》途径「黑暗」序列 2「隐秘之仆」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：具备隐秘权柄：能让发生的一切都不被窥见，也能将隐秘的内容展现；可让目标进入隐秘状态
id: seq2_sleepless
name: 不会被看见
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 2
  max_seq: 2
effects:
  - { dig: 4 }
  - { hp: 3 }
texts:
  priv: |
    你在这间屋子里做完了所有事。
    **没有留下任何痕迹** —— 不是擦掉了，是本来就不会被看见。
    占卜师算过，说这片地方什么都没有。
    你从他旁边走过去的时候，他打了个寒战。
  group: 那间屋子出了事，但查了半个月什么都没查到。
daily_limit: 1

options:
  - key: '1'
    label: 从他旁边走过去
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走过去了。他打了个寒战。
      **而他一直在看那个方向** —— 看了很久，什么也没看见。
  - key: '2'
    label: 回头看那间屋子
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回头。屋子还是那间屋子。
      **而门是开着的** —— 你刚才明明关过。
  - key: '3'
    label: 再走一遍刚才做过的事
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又走了一遍。这次你留下了一样东西。
      **一个小小的印子** —— 而它比你预想的深。
