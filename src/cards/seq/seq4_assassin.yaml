# 原著依据：《诡秘之主》途径「魔女」序列 4「绝望」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：疾病变成可覆盖三公里的瘟疫；刚晋升一般只能掌握两种
id: seq4_assassin
name: 三公里
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:assassin'
  min_seq: 4
  max_seq: 4
effects:
  - { cor: 3 }
  - { mad: 2 }
texts:
  priv: |
    你走过那个街区的时候什么也没做。
    **三公里**，你算了一下，够了。
    第二天开始有人咳嗽。第三天，医馆门口排了队。
    你又去看了一次，站在街口，看了一会儿走了。
  group: 那个区的人这几天都在咳，医馆说是换季。
daily_limit: 1

options:
  - key: '1'
    label: 再走一遍，确认范围
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你又走了一遍。范围比你想的准。
      **街尾那家没咳，街口那家咳了** —— 而这条线正好在你走过的那一步上。
  - key: '2'
    label: 去医馆听听他们怎么说
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      医馆说是换季。
      **而医馆自己家的人也开始咳了** —— 你站在门口听见的。
  - key: '3'
    label: 把范围缩到那一条巷子里
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又走了一遍，这次只走了巷子。
      **第二天巷子里只剩三户人家在咳** —— 而另外五户搬走了。
