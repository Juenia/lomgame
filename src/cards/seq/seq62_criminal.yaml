# 原著依据：《诡秘之主》途径「深渊」序列 6「恶魔」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：冷血、不惊慌、不恐惧，擅长肉搏；最大弱点是容易失控，容易被嗜血与杀戮的欲望控制
id: seq62_criminal
name: 容易失控
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:criminal'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 3 }
  - { cor: 3 }
texts:
  priv: |
    你打赢了。
    他还躺着，已经不动了。
    **但你没有停。** 等你想起来要停的时候，手已经酸了。
    你站起来，看着地上的东西，看了很久。
  group: 那条巷子里的事做得很过头，查的人都不愿意多说。
daily_limit: 1

options:
  - key: '1'
    label: 站着看地上的东西
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你站了很久。手酸得抬不起来。
      **而你没有再看第二眼** —— 转身走的时候，天已经亮了。
  - key: '2'
    label: 把现场收拾干净
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把它处理了。处理的时候你很仔细。
      **仔细到自己都觉得不对** —— 但你手上没停。
  - key: '3'
    label: 去找他家里的人
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你去了。开门的是个小孩。
      **他问你找他爸爸干什么** —— 而你站在门口，一句话都没说出来。
