# 原著依据：《诡秘之主》途径「被缚者」序列 8「疯子」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：爆发欲望可获得对干扰思绪、影响精神的非凡能力的强大抵抗力
id: seq82_prisoner
name: 抵抗力
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:prisoner'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 2 }
  - { mad: 2 }
texts:
  priv: |
    有人在你面前做了一场很漂亮的仪式。
    光、声音、气味，全套的。
    **你什么都没感觉到。**
    做完之后那个人看着你，你不耐烦地问他：「完了？」
  group: 有人做了场仪式，对付的那个人打了个哈欠。
daily_limit: 1

options:
  - key: '1'
    label: 转身走开
    effects: [ { dig: 5 } ]
    text: |
      你转身走了。他在身后喊了一句什么。
      **你没听清** —— 而你也不想回头问。
  - key: '2'
    label: 问他在做什么仪式
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他说是驱邪。
      **说完他自己往后退了一步** —— 而他手里那盏灯还举着。
  - key: '3'
    label: 让他再做一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你让他再做一次。这次他做了一半就停了。
      **说他做不下去了** —— 而他的声音在抖。
