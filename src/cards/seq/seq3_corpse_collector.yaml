# 原著依据：《诡秘之主》途径「死神」序列 3「摆渡人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：具备一定死亡权柄，与其对视的生灵将直接死亡；被纳入眼睛的目标将缓慢凋零
id: seq3_corpse_collector
name: 与他对视的人
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 3
  max_seq: 3
effects:
  - { cor: 3 }
  - { hp: 3 }
texts:
  priv: |
    他冲过来的时候你在看别处。
    你转过头，看了他一眼。
    **他停住了。** 手还举着，人不动了。
    你走过去的时候绕开了他 —— 不看第二眼。
  group: 那条巷子里站着一个人，站了很久没动。
daily_limit: 1

options:
  - key: '1'
    label: 绕开他，走自己的路
    effects: [ { dig: 5 } ]
    text: |
      你绕开他走了。路过他身边的时候，**你能听见他在呼吸** —— 很慢。
  - key: '2'
    label: 回头再看一眼
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你回头。他还站在那儿。
      **而他的眼睛跟着你转了** —— 身体没动，只有眼睛。
  - key: '3'
    label: 走过去，把他的手按下来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走过去，握住他的手腕按下来。他的手很凉。
      **像是已经在那儿举了很久** —— 比你以为的久得多。
