# 原著依据：《诡秘之主》途径「完美者」序列 5「天文学家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# ⚠️ 序列 5 在**玩家可达区间内**（内容边界 CONTENT_TARGET_SEQ = 2 ⇒ 玩家可达序列 2）。
# 能力原文：星之祝福：引来星光，改变区域内或对应目标所受重力
id: seq52_perfect
name: 大地的重量
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:perfect'
  min_seq: 5
  max_seq: 5
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    那扇门很重，两个人推不动。
    你抬头看了一眼。
    **「轻了，」** 你说。
    一个人就推开了。
  group: 那扇一直推不开的门，昨天一个人推开了。
daily_limit: 1

options:
  - key: '1'
    label: 再说一次，让门更轻
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你说「更轻」。
      门变成了纸一样 —— **推开它的人收不住，摔了一跤**。
  - key: '2'
    label: 把重量还回去
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你说「重了」。门又回到原来那样。
      刚才推开它的那个人正在揉肩膀 —— **他不知道自己在跟什么较劲**。
  - key: '3'
    label: 问问那个人感觉到了什么
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说没感觉到什么。
      「就是忽然觉得**这扇门没什么了不起的**。」—— 他把这句话说得像在开玩笑。
