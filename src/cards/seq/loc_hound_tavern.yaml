# 地点专属（M2.87）。地点：「猎犬酒馆」（hound_tavern，危险度 2）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_hound_tavern
name: 门口的狗
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:猎犬酒馆'
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    酒馆门口卧着一条老狗，谁来都不动。
    你走过去的时候它抬起了头。
    **它看了你很久，然后让开了。**
    老板在门里看着，什么也没说。
  group: 猎犬酒馆门口那条老狗，昨天给一个陌生人让了路。
daily_limit: 1

options:
  - key: '1'
    label: 伸手摸它一下
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你伸手摸它。它没有躲。
      **而它是凉的** —— 凉得像放在外面的石头。
  - key: '2'
    label: 问老板这狗是谁的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      老板说不是他的。
      **他说这狗在这儿卧了七年** —— 而这店是三年前才开的。
  - key: '3'
    label: 进去了再回头看它
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你进去，坐下，回头透过窗看它。
      **它已经把头转过去了** —— 转的方向是街口。
