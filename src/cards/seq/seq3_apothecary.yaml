# 原著依据：《诡秘之主》途径「月亮」序列 3「召唤大师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可与天使签订契约直接召唤；召唤偶尔会出现难以控制的异变，让并非来自灵界的奇怪生物降临
id: seq3_apothecary
name: 来的不是它
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { cor: 3 }
texts:
  priv: |
    你按仪式念完了。
    来的**不是你要的那个**。
    它比你想的大，也比你想的安静，落地的时候没有声音。
    它看了你一会儿。你没有动。后来它自己走了。
  group: 那间屋子里昨晚有什么东西来过，地毯上有一圈压痕。
daily_limit: 1

options:
  - key: '1'
    label: 把地毯上那圈压痕留下
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你没动它。第二天压痕还在。
      **而且比昨天深了一点** —— 你量过。
  - key: '2'
    label: 改一改仪式，试着叫对
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把仪式改了三个地方。这次来的东西比上次近了一步。
      **你看清了它没有脸** —— 而它在你面前站了很久才走。
  - key: '3'
    label: 把那间屋子封起来
    effects: [ { dig: 6, hp: 2 } ]
    text: |
      你把门窗都钉死了。
      钉完最后一块板的时候 —— **里面响了一声**。你没有回去看。
