# 原著依据：《诡秘之主》途径「愚者」序列 9「占卜家」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：获得灵视能力；获得占卜能力，能够学习占星术、卡牌占卜、灵摆等等
id: seq9_seer
name: 全是背面
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    你把牌摊在桌上，问了那个问题。
    翻的时候手滑了一下 —— 三张牌全是背面。
    你盯着它们看。**然后你知道了答案。**
    你把牌收起来，没有再翻第二次。有些答案你不想要第二遍。
  group: 有人在桌上摊了一副牌，牌面朝下，看了很久。
daily_limit: 1

options:
  - key: '1'
    label: 收起来，不再翻第二次
    effects: [ { dig: 2 } ]
    text: |
      你把牌收进盒子，扣上。**答案你已经拿到了** —— 再翻一次只是想让它是别的。
  - key: '2'
    label: 再摊一次，问同一件事
    effects: [ { dig: 5, mad: 2 } ]
    text: |
      第二次翻出来的和第一次**一样**。
      一样到你开始希望它不一样 —— 那一刻你才知道自己问的是哪一边。
  - key: '3'
    label: 不去问牌，问自己为什么想知道
    effects: [ { dig: 4, cor: 1 } ]
    text: |
      你把牌推远，坐着没动。
      占卜家真正要练的不是「看见」，是**看清自己想看什么**。这一次你没看清。
