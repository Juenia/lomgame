# 原著依据：《诡秘之主》途径「命运之轮」序列 5「赢家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能某种程度掌控自身幸运，积累幸运在关键时刻化解致命危机
id: seq5_monster
name: 三次都是差一点
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    第一枪擦着耳朵过去，第二枪卡壳，第三枪打中了胸口的怀表。
    **三次都是差一点。**
    你低头看那块表 —— 停在那一秒上。
    对面那个人扔了枪，跑了。
  group: 有人挨了三枪，站在原地看着自己的怀表。
daily_limit: 1

options:
  - key: '1'
    label: 低头看那块怀表
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你低头看。表停在那一秒上。
      **而它昨天还在走** —— 你昨天还看过时间。
  - key: '2'
    label: 追上去问他为什么开枪
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你追上去了。他跑得很快。
      **而他没有回答** —— 他只是跑，一直跑到你看不见为止。
  - key: '3'
    label: 把表收起来，留着
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把表收起来了。第二天它开始走了。
      **走的是倒的** —— 而那上面只有一根指针。
