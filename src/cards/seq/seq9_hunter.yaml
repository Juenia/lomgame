# 原著依据：《诡秘之主》途径「红祭司」序列 9「猎人」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：感官能力直线提升，对痕迹的把握超越了正常人类的水准
id: seq9_hunter
name: 三天前的味道
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    你走进那条巷子，脚步停了半拍。
    有味道 —— 三天前有条狗从这里过去，右后腿是瘸的。
    你顺着往下走，在转角看见了墙根那几道爪痕。
    你蹲下来摸了摸。**你从没养过狗，也不知道自己为什么会知道。**
  group: 有人在巷子里蹲下来看墙根，看了很久。
daily_limit: 1

options:
  - key: '1'
    label: 蹲下来摸那几道爪痕
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你摸了摸。爪痕是往里的。
      **那条狗是从巷子里出来的** —— 不是进去的。
  - key: '2'
    label: 顺着味道往巷子里走
    effects: [ { dig: 7, cor: 2, mad: 3 } ]
    text: |
      你往里走。味道越来越浓。
      **尽头有一堆土** —— 是新的，今天刚翻过。
  - key: '3'
    label: 问自己为什么会知道
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了自己。答案是不知道。
      **而你记得自己小时候摸过一条瘸腿的狗** —— 那条狗后来不见了。
