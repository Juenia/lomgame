# 原著依据：《诡秘之主》途径「红祭司」序列 9「猎人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：在对环境细致观察的前提下，能直观地找到要点，比如怎么更轻松地把一堵墙壁弄塌
id: seq92_hunter
name: 哪块砖先动
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你在那面墙前面站了一会儿。
    墙是实的，看不出哪里有问题。
    **但你知道该推哪里** —— 从左往右第四行，第二块。
    你伸手按了一下。上面掉下来一小撮灰。
  group: 那面老墙昨天自己塌了一角。
daily_limit: 1

options:
  - key: '1'
    label: 顺着那块砖往下摸
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你往下摸。灰一直掉。
      **掉到你手边的时候停住了** —— 像是碰到了什么。
  - key: '2'
    label: 把整面墙都按一遍
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你按了一遍。只有那一块是空的。
      **而它旁边的两块也松了** —— 你把它们按回去的时候，墙里响了一声。
  - key: '3'
    label: 去问这面墙是谁砌的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你问了住在旁边的人。他说这墙比他大。
      **而墙根有一块砖上刻着字** —— 刻的是一个人的名字，和一个年份。
