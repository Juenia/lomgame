# 原著依据：《诡秘之主》途径「命运之轮」序列 8「机器」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：拥有恐怖的计算能力和精准的控制力；拥有了占卜和反占卜的能力
id: seq8_monster
name: 第七张
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
texts:
  priv: |
    桌上一副牌，你洗了三遍。
    「第七张是什么？」有人问。
    你没有翻，报了一个数出来。
    翻开 —— 对。桌上安静了一下。**而洗牌的是对方。**
  group: 牌桌上有人报了个数，翻开是对的，而他没看过牌。
daily_limit: 1

options:
  - key: '1'
    label: 让他再洗一次
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他又洗了一遍。你报了另一张。
      **翻开，又对** —— 而他洗得比上次快。
  - key: '2'
    label: 把整副牌报完
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你一张张报。报到第十三张的时候他停了手。
      **而他脸上没有表情了** —— 他只是把牌收起来，装进盒子。
  - key: '3'
    label: 问他这副牌是谁的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说是他父亲的。而他父亲三年前就死了。
      **这副牌一直在柜子里** —— 而他今天才第一次拿出来。
