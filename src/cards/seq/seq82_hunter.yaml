# 原著依据：《诡秘之主》途径「红祭司」序列 8「挑衅者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能掌握情报、信息和流言，精准地挑衅、激怒他人
id: seq82_hunter
name: 情报和流言
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    你在酒馆里坐了两个晚上，什么都没做。
    第一个晚上听，第二个晚上听别人说第一个晚上听到的。
    **第三天你知道了那件事的真相**，也知道是谁在传。
    你把杯子放下，起身走了。
  group: 这两天酒馆里传的那件事，传的人自己都信了。
daily_limit: 1

options:
  - key: '1'
    label: 把真相留着，什么都不说
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你没说。第三天那个人自己把话讲漏了。
      **而全酒馆的人都听见了** —— 他们看他的眼神变了。
  - key: '2'
    label: 跟着那个传话的人出去
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你跟着他。他拐进一间屋子。
      **里面还有三个人** —— 说的是同一件事，说法不一样。
  - key: '3'
    label: 把真相告诉酒馆里的人
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你说了。酒馆安静了一会儿。
      **然后有人笑了一声** —— 说「你也是听来的吧」。
