# 原著依据：《诡秘之主》途径「魔女」序列 7「女巫」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：初步掌握各种黑魔法，能通过血液等媒介诅咒目标，让对方被黑焰燃烧成灰烬
id: seq72_assassin
name: 黑焰
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:assassin'
  min_seq: 7
  max_seq: 7
effects:
  - { cor: 3 }
  - { dig: 2 }
texts:
  priv: |
    你拿到了他的一根头发，还有袖口上的一点血。
    你把它们包在纸里，放在蜡烛下面。
    **第二天他家里人说他一夜之间烧成了灰。**
    你没有去看。你把剩下的纸也烧了。
  group: 那家人死得很怪，说是自己烧起来的。
daily_limit: 1

options:
  - key: '1'
    label: 把剩下的纸也烧掉
    effects: [ { dig: 5 } ]
    text: |
      你把剩下的纸一片片烧了，灰也用脚碾过。
      **屋里没有别的味道** —— 那个味道只在那张纸烧的时候出现过一次。
  - key: '2'
    label: 去那家门口站一会儿
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你去了。门口有几个人在议论。
      **说他一夜之间就没了，连床都没烧** —— 而他们说的是「烧」，不是「死」。
  - key: '3'
    label: 用同样的法子再试一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又拿了一根头发，这次只烧了那一根。
      **而你想要的那个人第二天失踪了** —— 没有人说他死，也没有人说他活着。
