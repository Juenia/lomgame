# 原著依据：《诡秘之主》途径「命运之轮」序列 9「怪物」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：灵感极高，经常能听见别人听不见的声音，看到别人看不到的事物；常会陷入恍惚，呢喃别人听不懂的话语
id: seq9_monster
name: 有人在叫我
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 9
  max_seq: 9
effects:
  - { mad: 3 }
  - { dig: 1 }
texts:
  priv: |
    你在街上站住了。
    因为有人在叫你 —— 用的是你小时候的名字。
    你回头。这条街上没有人，连窗户后面都没有。
    你张嘴想答应，喉咙里出来的是另一个音。**那是你自己的声音，但话不是你要说的。**
  group: 街上有人站住回头，然后对着空处说了句听不懂的话。
daily_limit: 1

options:
  - key: '1'
    label: 不答应，接着往前走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你没答应，接着往前走。
      **身后那个声音又叫了一次** —— 这次叫的是你现在这个名字。
  - key: '2'
    label: 再回过头看一眼
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又回头。这次窗户后面有个人影。
      **而它没有脸** —— 它只是站在那里，跟你一样高。
  - key: '3'
    label: 用那个声音再答应一次
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你答应了。喉咙里出来的还是那个音。
      **而这一次街上所有的窗都关上了** —— 关得很齐。
