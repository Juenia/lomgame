# 原著依据：《诡秘之主》途径「母亲」序列 5「德鲁伊」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能化身为巨熊战斗，也可短暂化身晋升仪式所包含的生物；能汲取泥土养分
id: seq5_mother
name: 屋里装不下你了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 5
  max_seq: 5
effects:
  - { hp: 4 }
texts:
  priv: |
    那扇门太矮，你本来是弯着腰进去的。
    屋里的人拔出刀。
    **你站直的时候，屋顶已经装不下你了。**
    木板裂开的声音比什么都响。你从屋里出去的时候，天上有月亮。
  group: 那间屋子的屋顶昨晚塌了，里面的人说没看见什么。
daily_limit: 1

options:
  - key: '1'
    label: 低头钻出去，站到月亮底下
    effects: [ { dig: 5 } ]
    text: |
      你弯下腰钻出门框。
      **屋顶在你身后整片塌下来** —— 木板砸在你脚后跟上，你不觉得疼。
  - key: '2'
    label: 回头看看屋里的人
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你回头。他们手里的刀还举着。
      **而他们的头只到你的腰** —— 有一个人开始往后退，撞在了墙上。
  - key: '3'
    label: 试着缩回去
    effects: [ { dig: 7, hp: 2, mad: 3 } ]
    text: |
      你缩了回去。缩的时候骨头响了一路。
      **你花了一刻钟才回到原来的尺寸** —— 而那间屋子再也没能住人。
