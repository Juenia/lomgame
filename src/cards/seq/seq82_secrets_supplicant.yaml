# 原著依据：《诡秘之主》途径「倒吊人」序列 8「倾听者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：不主动使用能力也会比普通人和大部分中低序列非凡者听见得更多，声源近时受影响更大
id: seq82_secrets_supplicant
name: 听得太多了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 8
  max_seq: 8
effects:
  - { cor: 3 }
  - { mad: 2 }
texts:
  priv: |
    你在一间很安静的屋子里。
    别人说什么都没有。
    **但你听得见。** 很远的地方，很轻的，一直在说。
    你把手按在耳朵上 —— 没有用。你早就知道了。
  group: 那个人在安静的地方也总是皱着眉。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下来，习惯它
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你把手放下来。那些声音一直在。
      **你开始能分出其中几个在说什么** —— 而它们说的不是同一年的事。
  - key: '2'
    label: 找一个更吵的地方待着
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了码头。吵得听不见自己说话。
      **而那些声音还在** —— 只是远了，像隔着一层水。
  - key: '3'
    label: 回答其中一句
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你答了一句。所有声音同时停了。
      **停了大概三秒** —— 然后一起开始，比刚才响得多。
