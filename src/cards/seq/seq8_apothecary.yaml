# 原著依据：《诡秘之主》途径「月亮」序列 8「驯兽师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：动物感官：能读懂野兽的想法，沟通动物，驱使动物，并分享它们的感官
id: seq8_apothecary
name: 它想的是饿
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    巷口那条流浪狗瘦得能看见肋骨，它没有躲你。
    你蹲下来，伸出手。它凑近闻了闻 —— 你忽然知道它想的是什么。
    **不是「怕」，是「饿」。**
    你把身上那块面包掰了一半给它，起身走了。它没有跟。
  group: 巷口那条一直咬人的野狗，今天让一个陌生人摸了头。
daily_limit: 1

options:
  - key: '1'
    label: 把整块面包都留下
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把整块都给了它。它吃的时候一直抬眼看你。
      **怕你拿走** —— 而你已经走出十几步了。
  - key: '2'
    label: 跟着它，看看它住哪
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      它把你带到一个塌了半边的院子。
      **里面还有三只小的，都瘦** —— 它们看见你没有叫。
  - key: '3'
    label: 试着再听一次它想什么
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你蹲下来，把手放在它头上。
      **这一次你想的是「家」** —— 而它动了动耳朵，把头往你手心里顶了顶。
