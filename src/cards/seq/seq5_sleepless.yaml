# 原著依据：《诡秘之主》途径「黑暗」序列 5「灵巫」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能将自然灵与怨魂幽影封印于牙齿之上，通过敲动牙齿释放，获得灵体帮助
id: seq5_sleepless
name: 敲了敲牙
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sleepless'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 3 }
  - { cor: 1 }
texts:
  priv: |
    你用舌尖碰了碰右边第三颗牙。
    **有东西出来了。**
    屋里多了三个 —— 它们站在三个角上，不动。
    你把手里的东西放下。这件事不用你自己做了。
  group: 那间空屋里，昨晚有三个影子。
daily_limit: 1

options:
  - key: '1'
    label: 看看它们站在哪几个角上
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看了看。三个角，第四个空着。
      **而它们都朝着那个空角** —— 一动不动。
  - key: '2'
    label: 再敲一次牙
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又敲了一次。这次出来了五个。
      **而屋里没有那么多角** —— 有两个摞在了一起。
  - key: '3'
    label: 把手里的事交给它们
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你把手里的东西放下了。它们动了。
      **动得很慢** —— 但一直在动，一步都没有停。
