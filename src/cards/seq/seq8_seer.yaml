# 原著依据：《诡秘之主》途径「愚者」序列 8「小丑」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：精密地控制身体、操控自己的表情；优秀的直觉预感；化纸张为飞刀的类法术能力
id: seq8_seer
name: 脸上什么也没有
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:seer'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    对面那个人说了句很难听的话，屋里几个人都看着你。
    你没有动。脸上什么也没有 —— 连眼睛都没眨。
    但你自己知道：刚才心里翻了一下，翻得很厉害。
    **你把它按下去了，按得比真的一点都不在意还像。**
  group: 有人被当面羞辱，却笑了一下，笑得很自然。
daily_limit: 1

options:
  - key: '1'
    label: 继续演下去，一点破绽都不给
    effects: [ { dig: 4, mad: 1 } ]
    text: |
      你甚至笑了一下，笑得很自然。
      散场之后你才发现，那十分钟里你**一次都没呼吸顺过**。
  - key: '2'
    label: 事后一个人待一会儿
    effects: [ { dig: 2, mad: -1 } ]
    text: |
      你找了个没人的地方站着，把脸松下来。
      小丑的面具戴着不累，**摘下来那一下才累**。
  - key: '3'
    label: 把这句话记住，等机会
    effects: [ { dig: 3, cor: 1 } ]
    text: |
      你没回嘴，只把那个人的名字和那句话一起收好。
      脸色是给别人看的，**账是给自己记的**。
