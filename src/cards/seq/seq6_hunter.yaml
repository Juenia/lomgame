# 原著依据：《诡秘之主》途径「红祭司」序列 6「阴谋家」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：洞察能力上升，思维敏捷；误导、迷惑和欺骗方面的超凡能力
id: seq6_hunter
name: 他们查到了别人
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    他们查了三天。
    第三天下午，两个警员敲响了另一个人的门。
    你在街对面的茶摊上坐着，看他们把人带走。
    **你连一句话都没说过。** 你只是让该看到的证据出现在该出现的地方。
  group: 那桩案子查了三天，抓错了人。
daily_limit: 1

options:
  - key: '1'
    label: 喝完茶，走人
    effects: [ { dig: 5 } ]
    text: |
      你把茶喝完，付了钱，走了。
      **身后警车的声音很远** —— 而你没有回头看那扇门。
  - key: '2'
    label: 跟去看看他被带到哪
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你跟着去了。警局的门关上的时候，你听见里面有人在喊冤。
      **而你站在街对面** —— 站了一会儿就走了。
  - key: '3'
    label: 再让一份证据出现
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又放了一份。这一次他们抓的是对的人。
      **而那个人昨天还跟你说过话** —— 说的是他儿子要上学了。
