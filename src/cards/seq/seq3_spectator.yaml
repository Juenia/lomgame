# 原著依据：《诡秘之主》途径「空想家」序列 3「织梦人」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能编织梦境并将目标拉入，编织近乎真实的形象直接攻击精神薄弱处；敌人认为真的，那就是真的
id: seq3_spectator
name: 他信了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { cor: 3 }
texts:
  priv: |
    你给他编了一个梦 —— 梦里他妻子还活着。
    **他信了。** 信得很彻底，还跟她说了话。
    你站在旁边看着。
    然后你把那个形象撤掉了。他在梦里跪了下去。
  group: 有人睡了一夜，醒来之后一句话都没说。
daily_limit: 1

options:
  - key: '1'
    label: 站着看他把话说完
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你站着看。他跟她说了一刻钟。
      **说的都是他这些年没机会说的话** —— 一句一句，很有条理。
  - key: '2'
    label: 把那个形象再放一会儿
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你多放了一会儿。他开始问她过得好不好。
      **而你听见自己的名字被提了一次** —— 她提到了你。
  - key: '3'
    label: 第二天去看看他
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。他坐在门口，一句话都没说。
      **而他的鞋是湿的** —— 昨晚外面没下雨。
