# 地点专属（M2.87）。地点：「特里尔」（trier，危险度 2）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_trier
name: 铁工厂的钟
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:特里尔'
effects:
  - { dig: 2 }
  - { mad: 1 }
texts:
  priv: |
    特里尔到处是铁和烟。
    城里那口大钟每天敲十二下，几十年没停过。
    **今天敲了十三下。**
    街上有几个人也停下来数了。数完他们互相看了看，谁也没说话。
  group: 特里尔那口钟昨天多敲了一下，全城都听见了。
daily_limit: 1

options:
  - key: '1'
    label: 跟着数下一轮
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你等到下一个整点。这次敲了十二下。
      **而第十二下之后还有一声** —— 很轻，不仔细听不出来。
  - key: '2'
    label: 去钟楼底下看看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。钟楼的门锁着。
      **而门口的地上有很多脚印** —— 都朝着门，没有一个往外走。
  - key: '3'
    label: 问那几个停下来数的人
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你问了两个。他们都说数到十三。
      **而其中一个说他数到十四** —— 说完他自己就愣住了。
