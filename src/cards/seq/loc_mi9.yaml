# 地点专属（M2.87）。地点：「军情九处」（mi9，危险度 2）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_mi9
name: 档案上的名字
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:军情九处'
effects:
  - { dig: 4 }
  - { mad: 1 }
texts:
  priv: |
    你翻到那一页的时候停住了。
    **上面有你的名字。**
    日期是三年前 —— 那时候你还没来过这座城。
    你把档案合上，放回原处，位置对得很准。
  group: 军情九处有人查过一份三年前的档案。
daily_limit: 1

options:
  - key: '1'
    label: 把那一页记下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记下了日期和编号。
      **而编号的最后一栏是空的** —— 本来该填调阅人。
  - key: '2'
    label: 去查是谁调过这份档案
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你去查了。登记本上那一行被撕掉了。
      **而撕口很整齐** —— 是用尺子压着撕的。
  - key: '3'
    label: 装作没看见，接着翻别的
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你接着翻。翻了几十页。
      **而每一页的边角都是新的** —— 只有你翻过的那一页旧。
