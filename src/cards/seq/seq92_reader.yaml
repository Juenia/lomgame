# 原著依据：《诡秘之主》途径「白塔」序列 9「阅读者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：记忆的提升和理解能力、学习能力的增强，能使用仪式魔法
id: seq92_reader
# M2.90：显示名必须两两不同 —— 渲染层拿它当去重键（test/m2-40-display.test.ts 守着）。
# 原来与 seq9_reader 撞了同一个名字，从本卡正文里另取一个短语。
name: 像早就知道一样
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:reader'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    你翻开那本书的时候，手先停在了某一页上。
    **那一页你还没看** —— 而你知道上面写着什么。
    你把眼睛移过去，读了一遍。果然。
    合上书的时候你才想起来：这本书你是今天第一次借。
  group: 有人在图书馆翻开一本书，手先停在了某一页上。
daily_limit: 1

options:
  - key: '1'
    label: 再找一本没读过的试试
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又抽了一本，翻开。手停了一下 —— 又停在某一页上。
      **而这一次你没有把眼睛移过去** —— 你把书合上了。
  - key: '2'
    label: 把那本书买下来
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你去柜台付了钱。管书的人看了你一眼。
      **说这本书是别人寄存在这儿的** —— 而寄存人的名字被划掉了。
  - key: '3'
    label: 去查这本书以前是谁借的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你翻了借阅记录。**这本书一次都没有被借出去过** ——
      而卡片上"入库"那一栏的日期，是明天。
