# 原著依据：《诡秘之主》途径「命运之轮」序列 3「混乱行者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分混乱权柄：让既定命运重新变得混乱；命运看守者：在混乱命运里看见并绕过
id: seq3_monster
name: 不再是注定的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:monster'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 3 }
  - { mad: 2 }
texts:
  priv: |
    占卜的结果本来是钉死的 —— 你看了三遍，三遍一样。
    你把手按在那张纸上。
    **再看的时候，纸上是空的。** 不是没字，是结果没了。
    你把纸收起来，放进口袋。
  group: 有人把一张牌翻来覆去看了很久，最后把它烧了。
daily_limit: 1

options:
  - key: '1'
    label: 把纸收好，留着
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你把纸收进口袋。第二天掏出来看。
      **上面还是空的** —— 而纸比昨天软。
  - key: '2'
    label: 再按一次，多按一会儿
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你多按了一会儿。纸开始发烫。
      **而你松手的时候它已经烧了一半** —— 剩下的那半也是空的。
  - key: '3'
    label: 去找那个占卜师
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。她坐在那儿，桌上摆着同一副牌。
      **而她说她不认识你** —— 她连头都没抬。
