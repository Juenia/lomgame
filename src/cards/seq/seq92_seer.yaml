# 原著依据：《诡秘之主》途径「愚者」序列 9「占卜家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：获得灵感，能「看」到被挡住的事物，「听」见微弱的脚步声，从而提前做出判断
id: seq92_seer
name: 被挡住的东西
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:seer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    你在一扇关着的门前站住了。
    **门后面的东西你是「看」到的** —— 不是眼睛，是别的什么。
    你还听见了很轻的脚步，退开了。
    过了一会儿门开了，出来的人看了你一眼。他没想到你在这儿。
  group: 有人在门口站了很久才走开，像是知道里面有人。
daily_limit: 1

options:
  - key: '1'
    label: 站在原处，等他出来
    effects: [ { dig: 4 } ]
    text: |
      你退开半步，没走。门开的时候你们对上了眼。
      他愣了一下 —— 那半秒里，你把他的脸记住了。
  - key: '2'
    label: 先走，把这件事记下来
    effects: [ { dig: 3, dp: 1 } ]
    text: |
      你转身走开，边走边在心里把细节过了一遍：几级台阶、门轴的响声、脚步的轻重。
      灵视给的东西**不写下来就会化掉**。
  - key: '3'
    label: 推门进去
    effects: [ { dig: 6, hp: 2, cor: 2 } ]
    text: |
      你推了门。里面的东西比你在门外「看」到的多得多。
      你退出来的时候手心是湿的，但**你确实看见了**。
