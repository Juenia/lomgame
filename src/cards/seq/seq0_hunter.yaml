# 原著依据：《诡秘之主》途径「红祭司」序列 0「红祭司」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：神国源于征服权柄的更深概念化：将一片土地一处战场彻底征服后，它们就成为红祭司的神国；进入神国的生灵若无庇护会受到压制
id: seq0_hunter
name: 被征服的地方
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:hunter'
  min_seq: 0
  max_seq: 0
effects:
  - { hp: 5 }
  - { dig: 3 }
texts:
  priv: |
    那片战场打了一百年，换过七个主人。
    **那天它被彻底征服了。**
    从那以后进去的人都会想跪下 —— 不管他是谁。
    有人试过不去。他进去了，走不到三分之一就趴下了。
  group: 那片战场现在没有人敢进去。
daily_limit: 1

options:
  - key: '1'
    label: 自己走进去
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你走进去。走到三分之一的时候膝盖软了。
      **而你站住了** —— 站了很久，然后一步一步退了出来。
  - key: '2'
    label: 站在边上看着那片地
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站着看。那片地的颜色比其他地方深。
      **深得像吸过什么** —— 而草在上面长得很齐。
  - key: '3'
    label: 把那种感觉收起来一点
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你伸手收了一点。它在你手里很安静。
      **安静得像已经认了主** —— 而你不知道它的主是谁。
