# 原著依据：《诡秘之主》途径「审判者」序列 6「法官」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：禁止：可用古赫密斯语制定禁止某种行为或非凡能力的规则，强迫范围内所有人遵守
id: seq62_arbiter
name: 禁止
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:arbiter'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    对面抬手要放那个东西。
    「**禁止。**」你说。
    他的手掌空了。他试了第二次，还是空的。
    「现在可以好好说话了，」你说。他脸色很难看。
  group: 那天那场架，有一边从头到尾没用出一个能力。
daily_limit: 1

options:
  - key: '1'
    label: 让他走
    effects: [ { dig: 4 } ]
    text: |
      你让开了。他从你身边过去，肩膀擦到你的袖子。
      **他没有回头** —— 而你知道他记住了你的脸。
  - key: '2'
    label: 问他刚才想放的是什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他摇头。
      **但他看了一眼自己的右手** —— 那一眼比回答有用得多。
  - key: '3'
    label: 再加一句「不许说谎」
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你加了一句。他张嘴，一个字都出不来。
      **而他脸上写满了想说的东西** —— 你看了很久才走。
