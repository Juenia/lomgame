# 原著依据：《诡秘之主》途径「红祭司」序列 7「纵火家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：更能察觉到是否被人跟踪，可更完美地应用本身的反跟踪技巧
id: seq72_hunter
name: 被人跟踪
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:hunter'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { hp: 1 }
texts:
  priv: |
    你回头第二次的时候，他还在报摊前。
    **而报摊老板已经在收摊了。**
    你继续走。走了两条街，你在橱窗的玻璃里又看见了他 ——
    他站在你身后十几步，正低头看一顶帽子。**你把那顶帽子记住了。**
  group: 有人在橱窗前停了一下，一直看着玻璃里身后的影子。
daily_limit: 1

options:
  - key: '1'
    label: 停下来，等他走近
    effects: [ { dig: 7, hp: 2, cor: 2, mad: 2 } ]
    text: |
      你站住了。他走了十几步，然后也停了。
      **你们隔着七八步对看** —— 而他没有再往前走。
  - key: '2'
    label: 把这件事告诉摊位的老板
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你回去跟老板说了。**他往那边看了一眼** —— 说那个人这两天都来，从来不买。
  - key: '3'
    label: 记下那顶帽子的样子
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记住了那顶帽子：灰的，帽檐左边有一道折。
      **第二天你在城另一头看见了一顶一样的** —— 而戴它的人不是他。
