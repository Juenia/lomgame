# 原著依据：《诡秘之主》途径「暴君」序列 3「海王」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：在掌控海域是强大支配者，可掀起四五十米高海啸、支配海洋生物；闪电风暴
id: seq3_sailor
name: 四五十米
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 4 }
  - { mp: 3 }
texts:
  priv: |
    你站在防波堤上，看着那片海。
    **这片海是你的。** 你说不清为什么知道，但你知道。
    你抬手往下一压，远处那道浪就矮了下去。
    底下那些东西安静了。它们刚才还在往岸上挤。
  group: 昨晚的浪比预报的小了很多，渔船都没事。
daily_limit: 1

options:
  - key: '1'
    label: 站着看那片海
    effects: [ { dig: 5 } ]
    text: |
      你站着看。海面很平。
      **平得不像海** —— 像一块铺开的东西。
  - key: '2'
    label: 再压一次，这次远一点
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又压了一次。远处那道浪矮下去了。
      **而更远的地方起了新的** —— 它比刚才那道高，而且不往岸上来。
  - key: '3'
    label: 低头看底下那些东西是什么
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你低头看。水底下有很多影子。
      **它们不往岸上挤了** —— 它们排成了一排，朝同一个方向。
