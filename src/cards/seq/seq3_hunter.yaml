# 原著依据：《诡秘之主》途径「红祭司」序列 3「战争主教」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：火焰提升为纯青色；可在三公里内使用团队成员的非凡能力并互相分享；有心灵沟通
id: seq3_hunter
name: 青色
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:hunter'
  min_seq: 3
  max_seq: 3
effects:
  - { hp: 3 }
  - { dig: 2 }
texts:
  priv: |
    你抬起手，火是**纯青的**，一根杂色都没有。
    「左边，」你心里说。
    你身后三个人同时转向了左边 —— 你一个字都没出声。
    火落在那个位置上，正好。
  group: 那场火只烧了一个角，别的地方一点没碰。
daily_limit: 1

options:
  - key: '1'
    label: 把火收回来
    effects: [ { dig: 5 } ]
    text: |
      你抬手，青色的火回到你手心里，灭了。
      **那三个人还站在原地** —— 他们的眼睛跟着你的手动了。
  - key: '2'
    label: 在心里下第二道命令
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你换了一个方向。他们三个同时转向了右边。
      **而这一次有人皱了一下眉** —— 他自己都不知道为什么。
  - key: '3'
    label: 走近看那个被烧的角
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走过去看。那是个人形的焦痕。
      **面朝下，手向前伸着** —— 像是在够什么东西。
