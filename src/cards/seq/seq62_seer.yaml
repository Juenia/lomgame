# 原著依据：《诡秘之主》途径「愚者」序列 6「无面人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：占卜、格斗和法术能力都有所提升
id: seq62_seer
name: 都提高了
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:seer'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 2 }
  - { hp: 2 }
texts:
  priv: |
    你换了张脸，在城里待了三天。
    第三天有人拦住了你，问了三句话。
    **你答上来了。** 答得很顺，连自己都差点以为是那个人。
    等他走了，你在巷子里把脸换回来。
  group: 有人在城里换了张脸待了三天，没有人认出来。
daily_limit: 1

options:
  - key: '1'
    label: 把这张脸还回去
    effects: [ { dig: 3 } ]
    text: |
      你在没人的巷子里把脸抹平。
      换回来那一下有点疼 —— 像是把一层很薄的东西从骨头上撕下来。
  - key: '2'
    label: 再多用一天，把他的习惯学全
    effects: [ { dig: 6, mad: 2 } ]
    text: |
      第四天你连他咳嗽的节奏都学会了。
      晚上洗脸的时候你愣了半秒才想起该先动哪边 —— **你开始分不清哪部分是演的**。
  - key: '3'
    label: 把他托你办的事记下来
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      那三句话里有一句是试探。你没接，他也没追。
      你把那句原话一字不差地记下来 —— **谜面比对答案值钱**。
