# 原著依据：《诡秘之主》途径「死神」序列 1「苍白皇帝」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：灵之主宰：来源于奴役权柄的特质，无需刻意就极为尊贵；任何具备灵的生物都能压制乃至奴役
id: seq1_corpse_collector
name: 不需要刻意
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 1
  max_seq: 1
effects:
  - { cor: 4 }
  - { hp: 4 }
texts:
  priv: |
    你走在街上，没有看任何人。
    **一条街的人都低下了头。** 他们不知道自己在让路。
    有个东西从天上过去，经过你头顶的时候绕了绕。
    你继续走。你什么都没做。
  group: 那天街上的人都说不知道为什么心里发紧。
daily_limit: 1

options:
  - key: '1'
    label: 停下来，看看那些低头的人
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你站住了。他们也停了一下。
      **然后继续走，谁也不看谁** —— 像是刚才那一下谁也没发觉。
  - key: '2'
    label: 抬头看那个绕过你的东西
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你抬头。它已经出去很远了。
      **而它绕开的那一段，正好是你站的地方** —— 绕了一个很明显的弯。
  - key: '3'
    label: 什么都不做，接着走
    effects: [ { dig: 4 } ]
    text: |
      你接着走。身后那条街慢慢恢复正常。
      **像水面合上** —— 你走了十几步之后，街上就有了说话声。
