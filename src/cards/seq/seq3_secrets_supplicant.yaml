# 原著依据：《诡秘之主》途径「倒吊人」序列 3「三首圣堂」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：两侧肩头各长出一个蒙阴影的头颅（一年轻一老迈），每个都能带走三分之一躯体并通过血肉魔法变完整
id: seq3_secrets_supplicant
name: 肩上长了两个
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 3
  max_seq: 3
effects:
  - { cor: 4 }
  - { hp: 3 }
texts:
  priv: |
    你照镜子的时候，肩上多了两个。
    左边那个很老，右边那个很小，都在阴影里。
    **它们也在看你。**
    你把衣服拉高了些，出门的时候低着头。
  group: 有人这几天一直围着围巾，大热天也围。
daily_limit: 1

options:
  - key: '1'
    label: 把衣服拉高，出门
    effects: [ { dig: 5 } ]
    text: |
      你把衣服拉高，低着头出了门。
      **街上没有人看你** —— 而你的肩上那两个一直在动。
  - key: '2'
    label: 回头看镜子里的它们
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你回头。它们还在。
      **而左边那个在对你摇头** —— 摇得很慢。
  - key: '3'
    label: 问它们是谁
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你问了。右边那个答了。
      **而它的声音是你小时候的声音** —— 你已经很多年没听过了。
