# 原著依据：《诡秘之主》途径「死神」序列 9「收尸人」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：具备一定的尸体特质，整个人显得颇为阴森，体温较低；天然具备灵视，能直接看见部分恶灵
id: seq9_corpse_collector
name: 他终于认出我了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 9
  max_seq: 9
effects:
  - { cor: 1 }
  - { dig: 2 }
texts:
  priv: |
    你在停尸房等了很久，看守一直没理你。
    他从你身边过了三次，第三次才停下，仔细看了看。
    「哦，」他说，「你是活的。」
    他说这话的时候没有惊讶 —— 只是确认了一下。
  group: 停尸房的灯亮了一夜，看守说他一直在跟人说话。
daily_limit: 1

options:
  - key: '1'
    label: 问他刚才为什么不理你
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说他一直在跟人说话。
      **而他说的是「你们」** —— 不是「你」。
  - key: '2'
    label: 自己在停尸房里走一圈
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你走了一圈。有七张床 —— 六张有人。
      **而看守只点了五张** —— 你数了两遍。
  - key: '3'
    label: 什么都不问，转身走
    effects: [ { dig: 5 } ]
    text: |
      你走了。走到门口的时候听见他在里面又开口了。
      **而他说的是「他又走了」** —— 用的是「又」。
