# 原著依据：《诡秘之主》途径「黑暗」序列 0「黑暗」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：隐秘权柄：能隐藏各方面的痕迹，误导窥探与占卜，能将任何事物变得隐秘或解除隐秘；能将隐秘之地化为隐秘世界
id: seq0_sleepless
name: 隐秘
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:sleepless'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 6 }
  - { hp: 4 }
texts:
  priv: |
    占卜师算了三次。
    **三次都是空白。** 不是算不出来，是那件事**不存在于被算的范围里**。
    他把牌收起来，说今天不做了。
    那件事发生过。你现在就站在它发生的地方。
  group: 那件事查了很久，一直查不到。
daily_limit: 1

options:
  - key: '1'
    label: 站在那个地方，什么都不做
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你站着。牌还是空白。
      **而占卜师收牌的时候手在抖** —— 他一直没有抬头。
  - key: '2'
    label: 走过去问他算的是什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他说是一件很久以前的事。
      **而他连那件事是什么都说不清** —— 他只记得有人在找他算。
  - key: '3'
    label: 让他再算一次
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你让他再算。他算了。
      **第三次的时候牌自己烧了起来** —— 而他一直在看着那团火，没有躲。
