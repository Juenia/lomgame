# 原著依据：《诡秘之主》途径「被缚者」序列 6「活尸」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：身体可以像钢铁一样坚硬，能硬挡子弹；左轮抵住脑袋发射也最多眩晕
id: seq6_prisoner
name: 枪响了五次
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 5 }
  - { mad: 1 }
texts:
  priv: |
    枪响了五次。
    **你还站着。**
    第六次之前他扔了枪跑了。
    你低头看了看衣服上的洞 —— 五个，都在同一个位置。皮肤上有五个白点。
  group: 巷子里响了五枪，第二天只有一个人走出了那条巷子。
daily_limit: 1

options:
  - key: '1'
    label: 低头看那五个白点
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你看了看。五个白点排成一条直线。
      **而你身上连淤青都没有** —— 你按了按，一点都不疼。
  - key: '2'
    label: 追上去找他
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你追了。他在两条街外的墙根坐着。
      **手里还捏着空枪** —— 而他看见你的时候没有跑。
  - key: '3'
    label: 把衣服脱下来看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你脱下来看。五个洞在同样的位置。
      **而里衬一点没破** —— 洞只在外层。
