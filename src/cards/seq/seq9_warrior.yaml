# 原著依据：《诡秘之主》途径「黄昏巨人」序列 9「战士」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：超越常人的力量，超越常人的敏捷，各种武器防具精通，不存在无法使用的武器，各种格斗术掌握
id: seq9_warrior
name: 手自己知道
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:warrior'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    架子上那件兵器你从没见过 —— 形状古怪，重心也不对。
    有人递过来，你接住。
    **手自己知道该怎么握。** 你挥了一下，破风声比你想的干净。
    递东西的人往后退了半步。
  group: 有人接住了一件他从没见过的兵器，挥得很稳。
daily_limit: 1

options:
  - key: '1'
    label: 放下它
    effects: [ { dig: 3 } ]
    text: |
      你把它搁回架子，手从柄上松开的时候有一点舍不得。
  - key: '2'
    label: 换个握法再挥一次
    effects: [ { dig: 5, hp: 1 } ]
    text: |
      你换了个握法。**破风声比第一次还干净。**
      递东西的人这次没退 —— 他往旁边让了让，给你腾地方。
  - key: '3'
    label: 拿它劈点真东西
    effects: [ { dig: 7, hp: 2, mad: 2 } ]
    text: |
      院子里那截木桩一分为二，断面很平。
      你收手的时候才知道自己刚才用了多大力 —— **刀口比你想的深一寸**。
