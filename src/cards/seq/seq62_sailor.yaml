# 原著依据：《诡秘之主》途径「暴君」序列 6「风眷者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：被风眷顾，能自体内刮出狂风使出风压拍击，可在身体部位附着高速旋转的狂风
id: seq62_sailor
name: 风压拍击
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:sailor'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 2 }
  - { mp: 2 }
texts:
  priv: |
    你抬手扇了一下。
    **那不是巴掌。** 隔着一米，那个人的脸偏了过去。
    他摸着自己的脸，看你的手。
    你把手放下。袖子破了一道口子。
  group: 有人隔着一米被人扇了一巴掌，动手的人没碰到他。
daily_limit: 1

options:
  - key: '1'
    label: 把袖子放下来
    effects: [ { dig: 5 } ]
    text: |
      你把袖子放下来，转身走了。
      **身后那个人还站在那儿** —— 手一直在摸自己的脸。
  - key: '2'
    label: 低头看看那道口子
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你低头看。口子是斜的。
      **而你的手刚才只是往侧面扇了一下** —— 斜的方向和它一样。
  - key: '3'
    label: 再扇一次，这次对着另一边
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又扇了一次。那个人被扇到了墙上。
      **而他还是没看见你动手** —— 他一直在看自己的手。
