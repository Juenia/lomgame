# 原著依据：《诡秘之主》途径「暴君」序列 5「海洋歌者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：歌唱：能用歌声影响目标，干扰敌人的灵体或安抚人心
id: seq5_sailor
name: 他们放下了手里的东西
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:sailor'
  min_seq: 5
  max_seq: 5
effects:
  - { mp: 2 }
  - { dig: 2 }
texts:
  priv: |
    酒馆里已经打起来了，酒瓶子摔了一地。
    你站在门口唱了一句。
    很短，就一句 —— 调子也不高。
    **所有人慢慢放下了手里的东西。** 有几个还坐了回去。
  group: 那家酒馆昨天打到一半忽然安静了。
daily_limit: 1

options:
  - key: '1'
    label: 站在门口把那句唱完
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你唱完了。酒馆里安静了一会儿。
      **然后有人坐下** —— 也有人往外走，走得很慢。
  - key: '2'
    label: 再唱一句
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又唱了一句。这次有人开始哭。
      **而他自己都不知道为什么** —— 他只是抹了抹脸。
  - key: '3'
    label: 走进去，坐到吧台边
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你走进去坐下。老板给你倒了一杯。
      **他一杯都没收钱** —— 而那杯酒是店里最贵的。
