# 原著依据：《诡秘之主》途径「命运之轮」序列 9「怪物」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：常会陷入某种恍惚的状态，呢喃起别人听不懂的话语，以至于被当成真正的怪物
id: seq92_monster
name: 说了别人听不懂的话
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:monster'
  min_seq: 9
  max_seq: 9
effects:
  - { mad: 3 }
  - { dig: 2 }
texts:
  priv: |
    你在长桌边坐着，忽然晃了一下神。
    回过神的时候，一桌人都在看你。
    **你刚才说了一段话** —— 你自己也听见了，但听不懂。
    有人小声说了一句什么。你没有追问。
  group: 有人吃饭吃到一半说了句听不懂的话，然后就正常了。
daily_limit: 1

options:
  - key: '1'
    label: 问旁边的人自己刚才说了什么
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你问了。他把杯子放下，说没听清。
      **而他刚才明明在看你** —— 一直看，看到你说完。
  - key: '2'
    label: 把那一段话记下来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你在纸上把音记下来。写出来的不是字。
      **是一段像小路一样的线** —— 绕了三圈，最后回到起点。
  - key: '3'
    label: 再晃一次神
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你试了一次。这次桌上的人全站起来了。
      **而你自己什么都没听见** —— 你只看见他们的脸。
