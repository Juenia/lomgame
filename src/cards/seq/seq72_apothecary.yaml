# 原著依据：《诡秘之主》途径「月亮」序列 7「吸血鬼」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：获得出色的体质，速度和敏捷超强，自愈能力超强
id: seq72_apothecary
name: 肠子塞回去
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:apothecary'
  min_seq: 7
  max_seq: 7
effects:
  - { hp: 4 }
texts:
  priv: |
    伤口很深，血把衣服湿透了。
    你按着它走回住处，路上没有跑。
    **回到屋里的时候已经合了一半。**
    你把衣服脱下来洗了。血洗得掉，衣服上的口子还在。
  group: 那个人昨天受了很重的伤，今天照常上工。
daily_limit: 1

options:
  - key: '1'
    label: 把衣服洗了，口子补上
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      血洗得掉，口子补得上。
      **第二天你穿着那件衣服出门** —— 补的那一块在里侧，没人看得出。
  - key: '2'
    label: 顺着来路去查是谁下的手
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你顺着来路往回走。巷子口有个卖报的小孩。
      **他看见了整个过程** —— 包括你按着伤口走回来时没有跑。
  - key: '3'
    label: 按住伤口，让它合得再快一点
    effects: [ { dig: 7, hp: 4, mad: 2 } ]
    text: |
      你催了一下。合得太快了。
      **里面有一样东西没对好位置** —— 你花了三天才把它揉回去。
