# 地点专属（M2.87）。地点：「内海沿岸」（mediterranean_shore，危险度 3）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_mediterranean_shore
name: 漂上来的椅子
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:内海沿岸'
effects:
  - { dig: 2 }
  - { cor: 2 }
texts:
  priv: |
    早上沙滩上多了一把椅子。
    木头的，很旧，但没散。
    **上面是干的。** 一点都不湿。
    你看了看海。海很平。
  group: 内海沿岸昨天冲上来一把干椅子，没有人认领。
daily_limit: 1

options:
  - key: '1'
    label: 坐上去
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你坐下了。椅子很稳。
      **而坐着的时候** —— 你觉得海比刚才近了一点。
  - key: '2'
    label: 把椅子翻过来看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你翻过来看。椅底刻着两个字。
      **两个字都是人名** —— 而那不是一个人的名字。
  - key: '3'
    label: 顺着海水方向看看
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你朝海那边看。海很平。
      **而平的地方有一条线** —— 从沙滩一直伸到看不见的地方。
