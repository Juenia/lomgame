# 原著依据：《诡秘之主》途径「母亲」序列 8「医师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：治疗：通过灵视判断病情；能从外在表现里看出潜藏的疾病
id: seq8_mother
name: 在肝上
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
  - { dig: 1 }
texts:
  priv: |
    你看了那个人一眼。
    他气色很好，说话中气足，正在跟人敬酒。
    「你肝上有东西，」你说。他笑了一下。
    **半个月后他来找你，脸色和那天完全不一样。**
  group: 有人在酒席上说了一句不吉利的话，被笑了。
daily_limit: 1

options:
  - key: '1'
    label: 把话收回来，陪他喝一杯
    effects: [ { dig: 4 } ]
    text: |
      你端起杯子跟他碰了一下。
      **他喝得很痛快** —— 你看着他的杯子，没再说话。
  - key: '2'
    label: 说清楚在哪、有多大
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你说了位置和大小。他还是在笑。
      **但旁边有人不笑了** —— 那个人放下杯子，往你这边看了很久。
  - key: '3'
    label: 什么都不做，等他来找
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      半个月后他来了，脸色和那天完全不一样。
      他站在门口问你：「**你那天是怎么看出来的？**」
