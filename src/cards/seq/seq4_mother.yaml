# 原著依据：《诡秘之主》途径「母亲」序列 4「古代炼金师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能驱使智慧不高的超凡生物并降低其疯狂；能以残缺的灵与材料完成生命炼成，制造人偶与魔像
id: seq4_mother
name: 它自己坐起来了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { hp: 2 }
texts:
  priv: |
    你把手里的东西按进那具泥胎的胸口。
    屋子里安静了很久。
    **然后它自己坐起来了。**
    它没有看你，只是坐在那里。你说了一句什么，它转过头来了。
  group: 那间工坊里多了一个不说话的人。
daily_limit: 1

options:
  - key: '1'
    label: 跟它说一句话
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你说了一句。它转过头来。
      **它没有眼睛，但你确定它在看你** —— 而且它在等你把话说完。
  - key: '2'
    label: 让它站起来走两步
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      它站起来了。走第三步的时候它停了一下。
      **像是在等你说下一步** —— 而你没说，它就那么站着。
  - key: '3'
    label: 问它：你记得什么
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      它没有回答。
      但它把手按在了自己胸口 —— **那里正是你刚才按下去的地方**。
