# 地点专属（M2.87）。地点：「咸鱼市场」（fish_market，危险度 1）
# 本卡由该地点的设定与名字意象推演出一个具体场景（不是引述设定）。
# 只有站在这个地点的人抽得到 —— 判据是 `cond: location:<地点名>`（**不是 id**，见 cards/loader.ts）。
id: loc_fish_market
name: 今天多了三筐
trigger:
  type: daily
  weight: 7
  cond:
    - 'location:咸鱼市场'
effects:
  - { dig: 2 }
  - { hp: 1 }
texts:
  priv: |
    咸鱼市场永远是湿的。
    今天有个摊子多了三筐鱼，摊主自己也在看。
    **「不是我进的，」** 他说，「开门就在这儿了。」
    你蹲下来看了一眼。那些鱼的眼睛很新。
  group: 咸鱼市场那个摊子昨天多了三筐鱼，摊主说自己没进货。
daily_limit: 1

options:
  - key: '1'
    label: 翻一翻那三筐鱼
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你翻了翻。鱼很新鲜。
      **而最底下那一条是活的** —— 它一直在动，没有人发现。
  - key: '2'
    label: 问摊主昨天关门时什么样
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他说他锁了门，还数了筐。
      **而他说他数是七筐** —— 现在是十筐。
  - key: '3'
    label: 买两条带回去
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你买了两条。摊主收钱的时候没抬头。
      **回到家再看** —— 那两条鱼的眼睛变了，比刚才旧。
