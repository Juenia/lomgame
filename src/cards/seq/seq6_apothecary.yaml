# 原著依据：《诡秘之主》途径「月亮」序列 6「魔药教授」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：可调配出带有超凡效果的各种药剂和香水，能对付绝症
id: seq6_apothecary
name: 站起来的老人
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    你调的那剂药让一个躺了半年的老人站了起来。
    他家里人在门口跪了下来，你侧身让开。
    「要多少钱都行，」他儿子说。
    你摇了摇头 —— **因为你知道这剂药是用什么换的。**
  group: 那户人家躺了半年的老人，昨天自己走出来了。
daily_limit: 1

options:
  - key: '1'
    label: 把方子留下，不收钱
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把方子写在纸上，压在茶碗底下就走了。
      **他儿子追出来的时候你已经拐过街角** —— 你不想让他看见你走得多快。
  - key: '2'
    label: 告诉他们这剂药是用什么换的
    effects: [ { dig: 6, cor: 2 } ]
    text: |
      你说了。屋里安静下来。
      **老人的手在被子底下攥紧了** —— 他大概早就知道。
  - key: '3'
    label: 再调一剂，看看能不能不换
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你改了三味，试了五次。新的一剂也能让人站起来。
      **而喝下去的人第三天开始记不住事** —— 记不住自己的名字。
