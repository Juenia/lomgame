# 原著依据：《诡秘之主》途径「白塔」序列 9「阅读者」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：如果大量阅读书籍，会有丰厚的知识储备
id: seq93_reader
name: 看过的都在
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:reader'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 4 }
texts:
  priv: |
    有人问起一件很久以前的事。
    你想了想，从书架上抽出一本，翻到中间。
    **那一页上就是答案。**
    你也没有找过 —— 你就是知道它在那儿。
  group: 那个人找书从来不用找，直接抽。
daily_limit: 1

options:
  - key: '1'
    label: 让他自己找找看
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他翻了半天，没找到。
      **而你还站在原来的位置** —— 一动没动，连手都插在口袋里。
  - key: '2'
    label: 再抽一本，随便翻一页
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又抽了一本。翻到的那一页上，正好写着他刚才问的另一件事。
      **而那一件事他还没问出口** —— 他只是想了一下。
  - key: '3'
    label: 把那一页撕下来
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你撕了下来，夹进自己的本子。
      **第二天你从同一本书里又找到了那一页** —— 页码一模一样。
