# 原著依据：《诡秘之主》途径「月亮」序列 2「创生者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌握创造之力（部分生命权柄衍化），让周围生命感受到万物滋长、新生降临的喜悦，可延长周围生命
id: seq2_apothecary
name: 万物在长
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:apothecary'
  min_seq: 2
  max_seq: 2
effects:
  - { hp: 5 }
  - { dig: 2 }
texts:
  priv: |
    你走进那片荒地的时候什么都没做。
    **脚下的草开始长。** 不是慢慢长，是能看见地长。
    鸟落在你肩上，没有怕你。
    你在那里站了一刻钟。走的时候那块地绿了。
  group: 那片荒地一夜之间绿了，附近的人说是神迹。
daily_limit: 1

options:
  - key: '1'
    label: 在这儿多站一刻钟
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你多站了一刻钟。草长到了膝盖。
      **你走的时候它在往回缩** —— 像是舍不得你走。
  - key: '2'
    label: 摘一片叶子带走
    effects: [ { dig: 6, cor: 1 } ]
    text: |
      你摘了一片。走出荒地之后它还在长。
      **你把它按进书里才停** —— 而那一页现在一直是绿的。
  - key: '3'
    label: 叫几个人来看，告诉他们这不是神迹
    effects: [ { dig: 7, dp: 1 } ]
    text: |
      你叫了几个人来。他们说「这就是神迹」。
      **你说服不了他们** —— 而你也不想说服，因为你自己也说不清那是什么。
