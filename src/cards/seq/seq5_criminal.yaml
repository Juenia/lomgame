# 原著依据：《诡秘之主》途径「深渊」序列 5「欲望使徒」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：掌控欲望：利用和操纵每个人的情绪和欲望，诱使堕落
id: seq5_criminal
name: 他自己交出来的
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:criminal'
  min_seq: 5
  max_seq: 5
effects:
  - { cor: 2 }
  - { dig: 2 }
texts:
  priv: |
    你什么都没问。
    你只是在他面前坐了一会儿 —— 想着他很想要的那样东西。
    **他自己把东西交了出来**，交完还看着你，像在等一句夸奖。
    你收下了，什么也没说。
  group: 有人在街角把东西给了一个陌生人，事后想不起为什么。
daily_limit: 1

options:
  - key: '1'
    label: 收下，什么都不说
    effects: [ { dig: 5 } ]
    text: |
      你收下了。他还在等一句夸奖。
      **而你走了** —— 走出去十几步，他还站在那儿。
  - key: '2'
    label: 问他为什么给你
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他愣了很久。然后说：「你刚才是不是想要这个？」
      **他自己也吓了一跳** —— 说完就往后退了半步。
  - key: '3'
    label: 让他把剩下的也交出来
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又想了一下。他把口袋里的东西全掏出来了。
      **包括那件他藏了十年的** —— 交出来的时候他的手在抖。
