# 事件卡链（M2.87）—— **后续卡**：只有触发过前置卡的人才抽得到。
# 前置：lost_006 身边的人（设 flag `marked_by_party`）
# 判据：`cond: flag:marked_by_party`。
#
# ⚠️ 这一类此前**一条都没有**：全库 29 张卡设了 flag，而要求 flag 的卡是 **0 张** ——
#    flag 设了就再没有人读，等于写了一半的链。这张是它的后半段。
id: chain_marked_by_party
name: 其中有一个
trigger:
  type: daily
  weight: 9
  cond:
    - 'flag:marked_by_party'
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    你们一共五个人。
    今天你数的时候发现**有一个人的影子比别人短一点**。
    你没说。你只是换了个位子，坐到他旁边。
    他看了你一眼，笑了一下。
  group: 那几个人最近总在一起，但有人觉得不太对。
daily_limit: 1
