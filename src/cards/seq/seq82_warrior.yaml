# 原著依据：《诡秘之主》途径「黄昏巨人」序列 8「格斗家」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：比其他任何一个序列都擅长近距离的战斗，纯粹靠身体就能让一些针对他的非凡能力效果减弱
id: seq82_warrior
name: 近身
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:warrior'
  min_seq: 8
  max_seq: 8
effects:
  - { hp: 3 }
texts:
  priv: |
    对面那个人抬手，掌心有光。
    你没有退 —— **你往前走了一步。**
    进了三步之后，那道光暗下去了。
    「这一招离得近就不好使了，」你说。他脸色变了。
  group: 那个会用光的人昨天输给了一个只会走近的人。
daily_limit: 1

options:
  - key: '1'
    label: 再往前走一步
    effects: [ { dig: 5, hp: 2 } ]
    text: |
      又近了一步。他掌心的光彻底没了 ——
      **他开始退。** 你跟着又走了半步，他就退了两步。
  - key: '2'
    label: 停下来，告诉他为什么
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      「这一招离得近就不好使了。」
      **他脸色变了** —— 变的不是被说中的那一下，是「你怎么知道」。
  - key: '3'
    label: 站着不动，让他打一下
    effects: [ { dig: 6, hp: 3, mad: 1 } ]
    text: |
      那一下很轻。轻到你差点以为他没打中。
      你低头看了看胸口 —— **衣服破了，皮没破**。
