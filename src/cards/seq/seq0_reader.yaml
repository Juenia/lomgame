# 原著依据：《诡秘之主》途径「白塔」序列 0「白塔」（真神）
# ⚠️ 序列 0 是**神**，玩家抽不到（晋升链路到不了这里）。这些卡是「世界里有神」这件事的落点：
#    写的是**神迹的目击者**，不是神本身 —— 因为玩家永远只能是那个站在街上抬头看的人。
# 本卡由该序列的原作权柄描述推演出一个具体场景。
# 权柄原文：全知权柄：对万事万物全知，不受灵界影响；可模仿任何一种能力，威力达原版甚至超过（不含权柄与象征）
id: seq0_reader
name: 全知即全能
trigger:
  type: daily
  weight: 5
  cond:
    - 'pathway:reader'
  min_seq: 0
  max_seq: 0
effects:
  - { dig: 7 }
  - { mad: 3 }
texts:
  priv: |
    你看了一眼那座塔。
    **你知道它里面有什么、什么时候塌、塌的时候会压死谁。**
    你还知道站在你旁边那个人小时候偷过什么。
    你什么都没说。你知道的太多了，说不完。
  group: 那座白塔上的人从来不说话。
daily_limit: 1

options:
  - key: '1'
    label: 把知道的都写下来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你写了一夜。写到天亮的时候纸用完了。
      **而你才写到第三件事** —— 后面还有多少件你不知道。
  - key: '2'
    label: 什么都不说，走开
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你走了。身后那座塔还在。
      **而你知道它还有十一年** —— 十一年后塌的时候会压死两个人。
  - key: '3'
    label: 看一眼身边那个人
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你看了他一眼。他小时候偷的是一块糖。
      **而他现在已经能买下整间铺子** —— 他每年还会去那家铺子买一次糖。
