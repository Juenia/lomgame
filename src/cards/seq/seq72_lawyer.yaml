# 原著依据：《诡秘之主》途径「黑皇帝」序列 7「贿赂者」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：狂妄：通过给予贿赂让目标骄傲、狂妄、心智降低，出现错判
id: seq72_lawyer
name: 让他狂
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:lawyer'
  min_seq: 7
  max_seq: 7
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    你给了他一枚银币，说了一句恭维的话。
    他收下了，笑得很大声。
    **接下来半个钟头他一直在说自己的事。** 越说越离谱。
    他把自己藏了三年的事说出来了。
  group: 那个人昨天喝多了，什么都往外说。
daily_limit: 1

options:
  - key: '1'
    label: 把他说的话都记下来
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记住了三件。其中一件是他在城外埋了东西。
      **而他刚才说得眉飞色舞** —— 像是终于有人愿意听。
  - key: '2'
    label: 再夸他一句
    effects: [ { dig: 7, cor: 3, mad: 2 } ]
    text: |
      你又夸了一句。他一直说到蜡烛烧完。
      **说到最后他自己都不记得说了什么** —— 而你全记得。
  - key: '3'
    label: 起身离开
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你起身走了。他还在说。
      **对着空椅子说了半句才停** —— 然后他笑了一下，把杯子干了。
