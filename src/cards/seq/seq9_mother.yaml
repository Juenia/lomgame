# 原著依据：《诡秘之主》途径「母亲」序列 9「耕种者」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：力气变得很大；能通过观察云朵、风等自然现象预测之后一段时间的天气；擅于分辨种子
id: seq9_mother
name: 明天下午会下雨
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:mother'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你在地头直起腰，抬头看了一会儿云。
    「明天下午有雨，」你跟旁边的人说。天很晴。
    他笑了一下，没接话。
    **第二天下午三点，雨来了，正好落在那块地上。**
  group: 有人说明天有雨的时候，天还晴着。
daily_limit: 1

options:
  - key: '1'
    label: 不再解释
    effects: [ { dig: 4 } ]
    text: |
      你扛起锄头接着干活。
      **他在旁边站了一会儿** —— 第二天下午下雨的时候，他想起你说过的话。
  - key: '2'
    label: 第二天去那块地等着
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你站在地头等。三点整，雨来了。
      **正好落在那块地上** —— 一步都没多，一步都没少。
  - key: '3'
    label: 教他怎么自己看云
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你说了一遍，他没懂。第二遍他懂了。
      第三遍的时候 —— **他先你一步说出了「明天有雨」**。
