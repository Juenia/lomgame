# 原著依据：《诡秘之主》途径「死神」序列 6「死灵导师」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能自行招募信使，获得某些灵界生物的帮助
id: seq62_corpse_collector
name: 信使
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:corpse_collector'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
  - { cor: 1 }
texts:
  priv: |
    你在十字路口放了三样东西，然后走了。
    第二天早上，其中一样不见了。
    **桌上多了一张纸条** —— 上面没有字，但你知道那是什么意思。
    你把纸条烧了。
  group: 有人在十字路口放东西，第二天就没了。
daily_limit: 1

options:
  - key: '1'
    label: 照纸条的意思办
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你按那个意思做了。第二天桌上又多了一张。
      **这次有字，两个字** —— 而这两个字你在一本旧书上见过。
  - key: '2'
    label: 再放一次，这次放三样
    effects: [ { dig: 7, cor: 2, mad: 2 } ]
    text: |
      你放了。第二天三样都不见了。
      **而桌上多了一张纸条和一个很小的脚印** —— 脚印只有两指宽。
  - key: '3'
    label: 烧掉纸条，什么都不做
    effects: [ { dig: 5 } ]
    text: |
      你把纸条烧了，灰冲进下水道。
      **第二天桌上没有再出现东西** —— 而你一直觉得它在等你回话。
