# 原著依据：《诡秘之主》途径「错误」序列 4「寄生者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：身体部分虫化；寄生：寄生于他人体内，借助宿主隐藏自身、延长生命、恢复伤势
id: seq4_error
name: 他还在里面
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:error'
  min_seq: 4
  max_seq: 4
effects:
  - { cor: 3 }
  - { hp: 3 }
texts:
  priv: |
    你在他身体里住了十一天。
    他的作息你知道，他的秘密你也知道 —— 包括他没跟任何人说过的那一件。
    第十二天你出来了。他在床上躺着，睡着，没有醒。
    **你替他把被子盖好了。**
  group: 那个人病了十一天，醒来之后什么都不记得。
daily_limit: 1

options:
  - key: '1'
    label: 替他盖好被子，走
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把被角掖好，退出去关上门。
      **他在里面睡着** —— 呼吸很匀，像是这十一天什么都没发生。
  - key: '2'
    label: 翻一翻他的东西
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你翻了抽屉。里面有一封信。
      **收信人写着你的名字** —— 而他从来没给过你，也从没提过。
  - key: '3'
    label: 再住进去两天
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你又进去了。这次他醒了。
      **而他看见的是自己站在床边** —— 他喊了一声，然后就不喊了。
