# 原著依据：《诡秘之主》途径「倒吊人」序列 9「秘祈人」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：灵感获得极大提升，能够察觉到某些神秘恐怖的存在；或多或少都会出现认知、观点上的扭曲
id: seq9_secrets_supplicant
name: 它回应了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:secrets_supplicant'
  min_seq: 9
  max_seq: 9
effects:
  - { cor: 2 }
  - { mad: 2 }
texts:
  priv: |
    你在没人的地方做了那个仪式 —— 很简陋，只是念了几句话。
    念完之后，有一小会儿什么都没有。
    然后有东西回应了。**很轻，但你确定那是回应，不是回声。**
    你没有再念第二遍。心里有个声音说：它已经听过一次了。
  group: 那天晚上之后，那个人再也没有做过仪式。
daily_limit: 1

options:
  - key: '1'
    label: 不再念第二遍
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你没念。那个回应之后没有再出现。
      **而你知道它在等** —— 等得很有耐心。
  - key: '2'
    label: 把仪式用的东西收好
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你收好了。其中一样不见了。
      **而屋里没有别人** —— 门窗都是关的。
  - key: '3'
    label: 再念一遍，这次念完
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又念了一遍，念完了。这次回应来得很快。
      **快到你还没闭眼** —— 而它是从屋里回应的。
