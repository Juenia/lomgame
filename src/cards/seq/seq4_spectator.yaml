# 原著依据：《诡秘之主》途径「空想家」序列 4「操纵师」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：操纵（意识操纵）：让心智体进入别人的心灵岛屿，深层次催眠，直接篡改潜意识
id: seq4_spectator
name: 他忽然改口了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 4
  max_seq: 4
effects:
  - { dig: 3 }
  - { cor: 2 }
texts:
  priv: |
    他在证人席上说了一半，忽然停了。
    「不，」他说，「**我刚才记错了。**」
    然后他把刚才那段话反过来说了一遍 —— 完全相反。
    你在旁听席上坐着，看着自己的手。
  group: 那场听证到一半，证人忽然改口了。
daily_limit: 1

options:
  - key: '1'
    label: 坐着听他说完
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你听完了。他反过来说的那一遍更顺。
      **顺到法官都信了** —— 而书记员记了满满两页。
  - key: '2'
    label: 在旁听席上再动一次
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你又动了一次。这次他连自己是来做什么的都忘了。
      **而他一直在看自己的手** —— 像是在找什么。
  - key: '3'
    label: 散场之后跟他走一段
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你跟他走了一段。他一路上都在自言自语。
      **说的还是那两句相反的话** —— 而他分不出哪句是自己说的。
