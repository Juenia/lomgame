# 原著依据：《诡秘之主》途径「死神」序列 9「收尸人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：从这个阶段开始，本途径的非凡者会越来越畏惧阳光和净化
id: seq92_corpse_collector
name: 越来越怕光
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:corpse_collector'
  min_seq: 9
  max_seq: 9
effects:
  - { cor: 2 }
  - { hp: -2 }
texts:
  priv: |
    正午的街上很亮，亮得刺眼。
    你贴着墙根走，走得很慢。
    **阳光照到的地方你不敢踩。** 你自己也觉得这很荒唐。
    走到阴影里之后，你才发现自己一直在屏气。
  group: 那个人大白天一直贴着墙根走。
daily_limit: 1

options:
  - key: '1'
    label: 站在阴影里把气喘匀
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你扶着墙喘。喘匀之后你发现自己在数影子有几个。
      **你数出了两个** —— 而街上只有你一个人。
  - key: '2'
    label: 逼自己走到阳光底下
    effects: [ { dig: 7, hp: 3, mad: 3 } ]
    text: |
      你走进阳光里。身上像被针扎。
      **而你站住了** —— 站了十几秒，直到有人在旁边看你。
  - key: '3'
    label: 回家把窗帘全拉上
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你拉上所有的窗帘。屋里暗下来。
      **而你觉得这很舒服** —— 那才是真正让人怕的地方。
