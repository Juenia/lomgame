# 原著依据：《诡秘之主》途径「白塔」序列 6「博学者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：能辨识、看清、记住和模仿见过的能力；通过学习分析原理进行模仿，没有使用次数限制
id: seq6_reader
name: 第四遍
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 6
  max_seq: 6
effects:
  - { dig: 3 }
texts:
  priv: |
    你看他做了三遍。
    第一遍看结果，第二遍看过程，第三遍看的是他手指动的顺序。
    **第四遍你自己做出来了。**
    他停下来看着你，你很自然地把手放下了。
  group: 有人只看别人做了几遍，就自己做出来了。
daily_limit: 1

options:
  - key: '1'
    label: 把手放下，装作没做什么
    effects: [ { dig: 5 } ]
    text: |
      你很自然地把手放下了。他看了你一会儿。
      **然后接着做他自己的事** —— 只是比刚才慢。
  - key: '2'
    label: 再看他做一遍
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      他又做了一遍。这次你看的是他的呼吸。
      **而他在第三息的时候顿了一下** —— 那一下他自己大概都没发觉。
  - key: '3'
    label: 把刚才那一下再做一次
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又做了一遍，这次慢一点。他看完一句话没说。
      **只是把自己的手背到了身后** —— 而那个动作他做了很多年。
