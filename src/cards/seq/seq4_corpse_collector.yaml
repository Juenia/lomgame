# 原著依据：《诡秘之主》途径「死神」序列 4「不死者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：寿命漫长，但每隔六十年死一次、复活一次，并遗忘掉过去绝大部分记忆
id: seq4_corpse_collector
name: 第六十一年
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:corpse_collector'
  min_seq: 4
  max_seq: 4
effects:
  - { hp: 4 }
  - { mad: 3 }
texts:
  priv: |
    你记得那个日子 —— 算下来是第六十一年。
    醒来的时候你躺在一间不认识的屋子里，桌上放着一本笔记。
    翻开第一页是你的字：「**醒来先看这个。你叫——**」
    后面那一行被水浸模糊了。
  group: 那栋房子里住的人换过好几茬，但笔记一直是同一本。
daily_limit: 1

options:
  - key: '1'
    label: 把那页模糊的字对着光看
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你对着灯看了很久。能认出两个字。
      **一个姓，一个「不」** —— 剩下的全化开了。
  - key: '2'
    label: 接着往下翻
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      后面几十页都是同一个人的字。
      **而笔迹越来越像你的** —— 到第三十页的时候你已经分不出是不是自己写的。
  - key: '3'
    label: 直接翻到最后一页
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      最后一页只有一行字：
      「**这一次别写名字。**」—— 墨是新的。
