# 原著依据：《诡秘之主》途径「错误」序列 6「盗火人」（第 2 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：额外的体质、力量和速度增强；对精神污染的抗性增强
id: seq62_error
name: 没被污染
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:error'
  min_seq: 6
  max_seq: 6
effects:
  - { hp: 2 }
  - { cor: -2 }
texts:
  priv: |
    那东西在你面前炸开了。
    黑的，有味道。旁边的人抱着头蹲下去。
    **你什么都没感觉到。**
    你站在原地，等那股东西散完。
  group: 那间屋子里的人昨天全病了，只有一个没事。
daily_limit: 1

options:
  - key: '1'
    label: 站在原地，等它散完
    effects: [ { dig: 5 } ]
    text: |
      你站着等。那股黑的慢慢淡了，散了。
      **而你什么都没感觉到** —— 这才是最让你在意的那件事。
  - key: '2'
    label: 看看蹲下去的人
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你蹲下来看。他们抱着头，指缝里在渗血。
      **而你刚才什么都没感觉到** —— 你连味道都没闻到。
  - key: '3'
    label: 把那股东西收一点起来
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你收了一点。它在瓶子里是活的。
      **而你拿着瓶子的时候手心是凉的** —— 一直凉到胳膊肘。
