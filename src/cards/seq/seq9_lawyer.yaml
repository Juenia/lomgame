# 原著依据：《诡秘之主》途径「黑皇帝」序列 9「律师」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：拥有非常出色的口才和思辨逻辑，并能于一定程度上扭曲或引导目标的思维
id: seq9_lawyer
name: 他记错了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:lawyer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 2 }
  - { cor: 1 }
texts:
  priv: |
    你只说了三句话。
    对面那个人的表情慢慢变了 —— 他开始怀疑自己刚才是不是记错了。
    他没有再争，握着杯子坐了下去。
    你也没有再说什么。**但你清楚刚才那三句话里，有一句是假的。**
  group: 酒馆里那场争执散得莫名其妙。
daily_limit: 1

options:
  - key: '1'
    label: 不再说什么，喝完走
    effects: [ { dig: 5 } ]
    text: |
      你把酒喝完，站起来走了。
      **他一直坐在那儿** —— 直到你出门，他都没抬过头。
  - key: '2'
    label: 把那句假的收回来
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你把那句话收了。他的表情一下子松了。
      **而他自己都不知道刚才在怀疑什么** —— 他只是觉得有点累。
  - key: '3'
    label: 再补一句，让他更确定
    effects: [ { dig: 7, cor: 4, mad: 3 } ]
    text: |
      你又补了一句。他开始跟旁边的人复述。
      **复述的是你给他编的那个版本** —— 而他讲得比你说的还细。
