# 原著依据：《诡秘之主》途径「愚者」序列 9「占卜家」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：在神秘学知识上比「窥秘人」更博学、专业，但缺乏直接的对敌手段
id: seq93_seer
name: 比窥秘人更博学
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:seer'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 4 }
texts:
  priv: |
    有人问了你一个问题，关于某种符号。
    你没有查书，直接答了。
    **答得很细** —— 连那个符号在哪个流派里被改过都说了。
    问的人愣了一下，说：「你连这个都知道？」
  group: 有人在书店里问了个很偏的问题，被答上来了。
daily_limit: 1

options:
  - key: '1'
    label: 说到这里就不说了
    effects: [ { dig: 3 } ]
    text: |
      你闭了嘴。剩下的部分你**还不知道** —— 讲出来就是编。
      对方等了两秒，没等到，自己把话岔开了。
  - key: '2'
    label: 把流派演变也讲完
    effects: [ { dig: 5, mad: 1 } ]
    text: |
      你讲了很久，讲到那个符号在第三个流派里被改成了别的意思。
      他听完没再问，只是走的时候回头看了你一眼 —— **那种眼神你看过。**
  - key: '3'
    label: 反问他从哪听来的
    effects: [ { dig: 4, cor: 1 } ]
    text: |
      他愣了一下，说记不清了。
      一个问得出这种问题的人，**不该记不清**。你把这一条记下了。
