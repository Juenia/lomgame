# 原著依据：《诡秘之主》途径「黄昏巨人」序列 9「战士」（第 3 张）
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：各种武器防具精通，不存在无法使用的武器
id: seq93_warrior
name: 握枪的手
trigger:
  type: daily
  weight: 7
  cond:
    - 'pathway:warrior'
  min_seq: 9
  max_seq: 9
effects:
  - { hp: 2 }
  - { dig: 2 }
texts:
  priv: |
    你在靶场边上站着，看一个年轻人打枪。
    他握枪的姿势很标准，据枪也稳 —— **但每打完一发，他的虎口都会往上抬半分**。
    你走过去，把他右手食指的位置往下按了一点。
    下一发，正中。他自己愣了半天：「你怎么看出来的？」
  group: 靶场上有人给一个年轻人按了一下手指，他下一发就中了。
daily_limit: 1

options:
  - key: '1'
    label: 按完就走，不多说
    effects: [ { dig: 3 } ]
    text: |
      你按下他的食指，转身走了。
      身后传来一声枪响 —— **正中**。你没有回头。
  - key: '2'
    label: 再教他两处
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你又调了两处：肩、还有呼吸。
      他打完一梭子，把枪放下，看着靶子看了很久 —— **他大概明白了自己以前在打什么**。
  - key: '3'
    label: 问他师父是谁
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说了个名字。你没听过。
      但他的握枪姿势**和那个人一模一样** —— 包括那个错的虎口角度。
  - key: '4'
    label: 自己也去打两发
    effects: [ { dig: 4, hp: 1 } ]
    text: |
      你借了他的枪，打了两发，都在十环。
      还枪的时候他看你的眼神变了 —— **那眼神你认得，是想学**。
