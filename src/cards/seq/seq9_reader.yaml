# 原著依据：《诡秘之主》途径「白塔」序列 9「阅读者」
# 本卡由该序列的原作能力**推演出一个具体场景**（不是引述能力原文）。
# 能力原文：记忆的提升和理解能力、学习能力的增强，能使用仪式魔法
id: seq9_reader
name: 合上之后懂了
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 9
  max_seq: 9
effects:
  - { dig: 3 }
  - { mp: 1 }
texts:
  priv: |
    那本书你翻了两个钟头，一个字都没看懂。
    合上的时候，你忽然全懂了 —— 不是「想通了」，是**像早就知道一样**。
    你重新翻开，找到刚才卡住的那一页。上面写的和你想的一样。
    你把书合上，放回架上。**下次再来找它，它可能不在了。**
  group: 有人在图书馆坐了一下午，翻了一本看不懂的书。
daily_limit: 1

options:
  - key: '1'
    label: 把书放回架上，走
    effects: [ { dig: 5 } ]
    text: |
      你把书放回架上，走了。
      **走到门口你回头看了一眼那一格** —— 它在最里面，谁也够不到。
  - key: '2'
    label: 记下这本书的位置
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你记住了是第几排第几本。第二天你去看。
      **那一格是空的** —— 而卡片上写着它没有被借出。
  - key: '3'
    label: 再借一本没看过的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又借了一本。这次你一个字都不懂。
      **从头到尾，一个字都不懂** —— 而合上的时候也没有懂。
