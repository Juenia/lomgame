# 原著依据：《诡秘之主》途径「被缚者」序列 1「神孽」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：部分异类推柄；能发出直刺灵体的极端邪异嘶吼让目标僵直、脑海空白；能让敌人不知不觉遭受侵蚀与诅咒
id: seq1_prisoner
name: 嘶吼
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:prisoner'
  min_seq: 1
  max_seq: 1
effects:
  - { cor: 5 }
  - { hp: 3 }
texts:
  priv: |
    他们围成一圈，都在看你。
    **你叫了一声。** 那不是人能发出来的声音。
    所有人同时僵住 —— 手举着，眼睛睁着，脑子空的。
    你从他们中间走过去。走过去之后，他们才慢慢想起来自己刚才在做什么。
  group: 那天在场的人都说有一段时间什么都不记得。
daily_limit: 1

options:
  - key: '1'
    label: 趁他们僵住的时候走开
    effects: [ { dig: 5 } ]
    text: |
      你从他们中间走过去。他们的手还举着。
      **你走过去之后** —— 身后才慢慢有了动静。
  - key: '2'
    label: 回头看看他们什么时候醒
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你回头。他们僵了大概二十秒。
      **然后一个人先放下手** —— 其他人跟着放下来，像是被谁叫醒。
  - key: '3'
    label: 再叫一次，这次对着一个人
    effects: [ { dig: 7, cor: 4, mad: 4 } ]
    text: |
      你对着一个人叫了。他倒了。
      **醒过来之后他不认得自己的手** —— 他把它当成别人的。
