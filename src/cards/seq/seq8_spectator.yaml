# 原著依据：《诡秘之主》途径「空想家」序列 8「读心者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：观察能力深入到气场、以太体等神秘领域；能异常准确地掌握人心，似乎可以读到对方的念头
id: seq8_spectator
name: 他还没开口
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:spectator'
  min_seq: 8
  max_seq: 8
effects:
  - { dig: 3 }
  - { mad: 1 }
texts:
  priv: |
    对面那个人抬起头，刚要说话。
    你先把那句话说了出来 —— 一字不差。
    他愣住了，然后脸色变了。
    **你也不想的。有些话，说在别人前面比听到更让人难堪。**
  group: 有人把对方要说的话抢先说了出来，一字不差。
daily_limit: 1

options:
  - key: '1'
    label: 把后面的话也说了
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你接着说了三句。他一直在听着。
      **听到最后他坐下了** —— 而他说的是「你说得对」。
  - key: '2'
    label: 停下来，让他自己说
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你停了。他张了张嘴。
      **而他说出来的和你刚才说的不一样** —— 差得很远。
  - key: '3'
    label: 问他刚才想说什么
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你问了。他看了你很久。
      **然后说「没什么」** —— 说得很轻，轻到像是给他自己听的。
