# 原著依据：《诡秘之主》途径「白塔」序列 3「洞悉者」
# 本卡由该序列的原作能力推演出一个具体场景（不是引述能力原文）。
# 能力原文：一定规律权柄；洞悉：能洞悉世界规则，敌人很难有秘密，弱点强项都暴露无遗
id: seq3_reader
name: 他没有秘密
trigger:
  type: daily
  weight: 8
  cond:
    - 'pathway:reader'
  min_seq: 3
  max_seq: 3
effects:
  - { dig: 4 }
  - { mad: 1 }
texts:
  priv: |
    你看了他一眼。
    **他左膝有旧伤，右手比左手快，最怕的是水，而他自己都不知道最后一件。**
    「你鞋带松了。」你说。他低头看。
    你没有动手，只是往旁边让了一步 —— 让他在这个位置上多站了三秒。
  group: 那场架打完，输的人不知道自己在哪输的。
daily_limit: 1

options:
  - key: '1'
    label: 让开一步，看他在那个位置站着
    effects: [ { dig: 5 } ]
    text: |
      你让开一步。他在那儿站了三秒。
      **三秒之后他换了个姿势** —— 而那时候已经晚了。
  - key: '2'
    label: 提醒他一句关于水的事
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你说了一句关于水的话。他愣住了。
      **因为他从来没跟人说过** —— 连他自己都是上个月才知道的。
  - key: '3'
    label: 再推一遍他会在哪输
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你又看了一遍。他会在第三步输。
      **而你还知道第三步之后会发生什么** —— 你把那一段跳过去了。
