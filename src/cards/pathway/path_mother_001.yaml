id: path_mother_001
name: 埋下去的东西
trigger:
  type: daily
  weight: 9
  cond: [ 'pathway:mother' ]
  min_seq: 9
effects:
  - { dig: 4 }
  - { hp: 3 }
texts:
  priv: |
    你把种子按进土里，覆上，压实。
    耕种者不比别人更懂种子 —— 更懂**等**。
    三天后你回来，土面裂开一道细缝，缝里是白的。你蹲下看了很久，没有把它挖出来。
  group: 院子里有一股新鲜的土腥味。
daily_limit: 1

options:
  - key: '1'
    label: 蹲下来看那道缝
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你蹲下来看了很久。缝很细，里面是白的。
      **而它没有继续裂** —— 它在等你。
  - key: '2'
    label: 把它挖出来看看
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你挖开了。下面是一个很小的东西，白的。
      **而它已经长出了根** —— 根是往下扎的。
  - key: '3'
    label: 站起来，三天后再来
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你站起来走了。三天后你回来。
      **那道缝宽了一指** —— 而你还是没有挖。
