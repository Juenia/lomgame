id: path_corpse_collector_001
name: 收尸人的规矩
trigger:
  type: daily
  weight: 8
  cond: [ 'pathway:corpse_collector' ]
  min_seq: 9
effects:
  - { dig: 4 }
  - { mad: 1 }
texts:
  priv: |
    你把布盖上去，压住四角。
    收尸有三条规矩，第一条是「不叫名字」。
    你做完这一切，才想起自己刚才在心里叫了一声。
  group: 巷口的车轱辘响了一阵，停了。
daily_limit: 1

options:
  - key: '1'
    label: 在心里把那声名字收回来
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你把它按了下去，像按住一张要飞的纸。
      **而手心那点凉一直没退** —— 退了半个钟头。
  - key: '2'
    label: 把布的四角再压一遍
    effects: [ { dig: 3 } ]
    text: |
      你又压了一遍，压得很实。
      **屋里那股味道淡下去了** —— 而它本来是不该淡的。
  - key: '3'
    label: 顺着车轱辘声看一眼
    effects: [ { dig: 5, cor: 1, mad: 1 } ]
    text: |
      你抬头看。巷口是空的。
      **而车辙是新的** —— 新到还在往外渗水。
