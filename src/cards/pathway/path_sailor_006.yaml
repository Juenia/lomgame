id: path_sailor_006
name: 暴怒这一件事
trigger:
  type: daily
  weight: 7
  cond: [ 'pathway:sailor' ]
  min_seq: 8
effects:
  - { dig: 5 }
  - { mad: 2 }
texts:
  priv: |
    码头上有个人撞了你一下，没道歉。
    你把他按在桩子上的时候，才发觉自己的手在抖 —— 不是怕，是**某种更旧的东西在往上顶**。
    暴怒之民要学的不是忍，是**分清楚哪一份怒气是自己的**。你松了手，那个人跑了。你站在原地喘了很久。
  group: 码头上忽然有人大声嚷了一句，随即没了下文。
daily_limit: 1

options:
  - key: '1'
    label: 站在原地把气喘匀
    effects: [ { dig: 5, mad: -1 } ]
    text: |
      你站着喘。喘了很久才匀。
      **而那股往上顶的东西还在** —— 它只是退回去了，没有走。
  - key: '2'
    label: 追上去，再按他一次
    effects: [ { dig: 7, hp: 2, cor: 4, mad: 4 } ]
    text: |
      你追上去了。这次他没有反抗。
      **而你的手一直在抖** —— 抖到你松开为止。
  - key: '3'
    label: 想清楚哪一份怒气是自己的
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你站在码头想。想了半个钟头。
      **想到最后你分出来两份** —— 而小的那一份是你的。
