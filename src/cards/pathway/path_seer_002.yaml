id: path_seer_002
name: 两副牌
trigger:
  type: daily
  weight: 8
  cond: [ 'pathway:seer' ]
  min_seq: 8
effects:
  - { dig: 5 }
  - { mad: 1 }
texts:
  priv: |
    你摊开牌，数了两遍。
    五十二张。可你刚才明明洗进去五十三张。
    你笑了笑，把多出来的那一张从袖口抽出来 —— 小丑的手法从来不在手上，在**别人数数的时候**。
  group: 角落里有人鼓掌，随即发现并没有人在看他。
daily_limit: 1

options:
  - key: '1'
    label: 把它放回去，什么都不说
    effects: [ { dig: 3 } ]
    text: |
      你把牌收起来，动作很自然。
      没有人看见那一张 —— **小丑最要紧的不是手快，是别人不看你的手**。
  - key: '2'
    label: 当众再数一遍，让所有人看着
    effects: [ { dig: 5, mad: 1 } ]
    text: |
      这次是五十二张。你数得很慢，每个人都跟着数了。
      数到最后一张的时候有人说「刚才明明」，然后自己把话咽了回去。
  - key: '3'
    label: 把多出来的那张留着
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      那张牌进了袖口。
      你到现在也没敢翻开看它是什么 —— **多出来的那一张，总该有个来处**。
