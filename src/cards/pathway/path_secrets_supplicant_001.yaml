id: path_secrets_supplicant_001
name: 听他说完
trigger:
  type: daily
  weight: 8
  cond: [ 'pathway:secrets_supplicant' ]
  min_seq: 9
effects:
  - { dig: 4 }
  - { mp: -3 }
texts:
  priv: |
    那个人讲了很久，讲得没有条理。
    你一句都没有打断 —— 你听的不是他说的内容，是**他没敢说的那半句**。
    秘密祈告者做的第一件事，是替别人把话听完。
  group: 教堂角落里有人一直在说，声音很低。
daily_limit: 1

options:
  - key: '1'
    label: 把他说不出口的那半句替他说出来
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你说了。他停下来，看了你很久。
      **然后他站起来了** —— 走的时候背是直的。
  - key: '2'
    label: 接着听，一句都不打断
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你听到他说完。他停下来的时候天已经黑了。
      **而他一直没说出那半句** —— 他只是把它说了三遍别的形式。
  - key: '3'
    label: 问他那半句是关于谁的
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      他抬头看你，说了一个名字。
      **而那个名字他刚才一次都没提过** —— 他一直在绕着它说。
