id: path_seer_001
name: 灵摆停在中间
trigger:
  type: daily
  weight: 9
  cond: [ 'pathway:seer' ]
  min_seq: 9
effects:
  - { dig: 4 }
  - { cor: 1 }
texts:
  priv: |
    你把银链绕在指上，让它自己停。
    它没有偏向任何一边 —— 不是「没有答案」，是**这个问题有两个答案，而且都还没发生**。
    你把链子收进袖子的时候，指尖有一点麻。占卜家最先学会的不是看，是**忍住不看第二个**。
  group: 有人看见一枚钱币在桌上立着，转了很久才倒。
daily_limit: 1

options:
  - key: '1'
    label: 收起来，不再看第二眼
    effects: [ { dig: 3 } ]
    text: |
      你把链子绕回腕上。**忍住不看第二个答案**，是占卜家最先学会的事。
      走出两步之后你才发觉，指尖那点麻还没退。
  - key: '2'
    label: 再问一次，问第三个问题
    effects: [ { dig: 6, cor: 2, mad: 3 } ]
    text: |
      你又问了一次。链子这次偏得很急，像被谁推了一把。
      你得到了第二个答案 —— 而它和第一个**不一样**。
      有些门只要开过一次，就会一直虚掩着。
