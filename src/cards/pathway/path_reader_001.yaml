id: path_reader_001
name: 读到第三遍
trigger:
  type: daily
  weight: 9
  cond: [ 'pathway:reader' ]
  min_seq: 9
effects:
  - { dig: 4 }
  - { mp: 2 }
texts:
  priv: |
    同一页你读了三遍。
    第一遍读懂了字，第二遍读懂了意思，第三遍读出了**写这行字的人当时在怕什么**。
    阅读者不是读得快，是**不肯只读一遍**。你合上书的时候，书页边缘有一点温。
  group: 阅览室里只剩下翻页的声音。
daily_limit: 1

options:
  - key: '1'
    label: 把书页边缘那点温记下来
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你摸了一下。温的，像刚有人合上。
      **而阅览室里只有你一个人** —— 你进来的时候书就摊在那儿。
  - key: '2'
    label: 再读第四遍
    effects: [ { dig: 7, cor: 3, mad: 3 } ]
    text: |
      你读了第四遍。这次读出来的是写的人的名字。
      **而那个名字你在别的地方见过** —— 就在这本书的扉页上。
  - key: '3'
    label: 去查写这行字的人是谁
    effects: [ { dig: 6, dp: 1 } ]
    text: |
      你查了。这个人是三十年前的一个抄写员。
      **而他抄这本书的时候住在城东** —— 那地方现在是一片空地。
