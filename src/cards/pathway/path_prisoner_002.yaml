id: path_prisoner_002
name: 月圆那几天
trigger:
  type: daily
  weight: 7
  cond: [ 'pathway:prisoner' ]
  min_seq: 4
effects:
  - { dig: 6 }
  - { mad: 3 }
texts:
  priv: |
    月亮一升起来，你的骨头就开始响，像有人在里面数数。
    你没有出门 —— 你知道自己出去会做什么。
    天亮之后你才敢看院子里的那棵树。
  group: 月圆的晚上，有人家的狗叫了一整夜。
daily_limit: 1

options:
  - key: '1'
    label: 把门窗都钉上
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你把门窗都钉死了，坐在地上等天亮。
      **而骨头一直在响** —— 响到天蒙蒙亮才停。
  - key: '2'
    label: 出去，看看自己会做什么
    effects: [ { dig: 7, hp: 3, cor: 4, mad: 4 } ]
    text: |
      你出去了。第二天早上你在院子外面醒过来。
      **而院子里的树断了** —— 断口很整齐。
  - key: '3'
    label: 坐在屋里数骨头响了几下
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      你数着。数到四十七下的时候它停了。
      **而四十七下正好是你今年岁数** —— 数完你笑了一下。
