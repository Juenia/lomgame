id: path_seer_004
name: 纸页上的旧名字
trigger:
  type: daily
  weight: 6
  cond: [ 'pathway:seer' ]
  min_seq: 3
  cooldown_days: 5
effects:
  - { dig: 7 }
  - { mad: 2 }
  - { item: 旧日记残页, n: 1 }
texts:
  priv: |
    书页边缘有一行褪色的字，写的是一个名字。
    你读第二遍的时候，那个名字变了 —— 不是你看错，是**历史被翻页了**。
    古代学者读的不是过去，是**过去被改过几次**。你把这一页撕下来收好：它现在的样子，下一次就未必还是。
  group: 书堆深处传来一声轻轻的合页声。
daily_limit: 1

options:
  - key: '1'
    label: 把这一页收好，不再读
    effects: [ { dig: 3 } ]
    text: |
      你把纸折起来夹进书里。
      **它现在的样子，下一次就未必还是** —— 所以这一版得留着。
  - key: '2'
    label: 再读一遍，看它还会变成什么
    effects: [ { dig: 6, cor: 2, mad: 2 } ]
    text: |
      第三遍的时候那个名字又变了，变成了你认识的一个人。
      你把书合上，手在封面上按了很久 —— **历史不是被改了一次，是一直在改**。
  - key: '3'
    label: 去查这个名字最早是什么样
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你翻了三个书架，在最底一层的注疏里找到了它最早的样子 ——
      和现在**完全不像同一个名字**。
