id: path_seer_006
name: 一场没人拆穿的骗局
trigger:
  type: daily
  weight: 7
  cond: [ 'pathway:seer' ]
  min_seq: 5
effects:
  - { dig: 6 }
  - { cor: 3 }
texts:
  priv: |
    你在酒馆里讲了半个钟头的故事，讲到第三个人开始复述给别人听。
    诡法师的手艺是**让别人替你说**。
    你结账离开的时候，那个故事已经长得比你讲的长了 —— 而且它开始有你没讲过的细节。
  group: 酒馆里有人在笑，笑声比你离开时晚了半拍。
daily_limit: 1

options:
  - key: '1'
    label: 结账走人，让故事自己长
    effects: [ { dig: 4 } ]
    text: |
      你没回头。第二天那个故事传到了另外两个区，
      而它已经长出了第三个结局 —— **你自己都没想过的那个**。
  - key: '2'
    label: 回去把故事收回来
    effects: [ { dig: 5, cor: 1 } ]
    text: |
      你回去听了半段，里面有三成是你没讲过的。
      你把它们一处处改回原样 —— **改完之后那个故事不好听了**。
  - key: '3'
    label: 再讲一个，看它会长成什么样
    effects: [ { dig: 6, mad: 2 } ]
    text: |
      第二个故事长得比第一个快。
      第三天有人来找你，说想听「那个故事的续」—— **你还没讲过续**。
