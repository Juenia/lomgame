id: path_secrets_supplicant_002
name: 扛着的那一样
trigger:
  type: daily
  weight: 7
  cond: [ 'pathway:secrets_supplicant' ]
  min_seq: 4
effects:
  - { dig: 6 }
  - { hp: -5 }
texts:
  priv: |
    你替一个人把他扛着的东西接了过来。
    它没有重量，但你走路开始变慢。
    倒吊人这一途的力量来自**你愿意替谁站着**，代价也来自同一处。
  group: 有人从教堂出来，背是弯的。
daily_limit: 1

options:
  - key: '1'
    label: 把它扛回去还给他
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你扛回去了。他接过去的时候愣了一下。
      **而他的背没有弯下去** —— 他只是把它捧在手里。
  - key: '2'
    label: 扛着它多走一段
    effects: [ { dig: 6, hp: 2, cor: 3, mad: 3 } ]
    text: |
      你多走了一段。越走越慢。
      **而慢下来的不是脚** —— 是别的什么。
  - key: '3'
    label: 看看它到底是什么
    effects: [ { dig: 7, cor: 3, mad: 4 } ]
    text: |
      你低头看。手里什么都没有。
      **而你抬不起头** —— 你花了很久才把脖子直回来。
