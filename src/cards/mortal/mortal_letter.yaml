# M2.7.6：普通人专属事件卡（未入途径）。
#
# 口径（任务书 §5.5）：**描述模糊、信息少、压迫感强**。
# 普通人不知道雾里是什么，只知道「不该待在这里」——
# 同一张卡在入途径之后会被另一套卡替换掉（那个版本才有名字与解释）。
#
# cond: pathway:mortal —— 这一条同时是「普通人看不到 daily/random 池」的另一半：
# 两个池子靠条件与命令层的硬过滤共同分开，任何一边漏了都不会互相串味。
id: mortal_letter
name: 没有署名的信
trigger:
  type: random
  weight: 10
  cond: [ pathway:mortal ]
effects:
  - { mad: 1 }
  - { flag: watched_by_unknown }
texts:
  priv: |
    门缝里塞着一封信，没有署名，也没有邮戳。
    里面只有一行字：「你最近是不是睡得不太好？」
    你想不起自己跟谁提过这件事。
  group: 有人收到了一封没有署名的信。
daily_limit: 1

options:
  - key: '1'
    label: 把信收好
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你折好放起来了。那张纸比一般的厚。
  - key: '2'
    label: 想想最近跟谁提过这件事
    effects: [ { dig: 5, cor: 2, mad: 3 } ]
    text: |
      你想了很久。你从来没跟人提过 —— 除了那天夜里说梦话。
  - key: '3'
    label: 把信烧了
    effects: [ { dig: 3, mad: -1 } ]
    text: |
      你烧了。灰是白的，而那一行字你记住了。
