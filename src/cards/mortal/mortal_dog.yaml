# M2.7.6：普通人专属事件卡（未入途径）。
#
# 口径（任务书 §5.5）：**描述模糊、信息少、压迫感强**。
# 普通人不知道雾里是什么，只知道「不该待在这里」——
# 同一张卡在入途径之后会被另一套卡替换掉（那个版本才有名字与解释）。
#
# cond: pathway:mortal —— 这一条同时是「普通人看不到 daily/random 池」的另一半：
# 两个池子靠条件与命令层的硬过滤共同分开，任何一边漏了都不会互相串味。
id: mortal_dog
name: 跟着你的瘦狗
trigger:
  type: random
  weight: 9
  cond: [ pathway:mortal ]
effects:
  - { mad: 1 }
texts:
  priv: |
    一条瘦狗从巷口跟上了你。
    你走它走，你停它停。它不叫，也不靠近。
    到路口的时候它停下来了 —— 好像有什么东西它不敢过。
  group: 一条狗跟着某个人走了一路。
daily_limit: 1

options:
  - key: '1'
    label: 回头看它在怕什么
    effects: [ { dig: 5, cor: 2, mad: 2 } ]
    text: |
      你回头。路口那边什么都没有 —— 而它一直在往那个方向看。
  - key: '2'
    label: 把它抱过路口
    effects: [ { dig: 6, hp: 1, cor: 2 } ]
    text: |
      你把它抱过去了。它落地之后没有跑，只是抬头看你。
  - key: '3'
    label: 不管它，接着走
    effects: [ { dig: 3, dp: 1 } ]
    text: |
      你走了。回头看的时候它还站在路口那一边。
