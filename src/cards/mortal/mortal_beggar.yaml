# M2.7.6：普通人专属事件卡（未入途径）。
#
# 口径（任务书 §5.5）：**描述模糊、信息少、压迫感强**。
# 普通人不知道雾里是什么，只知道「不该待在这里」——
# 同一张卡在入途径之后会被另一套卡替换掉（那个版本才有名字与解释）。
#
# cond: pathway:mortal —— 这一条同时是「普通人看不到 daily/random 池」的另一半：
# 两个池子靠条件与命令层的硬过滤共同分开，任何一边漏了都不会互相串味。
id: mortal_beggar
name: 路边的碗
trigger:
  type: random
  weight: 10
  cond: [ pathway:mortal ]
effects:
  - { mad: 1 }
texts:
  priv: |
    路边的老人伸出碗。你放了几个便士进去。
    他没有说谢谢。他说：「往左走。」
    你回头看了他一眼。他又说了一遍：「往左走。」
  group: 路边的老人说了句没头没尾的话。
daily_limit: 1

options:
  - key: '1'
    label: 往左走
    effects: [ { dig: 5, cor: 2, mad: 2 } ]
    text: |
      你往左走了。左边那条巷子你没走过。
  - key: '2'
    label: 再问他一句
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你问了。他没有答，只是把碗往前推了推。
  - key: '3'
    label: 走自己的路
    effects: [ { dig: 3 } ]
    text: |
      你往右走了。走出十几步，身后又传来那句「往左走」。
