# M2.7.6：普通人专属事件卡（未入途径）。
#
# 口径（任务书 §5.5）：**描述模糊、信息少、压迫感强**。
# 普通人不知道雾里是什么，只知道「不该待在这里」——
# 同一张卡在入途径之后会被另一套卡替换掉（那个版本才有名字与解释）。
#
# cond: pathway:mortal —— 这一条同时是「普通人看不到 daily/random 池」的另一半：
# 两个池子靠条件与命令层的硬过滤共同分开，任何一边漏了都不会互相串味。
id: mortal_market
name: 旧货摊上的怀表
trigger:
  type: random
  weight: 10
  cond: [ pathway:mortal ]
effects:
  - { mad: 1 }
texts:
  priv: |
    旧货摊上摆着一堆没人要的东西。
    你翻到一只怀表，指针停在三点十七分。
    摊主看了你一眼，说：「那个不卖。」然后把它收了回去。
  group: 旧货摊上有人收走了一样东西。
daily_limit: 1

options:
  - key: '1'
    label: 问摊主为什么不卖
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他说那不是他的。他只是替人看着。
  - key: '2'
    label: 记住那表停的时间
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      三点十七分。而钟楼上那口钟也是这个数。
  - key: '3'
    label: 在摊上再翻翻别的
    effects: [ { dig: 3 } ]
    text: |
      你翻了翻。别的都是普通的旧东西。
