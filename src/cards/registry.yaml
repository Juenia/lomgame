  # 这些 flag 由**前置卡的 effect** 设出，由**后续卡的 cond** 读取。
  # 登记在这里是为了让 lint 能拦住拼错的 flag（未登记 = 报错）。
  # 判据：`cond: flag:xxx` 里的每一个 xxx 都要在这里，且**至少有一张卡真的设它** ——
