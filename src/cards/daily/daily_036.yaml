# 原著依据：《日常生活.md》fun_cards ——「罗塞尔奠定当前纸牌组成与玩法：升级、斗地主（被罗塞尔改名『斗邪恶』）、德州、昆特」（ch4/ch41）
# 本项目从该素材融合为事件卡（不是原作的原文，是依据它写的事件）。
id: daily_036
name: 斗邪恶
trigger:
  type: daily
  weight: 6
effects:
  - { mad: 1 }
  - { dig: 2 }
texts:
  priv: |
    酒馆里几个人在打「斗邪恶」—— 罗塞尔大帝改的名字，牌面上的地主管它叫别的。
    你没下场，只在旁边看 —— 记住了一件事：他们出牌的顺序，是按某种规律的。
  group: 有人在牌桌上输了两便士，却一直在看别人怎么出牌。
daily_limit: 1

options:
  - key: '1'
    label: 回去把出牌的顺序记下来
    effects: [ { dig: 4, dp: 1 } ]
    text: |
      你记了一整页。记完再看，那不是顺序，是一句话。
  - key: '2'
    label: 下场打一局
    effects: [ { dig: 5, cor: 2, mad: 2 } ]
    text: |
      你输了。而输的那一手正好是他们刚才打过的。
  - key: '3'
    label: 问他们这套牌是哪儿买的
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      他们笑了。其中一个说这副牌不是买的。
