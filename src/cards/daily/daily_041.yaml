# 原著依据：《日常生活.md》light_meter ——「住户往计费器投 1 便士铜币购买煤气，煤气公司人员定期来取走」（ch2/ch44）
# 本项目从该素材融合为事件卡（不是原作的原文，是依据它写的事件）。
id: daily_041
name: 计费器里的硬币
trigger:
  type: random
  weight: 4
  cond:
    - mad>20
effects:
  - { mad: 3 }
  - { dig: 2 }
texts:
  priv: |
    你往瓦斯计费器里投了一便士，齿轮转起来，气来了。
    但取币的工人昨天才来过 —— 你今天投的这枚，会在明天出现在他手里，
    而他手里的每一枚，都被人许过一个愿。
  group: 楼道里的计费器响了一声。
daily_limit: 1

options:
  - key: '1'
    label: 明天去问那个取币的工人
    effects: [ { dig: 5, dp: 1 } ]
    text: |
      你去了。他说他昨天的确收到了一枚 —— 而那枚不烫。
  - key: '2'
    label: 再投一便士，许个愿
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你许了。齿轮转起来的时候，你听见计费器里有别的东西在动。
  - key: '3'
    label: 什么都不做，回屋
    effects: [ { dig: 3 } ]
    text: |
      你回屋了。楼道里那声轻响又来过一次。
