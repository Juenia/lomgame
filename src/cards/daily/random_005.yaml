id: random_005
name: 那本书又回来了
trigger:
  type: random
  weight: 5
  cond:
    - dig>=40
  location:
    - 烛火书店
effects:
  - { dig: 1 }
  - { mad: 2 }
  - { item: 辅助材料·月长石粉, n: 1 }
texts:
  priv: |
    {{动静}}。第三排架子后面那本书又回来了。
    你只读了两行，合上时手在抖，{{收获}}。
  group: "{{动静}}"
daily_limit: 1

options:
  - key: '1'
    label: 把书合上放回去
    effects: [ { dig: 3, dp: 1 } ]
    text: |
      你放了回去。手抖了很久才停。
  - key: '2'
    label: 再读两行
    effects: [ { dig: 6, cor: 3, mad: 3 } ]
    text: |
      你又读了两行。第三行的字你不认识了 —— 而它认识你。
  - key: '3'
    label: 把书带走
    effects: [ { dig: 5, cor: 2, mad: 2 } ]
    text: |
      你把它塞进外套里。出门的时候书是凉的。
