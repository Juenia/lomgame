  # ═══════════ M2.94：补上**两道一直空着的档**（序列 9 与序列 1）═══════════
  #
  # 这张表原来只有序列 8—2（22 × 7 = 154 条）。缺的两档恰恰是玩家**一定会经过**的：
  #
  #   序列 9 —— 一入途径就是这个序列（晋升会给 ability_<途径>_9 的 flag，但表里没有定义）
  #   序列 1 —— 本版可达的**顶**（CONTENT_MAX_SEQUENCE = 1，再往上没有内容）
  #
  # ⇒ 结果是：新手（序列 9）与走到顶的人（序列 1）在菜单里都看到「暂无能力」。
  #    前面那一档勉强说得过去（新手确实什么都不会），后面那一档说不过去 ——
  #    一个人走到本版上限，能力栏是空的。
  #
  # ## 两条口径
  #
  #   **零新字段**（沿用 M2.28 批次 A 的口径）：44 条全部落在已有的 9 个 effect 字段上。
  #   写一个新字段而没有读点 = 「配置里有、跑批里 0 次」。
  #
  #   **值按梯度插**：序列 9 比序列 8 弱一档，序列 1 比序列 2 强一档。
  #   每一条的字段**沿用该途径既有的偏好**（seer 走占卜、warrior 走 HP/先手、
  #   reader/sun/lawyer 走感知…）—— 同一途径在不同档上说的应当是同一件事的深浅。
  #
  # ⚠️ **序列 9 不用倍率字段**（`exploreDangerMultiplier` / `divinationCooldownMultiplier`）。
  #    理由：`mergeAbilityEffects` 对倍率是**累乘**的（0.8 × 0.5 × 0.25 = 0.1），
  #    而序列 9 在曲线**最前面** —— 在那里乘一个 0.8，等于把后面每一档一起改小 20%，
  #    而那不是「给新手一点能力」，是**重排了整条途径的强度曲线**。
  #    相加字段（HP / 先手 / 占卜次数）没有这个副作用，所以新手档走它们。

