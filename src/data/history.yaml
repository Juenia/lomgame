    type: treaty
    year: 155
    result: 罗塞尔发现安全航道后，北大陆诸强国在约 155 年内入侵南大陆：因蒂斯共和国和鲁恩王国覆灭了原本的帕斯王国，分别在星星高原上的帕斯河谷左岸和右岸建立了殖民政权；南大陆的灵教团和玫瑰学派受到北大陆七神教会的毁灭性打击，但也传播到了北大陆。
