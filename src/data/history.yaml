  - id: fall_of_ancient_gods
    name: 古神的陨落
    type: war
    year: 2800
    result: 远古太阳神接连让古神陨落，相继摧毁了巨龙、巨人、不死鸟等种族的统治。空想之龙殒落后其从神归化；精灵王对抗后陨落；恶魔退回深渊、封闭入口。古神留下复活后手：格罗塞尔游记、被丢入灵界深处的卡尔德隆城。
    parties:
