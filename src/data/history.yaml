# 初始历史（M2.61）—— 世界不是白板。
#
# ## 为什么需要这一层
#
# 在它之前，这个世界**没有过去**：
#
#   NUMERIC.epoch 存在（当前纪元 90 天 + 争神之战），但注释自陈「本版没有任何代码读它」——
#   全仓 grep epoch 的命中只有它自己与别名导出。
#   内容表里没有任何一处写纪元、王朝、战争、条约。
#
# 于是玩家脚下的每一寸地都是「刚刚生成的」：教会之间没有旧仇，封印物没有来历，
# 官方的说法没有需要被掩盖的东西。
#
# ## 这一层的硬口径：历史必须**生成现在**
#
# 用户的设计原文是「初始历史应生成当前势力关系和区域状态，而不是只当背景文本」。
# 所以每个事件都要带一段 effects，而且**每一条都必须指向真实存在的实体**：
#
#   power_relations  势力之间的旧仇 / 旧盟 / 旧债 —— 由 M2.59 的 PowerRelation 承接
#   location_scars   地点伤痕：危险度加成 + 生态域参数偏移 —— 由 M2.58 的域参数承接
#   sealed           埋在地点下的封印物（有危险等级与觊觎者）
#   taboo_knowledge  不该被知道的事（谁想埋掉它、谁还记得）
#
# 一张只有「三百年前发生过一场战争」的历史表是背景文本；
# 一张写着「那场战争让黑夜女神与永恒烈阳至今互相敌视」的历史表才会改变世界。
#
# ## 纪年
#
#   year 是**距今年数**（越大越古老），不是绝对年份 ——
#   绝对纪年需要一条真实的时间线，而这条线上的每个点都得能被验证。
#   用「距今多久」则每一条都能对应到当前世界的一个状态。
#
#   epoch 那一行特殊：它描述**当前**这个纪元（NUMERIC.epoch 的 90 天周期），
#   以及它结束时的争神之战 —— 那是这个世界的下一个转折点。

history:

  - id: epoch_current
    name: 当前纪元
    type: epoch
    year: 0
    result: 这一纪已经走到第九十天前后的位置。每一次纪元更替都由一场争神之战决定谁配得上那个位置。
    effects:
      power_relations: []
      location_scars: []
      sealed: []
      taboo_knowledge: []

  - id: war_of_gods
    name: 诸神黄昏之战
    type: war
    year: 312
    result: 三方为「谁来封住灰雾之上那个口子」打了一场没有胜者的仗。口子被草草封上，代价被平摊给所有人。
    locations: [ above_grey_fog, blackthorn_abbey ]
    parties: [ night_goddess, eternal_blazing_sun, god_of_war ]
    effects:
      power_relations:
        - { from: night_goddess, to: eternal_blazing_sun, kind: hostile }
        - { from: eternal_blazing_sun, to: night_goddess, kind: hostile }
      location_scars:
        - { location: above_grey_fog, danger_bonus: 1, zone_patch: { pollution: 0.05, spirituality: 0.05 } }
      sealed:
        - { location: above_grey_fog, what: 灰雾之下那道封条, level: high }
      taboo_knowledge: []

  - id: fall_of_dynasty
    name: 旧王朝倾覆
    type: dynasty
    year: 180
    result: 上一朝在一夜之间换了姓。新王室留用了旧朝的警察厅 —— 因为需要有人替它记住哪些账还没清。
    locations: [ backlund, tingen ]
    parties: [ crown, police ]
    effects:
      power_relations:
        - { from: crown, to: police, kind: ally }
      location_scars:
        - { location: backlund, danger_bonus: 0, zone_patch: { order: 0.05 } }
      sealed: []
      taboo_knowledge:
        - { scope: backlund, what: 旧朝的血脉去了哪里, holder: crown }

  - id: church_wars
    name: 正神教会的百年争斗
    type: war
    year: 240
    result: 七家正神在鲁恩争谁的教堂该修在城里。最后谁也没赢，但从此互相都记着对方的账。
    locations: [ backlund_cathedral ]
    parties: [ night_goddess, eternal_blazing_sun, god_of_war ]
    effects:
      power_relations:
        - { from: god_of_war, to: night_goddess, kind: ally }
      location_scars: []
      sealed: []
      taboo_knowledge:
        - { scope: loen, what: 那场争斗到底为什么停下, holder: god_of_knowledge }

  - id: intez_sea_war
    name: 因蒂斯海战
    type: war
    year: 96
    result: 因蒂斯国教想把海上也划进自己的教区。风暴之主教会把它们打回了岸上，但两边都没敢把这件事写进史书。
    locations: [ trier, storm_cape ]
    parties: [ eternal_blazing_sun, storm_lord ]
    effects:
      power_relations:
        - { from: eternal_blazing_sun, to: storm_lord, kind: hostile }
      location_scars:
        - { location: storm_cape, danger_bonus: 1, zone_patch: { pollution: 0.05 } }
      sealed: []
      taboo_knowledge:
        - { scope: trier, what: 海战那天沉了几条船, holder: eternal_blazing_sun }

  - id: south_colony
    name: 南大陆的开拓
    type: treaty
    year: 140
    result: 鲁恩以「开拓」的名义进了南大陆。地是划下来了，但土里的人没有同意 —— 疫病坑就是那时候挖的。
    locations: [ byron, jungle_ruins, plague_pit ]
    parties: [ earth_mother, crown ]
    effects:
      power_relations:
        - { from: earth_mother, to: crown, kind: hostile }
      location_scars:
        - { location: plague_pit, danger_bonus: 1, zone_patch: { pollution: 0.1 } }
        - { location: jungle_ruins, danger_bonus: 1, zone_patch: { hidden: 0.05 } }
      sealed:
        - { location: jungle_ruins, what: 开拓队留下的铜箱, level: medium }
      taboo_knowledge:
        - { scope: byron, what: 开拓队真正在找什么, holder: earth_mother }

  - id: sea_route_dispute
    name: 航路之争
    type: treaty
    year: 72
    result: 风暴之主教会名义上管着航路，实际做生意的另有其人。两边一直没撕破脸，因为都需要对方。
    locations: [ pritz_harbor, coral_reef, mirage_bay ]
    parties: [ storm_lord, gang ]
    effects:
      power_relations:
        - { from: storm_lord, to: gang, kind: debt }
      location_scars:
        - { location: coral_reef, danger_bonus: 0, zone_patch: { pollution: 0.05 } }
      sealed:
        - { location: mirage_bay, what: 蜃景里的那条船, level: medium }
      taboo_knowledge: []

  - id: steam_dispute
    name: 铁路与教堂之争
    type: treaty
    year: 58
    result: 蒸汽教会要修铁路，战神教会要在铁路边修教堂。最后铁路绕了个弯 —— 那条弯至今还在。
    locations: [ steam_station, backlund_works, ironworks ]
    parties: [ god_of_steam, god_of_war ]
    effects:
      power_relations:
        - { from: god_of_steam, to: god_of_war, kind: hostile }
      location_scars:
        - { location: ironworks, danger_bonus: 1, zone_patch: { pollution: 0.05 } }
      sealed: []
      taboo_knowledge: []

