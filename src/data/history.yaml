      taboo_knowledge:
        - { scope: loen, what: 下面那一层是谁修的, holder: night_goddess }

  - id: factory_fires
    name: 停摆的车间接连失火
    type: disaster
    year: 4
    result: 三年里烧了四座厂房。每次查到最后都说是意外，而每次失火前都有人在那里见过不该见的东西。
