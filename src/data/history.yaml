      sealed: []
      taboo_knowledge:
        - { scope: hornacis_peak, what: 夜之国的人后来怎么样了, holder: night_goddess }

  - id: blasphemy_tablets
    name: 亵渎石板
    type: epoch
    year: 8200
    result: 两块石板把二十二条途径写成了可以照着走的路。它们现在在谁手里，没有人肯说。
    locations: [ above_grey_fog ]
    effects:
