    type: disaster
    year: 2600
    result: 远古太阳神的陨落掀起了大灾变。巨人王庭所在的东大陆陷入黑暗，变成现在的神弃之地；深暗时代持续两千五百余年，白银之国变成现在的白银城。灾后新诞生的六位正神一同组成北大陆六大正神，后世的圣典抹去了远古太阳神的名字。
