  # ═══════════ M2.93：**远古段**（第一纪 — 第五纪初）═══════════
  #
  # 上面 20 条覆盖的是「近几百年」（year 96—312）。这一批补的是世界**更深的过去**：
  # 原作《06-历史/世界大事年表.md》第一纪到第五纪初的那几个节点。
  #
  # 口径与上面完全一致：每个事件都带 effects，而且**每一条都指向真实存在的实体**。
  #
  # ⚠️ 远古的那些神（巨人王 / 精灵王 / 巨龙之王 / 不死鸟始祖…）**不在 powers.yaml 里** ⇒
  #    这些条目的 effects 只走 location_scars 与 taboo_knowledge，**不硬凑 power_relations**
  #    （凑了会被 loader 的 checkPower 判成 error，而且那本来也是编的）。
  # ⚠️ 也不加 sealed：M2.85 清掉过 7 条「没有挖掘链路」的 sealed —— 埋一个挖不出来的东西，
  #    与「显示个文本但没机制」是同一件事。

  - id: primordial_awakening
    name: 「最初」苏醒
    type: disaster
    year: 9000
    result: 那一次醒来把整块地图重画了一遍 —— 北美洲成了北大陆，大西洋成了苏尼亚海。现在每一个地名都是那一次的残留。
    locations: [ north_continent, sunia_sea ]
    effects:
      power_relations: []
      location_scars:
        - { location: north_continent, danger_bonus: 1, zone_patch: { madness: 0.05 } }
        - { location: sunia_sea, danger_bonus: 1, zone_patch: { pollution: 0.05 } }
      sealed: []
      taboo_knowledge:
        - { scope: north_continent, what: 那一次到底是从哪里开始的, holder: god_of_knowledge }

  - id: nine_sephirah
    name: 九份源质
    type: epoch
    year: 8500
    result: 九份源质落地的那一刻，二十二条途径就定死了。灰雾之上之所以能压住那个口子，是因为它底下垫着其中一份。
    locations: [ above_grey_fog ]
    effects:
      power_relations: []
      location_scars:
        - { location: above_grey_fog, danger_bonus: 0, zone_patch: { spirituality: 0.1, hidden: 0.05 } }
      sealed: []
      taboo_knowledge:
        - { scope: above_grey_fog, what: 九份源质里哪一份压在灰雾下面, holder: night_goddess }

  - id: western_continent_seal
    name: 西大陆的封印
    type: treaty
    year: 8000
    result: 灰雾被立起来的时候，西大陆就被留在了里面。屏障今天还在，只是比那时候薄。
    locations: [ west_continent, above_grey_fog ]
    effects:
      power_relations: []
      location_scars:
        - { location: west_continent, danger_bonus: 2, zone_patch: { hidden: 0.15 } }
        - { location: above_grey_fog, danger_bonus: 1 }
      sealed: []
      taboo_knowledge:
        - { scope: west_continent, what: 屏障另一侧现在是什么样, holder: god_of_knowledge }

  - id: eight_ancient_gods
    name: 八大古神分庭抗礼
    type: war
    year: 6000
    result: 巨人在北，精灵在西，巨龙盘在天上 —— 人类那时候是别人的附庸。这一仗没有赢家，但把「谁的地盘」定了下来。
    locations: [ north_continent, west_continent ]
    effects:
      power_relations: []
      location_scars:
        - { location: north_continent, danger_bonus: 1, zone_patch: { fear: 0.05 } }
      sealed: []
      taboo_knowledge:
        - { scope: north_continent, what: 那八位后来各自去了哪里, holder: god_of_war }

  - id: night_country
    name: 夜之国
    type: dynasty
    year: 4200
    result: 霍纳奇斯山脉里曾经有一个不对外开放的国度。它撑了很久，最后被从山下上来的教会抹掉了 —— 山脉今天还留着那段时间的痕迹。
    locations: [ hornacis_peak ]
    effects:
