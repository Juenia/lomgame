  - id: roselle_revolution
    name: 罗塞尔时代
    type: dynasty
    year: 206
    result: 黄涛穿越为罗塞尔·古斯塔夫，以「蒸汽之子」和教会成员的身份掀起工业革命，发明蒸汽机、改良帆船；推翻索伦家族对因蒂斯的统治、建立共和国，后改帝国自称凯撒大帝；1194 年发现通往南大陆的安全航道，开启殖民时代。151 年前被永恒烈阳教会、索伦家族与贵族联手刺杀，陨落于白枫宫。
    parties:
      - eternal_blazing_sun
      - god_of_steam
      - crown
    locations:
