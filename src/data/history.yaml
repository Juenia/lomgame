      taboo_knowledge:
        - { scope: loen, what: 大雾灾那天到底死了多少人, holder: crown }

  - id: deep_catacomb_collapse
    name: 墓窟深处的塌方
    type: disaster
    year: 9
    result: 地面塌了一角，露出下面比上面大得多的一层。教会封了入口，然后改口说那里从来只是墓穴。
    locations: [ deep_catacombs, catacombs, trier_ossuary ]
    parties: [ church, night_goddess ]
