  - id: black_iron_epoch
    name: 黑铁纪元的开始
    type: epoch
    year: 1200
    result: 现在这一纪是从那一年开始数的。「黑铁」这个说法来自当时的人对铁的迷信 —— 他们以为换了金属就不会再打仗。
    locations: [ backlund ]
    effects:
