# 运维节奏（M2.88）—— **世界什么时候主动说话**
#
# 用户拍板：
#   「主动推送的事件改为随机时间触发，不要再定时触发」
#   「后台可以设置一个随机的时间范围，从那个时间范围里随机」
#
# ## 为什么不能是固定间隔
#
# 改之前是「每 5 分钟检查、按整点对齐」—— 玩家很快会发现规律：
#
#   每个整点过几分钟，群里必然出现一条【世界异象】
#
# 而它要营造的是「这个世界自己在动」。**一个能被预测的世界不是活的。**
# 玩家学会「整点再看」之后，这个功能就从「世界在呼吸」退化成「整点报时」。
#
# ## 改法
#
# 每次跑完，**从下面的范围里随机挑一个间隔**。间隔本身有分布，
# 累积两次以上之后任何时刻都不再可预测。
#
# ## 调这个范围的建议
#
#   · 太密（如 5—15 分钟）：群里刷屏，而且「世界很大」的感觉消失；
#   · 太疏（如 3—6 小时）：玩家一晚上什么都碰不到；
#   · 当前 25—95 分钟：**平均约一小时一条**，与它改之前的总量相当，
#     但不再是整点 —— 这是「体感相同、规律消失」的那一档。
#
# ⚠️ 间隔是**随机的**，所以「一小时一条」只是期望值，实际会在 25 分钟到 95 分钟之间浮动。
#    这不是抖动不够，这就是要的效果。
meta:
  source: 用户口述（2026-10-02）
  note: 两份节奏都是**项目派生值**——原作的「世界」没有推送频率这回事，它是游戏运营参数。
world_tick:
  min_minutes: 25
  max_minutes: 95
  note: 世界 tick 推进天气、世界事件与权柄；它同时也是主动推送的来源
daily_check_minutes: 1
