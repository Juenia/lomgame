# 途径行为表（M2.85 世界演化）
#
# 用户拍板：「NPC 也要会做出符合自己途径的行为」——
#
#   在此之前，NPC 干的事只有三种：晋升、猎杀、化解灾厄，全是通用的，看不出他走的是哪条途径。
#
# 本表给 22 条途径各写了 2 个行为（共 44 条），效果归到 6 种能被验证的类型：
#
#   hunt      猎杀生物（减少生态种群）
#   calm      化解灾厄 / 平息混乱（压灾厄）
#
#   tend      养育 / 补充（增加生态种群）
#   foretell  占卜 / 预言（写下明天的苗头 → 世界事件）
#
#   observe   观察 / 洞察（发现世界事件）
#   gather    搜寻 / 发现（带回东西 → 功绩）
#
# ⚠️ 本表是**项目设计**（原著给的是气质与能力，不是行为清单）；文案来自本表，数值是项目派生。
meta:
  source: M2.85 世界演化：**途径行为表**（用户拍板「NPC 也要会做出符合自己途径的行为」）
  count: 44
  effect_note: effect 只有 6 种（hunt / calm / tend / foretell / observe / gather）—— 它们是**能被验证的效果**：前两种已有实现，后四种写世界事件与功绩记录。故意不设更多种类：多一种效果就多一处没人验的代码。
  layer_note: 本表是**项目设计**（原著只给了每条途径的气质与能力），不是原作数据；文案由本表提供，数值（weight / minSequence）是项目派生。
