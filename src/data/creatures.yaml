# 非凡生物 · 物种模板（M2.8）
#
# 物种不是事件卡，是**世界实体**：它有位置、会迁移、HP 会因捕食变化、会成长、会进化、会死。
# 这份表是「一处声明，四处生效」的那个点（任务书 §4.3.4）：
#
#   habitat          连地图 —— 它可能出现在哪、迁移去哪（locations.yaml 的地点 id）
#   pathwayAffinity  连途径 —— 哪条途径的人更容易撞见它（命中 ×1.4，见 numeric.creature.encounter）
#   drops            连物品 —— 观察本质时能采到什么（items.yaml 的物品 id）
#   behaviors        连事件卡 —— 它会做什么（遭遇回执的旁白，本版不产生战斗效果）
#
# ⚠️ M2.8 **不做战斗**（那是 M2.9 的活）。这里写的 hp / sequence 就是 M2.9 战斗的对手来源。
#
# ⚠️ pathwayAffinity 允许写**尚未实现**的途径（水手 / 秘法师 / 收尸人 / 阅读者 / 错误 / 占卜家）。
#    它们现在不会命中任何玩家，但等那条途径实现的那天**自动生效**，不需要回来改这张表。
#    （启动校验会拦下既不是已实现途径、也不在任何城市 planned_pathways 里的拼写错误。）
#
# ⚠️ perception 的**五层都必须写**（缺一层启动就报错）。这是 M2.8 最重要的一条：
#    同一只生物，玩家序列不同，看到的东西必须真的不同。
#    blur      弱 3 级及以上：只看到模糊，只能撤退
#    silhouette 弱 1—2 级：看到轮廓
#    full      同序列：名字 + 习性 + 核心位置
#    advantage 强 1—2 级：它甚至没发现你
#    essence   强 3 级及以上：看见本质，可以观察本质（采集）
#
# ⚠️ M2.9 追加：**battle 段**（伤害区间 / 命中 / 专属行为 / 逃跑率）。
#    八种物种各有一条专属行为（渗透 / 低语 / 撕咬 / 模仿 / 骨尘 / 注视 / 镜像 / 时间凝滞），
#    名字在这里声明，效果在 src/domain/battle/specials.ts 查表 ——
#    「一处声明，四处生效」的第五处：连战斗行为也是内容，不是代码。
#    写错一个行为名**启动就报错**（schema 里是枚举），不会等到玩家撞见一只什么都不做的怪物。
#
# 首批 8 种，序列 5—9 全覆盖。物种模板一旦定下，后面加是纯内容工作，不需要改代码。

creatures:

  # ---------------- 序列 9：随处可见，世界的地板 ----------------
  - species: grey_wraith
    name: 灰雾游魂
    baseSequence: 9
    baseHp: 25
    habitat:
      - spirit_world
      - spirit_deep
    pathwayAffinity: [ seer, sleepless ]
    habits: []
    relations:
      role: consumer
      prey: []
      predators: [ fate_phantom, tide_lurker, spirit_crystal, spirit_evil_eye, extra_050 ]
      symbiosis: [ fate_phantom, spirit_crystal, spirit_evil_eye, mist_herald, tide_lurker ]
      parasite: []
    tickRate: hourly
    flavor: 雾比刚才厚了一点。
    drops:
      - { itemId: 主材料·灰雾结晶, chance: 0.35 }
      - { itemId: 无名者骨牌, chance: 0.15 }
    behaviors:
      - vanish: { trigger: night, chance: 0.3 }
      - stare: { trigger: always, chance: 0.2 }
    perception:
      blur: 雾里有什么东西在动。你看不清，只觉得冷。
      silhouette: 一团模糊的轮廓，比人矮。它好像一直在原地。
      full: 灰雾游魂。灵界漏出来的一点残渣。核心在它身体正中，很薄。
      advantage: 一只灰雾游魂。它甚至没发现你，只是照着生前的路在走。
      essence: 灵界漏出来的残渣，序列很低，连形状都没稳住。核心可采。
    # M2.9 战斗侧：它是最弱的一档 —— 打得疼但不致命，而「渗冷」会偷走你的灵力。
    # 序列 9 的生物对序列 9 的玩家是「同序列」（baseHit 0.5），所以新号也打得过它。
    battle:
      damage: [ 6, 12 ]
      hit: 0.4
      special: chill
      specialName: 渗冷
      fleeChance: 0.6

  # ---------------- 序列 8：城市边缘的常客 ----------------
  - species: whisperer
    name: 低语者
    baseSequence: 8
    baseHp: 40
    # 普利兹港的潮汐码头也归它 —— 那是出生城市（20%），没有物种落脚的话
    # 那里 40 个玩家一辈子遇不到生物（启动校验会为这种城市报 warn）
    habitat:
      - tingen
      - mist_street
    pathwayAffinity: [ sleepless, seer ]
    habits: [ nocturnal ]
    relations:
      role: consumer
      prey: []
      predators: [ deep_gazer, mirror_guest, bone_choir, extra_050 ]
      symbiosis: [ deep_gazer, extra_017, extra_031, mirror_guest, tide_lurker, bone_choir ]
      parasite: []
    tickRate: hourly
    flavor: 雾里有东西在动。
    drops:
      - { itemId: 低语结晶, chance: 0.4 }
      - { itemId: 辅助材料·月长石粉, chance: 0.2 }
    behaviors:
      - flee: { trigger: hpLow, chance: 0.6 }
      - howl: { trigger: night, chance: 0.2 }
    perception:
      blur: 雾里有什么东西在动。你看不清，只觉得冷。
      silhouette: 一团模糊的轮廓，比人高。它没注意到你。
      full: 低语者。靠声音定位。核心在胸腔偏左。
      advantage: 一只低语者。它甚至没发现你。
      essence: 灵界的游魂，序列很低。核心可采。
    # M2.9 战斗侧：「低语」给它挂「恐惧」（命中 -20%）—— 它不靠伤害赢你，靠让你打不中。
    # 逃跑率 0.55 略高：它的习性本来就是「声音定位、不硬碰」。
    battle:
      damage: [ 10, 18 ]
      hit: 0.45
      special: whisper
      specialName: 低语
      fleeChance: 0.55

  # ---------------- 序列 7：真正会伤到人的那一档 ----------------
  - species: blood_hound
    name: 铁血猎犬
    baseSequence: 7
    baseHp: 60
    habitat:
      - hornacis_peak
      - fusac_highland
    pathwayAffinity: [ warrior ]
    habits: [ social ]
    relations:
      role: consumer
      prey: [ extra_019, mutant_black_bear, giant_warrior ]
      predators: []
      symbiosis: [ extra_013, extra_019, extra_025, bone_choir ]
      parasite: []
    tickRate: hourly
    flavor: 巷子口传来爪子刨地的声音。
    drops:
      - { itemId: 主材料·战火余烬, chance: 0.3 }
      - { itemId: 骨粉, chance: 0.15 }
    behaviors:
      - howl: { trigger: night, chance: 0.4 }
      - hunt: { trigger: hungry, chance: 0.5 }
      - flee: { trigger: hpLow, chance: 0.3 }
    perception:
      blur: 巷子里有什么在喘气。不止一个。
      silhouette: 两条腿的影子，前面低后面高。它在闻什么。
      full: 铁血猎犬。群居，闻得到血。核心在肩胛之间，被铁片压着。
      advantage: 一群铁血猎犬。它们还没闻到你。
      essence: 战火里生出来的东西，序列不高，皮下的铁比肉多。核心可采。
    # M2.9 战斗侧：**唯一会求援的物种**（群居）。「撕咬」造成流血 ——
    # 它是那个你必须速战速决的对手：拖下去援军会到，而流血每回合都在掉你的血。
    battle:
      damage: [ 14, 24 ]
      hit: 0.5
      special: maul
      specialName: 撕咬
      fleeChance: 0.4

  - species: fate_phantom
    name: 命运幻影
    baseSequence: 7
    baseHp: 45
    habitat:
      - ruen_great_river
      - south_continent
    pathwayAffinity: [ seer ]
    habits: [ territorial ]
    relations:
      role: consumer
      prey: [ grey_wraith, extra_028, horned_pegasus ]
      predators: [ chrono_worm, mirror_sovereign, pale_archivist, extra_024, spirit_worm ]
      symbiosis: [ grey_wraith, mirror_guest, chrono_worm, mist_herald, bone_choir ]
      parasite: []
    tickRate: hourly
    flavor: 你听见自己刚才说过的一句话。
    drops:
      - { itemId: 无名者骨牌, chance: 0.25 }
      - { itemId: 旧日记残页, chance: 0.2 }
    behaviors:
      - mimic: { trigger: always, chance: 0.4 }
      - vanish: { trigger: always, chance: 0.2 }
    perception:
      blur: 前面有个人影。你不太确定那是不是你的影子。
      silhouette: 一个人的形状，站姿和你一模一样。它没有看你。
      full: 命运幻影。会模仿。核心不在它身上——在它模仿的那个东西身上。
      advantage: 一只命运幻影。它正忙着模仿你，没空看你。
      essence: 一点被时间磨下来的碎屑，序列不高。核心在它模仿的倒影里，可采。
    # M2.9 战斗侧：**会装死**（numeric.battle.creatureAi.playDeadSpecies）。
    # 「模仿」把你上一击的伤害原样打回来 —— 打得越狠，它回得越狠。
    battle:
      damage: [ 12, 20 ]
      hit: 0.5
      special: mimic
      specialName: 模仿
      fleeChance: 0.5

  - species: bone_speaker
    name: 骨语者
    baseSequence: 7
    baseHp: 50
    habitat:
      - pas_valley
      - hagati_grass
    pathwayAffinity: [ corpse_collector ]
    habits: [ territorial ]
    relations:
      role: consumer
      prey: [ extra_028, horned_pegasus, rain_omen_bird ]
      predators: [ root_mother, extra_022, extra_035, harvest_giant_guard, succubus, underworld_roamer, tree_favored, child_of_pain, myriad_arm_wraith, vengeful_spirit, elder_bat, eight_leg_wolf ]
      symbiosis: [ extra_022, extra_028, extra_035, extra_036, extra_041, extra_049, pale_lich, horned_pegasus, harvest_giant_guard, harvest_giant_scholar, death_omen_crow, rain_omen_bird, dark_bat, red_head_bat, red_eye_leopard, crowned_jellyfish, golden_gorilla, troll_sage, bloodthirsty_beast, werewolf, succubus, underworld_roamer, killer_crow, poison_eating_bat, man_eating_vulture, man_eating_hound, rat_swarm_lord, tree_favored, child_of_pain, myriad_arm_wraith, false_man, skinless_blood_cat, savage_hound, magma_demon, ghost_cat, vengeful_spirit, elder_bat ]
      parasite: []
    tickRate: hourly
    flavor: 空气里有香料和别的什么东西混在一起的味道。
    drops:
      - { itemId: 骨粉, chance: 0.4 }
      - { itemId: 无名者骨牌, chance: 0.2 }
    behaviors:
      - feed: { trigger: always, chance: 0.3 }
      - stare: { trigger: threatened, chance: 0.3 }
    perception:
      blur: 市场尽头的阴影里有东西堆着。你看不出那是活的。
      silhouette: 一堆骨头，摆得比骨头该有的样子整齐。它动了。
      full: 骨语者。它跟死人说话，不为活人转身。核心在最上面那根骨头里。
      advantage: 一只骨语者。它正在跟什么说话，背对着你。
      essence: 死人剩下的那点念头的聚合物，序列不高。核心可采。
    # M2.9 战斗侧：**「中毒」的唯一来源**（每回合 HP -2、MP -3，四回合）。
    # 它的伤害不高，但拖长了你就会一直在掉 —— 又是「速战」这一条。
    battle:
      damage: [ 12, 22 ]
      hit: 0.48
      special: bone_dust
      specialName: 骨尘
      fleeChance: 0.4

  # ---------------- 序列 6：海上与镜里的东西 ----------------
  - species: deep_gazer
    name: 深海凝视者
    baseSequence: 6
    baseHp: 80
    # 苏尼亚海各地 + 普利兹港的潮汐码头：海上的东西偶尔也靠岸
    habitat:
      - sunia_sea
      - fog_sea
    # M2.76：原来还写着 mysticism（秘法师）—— 那个 id 在原著 22 条途径里没有落点，
    # 已从枚举里删除（「秘法师」是学徒途径的序列 5）。这里只留真正对得上的那一条。
    pathwayAffinity: [ sailor ]
    habits: [ nocturnal, territorial ]
    relations:
      role: consumer
      prey: [ whisperer, extra_040, sharp_tooth_parrot ]
      predators: [ deep_choir, star_worm ]
      symbiosis: [ whisperer, deep_choir, chrono_worm ]
      parasite: []
    tickRate: hourly
    flavor: 水面下有东西翻了个身。
    drops:
      - { itemId: 凝视之泪, chance: 0.25 }
      - { itemId: 海盐结晶, chance: 0.3 }
    behaviors:
      - stare: { trigger: always, chance: 0.3 }
      - vanish: { trigger: night, chance: 0.2 }
    perception:
      blur: 海面上有个地方比别处黑。
      silhouette: 水底下有很大一团，正在慢慢转向这边。
      full: 深海凝视者。只在夜里浮上来，看东西不用眼睛。核心在身体最深处，被水压护着。
      advantage: 一只深海凝视者。它浮在水面，还没开始看你。
      essence: 海底那点东西伸上来的末梢，序列中等，离了水就软。核心可采。
    # M2.9 战斗侧：序列 6 —— **开场自带「恐惧」气场**（fearAura.maxCreatureSequence = 6）。
    # 「注视」直接加 MAD：它不打你，它让你想起点不该想起来的事。
    battle:
      damage: [ 18, 30 ]
      hit: 0.55
      special: gaze
      specialName: 注视
      fleeChance: 0.35

  - species: mirror_guest
    name: 镜中客
    baseSequence: 6
    baseHp: 70
    habitat:
      - star_plateau
      - south_jungle
    pathwayAffinity: [ spectator, error ]
    habits: [ territorial ]
    relations:
      role: consumer
      prey: [ whisperer, extra_020, extra_025 ]
      predators: [ mirror_sovereign, ashen_knight, pale_archivist ]
      symbiosis: [ fate_phantom, mirror_sovereign, whisperer ]
      parasite: []
    tickRate: hourly
    flavor: 镜子里的那个房间，比这里亮。
    drops:
      - { itemId: 镜面碎片, chance: 0.3 }
      - { itemId: 辅助材料·银粉, chance: 0.2 }
    behaviors:
      - mimic: { trigger: always, chance: 0.5 }
      - vanish: { trigger: night, chance: 0.3 }
    perception:
      blur: 玻璃后面好像有个人，穿得和你不一样。
      silhouette: 一个人形，站在镜子那一边，正对着你。动作比你慢半拍。
      full: 镜中客。它会替你站在镜子里，站久了就换回来。核心在镜像的胸口。
      advantage: 一只镜中客。它还在学你的动作，没学会看你。
      essence: 从镜像那一侧挤过来的一点东西，序列中等。核心可采——但镜子里那块得一起拿走。
    # M2.9 战斗侧：**会装死**之一。「镜像」让你的下一击减半 ——
    # 与装死配起来就是它的模式：先让你以为打赢了，再让你打不动。
    battle:
      damage: [ 16, 28 ]
      hit: 0.52
      special: mirror
      specialName: 镜像
      fleeChance: 0.4

  # ---------------- 序列 5：极稀有，迁徙生物 ----------------
  - species: chrono_worm
    name: 时序蠕虫
    baseSequence: 5
    baseHp: 100
    habitat:
      - highland_kingdom
      - east_continent
    # 占卜家在原作里就是「愚者」途径的序列 9，所以这里只需写 seer（不必造一个新途径名）
    pathwayAffinity: [ seer ]
    habits: [ migratory ]
    relations:
      role: consumer
      prey: [ spirit_crystal, spirit_evil_eye, fate_phantom ]
      predators: [ pale_archivist, root_mother, clockwork_saint, nameless_king, myth_004, myth_005, myth_006, time_worm, eight_leg_wolf ]
      symbiosis: [ fate_phantom, deep_gazer, deep_choir, mirror_sovereign, root_mother, clockwork_saint ]
      parasite: []
    tickRate: hourly
    flavor: 你刚才走过这里吗？你不记得了。
    drops:
      - { itemId: 时序鳞片, chance: 0.2 }
    behaviors:
      - vanish: { trigger: always, chance: 0.4 }
      - stalk: { trigger: always, chance: 0.2 }
    perception:
      blur: 有什么东西刚刚从这里过去了。你不确定是"刚刚"。
      silhouette: 很长的一条，弯在角落里。它的位置和你上一次看的时候不一样。
      full: 时序蠕虫。它不在一个地方，只是经常路过这里。核心只有一节是真的。
      advantage: 一条时序蠕虫。它没在看你——它可能已经走过了。
      essence: 时间在它身上打了个结，序列很高。核心可采，但要快，它不总是同一节。
    # M2.9 战斗侧：序列 5，全场最强，**开场自带恐惧气场**，而且它的专属行为
    # 「时间凝滞」是**唯一一个能让你整回合动不了的招式**（放逐）。
    # 100 HP + 伤害 22—36：这不是「新号该去碰的东西」，这是序列的份量。
    battle:
      damage: [ 22, 36 ]
      hit: 0.6
      special: freeze
      specialName: 时间凝滞
      fleeChance: 0.65
  # ---------------- M2.12：序列 7 门槛地点的居民 ----------------
  #
  # 三件事在这里同时成立：
  #   1. 它们住的地方 min_seq 7（只有序列 7 及以上进得去）；
  #   2. 序列是 6—8，所以**序列 7 的玩家打序列 8 的那一只，落在 advantage 层** ——
  #      这正是 M2.8 设计、到 M2.11 为止几乎见不到的那一层（分片跑批里只有 1 次）；
  #   3. 带 social 习性的两只：群居生物 HP < 50% 会求援，
  #      而 M2.9 起「求援」在跑批里一次都没触发过（当时玩家是序列 9，打不动对手）。
  - species: mist_herald
    name: 雾中传令者
    baseSequence: 8
    baseHp: 45
    habitat:
      - old_dock
      - candle_bookstore
    pathwayAffinity: [ seer, warrior ]
    habits: [ social ]
    relations:
      role: consumer
      prey: []
      predators: [ ashen_knight, clockwork_saint, extra_050 ]
      symbiosis: [ grey_wraith, fate_phantom, tide_lurker ]
      parasite: []
    tickRate: hourly
    flavor: 有人站在雾里，手里拿着一封没有地址的信。
    drops:
      - { itemId: 主材料·命运之线, chance: 0.35 }
      - { itemId: 辅助材料·星尘粉, chance: 0.25 }
    behaviors:
      - flee: { trigger: hpLow, chance: 0.5 }
      - howl: { trigger: threatened, chance: 0.3 }
    perception:
      blur: 雾里有人站着。你不敢确定那是不是人。
      silhouette: 一个轮廓，手里拿着什么。它面朝你，但没有动。
      full: 雾中传令者。它在等一个地址。核心在它拿信的那只手上。
      advantage: 一只雾中传令者。它还在等，甚至没发现你。
      essence: 一封信的形状，序列很低。核心可采。
    battle:
      damage: [ 12, 20 ]
      hit: 0.5
      special: whisper
      specialName: 传信
      fleeChance: 0.5

  - species: tide_lurker
    name: 潮底潜伏者
    baseSequence: 7
    baseHp: 60
    habitat:
      - silver_city
      - giant_court
    pathwayAffinity: [ sleepless, warrior ]
    habits: [ nocturnal ]
    relations:
      role: consumer
      prey: [ grey_wraith, extra_028, horned_pegasus ]
      predators: []
      symbiosis: [ mist_herald, grey_wraith, whisperer ]
      parasite: []
    tickRate: hourly
    flavor: 水面下有一块影子，比水面本身更暗。
    drops:
      - { itemId: 主材料·梦境之核, chance: 0.3 }
      - { itemId: 海盐结晶, chance: 0.4 }
    behaviors:
      - flee: { trigger: hpLow, chance: 0.45 }
      - lurk: { trigger: night, chance: 0.25 }
    perception:
