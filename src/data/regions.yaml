# 世界地理（M2.7 主任务一）：区域 → 城市 → 地点
#
# 三处口径写在最前面：
#   1. pathways 是**设计意图**：任务书 §3.2 表里那些尚未实现的途径（门 / 秘法师 / 错误 /
#      观众 / 收尸人 / 窥秘人）记在这里，与 numeric.promotion.sequenceGating.planned
#      同一手法 —— 设计意图有一个可被引用的落点，而不是散在某份报告里。
#      **出生校验只读 cities.yaml 的 pathways**，这个字段没有任何代码读它。
#      M2.19：水手（sailor）已实现，所以它从这条口径里移出（取值域是已知途径的并集，
#      所以这几行仍然写得进去，只是不再代表「尚未实现」）。
#   2. danger 是 0—1 的区域危险度：它影响的是「这条路有多不安」，
#      不是「你能不能走」——能不能走只由 RouteSchema 的 cost/duration 与玩家的钱、AP 决定。
#   3. cities 是冗余索引（真相在 cities.yaml 的 region_id），
#      放它的唯一理由是一屏展示区域时不用再扫一遍城市表。
regions:
  - id: loen
    name: 鲁恩王国
    type: continent
    danger: 0.3
    cities: [ tingen, backlund, pritz, konstun, enmat, storn, beldan, limon, connate, banshee_port, damir_port, ramd_town, vinia_town, konstun, enmat, storn, beldan, limon, connate, banshee_port, damir_port, ramd_town, vinia_town, escosen_port ]
    # M2.71：补上 perfect（M2.26 给了 backlund）与 sailor（M2.19 给了 pritz）——
    # 这两条途径实现时只改了城市，区域这份设计记录没人读、也就没人同步。
    # 现在由 link-check 第 5 项守着：城市开放的途径必须在所属区域的 pathways 里。
    # M2.76：本区域所辖城市开放途径的**并集**（两处必须一致，link-check 守着）
    pathways: [ seer, sleepless, mystery_pryer, secrets_supplicant, warrior, perfect, door, spectator, lawyer, sailor, assassin, hunter, monster ]

  - id: intez
    name: 因蒂斯
    type: continent
    danger: 0.5
    cities: [ trier, bigorre, daliege, aumir, koldur, bigorre, daliege, aumir, koldur ]
    # M2.71：补上 reader（M2.26 第二批给了 trier）
    # M2.76：本区域所辖城市开放途径的**并集**（两处必须一致，link-check 守着）
    pathways: [ seer, warrior, reader, sun, error, arbiter ]

  - id: south
    name: 南大陆
    type: continent
    danger: 0.8
    cities: [ byron ]
    # M2.71：补上 mother（M2.26 第三批给了拜朗）
    # M2.76：本区域所辖城市开放途径的**并集**（两处必须一致，link-check 守着）
    pathways: [ sleepless, seer, mother, corpse_collector, apothecary, criminal, prisoner ]

  - id: sunia
    name: 苏尼亚海
    type: sea
    danger: 0.6
    cities: [ sunia ]
    # M2.76：原来写的是 mysticism（秘法师），而那个 id 在原著里没有落点（已删除）。
    # 苏尼亚海在设定上是风暴之主的地盘，所以这一片海设计上传承的就是 sailor ——
    # 它与上面的 `cities` 口径一致（海域只有一座城市 storm_cape，途径由区域决定）。
    # M2.76：本区域所辖城市开放途径的**并集**（两处必须一致，link-check 守着）
    pathways: [ sailor ]

  # 下面两个海域是任务书 §2.1 列出的另外两片海（迷雾海、狂暴海）。
  # 本版**没有城市**：它们是 M2.8 非凡生物分布与后续海域玩法的落点，
  # 现在只登记层级，不产生任何航线 —— 所以对现有玩法零影响。
  - id: mist_sea
    name: 迷雾海
    type: sea
    danger: 0.7
    cities: []
    pathways: []

  - id: rage_sea
    name: 狂暴海
    type: sea
    danger: 0.9
    cities: []
    pathways: []

