# 城市（M2.7 主任务二）：玩家出生的地方，也是「你能走哪条途径」的唯一依据。
#
# ⚠️ **M2.76：22 条正途径全部落地，所以 planned_pathways 一律清空。**
#    这一栏的语义是「地理上属于这里、但还没有内容」——正途径既然都有了内容，
#    留在这里只会让「哪条途径还没做」这件事看起来比实际更糟。
#    真正未实现的只剩《宿命之环》10 条**外神途径**，而它们不该由城市传承
#    （设定上它们不是「某座城的传承」，是外神的东西），所以也不写进来。
#
# 途径分配口径（任务书 §2.2「每个区域只开 2—3 条途径」）：
#
# 途径分配口径（任务书 §2.2「每个区域只开 2—3 条途径」）：
#   tingen   愚者 + 不眠者   —— 新手区，与任务书 §3.2 表一致
#   backlund 战士 + 愚者 + 完美者 —— 首都；任务书写「战士、门」，门尚未实现（M2.26 加 perfect）
#   pritz    不眠者 + 战士 + 水手 —— 港口；秘法师尚未实现（sailor 已在 M2.19 落地）
#   trier    愚者 + 战士     —— 异国；任务书写「错误、观众」，两条都尚未实现
#   byron    不眠者 + 愚者 + 母亲   —— 南大陆；任务书写「收尸人、窥秘人」，两条都尚未实现
#   sunia    （无）          —— 海域，出生权重 0：它只能被「到达」，不能被出生
#
# 这张分配表有一个刻意的性质：**每一条途径都至少有一座城市不开放它**。
# 于是「你所在的城市没有这条途径的传承」这句话在任何途径上都是可达的，
# 而不是一句永远走不到的死代码。
#
# center 是抵达时的落脚点：到达必须落到一个具体地点（通缉系统读的 flags.loc 是按地点存的），
# 否则玩家会带着上一座城市的地点下车，势力判定就错位了。
