    locations: [ tingen, mist_street, old_dock, candle_bookstore, graveyard_path, steam_station, dark_cellar, blackthorn_abbey, above_grey_fog, sealed_archive, fog_chapel, grey_loom, house_of_deja_vu, st_selena_cathedral, saint_number_church, river_and_sea_church, blackthorn_security, wild_heart_bar, hound_tavern ]
