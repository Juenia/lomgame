# 地点：序列区间 / 危险度 / 掉落表 / 可触发事件卡
# loot: itemId 权重 minQty maxQty bindType（bound 绑定 / unbound 非绑定）
# events: 该地点可触发的事件卡 id（与事件引擎的 cond 再取交集）
#
# M2.1（方案 E）：每个地点额外挂了 2 张 lost_* 失控卡。它们带 cond: status:lost_control，
# 引擎在 cond 过滤阶段就把它们剔掉 —— 普通日卡池完全不受影响（不稀释），
# 只有真正处在失控状态的角色探索到这里时，池子才变成「普通卡 + 2 张 lost_*」。
# 依据（实测失控日探索频次，200×14 首轮）：灰雾之上 0.96/天（普通日的 3.3 倍）、老码头 0.34、
# 无光地下室 0.33、黑荆棘修道院 0.29、贝克兰德 0.29…而失控日 .扮演 只有 0.26/天 ——
# lost_* 原先只挂在 .扮演 暴露通道上，等于挂在玩家失控当天几乎不用的那条路上。详见 docs/M2-交付说明.md 第五节。
# min_seq 数字越小要求越高：9 = 新号可进，8/7 = 晋升后开放
# adjacent（M2.2）：相邻地点 id，天气按这张图在 2 小时后同步（双向都要写，扩散时两边都看）
#
# M2.5 追加：掉落表里的货币 id 从「金镑」改成「便士」——值一个都没改，
# 改的是单位解释（8 现在是 8 便士，不是 8 金镑）。详见 docs/M2.5-货币交付说明.md。
