  # ================= M2.39 批次 B：序列 4、3 的深层产出点 =================
  #
  # ## 为什么是「新增」而不是「下沉」
  # 把既有地点的 min_seq 从 7 改成 5，会让 seer_6 / seer_7 的主材料**当年就违规**
  # （K17 要求 location.min_seq >= recipe.seq，5 >= 6 为假）⇒ 只能新增一层，不能下沉。
  #
  # ## 为什么 min_seq 取 5 而不是 4
  # min_seq 的语义是「序列 ≤ 5 的人进得去」。取 4 会把序列 5 的玩家挡在外面 ——
  # 他们没法先行囤货／卖钱，在 200 人规模的批里会把材料锁死在一个极小的人口上（K13 的形状）。
  # 5 是「更深、但仍然可交易」的那一档。
  #
  # ## danger 取 5（各途径设计稿写 6）
  # ⚠️ schema 的上限就是 5（domain/explore/location.ts 的 danger 是 int 0—5），
  #    写 6 会让 parseLocation 直接失败、loadContent 报 error、服务端起不来。
  #    全库 41 个地点的 danger 都在 0—5，5 已经是既有的最高档。
  #
  # ## loot 权重（每地点总权重 45）
  # seer 两味主材料是 2 / 1 ⇒ 命中率 2/45 = 4.4%、1/45 = 2.2%，
  # 相对序列 5 的 4/46 = 8.7% 正好「权重减半再减半」（设计稿 §4.3 的稀有度杠杆）。
  # 其余 42 点由辅料三味 + 灰雾结晶 + 便士填；后续途径落地时**从这些填充里让出权重**，
  # 保持每个地点的总权重不涨 —— 否则先落地的途径会被后面的途径稀释（M2.20 §五 的坑）。
  #
  # ⚠️ adjacent 必须**双向声明**（test/weather.test.ts 守着）：新地点指向谁，
