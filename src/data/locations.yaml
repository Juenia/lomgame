  # ==================================================================
  # M2.7 追加：四座新城市 + 一片海域，共 20 个地点
  #
  # 为什么这些地点的 min_seq 有 9 也有 8/7：
  #   min_seq = 9 的地点会自动进入 CI 的「新号可达地点」硬门
  #   （src/vplayer/coverage.ts 的 starterLocations），20×3 那一轮**必须每个都有人走到**。
  #   所以每座城市只把「城区 + 一两个当日可达的点」设成 9，
  #   更深、更危险的地方（灯塔、地下墓穴、走私者洞窟、遗迹）留给序列 8/7 —— 
  #   它们既是「晋升后才有得玩」的奖励，也不会把短轮 CI 逼红。
  #
  # 事件卡：本轮**不新增卡片**（M2.8 做区域专属卡）。
  #   新地点挂的是内容表里**不限定地点**的那批（daily_* 大多数、random_006、全部 lost_*），
  #   所以抽卡逻辑与老地点完全一致；挂了限定其它地点的卡只会永远抽不到，这里没有这么写。
  # ==================================================================

