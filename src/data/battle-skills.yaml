# 战斗技能表（M2.85 RPG 化 C）
#
# 共 110 条：22 途径 × 序列 9/7/5/3/1。
#
# ⚠️ 技能名与 text **逐条来自原作能力表**（pathway-abilities.yaml），source 字段就是那条能力的 id —— 可追溯、不编造。
#
# 效果数值（damageBonus / foeHitPenalty / …）是**项目派生值**：原著的描述里没有数字。
#
# 分类口径：关键词包含匹配（含「攻击/伤害/斩」= strike，含「防御/抵抗」= guard，
#
# 含「控制/迷惑/隐」= control，其余归 restore）—— 与 tags.ts 同一条原则，不用 LLM、不做分词。
meta:
  source: M2.85 RPG 化 C：**战斗深度** —— 技能从原作能力表派生
  count: 110
  note: ⚠️ 技能名与依据全部来自 src/data/pathway-abilities.yaml 的原文（source 字段指向能力 id），不是编造；效果数值是项目派生值。
  kind_note: 四类：strike 强攻 / guard 防御 / control 控制 / restore 辅助。分类用关键词包含匹配（与 tags.ts 同口径，不用 LLM、不做分词）。
  pick_note: 每个途径取序列 9/7/5/3/1 各一个 —— 与「技能是解禁不是升级」一致（序列越低，做得越多）。
  name_note: 技能名优先取原文引号里的专有名词；没有引号则取短语并清掉尾部虚词；仍然像句子就退回序列标题。
