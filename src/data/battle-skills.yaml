    text: “天罚”：从天而降的巨大闪电，并附带瓦解、净化、摧毁等力量，对试图超越自然或超出物质的目标行为有弱点攻击般的威能，同样的，对黑暗、死亡、堕落、污秽等领域的敌人也如此——部分“雷霆”权柄衍化而来；
    source: sailor_1_01
  - id: perfect_9_strike
