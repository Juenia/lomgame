    source: seer_1_04
  - id: warrior_9_strike
    pathway: warrior
    seq: 9
    name: 超越常人的力量
    mpCost: 5
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 超越常人的力量，超越常人的敏捷，各种武器防具精通，不存在无法使用的武器，各种格斗术掌握，不存在无法掌握的格斗流派。
    source: warrior_9_01
  - id: warrior_7_strike
    pathway: warrior
    seq: 7
    name: 超强的力量
    mpCost: 5
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 超强的力量，超强的体质，超强的敏捷，只要是武器，拿到手中，他就能以大师级水准使用，这包括非凡武器，或以剑、枪支等形式存在的神奇物品和封印物，并有效降低负面影响带来的伤害。
    source: warrior_7_01
  - id: warrior_5_strike
    pathway: warrior
    seq: 5
    name: 守护者
    mpCost: 12
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 凭借其非凡能力对任何类型的怪物都能造成伤害；不被幻觉迷惑。
    source: warrior_5_01
  - id: warrior_3_strike
    pathway: warrior
    seq: 3
    name: 巨龙
    mpCost: 20
    kind: strike
    effect:
      damageBonus: 0.8
      hitBonus: 0.05
    text: 守护力量实质化成了银色全身盔甲，承受打击的能力比“巨龙”要强不少。
    source: warrior_3_03
  - id: warrior_1_strike
    pathway: warrior
    seq: 1
    name: 代行
    mpCost: 32
    kind: strike
    effect:
      damageBonus: 0.8
      hitBonus: 0.05
