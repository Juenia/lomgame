    name: 剥夺生命
    mpCost: 20
    kind: strike
    effect:
      damageBonus: 0.8
      hitBonus: 0.05
    text: “剥夺生命”：每一次击中目标，都将使其接受死亡的考验，若无法通过，直接死亡，即使通过，也将承受生命的较大损失；一定范围内，死亡降临，哪怕没有接触，生命也将以较快的速度自然流逝。
