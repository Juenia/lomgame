    source: warrior_1_01
  - id: sleepless_9_strike
    pathway: sleepless
    seq: 9
    name: 夜越深
    mpCost: 5
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 夜越深，精力越充沛，力量、敏捷、思维、灵感也会愈发超越普通人；
    source: sleepless_9_03
  - id: sleepless_7_control
    pathway: sleepless
    seq: 7
    name: 塑梦
    mpCost: 5
    kind: control
    effect:
      foeHitPenalty: 0.2
    text: “塑梦”：让梦境如自己设想的那样发展，从而引导目标展现出秘密，或给予恐惧，击溃精神。
    source: sleepless_7_03
  - id: sleepless_5_strike
    pathway: sleepless
    seq: 5
    name: 在灵的掌控上有了
    mpCost: 12
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 在灵的掌控上有了极大的提升，其实力的强弱，很多时候要看他们究竟能找到并驱使哪些亡者和自然灵，灵巫更擅长驱使自然灵，可以将自然灵与怨魂幽影封印于牙齿之上，并通过敲动牙齿将其释放，获得这些灵体的帮助，完成一心两用，甚至三用的配合，不同种类灵所擅长的都不一样；
    source: sleepless_5_01
  - id: sleepless_3_strike
    pathway: sleepless
    seq: 3
    name: 黑暗之剑
    mpCost: 20
    kind: strike
    effect:
      damageBonus: 0.8
      hitBonus: 0.05
    text: “黑暗之剑”：从黑暗深处抽出的一把布满奇异花纹的骨制长剑，它来自黑暗的赐予，结合了安眠和恐惧的力量，挥舞长剑可使黑暗涌动，象征着黑暗里的危险，象征着无声无息的毁灭与消逝，目标被涌动的黑暗淹没后，会受到黑暗力量的感染而直接消融，化为潮水的一部分，若不提前预防，避无可避，躲无可躲。
    source: sleepless_3_01
  - id: sleepless_1_strike
    pathway: sleepless
    seq: 1
    name: 力量、敏捷、体质
    mpCost: 32
    kind: strike
    effect:
      damageBonus: 0.8
      hitBonus: 0.05
    text: 力量、敏捷、体质、速度一如骑士之名，大天使层面的骑士；
    source: sleepless_1_01
  - id: sailor_9_strike
    pathway: sailor
    seq: 9
    name: 卓越的力量
    mpCost: 5
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 拥有卓越的力量。在水中灵活得仿佛海族，能无保护下潜15米，哪怕不用任何装备，也能潜水至少十分钟；
    source: sailor_9_01
  - id: sailor_7_strike
    pathway: sailor
    seq: 7
    name: 航海家
    mpCost: 5
    kind: strike
    effect:
      damageBonus: 0.4
      hitBonus: 0.05
    text: 天文地理的学者，他们对磁场，对洋流、风向、云朵都有着直觉的把握。有“航海家”的船只从来不会在大海上迷路。计算力、记忆力、对距离的判断力得到强化。
    source: sailor_7_01
  - id: sailor_5_control
    pathway: sailor
    seq: 5
    name: 歌唱
    mpCost: 12
    kind: control
    effect:
      foeHitPenalty: 0.2
    text: “歌唱”：有用歌声影响目标的能力——因为每个人自身特质的不同，一种是用美妙的歌声干扰敌人的灵体，让他出现恍惚失神等状态，或者提高自身的爆发力；一种是模拟雷鸣，使人受到震慑；一种是靠杂乱难听的歌声让敌人烦躁，失去理智。仅凭纸团堵住耳朵和收敛灵性，只能减弱影响，没法真的隔绝。就算是失聪者，也一样能听见，这包含了灵性层面的“交流；“水幕”：
    source: sailor_5_05
  - id: sailor_3_strike
    pathway: sailor
    seq: 3
    name: 闪电风暴
    mpCost: 20
    kind: strike
    effect:
      damageBonus: 0.8
      hitBonus: 0.05
    text: “闪电风暴”：一道道银白电蛇蹿出，带着强烈得宛若实质的的暴虐毁灭气息，密密麻麻地劈向周围，将几百米的区域笼罩在雷霆森林内，被笼罩的生物破碎蒸发而消失不见。范围攻击，不会分辨敌我；
    source: sailor_3_02
  - id: sailor_1_strike
    pathway: sailor
