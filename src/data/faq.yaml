# 封测 FAQ（.帮助 faq 与 docs/FAQ.md 共用这一份来源）
faq:
  - q: 这是什么游戏？
    a: 《诡秘之主：群星低语》是一个 QQ 群文字游戏，扮演法养成 + 序列晋升 + 克苏鲁神秘学氛围。非商业同人内测。
  - q: 怎么开始？
    a: 私聊机器人发送 .创建 姓名（途径不用选 —— 创建出来的是普通人）。然后去 .探索：翻到配方线索（.线索 看进展），凑齐材料调出魔药、喝下去，你就走上第一条路了。
  - q: 每天能做什么？
    a: 扮演（10 秒冷却）、探索（每个地点每天最多 3 次）、事件、休息 / 净化（各每日 1 次）。没有行动点这类次数总闸 —— 探索是唯一能翻到配方线索的路子。
  - q: 怎么晋升？
    a: 调制本序列魔药 → 服用 → 用扮演把消化度刷到 60 以上 → 备齐主材料 ×2 → .晋升。失败会进重伤并损失材料，连续失败 2 次后成功率 +10%。
  - q: 失控了怎么办？
    a: .休息（MAD-5、HP+20）或 .净化（COR-15、MAD-8，消耗圣盐 ×1）可以解除；不管它会在次日自动解除。
  - q: 消化度为什么涨得慢？
    a: 同一标签每天只计 3 次，复读会递减。换着花样扮演（多命中几种契合标签）收益更高，回执里能看到每一步的算法。
  - q: 物品为什么有两种名字后缀？
    a: 绑定物品不能交易，非绑定可以。货币（便士）永远是非绑定。240 便士 = 1 金镑。
  - q: 交易安全吗？
    a: 物品在挂单时就被冻结，6 小时没人确认自动退回；成交收 5% 税；只允许非绑定物品。买卖双方都可以用 .取消 提前撤单。
  - q: 组队有什么用？
    a: 两人以上可以做 .队伍 任务（全员分赃），也能触发需要同伴的随机事件。
  - q: 数据会重置吗？
    a: 内测期间可能因为平衡调整重置存档，届时会提前在群里公告。不收费、不卖数值。
  - q: 遇到 bug 或想提建议？
    a: 发送 .反馈 内容，或直接联系客服 QQ。严重问题会进当天的日报。
