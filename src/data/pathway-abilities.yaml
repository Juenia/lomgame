  - id: sun_0_59
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 59
    text: 星界中的太阳概念
  - id: corpse_collector_9_01
    pathway: corpse_collector
    seq: 9
    sequenceTitle: 收尸人
    order: 1
    text: 具备一定的尸体特质，整个人显得颇为阴森，体温较低，从而避免被无智慧的亡灵袭击，同时，他们还获得了身体素质的提升，能承受腐烂、寒冷和死亡气息的侵蚀，天然具备灵视，能直接看见部分恶灵，并且了解诸多不死生物的特点和弱处。
  - id: corpse_collector_9_02
    pathway: corpse_collector
    seq: 9
    sequenceTitle: 收尸人
    order: 2
    text: 从这个阶段开始，本途径的非凡者会越来越畏惧阳光和净化。
  - id: corpse_collector_8_01
    pathway: corpse_collector
    seq: 8
    sequenceTitle: 掘墓人
    order: 1
    text: 体魄更为强壮，灵视更加厉害，身手更为敏捷，能初步沟通附近少量的灵。
  - id: corpse_collector_8_02
    pathway: corpse_collector
    seq: 8
    sequenceTitle: 掘墓人
    order: 2
    text: “死亡之眼”：像是能够进入灵性的世界和死灵的国度，从更高的层次俯视敌人，寻觅着那非常重要的节点。哪怕面对不熟悉的不死生物和灵界生物时，也能通过观察，很快找出它们的弱点。
  - id: corpse_collector_7_01
    pathway: corpse_collector
    seq: 7
    sequenceTitle: 通灵者
    order: 1
    text: 灵感变得极强，哪怕闭着眼睛，也能感应到周围隐藏起来的灵；
  - id: corpse_collector_7_02
    pathway: corpse_collector
    seq: 7
    sequenceTitle: 通灵者
    order: 2
    text: 掌握了各种与灵相关的神秘学仪式；对亡魂、自然灵而言，“通灵者”像是同类，危险性很低，若“通灵者”足够友善，它们甚至会主动给“通灵者”传递信息；
  - id: corpse_collector_7_03
    pathway: corpse_collector
    seq: 7
    sequenceTitle: 通灵者
    order: 3
    text: “通灵”：直接与现实世界的自然灵和徘徊的亡魂沟通，借助不同的灵来实现各种魔法，制造各种超自然现象，通灵术也能用在活着的生物身上，直接沟通他们的灵，以获取真实信息，但是有不小的危险；
  - id: corpse_collector_7_04
    pathway: corpse_collector
    seq: 7
    sequenceTitle: 通灵者
    order: 4
    text: “通灵者”还能伪装成活尸，忍受腐烂、寒冷、死亡等气息的侵蚀；
  - id: corpse_collector_7_05
    pathway: corpse_collector
    seq: 7
    sequenceTitle: 通灵者
    order: 5
    text: 相比前面两个序列，“通灵者”在体魄、身手方面并没有显著提升，但无论灵视，还是“死亡之眼”都变得更为厉害。
  - id: corpse_collector_6_01
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 1
    text: 从看到灵界到涉足灵界，并拥有了相当多的灵界知识；
  - id: corpse_collector_6_02
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 2
    text: 能自行招募信使，获得某些灵界生物的帮助；
  - id: corpse_collector_6_03
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 3
    text: 相比“通灵者”需要现场通灵，完成沟通，以实现不同的超凡效果，“死灵导师”可提前控制并驱使亡者和自然灵为自己战斗，但如何让这些亡者、自然灵始终跟随自己，不被发现，不受其他因素影响，是一个显著的难题；
  - id: corpse_collector_6_04
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 4
    text: “死灵导师”实力的强弱很多时候要看他们究竟能找到并驱使哪些亡者和自然灵，正常情况下，“死灵导师”更擅长利用亡者；
  - id: corpse_collector_6_05
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 5
    text: “复活”：唤起活尸和骷髅，这种“复活”不具有意志和生命力；
  - id: corpse_collector_6_06
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 6
    text: “亡者之语”：一种语言，能绕过血肉之躯保护，将针对灵体的沟通上升为驱使，甚至奴役；
  - id: corpse_collector_6_07
    pathway: corpse_collector
    seq: 6
    sequenceTitle: 死灵导师
    order: 7
    text: “死灵导师”很克制活尸、怨魂，甚至能有效针对恶灵，他们也可以直接控制无主的、位格相差不大的亡者群体，而面对同途径的高位者，他们的奴仆非常容易就会叛变，他们自己也是。
  - id: corpse_collector_5_01
    pathway: corpse_collector
    seq: 5
    sequenceTitle: 看门人
    order: 1
    text: 可感应到冥界的入口，驱使里面的亡灵，就像在守卫生与死的间隔，能有限度利用生与死之间的那扇神秘的、通往冥界的大门，比如，将烙印固化在掌心，关键时刻召唤出来，将目标吸入门后；
  - id: corpse_collector_5_02
    pathway: corpse_collector
    seq: 5
    sequenceTitle: 看门人
    order: 2
    text: 成为“看门人”后，非凡者能以身体为囚笼，创造一个独属于自己的小型“冥界”，容纳一定数量的魂体、亡者和自然灵，借此获得各种独特能力，拥有强大的帮手，无需走到哪里都必须带着一支亡灵大军，非常引人瞩目；
  - id: corpse_collector_5_03
    pathway: corpse_collector
    seq: 5
    sequenceTitle: 看门人
    order: 3
    text: · 此能力与相邻途径“不眠者”的序列5“灵巫”相像，不过“灵巫”体内产生的是用于封印灵体的安眠地，且更擅长驱使自然灵，“看门人”偏向于驱使亡者。
  - id: corpse_collector_5_04
    pathway: corpse_collector
    seq: 5
    sequenceTitle: 看门人
    order: 4
    text: · 一般情况下，小型“冥界”的入口在非凡者的眉心；
  - id: corpse_collector_4_01
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 1
    text: 拥有漫长的生命，但每隔六十年就会死去一次，复活一次，并遗忘掉过去绝大部分记忆，需要于后续慢慢找回，就像在开启新的人生；
  - id: corpse_collector_4_02
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 2
    text: “不死者”每死亡一次，就会于永暗之河留下一个死亡印记，死太多次会受河水冲刷，再也无法找回记忆，灵智和理性也会逐渐降低，最终成为徘徊的不死怪物；
  - id: corpse_collector_4_03
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 3
    text: 与冥界联系得更为紧密，以此为定位，具备一定的灵界穿梭能力；
  - id: corpse_collector_4_04
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 4
    text: 能借助冥界力量对物品进行封印；
  - id: corpse_collector_4_05
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 5
    text: 肉体的打击不再致命，除非被完全摧毁；
  - id: corpse_collector_4_06
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 6
    text: “亡者之语”：不死者的“亡者之语”已构建出与死亡、魂灵、活尸、凋零、奴役等有关的一整套法术体系；
  - id: corpse_collector_4_07
    pathway: corpse_collector
    seq: 4
    sequenceTitle: 不死者
    order: 7
    text: “冥界之门”：直接利用冥界的力量创造有利于自身的战斗环境，并让目标承受来自冥界的吸引、召唤和呓语，若“不死者”在冥界有足够的关系或运气非常好，甚至能利用“冥界之门”，让某些危险的不死生物回归现实世界。
  - id: corpse_collector_3_01
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 1
    text: 具备了一定的死亡权柄，与其对视的生灵将直接死亡，哪怕拥有神性也会遭受重创；
  - id: corpse_collector_3_02
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 2
    text: 即使没有视线的接触，被摆渡人纳入眼睛的目标也将缓慢凋零，就像在一寸寸渡过死亡的河流；
  - id: corpse_collector_3_03
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 3
    text: 净化之外的大部分攻击都对摆渡人无效；
  - id: corpse_collector_3_04
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 4
    text: 摆渡人不会自然死亡，因为逐渐往有灵智的不死生物方向转化，所以摆渡人不会在冥界瞬间死亡；
  - id: corpse_collector_3_05
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 5
    text: 能于冥河内浮起而不下沉，即使面对永暗之河的支流乃至本体，也能浮起很短暂的一段时间（当前阶段是两秒）；
  - id: corpse_collector_3_06
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 6
    text: 被“摆渡人”的左手触碰，将几乎不可逆转地走向死亡，但再被“摆渡人”的右手触碰，可解除这种情况，回归活着的状态——“摆渡人”来回于生与死之间；
  - id: corpse_collector_3_07
    pathway: corpse_collector
    seq: 3
    sequenceTitle: 摆渡人
    order: 7
    text: 在冥河或冥河支流附近，摆渡人能有效利用它们的力量。
  - id: corpse_collector_2_01
    pathway: corpse_collector
    seq: 2
    sequenceTitle: 死亡执政官
    order: 1
    text: “完全的死亡”：剥夺一片区域内的所有生命力，绝大多数复活、替身能力在面对死亡执政官时都将无效——涉及历史和变化的奇迹师复活能力不在这个范围内；
  - id: corpse_collector_2_02
    pathway: corpse_collector
    seq: 2
    sequenceTitle: 死亡执政官
    order: 2
    text: “亡者之王”：死亡执政官自身的小型“冥界”可以容纳一支强大的不死生物大军，同时，死亡执政官还能直接从冥界找来帮手；
  - id: corpse_collector_2_03
    pathway: corpse_collector
    seq: 2
    sequenceTitle: 死亡执政官
    order: 3
    text: “奴役”：低于序列2的“收尸人”途径非凡者难以反抗死亡执政官的命令；不死生物，哪怕天使级的恶灵，在面对死亡执政官时也异常脆弱；
  - id: corpse_collector_2_04
    pathway: corpse_collector
    seq: 2
    sequenceTitle: 死亡执政官
    order: 4
    text: “死亡之国”：创造一片充斥死亡和苍白力量的区域（相当于一座大城市），在这个区域内的生命，若不够强大，会立刻死亡，转化为不死生物，具备一定神性的也会慢慢凋零，逐渐死亡；
  - id: corpse_collector_2_05
    pathway: corpse_collector
    seq: 2
    sequenceTitle: 死亡执政官
    order: 5
    text: 死去的死亡执政官同样是死亡执政官，生与死对祂们来说，界限不再分明，只有依靠特殊的能力或办法，才能将死亡执政官彻底抹去，还原为非凡特性；
  - id: corpse_collector_2_06
    pathway: corpse_collector
    seq: 2
    sequenceTitle: 死亡执政官
    order: 6
    text: 前面序列能力的增强。
  - id: corpse_collector_1_01
    pathway: corpse_collector
    seq: 1
    sequenceTitle: 苍白皇帝
    order: 1
    text: “灵之主宰”：非能力，而是具备的特质，来源于“奴役”权柄的特质，无需刻意，就变得极为尊贵，缺少生者的气息，如同高踞无数亡灵之上的虚幻神灵，任何具备灵的生物，苍白皇帝都能压制乃至奴役（不再局限于不死生物和同途径的非凡者），或让他们一点点死去，或让他们一点点死去并成为自己的奴隶；
  - id: corpse_collector_1_02
    pathway: corpse_collector
    seq: 1
    sequenceTitle: 苍白皇帝
    order: 2
    text: “苍白世界”：创造一个失去所有颜色只剩苍白的国度，在这里，颜色会死亡，非凡能力也会凋零——也就是说，任何表现出颜色的非凡能力在苍白世界都将遭受极大削弱，随着时间推移，更是会完全无效；
  - id: corpse_collector_1_03
