  - id: reader_0_63
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 63
    text: 三份“全知之眼”非凡特性
  - id: reader_0_64
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 64
    text: 装满自身掌握的全部知识且蕴藏着旧日遗物（半旧日的遗留也算）的一座高塔
  - id: mother_9_01
    pathway: mother
    seq: 9
    sequenceTitle: 耕种者
    order: 1
    text: 力气变得很大；
  - id: mother_9_02
    pathway: mother
    seq: 9
    sequenceTitle: 耕种者
    order: 2
    text: 能通过观察云朵、风等自然现象预测之后一段时间的天气；
  - id: mother_9_03
    pathway: mother
    seq: 9
    sequenceTitle: 耕种者
    order: 3
    text: 擅于分辨种子，培育它们，用农具比用刀和枪更适合耕种者。
  - id: mother_8_01
    pathway: mother
    seq: 8
    sequenceTitle: 医师
    order: 1
    text: 主要能力是“治疗”，可以通过‘灵视’判断病人的具体情况，拥有出色的外科手术能力，缝合断肢、移植内脏这些；
  - id: mother_8_02
    pathway: mother
    seq: 8
    sequenceTitle: 医师
    order: 2
    text: 即使不开“灵视”，也能从目标身体的诸多外在表现里看出潜藏的疾病；
  - id: mother_8_03
    pathway: mother
    seq: 8
    sequenceTitle: 医师
    order: 3
    text: 获得了‘治疗恶疾’、‘治疗创伤’、‘缝合灵魂’、‘给予生命’这几个超凡能力：
  - id: mother_8_04
    pathway: mother
    seq: 8
    sequenceTitle: 医师
    order: 4
    text: · “治疗恶疾”和“治疗创伤”：属于“治疗”分类，对于能无障碍接触到的，可直接治愈，比如，让手掌闪烁明净的微光，按住伤口，伤口收缩蠕动，飞快融合，而没法无障碍接触的，必须打开腔体，触碰到受伤的部位，那也就相当于做一场外科手术；
  - id: mother_8_05
    pathway: mother
    seq: 8
    sequenceTitle: 医师
    order: 5
    text: · “缝合灵魂”：可以治疗灵魂创伤的，有的超凡能力可以攻击到灵魂，并让它难以自愈，这种时候，只要伤者放开了身心，不做阻挡，就可以进行一场灵魂层面的手术，将对应的伤口缝合起来。理论上也可以切割灵魂，但需要对应的人完全放开了身心，让灵魂没有保护，要是连肉体都不存在，那就更好。这可以是对灵魂的攻击，但应该也是一种治疗的手段，如果哪位患者是因为受到诅咒，灵魂被污染了部分，就能通过切割掉堕落之处，让灵魂缓慢自愈来应对；
  - id: mother_8_06
    pathway: mother
    seq: 8
    sequenceTitle: 医师
    order: 6
    text: · “给予生命”：让处于虚弱状态的人逐渐恢复精力。
  - id: mother_7_01
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 1
    text: 主要是促进生物繁衍和生长，以超凡能力带来丰收。
  - id: mother_7_02
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 2
    text: 治疗方面的能力有了拓展，可以治疗植物和农田的疾病。
  - id: mother_7_03
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 3
    text: 能催化种子，让它们更快生长或繁衍，这分成两种情况：
  - id: mother_7_04
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 4
    text: · 一是双手按在大地之上，可以让大约三十米范围内的种子、植物都比正常快不少地生长，或更好地繁衍，但没法让它们在几十秒几分钟内就爆发出所有生命力，走完从孕育到回归的全部路程；
  - id: mother_7_05
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 5
    text: · 直接握住一些种子或植物，将它们蕴含的生命完全催化出来。体现在可以短时间内制造出大量的藤蔓，让它们发挥纠缠敌人，控制敌人的作用。如果能获得不同种类的变异植物种子，催化能力可以在战斗中发挥不小的作用。
  - id: mother_7_06
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 6
    text: 能驱使三十米范围内的不具有智慧的植物和虫豸，让它们在不超过自身种族限制的情况下，提供相应的帮助。
  - id: mother_7_07
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 7
    text: 得到了几个仪式魔法，主要是祈求下雨、祈求天晴之类的。
  - id: mother_7_08
    pathway: mother
    seq: 7
    sequenceTitle: 丰收祭司
    order: 8
    text: 身体各方面有一定的提升，但不多。
  - id: mother_6_01
    pathway: mother
    seq: 6
    sequenceTitle: 生物学家
    order: 1
    text: 对生物的特性都有深刻的了解；
  - id: mother_6_02
    pathway: mother
    seq: 6
    sequenceTitle: 生物学家
    order: 2
    text: 能杂交各种生物，产生奇奇怪怪的产物，在成为半神之前，这些产物都缺少灵魂；
  - id: mother_6_03
    pathway: mother
    seq: 6
    sequenceTitle: 生物学家
    order: 3
    text: 自身能产生剧毒（通过头发等方式富集和释放）。
  - id: mother_5_01
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 1
    text: 德鲁伊是自然的宠儿，橡树的眷者，能有效地依靠植物和动物做各种事情。
  - id: mother_5_02
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 2
    text: 他们能化身为巨熊战斗，也可以短暂化身为晋升仪式所包含的那些生物，只是无法使用相应生物的超凡能力；
  - id: mother_5_03
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 3
    text: 能汲取泥土里的养分和空气，掌握诸多涉及大地的法术，比如“地底潜行”、“沼泽”、“自然憎恶”、“橡树之子”等。
  - id: mother_5_04
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 4
    text: · “地底潜行”：脚下的大地顿时软化，变成了“沼泽”，让使用者身体就像坠入大海一样飞快沉了下去，然后于地底潜行；
  - id: mother_5_05
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 5
    text: · “沼泽”：让目标脚底或一片区域（三十米范围）沼泽化，以限制目标的行动，甚至直接埋葬对方；
  - id: mother_5_06
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 6
    text: · “自然憎恶”：指定一个人或不超过五十人为敌对者，周围的环境将憎恶他们，给予他们足够的干扰，若环境本身存在较强的危险因素，那这些危险将极大可能以敌对者为目标爆发（比如，在山崖下战斗，上方的岩石若有掉下砸落的较高风险，那这个风险会显著增强，甚至必然爆发，如果这个风险本身发生的概率很低，则不会出现）；
  - id: mother_5_07
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 7
    text: · “橡树之子”：制造一层石头或木质皮肤来保护自己。
  - id: mother_5_08
    pathway: mother
    seq: 5
    sequenceTitle: 德鲁伊
    order: 8
    text: 前面序列其他能力的混合和提升，比如，将双掌按在了地面，让目标所在位置一根根墨绿色的变异藤蔓刺破大地，疯狂滋长，比如，将手中的头发扔出。这些头发一根根自行燃烧，散发出了乌黑的效果未知的剧毒。
  - id: mother_4_01
    pathway: mother
    seq: 4
    sequenceTitle: 古代炼金师
    order: 1
    text: 能驱使智慧不高的超凡生物，短时间内降低它们的疯狂程度；
  - id: mother_4_02
    pathway: mother
    seq: 4
    sequenceTitle: 古代炼金师
    order: 2
    text: 能以残缺的灵和各种材料，完成极致的“生命炼成”，这可以创造能长久存在的普通人类，也可以制造用于战斗和各种事务的不同人偶，包括石魔像，土魔像，钢铁魔像，这些魔像具备与自身材料相符的大地系特质和法术；
  - id: mother_4_03
    pathway: mother
    seq: 4
    sequenceTitle: 古代炼金师
    order: 3
    text: 能让攻击到的人的疯狂与失控的倾向都会增加，身体也有一定的概率异变；
  - id: mother_4_04
    pathway: mother
    seq: 4
    sequenceTitle: 古代炼金师
    order: 4
    text: 能让触碰的生灵，无论有多么严重的伤势，都能痊愈，已开始失控的除外；
  - id: mother_4_05
    pathway: mother
    seq: 4
    sequenceTitle: 古代炼金师
    order: 5
    text: 能让周围充满生命力，无论植物，还是动物，都能蓬勃生长，快速繁殖；
  - id: mother_4_06
    pathway: mother
    seq: 4
    sequenceTitle: 古代炼金师
    order: 6
    text: 前面序列能力的提升，比如，能短暂变成一种不具备神性的超凡生物，但前提是了解相应的神秘学知识和身体结构、非凡纹路。
  - id: mother_3_01
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 1
    text: 是“母亲”途径构建现实循环的重要组成部分，以此牵连到死亡、回归等权柄。
  - id: mother_3_02
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 2
    text: “恶灵化”：能让十公里范围内的所有死者都变成可怕的恶灵，并为自己战斗——服食过自己创造的食物，或与自己存在其他强联系的人，五十公里内都会变成恶灵。
  - id: mother_3_03
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 3
    text: “剥夺生命”：每一次击中目标，都将使其接受死亡的考验，若无法通过，直接死亡，即使通过，也将承受生命的较大损失；一定范围内，死亡降临，哪怕没有接触，生命也将以较快的速度自然流逝。
  - id: mother_3_04
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 4
    text: “回归大地”：十公里范围类的死灵类生物，将迅速消散，回归大地，回归母亲的怀抱，哪怕有死灵具备神性，也只能多支撑几秒钟——完整的神话生物可避免这种影响。
  - id: mother_3_05
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 5
    text: “母性拥抱”：作为“母亲怀抱”具象的棺材和大地为“抬棺人”提供了封印死灵类天使的可能；
  - id: mother_3_06
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 6
    text: 能直接用泥土变成魔像并给予生命和力量，最强不超过序列4，数量上限是3个；
  - id: mother_3_07
    pathway: mother
    seq: 3
    sequenceTitle: 抬棺人
    order: 7
    text: 其他能力的提升。
  - id: mother_2_01
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 1
    text: 晋升至该序列的非凡者若是男性，将变为女性。
  - id: mother_2_02
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 2
    text: “荒芜主母”掌握着部分“大地”权柄、部分“荒芜”权柄、部分“丰收”权柄和部分“生命”权柄，能在任何环境下创造可食用的植物，并在五十公里范围内促进它的生长、繁育和丰收。
  - id: mother_2_03
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 3
    text: 能让三百公里范围内的土地变得肥沃，水流变得充沛，生命的繁衍倾向增加，让再不利的环境条件都无法阻止生命孕育后代，只能降低数量和频率。也能让三百公里范围的大地变得荒芜，粮食绝产，植物凋零，除非荒芜效果结束，否则这片土地不会再变得肥沃，这可以被类似净化的天使层次能力压制，让荒芜只局限于很小的范围内，无法蔓延。
  - id: mother_2_04
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 4
    text: “荒芜主母”还能让五十公里范围布满各种剧毒，长出各种有利于自身的超凡植物，还能驯化这片区域内所有不具备高等智慧的动物，让每一个非凡者的失控倾向变强。
  - id: mother_2_05
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 5
    text: “荒芜”：使三十公里范围内的所有生命飞快流逝，直至死亡，相似领域之外的能力亦会因此逐渐凋零，遭到削弱，而不具备生命的亡者进入这片领域，将快速回归大地。
  - id: mother_2_06
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 6
    text: 之前序列能力的提升：
  - id: mother_2_07
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 7
    text: · 可以从泥土里、植物中、岩浆内、矿石里、金属中制造一个个人偶，并赋予它们一定的生命和力量，最强的人偶不超过序列3，半神层次的人偶数量上限为九个；
  - id: mother_2_08
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 8
    text: · 能让五十公里范围内的所有死者都变成可怕的恶灵，服食过自己创造的食物，与自己存在强联系的人，三百公里内都会变成恶灵；
  - id: mother_2_09
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 9
    text: · 每一次击中目标，都将使其接受失控的考验，同时也接受死亡的考验，若无法通过，或当场失控，或直接死亡。
  - id: mother_2_10
    pathway: mother
    seq: 2
    sequenceTitle: 荒芜主母
    order: 10
    text: · 能短暂变成一种神话生物，但需要能承受相应神话生物形态带来的神秘学知识和疯狂意念冲击。
  - id: mother_1_01
    pathway: mother
    seq: 1
    sequenceTitle: 自然行者
    order: 1
    text: 掌握着部分“自然”权柄和部分”母亲权柄”。
  - id: mother_1_02
    pathway: mother
    seq: 1
    sequenceTitle: 自然行者
    order: 2
    text: “自然之子”：可以改造环境，让深渊都变得适合人类生存；
  - id: mother_1_03
    pathway: mother
    seq: 1
    sequenceTitle: 自然行者
    order: 3
    text: 能与范围内的大地、树林、水流、山峰、矿石等自然要素真正成为一体，可以借助它们穿梭，速度各有不同（在西大陆，这被称为各种遁法），也能直接借助或利用它们的力量；
  - id: mother_1_04
    pathway: mother
    seq: 1
    sequenceTitle: 自然行者
    order: 4
    text: 同时，万物的母亲也是“概念”的母亲，属于广义“自然”概念的事物都能与“自然之子”亲和，被祂驱使，比如，火，雷电、太阳、月亮等。
  - id: mother_1_05
    pathway: mother
    seq: 1
    sequenceTitle: 自然行者
    order: 5
    text: “创造世界”：能孕育和创造一个属于“自然”概念的世界（对主体宇宙来说，相当于画中世界、镜中世界、更完善的异度空间等）。
  - id: mother_1_06
    pathway: mother
    seq: 1
    sequenceTitle: 自然行者
    order: 6
    text: 之前序列能力的提升。
  - id: mother_0_01
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 1
    text: 神国：丰饶乐土——这里填充着“母亲”自定义的自然和生命、死亡等，但还未能形成真正的完整循环；
  - id: mother_0_02
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 2
    text: 上位权柄：“母亲”、“大地”、“自然”、部分“死亡”、部分“生命”；
  - id: mother_0_03
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 3
    text: 下位权柄：“荒芜”、“治疗”、“炼成”、“回归”、“丰收”等。
  - id: mother_0_04
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 4
    text: “母亲”权柄由“万物之母”象征衍化来的权柄：“母亲”孕育万物，包括神灵、“概念”和世界；
  - id: mother_0_05
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 5
    text: “大地”权柄由“万物之母”和“污秽的母巢”两个象征衍化而来：原本“大地”是“自然”的一部分，但被赋予了生命的起源、万物的母巢和最后回归之地等概念，以完成现实循环后，从“自然”独立了出来——“大地”权柄的一些应用：令大地碎裂，让目标坠入地心的混沌海，这同样是一种回归；
  - id: mother_0_06
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 6
    text: “自然”权柄由”根源之神“象征衍化而来：“现实世界”的一部分，难以被彻底摧毁和真正封印，除非自己愿意，或回归真正母神，或被取代——“自然”权柄的一些应用：能令植物疯长，形成能够隔绝真神攻击的自然屏障；
  - id: mother_0_07
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 7
    text: 部分“死亡”权柄由“根源之神”和“污秽的母巢”衍化而来：从此来，到此去，是为根源，而到此去就是死亡，“污秽的母巢”也有这样的象征，同时也指向了污染、失控和身体异变；
  - id: mother_0_08
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 8
    text: 部分“生命”权柄由“万物之母”和“根源之神”衍化而来；
  - id: mother_0_09
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 9
    text: “荒芜”权柄由“自然”和“死亡”交叉而来；
  - id: mother_0_10
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 10
    text: “治疗”源于“母亲”和“生命”；
  - id: mother_0_11
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 11
    text: “炼成”同样来自“母亲” 和“生命”；
  - id: mother_0_12
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 12
    text: “回归”由“大地”和“死亡”衍生而来；
  - id: mother_0_13
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 13
    text: “丰收”是“自然”和“生命”的下位。
  - id: mother_0_14
    pathway: mother
    seq: 0
    sequenceTitle: 母亲
    order: 14
    text: 权柄综合性应用举例：将敌人变成植物同时凋零，回归母亲的怀抱。
