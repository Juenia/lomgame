  - id: perfect_9_01
    pathway: perfect
    seq: 9
    sequenceTitle: 通识者
    order: 1
    text: 记忆、学习和实践能力的非凡化，相信知识就是力量，对神秘学有粗略的了解，对王水、硝酸甘油和复杂的齿轮装置等更加精通，他们似乎什么都懂。
  - id: perfect_9_02
    pathway: perfect
    seq: 9
    sequenceTitle: 通识者
    order: 2
    text: 核心能力是唤醒记忆，能记起自己看过的所有知识。
  - id: perfect_8_01
    pathway: perfect
    seq: 8
    sequenceTitle: 考古学家
    order: 1
    text: 拥有足够的历史知识，野外生存知识，以及遗迹相关的禁忌知识。
  - id: perfect_8_02
    pathway: perfect
    seq: 8
    sequenceTitle: 考古学家
    order: 2
    text: 有足够强壮的体魄和能力来面对许多问题，但仅勉强能应用一些仪式魔法。
  - id: perfect_7_01
    pathway: perfect
    seq: 7
    sequenceTitle: 鉴定师
    order: 1
    text: 可以不用占卜、不依靠推理，快速鉴定神奇物品。
  - id: perfect_7_02
    pathway: perfect
    seq: 7
    sequenceTitle: 鉴定师
    order: 2
    text: 能直觉地把握到大部分超凡物品的能力和问题，能尽量规避危险地使用它们。
  - id: perfect_6_01
    pathway: perfect
    seq: 6
    sequenceTitle: 机械专家
    order: 1
    text: 可以制造机械奇物和不算强的非凡物品。无论在现实，还是神秘学领域，都是当之无愧的制造大师，通过他们之手成形的超凡物品负面影响低，能发挥的效果好。
  - id: perfect_6_02
    pathway: perfect
    seq: 6
    sequenceTitle: 机械专家
    order: 2
    text: 仪式魔法的水平会得到提升。
  - id: perfect_5_01
    pathway: perfect
    seq: 5
    sequenceTitle: 天文学家
    order: 1
    text: “虚假星象”：伪造出一片虚假的星空，迷惑目标或干扰目标的占星；
  - id: perfect_5_02
    pathway: perfect
    seq: 5
    sequenceTitle: 天文学家
    order: 2
    text: “虚假星象”带来的星象变化，还能在百米范围内引起对应的现象，比如，潮汐，比如，电磁紊乱。
  - id: perfect_5_03
    pathway: perfect
    seq: 5
    sequenceTitle: 天文学家
    order: 3
    text: “星之祝福”：引来星光，改变区域内或对应目标所受重力。
  - id: perfect_5_04
    pathway: perfect
    seq: 5
    sequenceTitle: 天文学家
    order: 4
    text: “星之诅咒”：星光凝聚的射线，可带来衰弱、变异、创伤等不同效果。
  - id: perfect_5_05
    pathway: perfect
    seq: 5
    sequenceTitle: 天文学家
    order: 5
    text: “天文学”：“天文学家”如果初步弄清楚了不同天文现象的本质，可以在一定程度内加以利用，比如，在有“太阳风暴”时，引导已抵达屏障内、处于自身能力范围中的能量和物质做一定的集中，干扰或攻击目标，比如，有“流星雨”时，引导来具备一定重量的火雨——能力强度都在序列5范畴内。
  - id: perfect_5_06
    pathway: perfect
    seq: 5
    sequenceTitle: 天文学家
    order: 6
    text: 当然，宇宙很危险，“天文学”很危险，一不小心，“天文学家”就会遭遇各种恐怖、诡异的事情，比如，研究“血月”现象，想利用它时，会发现自己莫名其妙怀上了孩子，或自己不再是自己。
  - id: perfect_4_01
    pathway: perfect
    seq: 4
    sequenceTitle: 炼金术士
    order: 1
    text: “炼成”：能就地取材快速制造出各种临时人偶和器物，达成不同的效果（取决于环境材料）——这里致敬“钢之炼金术师”，也能提前预备好具有更强大能力的长期性魔偶；能为自己制造的物品注入灵魂，给予一定的生命，但其生命炼成不如母亲途径的古代炼金师——灵魂和生命力不是凭空创造出来的，它们来自灵界的残魂碎片和对周围生命的抽取。“炼成”是“炼金术士”最核心的能力，如果有高序列的材料，他们甚至能制造出对抗天使的东西。
  - id: perfect_4_02
    pathway: perfect
    seq: 4
    sequenceTitle: 炼金术士
    order: 2
    text: 除去战斗，“炼金术士”在日常生活里有更为广泛的作用，“机械天堂”不仅仅是对“完美者”神国的描述，也是对“炼金术士”平时表现的认可。
  - id: perfect_4_03
    pathway: perfect
    seq: 4
    sequenceTitle: 炼金术士
    order: 3
    text: 之前序列能力的提升。
  - id: perfect_3_01
    pathway: perfect
    seq: 3
    sequenceTitle: 奥秘学者
    order: 1
    text: “汲取”：能从周围5公里内的生物处抽取生命力。
  - id: perfect_3_02
    pathway: perfect
    seq: 3
    sequenceTitle: 奥秘学者
    order: 2
    text: “解离”：能发射一道光芒，破坏绝大多数物品的结构，让目标被彻底分解，化作片片屑末落地，就连色彩都蒸发般飞快消散——这是“解析”和“规律”权柄共同延伸出的应用。
  - id: perfect_3_03
    pathway: perfect
    seq: 3
    sequenceTitle: 奥秘学者
    order: 3
    text: “环境掌控者”：可以真切地提取周围的环境信息，并从这些信息反向推导出曾经发生过什么事情。虽然无法还原完整的场景，但能确认一定区域内发生过的战斗状况，与涉及的序列层次以及残余气息；无论在什么环境下，都能有效地利用环境来增强自身，削弱目标。
  - id: perfect_3_04
    pathway: perfect
    seq: 3
    sequenceTitle: 奥秘学者
    order: 4
    text: “知识妖精”：让自身转化为一定的知识（有时间限制，取决于转化的知识具体是什么，从五分钟到五天不等），也就是说，当一个人、一位超凡者，打开书本，阅读文字或学习知识时，那段信息可能就是“知识妖精”所化，“知识妖精”借此进入目标的心智体，隐蔽地影响他的思维、智力，完成侵蚀乃至污染；“知识妖精”还能活跃于灵界，给予从灵界获取信息的人一定的误导或污染。
  - id: perfect_3_05
    pathway: perfect
    seq: 3
    sequenceTitle: 奥秘学者
    order: 5
    text: 之前序列能力的提升。
  - id: perfect_2_01
    pathway: perfect
    seq: 2
    sequenceTitle: 知识导师
    order: 1
    text: 可转化为与文明画卷有关的信息生物，但还无法呈现完整的文明图卷。
  - id: perfect_2_02
    pathway: perfect
    seq: 2
    sequenceTitle: 知识导师
    order: 2
    text: 一定的“规律”权柄：能对物理规律进行一定程度的改变，燃烧未必会出现火焰，冰霜或许会带来温暖，大地不再承载重量。
  - id: perfect_2_03
    pathway: perfect
    seq: 2
    sequenceTitle: 知识导师
    order: 3
    text: 增强的“解析”权柄：能看到天使的本质并据此拟定战术。
  - id: perfect_2_04
    pathway: perfect
    seq: 2
    sequenceTitle: 知识导师
    order: 4
    text: 弱化的“制造”权柄：能制造出自身想象的绝大部分物品，哪怕与超凡相关的，在缺乏材料的情况下，也能有临时性的替代物。弱化的“学习”权柄：看一遍就学会不再是传说。
  - id: perfect_2_05
    pathway: perfect
    seq: 2
    sequenceTitle: 知识导师
    order: 5
    text: “导师”：由“教化”权柄衍生而来，拥有“考验”他人的能力，并且很擅长教导他人。
  - id: perfect_2_06
    pathway: perfect
    seq: 2
    sequenceTitle: 知识导师
    order: 6
    text: 之前序列能力的提升。
  - id: perfect_1_01
    pathway: perfect
    seq: 1
    sequenceTitle: 启蒙者
    order: 1
    text: 可展现出完整的文明图卷。
  - id: perfect_1_02
    pathway: perfect
    seq: 1
    sequenceTitle: 启蒙者
    order: 2
    text: 一定的“文明”权柄：可以让混沌沉淀出少许秩序，可以让毁灭焕发出微弱新生，可以让黑暗迸发起初光，可以依靠“文明”的重量冲击、束缚、碾压目标。
  - id: perfect_1_03
    pathway: perfect
    seq: 1
    sequenceTitle: 启蒙者
    order: 3
    text: 一定的“教化”权柄：可提升目标智慧，可给予启迪和灵感，可让敌人困在数理的迷宫里，或达成类似的效果。
  - id: perfect_1_04
    pathway: perfect
    seq: 1
    sequenceTitle: 启蒙者
    order: 4
    text: 之前序列能力的提升。
  - id: perfect_0_01
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 1
    text: 知识（信息）象征下偏现实的那部分权柄。
  - id: perfect_0_02
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 2
    text: “现实知识”权柄：掌握现实世界已被发现的全部知识，并能对它们做一定的修改，在大陆层面立即生效，在星球层面迅速生效，在星系层面逐渐生效，在此之外无效；可让目标短暂失去对应的知识，被知识排斥；可让目标掌控的知识变成有利于自身的潜伏者、污染者。
  - id: perfect_0_03
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 3
    text: 部分“教化”权柄：给予他人知识的权柄，而和“隐者”不同的是，更强调启蒙、引导、考验和体系化。
  - id: perfect_0_04
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 4
    text: “文明”权柄：文明的兴衰，文明的重量，文明沉淀出来的浩瀚知识，“完美者”可以指定一个族群或者一个国家、一片大陆、乃至一个星球，让它们永远处于野蛮蒙昧状态，或是快速迭代、进化文明。
  - id: perfect_0_05
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 5
    text: 部分“规律”权柄（偏现实部分）：规律是知识的一部分，掌握了规律，就能让世界的运转更有利于自身。
  - id: perfect_0_06
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 6
    text: “灵界导师”权柄：“完美者”和“隐者”共享“灵界导师”权柄。
  - id: perfect_0_07
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 7
    text: “学习”权柄：既可以让自身一学就会，也能让他人怎么都学不会。
  - id: perfect_0_08
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 8
    text: “制造”权柄：知识组合出奇迹之物、近神之物、超凡之物。
  - id: perfect_0_09
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 9
    text: “解析”权柄：迅速分析出甚至直接看出事物的本质，然后加以利用。
  - id: perfect_0_10
    pathway: perfect
    seq: 0
    sequenceTitle: 完美者
    order: 10
    text: 神国名称：机械天堂或是文明墓园、完美之地
