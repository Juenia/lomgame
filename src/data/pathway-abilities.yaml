    seq: 0
    sequenceTitle: 魔女
    order: 9
    text: “混沌”的下位“疾病”：灾难的组成，原初魔女成为了“疾病”概念本身，而这样的概念可以附加在任何事物上，同样的，“瘟疫”权柄也是如此，除了能制造各种各样可侵蚀神灵的神秘学病原体，还可直接给一片区域附加瘟疫概念。
