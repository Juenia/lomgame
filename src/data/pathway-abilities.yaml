    order: 60
    text: 一个秩序完全崩塌的异度空间
  - id: monster_9_01
    pathway: monster
    seq: 9
    sequenceTitle: 怪物
    order: 1
    text: 灵感极高，经常能听见别人听不见的声音，看到别人看不到的事物，以至于偶尔能窥见未来的画面，对危险有着敏锐的直觉预感。
  - id: monster_9_02
    pathway: monster
    seq: 9
    sequenceTitle: 怪物
    order: 2
    text: 常会陷入某种恍惚的状态，呢喃起别人听不懂的话语，以至于被当成真正的怪物。
  - id: monster_8_01
    pathway: monster
    seq: 8
    sequenceTitle: 机器
    order: 1
    text: 拥有恐怖的计算能力和精准的控制力，与身体相关的各方面素质都明显增强，成为格斗、射击等领域的天赋者。
  - id: monster_8_02
    pathway: monster
    seq: 8
    sequenceTitle: 机器
    order: 2
    text: 拥有了占卜和反占卜的能力。
  - id: monster_7_01
    pathway: monster
    seq: 7
    sequenceTitle: 幸运儿
    order: 1
    text: 在日常生活里经常会遇上出门捡钱、人体描边、投骰如同期望、喜欢的女孩子刚好喜欢自己等事情，但无法控制，属于被动，而且，这种幸运并不固定，有高低起伏，有时特别厉害，有时如同普通人，所以很难完全依靠，得尽量节制。
  - id: monster_6_01
    pathway: monster
    seq: 6
    sequenceTitle: 灾祸教士
    order: 1
    text: 会被动地遭遇各种可以预见的灾祸，可以提前做好准备，找到消除或解轻影响的办法。
  - id: monster_6_02
    pathway: monster
    seq: 6
    sequenceTitle: 灾祸教士
    order: 2
    text: 能主动地引来不同程度的灾祸，将目标或敌人波及进去，自身则依靠幸运方面的“特长”，规避掉绝大部分危险，趁乱发动攻击，简单来说就是，他们能够将对手拉入最能发挥自身优势的环境，充分利用自身被动遭遇的那些危险来打击敌人。
  - id: monster_6_03
    pathway: monster
    seq: 6
    sequenceTitle: 灾祸教士
    order: 3
    text: “精神风暴”：依靠自身高于其他途径的灵性，直接影响对方的精神体，带来一定程度的眩晕或心智的迷失，如果“灾祸教士”的敌人进入了后面那种状态，就会非常容易犯错，让灾祸越滚越大，直至将他吞噬。
  - id: monster_5_01
    pathway: monster
    seq: 5
    sequenceTitle: 赢家
    order: 1
    text: 能在某种程度上掌控住自身的幸运，可以依靠本身的节制，积累起大量的"幸运"，在关键时刻以戏剧性的方式多次化解致命危机，也能时不时在平常生活里遇到概率极低的好事。
  - id: monster_5_02
    pathway: monster
    seq: 5
    sequenceTitle: 赢家
    order: 2
    text: 直觉预感达到很强的水准，无论在占卜还是反占卜方面都称得上神秘学专家。
  - id: monster_5_03
    pathway: monster
    seq: 5
    sequenceTitle: 赢家
    order: 3
    text: 能有限度地给予敌人厄运，让目标变得较为倒霉。
  - id: monster_4_01
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 1
    text: 厄运领域：目标（不限数量 ）进入一定范围后将会自然染上厄运（该范围从100米到300米不等，视厄运法师本身状态、魔药消化程度等决定）。
  - id: monster_4_02
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 2
    text: “赐福”：消耗自身运气给予特定目标祝福，让他变得幸运，或者，将目标未来的幸运挪到当前；
  - id: monster_4_03
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 3
    text: “群体赐福”：与“赐福”相同，但只能通过消耗自身运气的方式来实现，可以给予一个群体（自身50米范围内所有生灵，对本身运气消耗很大，可选择哪些给，哪些不给）；
  - id: monster_4_04
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 4
    text: “厄运诅咒”：诅咒目标，让他变得极度倒霉，厄运会威胁到生命那种；
  - id: monster_4_05
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 5
    text: “精神风暴”：与序列6的“精神风暴”相比，这有了质变，不仅仅是通过超高的灵性影响对方的精神体，带来眩晕和迷失，还会引起精神和思绪的混乱，带来一点疯狂；
  - id: monster_4_06
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 6
    text: “水银之躯”：身体素质极大增强，获得质变，同时被动的反占卜反预言特性也得到明显提升；
  - id: monster_4_07
    pathway: monster
    seq: 4
    sequenceTitle: 厄运法师
    order: 7
    text: “绝对灵感”：对命运的变化，对道标的存在，对高位者，有着绝对的灵感。
  - id: monster_3_01
    pathway: monster
    seq: 3
    sequenceTitle: 混乱行者
    order: 1
    text: 部分混乱权柄。
  - id: monster_3_02
    pathway: monster
    seq: 3
    sequenceTitle: 混乱行者
    order: 2
    text: “混乱”：让既定的命运重新变得混乱，结果不再注定；让目标的精神与命运向更混乱更疯狂的方向发展；
  - id: monster_3_03
    pathway: monster
    seq: 3
    sequenceTitle: 混乱行者
    order: 3
    text: “命运看守者”：可以在混乱复杂的命运里，敏锐地“看见”其中混乱、疯狂的部分，从而绕过它们或封印它们；
  - id: monster_3_04
    pathway: monster
    seq: 3
    sequenceTitle: 混乱行者
    order: 4
    text: “精神洗礼”：如同给婴儿施洗一样，让目标的精神重新变得洁净、平稳，不再混乱，如同最初；
  - id: monster_3_05
    pathway: monster
    seq: 3
    sequenceTitle: 混乱行者
    order: 5
    text: 之前序列其他能力的提高。
  - id: monster_2_01
    pathway: monster
    seq: 2
    sequenceTitle: 先知
    order: 1
    text: 部分“命运”权柄（涵盖“好运”，“厄运”，“预知”三大下位权柄）。
  - id: monster_2_02
    pathway: monster
    seq: 2
    sequenceTitle: 先知
    order: 2
    text: “福祸之言”：能在30公里范围内给予生灵厄运或好运。
  - id: monster_2_03
    pathway: monster
    seq: 2
    sequenceTitle: 先知
    order: 3
    text: “命运启示”：凝视命运长河，得到想要的启示和预言。其中，对未来的预言可以是真实的，也可以是虚假的，如果有人相信了虚假的预言，并为规避它或迎接它做了准备，那预言将变成真实的；另外。在情况混乱，选择众多，且只有很少的路途能通向好的结局的情况下，可以通过预言来获得启示。启示需要解读，正确解读会引领询问者走向最好的终点，反之则非常危险。
  - id: monster_2_04
    pathway: monster
    seq: 2
    sequenceTitle: 先知
    order: 4
    text: “预言术”：可以预言让某些人、某些事因厄运和好运出现不同的结果，它们有很大概率会变成真的，即使最终的结果不符合预言，也会近似。
  - id: monster_2_05
    pathway: monster
    seq: 2
    sequenceTitle: 先知
    order: 5
    text: “水银之躯”（完整的神话生物形态）：身体与命运长河发生了奇妙联系和难以描述的融合，成为了命运的宠儿，一旦遭受攻击，有着十秒内不被命中不被影响的被动能力，其后还会持续的幸运。
  - id: monster_1_01
    pathway: monster
    seq: 1
    sequenceTitle: 巨蛇
    order: 1
    text: 部分“循环”权柄（以及对应的下位“保存”和“选择”权柄）。
  - id: monster_1_02
    pathway: monster
    seq: 1
    sequenceTitle: 巨蛇
    order: 2
    text: 能掩盖自身命运的特殊。
  - id: monster_1_03
    pathway: monster
    seq: 1
    sequenceTitle: 巨蛇
    order: 3
    text: 遇到难以摆脱的危险时可以重启循环、逆转为胚胎。每一次重新开始，都尽量让自己有点不同，以便保持良好的心理状态，小孩阶段就该有小孩的样子。每一次重启都会洗掉疯狂，不过依旧需要一定的信仰定位，否则无法维持水银之蛇的状态太久。
  - id: monster_1_04
    pathway: monster
    seq: 1
    sequenceTitle: 巨蛇
    order: 4
    text: “命运循环”：能让人陷入某个奇特状态中，那里的时间保持着一定程度的流动，但又固定在某个范围内，循环往复，平衡延续，也就是相对静止。
  - id: monster_1_05
    pathway: monster
    seq: 1
    sequenceTitle: 巨蛇
    order: 5
    text: “重启”：又称命运之重启或万物之重启。能重启一定区域内的状态或发生的事情，但不属于逆转时光，类似于用之前保存的存档覆盖现在的。
  - id: monster_0_01
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 1
    text: 一定程度上等于命运的化身，能于命运长河中遨游。
  - id: monster_0_02
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 2
    text: “命运”象征衍化而来的“命运”权柄（非权柄，别的途径也有涉及部分命运权柄）：命运的化身，既是“好运”，也是“厄运”，更擅长“预知”；其中，部分“预知”权柄：不仅能通过把握命运长河，得到未来的画面和必将出现的道标，而且还可以深刻影响短时间内的命运长河支流，让自身做出的预言得到确切的实现——类似的大预言术；
  - id: monster_0_03
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 3
    text: “概率”权柄：“命运”象征衍化来的另一大权柄，万事皆可概率化，这是命运的混乱本质的体现之一，掌握了概率，就掌握了万物的命运；
  - id: monster_0_04
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 4
    text: “循环”权柄：“回归”象征衍化来的权柄，归于母体，归于源头，归于最初，是宇宙的本能；
  - id: monster_0_05
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 5
    text: · 其下位有“保存”权柄和“选择”权柄：
  - id: monster_0_06
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 6
    text: · “保存”是指复刻命运长河过去某段命运，可替换当前命运片段（极限是复刻的那段命运距离当前不超过三分钟）
  - id: monster_0_07
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 7
    text: · “选择”是指可在众多的命运支流选定一条，比如，通往“重启”的；
  - id: monster_0_08
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 8
    text: “混乱”权柄：“混乱”象征的体现之一，命运的本质是混乱，体现着疯狂，“命运之轮”看守着它们，又利用着它们。
  - id: monster_0_09
    pathway: monster
    seq: 0
    sequenceTitle: 命运之轮
    order: 9
    text: 光锥世界：命运途径的神国，完全概率化的界域，一举一动都对应着不同点数的骰子，而“命运之轮”可以操纵这些虚幻的骰子。
