    pathway: sleepless
    seq: 1
    sequenceTitle: 厄难骑士
    order: 5
    text: “灵之统帅”：能让自然灵和亡灵们沉睡，也能统御它们。
  - id: sleepless_0_01
    pathway: sleepless
    seq: 0
    sequenceTitle: 黑暗
    order: 1
    text: “隐秘”：权柄，能隐藏各方面的痕迹，误导相应的窥探和占卜，能将任何事物变得“隐秘”或解除这种“隐秘”，能直观地看到和掌握诸多隐秘，能将隐秘之地化为隐秘世界，这既可以作为隐秘的神国，也可以作为封印之地；
  - id: sleepless_0_02
    pathway: sleepless
    seq: 0
    sequenceTitle: 黑暗
    order: 2
    text: “黑暗”：权柄，可以让目标入梦，可以让目标安宁和永眠，可以让目标被黑暗消融，成为黑暗的一部分，同时，因为黑暗是宇宙最基本的象征之一，是最主要的旋律，所以，掌握这个权柄的真神在黑暗中不死，能借助黑暗复活；
  - id: sleepless_0_03
    pathway: sleepless
    seq: 0
    sequenceTitle: 黑暗
    order: 3
    text: “恐惧”：权柄，恐惧情绪的具现，和欲望母树的权柄有交叉和重合；
  - id: sleepless_0_04
    pathway: sleepless
    seq: 0
    sequenceTitle: 黑暗
    order: 4
    text: “灵体灵性”：权柄，是灵的归处，是它们的主宰，和伟大母亲和死神的权柄有交叉重合；
  - id: sleepless_0_05
    pathway: sleepless
    seq: 0
    sequenceTitle: 黑暗
    order: 5
    text: “厄运和灾难”：权柄，因厄运而带来灾难，与魔女、猎人途径的灾难权柄有一定交叉重合，与命运途径亦然。
