  - id: secrets_supplicant_9_01
    pathway: secrets_supplicant
    seq: 9
    sequenceTitle: 秘祈人
    order: 1
    text: 灵感获得极大提升，能够察觉到某些神秘恐怖的存在。
  - id: secrets_supplicant_9_02
    pathway: secrets_supplicant
    seq: 9
    sequenceTitle: 秘祈人
    order: 2
    text: 掌握了一定的祭祀知识和少量仪式魔法。
  - id: secrets_supplicant_9_03
    pathway: secrets_supplicant
    seq: 9
    sequenceTitle: 秘祈人
    order: 3
    text: 或多或少都会出现认知、观点上的扭曲，且容易失控。
  - id: secrets_supplicant_8_01
    pathway: secrets_supplicant
    seq: 8
    sequenceTitle: 倾听者
    order: 1
    text: “倾听”：能直接听到对应的隐秘存在的耳语，所以他们往往可以获得不少强大、扭曲、独特的能力，但相应的，如果无法获得晋升，很难存活超过五年，所有的“倾听者”都是疯子，哪怕平时表现得很正常，也必然是隐藏的疯子。
  - id: secrets_supplicant_8_02
    pathway: secrets_supplicant
    seq: 8
    sequenceTitle: 倾听者
    order: 2
    text: 即使不主动使用“倾听” 的非凡能力，也会在正常环境里比普通人和绝大部分中低序列非凡者听见得更多，当声源距离足够近的时候，将受到更大的影响，获得更多的危险的信息。
  - id: secrets_supplicant_7_01
    pathway: secrets_supplicant
    seq: 7
    sequenceTitle: 隐修士
    order: 1
    text: “藏入阴影”：又称融入阴影、进入阴影。可以躲藏在阴影中，运用阴影的力量，隐蔽地跟踪敌人。
  - id: secrets_supplicant_7_02
    pathway: secrets_supplicant
    seq: 7
    sequenceTitle: 隐修士
    order: 2
    text: “召唤阴影”：召唤源自阴影世界的生物，影响、限制或攻击目标，这是一个危险的能力，因为召唤出来的很可能是不受自身控制的、相当可怕的东西，也可能是只以召唤者为食的怪物。
  - id: secrets_supplicant_7_03
    pathway: secrets_supplicant
    seq: 7
    sequenceTitle: 隐修士
    order: 3
    text: “阴影诅咒”：利用目标的影子对他施加一定的诅咒，这要么需要仪式配合，要么有目标的血肉或部分影子作为媒介。
  - id: secrets_supplicant_7_04
    pathway: secrets_supplicant
    seq: 7
    sequenceTitle: 隐修士
    order: 4
    text: “操纵阴影”：藏入阴影之后，于阴影世界内影响目标的影子，甚至尝试捕获。
  - id: secrets_supplicant_7_05
    pathway: secrets_supplicant
    seq: 7
    sequenceTitle: 隐修士
    order: 5
    text: “阴影塑形”：直接利用阴影的力量，将它们塑造成武器或动物，这类物品会附带让目标冰冷、堕落的伤害。
  - id: secrets_supplicant_6_01
    pathway: secrets_supplicant
    seq: 6
    sequenceTitle: 蔷薇主教
    order: 1
    text: 将血肉织成能抵御法术减少伤害的披风。
  - id: secrets_supplicant_6_02
    pathway: secrets_supplicant
    seq: 6
    sequenceTitle: 蔷薇主教
    order: 2
    text: 让身体忽然如蜡烛般融化，化成纯粹的黏稠的血肉，或飞快渗透入地面移动，或诡异地躲到其他人体内，和宿主的血肉融合，借此规避各种侦查，但当钻出来的时候，宿主会因此失去生命，也能安静地待在宿主的胃袋，监控宿主状态，这种情况钻出来的时候，宿主不会死亡。
  - id: secrets_supplicant_6_03
    pathway: secrets_supplicant
    seq: 6
    sequenceTitle: 蔷薇主教
    order: 3
    text: “血肉炸弹”：自身或身体撕下来的一部分炸弹般膨胀炸开，一团团血肉化作风暴席卷周围，能腐蚀物体。也可以将血肉炸弹埋入他人体内，将他们的身体引爆，化成粘稠的浓郁的血肉。
  - id: secrets_supplicant_6_04
    pathway: secrets_supplicant
    seq: 6
    sequenceTitle: 蔷薇主教
    order: 4
    text: “血肉诅咒”：千万不要让自身的血肉落到蔷薇主教手上。
  - id: secrets_supplicant_6_05
    pathway: secrets_supplicant
    seq: 6
    sequenceTitle: 蔷薇主教
    order: 5
    text: “血肉仆役”：利用血肉创造傀儡，这些傀儡拥有很大的力量，不怕针对灵的攻击，还能自爆。
  - id: secrets_supplicant_5_01
    pathway: secrets_supplicant
    seq: 5
    sequenceTitle: 牧羊人
    order: 1
    text: “放牧”：“牧羊人”核心能力，能将别人的灵魂，包括怨魂和恶灵，吞噬到体内，并用独特的方式驱使这些灵魂，就像在为神灵放牧羔羊一样，可以有挑选地选取被驱使灵魂的三种能力使用，最高能放牧七个灵魂。能瞬间改变被驱使的灵魂。
  - id: secrets_supplicant_5_02
    pathway: secrets_supplicant
    seq: 5
    sequenceTitle: 牧羊人
    order: 2
    text: · 一次只能驱使一个灵魂，只能使用这个灵魂对应的非凡能力和本身的非凡能力，而如果想用新的灵魂替换掉原本的某个灵魂，那过程将无法逆转，没有反悔的机会。
  - id: secrets_supplicant_5_03
    pathway: secrets_supplicant
    seq: 5
    sequenceTitle: 牧羊人
    order: 3
    text: · 放牧的对象如果有半神层次，因其灵体坚固，可以直接外放，但一次只能一个。
  - id: secrets_supplicant_5_04
    pathway: secrets_supplicant
    seq: 5
    sequenceTitle: 牧羊人
    order: 4
    text: · 随着序列的提高，“牧羊人”途径的圣者和天使，能放牧的灵魂能使用的非凡能力会越来越多。
  - id: secrets_supplicant_5_05
    pathway: secrets_supplicant
    seq: 5
    sequenceTitle: 牧羊人
    order: 5
    text: · “放牧”被窃取、剥夺后，会导致体内非凡特性混杂而失控。
  - id: secrets_supplicant_5_06
    pathway: secrets_supplicant
    seq: 5
    sequenceTitle: 牧羊人
    order: 6
    text: “掌控阴影”：“操纵阴影”的进阶：能直接操纵不属于生灵的深厚阴影，让它们拥有实感，将目标束缚于内，压扁挤缩，腐蚀融化。
  - id: secrets_supplicant_4_01
    pathway: secrets_supplicant
    seq: 4
    sequenceTitle: 黑骑士
    order: 1
    text: “黑骑士”：化身为两米三四的小巨人，通体覆盖着黑色的，冰冷的盔甲，只有眼睛位置，闪烁着两团深红光芒的黑暗骑士，手持笔直幽深的大剑，而仿佛由“堕落”力量组成的黑色盔甲能完全吸收攻击，通过自己的四分五裂避免了本体受到影响。
  - id: secrets_supplicant_4_02
    pathway: secrets_supplicant
    seq: 4
    sequenceTitle: 黑骑士
    order: 2
    text: “放牧”：可外放已放牧的灵魂，外放的灵魂可使用全部非凡能力，放牧灵魂的数量提升至九个。
  - id: secrets_supplicant_4_03
    pathway: secrets_supplicant
    seq: 4
    sequenceTitle: 黑骑士
    order: 3
    text: “灵肉之刃”：最核心的非凡能力，源于“堕落”领域——手臂长的异常锋利的刀刃，不仅能腐蚀血肉，泯灭灵魂，斩破屏障，还可以让任何有堕落意念的生物防御失效。
  - id: secrets_supplicant_4_04
    pathway: secrets_supplicant
    seq: 4
    sequenceTitle: 黑骑士
    order: 4
    text: “堕落之影”：将自己内心的堕落意念分离出来，和影子结合，形成一个不受控制的独立生物。能利用它清除了内心不属于自己的意识。能崩解成一片幽黑，并使碰到幽黑的物体沾染上一层粘稠的漆黑，或瞬间腐蚀断裂，或堕落并反过来攻击敌人，也能让阴影化为铠甲进行防御。
  - id: secrets_supplicant_4_05
    pathway: secrets_supplicant
    seq: 4
    sequenceTitle: 黑骑士
    order: 5
    text: “统御阴影”：控制目标的影子，让其突然活了过来，水流般上淹，将目标死死缠住。这个影子略等于几分之一个目标，因此被切割下影子后，其灵会失去完整性。
  - id: secrets_supplicant_4_06
    pathway: secrets_supplicant
    seq: 4
    sequenceTitle: 黑骑士
    order: 6
    text: 前面序列其他能力的升阶。
  - id: secrets_supplicant_3_01
    pathway: secrets_supplicant
    seq: 3
    sequenceTitle: 三首圣堂
    order: 1
    text: 两侧肩头分别长出一个蒙着阴影的头颅，一个年轻、一个老迈，每个头颅都能带走三分之一的躯体，并通过血肉魔法瞬间变得完整。
  - id: secrets_supplicant_3_02
    pathway: secrets_supplicant
    seq: 3
    sequenceTitle: 三首圣堂
    order: 2
    text: “放牧”：序列3层次的牧羊人能力。可以同时驱使三个灵魂，三个头颅各驱使一个，放牧灵魂的总数提升到十三个。
  - id: secrets_supplicant_3_03
    pathway: secrets_supplicant
    seq: 3
    sequenceTitle: 三首圣堂
    order: 3
    text: “阴影替身之术”：能让自己的影子替换本体承受伤害。
  - id: secrets_supplicant_3_04
    pathway: secrets_supplicant
    seq: 3
    sequenceTitle: 三首圣堂
    order: 4
    text: “血肉不灭”：只要还剩一个细胞，只要周围还有别的血肉可供补充，三首圣堂就能重塑肉身，当然，前提是灵体未灭——这是血肉权柄（血肉权柄是异变权柄的下位）的体现，长出三个脑袋同样如此。
  - id: secrets_supplicant_2_01
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 1
    text: “秽语”：
  - id: secrets_supplicant_2_02
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 2
    text: · 说自己时，每一个单词都在提升层次和力量；
  - id: secrets_supplicant_2_03
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 3
    text: · 利用目标的回答，截取其中部分或扩大歧义，制造言灵类效果，如囚禁，堕落分裂等；
  - id: secrets_supplicant_2_04
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 4
    text: · 直接的诅咒，带来堕落和污秽。
  - id: secrets_supplicant_2_05
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 5
    text: · 诱使目标堕落——精神上的灵肉之刃，只要目标有堕落意念，就无法抵御秽语的影响。
  - id: secrets_supplicant_2_06
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 6
    text: “秽语”是堕落和污秽权柄的体现。
  - id: secrets_supplicant_2_07
    pathway: secrets_supplicant
    seq: 2
    sequenceTitle: 秽语长老
    order: 7
    text: 阴影、血肉等领域的能力进一步加强，放牧灵魂的数量是十八个。
  - id: secrets_supplicant_1_01
    pathway: secrets_supplicant
    seq: 1
    sequenceTitle: 暗天使
    order: 1
    text: “黑暗”：权柄体现，可以变出一片漆黑的，粘稠的，满是堕落气息的“海洋”，将敌人的攻击吞噬进去，消弭于无形。或在敌人的体表染上一层粘稠的黑色液体，以此造成干扰。
  - id: secrets_supplicant_1_02
    pathway: secrets_supplicant
    seq: 1
    sequenceTitle: 暗天使
    order: 2
    text: “秽语”：更进一步的堕落，带着强烈“堕落”感的声音，使敌人的生命难以遏制地流逝，不完整神话生物形态自带的疯狂愈发强烈。
  - id: secrets_supplicant_1_03
    pathway: secrets_supplicant
    seq: 1
    sequenceTitle: 暗天使
    order: 3
    text: “阴影统治者”：可以掌控并利用阴影世界，但还不是阴影世界的主宰。
  - id: secrets_supplicant_1_04
    pathway: secrets_supplicant
    seq: 1
    sequenceTitle: 暗天使
    order: 4
    text: “堕落眷属”：放牧的每个灵魂（最多二十二个）都可以外放出来成为自身的临时眷属——可同时，而这些灵魂受堕落权柄影响，会全身心地听从暗天使的命令，充分发挥自己的能力。
  - id: secrets_supplicant_0_01
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 1
    text: “阴影之主”：阴影世界的主宰；
  - id: secrets_supplicant_0_02
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 2
    text: “暗”：与黑夜女神相比，倒吊人的黑暗更偏向于包容吞噬一切的黑暗和堕落人心的黑暗；
  - id: secrets_supplicant_0_03
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 3
    text: “堕落自性”：每个生灵的堕落自性具现；
  - id: secrets_supplicant_0_04
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 4
    text: “污秽化身”：自身被“混沌海”污染，也污染万物，与“暗”和“堕落自性”结合在一起，就能外显出“混沌海”的少许影响。
  - id: secrets_supplicant_0_05
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 5
    text: “异变”：其神力能在黑暗中凭空制造怪物，本身也具备复活的特殊性（血肉不灭的质变），“异变”还能在某种程度上影响万事万物的变化，这是和“愚者”有一定交叉的权柄。
  - id: secrets_supplicant_0_06
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 6
    text: “替罪”：代替目标承受伤害和死亡；让敌人的主要攻击目标变成自己；
  - id: secrets_supplicant_0_07
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 7
    text: “倒吊人”：牺牲自我换取确凿的希望。
  - id: secrets_supplicant_0_08
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 8
    text: 会唱歌的黑蘑菇一朵
  - id: secrets_supplicant_0_09
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 9
    text: 深黯蝙蝠一只
  - id: secrets_supplicant_0_10
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 10
    text: 红葡萄酒100毫升
  - id: secrets_supplicant_0_11
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 11
    text: 于教堂内供奉过的蜡烛一截
  - id: secrets_supplicant_0_12
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 12
    text: 任意毒蘑菇一朵
  - id: secrets_supplicant_0_13
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 13
    text: 马鞭草粉末10克
  - id: secrets_supplicant_0_14
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 14
    text: 厄运黑猫的耳朵
  - id: secrets_supplicant_0_15
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 15
    text: 地穴爬行者的心脏（类似穿山甲的超凡生物）
  - id: secrets_supplicant_0_16
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 16
    text: 红葡萄酒100毫升
  - id: secrets_supplicant_0_17
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 17
    text: 面包一份
  - id: secrets_supplicant_0_18
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 18
    text: 厄运黑猫的心脏
  - id: secrets_supplicant_0_19
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 19
    text: 海棠花精油10滴
  - id: secrets_supplicant_0_20
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 20
    text: 阴影蠕虫一条
  - id: secrets_supplicant_0_21
    pathway: secrets_supplicant
    seq: 0
    sequenceTitle: 倒吊人
    order: 21
