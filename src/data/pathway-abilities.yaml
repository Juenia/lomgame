  - id: arbiter_9_01
    pathway: arbiter
    seq: 9
    sequenceTitle: 仲裁人
    order: 1
    text: 倾向于维护当前秩序，拥有让人信服的魅力和足够的权威，以及应对意外的出色格斗能力。
  - id: arbiter_9_02
    pathway: arbiter
    seq: 9
    sequenceTitle: 仲裁人
    order: 2
    text: 而这样的魅力和权威，还会让与“仲裁人”发生冲突的生物不自觉想要屈服。
  - id: arbiter_8_01
    pathway: arbiter
    seq: 8
    sequenceTitle: 治安官
    order: 1
    text: “治安官”只要见过真人、照片或素描，就能牢牢记住目标的样子，获得超凡层面上的额外感应，同样的，他们还对自己走过的路线有神秘学意义上的记忆能力。
  - id: arbiter_8_02
    pathway: arbiter
    seq: 8
    sequenceTitle: 治安官
    order: 2
    text: “治安官”能够察觉到不正常的因素，把握到不明显的痕迹。当距离足够近时，能侦察感应到与邪恶、混乱、疯狂相关的未做屏蔽的事物。
  - id: arbiter_8_03
    pathway: arbiter
    seq: 8
    sequenceTitle: 治安官
    order: 3
    text: “辖区”：“治安官”可以指定一片区域为自己的“辖区”，大约为一个小镇，若得到官方的正式任命，管辖面积可以更大，但不能超过一般情况的五倍。“治安官”对“辖区”越熟悉、越得到这里民众的信赖或支持，那他越能发挥出超越本身的实力，并得到环境的一定帮助，一旦超出范围或刚获得“管辖权”，不够熟悉，就只能单纯依靠非凡能力。
  - id: arbiter_8_04
    pathway: arbiter
    seq: 8
    sequenceTitle: 治安官
    order: 4
    text: “治安官”在监控和被监控方面有着敏锐的直觉，身体素质也得到了有效提升，还获得了便携式冷兵器精通和手枪、猎枪等便携式热武器精通。
  - id: arbiter_7_01
    pathway: arbiter
    seq: 7
    sequenceTitle: 审讯者
    order: 1
    text: 精通各种武器的使用，成为了爆破专家。
  - id: arbiter_7_02
    pathway: arbiter
    seq: 7
    sequenceTitle: 审讯者
    order: 2
    text: 拥有一定的体质提升。
  - id: arbiter_7_03
    pathway: arbiter
    seq: 7
    sequenceTitle: 审讯者
    order: 3
    text: 可以在手上召唤出烙铁等虚幻刑具，使用它们可直接对灵体造成伤害，但需有接触，不能隔空。
  - id: arbiter_7_04
    pathway: arbiter
    seq: 7
    sequenceTitle: 审讯者
    order: 4
    text: “精神刺穿”：不是干扰思绪，影响精神的非凡能力，而是直接攻击灵体的手段，本质上来讲，其他是作用于“心智体”，它的目标是“精神体”，两者有显著区别。能带来灵体层面的威压，凝聚精神，无视肉身，穿刺目标灵体，直接攻击他们的精神，带来难以克制的疼痛，有效范围五米以内。
  - id: arbiter_7_05
    pathway: arbiter
    seq: 7
    sequenceTitle: 审讯者
    order: 5
    text: “痛苦之鞭”：直接攻击别人精神，使目标感觉精神内似有一道道电流窜过，连成带刺的鞭子，不断地抽打灵魂，这种“味道”又痛又麻，仿佛源自大脑深处，让人无法抵御，只能瑟瑟发抖，膝盖变软，坦白交代，不敢撒谎。
  - id: arbiter_6_01
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 1
    text: “仲裁人”的权威获得质变，不仅能影响目标，还可以影响环境：“法官”们可以使用古赫密斯语等超自然语言，对一定区域立下新的规则或做出相应的判决，区域内的事物都得遵守规则或判决结果行动，若是违背会受到规则的束缚，常见的宣判有：
  - id: arbiter_6_02
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 2
    text: · “禁止”：往前推掌，可用古赫密斯语制定禁止某种行为、非凡能力的规则，强迫一定范围内的所有人遵守——在有准备，只做辅助的情况下，可以在一定程度内影响圣者，未必有效，但能造成一些干扰。当前阶段，针对特定种族或个体的“禁止”还无法直接杀死目标，只能造成持续的压制或将他们排斥出禁止的作用区域。
  - id: arbiter_6_03
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 3
    text: · “囚禁”：制造一层又一层透明的墙壁与流淌着的粘稠到极点的透明液体，将目标凝固在原地，灵体也难以透过。可以使用“释放”来解除，不会触发“镜子替身”等能力，除非提前已经使用。
  - id: arbiter_6_04
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 4
    text: · “禁闭”：作用于一定区域的“囚禁”。
  - id: arbiter_6_05
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 5
    text: · “鞭打”：挥动手，使目标似乎被无形的软鞭抽中，能抽得衣物破碎，皮肉绽开，白骨露出。
  - id: arbiter_6_06
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 6
    text: · “流放”：制造一股无形的磅礴力量，连灵体也能吹飞。
  - id: arbiter_6_07
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 7
    text: · “死亡”：宣判目标死亡后，身体与某种奇特的力量合一，拖着残影撞到敌人身上，拳头则以无法抵抗无法躲避的姿态准确命中目标的头部，造成强大的杀伤力。也可指着目标身上的某个位置，带来强烈的伤害。
  - id: arbiter_6_08
    pathway: arbiter
    seq: 6
    sequenceTitle: 法官
    order: 8
    text: · “守秘”：与目标对视，眼睛闪烁奇异光芒，令对方觉得必须按照吩咐去做，不外泄秘密。
  - id: arbiter_5_01
    pathway: arbiter
    seq: 5
    sequenceTitle: 惩戒骑士
    order: 1
    text: 肉身足够结实、体魄足够强健。
  - id: arbiter_5_02
    pathway: arbiter
    seq: 5
    sequenceTitle: 惩戒骑士
    order: 2
    text: 有神秘学意义上的自我限制，擅长对抗审讯和交流。
  - id: arbiter_5_03
    pathway: arbiter
    seq: 5
    sequenceTitle: 惩戒骑士
    order: 3
    text: “惩戒”：可选定惩戒目标，包括但不限于触犯了某种法律或道德的、违背了自身制定规则的、对自己发动过攻击或影响过自身行为的、不属于周围环境的、不该影响现实世界的；制定惩戒目标后，“惩戒骑士”体表会浮现出晨曦般的光华，增强对惩戒对象的攻击威力和影响程度。
  - id: arbiter_5_04
    pathway: arbiter
    seq: 5
    sequenceTitle: 惩戒骑士
    order: 4
    text: “禁止”：序列5层次的“法官”能力。能进行叠加。若敌人违背自己制定的规则，则自己会受到未知力量的加强，以必定命中的姿态攻击敌人。
  - id: arbiter_5_05
    pathway: arbiter
    seq: 5
    sequenceTitle: 惩戒骑士
    order: 5
    text: “死亡”：序列5层次的“法官”能力。指着目标身上的某个位置，带来强烈的伤害。
  - id: arbiter_5_06
    pathway: arbiter
    seq: 5
    sequenceTitle: 惩戒骑士
    order: 6
    text: 之前序列其他能力和特质的提升。
  - id: arbiter_4_01
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 1
    text: “律令法师”最核心的能力是“律令”。
  - id: arbiter_4_02
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 2
    text: “律令”：能制定宽泛的限制，并维持一段时间（越宽泛，维持时间越短，总体而言，最短三十秒，最长一刻钟），比如“神秘减弱，现实增强”，能将一定区域内的所有非凡与神秘（包括己方）极大程度的削弱，让现实的影响增强，是现实世界军方对抗非凡者的强力手段，反过来的律令也可发布，同时，合适的“律令”还能帮助“律令法师”完成许多正常做不到的事情，比如，漂浮，比如，让子弹或炮弹变得迟缓。
  - id: arbiter_4_03
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 3
    text: “律令法师”的“威严”已增强到可将目标震慑于原地。
  - id: arbiter_4_04
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 4
    text: 作为秩序的践行者，“律令法师”能从所处“位置”的不同，分辨普通人和非凡者，甚至可以判断一个非凡者的层次，也就是“位置”。
  - id: arbiter_4_05
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 5
    text: “律令法师”还可以制作与世界规则相符的契约，并让契约内化为肉体和灵体的种种限制，与“公证人”不同，契约的约束力来自基于规则的秩序，而不是神灵或高位存在的见证。
  - id: arbiter_4_06
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 6
    text: 之前序列其他能力的提升，比如，身体素质，比如，“法官”的宣判：
  - id: arbiter_4_07
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 7
    text: · “剥夺”：剥夺目标的某种非凡能力。
  - id: arbiter_4_08
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 8
    text: · “禁锢”：左手虚握，能禁锢目标。
  - id: arbiter_4_09
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 9
    text: · “震慑”：将目标震慑在原地。
  - id: arbiter_4_10
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 10
    text: · “放逐”：将目标丢入虚空，不知扔向了哪里。用于对付无法快速解决的敌人。
  - id: arbiter_4_11
    pathway: arbiter
    seq: 4
    sequenceTitle: 律令法师
    order: 11
    text: · “处决”：右手握成拳头，猛地下挥，能杀死目标。
  - id: arbiter_3_01
    pathway: arbiter
    seq: 3
    sequenceTitle: 混乱猎手
    order: 1
    text: 部分“审判”权柄：“审判之剑”：对混乱之物可做出一次直接“审判”，无法躲避，目标越是混乱（也就是越背离或越扰乱当前秩序），受到的“审判”效果越强；通过这种“审判”，“混乱猎手”可以借助环境秩序瞬间跳跃到目标地点或目标身前。
  - id: arbiter_3_02
    pathway: arbiter
    seq: 3
    sequenceTitle: 混乱猎手
    order: 2
    text: 少量的“混乱”权柄：对“混乱”有直接的感应能力和锁定、追踪能力，可迅速平息环境的混乱。
  - id: arbiter_3_03
    pathway: arbiter
    seq: 3
    sequenceTitle: 混乱猎手
    order: 3
    text: “混乱猎手”其他的能力：能初步应用平衡能力分割战场——让战场变得有秩序，但无法阻止这种秩序继续滑向混乱；
  - id: arbiter_3_04
    pathway: arbiter
    seq: 3
    sequenceTitle: 混乱猎手
    order: 4
    text: 能够剥夺的非凡能力数量极大提升；
  - id: arbiter_3_05
    pathway: arbiter
    seq: 3
    sequenceTitle: 混乱猎手
    order: 5
    text: “辖区”扩大至大都市范畴，对辖区内的地点若非常熟悉，可近乎瞬移地抵达。
  - id: arbiter_3_06
    pathway: arbiter
    seq: 3
    sequenceTitle: 混乱猎手
    order: 6
    text: 之前序列其他能力的增强。
  - id: arbiter_2_01
    pathway: arbiter
    seq: 2
    sequenceTitle: 平衡者
    order: 1
    text: 部分“平衡”权柄。“平衡”：可以分割战场，将混战的几方划分在不同的区域，并大致保证每处战场实力的平衡；在结束自身战斗、让对应的战场不复存在前，不管是天使，还是圣者，都无法再干涉别的战斗；若一方过于强大，那超出平衡限度的成员在短时间内（十秒到两分钟）会被排斥出战场，无法参战；如果是单对单，“平衡者”可以让敌人实力在一分钟内强制降低或提升到与自己大致相当的水准，敌人实力越强，这种平衡能维持的时间越短（一分钟是上限）——不正经的说法是，和谁都五五开，哪怕真神，也能五五开三秒钟；能感应周围区域的不平衡而发现处在隐秘状态的目标。之前序列其他能力的提升，比如，获得制定律法、条令能力的上位，通过定义环境，让多个“禁止”或“增强”同时生效。
  - id: arbiter_1_01
    pathway: arbiter
    seq: 1
    sequenceTitle: 秩序之手
    order: 1
    text: 部分“秩序”权柄。
  - id: arbiter_1_02
    pathway: arbiter
    seq: 1
    sequenceTitle: 秩序之手
    order: 2
    text: “秩序代行者”：
  - id: arbiter_1_03
    pathway: arbiter
    seq: 1
    sequenceTitle: 秩序之手
    order: 3
    text: · 能为整片战场、所有敌人或整座城市、小型国度，制定许多新的规则（非底层），能修改或暂时去除原有的规则（非底层），但不能完全固定下来，永久起效；
  - id: arbiter_1_04
    pathway: arbiter
    seq: 1
    sequenceTitle: 秩序之手
    order: 4
    text: · 能中止混乱奇异，本身处于独立的位置，控制着影响；
  - id: arbiter_1_05
    pathway: arbiter
    seq: 1
    sequenceTitle: 秩序之手
    order: 5
