  - id: mystery_pryer_9_01
    pathway: mystery_pryer
    seq: 9
    sequenceTitle: 窥秘人
    order: 1
    text: 在魔法、巫术、占星术等神秘知识上有着全面但初步的了解与掌握，懂得不少仪式魔法，但很容易感知到隐藏于事物背后的某些存在，必须小心翼翼，对非凡力量充满敬畏。
  - id: mystery_pryer_9_02
    pathway: mystery_pryer
    seq: 9
    sequenceTitle: 窥秘人
    order: 2
    text: “窥秘之眼”：最具特点的一个能力。比绝大部分途径的同序列非凡者看到的更多。可以观察目标的星灵体、以太体和心智体状态，审视星灵体的各种细节，另外，还能看到周围一些正常看不到或者不该看到的东西，正常无法关闭。
  - id: mystery_pryer_9_03
    pathway: mystery_pryer
    seq: 9
    sequenceTitle: 窥秘人
    order: 3
    text: “快速仪式”：快速完成仪式魔法，无需绝大多数仪式物品的辅助。
  - id: mystery_pryer_8_01
    pathway: mystery_pryer
    seq: 8
    sequenceTitle: 格斗学者
    order: 1
    text: 寻求事物背后的秘密，而格斗也属于事物的一种，掌握着许多流派的格斗术。
  - id: mystery_pryer_8_02
    pathway: mystery_pryer
    seq: 8
    sequenceTitle: 格斗学者
    order: 2
    text: 身体素质提升。
  - id: mystery_pryer_7_01
    pathway: mystery_pryer
    seq: 7
    sequenceTitle: 巫师
    order: 1
    text: 拥有了借助头脑和知识解析、研究、学习乃至创建法术的能力，虽然这存在相当大的危险性，且非常麻烦，但胜在全面，可以使用各种法术，掌握的知识越多，越全面越厉害，常见的巫师法术有：“照明术”、“除草术”、“驱邪术”、“扩音术”、“闪电术”、“造风术”、“力场之手”等。
  - id: mystery_pryer_7_02
    pathway: mystery_pryer
    seq: 7
    sequenceTitle: 巫师
    order: 2
    text: 巫师使用法术的全过程是：最简单也要三个动作，一是集中灵性，二是于脑海内勾勒对应法术的象征符号，这也可以用出声诵念咒文来代替，三才是借助材料把法术施展出来，材料的作用有的是媒介，有的是法术组成部分。不方便的地方在于如何存放材料。
  - id: mystery_pryer_6_01
    pathway: mystery_pryer
    seq: 6
    sequenceTitle: 卷轴教授
    order: 1
    text: 能制作卷轴，念出相应咒文后卷轴会燃烧并释放其中能力，这极大地节约了施法时间，提升了巫师战斗的能力。
  - id: mystery_pryer_5_01
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 1
    text: 星象、星座、星辰、星光都是同时具备神秘学和现实天文学双重意义的概念，而“星象师”初步掌握的是这些概念神秘学方面的知识，从而可以使用对应的能力：
  - id: mystery_pryer_5_02
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 2
    text: “星之巨柱”：右手掌心飞速形成一团缓缓旋转的星沙。一颗又一颗星辰浮现了出来，密密麻麻，璀璨夺目。这些星辰洒落了一道又一道辉芒，交汇成恢宏的光之巨柱，笼罩一定范围内的空间区域。使目标被星光溶解，崩溃消散。
  - id: mystery_pryer_5_03
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 3
    text: “星海穿梭”：能让船只借星光飞跃。
  - id: mystery_pryer_5_04
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 4
    text: “星桥”：能让洒落的星辉奇妙地构建出一座透明璀璨的长桥。
  - id: mystery_pryer_5_05
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 5
    text: “本我星象”：能让身影瞬间透明，就像变成了无数星光聚合成的雕像。那雕像一下破碎，璀璨的星辉点点涌动，可钻入缝隙处。片片星芒在内部重聚，显现出星象师的身影。
  - id: mystery_pryer_5_06
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 6
    text: “星光囚笼”：念出相应的咒文后发动，身周缭绕的璀璨星芒就一道接一道飞离，降临于目标身上。星芒瞬间凝缩，制造了一个巨大的透明琥珀，它将目标全部包裹进去，限制在了原本的位置。
  - id: mystery_pryer_5_07
    pathway: mystery_pryer
    seq: 5
    sequenceTitle: 星象师
    order: 7
    text: 之前序列能力的提升，比如：“窥秘之眼”：序列5层次的窥秘人非凡能力。能让几十米范围内的一切没有遮蔽但异常混乱地呈现于自己的视界内。隐约看见周围有一重重仿佛阴影的厚厚帷幕，帷幕之后，似乎有什么东西在注视着自己，注视着所有生灵。
  - id: mystery_pryer_4_01
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 1
    text: 根据解析的血液不同，神秘学家擅长的方面和拥有的能力会有一定的不同，比如，用了“命运之蛇”的血液晋升，将来成为序列3“预言大师”要比其他人容易，且能获得“短暂的幸运”这个能力。
  - id: mystery_pryer_4_02
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 2
    text: 神秘学家的强大来自于丰富的神秘学知识，因此非常危险，经常会看到不该看到的事物，听见不该听见的声音，触碰不该触碰的秘密。所以，一位“神秘学家”要想活得长久，必须懂得克制自己的好奇心，控制自己的相应行为。
  - id: mystery_pryer_4_03
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 3
    text: 神秘学家的两大核心能力是“窥秘之眼”和“神秘再现”，后者也是他们神性和知识的体现。
  - id: mystery_pryer_4_04
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 4
    text: “窥秘之眼”：序列4层次的窥秘人非凡能力。能自由开启关闭、放置他人身上，它看见了就等于使用者看见了，并且一旦转入隐蔽状态，很难被其他手段发现。
  - id: mystery_pryer_4_05
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 5
    text: “神秘再现”：最核心的非凡能力。从掌握的神秘学知识里汲取力量，创造魔法或巫术，而对应的神秘学知识越少人知道，越不流传，这种法术就越强大。从地球原来文明的童话故事中创造的叫“童话魔法”。
  - id: mystery_pryer_4_06
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 6
    text: · 卖火柴的小女孩：凝聚出燃着的火柴。让敌人陷入幻觉。
  - id: mystery_pryer_4_07
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 7
    text: · 灰姑娘：改变自身的容貌、形象和气质。
  - id: mystery_pryer_4_08
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 8
    text: · 背叛之宴：凝聚出远古太阳神被分食的画面。来源于远古太阳神之死这个神秘学知识。作用是短暂唤醒或赋予目标手中物品灵智，让它们做出背叛。
  - id: mystery_pryer_4_09
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 9
    text: · 神奇的号角：凝聚出深色的古老的号角，带着极为沉重极有力量感的意蕴。毁灭的号角，吹响后传出低鸣的声音，音波叠加之下能粉碎敌人和空间。
  - id: mystery_pryer_4_10
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 10
    text: · 丑小鸭：在背部凝聚出出一片片洁白的、虚幻的羽毛。能让使用者展露不完整神话生物形态的强大魔法，每天一次，每次十秒。
  - id: mystery_pryer_4_11
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 11
    text: · 朗基努斯之枪： 凝聚出一把式样古老，从尖端到柄部都燃着一团又一团，一点又一点血色暗红的长枪。攻击力极强。
  - id: mystery_pryer_4_12
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 12
    text: · 皇帝的新衣：变成根本不存在的东西而不会遭受创伤。
  - id: mystery_pryer_4_13
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 13
    text: · 白雪公主：凝聚出一面虚幻的，古老的镜子。接近预言术，可用来提升预言能力的成功率和准确性。
  - id: mystery_pryer_4_14
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 14
    text: · 睡美人：使敌人极度疲惫并想要睡着。
  - id: mystery_pryer_4_15
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 15
    text: · 桃花的源头：能创造一片与外界隔绝的很难连通的结界。
  - id: mystery_pryer_4_16
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 16
    text: · 岁月的棋局：让目标的行动变得缓慢，就如同进入了时间流速不同的区域。
  - id: mystery_pryer_4_17
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 17
    text: · 阿里阿德涅之线：制造一个可以指引方向的毛线团。
  - id: mystery_pryer_4_18
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 18
    text: · 美人鱼：化做泡沫消失。
  - id: mystery_pryer_4_19
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 19
    text: · 杰克与豌豆：制造一个巨大的豌豆藤。
  - id: mystery_pryer_4_20
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 20
    text: · 哈迪斯的隐身帽：一顶能让人隐身的帽子。
  - id: mystery_pryer_4_21
    pathway: mystery_pryer
    seq: 4
    sequenceTitle: 神秘学家
    order: 21
    text: · 理想乡：“理想乡”不位于现实，也不在灵界，于某处完全隐藏了起来，只有得到邀请或具备资格的人才可以进入，同时，还必须掌握相应的那一大串数字，365位。
  - id: mystery_pryer_3_01
    pathway: mystery_pryer
    seq: 3
    sequenceTitle: 预言大师
    order: 1
    text: 真切接触到了“窥秘”这个权柄，不仅可以窥探到隐藏起来的各种秘密、各种知识、各种存在，而且还能窥探命运的秘密。
  - id: mystery_pryer_3_02
    pathway: mystery_pryer
    seq: 3
    sequenceTitle: 预言大师
    order: 2
    text: “预言”：窥探命运的秘密——可以预言自己某个选择带来的后果，或窥探自己接下来最好的选择是什么，也能让真实发生过的事情在脑海内产生画面。能对一些事件产生一定的灵感，看到一些模糊的画面，但限于本身的层次、位格和身份，对涉及高位存在的具体情况没有足够的了解，难以把握到究竟是什么事情。涉及的问题越严重，位格和层次越高，对自己带来的反噬伤害越大。能预见末日的来临。完成相应的仪式后，能清晰看见晋升的契机。
  - id: mystery_pryer_3_03
    pathway: mystery_pryer
    seq: 3
    sequenceTitle: 预言大师
    order: 3
    text: 之前序列其他能力的提升。
  - id: mystery_pryer_2_01
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 1
    text: 一定的“神秘知识”权柄，以及相应的、粗浅的“删除”和“修改”权柄，少许“教化”权柄。
  - id: mystery_pryer_2_02
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 2
    text: · 核心能力是对信息的掌控和利用，包括但不限于自身的信息化——通过将身体虚化，分解成一股又一股庞杂的知识，变成一个纯粹的信息流生物；也能脱离信息洪流状态，用庞杂纯粹的知识重组出身体，信息洪流就算缺少部分，只要整体的结构和平衡还在，就不会死亡，顶多在重组后缺胳膊断腿，少一部分法术，后续可再重新研究和添加。
  - id: mystery_pryer_2_03
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 3
    text: · 信息化的情况下，对自己如果足够了解，在不破坏整体信息平衡性的前提下，可以将合适的、不冲突的、本身已完全掌握的神秘学知识以信息的形式添加入对应的信息流内，删除掉可以不要的那些，从而完成对自己身体的改造和某些法术的固定化、快速化。
  - id: mystery_pryer_2_04
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 4
    text: · 能向被自己眼睛注视的目标灌输知识，能把知识具象化追逐攻击敌人。
  - id: mystery_pryer_2_05
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 5
    text: · 能把物体和超凡力量同化成知识的一部分。
  - id: mystery_pryer_2_06
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 6
    text: · 可以制造误导他人的虚假信息，可以创造虚假信息来欺骗法则。
  - id: mystery_pryer_2_07
    pathway: mystery_pryer
    seq: 2
    sequenceTitle: 贤者
    order: 7
    text: 之前序列其他能力的提升。
  - id: mystery_pryer_1_01
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 1
    text: “知识皇帝”：能利用灵界汇聚的那些信息，能影响七光。
  - id: mystery_pryer_1_02
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 2
    text: 更深入的“神秘知识”权柄：
  - id: mystery_pryer_1_03
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 3
    text: · 能将实质的力量赋予抽象的知识，比如，如果拥有足够关于某种非凡能力的知识，理论上可以将力量赋予这些知识，并将其纳入自身的信息流中，从而获得该其它序列的非凡能力；
  - id: mystery_pryer_1_04
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 4
    text: · 能帮助他人在正常状态与信息洪流状态之间切换；
  - id: mystery_pryer_1_05
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 5
    text: · 能伪造正常的信息，沿着灵体之线传播；
  - id: mystery_pryer_1_06
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 6
    text: · 能把周围的信息吸聚到掌心，凝成一团虚幻的光球。
  - id: mystery_pryer_1_07
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 7
    text: 更多的“教化”权柄：能于眼眸内凝聚出一个又一个复杂而虚幻的符号，将大量的庞杂的无用的知识灌入目标脑海，撑爆其脑袋。
  - id: mystery_pryer_1_08
    pathway: mystery_pryer
    seq: 1
    sequenceTitle: 知识皇帝
    order: 8
    text: 一定的“窥秘”权柄：能直接窥见许多秘密，包括众神的，乃至旧日的。
  - id: mystery_pryer_0_01
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 1
    text: 知识（信息）象征下偏神秘的那部分权柄。
  - id: mystery_pryer_0_02
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 2
    text: “知识”（“信息”）这个象征可以让下属两条途径的真神乃至序列1或者序列2化身成一股又一股庞杂的信息组成，虚幻、洪流般庞杂到恐怖的信息洪流。
  - id: mystery_pryer_0_03
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 3
    text: “神秘知识”权柄：核心能力之一是赋予数字力量，赋予它们真正意义上的、各自不同的、比原版衰减了不少的象征力量。其中，“0”代表混沌，代表未知，代表一切发生之前，“1”代表开始，代表最初，代表创造了这个世界的那位造物主。当它们首尾相接将形成一片数字世界，隐者可通过将1变为0将世界归于虚无。
  - id: mystery_pryer_0_04
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 4
    text: “隐匿”权柄，能隐匿自身的信息或别的信息，让其他神灵都无法追踪和定位。
  - id: mystery_pryer_0_05
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 5
    text: “窥秘”权柄：不管什么秘密都是一种知识，都是“神秘知识”的一部分或可以窥探的。
  - id: mystery_pryer_0_06
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 6
    text: 部分“教化”权柄：给予他人知识的权柄。
  - id: mystery_pryer_0_07
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 7
    text: “灵界导师”：灵界是各种信息的汇聚之地，而信息就是知识，天然地会被知识途径影响，所以，贤者和完美者都有一部分灵界权柄。
  - id: mystery_pryer_0_08
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 8
    text: 部分“备份”权柄：能通过备份后隐藏起来的信息复活，指定的备份信息要想接收到唯一性，必须于死亡之前，自主选择做出激活。若不做激活，唯一性将自然地转移到最近的那份备用信息内，遵循就近原则。相应的，信息会在不断的备份中出现丢失、衰减、错误、混乱等情况，这是整个世界的底层规律决定的，是错误、衰败、增熵等象征的体现，每多备份一次整体信息，出问题的概率就越多，暗藏混乱的可能就越高。在这件事情上，比起被人杀死，自我毁灭会更显著地导致信息的衰减与混乱加剧，因为这是从内部、从自我意识的否定开始的。
  - id: mystery_pryer_0_09
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 9
    text: 部分“复制”权柄
  - id: mystery_pryer_0_10
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 10
    text: 部分“删除”权柄
  - id: mystery_pryer_0_11
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 11
    text: 部分“修改”权柄等。
  - id: mystery_pryer_0_12
    pathway: mystery_pryer
    seq: 0
    sequenceTitle: 隐者
    order: 12
    text: 神国：眼中世界或数字天堂、童话之地
