  - id: spectator_9_01
    pathway: spectator
    seq: 9
    sequenceTitle: 观众
    order: 1
    text: 得到出众的精神和敏锐的观察力。
  - id: spectator_9_02
    pathway: spectator
    seq: 9
    sequenceTitle: 观众
    order: 2
    text: 能像旁观者一样审视世俗社会里的“演员”，从表情、举止、口癖、不为人知的动作窥见他人的真实想法。
  - id: spectator_8_01
    pathway: spectator
    seq: 8
    sequenceTitle: 读心者
    order: 1
    text: 观察能力深入到气场、以太体等神秘领域。
  - id: spectator_8_02
    pathway: spectator
    seq: 8
    sequenceTitle: 读心者
    order: 2
    text: 结合“观众”对细节的察知能力，能异常准确地掌握人心，似乎可以读到对方的念头，在“读心者”面前很难有秘密。
  - id: spectator_7_01
    pathway: spectator
    seq: 7
    sequenceTitle: 心理医生
    order: 1
    text: 身体素质提升，力量和速度增强不少。视力提升，能清楚看到藏在黑暗里的物品。嗅觉能分辨更多的细微气味，从而把握住目标最真实的情绪和想法。
  - id: spectator_7_02
    pathway: spectator
    seq: 7
    sequenceTitle: 心理医生
    order: 2
    text: “震慑”/“龙威”：可以让单个目标或对一个范围内的群体就像面对巨龙一样瞬间变得惊慌，出现混乱。
  - id: spectator_7_03
    pathway: spectator
    seq: 7
    sequenceTitle: 心理医生
    order: 3
    text: “狂乱”：引爆目标的情绪或心理状态，让对方陷入“狂乱”之中，遭受精神层面的强烈伤害，某些时候，甚至会让目标直接失控。
  - id: spectator_7_04
    pathway: spectator
    seq: 7
    sequenceTitle: 心理医生
    order: 4
    text: “心理暗示”：通过特定的动作、语言、媒介暗示目标，让对方不知不觉就遵循自己的安排，或者强烈地、发自内心地不想违背某个承诺。也可通过自我心理暗示进入集体潜意识大海。。
  - id: spectator_7_05
    pathway: spectator
    seq: 7
    sequenceTitle: 心理医生
    order: 5
    text: “安抚”/“精神分析”：可以让心理不稳定的患者平静下来、变得能够沟通，可以让处于失控边缘的非凡者找回理智、摆脱危险，后者有一定失败概率，序列越高越容易成功；也可以让因各种缘由心理不稳定的患者平静下来，能够沟通。
  - id: spectator_7_06
    pathway: spectator
    seq: 7
    sequenceTitle: 心理医生
    order: 6
    text: “读心”：通过烛火、纯露等媒介让目标处于半催眠状态，直接与对方的心智体交流。
  - id: spectator_6_01
    pathway: spectator
    seq: 6
    sequenceTitle: 催眠师
    order: 1
    text: 身体素质得到相当大的增强，力量和敏捷超过普通人类层次，能于皮肤表面制造一层“鳞片”，较大程度地抵御和减弱伤害。
  - id: spectator_6_02
    pathway: spectator
    seq: 6
    sequenceTitle: 催眠师
    order: 2
    text: “战斗催眠”：能强行催眠敌人做出反常举动，比如攻击同伴和避开“催眠师”，不过只能维持很短时间，不能直接危害到对方的生命，无法让敌人自杀。
  - id: spectator_6_03
    pathway: spectator
    seq: 6
    sequenceTitle: 催眠师
    order: 3
    text: “心理学隐身”：借助对目标心智体的把握，利用心理盲点，躲藏于暗中，让自身处于“意识死角”，从而达成明明就在面前，对方却完全看不到感应不到的类隐身效果。但是依旧会与周围发生交互，只是消除了存在感，处于注意力的盲区，一旦那种互动变强，就会不可避免地暴露。
  - id: spectator_6_04
    pathway: spectator
    seq: 6
    sequenceTitle: 催眠师
    order: 4
    text: “心理暗示”：成为了非战斗领域的催眠，只要让目标的注意力真正地集中在某样事物上，就能打开对方的“心智体”之门，直接修改意识、影响潜意识，让目标毫无察觉地遵循她的安排，做出种种有悖于真实意志的行为。
  - id: spectator_6_05
    pathway: spectator
    seq: 6
    sequenceTitle: 催眠师
    order: 5
    text: · 同样无法直接危害到被催眠者的生命和潜意识里最重视的事物，对方会出现强烈的抗拒导致催眠失效，另外，若目标精神强大、心智坚定，也能在一定程度上对抗催眠。
  - id: spectator_5_01
    pathway: spectator
    seq: 5
    sequenceTitle: 梦境行者
    order: 1
    text: 核心能力：通过对梦境的引导和操纵，获取情报、影响敌人。
  - id: spectator_5_02
    pathway: spectator
    seq: 5
    sequenceTitle: 梦境行者
    order: 2
    text: · “引导”：类似“不眠者”途径的“梦魇”，以梦境的不同变化一步步引导目标说出心底的秘密，不同的地方在于“梦魇”可以强行拉人入梦，而“梦境行者”不可以，除非用“催眠”配合；
  - id: spectator_5_03
    pathway: spectator
    seq: 5
    sequenceTitle: 梦境行者
    order: 3
    text: · “修改”：通过对梦境的修改，日积月累地影响目标，让对方不知不觉发生改变，做出原本不会做的事情。原理是以梦境为切入点，以星灵体为跳板，逐渐侵染目标的精神体，然后才反应到心智体，根植于潜意识，相比直接的“催眠”更为柔和、隐蔽、不容易被察觉，适合针对较高层次的目标。
  - id: spectator_5_04
    pathway: spectator
    seq: 5
    sequenceTitle: 梦境行者
    order: 4
    text: “梦境穿梭”：能让身体虚化，直接藏入别人的梦境，从一个梦境跳跃到另一个梦境，借此完成物理意义上的“闪现”。两个梦境间隔不能超过500米，且必须是智慧生物的梦境。
  - id: spectator_4_01
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 1
    text: 拥有超强的力量和夸张的龙鳞防御，一拳能打爆一块钢铁。
  - id: spectator_4_02
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 2
    text: “操纵”：又称意识操纵。核心能力。让心智体通过集体潜意识大海，进入别人的心灵岛屿，进行深层次催眠，直接篡改他们的潜意识，读取他们的想法，无声无息驱使他们做各种各样的的事情。
  - id: spectator_4_03
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 3
    text: “龙化”：相当于自我催眠，使用不完整的神话生物形态，不过，这必须等到适应了魔药，不断叠加了正确的心理暗示后才可以，要不然会直接失控。每次不能超过一定的时间，否则就算有针对精神和心灵的治疗手段，也会被疯狂和混乱深入侵染，导致失控。刚晋升时的极限在一分钟左右。对心灵领域研究的更深入，意志更为强大和坚定，就能拥有更长的“龙化”时间。巨龙状态不比序列3的圣者强多少。虽然巨龙的肉搏很强，但还是缺乏必要的、具备强大攻击性的非凡能力，必须通过一定的封印物来弥补。但可以利用凸显的神性干扰对手思绪，让他逐渐变得躁狂，慢慢丢失理智。此外，巨龙化状体下，还可以进行一定的飞行。
  - id: spectator_4_04
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 4
    text: “虚拟人格”：能虚能虚拟出许多人格，让他们拥有对应的心智体，这一方面可以对抗心灵领域的许多影响，另一方面则能让使用者在与别人谈话交流的同时，借助“他们”，无声无息侵入目标的意识岛屿，表面没有一点征兆，可以悄然引导目标不知不觉改变想法。刚晋升时能虚拟的人格只有十三个。
  - id: spectator_4_05
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 5
    text: “精神瘟疫”：在目标的心灵岛屿悄然种下“传染性疯狂”的种子。那种子可以悄然感染周围的集体潜意识大海，让周围的生物不知不觉置身于布满“传染型精神疾病”的环境里，借助集体潜意识大海将各种心理疾病和极致的疯狂传染出去。而且，这种疯狂本身也可以通过“灵体之线”传播。另外，因为这种感染源于“自身”，不是天使的庇佑能够隔绝的，顶多被削弱点影响，延缓些发作。且属于针对意识岛屿、精神世界的侵蚀和感染，不是直接的攻击，难以靠“虚拟人格”来抵消。
  - id: spectator_4_06
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 6
    text: “心智剥夺”：质变的“龙威”，心理医生的“震慑”的强化版。狂暴的风声在使用者周围涌现，似来自现实，又仿佛源于虚幻。风声带着某些意志，向着四面八方吹拂了过去，凡是被卷入其中的生物，身体、心灵和精神皆处在了难以自控的状态。或浑身颤栗地呆立于原地，或盲目无理智地往花园角落奔逃，或大小便失禁，双腿无力地往下瘫软，或者直接晕厥了过去，陷入昏迷，或露出狂热的神情，成为巨龙的簇拥者。
  - id: spectator_4_07
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 7
    text: “心灵风暴”：将自身指定的念头化成心灵风暴席卷周围，能影响周围集体潜意识大海，让它们一次又一次拍打敌人的意识岛屿，使附近的“天象”急速改变，灵性对周围的感应遭受到强烈干扰，有效地摧毁心灵屏障。
  - id: spectator_4_08
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 8
    text: “意识漫步”：能让意识和灵体于集体潜意识大海遨游，但无法将身体带进去。
  - id: spectator_4_09
    pathway: spectator
    seq: 4
    sequenceTitle: 操纵师
    order: 9
    text: “心灵吐息”：又称巨龙吐息。无形的透明吐息，范围型的强化版精神刺穿。能直接刺激和伤害目标的心智体和精神体，被攻击到的目标如遭雷击，精神产生撕裂、灵体似被洞穿。
  - id: spectator_3_01
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 1
    text: 能够编织出梦境，并将目标拉入，能编织出近乎真实的几个形象，直接攻击敌人的精神薄弱处，一步步摧毁心灵防线。一旦敌人认为这些是真的，那它们就是真的，所产生的伤害虽然不会有物理意义上的实质表现，却会让目标在不知不觉死亡，达到吓疯或者吓死的效果。哪怕不是噩梦针对的敌人，其他人只要处于噩梦中就也会遭受波及，被相应的情绪、特质、位格影响，甚至污染。
  - id: spectator_3_02
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 2
    text: 对自身心理和精神有着精准的把握和掌控，使敌人的危险直觉无法于脑海内形成画面，也就难以预判自己的行为。
  - id: spectator_3_03
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 3
    text: 不需要潜入心灵岛屿，只是观察周围集体潜意识大海的动静，就能洞悉他人最真实的想法。
  - id: spectator_3_04
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 4
    text: 不仅能让意识和灵体于集体潜意识大海遨游，也可以将自身肉体以及他人带入集体潜意识大海。
  - id: spectator_3_05
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 5
    text: 能分离出自己曾经拥有过的一些身份，让他们变成活生生的人，而这些身份就算死去，也不会导致本体陨落，是“空想家”的前置。
  - id: spectator_3_06
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 6
    text: 【瘟疫风暴】：结合心智剥夺和精神瘟疫，让每一个被影响被侵蚀的生物遭遇污染，当场发疯。对于天使来说，这样的攻击最为险恶，因为他们的精神状态都有一定的问题，随时可能因为天平倾斜，直接失控。
  - id: spectator_3_07
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 7
    text: 【心理学隐身】：序列3层次的“催眠师”能力，能制造一个幻影掩盖本身存在。
  - id: spectator_3_08
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 8
