  - id: spectator_3_09
    pathway: spectator
    seq: 3
    sequenceTitle: 织梦人
    order: 9
    text: 之前序列能力的提升。
  - id: spectator_2_01
    pathway: spectator
    seq: 2
    sequenceTitle: 洞察者
    order: 1
    text: “洞察”是描述、干扰、安排和空想的基础，知己知彼，方能百战百胜；
  - id: spectator_2_02
    pathway: spectator
    seq: 2
    sequenceTitle: 洞察者
    order: 2
    text: 拥有质变的心理暗示能力，达到了权柄的程度，只要认为自己足够强大就会足够强大，不会被外在的形象和身体条件约束；
  - id: spectator_2_03
    pathway: spectator
    seq: 2
    sequenceTitle: 洞察者
    order: 3
    text: 对集体潜意识大海有着更加细致入微的感应，并能真实进入集体潜意识大海，借此遨游。
  - id: spectator_2_04
    pathway: spectator
    seq: 2
    sequenceTitle: 洞察者
    order: 4
    text: 部分“洞察”权柄：能洞悉目标潜在的心灵漏洞，知道其最恐惧的是什么东西；也能初步洞察目标过去的种种命运和因此产生的因果联系；“洞察”有时能穿透“隐秘”的遮掩，有时又会被“隐秘”挡住，彼此之间互相克制，同样的，面对欺瞒、愚弄等也一样；正常的反占卜、反预言无法瞒过洞察者。
  - id: spectator_2_05
    pathway: spectator
    seq: 2
    sequenceTitle: 洞察者
    order: 5
    text: “梦境迷宫”：可利用许多心灵拼凑起迷宫，给予心灵和精神层面的拷问、混乱和干扰。
  - id: spectator_2_06
    pathway: spectator
    seq: 2
    sequenceTitle: 洞察者
    order: 6
    text: “巨龙”：可化身为真正的巨龙，这是“空想家”途径的神话生物形态，但实际上，对于这条擅长“空想”的途径而言，“巨龙”形态本身也只是最高位者设想出来的，随时可根据最高位者一念之间的变化而变化；心灵“巨龙”们可化身为任何一种神话生物，使用对应的非凡能力，如果敌人相信这是真的，那它就会是真的——如果没有敌人，那它无法变成真的。
  - id: spectator_1_01
    pathway: spectator
    seq: 1
    sequenceTitle: 作家
    order: 1
    text: 掌握了部分“空想”权柄，也称“幻想成真”权柄。
  - id: spectator_1_02
    pathway: spectator
    seq: 1
    sequenceTitle: 作家
    order: 2
    text: “空想”权柄涉及的不仅仅是心灵和集体潜意识大海，还触碰到了“星界”，可将某些概念短暂拉入现实，变成真正存在的事物，带来真实的伤害或变化。
  - id: spectator_1_03
    pathway: spectator
    seq: 1
    sequenceTitle: 作家
    order: 3
    text: 部分“空想”权柄：书写的故事都会变成现实，但是若故事不符合逻辑，而是以“莫名”、“奇怪”等含糊不清的理由推动事情的发生的话，消耗会变大，被察觉的可能也会增加。
  - id: spectator_1_04
    pathway: spectator
    seq: 1
    sequenceTitle: 作家
    order: 4
    text: 更强的“洞察”权柄：“作家”初步掌握了集体潜意识大海，拥有“凡有言，必被知”特质——当一个人知道了“作家”，“作家”也就知道了这个人，知道了这个人接触的所有人。对“作家”了解越多，越可能被祂写入编织的故事。
  - id: spectator_1_05
    pathway: spectator
    seq: 1
    sequenceTitle: 作家
    order: 5
    text: “巧合”：掌握了集体潜意识大海，就能掌握“巧合”——“作家”可以让偶然出现的奇妙现象变成心灵的回音，想让它出现就出现。
  - id: spectator_1_06
    pathway: spectator
    seq: 1
    sequenceTitle: 作家
    order: 6
    text: 部分“心灵”权柄：能支配每个生物的心灵，让他们按照自己的意志行事，而这些生物很难察觉，认为那就是他们真实的想法。
  - id: spectator_1_07
