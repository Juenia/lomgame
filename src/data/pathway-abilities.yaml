  - id: door_9_01
    pathway: door
    seq: 9
    sequenceTitle: 学徒
    order: 1
    text: “学徒”们追寻着自由的足迹，不管是墙壁，还是大门，都无法阻止他们通过，这就是“开门”，当然，前提是没有非凡能力限制，或者屏障不算太厚——很显然，“学徒”没法直接穿越一座山峰。从神秘学定义来说，只要屏障还能被称为人类常规认知里的墙壁，那就不算太厚。
  - id: door_8_01
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 1
    text: 闪光：主要作用不是照亮环境，而是影响他人的视觉，强度比老旧型号的摘照相机刺目数倍。
  - id: door_8_02
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 2
    text: 黑幕：如同魔术师，凭空创造一片无光的幕布用来隐藏事物。
  - id: door_8_03
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 3
    text: 转移气体：将有毒有害气体转移走，或转移去需要它们发挥作用的地方，转移目的地与本身之间的距离不超过十五米。
  - id: door_8_04
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 4
    text: 巨响：凭空制造巨大的声音，可以用来伪造爆炸，或让敌人注意力、听觉等受到干扰。
  - id: door_8_05
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 5
    text: 冰冻（手掌触碰和射线两种）：快速降温、凝霜或制造薄冰，射线有效距离不超过十米，速度接近箭矢。
  - id: door_8_06
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 6
    text: 电击：无法离体，必须有介质，强度类似现代社会非高压触电。
  - id: door_8_07
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 7
    text: 造雾：有效范围十五米左右。
  - id: door_8_08
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 8
    text: 刮风：相当于七八级大风。点火：通过搓动手指的方式点燃身周三米的物品。
  - id: door_8_09
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 9
    text: 摔倒术：或制造一片半径五六米的，像是抹了一层油脂的区域，让人摔倒，或让指定目标脚下直接打滑。
  - id: door_8_10
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 10
    text: 驱物：让自身五米范围内的指定物品移动、弹跳，但无法做更多更精细的操作。
  - id: door_8_11
    pathway: door
    seq: 8
    sequenceTitle: 戏法大师
    order: 11
    text: 逃脱戏法：通过道具、巨响、黑幕、闪光等方式转移目标注意力后，将自己的身影快速转移——（闪现能力的下位）。
  - id: door_7_01
    pathway: door
    seq: 7
    sequenceTitle: 占星人
    order: 1
    text: 占星术：使用水晶球进行占卜。
  - id: door_6_01
    pathway: door
    seq: 6
    sequenceTitle: 记录官
    order: 1
    text: “记录”：能以精神为笔，以灵体为纸，记录并使用其他人展现的非凡能力。异变的“大脑”能重现目标使用的非凡能力，然后驱使活化的部分细胞构成相应的符号、花纹和标识，完成存储。使用时会出现“我来到，我看见，我记录”的咒文。
  - id: door_6_02
    pathway: door
    seq: 6
    sequenceTitle: 记录官
    order: 2
    text: · 在刚晋升时只能记录一种拥有神性影响的非凡能力。
  - id: door_6_03
    pathway: door
    seq: 6
    sequenceTitle: 记录官
    order: 3
    text: · 对方序列越高，失败概率越高。刚晋升时，记录序列4的非凡能力十几次也未必能成功一次。
  - id: door_6_04
    pathway: door
    seq: 6
    sequenceTitle: 记录官
    order: 4
    text: · 不同序列非凡能力的记录数目和重现效果有限。刚晋升时，序列6和序列5的非凡能力可以记录8个，效果是原本的一半；序列7到序列9可以记录20个，效果接近原版，等到魔药进一步消化，各方面还会有提升，比如记录的神性能力提高到两种。
  - id: door_5_01
    pathway: door
    seq: 5
    sequenceTitle: 旅行家
    order: 1
    text: “定位”：能辨认自己所在位置位于哪里，可再好的“导航”也受限于使用的人。
  - id: door_5_02
    pathway: door
    seq: 5
    sequenceTitle: 旅行家
    order: 2
    text: “旅行家之门”：又称“传送之门”、“传送”、“旅行”，能进行灵界穿梭，同时可以感应到外界、能自我定位。能承受的传送时间、穿梭的效果和距离受到灵体强度限制，序列越高效果越好。
  - id: door_5_03
    pathway: door
    seq: 5
    sequenceTitle: 旅行家
    order: 3
    text: “闪现”：相当于短距离旅行。于短距离内不断闪现，一个人制造出围攻的效果——短距离指的是在灵界等于一片区域的整体中。
  - id: door_5_04
    pathway: door
    seq: 5
    sequenceTitle: 旅行家
    order: 4
    text: “无形之手”：可于远处摄物。
  - id: door_5_05
    pathway: door
    seq: 5
    sequenceTitle: 旅行家
    order: 5
    text: “记录”：序列5层次的记录官能力，能记录的半神层次非凡能力提升到四种，具体效果接近序列4。
  - id: door_4_01
    pathway: door
    seq: 4
    sequenceTitle: 秘法师
    order: 1
    text: “守秘”：可以保守秘密，屏蔽感应，也可以通过破碎水晶球的方式，成为秘密，影响神秘学领域的追踪。
  - id: door_4_02
    pathway: door
    seq: 4
    sequenceTitle: 秘法师
    order: 2
    text: “空间隐藏”：可将一个空间区域扭曲，割成两部分并隐藏其中一部分，想从隐藏的空间出来只能通过门或者解除隐藏。可以用来制造空间口袋。
  - id: door_4_03
    pathway: door
    seq: 4
    sequenceTitle: 秘法师
    order: 3
    text: “幻化”：变成一扇又一扇虚幻之门，本体出现在了“门”的后方，与攻击处在了两个不同的世界，遥遥相望。
  - id: door_4_04
    pathway: door
    seq: 4
    sequenceTitle: 秘法师
    order: 4
    text: “放逐”：生成虚幻之门，可以将初步控制住的目标丢入对应的时空乱流中，而不同的虚幻之门代表着不同的场景，危险和机遇并存。这种“放逐”并非永久，以这个序列层次，只能持续现实的二十秒钟，一旦时间走完，则放逐的物品将通过刚才那扇“虚幻之门”回归到使用者的身旁。
  - id: door_4_05
    pathway: door
    seq: 4
    sequenceTitle: 秘法师
    order: 5
    text: “闪现”：序列4层次的旅行家能力。“闪现”得太快，以至于原地还留有残影，短暂没能消失。处于闪现状态的使用者能比正常更快地使用非凡能力，但无法持久，这是通过一条条星之虫分别发挥作用实现的。
  - id: door_3_01
    pathway: door
    seq: 3
    sequenceTitle: 漫游者
    order: 1
    text: “漫游”：与星空、星界有关。这意味着灵界也无法再困住漫游者，可以进入星空，遨游星界，前往不同的星球。
  - id: door_3_02
    pathway: door
    seq: 3
    sequenceTitle: 漫游者
    order: 2
    text: “空间隐藏”可以变成临时性的“空间牢笼”，这相当于一种封印。
  - id: door_3_03
    pathway: door
    seq: 3
    sequenceTitle: 漫游者
    order: 3
    text: “开门”：除了部分特殊能力可以制止，漫游者能突破几乎所有屏障。
  - id: door_3_04
    pathway: door
    seq: 3
    sequenceTitle: 漫游者
    order: 4
    text: “融入空间”：这既是一种隐藏，也是对宇宙中不同星球、不同异度空间环境的适应。
  - id: door_3_05
    pathway: door
    seq: 3
    sequenceTitle: 漫游者
    order: 5
    text: “撕裂空间”：于虚空中撕扯出一条危险的缝隙——必须有触碰才能办到。
  - id: door_2_01
    pathway: door
    seq: 2
    sequenceTitle: 旅法师
    order: 1
    text: “自我符号”：可以让自己转化为象征符号，更有效地利用星界，借助星界前往不同星球不同世界。
  - id: door_2_02
    pathway: door
    seq: 2
    sequenceTitle: 旅法师
    order: 2
    text: “维度之视”：初步接触到维度的力量，可以玩具化、缩小化目标物体和场景并进行收纳，作用范围能覆盖一座城市。
  - id: door_2_03
    pathway: door
    seq: 2
    sequenceTitle: 旅法师
    order: 3
    text: “再现”：又称“重现”，能记录场景、人物和非凡能力。可以让自己和一定范围内的生灵直接转移到记录的场景内，或让记录的场景降临到目标周围区域，只要该场景依旧存在；可以再现记录的人和非凡能力，前者能发动一次攻击，再现的高层次非凡能力和原版有不小的差距。
  - id: door_2_04
    pathway: door
    seq: 2
    sequenceTitle: 旅法师
    order: 4
    text: 初步掌控“传送”权柄（空间权柄的下位）：能制造出可以直接抵达目标位置的传送门，能同时出现在不同的地方。
  - id: door_1_01
    pathway: door
    seq: 1
    sequenceTitle: 星之匙
    order: 1
    text: 拥有“定位”权柄，自身永不迷失位置，并让敌人无法定位，失去定位。
  - id: door_1_02
    pathway: door
    seq: 1
    sequenceTitle: 星之匙
    order: 2
    text: “时空迷宫”：时间就是空间，空间就是时间，“星之匙”可以制造出各种各样的迷宫来困住敌人，包括时间混乱或空间循环的那些。
  - id: door_1_03
    pathway: door
    seq: 1
    sequenceTitle: 星之匙
    order: 3
    text: 初步掌控“封印”权柄。
  - id: door_1_04
    pathway: door
    seq: 1
    sequenceTitle: 星之匙
    order: 4
    text: “空间破碎”：又称“重力操纵”，利用星辰的力量弯曲破碎一片空间。
  - id: door_1_05
    pathway: door
    seq: 1
    sequenceTitle: 星之匙
    order: 5
    text: 前置其他能力的强化。
  - id: door_0_01
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 1
    text: “门”之概念（包含空间、封印等权柄）：能打开或关上整个世界所有与门这个概念相关的事物，使封印在一定时间内破除或加强。
  - id: door_0_02
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 2
    text: “空间”权柄：能凭空制造空间牢笼；能令空间退化和毁灭，使目标随着周围虚空坍塌和毁灭并被幽黑吞没；能瞬间前往任何一片空间；能开辟一个新的异度空间——“门”先生用来制造了特殊镜中世界。
  - id: door_0_03
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 3
    text: 对所有异度空间都能施加足够的影响。
  - id: door_0_04
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 4
    text: 封印权柄：不仅仅是空间牢笼，还包含时光、迷宫等要素，能于短时间内封印住一位“旧日”，当然，前提是那位旧日不反抗。
  - id: door_0_05
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 5
    text: 除了特定旧日，没谁能困住“门”。
  - id: door_0_06
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 6
    text: “闪现”的极致是“无处不在”。
  - id: door_0_07
    pathway: door
    seq: 0
    sequenceTitle: 门
    order: 7
    text: “概念化”：序列0质变的旅法师能力，可以变成概念生物——身影扭曲，瞬间染上璀璨的星光，变得极为虚幻，仿佛化成一道星门，不再像是实体生物，更接近“漫游”、“星界通道”、“钥匙”、“门”等象征的集合体。
  - id: door_0_08
    pathway: door
    seq: 0
