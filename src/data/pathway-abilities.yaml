    seq: 0
    sequenceTitle: 黄昏巨人
    order: 12
    text: 部分“神圣”权柄：消亡是生命乃至世界最后也最严肃的事情，自然也非常神圣，故而“巨人”同样擅长净化，分辨邪恶和堕落。
