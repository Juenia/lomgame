    pathway: spectator
    seq: 0
    sequenceTitle: 空想家
    order: 1
    text: “空想”权柄（幻想成真权柄）：“空想家”所想象的物品，必将具现而出，祂所幻想的国度，必将降临于物质世界，祂所宣称的未来，必将上演，成为现实——这涉及的不仅仅是心灵和认知，还有星界（概念和象征汇聚的世界），所以“空想家”能分离两份序列1非凡特性出来，以空想出的相应特性代替，保持自己的位格不降，力量不减，而分离出的两份真实的作家特性，可以与自己的某个身份，或者空想出来的某个生灵结合，让他们成为“作家”，自由行动，在必要时候，通过某种方式或某些媒介，转变为本体；只要对相应的概念有足够的了解和掌握，“空想家”可以在某种意义上全能，但这样的全能无法抗拒消除虚幻、刺破空想的权柄。
