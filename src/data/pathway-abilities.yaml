    order: 65
    text: 命运长河中的九处道标（过去、现在或未来的都行）
  - id: prisoner_9_01
    pathway: prisoner
    seq: 9
    sequenceTitle: 囚犯
    order: 1
    text: 身体强壮，知觉敏锐，往往同时拥有沉默的外表和疯狂的内心。
  - id: prisoner_9_02
    pathway: prisoner
    seq: 9
    sequenceTitle: 囚犯
    order: 2
    text: 掌握着诸多犯罪技巧，比如用铁丝开锁，用汤勺挖地道，擅长用随手得到的任何物品杀人。
  - id: prisoner_8_01
    pathway: prisoner
    seq: 8
    sequenceTitle: 疯子
    order: 1
    text: 可以自行且主动地牺牲理智，爆发欲望，以此换取力量，获得所有方面的提高，除了头脑会在那段时间变得不太清醒，并不存在太大的问题，甚至还会因此获得对某些干扰思绪、影响精神的非凡能力的强大抵抗力。
  - id: prisoner_8_02
    pathway: prisoner
    seq: 8
    sequenceTitle: 疯子
    order: 2
    text: “诅咒”：由于频繁爆发欲望会导致精神经常运行于低谷，因此“疯子”比大部分超凡者更容易失控。
  - id: prisoner_7_01
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 1
    text: “异种”的一类。
  - id: prisoner_7_02
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 2
    text: 拥有恐怖的力量、敏捷和速度，自愈能力出色。
  - id: prisoner_7_03
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 3
    text: “狼人化”后，这些都还会得到一定程度的提升，比如，可将全速追逐灰狼甩远，比如，哪怕腹部出现狰狞的伤口，肠子都流出来，也只需要用清水洗了洗，再把肠子塞回去，并用手捏住缝隙两侧，到了最后，伤口就会愈合，比如，双臂膨胀，手背长出一撮撮灰色的短毛，指甲变得又长又利又坚固后，手爪和牙齿坚固锋利，自带毒性，相当于同序列的非凡武器，能破坏较薄的钢板。
  - id: prisoner_7_04
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 4
    text: 掌握少数黑暗类法术：
  - id: prisoner_7_05
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 5
    text: · 1.控制被狼人毒性浸入身体一段时间的目标，并将对方转化为下属，变成类似狼人但生命短暂的傀儡怪物；
  - id: prisoner_7_06
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 6
    text: · 2.“驱光”，让周围的黑暗变得沉重少许，排除出微弱程度的光芒或者绯红的月光；
  - id: prisoner_7_07
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 7
    text: · 3.“黑暗恐惧”，让黑暗如寒霜般缓慢但坚定地渗入目标的皮肤、血肉和骨头，让他们不可遏制地产生一定的恐惧，逐渐感受到寒冷，受到少许影响。
  - id: prisoner_7_08
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 8
    text: 初步的“反占卜”：不论是否变身，任何占卜和通灵的手段都只能看到被满身黑毛覆盖的身影，看不清本来面目。
  - id: prisoner_7_09
    pathway: prisoner
    seq: 7
    sequenceTitle: 狼人
    order: 9
    text: “诅咒”：已经是完整的被诅咒者，每次红月变圆的时候，就会失去大部分理智，长出满身的黑毛，本身的杀戮和嗜血欲望随之达到顶点。总是无法在满月之夜压抑杀戮和嗜血欲望的话，会越来越冷酷，越来越扭曲，逐渐失去正常人类该有的感情。
  - id: prisoner_6_01
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 1
    text: 另一类“异种”，真正活着的死尸。
  - id: prisoner_6_02
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 2
    text: 身体可以像钢铁一样坚硬，能硬挡子弹和炮弹。即使用左轮手枪抵住脑袋发射，也最多出现眩晕，至少五次击中同一个位置，才有可能打破防御。而就算打破了，只要脑袋没碎，其他伤害都不算致命。不怕火烧、不怕溺水、不怕多种魔法，灵体层面的伤害对他们更为有效。
  - id: prisoner_6_03
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 3
    text: 动作迅捷，全速奔跑时速度比处于最高峰的蒸汽列车还快。
  - id: prisoner_6_04
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 4
    text: 掌握了部分死亡类法术，并熟练地运用腐烂类超凡之力，能使周围生物枯萎，或给自身部位添加腐烂的气息，或制造腐烂的淤泥。
  - id: prisoner_6_05
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 5
    text: “活尸力量”：力量强大，在“狼人”的基础上又有所提升，能做出狂暴的攻击，直接撕裂对手。
  - id: prisoner_6_06
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 6
    text: “冰的掌控”：能运用寒冷类超凡之力和部分冰霜类法术，比如，使脚底白霜凝聚，寒冷而透明的冰层飞快蔓延；比如，降低空气温度，使四周刮起大风，飘起美丽梦幻的雪花，有效影响对手的行动；而如果出现身体接触，甚至还能冻住敌人，僵硬他的血肉。
  - id: prisoner_6_07
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 7
    text: “操纵活尸”：能轻松唤醒死尸、培养傀儡、控制幽魂，驱使它们。
  - id: prisoner_6_08
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 8
    text: “诅咒”：会渴望人类温热的血液和新鲜的血肉，满月的时候，这种状态尤其严重。每当红月变圆，就会非常痛苦，如果不放弃自制，将痛苦到失去战斗的能力，而要是放纵了自身，同样会越来越不像人类，失控的风险很高。即使平时，也在时刻对抗着心里的欲望，对抗着强烈的恶意。
  - id: prisoner_6_09
    pathway: prisoner
    seq: 6
    sequenceTitle: 活尸
    order: 9
    text: 之前序列别的特质和能力保持原本状态，未有显著变化。
  - id: prisoner_5_01
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 1
    text: 另一类异种。
  - id: prisoner_5_02
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 2
    text: 身体如同灵肉合一般，可以将自身的状态转化为真正的幽影，并获得相应的能力，比如，穿过障碍物，藏身镜子里，直接攻击对方的灵魂。而和普通的怨魂不同，哪怕拥有灵视，不到高序列，也无法发现这种幽影。
  - id: prisoner_5_03
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 3
    text: 拥有夜视能力；有很强的冰冻抵抗能力。纯物理没有附带特殊力量的武器或者枪械无法对怨魂造成伤害，连脑袋都不是要害，灵体也并不害怕中毒。
  - id: prisoner_5_04
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 4
    text: 掌握了许多死亡类的法术，不少诡异技巧：
  - id: prisoner_5_05
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 5
    text: · “怨灵之缠”：“怨魂”的死亡类法术之一，作用是召唤出大量较为特殊的不死生物，将目标固定在原地，让他麻痹僵硬，难以移动，而召唤出来的不死生物种类不同，在具体效果的呈现上会有一定的不同。
  - id: prisoner_5_06
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 6
    text: · “怨魂附身”：又称恶灵附身。在一定范围内，隔空附身目标，被附身者两个瞳孔会浮现自身的身影。控制敌人能在附体目标并杀死对方后让非凡特性加速析出。
  - id: prisoner_5_07
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 7
    text: · “怨魂尖啸”：发出能刺破人耳膜，伤害到灵体的尖啸。
  - id: prisoner_5_08
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 8
    text: · “镜面闪现”：又称镜面跳跃、镜面闪烁。能跳跃于大部分能反射出影像的地方，有效距离最远300米。
  - id: prisoner_5_09
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 9
    text: · “冰的掌控”：序列5层面的活尸能力。能凝聚出冰晶细箭，能让火焰熄灭、草木枯萎。
  - id: prisoner_5_10
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 10
    text: · “灵性直觉”：“怨魂”能直接沟通灵界，不论是占卜还是灵性直觉都会在此阶段获得极大提升。
  - id: prisoner_5_11
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 11
    text: · “灵界穿梭”：“怨魂”能够自由的出入灵界，并在其中自由活动。
  - id: prisoner_5_12
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 12
    text: · “反占卜”：任何指向它们的占卜只能看到透明仿佛不存在的脸庞或者一片被黑暗遮蔽的脸庞。
  - id: prisoner_5_13
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 13
    text: · “诅咒”：红月变圆的夜晚，要么吸食一定数量的人类灵魂，要么变得极端虚弱，选择了前者，也就选择了时刻走在失控的边缘。
  - id: prisoner_5_14
    pathway: prisoner
    seq: 5
    sequenceTitle: 怨魂
    order: 14
    text: 之前序列其他能力大致保持原状，未有显著提升。
  - id: prisoner_4_01
    pathway: prisoner
    seq: 4
    sequenceTitle: 木偶
    order: 1
    text: 异种的一类，能操纵一定范围内的全部无生命物品，包括目标身上的普通事物和未被掌握的无灵的神奇物品。
  - id: prisoner_4_02
    pathway: prisoner
    seq: 4
    sequenceTitle: 木偶
    order: 2
    text: 除了太阳领域的神术以外，比巫王更能承受伤害。
  - id: prisoner_4_03
    pathway: prisoner
    seq: 4
    sequenceTitle: 木偶
    order: 3
    text: “诅咒之源”：可以变成秘术木偶、神奇纸人等物品，通过建立起来的联系用各种方法诅咒目标。对任一方的任何伤害，都将反应在另一方身上。当前阶段属于伤害到敌人也会伤害到自己的类型。
  - id: prisoner_4_04
    pathway: prisoner
    seq: 4
    sequenceTitle: 木偶
    order: 4
    text: “演出”：“木偶”能表演“囚犯”、“疯子”、“狼人”、“活尸”、“怨魂”等角色，将他们的能力和特质提升到具备神性的弱序列4层次，比如，“怨魂”附身有灵的物品。
  - id: prisoner_4_05
    pathway: prisoner
    seq: 4
    sequenceTitle: 木偶
    order: 5
    text: “物化”：将自己物品化可强行束缚住内心的疯狂和欲望，但转为真正的木偶后，是无法影响和干涉外界的，只能通过提前预备的、触发式或范围式的诅咒，以及控制的傀儡来保护自己；另一方面，这个能力也可运用于他人身上，以达到暂时控制疯狂或进行封印的目的，但在当前阶段，必须对方心甘情愿，且有身体的接触。
  - id: prisoner_3_01
    pathway: prisoner
    seq: 3
    sequenceTitle: 沉默门徒
    order: 1
    text: 能附身在物体上。
  - id: prisoner_3_02
    pathway: prisoner
    seq: 3
    sequenceTitle: 沉默门徒
    order: 2
    text: 可在长久的沉默中酝酿出极致的诅咒，让目标难以对抗。
  - id: prisoner_3_03
    pathway: prisoner
    seq: 3
    sequenceTitle: 沉默门徒
    order: 3
    text: “变形诅咒”：这既是一种诅咒，也是“物化”的质变——嘴巴张开，像是在做无声的尖啸，能使目标在一定时间内变成其他生物，变形后会“失去”绝大部分特质和非凡能力，可以将魔女与魔女的镜中人一齐变形，除非是“不老魔女”切断了神秘学联系、沉睡于秘藏镜子中的那种“镜中人”，才能免于影响。
  - id: prisoner_3_04
    pathway: prisoner
    seq: 3
    sequenceTitle: 沉默门徒
    order: 4
    text: “诅咒之源”：使用后伤害敌人不再会使自己受伤，除了伤害，还能通过不同的方式或相应的媒介，达到放逐、固定、沉睡等效果。
  - id: prisoner_3_05
    pathway: prisoner
    seq: 3
    sequenceTitle: 沉默门徒
    order: 5
    text: 之前序列其他能力的提升。
  - id: prisoner_2_01
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 1
    text: 拥有直接攻击和影响灵体的能力。
  - id: prisoner_2_02
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 2
    text: 部分“诅咒”权柄。
  - id: prisoner_2_03
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 3
    text: “变形诅咒”：天使层面的”沉默门徒”能力。能让被映在眼眸内的目标变成其他生物，维持的时间几乎没有上限，如果没有同阶的对抗或正确的办法，是没法解除的，而只要不解除诅咒，它们就是真正的动物。非凡者被“变形”后遗留的肢体是含有一部分非凡特性的，它们无法回归。
  - id: prisoner_2_04
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 4
    text: “诅咒之源”：神话生物形态外显为晋升仪式中所使用的凭依物，上面的花纹、图案、饰物和每一处细节都是不同诅咒的具现，凡是看到的生灵，皆会遭受对应的诅咒，而周围的环境，会被自然的影响和扭曲，沾染上种种弱化的诅咒；若是了解目标的核心信息，可以制作纸人、木偶等媒介，隔空诅咒对方，甚至让他突然暴毙。
  - id: prisoner_2_05
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 5
    text: “邪物”：作为异类的一种，未显现神话生物形态的“古代邪物”能让目标或靠近者、目睹者产生非常强的邪念，或三观改变，或欲望爆发，或当场疯狂。
  - id: prisoner_2_06
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 6
    text: “古代邪物”需要有“居所”，这是束缚的体现，也是找到祂们凭依物并摧毁它的最好途径。
  - id: prisoner_2_07
    pathway: prisoner
    seq: 2
    sequenceTitle: 古代邪物
    order: 7
    text: 之前序列其他能力的提升。
  - id: prisoner_1_01
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 1
    text: 部分“异类”权柄。
  - id: prisoner_1_02
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 2
    text: 能发出直刺灵体的极端邪异的嘶吼，让目标颤抖，出现一定的僵直，并令他们脑海突然空白，短暂失去所有思绪。
  - id: prisoner_1_03
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 3
    text: 即便不直接攻击敌人，也能让敌人不知不觉遭受侵蚀与诅咒，灵性被影响，“凝固”少许，似乎在束缚身体和灵魂，身体与灵魂的契合程度在一点点下降，身体逐渐成为灵的囚笼，让动作越来越僵硬，越来越沉重。
  - id: prisoner_1_04
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 4
    text: 能令周围的灵性异变，似乎化成一重又一重屏障，试图将目标束缚在原地，限制他们的行动，这种是对环境的诅咒影响造成的，同样的，还能令附近沸腾，覆盖上黏稠的黑色液体，往上侵蚀虚空，干扰现实与灵界的重叠。
  - id: prisoner_1_05
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 5
    text: “转化”：部分“异类”权柄，“神孽”的诅咒不仅能让周围的生物变形，还可以将他们转化成狼人、活尸、木偶等异种，但这些异种傀儡只能短暂维持，很快会被疯狂吞噬，变成沾染了诅咒的尸体或血肉。
  - id: prisoner_1_06
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 6
    text: “孽物”：能让极端邪恶极端疯狂的感觉飞速弥漫，让周围瞬间干裂，并使他人意识沾染疯狂，或直接暴毙，或出现异变，或攻击起自己人，短暂无法做出有效应对。
  - id: prisoner_1_07
    pathway: prisoner
    seq: 1
    sequenceTitle: 神孽
    order: 7
    text: 之前序列其他能力的提升。
  - id: prisoner_0_01
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 1
    text: 因为有束缚和集合的象征，所以“被缚者”的权柄非常集中，主要有诅咒、束缚（节制）、异类和物品。
  - id: prisoner_0_02
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 2
    text: “诅咒”：能在序列0层次初步涉及象征的应用，从而让目标不知不觉遭受诅咒；能完成所有类型的诅咒；本身很难被诅咒，许多象征层面成立的联系无法影响到“被缚者”，除非真的有非常强非常直接的关联。
  - id: prisoner_0_03
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 3
    text: “异类”：异类之王，除了能转化出所有类型但只能短暂存在的异种，掌控他们相应的能力，还可以让每一类异种以最简单的方式向祂祈求，而祂能做出响应，给予帮助；所有的异类在面对“被缚者”时都天然被压制，中低序列的甚至会直接成为祂忠心的“仆役”（异类指所有因非凡特性带来的负面影响化成的怪物，这甚至包括恶魔，也包括其他途径的失控者）。
  - id: prisoner_0_04
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 4
    text: “束缚”（节制）：可束缚甚至封印疯狂、欲望、物品、生物和非凡特性的种种倾向等，在一点上，若不到封印的程度，是“被缚者”强于“门”，封印则是“门”强于“被缚者”；反过来，“被缚者”也能让他人失去束缚，不再节制（这其实是“放纵”权柄被集中到了“束缚”权柄内）。
  - id: prisoner_0_05
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 5
    text: “物品”：掌控各种物品，无论它们有灵还是无灵。
  - id: prisoner_0_06
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 6
    text: 神国：各种诅咒被束缚在不同物品中、有大量异类以雕像形式存在但可以活化过来的“荆棘乐园”。
  - id: prisoner_0_07
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 7
    text: 沉默之石
  - id: prisoner_0_08
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 8
    text: 伪人的血液之源
  - id: prisoner_0_09
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 9
