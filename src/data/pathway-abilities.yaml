  - id: reader_9_01
    pathway: reader
    seq: 9
    sequenceTitle: 阅读者
    order: 1
    text: 记忆的提升和理解能力、学习能力的增强，能使用仪式魔法，如果大量阅读书籍，会有丰厚的知识储备。
  - id: reader_8_01
    pathway: reader
    seq: 8
    sequenceTitle: 推理学员
    order: 1
    text: 观察力提升，逻辑思维能力提升，仪式魔法的专家。
  - id: reader_7_01
    pathway: reader
    seq: 7
    sequenceTitle: 守知者
    order: 1
    text: 属于偏知识掌握和推理能力的“职业”，再附带不错的格斗和器械使用能力，行动力变强，武器精通，格斗大师，推理大师，仪式魔法大师——格斗大师是相对普通人而言，因为侦探提升的身体素质较少，所以不如擅长战斗的非凡者。
  - id: reader_7_02
    pathway: reader
    seq: 7
    sequenceTitle: 守知者
    order: 2
    text: 可借助非凡手段解析并且还原一定区域内所发生过的事件。
  - id: reader_6_01
    pathway: reader
    seq: 6
    sequenceTitle: 博学者
    order: 1
    text: 能让你了解很多，懂得很多。因博学而多能，能辨识、看清、记住和模仿见过的能力。与“记录官”不同，“博学者”是通过学习、分析非凡能力的原理而进行模仿，没有使用次数的限制。他们的知识越全面，掌握的程度越深，“解析”的效果越好，“模拟”成功的概率越高，威能越强，不过，同序列时，他们模拟出来的非凡能力始终不如原版。
  - id: reader_6_02
    pathway: reader
    seq: 6
    sequenceTitle: 博学者
    order: 2
    text: “解析”：可以在具备前置知识的情况下，“解析”对手使用的非凡能力，迅速辨识出具体情况，明白擅长和缺陷，当然，解析也会错误和失败。
  - id: reader_6_03
    pathway: reader
    seq: 6
    sequenceTitle: 博学者
    order: 3
    text: “模仿”：有几率在一定程度上对解析的能力进行模仿。对手越强，失败的可能越高，当然，就算成功，肯定也与原版有很大差距。在“博学者”阶段，只要解析、掌握了对应知识，不存在模仿法术和能力的数量限制，而根据解析的程度、掌握知识的程度、魔药消化的程度，模仿的效果会有所不同，最低可能只有原版的20%，最高是一半。
  - id: reader_5_01
    pathway: reader
    seq: 5
    sequenceTitle: 秘术导师
    order: 1
    text: 掌握神奇多样、独特罕见的秘术，甚至能自行发明创造一些属于自己的，奇怪却有效的法术，比如，可以用秘术延缓非凡者自身的失控，比如，用秘术永久性或临时性提升自己的身体素质。
  - id: reader_5_02
    pathway: reader
    seq: 5
    sequenceTitle: 秘术导师
    order: 2
    text: 根据选择的仪式不同，秘术导师创造的、也是最擅长的秘术所在领域也会有所不同：“教导出至少五十个通才”意味着秘术领域全面，没有短板，但也不存在长板，“教导出至少五名自行领悟‘扮演法’的中序列非凡者”，则更擅长在对应中序列非凡者所在领域创造和使用秘术。
  - id: reader_5_03
    pathway: reader
    seq: 5
    sequenceTitle: 秘术导师
    order: 3
    text: “秘术导师”在刚晋升时，能自然地从“全知”权柄掌控者那里获得六到十三种秘术，之后则通过学习和自我创造来获得秘术。
  - id: reader_5_04
    pathway: reader
    seq: 5
    sequenceTitle: 秘术导师
    order: 4
    text: 所谓“秘术”，就是秘密的、有特殊性和独特性的法术，和“巫师”们创造的法术不同之处在于，“秘术”往往可以省略施法材料、引导咒文和绝大部分施法步骤，更为快速更为隐秘，当然，并不是所有“秘术”都可以省略那些，有前置准备的“秘术”一般而言，要么有非常特殊的效果，要么非常强大。
  - id: reader_5_05
    pathway: reader
    seq: 5
    sequenceTitle: 秘术导师
    order: 5
    text: 前面序列能力的提升，比如，“博学者”模仿的法术效果达到原版的60%。
  - id: reader_4_01
    pathway: reader
    seq: 4
    sequenceTitle: 预言家
    order: 1
    text: 身体素质半神化。
  - id: reader_4_02
    pathway: reader
    seq: 4
    sequenceTitle: 预言家
    order: 2
    text: 开始掌握命运领域较高层次的神秘学知识，从而获得“预言”能力。
  - id: reader_4_03
    pathway: reader
    seq: 4
    sequenceTitle: 预言家
    order: 3
    text: “预言”：较为清晰地看到未来最有可能上演的几种可能性或者模糊地看到最会变成现实的那种可能。
  - id: reader_4_04
    pathway: reader
    seq: 4
    sequenceTitle: 预言家
    order: 4
    text: “星界秘术”：“预言家”可掌握部分不危险的星界知识，从而依靠这些知识学习或创造一些利用星界力量的秘术，比如，“赫拉伯根的除虫术”，因为“虫”这个概念的指向，这个秘术能有效灭杀范围内的各种单个“虫”，比如，某某某，某某某，某某某，但不包括虫的集合体。
  - id: reader_4_05
    pathway: reader
    seq: 4
    sequenceTitle: 预言家
    order: 5
    text: 前面序列能力的提升，“博学者”模仿的法术效果达到原版的80%。
  - id: reader_3_01
    pathway: reader
    seq: 3
    sequenceTitle: 洞悉者
    order: 1
    text: 一定的“规律”权柄。
  - id: reader_3_02
    pathway: reader
    seq: 3
    sequenceTitle: 洞悉者
    order: 2
    text: “洞悉”：能洞悉世界的规则，掌握许多深层次的奥秘。敌人在这个序列的非凡者面前，很难有秘密可言，无论弱点，还是强项，都暴露无遗。
  - id: reader_3_03
    pathway: reader
    seq: 3
    sequenceTitle: 洞悉者
    order: 3
    text: 正因为掌握了撬动世界撬动目标的杠杆，这个序列的非凡者可以用非常轻松的方式解决问题，比如，让一座山峰崩塌，也许不需要灾祸、毁灭相关的能力，只用撬走其中一块岩石。
  - id: reader_3_04
    pathway: reader
    seq: 3
    sequenceTitle: 洞悉者
    order: 4
    text: “洞悉者”对规律的利用不是直接影响规律，而是洞悉了规律的本质后，采用相应的办法来撬动规律，一个简单的例子是：“欺瞒导师”是直接欺诈规律、规则，而“洞悉者”想达到类似的效果，先得做出针对性的、有误导性的行为，然后撬动规律，达到欺瞒的目的。
  - id: reader_2_01
    pathway: reader
    seq: 2
    sequenceTitle: 智天使
    order: 1
    text: 一定的“智慧”权柄：总是能提前看清楚局势的变化，做出最正确最及时的选择。
  - id: reader_2_02
    pathway: reader
    seq: 2
    sequenceTitle: 智天使
    order: 2
    text: “智慧”还带来了“学习”、“解析”等能力的提升，让它们达到能少量利用权柄的程度，模仿能力和法术的效果达到原版的90%。
  - id: reader_2_03
    pathway: reader
    seq: 2
    sequenceTitle: 智天使
    order: 3
    text: 之前序列能力的提升。
  - id: reader_1_01
    pathway: reader
    seq: 1
    sequenceTitle: 全知之眼
    order: 1
    text: 部分“全知”权柄：可以看到目标过去、现在、未来的全部信息；模仿能力和法术的效果达到原版的100%——不涉及权柄。
  - id: reader_1_02
    pathway: reader
    seq: 1
    sequenceTitle: 全知之眼
    order: 2
    text: “星界导师”权柄：可以在短时间里，在较小范围内，通过对星界概念的触及和利用，使得目标的某些行为失去效果或出现错误或扩大影响，比如，短时间内重新定义心灵大海的“水”、“混沌海”的“水”等概念，让它们无法被“暴君”利用，或更好的利用——这种概念的临时性修改，只能作用于原本概念的其中一方面且必须是不涉及主体的部分，并且不能超过一项。
  - id: reader_1_03
    pathway: reader
    seq: 1
    sequenceTitle: 全知之眼
    order: 3
    text: 之前序列能力的提升。
  - id: reader_0_01
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 1
    text: “全知”权柄：对万事万物“全知”，这不受灵界影响，而全知意味着全能，“白塔”可以模仿任何一种能力，威力达到原版，甚至做出优化，有所超过，当然，这不包括“权柄”和“象征”，即使“白塔”对“权柄”和“象征”对应的知识完全掌握，也无法获得它们，只能模仿一些外延性的表现，因为“权柄”和“象征”更像是权限和概念的实体化，没得到就无法使用。“全知”会被“痴愚”、“不可思议”等象征影响。
  - id: reader_0_02
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 2
    text: 部分“创造”权柄：源于“造物”象征和“全知全能”象征，全知的“白塔”自然能创造任何东西，只是无法脱离那些不属于自己的象征和权柄。
  - id: reader_0_03
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 3
    text: “星界阶梯”权柄：“白塔”能在一定程度上影响星界汇聚的概念，也象征着知识一层层通向宇宙最本质的那些象征，通向最源头的那些危险。
  - id: reader_0_04
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 4
    text: 部分“智慧”权柄：全知意味着能给出最具智慧的指引，做出最具智慧的选择。
  - id: reader_0_05
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 5
    text: 一定的“灾祸”权柄：能给予他人“疯狂”和“毁灭”，某些知识就是这些象征的具现化。
  - id: reader_0_06
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 6
    text: 部分“规律”权柄：来自“全知”的下位权柄，知晓的规律，就能掌握规律，利用规律。
  - id: reader_0_07
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 7
    text: 部分“学习”权柄：“全知”和“智慧”的下位权柄。
  - id: reader_0_08
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 8
    text: 部分“解析”权柄：“全知”和“智慧”的下位权柄。
  - id: reader_0_09
    pathway: reader
    seq: 0
    sequenceTitle: 白塔
    order: 9
    text: 神国：全知之塔或疯狂之塔。
