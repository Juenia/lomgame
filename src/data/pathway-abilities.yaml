  - id: hunter_9_01
    pathway: hunter
    seq: 9
    sequenceTitle: 猎人
    order: 1
    text: 无论力量，速度，反应，还是对身体的控制能力，都获得了极大增强，既有熊的强壮，又有猫的轻灵，略等于两者的综合体。同时恢复能力也得到增强。
  - id: hunter_9_02
    pathway: hunter
    seq: 9
    sequenceTitle: 猎人
    order: 2
    text: 包括嗅觉、视觉、听觉在内的感官能力直线提升，对痕迹的把握超越了正常人类的水准。需要集中精神才会呈现，平时只是以弱化版本的状态存在。
  - id: hunter_9_03
    pathway: hunter
    seq: 9
    sequenceTitle: 猎人
    order: 3
    text: 在对环境细致观察的前提下，能准确地、直观地找到某些要点，比如，怎么更轻松地把一堵墙壁弄塌。这能更好更快速地设置陷阱，更有效地完成猎杀。
  - id: hunter_9_04
    pathway: hunter
    seq: 9
    sequenceTitle: 猎人
    order: 4
    text: 获得一些野生植物、动物器官的知识，这能帮助非凡者更好地在野外生存，受伤后能迅速找到合格的“止血药”，需要时更方便地制作出涂抹于武器上的毒药。
  - id: hunter_9_05
    pathway: hunter
    seq: 9
    sequenceTitle: 猎人
    order: 5
    text: 灵性直觉增强。
  - id: hunter_8_01
    pathway: hunter
    seq: 8
    sequenceTitle: 挑衅者
    order: 1
    text: 能掌握情报、信息和流言，精准地挑衅、激怒他人。
  - id: hunter_8_02
    pathway: hunter
    seq: 8
    sequenceTitle: 挑衅者
    order: 2
    text: 身体更结实了，恢复能力也强了不少；
  - id: hunter_8_03
    pathway: hunter
    seq: 8
    sequenceTitle: 挑衅者
    order: 3
    text: 灵性有了一定的增长，比如，原本只能维持三分钟的灵性，可以提升到四分钟；
  - id: hunter_8_04
    pathway: hunter
    seq: 8
    sequenceTitle: 挑衅者
    order: 4
    text: “挑衅”：
  - id: hunter_8_05
    pathway: hunter
    seq: 8
    sequenceTitle: 挑衅者
    order: 5
    text: · 洞察能力有了质变，远超普通人，可以有效地察觉到目标对哪些语言哪些行为哪些事情更为敏感，在哪些方面更容易被激怒。
  - id: hunter_8_06
    pathway: hunter
    seq: 8
    sequenceTitle: 挑衅者
    order: 6
    text: · 主动使用“挑衅”，它将与辱骂的语言、羞辱的行为结合在一起，让可以沟通的目标因此失去理智。辱骂的语言和羞辱的行为越有针对性，“挑衅”的效果就越好。面对野兽、怪物、失控至无法沟通的人等等缺少理智的目标时，能主动散发出让对方憎恶的感觉。
  - id: hunter_7_01
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 1
    text: 灵性得到了很大的提升，可以用更隐蔽也更快捷的方式开启灵视，能够看到“以太体”各个部位的颜色，不再是只有混沌单一的画面。
  - id: hunter_7_02
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 2
    text: 危险直觉获得了一定的增强，不再只是问题快要爆发时才产生感应，可以通过观察环境搜集信息来激发这方面的直觉，相应的，更能察觉到是否被人跟踪，可以更充分更完美地应用本身的反跟踪技巧。
  - id: hunter_7_03
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 3
    text: 有了对火焰的操控能力
  - id: hunter_7_04
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 4
    text: · 凝聚压缩，以火球的形式轰炸目标，压缩的时间越久，积累的火焰越多，威力越大；
  - id: hunter_7_05
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 5
    text: · 让纵火家的体表燃烧起一层火焰，以此在一定程度内防御冰冻影响、毒气伤害等攻击；
  - id: hunter_7_06
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 6
    text: · 用火焰制造不同的临时武器，以此带来高温切割、灼烧刺穿等伤害，这同样能根据蓄力时间的不同，分为赤红和炽白两种；
  - id: hunter_7_07
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 7
    text: · 延时爆炸，依靠附加灵性和改变结构，让制造出来的“火焰炸弹”在预定的时间爆炸，而不是当场被引爆；
  - id: hunter_7_08
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 8
    text: · 范围影响，通过延伸火焰而不是将它扔出去，保证火焰受到本身的操纵，在设想的位置爆开或以不同的形式燃烧；
  - id: hunter_7_09
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 9
    text: · “注火”，借助近身搏斗时身体接触、力量碰撞带来的压力，将火焰一点点灌入敌人的体内，最后再引爆；
  - id: hunter_7_10
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 10
    text: · 给本身的武器附加火焰伤害。
  - id: hunter_7_11
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 11
    text: 附带的几个法术
  - id: hunter_7_12
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 12
    text: · 火鸦术：能够在身周快速凝聚出一群火焰乌鸦，并给每一只火鸦都分配一点灵性，使得它们脱离身体后，依旧能在一定程度内受到操纵，从而简单调整弹道，初步锁定目标。
  - id: hunter_7_13
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 13
    text: · 炽白之枪：一种较快速凝聚炽白火焰的法术，但是只能以长枪的形式存在，而附加了灵性的它还可以粗略引导纵火家制造出来的火球。
  - id: hunter_7_14
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 14
    text: · 燃烧之墙：以大地为媒介，以本身为源头，通过制造两道火蛇蹿向敌人，在他周围铸起一圈熊熊燃烧的墙壁。
  - id: hunter_7_15
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 15
    text: · 巨大火球：需要耗费十几二十秒的时间，相当于把多个赤红火球压缩成一个发射。
  - id: hunter_7_16
    pathway: hunter
    seq: 7
    sequenceTitle: 纵火家
    order: 16
    text: 经过魔药的改造，纵火家的身体对火焰有了很强的抵御能力，即使被浇上动物油脂，用火把点燃，烧上半天，纵火家收到的伤害也达不到严重这个程度，但火球爆炸带来的冲击波依旧能正常伤害到纵火家。
  - id: hunter_6_01
    pathway: hunter
    seq: 6
    sequenceTitle: 阴谋家
    order: 1
    text: 洞察能力上升，思维更为敏捷和清晰，并由此带来的一系列具体表现，比如，智商似乎提高了，编造理由说服他人的水平同样如此。除此之外还有误导、迷惑和欺骗方面的超凡能力。这种能力是“阴谋”的核心组成部分。和“误导”类似的能力还有一个叫“煽动”或者“鼓动”，这与魔女们的“教唆”非常接近。“阴谋家”魔药都是围绕阴谋带来改变，战斗方面没有质的提升。
  - id: hunter_6_02
    pathway: hunter
    seq: 6
    sequenceTitle: 阴谋家
    order: 2
    text: 体质有了一定的增强，对火焰的精细化操纵也得到了提升，不用每次都只是火鸦、火球、长枪、火蛇和火墙，能随意地将火焰塑造成不同的外形，比如鞭子和马刀等。
  - id: hunter_6_03
    pathway: hunter
    seq: 6
    sequenceTitle: 阴谋家
    order: 3
    text: 反复压缩赤红火焰以形成炽白火焰的难度也降低了，需要的时间显著缩短，这根据火焰具体的外形和能量的密度，一到三秒不等。
  - id: hunter_6_04
    pathway: hunter
    seq: 6
    sequenceTitle: 阴谋家
    order: 4
    text: 能让自己的身体与火焰短暂结合，借助火球等事物的发射快速转移位置，或逃出敌人的攻击范围，或将双方的距离拉到足够近。
  - id: hunter_6_05
    pathway: hunter
    seq: 6
    sequenceTitle: 阴谋家
    order: 5
    text: 灵性增强。信息搜集能力提升，这带来了身体五感和灵性感知的增强。
  - id: hunter_5_01
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 1
    text: 弱点侦察：能从神秘学角度发现目标的弱点和防御的薄弱处。能力发动时，双眸会变成铁黑色。
  - id: hunter_5_02
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 2
    text: 收割：可以附加到任何攻击中用以收割目标的生命。被"收割"创伤了任何部位都相当于要害和弱点遭遇了攻击，会承受很大的伤害。如果"收割"命中的是真正的弱点真正的要害，则可能达成一击致命的效果，即使目标防御很强，也很难连续承受这样的攻击三下。这甚至可以给半神层次的生物带来真实伤害，但前提是对方不格挡，未能成功闪避，且没有用任何神秘学手段防御。
  - id: hunter_5_03
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 3
    text: 精准：能让任何攻击都精准地命中预定的位置，并精确地操纵离开了身体的火球、火鸦等法术。可以让一团巨大的火球一分为百，都较为精准地打击到不同的目标，从而实现范围性的有效杀伤。
  - id: hunter_5_04
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 4
    text: · 无论"收割"还是"精准"都很消耗灵性，唯一的例外是"精准"搭配火鸦，因为火鸦本身就有能分配一点灵性，易于操纵的特点，所以即使附加了"精准"，它对灵性的消耗也不怎么大。
  - id: hunter_5_05
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 5
    text: 灵性显著提升，头脑更为清晰，生命愈发旺盛，并能在极短的时间内将火焰压缩到炽白。
  - id: hunter_5_06
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 6
    text: 可以和火焰长枪结合，进行迅速飞越。如果不考虑灵性的消耗，完全能以此赶路。
  - id: hunter_5_07
    pathway: hunter
    seq: 5
    sequenceTitle: 收割者
    order: 7
    text: 力量、速度、体质等方面也有提升，但没到可以凭肉体硬挡子弹的程度。
  - id: hunter_4_01
    pathway: hunter
    seq: 4
    sequenceTitle: 铁血骑士
    order: 1
    text: 拥有堪比钢铁的勇气，不再被恐惧击倒，不再因害怕而僵硬，但不会因此而盲目和鲁莽。其实，依旧会恐惧和害怕，只是会被勇气战胜。
  - id: hunter_4_02
    pathway: hunter
    seq: 4
    sequenceTitle: 铁血骑士
    order: 2
    text: 能操纵多种火焰，其中最厉害火焰是青色，但不纯粹，会带上炽白。
  - id: hunter_4_03
    pathway: hunter
    seq: 4
    sequenceTitle: 铁血骑士
    order: 3
    text: 火焰化：可以让自己分散成多股火焰，每股火焰都能精准操纵，最后聚合在一起，重组出身体，这个过程中，就算分散出去的火焰被敌人弄灭了大半，也不影响身体的完整，只是气息和灵性会对等衰弱。
  - id: hunter_4_04
    pathway: hunter
    seq: 4
    sequenceTitle: 铁血骑士
    order: 4
    text: 钢铁化：身体可以变为钢铁，坚固程度足以抵挡半神层次的直接攻击。
  - id: hunter_4_05
    pathway: hunter
    seq: 4
    sequenceTitle: 铁血骑士
    order: 5
    text: 普通的物体也能在自己特质的提升下变成恐怖的杀人武器，但使用过后会坏掉。
  - id: hunter_4_06
    pathway: hunter
    seq: 4
    sequenceTitle: 铁血骑士
    order: 6
    text: 可以和自己的团队建立起神秘学联系，将整个队伍的力量都集中在自己身上，并共享成员视野，将受到的伤害分摊出去，不过，这种集中仅限于力量和灵性等，不包括成员具备的非凡能力。
  - id: hunter_3_01
    pathway: hunter
    seq: 3
    sequenceTitle: 战争主教
    order: 1
    text: 火焰提升为纯青色。
  - id: hunter_3_02
    pathway: hunter
    seq: 3
    sequenceTitle: 战争主教
    order: 2
    text: 可以在3公里范围内使用团队成员的非凡能力，还可以把自己的能力和力量也分享给他们，但能力分享给某位成员后，除了他自己，其余成员无法再使用。
  - id: hunter_3_03
    pathway: hunter
    seq: 3
    sequenceTitle: 战争主教
    order: 3
    text: 心灵沟通：团队内部的心意相通变成了直接的“心灵沟通”,“战争主教”可以有选择地屏蔽和修改沟通中的某些信息。
  - id: hunter_3_04
    pathway: hunter
    seq: 3
    sequenceTitle: 战争主教
    order: 4
    text: 战争迷雾：“战争主教”可以制造“战争迷雾”，显著降低雾气内所有生灵的可视范围，影响他们的听力和嗅觉，并将对应的灵界也笼罩起来，通过压制星灵体和灵界的互动，让灵性预警和灵性直觉都变得迟钝。在“战争迷雾”内，只有自己不受任何影响。
  - id: hunter_3_05
    pathway: hunter
    seq: 3
    sequenceTitle: 战争主教
    order: 5
    text: 拥有“战吼”、“战歌”等能力，它们可以用来提升队伍的士气，短暂增强力量，影响敌人心智，压制目标的发挥。
  - id: hunter_3_06
    pathway: hunter
    seq: 3
    sequenceTitle: 战争主教
    order: 6
    text: 在献出足够的祭品后，能向战争本源或者说战争这个象征祈求，得到一次帮助，一场战争里只能献祭一次。
  - id: hunter_2_01
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 1
    text: 拥有让人想要追随和效忠的魅力，并可能让女性产生爱慕之情，但没有主动的“魅惑”。
  - id: hunter_2_02
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 2
    text: 火焰提升为了紫色，序列2阶段是青中带紫到紫中带青，具体是什么取决于魔药的消化程度。
  - id: hunter_2_03
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 3
    text: 对火焰的掌控有了很大的提升，可以覆盖一个几十公里范围的战场，直接下“流星火雨”，或让火鸦群攻。压缩火球的爆炸威力远超舰队主炮。
  - id: hunter_2_04
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 4
    text: 可以在10公里范围内使用团队成员的非凡能力，还可以把自己的能力和力量也分享给他们。分享能力不再有限制，可以让团队每个成员都同时使用，并借给他们对应的灵性，团队整体的灵性不会额外增加。
  - id: hunter_2_05
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 5
    text: 献祭的次数提升为七天一次。
  - id: hunter_2_06
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 6
    text: 火焰化：能让自己变成火焰流光、巨大的火焰长枪和恐怖的火流星攻击敌人或赶路，配合上飓风的环绕，最高速度比声音更快，每小时四五千公里，等到魔药有所消化，还能提升。
  - id: hunter_2_07
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 7
    text: 钢铁化：已经不是普通的钢铁，更接近“钢铁”这个象征，足以挡住让真正钢铁毁灭或熔化的攻击。
  - id: hunter_2_08
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 8
    text: 战争迷雾：范围初步扩大到了二十公里，这会随着魔药的消化继续提升，同时，“战争迷雾”还具备了干扰外界占卜和预言的特点，这到了更高层次，或许还会影响星界。在“战争迷雾”内，自己不受任何影响，这种特质可以分享给团队成员。
  - id: hunter_2_09
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 9
    text: 弱点侦察：看到的目标将是整体意义上的目标，这包括目标的替身、分身和化身，然后，在这个整体上找出弱点，这要是配合上“收割”，而目标的替身、分身不够多的话，可以一次性全部干掉，即使是魔女们，也承受不起几次这样的“收割”。
  - id: hunter_2_10
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 10
    text: 操作天气：拥有改变区域天气、创造极端天气的权柄，比如雷暴、飓风、暴雨、冰雹、暴风雪、大雾等。“天气术士”主要是操纵天气，不包括陨石、海啸、地震这些，但其中部分可以用间接的方式引导制造，比如，用飓风掀起海啸。
  - id: hunter_2_11
    pathway: hunter
    seq: 2
    sequenceTitle: 天气术士
    order: 11
    text: “天气术士”如果不压制自己，收敛住精神，那他所在的地区，天气将逐渐多变而极端，爆发战争或杀戮事件的可能性也将不断提高。
  - id: hunter_1_01
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 1
    text: “征服”：让目标身心灵都想要臣服，选择臣服，目标一旦被彻底“征服 ”，则永远效忠；“征服”还可以直接让人失去意识，可以直接操控生物的身体按照自己的意志行动，无论其意识存在与否。
  - id: hunter_1_02
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 2
    text: 火焰提升为纯紫色。
  - id: hunter_1_03
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 3
    text: “战争统帅”：可建立人数不受限制的临时团队，享受真正团队的绝大部分便利（50公里范围）；
  - id: hunter_1_04
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 4
    text: “以偶为兵”（撒豆成兵）：“征服”与“战争”权柄的结合，能征服无生命的物体，并将其转化为自己的士兵，分享自身的能力，若提前用不同途径的非凡特性、恩赐力量制作兵偶或黄豆，则这些随身携带的士兵同样能具备其他途径的能力；
  - id: hunter_1_05
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 5
    text: “毁灭之矛”：“收割”到了这个位格的质变，既可以针对单个目标，又能毁灭一片区域，而即使没命中弱点，也能带来相当大程度的毁灭，能通过打击分身、投影、替身影响到本体的毁灭，若是命中了弱点，相当于必然死亡；
  - id: hunter_1_06
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 6
    text: “集众”：普通的集众只是单纯地集合团队的力量，到了“征服者”序列，“集众”还会让聚齐起来的力量在达到一定数量后产生质变，最强可媲美唯一性活化一击；
  - id: hunter_1_07
    pathway: hunter
    seq: 1
    sequenceTitle: 征服者
    order: 7
    text: 之前能力的深化。
  - id: hunter_0_01
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 1
    text: 【神国】：红祭司的神国源于“征服”权柄的更深概念化，将一片土地一处战场一个特殊区域直接“征服”、彻底“征服”后，它们就能成为“红祭司”的神国，进入神国的生灵，若没得到对应的庇护，也没有足够的位格，将直接成为“红祭司”的士兵。
  - id: hunter_0_02
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 2
    text: “征服”权柄：征服不再仅仅是物品，还可以是地域，甚至是一些概念；
  - id: hunter_0_03
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 3
    text: “魅力”权柄：部分“魅力”权柄，让人想要臣服想要效忠的魅力，以及极端厌恶杀之而后快的“魅力”。与“征服”权柄共生，每一位红祭司都是最有魅力的雄性；
  - id: hunter_0_04
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 4
    text: “战争”权柄：哪怕不亲自掀起战争，也能通过注视或存在，让目标区域发生战争，并决定战争的规模、烈度、方式；附带的“战争之主”象征，可以在一个星球上，给任何一个地方的团队成员分享力量，这包括自身位格和“唯一性”的力量——同一时间，团队成员和红祭司只有一位能使用唯一性，而团队成员使用唯一性会受本身支撑的缺乏，无法发挥出完整的威能；
  - id: hunter_0_05
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 5
    text: “毁灭”权柄：上可毁灭一个星球，下可杀死一位真神，这还附带了弱点的侦察和最后的锁定，被“毁灭”权柄杀死的，若没有特殊的、提前的布置，无法复活，将走向真正的终结；
  - id: hunter_0_06
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 6
    text: “祭祀”权柄：可向力量本源（源质）祈求力量或投影降临——掌握着“祭祀”权柄的红祭司甚至可以向别的源质祈求，只要是最初那位造物主分裂出来的那些，当然，这也意味着“红祭司”时刻走在被源质污染的边缘；“红祭司”还能干扰和影响星系内任何一场祭祀活动；
  - id: hunter_0_07
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 7
    text: “男性”权柄：自身必为男性，且是最阳刚最强力最有繁衍能力的男性，可将任何事物转变为男性，并给予不同程度的生殖能力；
  - id: hunter_0_08
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 8
    text: “毁灭“的下位”火焰”：无形无色的火焰可焚烧一切，燃尽一切；
  - id: hunter_0_09
    pathway: hunter
    seq: 0
    sequenceTitle: 红祭司
    order: 9
