  - id: arbiter_0_02
    pathway: arbiter
    seq: 0
    sequenceTitle: 审判者
    order: 2
    text: · 能在一定程度上修改世界的底层规则；能为世界制定各种新的规则（非底层，可永久起效，起效范围从小到大，从一个国度逐渐到一个星球、一个恒星系）——“混沌之子”甚至能在一定程度上影响非凡特性不灭、聚合、分离等定律，做出限定性的、很低程度的、小范围的修改；
  - id: arbiter_0_03
    pathway: arbiter
    seq: 0
    sequenceTitle: 审判者
    order: 3
