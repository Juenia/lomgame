# 原作能力清单（M2.85 内容填充 P5）—— **原作数据直出**
#
# 数据来源：诡秘之主原作数据/01-途径与序列/途径-*.yaml 的 sequences[].abilities
# 共 2405 条（22 途径 × 10 档，逐条原文）。
#
# ## 与 abilities.yaml 的关系（不要混）
#
#   本表       **设定层**：原著里这个序列能做什么（逐条原文）
#
#   abilities.yaml  **机制层**：项目里它给什么数值（9 个 effect 字段，154 条）
#
# 为什么不把 2784 条压成 effect：那会把定性描述变成拍出来的数值 —— 那是编造，不是填充。
#
# 读取点：`.图鉴 能力 <途径>` 与 `.图鉴 能力 <途径> <序列>`。
meta:
  source: 诡秘之主原作数据/01-途径与序列/途径-*.yaml 的 sequences[].abilities（原文直出）
  count: 2405
  layer_note: ⚠️ **设定层**：这是「原著里这个序列能做什么」的**逐条原文**，不是机制。
  relation_note: 机制层是 src/data/abilities.yaml（154 条，effect 是 9 个数值字段）——两者**故意不合并**：把 2784 条定性描述压成 9 个数值字段，产出的就是假数据（K10：配置里有、玩法里必须有）。
  read_point: "`.图鉴 能力 <途径> [序列]`"
pathway_abilities:
  - id: seer_9_01
    pathway: seer
    seq: 9
    sequenceTitle: 占卜家
    order: 1
    text: 获得灵视能力。
  - id: seer_9_02
    pathway: seer
    seq: 9
    sequenceTitle: 占卜家
    order: 2
    text: 获得占卜能力，能够学习占星术、卡牌占卜、灵摆等等。
  - id: seer_9_03
    pathway: seer
    seq: 9
    sequenceTitle: 占卜家
    order: 3
    text: 由于仪式魔法需要较多准备，因此缺乏直接的对敌手段，但在神秘学知识上比“窥秘人”更博学、专业。
  - id: seer_9_04
    pathway: seer
    seq: 9
    sequenceTitle: 占卜家
    order: 4
    text: 获得“灵感”，能“看”到被挡住的事物，“听”见微弱的脚步声，从而提前做出判断。
  - id: seer_8_01
    pathway: seer
    seq: 8
    sequenceTitle: 小丑
    order: 1
    text: 作为格斗型的魔药序列，力量、敏捷、速度都有所强化。
  - id: seer_8_02
    pathway: seer
    seq: 8
    sequenceTitle: 小丑
    order: 2
    text: 能更精密地控制身体、操控自己的表情，协调性得到极大提升，表演杂技也不是问题。
  - id: seer_8_03
    pathway: seer
    seq: 8
    sequenceTitle: 小丑
    order: 3
    text: 拥有优秀的直觉预感，能预测对手的下一步动作。
  - id: seer_8_04
    pathway: seer
    seq: 8
    sequenceTitle: 小丑
    order: 4
    text: 得到化纸张为飞刀的类法术能力。
  - id: seer_7_01
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 1
    text: 提升了双手的灵巧程度和身体的敏捷程度。
  - id: seer_7_02
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 2
    text: 掌握新的法术和类法术能力：
  - id: seer_7_03
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 3
    text: · “伤害转移”：只要未直接死亡、双手还能动，就能将要害位置的伤口转移至不重要的部位，化致命伤为轻伤。
  - id: seer_7_04
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 4
    text: · “火焰跳跃”：借助灵界的特殊，在三十米范围内自身留下的火种和原本就有的火焰之间闪现，类似于瞬移。
  - id: seer_7_05
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 5
    text: · “空气弹”：通过打响指，模拟声音等办法，制造威力和速度都不比特制左轮手枪射出的子弹差什么的空弹，效果会跟随魔药的消化进度和本身序列的发展提升。
  - id: seer_7_06
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 6
    text: · “纸人替身”：可相对简单的替身法术，以短暂将携带的纸人变成自己，并与自身调换位置，能挡下致命一击， 还可以有效地削弱诅咒伤害。
  - id: seer_7_07
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 7
    text: · “操纵火焰”：能通过简单的一个动作，操纵周围三十米范围内的火焰，也可以直接点燃这个范围里的某些物品，等魔药彻底消化或序列得到晋升，还能凭空“召唤”来焰流。
  - id: seer_7_08
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 8
    text: · “制造幻觉”：通过影响周围的环境，营造出具备色彩、声音和气味，近乎真实的幻觉，达到以假乱真，欺骗敌人的效果。
  - id: seer_7_09
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 9
    text: · “水下呼吸”：制造一根无形的看不见的空气细管，让处于水底的魔术师可以借此自由呼吸，看起来似乎变成了所谓的鱼人。空气细管有长度的限制，刚晋升时顶多能维持五米左右。“重组”权柄的一种应用。
  - id: seer_7_10
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 10
    text: · “骨骼软化”：能挣脱手铐、绳索以及箱子的束缚。
  - id: seer_7_11
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 11
    text: · “抽纸为兵”：小丑化纸张为飞刀的能力的进化，可以把纸张化成锋利的物品，还能短暂变成棍棒、砖头等武器。
  - id: seer_7_12
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 12
    text: 具备快速施法技巧，不需要念咒和灌注灵性，只用简单的一个动作，就可以施展对应的法术或类法术能力。
  - id: seer_7_13
    pathway: seer
    seq: 7
    sequenceTitle: 魔术师
    order: 13
    text: 获得一些没有太大实用性的小戏法。
  - id: seer_6_01
    pathway: seer
    seq: 6
    sequenceTitle: 无面人
    order: 1
    text: 能精准地回忆起认识的每一个人的外形和气质特点、把握住他们独特的气味，并变化成相应的模样。在刚晋升时变化范围有限，无法拔高或变矮超过10厘米，无法改变性征。
  - id: seer_6_02
    pathway: seer
    seq: 6
    sequenceTitle: 无面人
    order: 2
    text: 占卜、格斗和法术能力都有所提升。
  - id: seer_5_01
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 1
    text: 能看到“灵体之线”，通过“灵体之线”找到隐藏的目标。
  - id: seer_5_02
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 2
    text: 能通过操纵“灵体之线”直接影响目标的精神体、星灵体、心智体和以太体，然后以“以太体”为桥梁控制对方的身躯。
  - id: seer_5_03
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 3
    text: · 可以像操纵木偶一样掌控目标，在产生效果前，目标几乎没法察觉。一旦初步掌控，对方会思维迟缓、身体僵硬、动作滞涩，基本只能依靠自身灵体的强度来摆脱，对序列5的“秘偶大师”来说，半神之下的目标基本不用担心。
  - id: seer_5_04
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 4
    text: · 经过时间的推移、掌控的加深，若操纵未被打断，一段时间后可将目标彻底变成自己的傀儡，在一定的距离内进行操纵。傀儡能够使用原本的非凡能力。
  - id: seer_5_05
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 5
    text: · 傀儡能保留自身的非凡能力，还可以正常使用神奇物品和封印物等，并且消耗的是傀儡的灵性，而非操纵者。
  - id: seer_5_06
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 6
    text: “秘偶大师”的能力存在限制，会随消化进度和序列的提升而提高上限。
  - id: seer_5_07
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 7
    text: · 距离限制：只能看到一定范围内的“灵体之线”（刚晋升时为100米），要进行操纵必须进入目标一定范围内（刚晋升时为5米），操纵秘偶时本体与它距离不能超过太远（刚晋升时为100米）。
  - id: seer_5_08
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 8
    text: · 时间限制：初步控制和转化成秘偶都需要一定时间。刚晋升时初步控制需要约20秒，转化需要五分钟。
  - id: seer_5_09
    pathway: seer
    seq: 5
    sequenceTitle: 秘偶大师
    order: 9
    text: · 秘偶存在上限，刚晋升时只有一个。
  - id: seer_4_01
    pathway: seer
    seq: 4
    sequenceTitle: 诡法师
    order: 1
    text: “魔术师”能力提升：可以将自己或他人的伤口和疾病转移给替身纸人，并获得近千米的“火焰跳跃”距离，空气子弹的威力也提升到了炮弹层次。
  - id: seer_4_02
    pathway: seer
    seq: 4
    sequenceTitle: 诡法师
    order: 2
    text: “无面人”能力提升：能变成体型差距不是太大的动物，灵体状态时则可以无视此限制。
  - id: seer_4_03
    pathway: seer
    seq: 4
    sequenceTitle: 诡法师
    order: 3
    text: “秘偶大师”能力提升：能在3秒内完成“灵体之线”的初步控制，15秒内彻底将目标转化为傀儡，操纵范围是150米。
  - id: seer_4_04
    pathway: seer
    seq: 4
    sequenceTitle: 诡法师
    order: 4
    text: · 同时，可以利用交互的“灵体之线”让秘偶使用自身的所有非凡能力，可以在一千米范围内自由地与秘偶调换位置。
  - id: seer_4_05
    pathway: seer
    seq: 4
    sequenceTitle: 诡法师
    order: 5
    text: · 基于位置调换的能力、自身神话生物形态分离出的灵之虫，以及在“灵体之线”上的伪装，可以做到更高层次的替身应用，只要有一个秘偶还活着就不会死，且敌人很难辨别杀死的究竟是“诡法师”还是他的秘偶。
  - id: seer_3_01
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 1
    text: 神性提升，能分化的“灵之虫”达到了六百条，神性花纹也变得更为复杂，更能表现力量、诡异、超凡等概念。
  - id: seer_3_02
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 2
    text: 能依靠分化出的“灵之虫”完成神灵的扮演。可以让不同的“灵之虫”依循本能倾听祈祷，在不太复杂的程度下给出回应，而不影响本体的其他行为。特别标记的和较为复杂的祈祷则会移交本体。
  - id: seer_3_03
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 3
    text: 核心能力：能从历史的孔隙里召唤人或物体的影像。对相应目标了解得越详细越真实、或者目标位格越低于自身、或者目标与自身的密切程度越高，成功概率越大、维持时间越久。召唤位格高于自身的人和物时，即使勉强成功，影像也只有部分力量和特质，不可能是完全体。
  - id: seer_3_04
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 4
    text: · 分支能力：由于自己和自己的关系密切到极点，召唤过去的自己不可能失败，因此能从过去的自己处借取力量，让自身不会有虚弱的时刻，不存在次数限制，直到灵性耗尽。
  - id: seer_3_05
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 5
    text: · 包括秘偶召唤的影像在内，历史影像同时只能维持有限数量，维持时间也有限。在克莱恩已经消化大部分魔药的情况下，最多同时召唤三个，最多维持一刻钟。
  - id: seer_3_06
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 6
    text: · 召唤历史影像时，是无法对话，无法交流的。
  - id: seer_3_07
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 7
    text: “魔术师”能力提升：
  - id: seer_3_08
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 8
    text: · “纸人替身”除了转移疾病、伤口、诅咒、攻击、预言、注视，还可以将纸人的某个部位转移给目标，在对方发现是假的之前像真的一样运行。甚至可以在失去心脏、大脑还未死亡的短暂瞬间制造一个纸心脏，从历史中获得力量跳动，循环血液。
  - id: seer_3_09
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 9
    text: · “火焰跳跃”距离提升到五公里。
  - id: seer_3_10
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 10
    text: · 空气炮弹最高威力达到岸防炮程度。
  - id: seer_3_11
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 11
    text: “无面人”能力提升：可以变形成体型差距不超过一定限度的生物，拟化出来的一部分器官能真正发挥作用，一部分只是摆设。
  - id: seer_3_12
    pathway: seer
    seq: 3
    sequenceTitle: 古代学者
    order: 12
    text: “秘偶大师”能力提升：“灵体之线”的初步控制时间缩短为两秒，彻底转化为傀儡是十秒，操纵范围是五百米，驱使秘偶、互换位置的极限是五公里。
  - id: seer_2_01
    pathway: seer
    seq: 2
    sequenceTitle: 奇迹师
    order: 1
    text: 能更进一步利用历史迷雾：
  - id: seer_2_02
    pathway: seer
    seq: 2
    sequenceTitle: 奇迹师
    order: 2
    text: · 能借助过去的“灵之虫”复活，上限为四次。
  - id: seer_2_03
    pathway: seer
    seq: 2
    sequenceTitle: 奇迹师
    order: 3
    text: · 能对未来施加一定的影响，让某些事情发生的概率在一定程度内变大或者变小，相当于干扰目标的命运。
  - id: seer_2_04
    pathway: seer
    seq: 2
    sequenceTitle: 奇迹师
    order: 4
    text: · 从历史孔隙内召唤的不再只是物品，可以是自身熟悉的某些场景。在克莱恩已经消化大部分魔药的情况下，能召唤的物品加上场景的上限是九个，天使层次的依旧只能召唤三个。
  - id: seer_2_05
    pathway: seer
    seq: 2
    sequenceTitle: 奇迹师
    order: 5
    text: 新增核心能力“愿望”：已经是标准的神灵之能，但只有先满足别人的愿望，才能满足自身的愿望，只有先实现小的愿望，才能逐步实现大的愿望。
  - id: seer_1_01
    pathway: seer
    seq: 1
    sequenceTitle: 诡秘侍者
    order: 1
    text: “再生”：如果一个物品的构成材料曾经有灵体，那“诡秘侍者”可以将相应的“灵体之线”唤起，让物品成为自己的秘偶，并使和这物品建立了深层次联系的生灵也自然地转变为秘偶。
  - id: seer_1_02
    pathway: seer
    seq: 1
    sequenceTitle: 诡秘侍者
    order: 2
    text: · 不能让原本不存在“灵体之线”的事物（钢铁制品、金币金镑等）产生“灵体之线”，但可以让某些物品（牛肉、鱼肉等食物）曾经拥有但早就消失的“灵体之线”再生，人类一旦吃下变成了秘偶的食物，自身也会随之转变为秘偶，如同遭遇了强烈的污染。
  - id: seer_1_03
    pathway: seer
    seq: 1
    sequenceTitle: 诡秘侍者
    order: 3
    text: “重组”/“篡改”/“嫁接”：变化领域的权柄。将许多实体事物或抽象概念重新组合在一起，达成不可思议的效果，就像在篡改定义、逻辑、指向或规则。
  - id: seer_1_04
    pathway: seer
    seq: 1
    sequenceTitle: 诡秘侍者
    order: 4
    text: “诡秘之境”：隐秘领域的权柄。用来创造神国雏形的能力，可以带来一定的隐秘效果。
  - id: seer_0_01
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 1
    text: “诡秘之境”：神国，“诡异”象征和“时空之王”象征自然带来的、可自行创造的神国，既然“诡异”象征又称“不可思议”象征，那自然是包含“不可理解”这个概念在内的，也就是说，自带一定的“隐秘”，“愚者”符号里的隐秘部分其实就来源于这里，是“诡异”的一种体现。
  - id: seer_0_02
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 2
    text: “愚弄”权柄：这是“愚者”最核心的两大权柄之一，也有对应的象征，主要效果是“弄假成真”，可以降低敌人的智商，可以产生强烈的变化，让周围的环境随着某种概念产生相应的改变，可以愚弄时间，混淆时间的先后，使非凡能力的效果滞后，仿佛摆脱了时间的限制，在凝固的环境中晃动，通过各种或真实或概念的缝隙，还可以愚弄历史，将前一秒和后一秒的自己做出分割。
  - id: seer_0_03
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 3
    text: “变化”和“诡异”两大象征混杂产生的权柄“重组”，或者说“嫁接”：这也是“愚者”的核心权柄，能将包含自身在内的、本身无法产生联系的实体事物和抽象概念重新组合在一起，达成不可思议、完全真实的效果，这能直接作用于“概念”，甚至权柄本身，像“愚者”途径低序列的“伤害转移”其实就是“重组”权柄的下位和细分。
  - id: seer_0_04
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 4
    text: “灵界掌控者”：虽然“诡秘之主”才是真正的灵界之主，拥有完全的支柱象征，但比起只是利用灵界旅行的“门”途径和对灵界利用在“解密”、“影响目标心智体”等方面的“错误”途径，“愚者”途径掌控着大部分灵界权柄，几乎算是小号的“灵界之主”，而不管是操纵灵体之线，还是唤起灵性之线，都只是这方面权柄的一些应用，当然，这些权柄并不仅仅只体现灵界权柄，还涉及诡异、变化等象征的下位，属于复合型的能力。
  - id: seer_0_05
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 5
    text: “奇迹”权柄：这是“不可思议”这个象征所属的权柄（这个象征又称“诡异”），奇迹本身就无法解释、无法理解，所以才能称之为奇迹。
  - id: seer_0_06
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 6
    text: “历史”权柄：“时空之王”象征和“诡异”象征混杂的权柄，虽然过去无法改变，历史已经成真，但“愚者”依旧能在一定程度上玩弄历史。
  - id: seer_0_07
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 7
    text: “变形”权柄：“变化”象征所属权柄之一。
  - id: seer_0_08
    pathway: seer
    seq: 0
    sequenceTitle: 愚者
    order: 8
    text: “命运锚点”：“命运道标”象征的所属权柄，“命运锚点”的命运很难被改变，而除非祂自我控制，否则祂所说的话，将成为命运长河未来发展的节点之一，也就是说，祂之所言，都是未来，只是实现的方式和最终的表现未必是祂想要的，可能非常扭曲。
