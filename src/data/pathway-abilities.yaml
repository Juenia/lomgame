    order: 37
    text: “木偶”穿过的衣物1件或经常使用的物品1件
  - id: prisoner_0_38
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 38
    text: 囚禁至死者的镣铐或类似物品1件
  - id: prisoner_0_39
    pathway: prisoner
