    sequenceTitle: 吸血鬼
    order: 9
    text: · “血仆转化”：属于月亮领域的类法术能力，是驯化并驱使动物这种本事的升级，和“初拥”异曲同工，只是不用给予非凡特性，而一个人类成为“血仆”后，体质会得到很大增强，免疫许多疾病，让原本的绝症直接消失或变得可以治疗，但“血仆”无法违背主人的命令，相当于成为了某个血族的傀儡。
  - id: apothecary_6_01
    pathway: apothecary
    seq: 6
    sequenceTitle: 魔药教授
    order: 1
    text: 在寿命、速度、敏捷和力量上都有一定的提升。
  - id: apothecary_6_02
    pathway: apothecary
    seq: 6
    sequenceTitle: 魔药教授
    order: 2
    text: 获获得了许多来自于特性本身的知识，具备了分辨灵性材料的非凡能力，可以调配出带有超凡效果的各种药剂和香水，这不仅让魔药教授们可以对付绝症，还能帮助他们击败敌人——提前做好准备，预先服食了对应药水的魔药教授总是非常难以应付。
  - id: apothecary_6_03
    pathway: apothecary
    seq: 6
    sequenceTitle: 魔药教授
    order: 3
    text: · 药水就像没有非凡特性的神奇物品，有自身的保质期，而且不同种类可能会产生冲突，带来不好的影响。“魔药教授”会尽量控制每次服食的药水种类和数量。
  - id: apothecary_6_04
    pathway: apothecary
    seq: 6
    sequenceTitle: 魔药教授
    order: 4
    text: · 药剂和香水的品种只取决于“魔药教授”的知识水平和能找到的灵性材料，包括但不限于“隐身药剂”、“无味香水”、“阴影魔药”、“夜幕香水”、”火龙吐息”、”太阳之水”等。
  - id: apothecary_6_05
    pathway: apothecary
    seq: 6
    sequenceTitle: 魔药教授
    order: 5
    text: · 优秀的魔药教授会根据“基础知识”研究开发新的药剂品种。
  - id: apothecary_5_01
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 1
    text: 拥有足以称得上可怕的速度和难以想象的恢复能力；
  - id: apothecary_5_02
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 2
    text: 黑暗类法术变强，药剂效果提升，对梦魇类影响有天然抵抗力；
  - id: apothecary_5_03
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 3
    text: 能力的强弱，取决于对月亮领域的了解和研究。
  - id: apothecary_5_04
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 4
    text: “满月”：能让一定范围内的区域处于满月状态，灵性滋生，灵感增强，死亡变强——当敌人不擅长灵性、灵界相关时，就制造“满月”效果，反之则让那片区域的月亮隐去。
  - id: apothecary_5_05
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 5
    text: “闪现”：在月光照耀的一定范围内，获得瞬移闪现般的能力。
  - id: apothecary_5_06
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 6
    text: “月光化：在月光照耀的一定范围内能化为月光化状态。身体虚化，染上淡红，变成了一道朦胧的月光。这月光瞬间破碎，化成一片片红鳞，消散在了原地，并于远处飞快重组，但前提是没有被击中心脏。
  - id: apothecary_5_07
    pathway: apothecary
    seq: 5
    sequenceTitle: 深红学者
    order: 7
    text: 能用来躲避攻击，能力的强弱取决于对“月亮”领域的了解和研究。
  - id: apothecary_4_01
    pathway: apothecary
    seq: 4
    sequenceTitle: 巫王
    order: 1
    text: 能轻松活到一千岁，在半神里属于长寿者，但之后必然会出现不可逆转的老迈和衰败，所以，一千两百岁往往是其自然极限，要想继续活下去，只能依靠各种各样的办法来延续，比如，封印自身，沉眠于古堡深处的棺材内。
  - id: apothecary_4_02
    pathway: apothecary
    seq: 4
    sequenceTitle: 巫王
    order: 2
    text: 他们是掌控黑暗、月亮、诡异等领域力量的杰出者，超越同类的强者，精通月亮和黑暗领域的各种法术，能依靠自然互动法布置直接借用“月亮”力量的仪式——这很恐怖。
  - id: apothecary_4_03
    pathway: apothecary
    seq: 4
    sequenceTitle: 巫王
    order: 3
    text: 拥有强健的体魄、恐怖的速度、超越想象的再生自愈速度，但更接近施法者。
  - id: apothecary_4_04
    pathway: apothecary
    seq: 4
    sequenceTitle: 巫王
    order: 4
    text: 擅长“替身法术”，比如用仿佛绯红月光凝聚成的纸人充当替身的"月亮纸人"。
  - id: apothecary_4_05
    pathway: apothecary
    seq: 4
    sequenceTitle: 巫王
    order: 5
    text: “黑暗凝视”：当一个目标映入巫王的眼球后，两者就发生了联系，“巫王”对自己眼球的操作将直接反应于目标身上（握住眼球等于遮挡目标，捏碎眼球等于重创乃至摧毁目标），对于许多圣者来说，这种替身法术对自身会造成不可逆转的伤害，成为独眼龙，或者瞎子，但巫王不会，他们有超越想象的再生自愈能力和速度，等到战斗结束，用不了多久就能长出新的眼球。
  - id: apothecary_4_06
    pathway: apothecary
    seq: 4
    sequenceTitle: 巫王
    order: 6
    text: 除了月光化，还能将自己分解成一群介于真实与虚幻之间的吸血蝙蝠，在这个状态下，除非能将所有蝙蝠都杀掉，否则都能重组。实体化时，心脏依旧是弱点，这就如同他们身体内的红月。
  - id: apothecary_3_01
    pathway: apothecary
    seq: 3
    sequenceTitle: 召唤大师
    order: 1
    text: 如果“召唤大师”“人缘”足够好，甚至可以与天使签订契约，直接召唤他们；
  - id: apothecary_3_02
    pathway: apothecary
    seq: 3
    sequenceTitle: 召唤大师
    order: 2
    text: “召唤大师”的“召唤”偶尔会出现难以控制的异变，让并非来自于灵界也没签订过契约的奇怪生物降临于现实，传闻这都指向无垠而黑暗的宇宙。
  - id: apothecary_3_03
    pathway: apothecary
    seq: 3
    sequenceTitle: 召唤大师
    order: 3
    text: 异变有好有坏，“召唤大师”有的因此死亡，有的获得了异于二十二条序列的强大能力或物品；
  - id: apothecary_3_04
    pathway: apothecary
    seq: 3
    sequenceTitle: 召唤大师
    order: 4
    text: 除了“召唤”，“召唤大师”们在月亮和黑暗领域也是杰出的魔法大师。
  - id: apothecary_3_05
    pathway: apothecary
    seq: 3
    sequenceTitle: 召唤大师
    order: 5
    text: “召唤之门”：前探双手，凭空拉伸出了一扇虚幻朦胧，铭刻着诸多神秘符号的门。可以让灵界深处的生物借此来到现实世界，但一定时间内只有一次机会。灵界生物通过这扇门，就等于和使用者签订了相应的协议，能在一定时间内为使用者效劳，这大概是五分钟，如果需要维持更久，使用者必须亲自和那个灵界生物沟通，重新签订期限更长的契约。正常情况下，召唤来的灵界生物实力等于和稍强于使用者，但也有更弱小和更强大的可能。那灵界生物的实力越强，越能对抗‘召唤之门’本身的协议，危害到使用者。
  - id: apothecary_2_01
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 1
    text: 掌握“创造之力”——部分“生命”权柄衍化而来，自身身体素质因此达到最强，并能让周围生命感受到万物滋长、新生降临的喜悦，无论是植物、动物，还是人类，或者别的超凡种族都能因此得到生命的一定延长和缩短；
  - id: apothecary_2_02
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 2
    text: “创造之力”还能带来生命的改变和短时间内的爆发，这是一种无需奴役的、更大范围的“血仆”转化，当然，若是目标意志强横、位格较高，也可以抵御这种转化，只是会遭受一定程度的、源于生命本质的伤害；
  - id: apothecary_2_03
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 3
    text: 直接的治疗，无需药剂，只要没死，都不是问题，这也意味着“创生者”的自我治愈达到了最高程度；
  - id: apothecary_2_04
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 4
    text: 能给予一片土地（最大相当于贝克兰德、特里尔这样的城市）新的生命；
  - id: apothecary_2_05
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 5
    text: 能对污秽、腐蚀等力量做清理；
  - id: apothecary_2_06
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 6
    text: 能让遭受污染或对抗堕落的目标情绪得到平复，意志得到加强，找回一定的平衡，反之也可以；
  - id: apothecary_2_07
    pathway: apothecary
    seq: 2
    sequenceTitle: 创生者
    order: 7
    text: 部分“灵性”权柄：能干扰和影响所有目标的灵性状态，可分别给予迅速恢复、消耗加剧、不稳定等效果。
  - id: apothecary_1_01
    pathway: apothecary
    seq: 1
    sequenceTitle: 美神
    order: 1
    text: 如果为男性，将转变为女性，并有较强的生殖繁衍欲望和神性倾向；较低层次的“美”之权柄：“美”这个象征和概念的具象化，这必然是一位代表阴性力量的雌性生物，她的容貌和魅力就是她最强的能力，所有看到“美神”身影的生命都将遭受极致之美的震撼，位格较低者会瞬间丧失心智，哪怕旧日支配者们，面对“美神”，也会产生不忍伤害或占为己有的想法、欲念，会短暂地驻足欣赏；
  - id: apothecary_1_02
    pathway: apothecary
    seq: 1
    sequenceTitle: 美神
    order: 2
    text: 一定的“月亮”概念：正如“美”是“月亮”和“阴性”的衍生一样，“美神”也可以在合理范围内借用“月亮”的力量，创造种种有利于自己的环境；
  - id: apothecary_1_03
    pathway: apothecary
    seq: 1
    sequenceTitle: 美神
    order: 3
    text: 部分“植物”、“动物”、“人类”、“超凡生物”等权柄：驯化和驱使，这既是源于生命本质的掌握，也是“美”的吸引；
  - id: apothecary_1_04
    pathway: apothecary
    seq: 1
    sequenceTitle: 美神
    order: 4
    text: 同样的道理，没谁能拒绝“美神”的“召唤”；
  - id: apothecary_1_05
    pathway: apothecary
    seq: 1
    sequenceTitle: 美神
    order: 5
    text: “黑暗”和“诡异”类法术、能力不仅不会破坏“美神”的美，反而会让祂平添危险、神秘等魅力的代名词。
  - id: apothecary_0_01
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 1
    text: “月亮”（包含生殖、繁殖等意象），代表着灵性、植物、美丽、召唤、动物、人类、超凡生物、部分生命、部分黑暗与部分诡异。
  - id: apothecary_0_02
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 2
    text: “月亮”本身并不是一个权柄，更接近象征，正如月亮是地球的伴侣一样，母亲是最初的伴侣，这就是“月亮”最重要的一面，正因为如此，它涵盖了好几个领域：
  - id: apothecary_0_03
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 3
    text: · “血月”：阴性力量肆掠，灵界与现实长期交互，无数难以言喻的怪物和恶灵被放出；
  - id: apothecary_0_04
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 4
    text: · “红月”：阴性力量增强，灵性增强，黑暗和诡异类法术增强，基于这个领域有不少特殊的非凡能力；
  - id: apothecary_0_05
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 5
    text: · “银月”：让月亮变回银白色，切断非凡者和红月的联系，让所有“红月”领域的非凡能力失效；
  - id: apothecary_0_06
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 6
    text: · “满月”：生命滋长，灵性活跃，情绪平复，人与人之间的距离被拉近；
  - id: apothecary_0_07
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 7
    text: · “缺月”：黑暗浓厚，诡异横生。
  - id: apothecary_0_08
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 8
    text: “灵性”权柄：灵性的根源，所有灵性力量的母亲——从“母巢”的“根源之神”、“万物之母”衍生而来，拥有该权柄的“月亮”可以让目标群体灵性爆发乃至失控，也可以让他们的灵性无法得到恢复，消耗变得异常快；
  - id: apothecary_0_09
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 9
    text: 部分“生命”权柄：自身拥有永恒的生命，也可赐予或收回生命（比如创造一枚吃了可以延续生命上千年的桃子），治愈创伤与疾病，清除附着于生命的污秽之物，以及创造或改变生物；
  - id: apothecary_0_10
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 10
    text: 部分“黑暗”权柄：与“黑暗”途径不同，“月亮”途径的“黑暗”权柄更偏重因月亮而滋生的黑暗类法术和特质；部分“诡异”权柄：“月亮”的朦胧和“月亮”的神秘带来了自我替身、恐怖诅咒、月光化等诡异的能力；
  - id: apothecary_0_11
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 11
    text: “美”之权柄：每当看见月亮，就会想起最难以忘怀的美丽，这就是全宇宙第二美的事物（仅次于“母巢”）；
  - id: apothecary_0_12
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 12
    text: “植物”、“动物”、“人类”、“超凡生物”等权柄：这是部分“生命”权柄和“美”之权柄结合产生的下位权柄，所以“月亮”可以驯化植物、驯化动物、驯化人类、驯化别的超凡生物，其中，最重要的媒介是代表生命的“血液”；
  - id: apothecary_0_13
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 13
    text: “召唤”权柄：“月亮”的呼喊能引来非常恐怖的事物，比如，“堕落母神”或者“母巢”，该权柄是吉达斯被姐姐杀死的原因之一。
  - id: apothecary_0_14
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 14
    text: 成年独角飞马的角
  - id: apothecary_0_15
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 15
    text: 皇冠水母的毒液结晶3克
  - id: apothecary_0_16
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 16
    text: 成年独角飞马的血液100毫升
  - id: apothecary_0_17
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 17
    text: 皇冠水母的触须7根
  - id: apothecary_0_18
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 18
    text: 砷粉10克
  - id: apothecary_0_19
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 19
    text: 黑莨菪的根茎10克
  - id: apothecary_0_20
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 20
    text: 精灵之泉的髓质结晶
  - id: apothecary_0_21
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 21
    text: 大王剑花的果实
  - id: apothecary_0_22
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 22
    text: 精灵之泉的泉水100毫升
  - id: apothecary_0_23
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 23
    text: 大王剑花的花1朵
  - id: apothecary_0_24
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 24
    text: 野茄提炼的汁液10滴
  - id: apothecary_0_25
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 25
    text: 动物尸油10克
  - id: apothecary_0_26
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 26
    text: 渴血兽的心脏
  - id: apothecary_0_27
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 27
    text: 红头蝙蝠的翅膀
  - id: apothecary_0_28
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 28
    text: 渴血兽的血液100毫升
  - id: apothecary_0_29
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
    order: 29
    text: 红头蝙蝠的牙齿3颗（这两个可同等替换成血族或人造吸血鬼对应的部位）
  - id: apothecary_0_30
    pathway: apothecary
    seq: 0
    sequenceTitle: 月亮
