  - id: error_9_02
    pathway: error
    seq: 9
    sequenceTitle: 偷盗者
    order: 2
    text: 敏捷之手：提升手腕和指头的稳定性和灵活度，以速度快敏捷高著称。
  - id: error_9_03
    pathway: error
    seq: 9
    sequenceTitle: 偷盗者
    order: 3
    text: 卓越观察：能直接感应到十米内的贵重物品，但无法分辨具体是什么。
  - id: error_9_04
    pathway: error
    seq: 9
    sequenceTitle: 偷盗者
    order: 4
    text: 一定的体质提升。
  - id: error_9_05
    pathway: error
    seq: 9
    sequenceTitle: 偷盗者
    order: 5
    text: 短兵器精通，比如匕首和短剑。
  - id: error_8_01
    pathway: error
    seq: 8
    sequenceTitle: 诈骗师
    order: 1
    text: 质变的卓越观察：除了用在感应贵重物品上，还多了观察目标人物微表情、小动作的应用，虽然无法像观众那样厉害，但足以用来把握住目标的状态。
  - id: error_8_02
    pathway: error
    seq: 8
    sequenceTitle: 诈骗师
    order: 2
    text: 较强的“魅力”：更有亲和，更有魅力，让人更容易相信。
  - id: error_8_03
    pathway: error
    seq: 8
    sequenceTitle: 诈骗师
    order: 3
    text: “口才”：既有单纯的话术提升，也可以附加让人信服的超凡效果。
  - id: error_8_04
    pathway: error
    seq: 8
    sequenceTitle: 诈骗师
    order: 4
    text: “思维误导”：可以通过“口才”来实现，也能借用动作、姿态、周围的环境布置等完成，同样的，厉害的诈骗师，哪怕不动用“思维误导”对应的超凡能力，也能完成思维的误导。
  - id: error_8_05
    pathway: error
    seq: 8
    sequenceTitle: 诈骗师
    order: 5
    text: “精神干扰”：能让目标产生一定的幻觉。
  - id: error_8_06
    pathway: error
    seq: 8
    sequenceTitle: 诈骗师
    order: 6
    text: 敏捷和速度有较大提升。
  - id: error_7_01
    pathway: error
    seq: 7
    sequenceTitle: 解密学者
    order: 1
    text: 能力分为三部分：一是神秘学知识掌握，二是灵性直觉增强，三是观察、联想和推导能力提升，这让一位解密学者可以从蛛丝马迹还原神秘学事件的真相或者预见事情的发展。能解析梦境、幻象等诸多谜团，还能通过解析找出敌人方位等。
  - id: error_7_02
    pathway: error
    seq: 7
    sequenceTitle: 解密学者
    order: 2
    text: “卓越观察”也额外有了对细微线索、蛛丝马迹的观察。
  - id: error_6_01
    pathway: error
    seq: 6
    sequenceTitle: 盗火人
    order: 1
    text: 窃取：能短暂地窃取别人的非凡能力为己用。有机会窃取50米范围内某个目标的一项能力。对目标越了解，越容易窃取到想要的那项，越无知，越接近随机，依赖运气（感应到目标身上有各种各样颜色的光，然后做出选择）。目标序列高于6时，有可能出现失败的结果，越往上，失败概率越大。高序列强者也会被偷，但几率较小。能力生效的十分钟内，被窃取者会直接失去对应的能力，“盗火人”则可以熟练地使用，十分钟后，该项能力消失，被窃取者要等到第二天才能恢复。也能将神奇物品中的精神污染视作非凡能力的一种而窃取，当然，这很危险。
  - id: error_6_02
    pathway: error
    seq: 6
    sequenceTitle: 盗火人
    order: 2
    text: 额外的体质、力量和速度增强。
  - id: error_6_03
    pathway: error
    seq: 6
    sequenceTitle: 盗火人
    order: 3
    text: 对精神污染的抗性增强。
  - id: error_6_04
    pathway: error
    seq: 6
    sequenceTitle: 盗火人
    order: 4
    text: 卓越观察：能直接感应到50米范围内的贵重物品在哪里，大概的价值，可能的种类，除非附加了隐秘或能克制这种观察的超凡能力，否则，没有宝物能瞒不过一位“盗火人”的“鼻子”。
  - id: error_5_01
    pathway: error
    seq: 5
    sequenceTitle: 窃梦者
    order: 1
    text: 窃取：可以拿走别人理想和梦境。可以偷走别人的记忆，可以偷掉对方正要付诸实践的想法使其出现短暂的呆滞，但在这一阶段无法保留窃取来的想法，自身必须代替窃取的对象做出相应的行动。
  - id: error_5_02
    pathway: error
    seq: 5
    sequenceTitle: 窃梦者
    order: 2
    text: 窃取范围提升至八十米，窃取来的能力使可用半个小时——不能分时段使用；若不使用，可保存一周，在使用完该能力或达到一周时限前，目标无法再使用这种能力，除非他又喝了一份对应的魔药.
  - id: error_5_03
    pathway: error
    seq: 5
    sequenceTitle: 窃梦者
    order: 3
    text: 伪装（盗天机）：伪装成其他神灵的信徒，绕过防备，窃取到回应，制作出各种类型的符咒，或在战斗中，通过较长的咒文或预先的布置，窃取到回应，得到某种加强或使用某种能力，对应神灵灵智越高，失败概率越大。
  - id: error_4_01
    pathway: error
    seq: 4
    sequenceTitle: 寄生者
    order: 1
    text: 身体部分虫化，除非被命中要害，否则不会死亡。
  - id: error_4_02
    pathway: error
    seq: 4
    sequenceTitle: 寄生者
    order: 2
    text: 寄生：属于窃取的一种，窃取的是生命，包括身体层面的寄生窃取。寄生于他人体内，有两种形态：一种属于初步，借助宿主隐藏自身，并延长生命，恢复伤势，他能看见宿主看见的所有事情，听到宿主听到的所有声音，但却无法干涉宿主的思维，窃取他的想法，所以想与寄生者交流，必须主动发声，另一种是深层次寄生，全面的控制，与宿主的灵体近乎融合，直接监听他的想法，了解他的意图，并能主动地接管身体，宿主除了思绪还属于自己，其他已无法掌控。面对第一种‘寄生’，可以通过入梦、潜意识对话等方式提醒‘宿主’，不用担心被发现，因为‘寄生者’必须借助‘宿主’的感官才能察觉周围的事情。第二种状态下，不存在任何绕过‘寄生者’与‘宿主’对话的办法，但也有清除的机会，那就是依赖‘宿主’信仰的对象，放开心灵祈祷时，信仰的对象能发现‘寄生者’的存在，并借助一定的仪式给予反馈，完成分离或清除。当然，前提条件是，‘宿主’本身并不清楚会发生什么事情，否则‘寄生者’必然警觉，进行阻止
  - id: error_4_03
    pathway: error
    seq: 4
    sequenceTitle: 寄生者
    order: 3
    text: 窃取：得到了本质上的提升，可以大范围窃取通用能力，可以“窃取”一些概念上的东西，诸如位置，距离等，从而在战斗中达到匪夷所思的效果，而且“窃取”对方想法时不需要再做出相应的【行动】；可以长久保持窃取来的事物，让它们在合适的时候呈现；可以较为精准地从目标身上“窃取”到想要的能力，一般是三选一，越是了解，成功的概率越高，如果“窃取”对象层次较低，且自身对目标的情况有深刻掌握，可以做到想“偷”什么就能“偷”到什么。维持的时间长达2个小时。一次“窃取”只有一种。
