    order: 1
    text: 体质得到增强；赞美太阳，用歌声带来勇气和力量，带来虔诚和服从，还可以用歌声增强自己和同伴。
  - id: sun_9_02
    pathway: sun
    seq: 9
    sequenceTitle: 歌颂者
    order: 2
    text: 关键点是带来勇气，消解恐惧，提升力量，附带灵性的一定程度恢复和敏捷、速度等，对于太阳的信徒，还会加深虔诚，提高服从度，除了这些，歌颂者的歌声暂时无法给予别的。
  - id: sun_8_01
    pathway: sun
    seq: 8
    sequenceTitle: 祈光人
    order: 1
    text: 能施展一些太阳领域内的法术和仪式，非常克制死尸和鬼魂。
  - id: sun_8_02
    pathway: sun
    seq: 8
    sequenceTitle: 祈光人
    order: 2
    text: 可通过仪式制造圣水；
  - id: sun_8_03
    pathway: sun
    seq: 8
    sequenceTitle: 祈光人
    order: 3
    text: “白昼”：让周围十米获得光照，这光明会自然地向更远处发散；
  - id: sun_8_04
    pathway: sun
    seq: 8
    sequenceTitle: 祈光人
    order: 4
    text: “祝福”：可以给予自身和同伴祝福，从而降低恐惧、寒冷、黑暗、死亡的影响，提升对不死生物的伤害；
  - id: sun_8_05
    pathway: sun
    seq: 8
    sequenceTitle: 祈光人
    order: 5
    text: “日照”：创造仿佛正午烈阳的光芒，可给予死尸和鬼魂极大伤害，并影响其余生物的视觉；
  - id: sun_8_06
    pathway: sun
    seq: 8
    sequenceTitle: 祈光人
    order: 6
    text: 通过仪式魔法做到后面序列才能完成的一些事情。
  - id: sun_7_01
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 1
    text: 体质又得到了增强，对疾病对恶劣环境有了不小的抵抗能力；在本领域内的法术和祭祀能力都得到了极大提升。
  - id: sun_7_02
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 2
    text: 脑海充塞的类神术知识有：
  - id: sun_7_03
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 3
    text: · “召唤圣光”：召唤来一道神圣的、从天而降的明净而纯粹的温暖光芒，净化死灵类生物，并对另外类型的目标造成一定伤害。
  - id: sun_7_04
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 4
    text: · “制造圣水”：能制造少量太阳圣水，这能驱除邪灵，赶走寒冷，净化怨魂。
  - id: sun_7_05
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 5
    text: · “光明之火”：凭空产生金色的虚幻火焰，这些火焰散发着太阳的磅礴弥漫的气息，因密集而连成海洋。
  - id: sun_7_06
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 6
    text: · “净化之斩”：针对邪灵怨魂的有效打击，可以附加于武器上
  - id: sun_7_07
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 7
    text: · “免疫恐惧”：温暖的力量瞬间充满身体，能让自身不再感觉害怕
  - id: sun_7_08
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 8
    text: · “神圣誓约”：通过默念对应的古赫密斯语单词，为自身或武器短暂增加力量、敏捷、火焰伤害或神圣伤害。
  - id: sun_7_09
    pathway: sun
    seq: 7
    sequenceTitle: 太阳神官
    order: 9
    text: · “太阳光环”：针对二十米范围内的同伴，能有效提高他们的勇气，净化他们体内的邪异力量。
  - id: sun_6_01
    pathway: sun
    seq: 6
    sequenceTitle: 公证人
    order: 1
    text: 继续获得体质上的极大增强，但依旧偏辅助。
  - id: sun_6_02
    pathway: sun
    seq: 6
    sequenceTitle: 公证人
    order: 2
    text: “公证"：可对包括魔药配方在内的非凡知识真实性做出“公证”；可直接“公证”能力，“公证”有效的能力，可以得到短暂提升，“公证”无效的能力，会遭遇削弱，或被强行驱散。
  - id: sun_6_03
    pathway: sun
    seq: 6
    sequenceTitle: 公证人
    order: 3
    text: 擅于制作契约，一旦自己签名认可，序列5也无法违背，就连序列4的半神想强行违约，也要付出不小的代价。——契约的有效性促进了商业的发展，“公证人”也成为整个商业的重要一环，因此有财富和地位的回报，这是间接型的好处，被愚者教会羡慕地称为“财运”。
  - id: sun_5_01
    pathway: sun
    seq: 5
    sequenceTitle: 光之祭司
    order: 1
    text: 掌握各种太阳领域神术，能净化一定范围内的死灵和污秽类生物，是污秽和死灵的克星。
  - id: sun_5_02
    pathway: sun
    seq: 5
    sequenceTitle: 光之祭司
    order: 2
    text: 其中，之前掌握的两种神术获得质变，其余是威力提升。质变的两种神术是
  - id: sun_5_03
    pathway: sun
    seq: 5
    sequenceTitle: 光之祭司
    order: 3
    text: · “召唤圣光”质变为“神圣之光”：身体后仰，双臂张开，状似在拥抱太阳。一道恢弘纯净的炽烈光柱从而天降，笼罩住敌人，令敌人身体蒸发。附属能力是眼眸多了两轮微缩的太阳，进而得到夜视功能
  - id: sun_5_04
    pathway: sun
    seq: 5
    sequenceTitle: 光之祭司
    order: 4
    text: · “太阳光环”质变为“净化光环”：能产生光环般的效果，周围染上金色，一层又一层往外扩散。能温暖周围的伙伴，带来强烈的勇气，驱除邪异，并且能够受到精准操纵。
  - id: sun_4_01
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 1
    text: 从辅助型神职人员进化成了较为全面的太阳战士，体质、力量、速度、敏捷等都有质变。
  - id: sun_4_02
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 2
    text: “净化”：核心能力。从身体向外散发出一圈又一圈温暖的光辉，净化堕落、污秽、腐蚀、黑暗、邪恶、疾病等领域的力量，让它们飞快消散，直至没有一点残存。异常克制死灵、堕落者和污秽者。基于这个原理，可以直接清除非凡特性内的精神污染。排斥与其他神奇物品、非凡特性接触，能让非凡者特性一点点析出。
  - id: sun_4_03
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 3
    text: “无暗之域”：从体内迸发一道道纯净明澈的光芒，照亮周围的每个角落，变成没有一丝一毫的黑暗，不留一点阴影存在，不让任何事物隐藏的无暗国度，可破除银骑士的借光隐藏，对影子、污秽、堕落、黑暗方面的非凡能力有着极大的削弱。也可以防御阴暗邪恶的攻击。但是没有物理意义上的屏障界限，任何人都可以直接离开或对外面施加影响。
  - id: sun_4_04
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 4
    text: “无暗之枪”：积攒起光辉，凝聚出一柄纯净到极点炽白到极点似乎由纯粹阳光组成的长枪，投向敌人，并膨胀成炽白到极点得足以照亮城市的微缩的太阳。
  - id: sun_4_05
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 5
    text: “纯白射线”：亮起光芒凝聚成灼热刺眼的射线攻击。
  - id: sun_4_06
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 6
    text: “阳炎”：双臂半张开来，仿佛在拥抱神灵的恩赐。凭空浮现一个缠绕着无数神圣火焰的巨大纯净光球，将敌人包容于内，飞快消融着敌人，点燃其血肉。能对“污秽”、“堕落”、“不死”领域的生物造成极大伤害，甚至可以直接摧毁他们。但是攻击范围大，容易误伤己方。
  - id: sun_4_07
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 7
    text: “神圣盔甲”：潮水般的纯净金黄光芒从体内涌出，凝聚为一层光之盔甲覆盖于体表。
  - id: sun_4_08
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 8
    text: “太阳誓约”：为自身和范围内同伴附加各种增益。
  - id: sun_4_09
    pathway: sun
    seq: 4
    sequenceTitle: 无暗者
    order: 9
    text: 之前“公证”能力的提升。
  - id: sun_3_01
    pathway: sun
    seq: 3
    sequenceTitle: 正义导师
    order: 1
    text: 形成了一套相对唯心但也符合“太阳”途径本身特点的“正义”准则，对“正义导师”来说，这就是他自己的“秩序”，是他本人与自身、与神灵、与世界达成的“契约”。
  - id: sun_3_02
    pathway: sun
    seq: 3
    sequenceTitle: 正义导师
    order: 2
    text: 于是，“正义”导师获得一定的“契约”和“秩序”权柄——“契约”权柄是“秩序”权柄的下位。
  - id: sun_3_03
    pathway: sun
    seq: 3
    sequenceTitle: 正义导师
    order: 3
    text: “正义导师”周围10公里内，符合这套“正义”认知的行为，都会被较大程度增强，包括他自身，违背了这套“正义”准则的，则会遭受很大削弱，甚至直接失效——可控制不使用这种能力，否则友方的怨魂恶灵等根本不可能靠近“正义导师”，会迅速被压制并净化，这又称“正义光环”。
  - id: sun_3_04
    pathway: sun
    seq: 3
    sequenceTitle: 正义导师
    order: 4
    text: 若“正义导师”违背了这套“正义”准则中的任意一条，会出现自我力量不受控制，点燃会净化自身的事情，更严重的，会导致失控。
  - id: sun_3_05
    pathway: sun
    seq: 3
    sequenceTitle: 正义导师
    order: 5
    text: “正义审判”：指定单个目标，让他不符合那套“正义”准则的力量被极大削弱，乃至驱散，就连天使都会被影响，效果是使用“正义光环”时的两倍。
  - id: sun_3_06
    pathway: sun
    seq: 3
    sequenceTitle: 正义导师
    order: 6
    text: “神圣契约”：可签订连天使都不敢违反的契约——哪怕不存在序列0“太阳”，只要唯一性存在，都会自然地维护契约的执行，这是权柄的本能。
  - id: sun_2_01
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 1
    text: 获得了一定的“太阳”和“光”之权柄。
  - id: sun_2_02
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 2
    text: 可化光飞行；
  - id: sun_2_03
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 3
    text: 可化为光芒承受伤害，又重组出身体；
  - id: sun_2_04
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 4
    text: 可锚定“太阳”，不会迷路，不会被时空迷宫影响太久；
  - id: sun_2_05
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 5
    text: 黑暗、寒冷、污秽、堕落、死亡、衰败等力量带来的伤害会自然地受到很大程度的消解；
  - id: sun_2_06
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 6
    text: “太阳使者”：化身微缩的太阳，洒下炽烈恐怖的光和热，并带来可怕的净化；
  - id: sun_2_07
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 7
    text: “赞美太阳”：绝对的净化，各方面都获得质变的增益；
  - id: sun_2_08
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 8
    text: “正义审判”：从那套正义准则中明确了最核心正义是什么的“逐光者”可以对违反了核心正义的目标制造三倍甚至四倍五倍于“正义光环”的伤害；
  - id: sun_2_09
    pathway: sun
    seq: 2
    sequenceTitle: 逐光者
    order: 9
    text: 之前那些神术的提升。
  - id: sun_1_01
    pathway: sun
    seq: 1
    sequenceTitle: 纯白天使
    order: 1
    text: 一定的“神圣”权柄和“秩序”权柄。
  - id: sun_1_02
    pathway: sun
    seq: 1
    sequenceTitle: 纯白天使
    order: 2
    text: “神圣之国”：创造一个足以覆盖贝克兰德的虚幻国度，在这个国度内，布满太阳的光芒，充满神圣的力量，没有一点黑暗，也不会有不死生物的存在，能有效克制黑暗途径的复活，甚至让它无效；
  - id: sun_1_03
    pathway: sun
    seq: 1
    sequenceTitle: 纯白天使
    order: 3
    text: “秩序化身”：与自身有关的商业活动和整体秩序若还未崩坏，则“纯白天使”可以从中汲取力量，缓解创伤，保持状态；
  - id: sun_1_04
    pathway: sun
    seq: 1
    sequenceTitle: 纯白天使
    order: 4
    text: “纯白之光”：毁灭是一种净化，净化同样会带来毁灭，除了纯白和太阳，一切都将在这样的光照下分崩离析，得到解脱；
  - id: sun_1_05
    pathway: sun
    seq: 1
    sequenceTitle: 纯白天使
    order: 5
    text: “信仰之仆”：可让自身或信徒变得狂热，短时间内免疫诸多伤害（黑暗、污秽、死亡等），也可让目标或目标群体感受到神圣，逐渐赞美起太阳，最终成为“永恒烈阳”的信徒。
  - id: sun_0_01
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 1
    text: “神圣”：让一切不谐皆受净化，皆被驱散，让所有神圣行为都得到最大程度的提升；
  - id: sun_0_02
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 2
    text: “光”：光在，我在，照亮一切，摧毁一切，这也是能量的本质，是全知全能者的能量基石（不灭之光这个象征导致本途径真神很难被彻底摧毁，就算被摧毁了，也有以此复活的可能，同样的，全知全能者也更容易以“太阳”途径归来）
  - id: sun_0_03
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 3
    text: “秩序”：和“黑皇帝”秩序不同的是，“太阳”途径的秩序更偏正面，更自我，也更排它，也无法直接制定想要的秩序，必须来源于之前形成的那套正义准则——在“秩序”权柄上，两条途径是有交叉和重叠的。
  - id: sun_0_04
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 4
    text: 来源于“神圣”和“光”两者混合衍生的“太阳”权柄：一轮既符合现实又满足神秘学定义的真正太阳，既能散发出可以照亮甚至摧毁整个世界整个星系的灼热光芒，也能挥洒能量和制造出超高温火焰，并净化掉相应的污秽和邪恶。
  - id: sun_0_05
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 5
    text: 来源于“秩序”的“契约”权柄：一旦签订契约，没相应象征的旧日也会受到很强的约束。来源于“神圣”的“信仰”权柄：身心的纯化，精神的狂热，他人和自己。
  - id: sun_0_06
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 6
    text: 来源于“神圣”的“信仰”权柄。
  - id: sun_0_07
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 7
    text: 结晶太阳花一朵/一只成年火石鸟的尾羽/纵火鸟的尾羽
  - id: sun_0_08
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 8
    text: 海妖之石一块/歌唱葵一朵
  - id: sun_0_09
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 9
    text: 红葡萄酒80毫升
  - id: sun_0_10
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 10
    text: 仲夏草一根
  - id: sun_0_11
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 11
    text: 七月酒汁液五滴
  - id: sun_0_12
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 12
    text: 精灵暗叶一片
  - id: sun_0_13
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 13
    text: 光辉石一块/炽白之魂的粉末
  - id: sun_0_14
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 14
    text: 镜猬的血液/熔浆巨怪之心
  - id: sun_0_15
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 15
    text: 红葡萄酒100毫升
  - id: sun_0_16
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 16
    text: 金边太阳花一朵
  - id: sun_0_17
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 17
    text: 附子汁液三滴
  - id: sun_0_18
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 18
    text: 来自太阳信仰的物品一件
  - id: sun_0_19
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 19
    text: 黎明雄鸡的红冠一朵
  - id: sun_0_20
    pathway: sun
    seq: 0
    sequenceTitle: 太阳
    order: 20
    text: 光辉契灵树的果实一枚
  - id: sun_0_21
    pathway: sun
    seq: 0
