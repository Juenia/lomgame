    order: 39
    text: “诅咒之物”的喉管
  - id: prisoner_0_40
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 40
    text: “诅咒之物”污染过的疯狂之水100毫升
  - id: prisoner_0_41
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 41
    text: “诅咒之物”诅咒过的事物1个（已死去也符合条件）
  - id: prisoner_0_42
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 42
    text: 完整的羊皮或兔子皮1张
  - id: prisoner_0_43
