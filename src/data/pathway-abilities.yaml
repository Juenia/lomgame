    sequenceTitle: 航海家
    order: 1
    text: 天文地理的学者，他们对磁场，对洋流、风向、云朵都有着直觉的把握。有“航海家”的船只从来不会在大海上迷路。计算力、记忆力、对距离的判断力得到强化。
  - id: sailor_7_02
    pathway: sailor
    seq: 7
    sequenceTitle: 航海家
    order: 2
    text: 是海洋的更高品阶眷者，在大海之上会获得全方位的提升。
  - id: sailor_7_03
    pathway: sailor
    seq: 7
    sequenceTitle: 航海家
    order: 3
    text: 是水的朋友，能在水下自由活动超过半个小时。
  - id: sailor_7_04
    pathway: sailor
    seq: 7
    sequenceTitle: 航海家
    order: 4
    text: 能有限度施展一些与水相关的法术，有的来自本身的掌握，有的源于风暴之主的恩赐。
  - id: sailor_6_01
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 1
    text: 在水、风和天气领域具备不错的非凡能力；
  - id: sailor_6_02
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 2
    text: 被风眷顾，能够自体内刮出狂风而使出风压拍击，在四周盘绕起飓风；
  - id: sailor_6_03
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 3
    text: 可在身体部位上附着高速旋转的狂风；
  - id: sailor_6_04
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 4
    text: 能在脚下生成狂风推进，使跑速提高一倍以上；
  - id: sailor_6_05
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 5
    text: 能制造气垫。具备夜视能力；
  - id: sailor_6_06
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 6
    text: “风刃”：释放薄薄的风刃；
  - id: sailor_6_07
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 7
    text: “滑翔：驾驭狂风，能够在空中短距离滑翔。不受禁止飞行的规则约束；
  - id: sailor_6_08
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 8
    text: “飞行”：又称短途飞行；
  - id: sailor_6_09
    pathway: sailor
    seq: 6
    sequenceTitle: 风眷者
    order: 9
    text: 拥有浮空之风（悬浮于半空）、漂浮（水中不沉）、深潜（下潜到百米深的海底）、控水（对水的操纵和使用，一定程度内）等能力。
  - id: sailor_5_01
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 1
    text: 对闪电有浅层次掌控；
  - id: sailor_5_02
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 2
    text: 更好更全面更长久的水下活动天赋；
  - id: sailor_5_03
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 3
    text: 能制造出润滑的效果；
  - id: sailor_5_04
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 4
    text: 可以将声音以电光的形式远距离传播；
  - id: sailor_5_05
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 5
    text: “歌唱”：有用歌声影响目标的能力——因为每个人自身特质的不同，一种是用美妙的歌声干扰敌人的灵体，让他出现恍惚失神等状态，或者提高自身的爆发力；一种是模拟雷鸣，使人受到震慑；一种是靠杂乱难听的歌声让敌人烦躁，失去理智。仅凭纸团堵住耳朵和收敛灵性，只能减弱影响，没法真的隔绝。就算是失聪者，也一样能听见，这包含了灵性层面的“交流；“水幕”：
  - id: sailor_5_06
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 6
    text: 制造水幕，遮掩或防御；
  - id: sailor_5_07
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 7
    text: “风之束缚”：用风缠绕和影响目标；
  - id: sailor_5_08
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 8
    text: “抵抗压力”：类法术效果。不害怕深海的压力；
  - id: sailor_5_09
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 9
    text: “雷电之矢”：头发违背自然规律地张了开来，根根分明，缠绕起电光。拉动弓弦后半空变得灰暗，仿佛有乌云在凝聚，有电光在跳跃。可将头发上的银白闪电涌出交缠于长箭之上并射出。半空乌云层叠，将有一道粗大的闪电落下，叠加于那支长箭上。箭矢彻底变得银白，就像来自雷神，以难以躲避的速度命中敌人；
  - id: sailor_5_10
    pathway: sailor
    seq: 5
    sequenceTitle: 海洋歌者
    order: 10
    text: “雷击”：产生能造成麻痹的银白电光，制造一道闪电。相当克制亡灵。一旦出现，肯定已躲不开，只能提前规避。即便没有劈中敌人，依然能崩散为无数细小的电蛇，向着周围导电性能较好的事物跳跃而去。
  - id: sailor_4_01
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 1
    text: “龙卷风”：剧烈的风与空气碰撞，发出爆炸般的动静，肉眼可见的恐怖飓风盘旋着缠绕着出现，气流一圈圈急转，不受遏制的龙卷风霍然拔地而起，将地上的东西同时卷上半空，直蹿天空的龙卷风就像一个恐怖的巨人，所过之处，地面干干净净，没有一点事物残留；
  - id: sailor_4_02
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 2
    text: “海啸”：涌起接近10米的深黑海浪；
  - id: sailor_4_03
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 3
    text: “风刃军团”：几百上千道薄而锐利的风刃呼啸着从四面八方奔向目标；
  - id: sailor_4_04
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 4
    text: “地震”：依靠本身能制造地陷、喷薄岩浆效果，威能在六级作用，并可集中在一个区域释放，若大地本身就积蓄有力量，有恐怖大地震的前兆，那上限取决于该地区酝酿的地震有多少级；
  - id: sailor_4_05
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 5
    text: 除此之外还有“暴风雪”、“暴雨”和“洪水”等各种各样的灾难（集中在天灾领域）；
  - id: sailor_4_06
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 6
    text: “飞行”：真正的飞行，时速可达到每小时500公里；
  - id: sailor_4_07
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 7
    text: “披甲”：“暴君”下属序列的鳞片就是他们的盔甲，拥有很强的防御能力；
  - id: sailor_4_08
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 8
    text: “连环闪电”：同时制造多道闪电，并且闪电能在目标之间跳跃；
  - id: sailor_4_09
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 9
    text: “水下视觉”：不会因光线不足产生阅读困扰，哪怕在无光的深海，也能看清楚周围的事物；
  - id: sailor_4_10
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 10
    text: 另外还有“操纵波浪”、“水墙”、“风之子”等能力；
  - id: sailor_4_11
    pathway: sailor
    seq: 4
    sequenceTitle: 灾难主祭
    order: 11
    text: 前面其他序列能力的提升，比如序列4层面的“歌唱”能力，能用死亡的旋律影响周围，干扰封印物的运转。
  - id: sailor_3_01
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 1
    text: 即使有范围限制，在自身掌控的海域，也肯定是强大的支配者，可以自由地行走于海底，肆意地掀起海啸（可达四五十米高），让海水上涨，支配海洋生物。在主场作战，绝对能力压同层次所有半神。
  - id: sailor_3_02
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 2
    text: “闪电风暴”：一道道银白电蛇蹿出，带着强烈得宛若实质的的暴虐毁灭气息，密密麻麻地劈向周围，将几百米的区域笼罩在雷霆森林内，被笼罩的生物破碎蒸发而消失不见。范围攻击，不会分辨敌我；
  - id: sailor_3_03
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 3
    text: “大海之怒”：部分“海洋”权柄——整片海域排斥对应目标，通过“海啸”等方式给予阻拦和攻击；
  - id: sailor_3_04
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 4
    text: “海域主宰”：部分”暴君“和部分“水生生物”权柄——可驱使该片海域的任意一种或多种生物；可水生生物化，在海底就是在主场；可以让水面倒映出之前一段时间的场景；可精神扫视该片海域，寻找每一个可能具备异常的地方；
  - id: sailor_3_05
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 5
    text: “毁灭水滴”：通过瓦解或重组水滴，释放出恐怖的、摧毁性的能力；
  - id: sailor_3_06
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 6
    text: “音爆”：可隔空制造；
  - id: sailor_3_07
    pathway: sailor
    seq: 3
    sequenceTitle: 海王
    order: 7
    text: 前面其他序列能力的提升，比如“龙卷风”变成一定范围内的飓风。
  - id: sailor_2_01
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 1
    text: “风暴化身”：能掀起足以摧毁一个大城市的飓风暴雨——部分“天灾”权柄衍化而来；
  - id: sailor_2_02
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 2
    text: “恐惧之音”：通过声音，让上百公里范围内的生灵乃至封印物极度恐惧，选择服从；
  - id: sailor_2_03
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 3
    text: “天灾降临”：包括“雷灾”、“雪难”、“海啸”等，可自由选择，这些都是足以毁灭一个港口，乃至一个岛屿——部分“天灾”权柄衍化而来；
  - id: sailor_2_04
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 4
    text: “愤怒之源”：“愤怒”能通过放弃思考短暂提升自我的力量，达到下一个序列的层次，但不影响位格，这可以对自己使用，也可以用来影响目标；
  - id: sailor_2_05
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 5
    text: “电磁紊乱”：指定的城市群或大型岛屿、对应海域，信息被严重干扰，电报等通信方式失去作用；
  - id: sailor_2_06
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 6
    text: “磁极牵引”：创造或者影响磁场，让目标被拉扯，或靠近，或远离，或转动，而磁场本身的转动也能积蓄力量；
  - id: sailor_2_07
    pathway: sailor
    seq: 2
    sequenceTitle: 天灾
    order: 7
    text: 之前其他能力的提升。
  - id: sailor_1_01
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 1
    text: “天罚”：从天而降的巨大闪电，并附带瓦解、净化、摧毁等力量，对试图超越自然或超出物质的目标行为有弱点攻击般的威能，同样的，对黑暗、死亡、堕落、污秽等领域的敌人也如此——部分“雷霆”权柄衍化而来；
  - id: sailor_1_02
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 2
    text: “光之化身”：转化能量体，以接近但还不是光的速度飞行或攻击；
  - id: sailor_1_03
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 3
    text: “雷神之鸣”：声音攻击，以电光的速度传播，能带来恐惧、震慑等效果，对黑暗、死亡、堕落、污秽等领域的目标有奇效；
  - id: sailor_1_04
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 4
    text: “风暴地狱”：可指定一片海域、一个大型岛屿、一处城市群，让它陷入毁灭性的风暴地狱，该影响可永久存在——部分“天灾”权柄加“风”之权柄衍化而来；
  - id: sailor_1_05
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 5
    text: “闪电海洋”：由恐怖闪电构成的、有强烈电磁影响的“海洋”，足以覆盖一座大型岛屿；
  - id: sailor_1_06
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 6
    text: “雷霆之舞”：无形的雷霆，可破坏电磁结构，干扰并摧毁信息，是信息化的克星之一；
  - id: sailor_1_07
    pathway: sailor
    seq: 1
    sequenceTitle: 雷神
    order: 7
    text: 之前其他能力的提升。
  - id: sailor_0_01
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 1
    text: “造物”象征衍化而来的部分“雷霆”权柄（电与磁）：掌控电与磁的力量，能发出强烈的电磁风暴，破坏所有的信息结构；
  - id: sailor_0_02
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 2
    text: “暴君”权柄：万王之王，下分“威慑”权柄、“愤怒”权柄、部分“恐惧”权柄——而这些往下衍化出了“歌唱”能力；
  - id: sailor_0_03
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 3
    text: “水”之权柄（下属有“海洋”权柄、部分“水生生物”权柄）——来源于“造物”和“全能”两个象征的交叉；
  - id: sailor_0_04
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 4
    text: “造物”象征衍化而来的部分“物质”权柄：物质可转化为能量，能量可凝为物质，也就包含了电磁、强、弱等基本之力，与“雷霆”权柄有交叉，拥有该权柄者能于短时间内电流化光速化，能带着部分物质，接近速度的极限，一次创造出可以毁灭星球的狂暴波浪；
  - id: sailor_0_05
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 5
    text: 部分“天灾”权柄：“灾难”下属，衍化而成；
  - id: sailor_0_06
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 6
    text: “风”之权柄：与“天灾”有交叉；
  - id: sailor_0_07
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 7
    text: 神国：恐惧天堂（唯服从风暴）、风暴之渊——这两种神国都来自于“暴君”权柄和“雷霆”权柄、“天灾”权柄的糅合衍化，前面那种侧重于“暴君”，后面那种侧重于“雷霆”与“天灾”。
  - id: sailor_0_08
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 8
    text: 鱼人的鳔
  - id: sailor_0_09
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 9
    text: 食人螺一个
  - id: sailor_0_10
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 10
    text: 烈酒300毫升
  - id: sailor_0_11
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 11
    text: 海水200毫升
  - id: sailor_0_12
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 12
    text: 鱼人的鳞片3块
  - id: sailor_0_13
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 13
    text: 海草榨取的汁液12滴
  - id: sailor_0_14
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 14
    text: 深潜者的肺泡
  - id: sailor_0_15
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 15
    text: 战吼鸟的胸骨
  - id: sailor_0_16
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 16
    text: 烈酒500毫升
  - id: sailor_0_17
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 17
    text: 深潜者的舌头半根
  - id: sailor_0_18
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 18
    text: 战吼鸟的喙一截
  - id: sailor_0_19
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 19
    text: 红皮海藻精油10滴
  - id: sailor_0_20
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 20
    text: 黑鳞鲨的脑垂体
  - id: sailor_0_21
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 21
    text: 狂暴白豚的心脏
  - id: sailor_0_22
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 22
    text: 烈酒500毫升
  - id: sailor_0_23
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 23
    text: 黑鳞鲨的鳍翅一片
  - id: sailor_0_24
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 24
    text: 狂暴白豚的血液100毫升
  - id: sailor_0_25
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 25
    text: 蓝星珊瑚一枝
  - id: sailor_0_26
    pathway: sailor
    seq: 0
    sequenceTitle: 暴君
    order: 26
    text: 水晶一块
  - id: sailor_0_27
