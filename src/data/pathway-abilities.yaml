    seq: 0
    sequenceTitle: 审判者
    order: 6
    text: “平衡”权柄：强制平衡，除了之前表现出来的那些，还能令很多抽象之物平衡，比如，让理智和疯狂在一定时间内恢复平衡，但最多三分钟。
  - id: arbiter_0_07
    pathway: arbiter
    seq: 0
    sequenceTitle: 审判者
    order: 7
    text: 一定的“混乱”权柄：恢复混乱，平息混乱，泯灭混乱；秩序也会制造混乱。
