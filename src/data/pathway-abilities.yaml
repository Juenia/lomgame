  - id: criminal_9_01
    pathway: criminal
    seq: 9
    sequenceTitle: 罪犯
    order: 1
    text: 和囚犯不同，他不会压抑自己，不会感觉束缚，身和心都处于恶欲的统治之下，当然，他的良知还未彻底泯灭，还不够冷酷。“罪犯”同样有着强壮的身体，敏锐的知觉和各种犯罪能力，不管骑士剑、匕首、长弓，还是手枪、步枪、六管机枪，都能熟练上手。
  - id: criminal_8_01
    pathway: criminal
    seq: 8
    sequenceTitle: 折翼天使
    order: 1
    text: 从此失去良知，与恶欲同流，身体更加非人，并能得到些恶魔的类法术能力（这因人而异，有的是制造毒火，有的是“恶语伤人”式的弱小诅咒，有的是制造黑烟，比较普遍共通的是“迟缓”）
  - id: criminal_7_01
    pathway: criminal
    seq: 7
    sequenceTitle: 连环杀手
    order: 1
    text: 掌握了涉及恶魔的诸多知识和仪式；
  - id: criminal_7_02
    pathway: criminal
    seq: 7
    sequenceTitle: 连环杀手
    order: 2
    text: 能从深渊里召唤来恶魔的投影，喜欢制造特殊的连环杀人案。“连环杀手”完成连环杀人案不仅仅是为了扮演，也是在取悦深渊的恶魔们，等到案件结束，“连环杀手”就能举行仪式的最后一个步骤，召唤来对应的深渊恶魔投影，获得相应的帮助，得到自己想要的——“连环杀手”能召唤深渊恶魔的投影，是因为那些恶魔能借助深渊的特殊来响应，而不是它们本身达到了相应的位格；
  - id: criminal_7_03
    pathway: criminal
    seq: 7
    sequenceTitle: 连环杀手
    order: 3
    text: 能对占卜和通灵进行有效干扰。
  - id: criminal_6_01
    pathway: criminal
    seq: 6
    sequenceTitle: 恶魔
    order: 1
    text: “罪犯”途径质变的第一个节点，相应的非凡者力量、速度和防御全面提升（防御是指皮肤出现变异，相当于披了一层坚硬的盔甲，血和肉能阻滞物品，减少伤害），而且还能免疫大部分毒素，不怕一定程度内的诅咒和火焰。
  - id: criminal_6_02
    pathway: criminal
    seq: 6
    sequenceTitle: 恶魔
    order: 2
    text: 他们冷血，不惊慌，不恐惧，具备很强的肉搏能力，擅于使用各种物品造成伤害，最大的弱点是容易失控，即使没有，也会时常表现出冷血和残忍皆备的疯狂，容易被嗜血和杀戮等欲望控制。
  - id: criminal_6_03
    pathway: criminal
    seq: 6
    sequenceTitle: 恶魔
    order: 3
    text: “恶魔”途径非常个性化，不同种族的恶魔各有不同，具备自身独特的能力，而即使同一种族衍变来的恶魔，也会因个体的区别存在一定的差异，原因大概是这条途径需要张扬恶意，而每个人每种生物的恶意是不一样的。个人的意志、独有的心灵和有倾向的欲望共同造就了不同的恶魔。
  - id: criminal_6_04
    pathway: criminal
    seq: 6
    sequenceTitle: 恶魔
    order: 4
    text: “恶魔化”：巨大化身躯到接近3米，短暂提升力量和速度，从而挣脱束缚——头顶山羊角弯曲伸出，布满了数不清的神秘花纹，背后一对蝙蝠羽翼般的巨型翅膀展开，缠绕着淡蓝的火焰，散发出强烈的硫磺味道。他们的皮肤因此深度变异，看似黯淡，实则深黑邪异。浑身上下都仿佛披着一层厚重的坚硬盔甲，血和肉也极具弹性和阻力。
  - id: criminal_6_05
    pathway: criminal
    seq: 6
    sequenceTitle: 恶魔
    order: 5
    text: “恶意感知”：又称“预知危险”。如果对方能在很短一段时间后对他造成致命的危害，并采取了付诸实践的行动，那自己能感应到，察觉到，并把握住危险来源于哪里，来源于谁，从而有针对性地扼杀或报复。不同的恶魔有不同的直觉起效范围，从几分钟到一天不等，从几公里到一个都市圈不等。
  - id: criminal_6_06
    pathway: criminal
    seq: 6
    sequenceTitle: 恶魔
    order: 6
    text: “恶魔”还掌握了大量的法术，涉及火焰、毒素、污秽三个领域。
  - id: criminal_5_01
    pathway: criminal
    seq: 5
    sequenceTitle: 欲望使徒
    order: 1
    text: “掌控欲望”：能利用和操纵每个人的情绪和欲望，诱使堕落。敌人有太强烈的情绪波动，出现太明显的欲望，立刻就会自己远程控制，或埋下种子，或直接催化。这会让人暴露出诸多问题，逐渐堕落，或在关键时刻情绪失控，无法反抗，或欲望爆炸，超过身体能够负担的上限，遭受重创，乃至死亡，若目标警惕、紧绷、戒备等情绪被放大，能让其对时间的把握产生混乱。
  - id: criminal_5_02
    pathway: criminal
    seq: 5
    sequenceTitle: 欲望使徒
    order: 2
    text: “精神冲击”：燃烧起头上两根弯曲的恶魔角，强行冲击敌人的精神，让他不可避免地产生一定的情绪。属于“掌控欲望”的分支。恶魔角燃烧完后无法使用。
  - id: criminal_5_03
    pathway: criminal
    seq: 5
    sequenceTitle: 欲望使徒
    order: 3
    text: “欲望化身”：将身体转化为各种情绪和欲望凝成的，虚幻的，粘稠的黑色液体，这无论在规避伤害，隐匿行踪，还是影响敌人上都有非常不错的效果。这些液体仿佛人心底最险恶最见不得人的欲望集合体，以污染一切的姿态席卷周围，涌向目标。
  - id: criminal_5_04
    pathway: criminal
    seq: 5
    sequenceTitle: 欲望使徒
    order: 4
    text: 不同恶魔晋升后还会产生不同的特殊能力，比如“影化”，比如“欲望共生”（将自己与某个目标的某种欲望链接在一起，那种欲望或那个目标不死，则自身无法被彻底消灭）等。
  - id: criminal_5_05
    pathway: criminal
    seq: 5
    sequenceTitle: 欲望使徒
    order: 5
    text: 前面序列其他能力的提升。
  - id: criminal_4_01
    pathway: criminal
    seq: 4
    sequenceTitle: 魔鬼
    order: 1
    text: 虽然展现不完整的神话生物形态容易带来失控，但魔鬼们能让自身某个部分呈现出神话生物的特性并长期保持，从而获得独有的、奇异的效果。
  - id: criminal_4_02
    pathway: criminal
    seq: 4
    sequenceTitle: 魔鬼
    order: 2
    text: 魔鬼在头脑上属于“连环杀手”的进阶，冷酷，敏锐，狡猾，是典型的高智商生物。狡诈，喜欢误导别人。另外，他们能有效影响一定范围内的目标，让他们的思考能力不知不觉下降，变得粗心大意，容易犯错。
  - id: criminal_4_03
    pathway: criminal
    seq: 4
    sequenceTitle: 魔鬼
    order: 3
    text: 魔鬼虽然拥有着在同层次里排名前列的体魄和类法术能力（新增“强酸沼泽”、“地狱之火”、“腐蚀毒雾”、“污秽幻影”和不依赖深渊的“投影术”等），但他们更擅长也更喜欢精神层面的交锋。比起“欲望使徒”阶段，魔鬼不需要再等待对方出现情绪的波动、欲望的升腾，他们能通过声音、眼神、动作等方式直接让特定的目标或一定范围内的所有目标陷入不可避免的迷幻状态，情绪和欲望飞快膨胀，然后或引爆心灵，或摧毁理智，或带来失控。
  - id: criminal_4_04
    pathway: criminal
    seq: 4
    sequenceTitle: 魔鬼
    order: 4
    text: 具备更强的“恶意感知”和更完备的“污秽之语”，多了“困惑”、“懒惰”、“亵渎”等单词。
  - id: criminal_3_01
    pathway: criminal
    seq: 3
    sequenceTitle: 呓语者
    order: 1
    text: 掌握了一定的“污染”权柄，主要集中在心灵和精神方面：
  - id: criminal_3_02
    pathway: criminal
    seq: 3
    sequenceTitle: 呓语者
    order: 2
    text: · 他们的声音，他们吐出的每一个单词，都能够让非凡者或直接失控，或遭受重创，或精神混乱，或诅咒加身。
  - id: criminal_3_03
    pathway: criminal
    seq: 3
    sequenceTitle: 呓语者
    order: 3
    text: · 如果建立起联系，“呓语者”能够在非常遥远的地方，将自己的声音传递到目标耳中，让他们不明不白地暴毙于安全所在。
  - id: criminal_3_04
    pathway: criminal
    seq: 3
    sequenceTitle: 呓语者
    order: 4
    text: 同样的，如果“呓语者”预知到了危险来源，那他有机会当场反向施加影响。
  - id: criminal_2_01
    pathway: criminal
    seq: 2
    sequenceTitle: 鲜血大公
    order: 1
    text: 掌握了一定的“恶意”和“身体”权柄，核心能力与鲜血、体液、恐惧、恶意等有关。
  - id: criminal_2_02
    pathway: criminal
    seq: 2
    sequenceTitle: 鲜血大公
    order: 2
    text: “恶意化身”：恶意不灭，魔鬼不死——能在目标心灵埋下恶意的种子，等到本体毁灭，“鲜血大公”能在目标的心里复活，燃烧目标的欲望与鲜血；催化目标的恶意，让他们短暂“冷血”化，若在这段时间做出了真正的恶意行为，则会进一步堕落，直至跌入深渊；
  - id: criminal_2_03
    pathway: criminal
    seq: 2
    sequenceTitle: 鲜血大公
    order: 3
    text: 恶意带来目标的恐惧，这是纯粹的、来自本能的恐惧，会让人头脑空白，难以思考，难以做出动作；
  - id: criminal_2_04
    pathway: criminal
    seq: 2
    sequenceTitle: 鲜血大公
    order: 4
    text: “鲜血主宰”，掌握鲜血和体液，包括自身的和他人的，并可以通过自身的鲜血和体液完成对外界和目标的腐蚀和污染；只要有一滴鲜血或体液还未泯灭，“鲜血大公”就能很快归来，重组身体。
  - id: criminal_2_05
    pathway: criminal
    seq: 2
    sequenceTitle: 鲜血大公
    order: 5
    text: 之前序列能力的提升。
  - id: criminal_1_01
    pathway: criminal
    seq: 1
    sequenceTitle: 污秽君王
    order: 1
    text: 掌握了一定的“污秽”、“污染”、“腐蚀”和“火焰”权柄，核心能力与污秽、腐蚀、污染有关。
  - id: criminal_1_02
    pathway: criminal
    seq: 1
    sequenceTitle: 污秽君王
    order: 2
    text: “污秽之王”：肮脏、罪恶、不干净事物的掌控者，既可以随时召唤它们提供帮助，也可以直接地影响具备这些事物的目标；目睹或靠近”污秽之王”，哪怕同序列的天使，只要不是“太阳”等领域的，也会遭受一定的污染。
  - id: criminal_1_03
    pathway: criminal
    seq: 1
    sequenceTitle: 污秽君王
    order: 3
    text: “侵蚀者”：再坚固的壁垒，于一定时间的持续腐蚀下，都会被穿透；“侵蚀者”制造的火焰、雾气和环境都体现了这方面的特点。
  - id: criminal_1_04
    pathway: criminal
    seq: 1
    sequenceTitle: 污秽君王
    order: 4
    text: “深渊之火”：兼具燃烧、腐蚀、毒素和污染的火焰，而大部分非凡者对火焰的防护只体现在”燃烧”上面。
  - id: criminal_1_05
    pathway: criminal
    seq: 1
    sequenceTitle: 污秽君王
    order: 5
    text: 之前序列能力的提升。
  - id: criminal_0_01
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 1
    text: 部分“堕落”权柄：如果说“倒吊人”体现的是每个生灵的堕落自性，那深渊就是让所有身处其中者必然堕落的环境，不仅诱发，而且制造。
  - id: criminal_0_02
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 2
    text: 部分“污秽”权柄：“污秽”是深渊的组成部分，是所有不洁之物的具现，会带来的身体、精神、心灵的多重冲击和影响。
  - id: criminal_0_03
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 3
    text: 部分“污染”权柄：既是堕落和污染的向外延伸，也是欲望爆发、理智失控的必然结局。
  - id: criminal_0_04
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 4
    text: 部分“欲望”权柄：比如“欲望母树”残存的那些，“深渊”的欲望更多体现在对欲望的诱发、催化和引爆，而不是欲望本身。
  - id: criminal_0_05
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 5
    text: 部分“诅咒”权柄：比起“被缚者”，深渊的诅咒主要在精神和心灵领域。
  - id: criminal_0_06
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 6
    text: 部分“异类”权柄：向下的影响是恶魔们因个人特点、环境因素体现出不同的异变，而向上的好处是，深渊拥有这些异变的全部，包容这一切。
  - id: criminal_0_07
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
    order: 7
    text: “腐蚀”：万物皆可腐蚀（“污秽”和“污染”的下位）。
  - id: criminal_0_08
    pathway: criminal
    seq: 0
    sequenceTitle: 深渊
