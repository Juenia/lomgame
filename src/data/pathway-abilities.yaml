  - id: sleepless_7_02
    pathway: sleepless
    seq: 7
    sequenceTitle: 梦魇
    order: 2
    text: “入梦”：能将他人强行拉入梦境——直接拖人入梦的情况，有范围的限制，往往只出现于正面对决里，但并不是必须面对面才能尝试这种能力，百米距离内，都可以获得一定的效果，只是非面对面的情况下，需要时间，需要过程，无法一下完成，就像在哄孩子入睡一样；
