    order: 1
    text: 容貌和魅力极大提升。
  - id: assassin_7_02
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 2
    text: 初步掌握各种黑魔法，能通过血液等媒介诅咒目标，让对方被黑焰燃烧成灰烬。
  - id: assassin_7_03
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 3
    text: 能干扰别人的占卜。
  - id: assassin_7_04
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 4
    text: 隐形：抬起右手，在脸前一抹，顿时使容颜变得朦胧与模糊，配合着咒文将一把闪烁荧光的粉末洒在自己身上，身影开始一寸寸消失，轮廓线条仿佛铅笔所画，被橡皮擦彻底抹去。
  - id: assassin_7_05
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 5
    text: 操控黑焰：能使用焚烧灵体和灵性的黑色火焰，对不具有灵性的物体无效。
  - id: assassin_7_06
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 6
    text: 操控冰霜：能直接冻结近处的目标或制造冰面阻碍靠近的敌人，也能根据需要制作各种形状的冰块。
  - id: assassin_7_07
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 7
    text: 镜子魔法：能使用镜子进行占卜、反占卜和通灵，也能以周围的镜子作为替身。
  - id: assassin_7_08
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 8
    text: · 镜子替身有主动和被动两种触发方式，可以提前做好交给别人使用。替身发动时，身躯就像湖中红月一样崩散了，旁边的镜子跟着裂开，其轮廓一寸寸勾勒于镜子旁，凸显了出来。
  - id: assassin_7_09
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 9
    text: · 每当使用镜子替身时，自己的镜中人都会死亡，然后再从本体分裂出去。
  - id: assassin_7_10
    pathway: assassin
    seq: 7
    sequenceTitle: 女巫
    order: 10
    text: 魔杖替身法：能以魔杖作为替身。
  - id: assassin_6_01
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 1
    text: 各方面能力都得到提升，变得更加美丽，擅长魅惑，对人体了解很深，能非常轻易地通过接触使人欢愉，擅长在欢爱里给异性或者同性无法忘怀的快乐。
  - id: assassin_6_02
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 2
    text: 能像蜘蛛一样制造一根根近乎无形的奇怪细线，缠绕目标身上，减缓其速度，影响其动作，是格斗能力的克星。也能让自己被什么东西拉扯着般快速横移到另一个方向。或是细丝缠绕，将自己一层又一层包裹于内，结出巨大的蚕茧。但蛛丝怕火。
  - id: assassin_6_03
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 3
    text: · 能减缓目标的速度和动作；
  - id: assassin_6_04
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 4
    text: · 能编织一个茧将自己包裹起来，提供保护和恢复的机会。
  - id: assassin_6_05
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 5
    text: “黑焰”、“冰霜”、“诅咒”能力和“镜子魔法”都得到了有效增强，彼此间还能互相组合。比如，利用镜子锁定目标，依靠“黑焰”完成诅咒；比如，在“镜子替身”、“魔杖替身”外，有了防御致命伤害和初步恢复的巫术。
  - id: assassin_6_06
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 6
    text: 操控黑焰：序列6层面的女巫非凡能力。能在四周缭绕起七朵黑色的火焰，并让其如同子弹般衔尾射向目标。也能让自身从内到外燃烧起安静的黑焰，驱除诅咒。但是黑焰只能影响有生命或者有灵性的事物。
  - id: assassin_6_07
    pathway: assassin
    seq: 6
    sequenceTitle: 欢愉
    order: 7
    text: 操控冰霜：序列6层面的女巫非凡能力。能霍地凸显一道透明的冰晶长枪，白色的冰霜自刺到的位置蔓延，被波及的人突地打起寒颤，身体变得僵硬，虽然还能行动，但却相当地迟钝。也能让自己体表浮现出一层晶莹而坚固的冰霜。
  - id: assassin_5_01
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 1
    text: 容貌、身材和魅力提升。
  - id: assassin_5_02
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 2
    text: “魅惑”变成了可以主动使用的能力，而不是被动展现的一种状态。配上自身容貌、身材和气质的展现，主动的“魅惑”能力效果会更好。被魅惑到的敌人将会对自己心软，舍不得下狠手出全力，有的甚至会放弃抵抗，只为了靠近自己。而日常的相处里，如果反复对一个人使用魅惑，长期维持，那他会真正地爱上自己。
  - id: assassin_5_03
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 3
    text: 疾病：能制造多种病原体，让它们分布在三十多米的范围内，伴随着魔药的掌握和消化，范围最终能达到五十米。
  - id: assassin_5_04
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 4
    text: · 不仅能制造多种病原体，还可以加速它们对生物的感染，加速病情的爆发。最初十秒是潜伏期，接下来十秒会有一些轻微的症状，比如过敏，发烧，咳嗽，打喷嚏等，再之后，病情会迅速变重，目标将罹患肺炎等重病，等到两三分钟过去，他们的疾病将恶化到随时可能让他们猝死或导致他们失去行动能力。
  - id: assassin_5_05
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 5
    text: · 病原体无法感染不死生物，“猎人”的火焰也能杀死很多病原体，降低疾病的影响。
  - id: assassin_5_06
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 6
    text: 蛛丝得到了显著增强，就像是一条条手臂一样，能完成更多的精细操作。能制造数不清的无形蛛丝自四周缠绕目标，有的坚硬，试图捆绑，有的柔软，挑拨着身体不同地方，让战斗时极为冷静的非凡者都心跳加快，耳朵发热，身体微酥带麻，既有感冒般的不适，也有血液下涌的冲动。比起欢愉魔女，痛苦魔女在蛛丝上的能力可怕了不止一层。
  - id: assassin_5_07
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 7
    text: 可以操纵自己的头发，把头发当作武器。 它不仅能刺穿皮肤，注入黑焰，还能让目标接触到头发的部位出现一定的僵硬。
  - id: assassin_5_08
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 8
    text: 诅咒变得更强更有针对性了，比如，以前必须用镜子映出目标完整的身影，然后才能通过覆盖魔女黑焰这个行为诅咒对方，这是整体性的，现在，可以只映照出目标的一部分躯体，对那部分躯体的影响将反映到目标对应的部位。
  - id: assassin_5_09
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 9
    text: 之前获得的其他能力也有提升和拓展，包括黑魔法和镜子魔法。
  - id: assassin_5_10
    pathway: assassin
    seq: 5
    sequenceTitle: 痛苦
    order: 10
    text: 镜像迷宫：能利用镜子，利用事先的布置，完成场景类幻术。
  - id: assassin_4_01
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 1
    text: “疾病”变成了可以覆盖三公里范围的“瘟疫”。刚晋升的“绝望魔女”一般只能掌握两种瘟疫。
  - id: assassin_4_02
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 2
    text: · 一种是由原本“疾病”升华而来的，针对较常见生物的肉体，以感染心脏、大脑、肺部等器官为主，从潜伏期到病情爆发再到变得严重，只需要十几秒钟的时间，之后再有一分钟就可能让目标恶化到接近死亡，具体的时间因敌人的位格和体质不同有所不同。
  - id: assassin_4_03
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 3
    text: · 第二种是“僵硬”，它会随着时间的推移让活尸都身体僵硬，变得呆板，属于偏神秘学的一种瘟疫。
  - id: assassin_4_04
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 4
    text: “绝望魔女”还可以结合自身的特质、相应的神秘学知识、具体的想法和实验、可能需要的特殊材料，创造出自身独有的瘟疫品种，这需要漫长的时间，没法很快就有收获，但不管怎么样，“魔女”的“瘟疫”都只能针对具备灵性的事物。
  - id: assassin_4_05
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 5
    text: “绝望魔女”对镜中世界和镜子魔法的掌握到了相当深入的阶段，可以定位周围五公里范围的镜子和曾经去过的镜子，可以在镜中世界任意穿梭，并让信息借助镜中世界传递到有定位的那些镜子处呈现出来，这比信使方便很多，但存在信息被镜中生物拦截的可能性，需要在信息里附加一些诅咒来规避大部分麻烦。还可以借助拥有定位的镜子，将自身投影过去，看起来和真的一样，这种投影当前有距离的限制，其范围无法超过一座城市。
  - id: assassin_4_06
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 6
    text: 眼中仿佛藏了一面又一面镜子，能照出一个又一个怨魂，他们彼此叠加，陷入了混乱，以此避开怨魂附体。
  - id: assassin_4_07
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 7
    text: 诅咒无法再用替身转移或分担，敌人如果不能在被锁定之后，完成诅咒前，就用替身取代掉自己，那他们即使有“镜子替身”、“纸人替身”，也无法转移和分担伤害。
  - id: assassin_4_08
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 8
    text: 蛛丝变得更坚固，更坚韧，能完成更多的事情，包括束缚，捆绑，干扰，传递欢愉、黑焰和诅咒等。
  - id: assassin_4_09
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 9
    text: 头发是蛛丝的源泉，敌人的身体若是被头发触碰到，那相应的部位会出现一定的石化症状。
  - id: assassin_4_10
    pathway: assassin
    seq: 4
    sequenceTitle: 绝望
    order: 10
    text: 镜面幻术：能用镜子作为物品的替身。
  - id: assassin_3_01
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 1
    text: 青春永驻，诡异难杀，擅长复活与重生。
  - id: assassin_3_02
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 2
    text: “不老魔女”的寿命极长，甚至比很多途径的天使寿命还要长。
  - id: assassin_3_03
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 3
    text: 可以完美地呈现女性每一个阶段的魅力，并可以通过改变自己的皮肤状态、五官气质进行配合。
  - id: assassin_3_04
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 4
    text: “瘟疫”的范围达到了十五公里，然后可以自行往外传播，但“瘟疫”的种类没有增加。
  - id: assassin_3_05
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 5
    text: 每根蛛丝都成为了“不老魔女”的手臂。
  - id: assassin_3_06
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 6
    text: 只要有实体媒介，诅咒不仅能对付目标，还可以影响其直系亲属，如果使用大型的、特殊的黑魔法，有关键的媒介和布置，诅咒有可能连天使都伤害到。
  - id: assassin_3_07
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 7
    text: 复活：“魔女”们每使用一次“镜子替身”，对应的“镜中人”就会死去一次，然后从本体再分裂出去，完成复活，而“不老魔女”若是死亡，将于“镜中人”身上复活归来。单纯只有本体或者“镜中人”死亡，对“不老魔女”来说，不再是真正的死亡，只相当于部分身体受伤，后续可以得到治愈。
  - id: assassin_3_08
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 8
    text: “不老魔女”的“镜中人”可以不止一个，能利用多面镜子组成的环境，让自身的镜中人短暂变成复数——只要有一个没死，“不老魔女”就不会真正死亡，又可以通过皮肤、血液、头发等媒介，制作一个沉睡于镜子中的“镜中人”，并将该面镜子藏于隐秘之处，置于反占卜状态，使对应的神秘学联系被切断，以防诅咒等伤害波及沉睡的那个“镜中人”。魔药完全消化的状态下，可以分离出来做特殊隐藏的“镜中人”增加到了两个。
  - id: assassin_3_09
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 9
    text: 恢复青春：每一次照镜子，都会在镜中世界留下一定痕迹，晋升“不老”后会显现出来，可以选择其中一个自己，固定于当时的状态，而且不管选择了哪个状态，最终都必然女性化。
  - id: assassin_3_10
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 10
    text: 石化：真正拥有了“石化”的能力，不再必须经由头发的触碰，但还不能凭空作用于目标，要么从身边开始，一寸寸向外石化，最终蔓延到敌人处，将他覆盖，要么借助“魔女”的蛛丝来传递对应的力量。如果展现出不完整神话生物形态，头发会变成一条条毒蛇，每条毒蛇头部都有一只黑白分明的眼睛，被这些眼睛看到的，可以凭空石化。
  - id: assassin_3_11
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 11
    text: 对镜中世界的利用：
  - id: assassin_3_12
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 12
    text: · 能掌控十五公里范围内的镜子和曾经去过的那些。
  - id: assassin_3_13
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 13
    text: · 眼睛已经相当于一面镜子，被“不老魔女”看到的，都可以成为诅咒的目标，还可以借助眼睛这个媒介和自身的“镜中人”化，直接进入镜中世界。
  - id: assassin_3_14
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 14
    text: · 可以将位格低于自身的人强制拉入镜中世界，而他们不会有任何察觉，对于位格高于或等于自身的圣者、天使，能不能成功、会不会被发现取决于对方状态，还可以将一栋房屋甚至一条街都拉入镜中世界，具体拖入什么由自己决定，不是必须以一个整体来完成。
  - id: assassin_3_15
    pathway: assassin
    seq: 3
    sequenceTitle: 不老
    order: 15
    text: · 可以通过镜中世界直接传递力量，结合“镜像投影”，可以借助有定位的镜子在城市里任何一个地方降临，展现威能，这种“镜像投影”附加的力量不能超过序列4，所有的“镜像投影”都无法离开对应镜子的映照范围。
  - id: assassin_2_01
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 1
    text: 拥有天灾领域的能力，比如暴雪、洪水、海啸、地震。
  - id: assassin_2_02
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 2
    text: 复活：在魔药还没有初步消化的情况下，就已经能再制作三面沉睡镜子。
  - id: assassin_2_03
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 3
    text: 灾难：不仅包括天灾，还涵盖了人祸，甚至能指向部分权柄和一些抽象概念。
  - id: assassin_2_04
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 4
    text: · 除了暴雪、海啸、地震、陨石、洪水、火山爆发、镜中世界坍塌等自然灾害可以通过对应能力制造出来，列车事故、房屋垮塌、马匹撞人、枪支走火等存在于人类社会秩序里或机械造物上的灾难性事件也在“灾难魔女”的领域。
  - id: assassin_2_05
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 5
    text: · 同时，在延伸到权柄和概念之后，“灾难”还能定义成通过诱导问题爆发或制造某些问题，让原本稳定存在的系统崩解。这种情况下，若一个非凡者本就状态不稳，“灾难魔女”能诱导他失去平衡，当场失控，对目标来说，这无疑是一场灾难。
  - id: assassin_2_06
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 6
    text: · 在破坏稳定引发灾难这件事上，“灾难魔女”与猎人最大的区别是，“猎人”打击弱点是从外到内，“灾难魔女”则是从内到外，或者内外联动。
  - id: assassin_2_07
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 7
    text: · “灾难魔女”可以将非凡者、将一片区域、将自然环境当成一栋建筑、一个系统，引爆它们暗藏的问题，让它们遭遇灾难性的崩解。
  - id: assassin_2_08
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 8
    text: 诅咒：能在命运上进行诅咒，可以制造物品或留下一段话语，在没有直接接触目标的情况下，让碰见物品或听见话语的对方于后续生活里遭遇一场又一场灾难。
  - id: assassin_2_09
    pathway: assassin
    seq: 2
    sequenceTitle: 灾难
    order: 9
    text: 疾病：制造的病原体能侵蚀和影响完整神话生物的躯体。
  - id: assassin_1_01
    pathway: assassin
    seq: 1
    sequenceTitle: 末日
    order: 1
    text: “末日”权柄：“末日”和“灾难”皆属于“混沌”的下位权柄，“末日”可以在指定区域内，带来完整的末日，让包括命运在内的万事万物纠缠终结，是矛盾的总爆发，这是“灾难”无法比拟的，简单来说就是，“灾难”的重点是不同的灾难表现形式，而“末日”的重点是最终结果的到来——“混沌”代表最终的结果。
  - id: assassin_1_02
    pathway: assassin
    seq: 1
    sequenceTitle: 末日
    order: 2
    text: “欢愉”权柄：这是“魅力”权柄的下位，让人沉沦的极致欢愉本身就是极致“魅力”的一部分，而欢愉过后的极端空虚和痛苦让这样的魅力更无法抗拒，在欢愉中流泪，在欢愉中升华，也在欢愉中死去，这何尝不是一种末日？
  - id: assassin_1_03
    pathway: assassin
    seq: 1
    sequenceTitle: 末日
    order: 3
    text: 一部分“疾病”权柄：掌握的不再仅仅是神秘学病原体，而是所有通往疾病的东西。
  - id: assassin_1_04
    pathway: assassin
    seq: 1
    sequenceTitle: 末日
    order: 4
    text: “黑焰”是“混沌”权柄的一部分，“冰霜”是“灾难”权柄的一部分。
  - id: assassin_1_05
    pathway: assassin
    seq: 1
    sequenceTitle: 末日
    order: 5
    text: “镜中世界”：可直接利用镜中世界的力量和特殊，可迅速置换现实和镜像。
  - id: assassin_0_01
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 1
    text: 【神国】：与镜中世界息息相关，神国只有雌性能够存在，哪怕别的真神进入，也会染上明显的女性特征。在神国内看到不该看见的会立刻变成石像；若无庇护，将频繁遭受与自身相关的灾难；时不时会凭空享受到极致的欢愉，舍不得离开。
  - id: assassin_0_02
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 2
    text: “混沌”权柄：核心权柄，万物归于混沌、复返原初的权柄，它是毁灭和终结象征的分支，是不同于死亡、永暗、衰弱、败亡、杀戮、破碎的终结方式。
  - id: assassin_0_03
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 3
    text: · “灾难”会造成一个系统的整体性崩溃，“末日”让这种灾难性的崩溃加深为矛盾的总爆发，让万物纠缠归一，“混沌”则代表归一的“一”，代表总爆发后的结局。所以，“混沌魔女”的“混沌”不能直接使用在相对稳定和平衡的目标身上，必须先于指定的区域制造灾难性的崩溃，让矛盾总爆发，形成实质上的混沌漩涡，然后才能扩散往外，影响目标，而混沌漩涡能把卷入的事物融化为多种还未发生的可能性之一。
  - id: assassin_0_04
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 4
    text: “原初”权柄：混沌是结束，原初则是开始，作为最初造物主的阴性面，“原初魔女”同时拥有着开始和结束方面的权柄，而这两者在某种程度上又是相同的，等到造物主层次，会融为一体，而目前阶段，序列0的“原初”权柄代表着静止，代表着停滞，代表着全能，下位权柄是“石化”等。
  - id: assassin_0_05
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 5
    text: “镜中世界”权柄：掌控与镜子相关的一切以及延伸出来的各种能力，包括不老和复活——除非毁灭所有的镜中世界，否则没法真正杀死原初魔女。
  - id: assassin_0_06
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 6
    text: “魅力”权柄：概念层面的魅力，对万事万物都具有极致的，让人产生迷恋、不舍和占有欲的魅力，哪怕旧日，也会受到吸引，但如果该旧日对相关唯一性和序列1非凡特性有渴望，则占有欲会被动增强，达到疯狂想吃掉魔女融合魔女，从而永远在一起的程度——奇克疯掉后，该权柄的效果未能达到最佳。
  - id: assassin_0_07
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 7
    text: “女性”权柄：我及我之所见，皆为女性，若该权柄出问题，则全宇宙的相关性别皆会出问题。
  - id: assassin_0_08
    pathway: assassin
    seq: 0
    sequenceTitle: 魔女
    order: 8
    text: “原初”的下位“黑魔法”：是所有黑魔法的主宰，不管是什么黑魔法，面对原初魔女时都会失效，或在祂恩眷下得到增强和变化——任何偏邪恶黑暗堕落诅咒领域的法术都属于黑魔法，基于非凡特性直接施展的类法术能力不算，也就是说，“巫师”们在能利用知识直接制造相应法术效果前，自身偏邪恶黑暗堕落诅咒的那些巫术都算黑魔法，模仿出来的也算，而“倒吊人”途径靠非凡特性直接施展的阴影魔法、血肉魔法这些本质上属于类法术能力。
  - id: assassin_0_09
