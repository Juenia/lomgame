    text: “怨魂”的意识晶石
  - id: prisoner_0_30
    pathway: prisoner
    seq: 0
    sequenceTitle: 被缚者
    order: 30
    text: “怨魂”的血液100毫升或被“怨魂”污染产生的阴冷之水100毫升
  - id: prisoner_0_31
