    sequenceTitle: 灵巫
    order: 1
    text: 在灵的掌控上有了极大的提升，其实力的强弱，很多时候要看他们究竟能找到并驱使哪些亡者和自然灵，灵巫更擅长驱使自然灵，可以将自然灵与怨魂幽影封印于牙齿之上，并通过敲动牙齿将其释放，获得这些灵体的帮助，完成一心两用，甚至三用的配合，不同种类灵所擅长的都不一样；
  - id: sleepless_5_02
    pathway: sleepless
    seq: 5
    sequenceTitle: 灵巫
    order: 2
    text: · 灵巫能驱使的灵数量受制于本身灵体的强度，在这个阶段，最多只有四到五个；
  - id: sleepless_5_03
    pathway: sleepless
    seq: 5
    sequenceTitle: 灵巫
    order: 3
    text: 梦魇范围提升到两百米。
  - id: sleepless_4_01
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 1
    text: 越是黑暗的环境，实力越强，恢复速度越快，反之也成立，在正午阳光下会有不小的削弱，当然，这可以依靠“黑夜领域”来抵消；
  - id: sleepless_4_02
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 2
    text: 可以一定程度上给予别人厄运；
  - id: sleepless_4_03
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 3
    text: 非常擅长对付灵体类生物；
  - id: sleepless_4_04
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 4
    text: “发丝缠绕”：守夜人能像魔女一样制造并延伸出无数的发丝样细线，它们可以无形，仿佛从梦境中从黑暗里探出，也可以呈现出黑色，它们会给触碰者带来冰冷，让他们思绪飞快安静，整体变得宁和，彷佛不再想要抵抗，就这样在黑夜里沉眠，从这个能力可以隐约窥探出“不眠者”途径和“魔女”途径的互换性。
  - id: sleepless_4_05
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 5
    text: “安魂”得到质变，可以让某一处光芒突然不见，染上了最浓郁最深沉的黑暗，而黑暗之中，有吟唱诗歌的声音传出，安宁静谧，催人入眠，就连死灵、怨魂都因此变得缓慢，不再疯狂，仿佛获得了心灵的救赎。
  - id: sleepless_4_06
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 6
    text: “梦魇”范围提升至千米，可影响多个目标。
  - id: sleepless_4_07
    pathway: sleepless
    seq: 4
    sequenceTitle: 守夜人
    order: 7
    text: 能驱使的灵数量上升到牙齿的数量。
  - id: sleepless_3_01
    pathway: sleepless
    seq: 3
    sequenceTitle: 恐惧主教
    order: 1
    text: “黑暗之剑”：从黑暗深处抽出的一把布满奇异花纹的骨制长剑，它来自黑暗的赐予，结合了安眠和恐惧的力量，挥舞长剑可使黑暗涌动，象征着黑暗里的危险，象征着无声无息的毁灭与消逝，目标被涌动的黑暗淹没后，会受到黑暗力量的感染而直接消融，化为潮水的一部分，若不提前预防，避无可避，躲无可躲。
  - id: sleepless_3_02
    pathway: sleepless
    seq: 3
    sequenceTitle: 恐惧主教
    order: 2
    text: “恐惧灵光”：恐惧权柄的下位体现，直视“恐惧主教”或被对方主动施加影响，身心就会不由自主地颤栗起来，难以遏制，难以掩饰，极大地影响本身的状态，不够强大的非凡者甚至可能被直接吓死，或吓到失控、疯狂，基于此，“恐惧主教”在刚晋升，无法收敛本身恐怖灵光的情况下，最好不要出现在中低序列非凡者和普通人面前。
  - id: sleepless_3_03
    pathway: sleepless
    seq: 3
    sequenceTitle: 恐惧主教
    order: 3
    text: “梦魇世界”：创造一个梦境世界，将范围内的所有人都拉入里面，这可以影响一座小型城市。
  - id: sleepless_3_04
    pathway: sleepless
    seq: 3
    sequenceTitle: 恐惧主教
    order: 4
    text: 前面序列的能力也有很大提升。
  - id: sleepless_2_01
    pathway: sleepless
    seq: 2
    sequenceTitle: 隐秘之仆
    order: 1
    text: 具备隐秘的权柄（一定程度上），能让发生的一切都不会被窥见，也能将被隐秘的内容展现出来，对自身在历史孔隙里的影响也有一定程度的把握；
  - id: sleepless_2_02
    pathway: sleepless
    seq: 2
    sequenceTitle: 隐秘之仆
    order: 2
    text: 隐秘化：能让目标进入不会被外界感应到的“隐秘”状态（不管对方愿不愿意，都能让他们如橡皮擦擦掉一样）。在“隐秘”的状态里，看见的现实场景都是蒙着阴暗迷雾的，只能大致分辨所处的位置在哪里，周围的事物是什么，没法对外界施加影响，也很难被外界影响。在过去的影像被召唤后进入“隐秘”状态，则可让投影获得意识；
  - id: sleepless_2_03
    pathway: sleepless
    seq: 2
    sequenceTitle: 隐秘之仆
    order: 3
    text: 逆隐秘化：解除目标的“隐秘”状态。可通过与隐秘化的配合直接提取没有精神烙印的非凡特性。
  - id: sleepless_2_04
    pathway: sleepless
    seq: 2
    sequenceTitle: 隐秘之仆
    order: 4
    text: “隐秘之地”：自身隐秘起来的一片区域，可以通过隐秘化和逆隐秘化将目标直接封印到这里。
  - id: sleepless_2_05
    pathway: sleepless
    seq: 2
    sequenceTitle: 隐秘之仆
    order: 5
    text: 前面途径能力的提升，比如，“梦魇世界”可以影响一座大城市。
  - id: sleepless_1_01
    pathway: sleepless
    seq: 1
    sequenceTitle: 厄难骑士
    order: 1
    text: 力量、敏捷、体质、速度一如骑士之名，大天使层面的骑士；
  - id: sleepless_1_02
    pathway: sleepless
    seq: 1
    sequenceTitle: 厄难骑士
    order: 2
    text: “厄难”：给予敌人厄难——黑暗在“厄运”方面的权柄；
  - id: sleepless_1_03
    pathway: sleepless
    seq: 1
    sequenceTitle: 厄难骑士
    order: 3
