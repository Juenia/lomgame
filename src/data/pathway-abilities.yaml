  - id: assassin_8_02
    pathway: assassin
    seq: 8
    sequenceTitle: 教唆者
    order: 2
    text: 拥有对别人情绪、欲望和恶念的感知能力，提升了思考和分析能力。
  - id: assassin_8_03
    pathway: assassin
    seq: 8
    sequenceTitle: 教唆者
    order: 3
    text: 教唆：不说话，主动使用“教唆”能力可以让自己看起来更可靠，更让人亲近，也更容易让周围的人产生好感。如果配合恰当的说辞，就可以诱发目标心底的某些念头或欲望，让他们按照自己希望的那样做出选择，展开行动。
  - id: assassin_7_01
    pathway: assassin
    seq: 7
