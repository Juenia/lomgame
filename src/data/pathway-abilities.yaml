  - id: warrior_9_01
    pathway: warrior
    seq: 9
    sequenceTitle: 战士
    order: 1
    text: 超越常人的力量，超越常人的敏捷，各种武器防具精通，不存在无法使用的武器，各种格斗术掌握，不存在无法掌握的格斗流派。
  - id: warrior_8_01
    pathway: warrior
    seq: 8
    sequenceTitle: 格斗家
    order: 1
    text: 格斗方面的专家，能凭借身体减弱某些超自然力量带来的影响。
  - id: warrior_8_02
    pathway: warrior
    seq: 8
    sequenceTitle: 格斗家
    order: 2
    text: 比其他任何一个序列都擅长近距离的战斗，纯粹靠身体就能让一些针对他的非凡能力效果减弱。
  - id: warrior_7_01
    pathway: warrior
    seq: 7
    sequenceTitle: 武器大师
    order: 1
    text: 超强的力量，超强的体质，超强的敏捷，只要是武器，拿到手中，他就能以大师级水准使用，这包括非凡武器，或以剑、枪支等形式存在的神奇物品和封印物，并有效降低负面影响带来的伤害。
  - id: warrior_6_01
    pathway: warrior
    seq: 6
    sequenceTitle: 黎明骑士
    order: 1
    text: 拥有巨人般的力量，攻击力强，防御力较高，能让周围四五十米的范围内布满明净圣洁的晨曦，这些晨曦既可以破除幻觉，也具备一点点驱散怨魂幽影的特殊，甚至能削弱恶灵，消除偏负面偏邪恶的能量，但在神圣和光明领域，依然不如祈光人。除了面对怨魂幽影，神秘度很低，但可以净化环境中的神秘学病毒，减弱辐射，干扰电磁。
  - id: warrior_6_02
    pathway: warrior
    seq: 6
    sequenceTitle: 黎明骑士
    order: 2
    text: “黎明铠甲”：凝聚于体表，这相当于精炼的全身盔甲，却没有明显的重量，不会影响行动，如果被破坏，恢复需要一定的时间。
  - id: warrior_6_03
    pathway: warrior
    seq: 6
    sequenceTitle: 黎明骑士
    order: 3
    text: “光之风暴”：黎明骑士的最为强大的攻击，通过将“晨曦之剑”插入地面，让它崩解实现，那一片片晨曦般的光芒碎片，数之不尽，组成了闪烁而狂暴的锐利飓风，充满着毁灭意味，可以将笼罩区域内的所有阴影所有邪异切割成碎片。可直接摧毁人体，消灭怨魂，乃至创伤恶灵。虽然是范围型的攻击能力，但使用者可以一定程度上控制其方向。使用后短时间内无法凝聚出晨曦之剑。。
  - id: warrior_5_01
    pathway: warrior
    seq: 5
    sequenceTitle: 守护者
    order: 1
    text: 凭借其非凡能力对任何类型的怪物都能造成伤害；不被幻觉迷惑。
  - id: warrior_5_02
    pathway: warrior
    seq: 5
    sequenceTitle: 守护者
    order: 2
    text: 很少会受到伤害，单膝跪地，将巨剑插在身前，可浮现晨曦一样的光芒，在左右竖立起一面牢不可破的无形墙壁；可以帮一定范围内的同伴承担伤害，守护对方。
  - id: warrior_5_03
    pathway: warrior
    seq: 5
    sequenceTitle: 守护者
    order: 3
    text: 一旦转入守护状态，放弃攻击，高序列以下很少有谁能打破防御，各种类型的伤害都一样。
  - id: warrior_5_04
    pathway: warrior
    seq: 5
    sequenceTitle: 守护者
    order: 4
    text: 攻击的时候，相应的防御会降低不少，但也远强于精炼的全身盔甲。
  - id: warrior_5_05
    pathway: warrior
    seq: 5
    sequenceTitle: 守护者
    order: 5
    text: 其防御和黎明骑士相比，就像大人和小孩比体格和力量。能硬扛蒸汽步枪的子弹。在蒸汽时代的战争里，不被大口径的火炮集火，多半死不了。
  - id: warrior_5_06
    pathway: warrior
    seq: 5
    sequenceTitle: 守护者
    order: 6
    text: 之前序列其他能力的提升。
  - id: warrior_4_01
    pathway: warrior
    seq: 4
    sequenceTitle: 猎魔者
    order: 1
    text: 获得夸张的力量和介于神与人之间的精神。
  - id: warrior_4_02
    pathway: warrior
    seq: 4
    sequenceTitle: 猎魔者
    order: 2
    text: 能以带起飓风的高速奔跑。
  - id: warrior_4_03
    pathway: warrior
    seq: 4
    sequenceTitle: 猎魔者
    order: 3
    text: 无论“黎明骑士”还是“守护者”阶段的非凡能力都将获得质变般的提升：晨曦可以凝聚武器以外的物品；能在周围制造一片无形而坚固的防御之墙，每当它与大地相连，守护之力将难以撼动；守护还可以挡住灵界穿梭。
  - id: warrior_4_04
    pathway: warrior
    seq: 4
    sequenceTitle: 猎魔者
    order: 4
    text: 可以掩盖自身的行动和意图，有效干扰占卜和预言，让能够预知危险的目标无法察觉，是恶魔的克星。
  - id: warrior_4_05
    pathway: warrior
    seq: 4
    sequenceTitle: 猎魔者
    order: 5
    text: 擅长应对各种状况，拥有怪物、草药不同部位如何使用的知识，因此擅于发现不同怪物的弱点，辨识各种材料的用途，并能在特有的冥想模式下，针对前者，借助后者，调配制作出相应的神奇药剂、圣膏、精油和特殊印记，然后通过服食、涂抹、使用这些物品，达到雷击、冰冻、净化、燃烧、腐烂和驱邪等不同的超凡效果，有针对性地克制目标，所以正统猎魔者惯用双剑，以便让不同的油膏同时发挥作用，应对更多更复杂的局面。
  - id: warrior_4_06
    pathway: warrior
    seq: 4
    sequenceTitle: 猎魔者
    order: 6
    text: “猎魔之眼”：这并非真正意义上的眼睛方面的能力，而是泛指猎魔人依靠自我感官、精神勘察和丰富经验辨识目标性质、弱点、状态、是否被污染被附身的能力。当然，使用这种能力会让猎魔人左右眼分别出现一个墨绿色的复杂符号，许多资深的猎魔人甚至会利用这种能力判断目标是否在撒谎。对邪恶，堕落，被污染的痕迹敏感。
  - id: warrior_3_01
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 1
    text: 极为擅长正面战斗。
  - id: warrior_3_02
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 2
    text: 因祝福神灵的不同，各自会产生少量区别。
  - id: warrior_3_03
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 3
    text: 守护力量实质化成了银色全身盔甲，承受打击的能力比“巨龙”要强不少。
  - id: warrior_3_04
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 4
    text: “水银化”：整个人一下融化，变成了一滩流淌的银色的金属液体，能够飞快地移动以躲避攻击。也能变成粘稠沉重的水银淹没敌人，让对方似乎穿上了一具银色全身盔甲，没露出丝毫缝隙，想闷死穿戴者的银色全身盔甲。
  - id: warrior_3_05
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 5
    text: “晨曦之剑”：序列3层次的黎明骑士能力。不再只能维持较短时间，可以作为常规武器，足够锋利，擅长净化，一击就能撕裂小丘。
  - id: warrior_3_06
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 6
    text: “银白细剑”：拥有“传送(闪现)”的能力，可以绕过大部分屏障，直接攻击到目标，甚至从目标体内爆发，而且凝聚几乎没有征兆，很难提前预判。
  - id: warrior_3_07
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 7
    text: “借光隐藏”：又称借光躲藏。能够融入光芒，隐藏身影。
  - id: warrior_3_08
    pathway: warrior
    seq: 3
    sequenceTitle: 银骑士
    order: 8
    text: 前面序列其他能力的提升。
  - id: warrior_2_01
    pathway: warrior
    seq: 2
    sequenceTitle: 荣耀者
    order: 1
    text: 简化的“黄昏”对自己能让身体飞快老去，蒸发，然后于灵界重生，并恢复正常，穿梭离去；同样的，简化的“黄昏”也可以延缓自身的衰老；简化的“黄昏”还能于一击击之中让单个目标或范围群体逐渐老化，寿命降低，直至进入生命的倒计时，而衰老至死是绝大多数复活能力无法起作用的，所以，千万不要与“荣耀者”持久战斗。
  - id: warrior_2_02
    pathway: warrior
    seq: 2
    sequenceTitle: 荣耀者
    order: 2
    text: 简化的“战斗”权柄：“荣耀者”是最擅长正面战斗的序列2天使，其下位的“守护”在此阶段可以形成“牢笼”，除了防御，还获得封印的效果——这融合了“黄昏”的衰败之力。
  - id: warrior_2_03
    pathway: warrior
    seq: 2
    sequenceTitle: 荣耀者
    order: 3
    text: · 同样的，银骑士”的“银白细剑”的进阶为“黄昏巨剑”，能瞬间凝聚出一把由橘红色黄昏光芒组成的大剑，借助“黄昏”的时空相关，于目标站立的位置直接跳跃了出来，展现“战斗”权柄的下位“摧毁”。
  - id: warrior_2_04
    pathway: warrior
    seq: 2
    sequenceTitle: 荣耀者
    order: 4
    text: · 这也让“光之风暴”能化成可毁灭一片荒原的橘红风暴。
  - id: warrior_2_05
    pathway: warrior
    seq: 2
    sequenceTitle: 荣耀者
    order: 5
    text: 简化的“神圣”权柄：“荣耀”是“神圣”的一部分，死亡同样是生命最神圣最严肃的事情之一，所以，“荣耀者”的“荣耀”是晨曦，也是黄昏，是摧毁，也是净化。
  - id: warrior_1_01
    pathway: warrior
    seq: 1
    sequenceTitle: 神明之手
    order: 1
    text: 简化的“代行”权柄：和同领域的“衰败左手”一样，“神明之手”可代表自身所效忠的神明（唯一性也算）或旧日展现威能，降下神罚，当然，只能短暂和节制，否则会逐渐丧失心智，成为真正的“奴仆”。
  - id: warrior_1_02
    pathway: warrior
    seq: 1
    sequenceTitle: 神明之手
    order: 2
    text: 也正因为“神明之手”这个能力的存在，该序列无法获得其他权柄，只有之前序列能力的提升。
  - id: warrior_0_01
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 1
    text: 神国：黄昏之地
  - id: warrior_0_02
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 2
    text: 部分“神圣”权柄，“黄昏”权柄，“战斗”权柄（其有诸多下位权柄，比如“力量”、“巨大”、“摧毁”、“守护”等），部分“代行”权柄——永暗之河“奴役”象征在“巨人”途径的体现；
  - id: warrior_0_03
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 3
    text: “黄昏”权柄：“光”、“时空”与“衰败”三大象征共同衍化而来；
  - id: warrior_0_04
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 4
    text: · 能让物质与意志乃至虚空衰败、崩溃、消亡，散发出黄昏来临，万物衰败的气息；
  - id: warrior_0_05
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 5
    text: · 仅是存在本身，就让周围的物质连同虚空发生了弯折，使得所有的事物都难以自制地开始衰败；
  - id: warrior_0_06
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 6
    text: · 能让黄昏凝固，能让时间的流速放缓（凝固仅在黄昏环境可达成，但“巨人”本身可制造一定范围的黄昏）；
  - id: warrior_0_07
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 7
    text: · 能让目标飞快衰老、衰败、腐烂，能克制所有存在寿命极限者的复活（到了序列0，不再有能活多少年的概念，但序列0也会受影响而衰老，变得虚弱，只是不会因此而死亡）；
  - id: warrior_0_08
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 8
    text: · 能让靠目标出现失控征兆，越来越严重；
  - id: warrior_0_09
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 9
    text: · 能让目标越来越虚弱；
  - id: warrior_0_10
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 10
    text: · 能让“门”的成形与打开放缓；
  - id: warrior_0_11
    pathway: warrior
    seq: 0
    sequenceTitle: 黄昏巨人
    order: 11
    text: · 等等，等等。
