  - id: lawyer_9_01
    pathway: lawyer
    seq: 9
    sequenceTitle: 律师
    order: 1
    text: 拥有非常出色的口才和思辨逻辑，并能于一定程度上扭曲或引导目标的思维，令人感觉亲切，愿意相信。
  - id: lawyer_9_02
    pathway: lawyer
    seq: 9
    sequenceTitle: 律师
    order: 2
    text: 擅长发现并利用规则的漏洞和对手的薄弱之处，靠秩序打击对手，从而创造出利于自身的氛围，获得最终的胜利。
  - id: lawyer_8_01
    pathway: lawyer
    seq: 8
    sequenceTitle: 野蛮人
    order: 1
    text: 可怕的力量，很强的体魄，出类拔萃的精神方面的抵抗能力。不能依靠法律的，就用力量解决。
  - id: lawyer_7_01
    pathway: lawyer
    seq: 7
    sequenceTitle: 贿赂者
    order: 1
    text: 获得核心能力“贿赂”：通过给予目标实际或象征意义上的“贿赂”，产生各种效果。
  - id: lawyer_7_02
    pathway: lawyer
    seq: 7
    sequenceTitle: 贿赂者
    order: 2
    text: · 削弱：使用这种能力的前提是给予目标一定的事物，然后就能在一定时间内较大幅度削弱目标针对自身的攻击、防御或控制；
  - id: lawyer_7_03
    pathway: lawyer
    seq: 7
    sequenceTitle: 贿赂者
    order: 3
    text: · 魅惑：通过给予实际或象征意义上的“贿赂”，让目标产生强烈的好感，难以涌现敌对的意图，甚至不愿意与目标战斗，如果条件合适，受到贿赂者有极小概率反向攻击同伴；
  - id: lawyer_7_04
    pathway: lawyer
    seq: 7
    sequenceTitle: 贿赂者
    order: 4
    text: · 狂妄：通过给予实际或象征意义上的贿赂，让目标骄傲，狂妄，心智降低，出现错判；
  - id: lawyer_7_05
    pathway: lawyer
    seq: 7
    sequenceTitle: 贿赂者
    order: 5
    text: · 关联：通过给予实际或象征意义上的贿赂，让双方之间产生关联，建立起联系。
  - id: lawyer_6_01
    pathway: lawyer
    seq: 6
    sequenceTitle: 腐化男爵
    order: 1
    text: “扭曲”：通过扭曲目标的语言、行动和意图的含义，构建一定的有利于自身的秩序，从而达到限制或影响对手的目的，也能扭曲攻击的方向与目标。
  - id: lawyer_6_02
    pathway: lawyer
    seq: 6
    sequenceTitle: 腐化男爵
    order: 2
    text: “腐蚀”：能让周围十米内的人心灵一点点变得阴暗，变得贪婪，容易做出不理智的选择。
  - id: lawyer_6_03
    pathway: lawyer
    seq: 6
    sequenceTitle: 腐化男爵
    order: 3
    text: 身体素质的进一步增强。
  - id: lawyer_5_01
    pathway: lawyer
    seq: 5
    sequenceTitle: 混乱导师
    order: 1
    text: “混乱”：使锁定的目标或周围一定区域出现混乱，让攻击难以落到自己身上，让敌人容易选择错误，也能让距离的衡量标准混乱。
  - id: lawyer_5_02
    pathway: lawyer
    seq: 5
    sequenceTitle: 混乱导师
    order: 2
    text: “扭曲”：序列5层面的“腐化男爵”能力。除扭曲目标语言、行动和意图的能力加强外，还可以扭曲自身和目标的概念，使双方对半承担受到的伤害、诅咒、疾病等。
  - id: lawyer_5_03
    pathway: lawyer
    seq: 5
    sequenceTitle: 混乱导师
    order: 3
    text: 之前序列其他能力的提升。
  - id: lawyer_4_01
    pathway: lawyer
    seq: 4
    sequenceTitle: 堕落伯爵
    order: 1
    text: “赠予”：能直接将某种负面状态直接‘赠予’目标，让他或消极怠工，或贪婪急切，或丧失斗志，或只能将注意力放在金钱上。
  - id: lawyer_4_02
    pathway: lawyer
    seq: 4
    sequenceTitle: 堕落伯爵
    order: 2
    text: “利用”：可以让某种状态保持更长时间或提前结束，让规则更有利于自己，举个例子来说就是，他跳到半空后，可以将离开大地这种状态延长，达到漂浮的效果。
  - id: lawyer_4_03
    pathway: lawyer
    seq: 4
    sequenceTitle: 堕落伯爵
    order: 3
    text: “放大”：作用是增强自身某些行为的效果或影响，它可以让普通的一击变成“处决”，可以让隔着一段距离的空气拥抱变成束缚，但是一次只能放大一个。也能将神奇物品的负面效果放大。
  - id: lawyer_4_04
    pathway: lawyer
    seq: 4
    sequenceTitle: 堕落伯爵
    order: 4
    text: “混乱”：序列4层面的混乱导师能力。会影响事物的结构、尺度的标准和攻击的精度，让看似庞大的建筑轰然倒塌，让明明遥远的距离缩短到几步之间，让瞄准自身的打击偏向一边
  - id: lawyer_4_05
    pathway: lawyer
    seq: 4
    sequenceTitle: 堕落伯爵
    order: 5
    text: “扭曲”：序列4层面的腐化男爵能力。扭曲目标的语言、行动、意图和攻击的效果，让致命创伤变成重伤，让打击变成推开，让前进变成后退，让逃跑变成冲锋。
  - id: lawyer_3_01
    pathway: lawyer
    seq: 3
    sequenceTitle: 狂乱法师
    order: 1
    text: 部分“阶层”权柄和一定的“混乱”权柄。
  - id: lawyer_3_02
    pathway: lawyer
    seq: 3
    sequenceTitle: 狂乱法师
    order: 2
    text: 源于“阶层”权柄的“上位者”：威严来源于“名义”，来源于阶位，来源于实力，已可以实质化为一种武器，“狂乱法师”哪怕嗓音，也能让灵体颤抖，让下位者感受到一种强大的压迫力，身不由己就要听从命令，抬不起脑袋。
  - id: lawyer_3_03
    pathway: lawyer
    seq: 3
    sequenceTitle: 狂乱法师
    order: 3
    text: 来源于“混乱”权柄的“狂乱”：狂乱波动之中，“狂乱法师”本身的能力会出现一些随机性变化，而这往往是有益的，他敌人的能力也会受到影响，变化则往往是不利的，当然，不管是有益还是不利，“狂乱法师”自己也无法预测具体是什么效果。
  - id: lawyer_3_04
    pathway: lawyer
    seq: 3
    sequenceTitle: 狂乱法师
    order: 4
    text: 之前序列其他能力和特质的提升，比如“扭曲”：能直接扭曲炮弹的轨道。能扭曲并强化目标的前行意图，让其无法停止。
  - id: lawyer_2_01
    pathway: lawyer
    seq: 2
    sequenceTitle: 熵之公爵
    order: 1
    text: 部分“混乱”权柄，这衍化出了“熵”这个能力。
  - id: lawyer_2_02
    pathway: lawyer
    seq: 2
    sequenceTitle: 熵之公爵
    order: 2
    text: “熵”：与熵之公爵战斗越久，自身能力、思维和状态越是随机，越是混乱，无法把控，最终变成一团糨糊，陷入奇怪的寂灭状态；“熵”的目标可以是敌人，也可以是环境、规则等。
  - id: lawyer_2_03
    pathway: lawyer
    seq: 2
    sequenceTitle: 熵之公爵
    order: 3
    text: 部分”利用“权柄：对规则的利用强化到了能直接从地面跳到红月上的程度。
  - id: lawyer_2_04
    pathway: lawyer
    seq: 2
    sequenceTitle: 熵之公爵
    order: 4
    text: 之前序列其他能力的提升，比如“上位者”。
  - id: lawyer_1_01
    pathway: lawyer
    seq: 1
    sequenceTitle: 弑序亲王
    order: 1
    text: 部分“扭曲”权柄和部分“定义”权柄。
  - id: lawyer_1_02
    pathway: lawyer
    seq: 1
    sequenceTitle: 弑序亲王
    order: 2
    text: “弑序亲王”通过重新“定义”和借此“扭曲”的方式让原本的秩序有利于自身、达到自身想要的目的：比如，定义什么“替身”，什么是“本体”，什么行为叫“贿赂”。什么人是“腐败者”，让本体瞬间变成替身，让正常的行为变成贿赂，等等，等等，而“扭曲”能借此直接扭曲相应的秩序和规则（非底层）。
  - id: lawyer_0_01
    pathway: lawyer
    seq: 0
    sequenceTitle: 黑皇帝
    order: 1
    text: 核心是“秩序阴影”象征下的“独裁者”权柄，另外还有大部分“混乱”权柄。
  - id: lawyer_0_02
    pathway: lawyer
    seq: 0
    sequenceTitle: 黑皇帝
    order: 2
    text: “独裁者”权柄下位有“扭曲”、“利用”、“定义”、“阶层”等权柄，除了“阶层”权柄，其他本质上都是依托于秩序，通过利用秩序的漏洞或扭曲秩序的本意，让秩序为自己的目的服务，而“死亡”是现实秩序最底层最核心的一部分，这也就是“黑皇帝”能够复活的原因。
  - id: lawyer_0_03
    pathway: lawyer
    seq: 0
    sequenceTitle: 黑皇帝
    order: 3
    text: 大部分“混乱”权柄：不再是秩序的寄生虫、解释者、扭曲者，脱离秩序，让秩序和规则本身都陷入混乱。
  - id: lawyer_0_04
    pathway: lawyer
    seq: 0
    sequenceTitle: 黑皇帝
    order: 4
    text: 同样是在荒芜死寂的地方重建起可供人类生存的一整套秩序，“审判者”是依托原本的底层规则，重新书写一整套适合人类生存秩序，而“黑皇帝”是扭曲原本的规则，让它们适合人类，效果一样，实现方式不同。
  - id: lawyer_0_05
    pathway: lawyer
    seq: 0
    sequenceTitle: 黑皇帝
    order: 5
    text: 神国：秩序地狱或者伪法天堂。
