recipes:
  - id: seer_9
    pathway: seer
    seq: 9
    main:
      - { itemId: 主材料·灰雾结晶, qty: 1 }
    aux:
      - { itemId: 辅助材料·银粉, qty: 1 }
    ritual: 在无人打扰的暗处，用银粉画出一个圆，念三遍自己的名字
    base_success: 0.75
    cor_on_fail: 10
    mad_on_fail: 6

  - id: warrior_9
    pathway: warrior
    seq: 9
    main:
      - { itemId: 主材料·战火余烬, qty: 1 }
    aux:
      - { itemId: 辅助材料·圣盐, qty: 1 }
    ritual: 把余烬摊在圣盐上，直到它不再冒烟
    base_success: 0.75
    cor_on_fail: 9
    mad_on_fail: 7

  - id: sleepless_9
    pathway: sleepless
    seq: 9
    main:
      - { itemId: 主材料·夜之瞳, qty: 1 }
    aux:
      - { itemId: 辅助材料·月长石粉, qty: 1 }
    ritual: 整夜不睡，把月长石粉撒在门槛上，天亮前不许回头
    base_success: 0.72
    cor_on_fail: 11
    mad_on_fail: 5

  # ---------------- M2.19：水手（sailor，风暴之主）的序列 9 魔药 ----------------
  #
  # 只做序列 9 一份：这一轮的验收是「这条途径能被玩家走通」（.创建 → 调制 → 服用 → 入途径），
  # 而序列 9 是入途径那一瓶。序列 8 的配方（与它的主材料产出点）留给「让水手能升到 7」的那一轮。
  # 三条数值照抄现有三条的量级（base_success 0.72—0.75 / cor 9—11 / mad 5—7），
  # 没有新的调参口径。
  - id: sailor_9
    pathway: sailor
    seq: 9
    main:
      - { itemId: 主材料·海盐结晶, qty: 1 }
    aux:
      # 复用现有的辅助材料（圣盐）：调制魔药的辅料是通用的
      - { itemId: 辅助材料·圣盐, qty: 1 }
    ritual: 把海盐结晶碾碎化进一碗海水里，端着它面朝外海站到风把水吹凉为止
    base_success: 0.74
    cor_on_fail: 10
    mad_on_fail: 6

