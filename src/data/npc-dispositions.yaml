# NPC 立场与性情（M2.85 RPG 化）
#
# 用户拍板的两条：
#
#   ① 「强大的对立高序列者甚至可以算计玩家或者 NPC，可以布局做出一些阴谋，类似阿蒙算计克莱恩」
#
#   ② 「玩家行为可能交恶或者交好 NPC；交恶则可能被厌恶，更黑暗向的 NPC 会对玩家不利；
#
#       交好的 NPC 可能在某个时刻帮助玩家，可能赠送符合他自己身份的物品」
#
# 所以这张表要回答三个问题：**他是哪种人**（temperament）、**他与谁对立**（hostilePathways）、
#
# **他手里有什么**（giftTier）。
#
#
# 读取点：npc_relations 的好感结算 + npc_schemes 的阴谋判定 + 场景里的态度描述。
meta:
  source: M2.85 RPG 化：**NPC 的立场与性情**（用户拍板「高序列对立者会算计玩家/NPC」「玩家行为会交恶或交好 NPC」）
  count: 41
  temperament_note: temperament 由**途径气质**派生（原著里不同途径的行事风格差别很大）：dark = 交恶时会主动算计；kind = 交恶时克制、交好时伸手；neutral = 按利害行事。
  hostile_note: hostilePathways 是**阵营对立**（原著里有明确对立的那些，例如错误途径 vs 愚者/门途径）。
  layer_note: ⚠️ 本表是**项目设计**（性情归类与赠礼档位是派生的）；npcId/name/sequence 来自 npc-tracks.yaml（原作记载）。
