# 堕落生物（M2.167）—— 人堕落之后**长成了什么**
#
# 用户口径：「NPC 堕落了应该堕落成非凡生物，会袭击人，教会组织等正神的组织会去清理堕落者。」
#
# ## 这张表与另外两张表的分工（不许有第二份清单）
#
#   src/cards/lost-control.yaml 的 forms    **形态**：这个途径的人失控之后长成什么样（44 条：22 途径 × 2）
#   src/data/creatures.yaml                 **自然物种**：灰雾游魂、时序蠕虫 —— 它们本来就活在那儿
#   src/data/fallen-beasts.yaml（本表）      **由人变成的东西**：形态 → 它的强度 / 掉落 / 行为 / 感知
#
# ⚠️ 本表**不重复**形态清单：只写 formId 引用 forms 里的那一条，
#    途径 / 形态名 / min_seq 全部从那里派生。两份清单的下场是**安静地少读一半**（AGENTS §3.1）。
#
# ## 数值口径
#
#   baseSequence  变成生物之后的强度（越小越强）。运行时取 min(本人序列, 本值) ——
#                 序列 4 的人堕落，比序列 9 的人堕落更难缠。
#   baseHp        血量（与 creatures.yaml 同一量纲：25—220）
#   drops         【原作】怪物是魔药材料的来源（怪物与异变.yaml 第四节口径澄清）——
#                 所以掉落取该途径**最容易做的那份配方**的主材料（低序列材料，玩家拿得到）
#
# ## 感知五层（perception）必填 —— 语义见 domain/creature/perception.ts
#
#   blur        普通人看到的（他连那是什么都不知道）
#   silhouette  弱 1—2 级时看到的轮廓
#   full        同级时看清了是什么
#   advantage   强 1—2 级（占上风，看得出破绽）
#   essence     强 3 级以上（看透它的本质）
#
# ⚠️ 五层都要写：schema 要求全填 —— 少一层不是「降级显示」，是**加载期报错**。
#
meta:
