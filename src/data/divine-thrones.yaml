# 神座（M2.97）—— 二十二条途径的序列 0，现在坐着谁；祂们有什么、想要什么、会做什么
#
# ## 这张表要解决什么
#
# 原作里序列 0 是**唯一**的：一条途径只有一个真神的位置。而这个世界已经跑了几千年 ——
# 有的位置一直有人（七大正神），有的位置**空着**（第四纪末的苍白之灾、四皇之战打掉了好几个），
# 还有的位置正被人往上爬（克莱恩 → 愚者）。
#
# ## 「高智能」在规则引擎里怎么落（用户口径：「不是死板的那种」）
#
# 项目**不用 LLM**（vplayer/decide.ts 立的规矩：规则 + 权重 + 目标驱动，完全可复现）。
# 所以神的「智能」不是靠模型，是靠**四层结构**：
#
#   resources   有什么（教会 / 势力 / 封印物 / 天使 / 情报 / 财力 / 伸手够得到的城市）
#   goals       想要什么（决策时按它算「这一步值不值」—— 对不上目标的手段不会被选）
#   methods     能做什么（每一条都有代价、冷却与前提 —— 神不是无限的，只是很多）
#   responses   看到什么会改主意（玩家在祂的地盘挖封印物时，祂会**针对性**地动）
#   gaze        看向玩家的那一眼会做什么（注视 / 赐福 / 试探 / 警告 / 招募 / 降罚 / 神降）
#
# ⚠️ 前四层是「世界级」，最后一层是「个人级」—— 后者才是玩家能感觉到的部分。
# ⚠️ 每条 `gaze[].text` 是**第一人称的遭遇**，不是第三人称播报：玩家读到的应当是
#    「有什么东西把视线放在你背上」，不是「黑夜女神注视了你」。
#
# ⚠️ 两个 id 口径（M2.164 修掉的两个静默缺口，两者写错都**不报错**）：
#    · `resources.reach` 装的是 **cities.yaml 的城市 id** —— 不是地点 id。
#      写 `backlund_slum` 这类地点进去，那一处「够得到的城市」永远匹配不上，
#      决策引擎只会安静地按错的 reach 算（实测：3 处）。
#    · `resources.factions` 里允许哨兵值 `none`（无主 / 伸手够不到任何势力）——
#      它不是任何一张表里的 id，所以校验必须显式放行（实测：12 处）。
#
# 数据来源：诡秘之主原作数据/01-途径与序列/途径总表.yaml（序列 0 称号 / 对应神明 / 可信度）
#           + 04-神明与教会（状态）+ npc-tracks.yaml（正在往上爬的那位）

divine_thrones:
