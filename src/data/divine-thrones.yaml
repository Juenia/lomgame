    responses:
      - { when: player_digs_sealed, prefer: close_bishop, weight: 3 }
      - { when: rival_gains_followers, prefer: erase_record, weight: 2 }
    gaze:
      - { when: player_digs_sealed, act: warn, text: 你挖到第三下的时候，风停了。有什么东西把视线放在你背上，不重，但一直没移开。, effect: {}, weight: 3 }
      - { when: player_uses_secret, act: gaze, text: 你没有做错什么。只是从某一刻起，你确定有人在看你。, effect: {}, weight: 2 }
      - { when: player_high_sequence, act: recruit, text: 有人在你门口放了一枚银牌。背面刻着一半的月亮 —— 那是邀请，不是礼物。, effect: {}, flag: faith_night, weight: 2 }
