      angels: 3
      intel: 5
      wealth: 4
    goals:
      - { id: keep_secrets, text: 让该被埋住的东西继续埋着, weight: 3 }
      - { id: stop_keys, text: 不让任何人凑齐通往愚者的钥匙, weight: 2 }
    methods:
      - { id: erase_record, text: 抹掉一段记录 —— 连同记得它的人那一小段记忆, broadcast: 今天有人翻出一份旧档案，翻到一半发现那几页是空的。, scope: city, goal: keep_secrets, cost: { intel: 1 }, cooldown_hours: 24, needs: [ intel ] }
      - { id: send_dream, text: 让某个人做一场梦，梦里他自己把话说了出来, broadcast: 今天所有人醒来时都比平时安静，像是刚跟谁谈过。, scope: world, goal: keep_secrets, cost: { angels: 0 }, cooldown_hours: 12, needs: [] }
