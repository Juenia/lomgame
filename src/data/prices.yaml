# 物价锚点与派生定价规则
#
# 这个文件回答一个问题：**一件东西该卖多少钱？**
#
# 它是**两层**的，而且必须分开看（AGENTS 三条禁令的第 2、3 条）：
#
#   ① `anchors` —— **原作直述的价格**，逐条带章节号。这些数字一个字都不许改。
#   ② `rules`   —— **项目派生的定价规则**，用来给原作没给价的东西定价。
#
# ⚠️ **派生值不是原作数据。** 原作的 `anchors` 里没有「序列 8 的材料值多少」这一条，
#    那是本项目按锚点推出的。所以 `rules` 的每一项都要写清「从哪条锚点推的、怎么推的」，
#    并且**不许**在任何面向玩家的文案里说它是原作设定。
#
# 采集来源：`诡秘之主原作数据/11-文化与生活/货币与经济.md`（腾讯书城第 1–130 章精读）
#          `诡秘之主原作数据/09-物品与封印物/货币.yaml`（萌娘百科交叉验证）
#
# 换算（原作 ch4、ch26 逐字，可信度最高）：
#   1 金镑 = 20 苏勒 = 240 便士
#   1 苏勒 = 12 便士
#
# ⚠️ 注意「三层十进制」这个说法是**错的**（本仓库 numeric.ts 里曾有这个词）：
#    12 便士 = 1 苏勒 是**十二进制**。240 这个总数对，但「十进制」描述错了。
meta:
  source: 诡秘之主原作数据/11-文化与生活/货币与经济.md
  verified: 腾讯书城《诡秘之主》第 1–130 章逐字；换算关系经萌娘百科交叉验证
  unit: 便士（最小单位，整数存储）
  note: 世界已进入纸币与硬币并行的蒸汽时代；金镑金币在市面已很少流通

