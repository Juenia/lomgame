# ---- 按序列的倍率（材料 / 魔药 / 封印物共用）----
#
# ⚠️ 这一节在**顶层**，与 anchors / rules / exchange 平级（不是 rules 数组里的一项）。
#    第一版缩进了两格，YAML 当场报「All mapping items must start at the same column」。
sequenceMultiplier:
  basis: 派生规则。原作只给了两个点（序列 9 的制符材料 420 便士、高位物品 2,400,000 便士）， 取 9 档到 1 档共 8 级、总倍率约 5700，按 ×3 递推得 3^8 = 6561 —— 与两个锚点的比值同量级。
  note: 3 是一个「手感」值：太低则序列差距在价格上看不出来，太高则序列 1 的材料贵到没有意义。
  factor: 3
  from: 9

# ============================================================
# 二·五、封印物按封印等级定价（从代码里搬出来的）
# ============================================================
#
# 这组数字原来硬编码在 `router/commands/equipment.ts` 里：
#
#     const PRICES = { '0': null, '1': 500, '2': 200, '3': 60, unrated: 30 };
#
# 搬到这里有两个理由：
#   ① AGENTS §3.3 —— 调价是运营动作，不该需要改代码；
#   ② 它和上面那些价格**必须放在一起看**，否则「一件等级 1 封印物 500 便士」
#      这个数字跟「双筒猎枪 480 便士」的对照关系就没人看得见。
#
# ⚠️ 数值**原样搬过来，一个没改**（改动价格的依据不充分时就不改）。
#    它们是项目值，不是原作数据 —— 原作没给封印物的市场价格。
#
# 校正参照（用来判断这组数字合不合理）：
#   等级 3（60 便士 = 5 苏勒）—— 比一根胡桃木手杖(123)便宜，比一顿饭(7)贵得多
#   等级 2（200 便士）—— 略高于一件皮靴(114)，低于猎枪(480)
#   等级 1（500 便士）—— 与双筒猎枪(480)同档
#   等级 0（null）—— **买不到**。这是有意的：顶级封印物不该出现在货架上
sealLevelPrice:
  basis: 项目值（从 equipment.ts 搬来）。原作未给封印物的市场价格， 但给了一把左轮 840 便士、一支猎枪 480 便士 —— 这组数字相对它们是合理的。
  prices:
    '0': null
    '1': 500
    '2': 200
    '3': 60
    unrated: 30

# ============================================================
# 三、汇率（原作直述）
# ============================================================
exchange:
