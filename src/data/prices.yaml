# ============================================================
#
# `priceOf` 的第一个参数**本来就是「查锚点的键」**，所以这里可以直接写物品 id。
# 需要它的场合：某个物品**不能按 kind 一刀切** ——
#   · 「无名者骨牌」是 trinket，但它不是杂物，按 3 便士卖等于白送；
#   · 「海盐结晶」是 material，但它是矿盐不是非凡材料，按 420 卖凡人买不起。
#
# ⚠️ 这些都是**项目派生值**（原作没给这些具体物品的价），依据写在每条 basis 里。
