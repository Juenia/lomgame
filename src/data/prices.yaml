# ============================================================
# 二、派生定价规则（**项目定的，不是原作**）
# ============================================================
#
# ⚠️ 有**两类**物品刻意不在这里定价：
#   · `currency`（货币本身）—— 它的「价」就是面值。`priceOf` 返回 0，
#     调用方（`.买` / `.卖`）必须显式拒绝买卖货币，而不是靠这里给个数字。
#   · 不在任何规则里的新 kind —— `priceOf` 返回 0 且 `basis` 写明「没有规则」。
#     **这是有意不猜**：给一个「看着合理」的兜底价会安静地污染整套经济。
#
# 每一档都写明「从哪条锚点推、怎么推」，方便以后有人质疑时能倒推回去。
rules:
  - kind: consumable
    label: 消耗品（食物、饮品）
    penny: 6
    basis: 锚点 beef_1lb(6) / lunch_cheap(7) / bread_retail(9) 的中位数附近
    note: 一顿饭的钱。玩家一天吃三顿也就 18 便士 —— 对照码头零工日薪约 6 便士，这是「糊口」的尺度
  - kind: trinket
    label: 杂物（报纸、小物件、纪念品）
    penny: 3
    basis: 锚点 newspaper(1) 与 beer_rye(1) 之上取一档
    note: 比一杯酒略贵，仍然是最便宜的一档
  - kind: clothing
    label: 服饰与配件
    penny: 120
    basis: 锚点 shirt(36) / hat_silk(60) / cane_waterwood(90) / cane_ironwood(139) / boots(114) 的中位数
  - kind: tool
    label: 工具与器材
    penny: 180
    basis: 服饰档(120)与武器档(480)之间；原作未给单件工具价
  - kind: weapon
    label: 普通武器（凡人可合法持有的）
    penny: 480
    basis: 锚点 shotgun_double(480) 直接取用 —— 火器是半管制商品（鲁恩热武器半管制政策）
    note: 左轮(840) 更贵是因为含 6 发子弹；本档按猎枪的下限定
  - kind: material
    label: 非凡材料（按序列分档）
    penny: 420
    basis: 锚点 ritual_materials(420) = 1 镑 15 苏勒，这是**序列 9 那一档**
    note: 序列每提升一级（9→8→…→1），价格 ×3 —— 见 sequenceMultiplier
  - kind: potion
    label: 魔药（成品）
    penny: 630
    basis: 派生规则。一份魔药要「主材料 + 辅助材料」各一份（`recipes` 表）， 而序列 9 的材料档是 420 便士 → 两份成本约 840 便士； 成品按成本的 75% 定价（调制有失败风险，steam 玩家要为此获得折扣）。 420 × 1.5 ≈ 630 —— 取整到 630。
    note: 成品比材料便宜是**有意的**：它奖励「自己调」，而不是「买现成」。 序列倍率同样适用（见 sequenceMultiplier）。
  - kind: artifact
    label: 封印物 / 非凡物品
    penny: 2400
    basis: 序列 9 材料(420) 的约 6 倍；**高位**物品另有 artifact_high 锚点(2,400,000)
    note: 低序列封印物与高位物品之间差了三个数量级，这不是笔误 —— 原作里非凡物品的价值就是断崖式的

# ============================================================
