# 扮演文案（M2.56）：玩家在 .扮演 菜单里看到的那句话。
#
# ## 为什么是「一条一行」而不是按途径嵌套
#
# 原来它是 pathways: { seer: { 占卜: ... } } —— 嵌套 map。那样人读着顺，
# 但**管理后台的数据编辑器只认记录数组**（file + rootKey + idKey + fields），
# 嵌套 map 装不进去，等于这批文案永远只能在代码里改。
# 摊平成一条一行之后，后台能按途径筛、能搜、能改，而且给字段加规则也有了落点。
#
# ## ⚠️ 一条硬规则：text 里必须出现它自己的 tag
#
# 判定层（domain/play/score.ts）算消化度用的是**关键词包含匹配**：玩家扮演时说的
# 那句话里出现了哪个标签词，就按那个标签算分。所以 text 里没有「占卜」两个字，
# 玩家选了这条**不会涨消化度** —— 菜单就成了骗人的。
#
# 而这不会报任何错。这条规则由两处守着：
#   · loader（data/loader.ts 的 loadTagPhrases）—— 内容表坏了服务起不来；
#   · 后台（admin/schema.ts 的 mustContainField）—— 编辑时当场拒绝保存。

# id = 途径.标签。**这个组合必须唯一** —— 后台按它定位这一条；
# 单用标签词做 id 会撞（mother.守夜 与 perfect.守夜 是两条不同的文案）。
