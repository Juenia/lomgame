#
# ⚠️ 这一版是**用户的纠正**之后重做的：
#
#   「装备其实就是非凡物品啊，装备上去有增幅，但也有 debuff」
#
# 第一版做的是「制式短刀（序列 9）」那种普通武器 —— 那不是非凡物品。
#
# 原著的规则（见 09-物品与封印物/物品等级与规则.md）写得很清楚：
