#   「神奇物品……有强大能力的同时**必然**会具备副作用」
#
meta:
  source: M2.85 RPG 化 B（重做）：**装备其实就是非凡物品**
  count: 108
  note: ⚠️ 用户纠正：「装备其实就是非凡物品啊，装备上去有增幅，但也有 debuff」—— 第一版做的「制式短刀」是普通武器，不是非凡物品。这一版全部改用原作的**神奇物品 / 封印物**。
  origin: 条目逐条来自 诡秘之主原作数据/09-物品与封印物/封印物.yaml 与 非凡物品.yaml；**名字、能力、副作用都是原文**。
  debuff_note: 副作用分两部分：**negativeEffects 是原文**（如「每隔一天就必须用一个活人的灵魂和血肉满足它，否则会用持有者来代替」）；**debuffs 是项目派生的数值**（madPerUse 每次使用掉理智 / corGain 腐蚀 / hpDrain 每回合掉血 / statPenalty 属性惩罚），按封印等级给：0 级最重。
  level_note: 封印等级沿用原作的 0/1/2/3 级 + 未评级。等级越高（0 级）增幅越大、代价也越重 —— 这正是原著的规则。
