# 封测公告要点（.帮助 公告 与 docs/封测公告.md 共用这一份来源）
phase: 第一阶段封测（W6）
schedule:
  - 报名与拉群：Day 0
  - 封测期：Day 1 — Day 7（每日出一份日报）
  - 复盘与 M2 决策：Day 8
scope:
  - 只开放 3 条途径：愚者、战士、不眠者
  - 只开放序列 9 → 8 的晋升链路
  - 开放探索、魔药、服用、休息、净化、占卜、组队与队伍任务、玩家间交易
not_included:
  - 不做 PVP、不做拍卖与组织玩法
  - 不做序列 7 以上内容
  - 不做实时战斗（异步回合排在 M2）
  - 不承诺数据不重置、不承诺全还原原著
service:
  - 客服 QQ：{{客服QQ}}（工作日 10:00—22:00）
  - 备用群：{{备用群号}}（主群异常时迁移）
  - 反馈：群内 .反馈 内容，或私聊客服
known_issues:
  - 数值刚由 1000×30 模拟定稿，平衡仍可能有偏差
  - 频道（子频道）消息未实测，仅群聊与私聊保证可用
  - 官方机器人仍在审核，内测使用第三方框架，存在封号风险
