# 神与神的关系网（M2.169）—— 神明阴谋的依据
#
# 为什么需要这张表：M2.169 的阴谋要回答「**谁能对谁下手**」。
# 没有它，世界级阴谋就会随机发生在一个毫无缘由的目标身上 —— 那不是神，那是掷骰子。
#
# 三种边：
#   ally   盟友     —— 可以联手（神战中那两位就是这么做的）
#   rival  水火不容 —— 可以对下手（无向：两边都能下手）
#   covet  觊觎其位 —— **邪神对正神**的那一条。⚠️ **有向**：a 觊觎 b
#
# ⚠️ 两端的 id 是**途径 id**（与 divine-thrones.yaml 的 pathway 同一口径），不是教会 id。
# ⚠️ 每条都要有 id（唯一）与 source —— 一条途径会出现在好几条边里，所以 `a` 不能当主键。
meta:
  source: 诡秘之主原作数据/04-神明与教会/七正神.yaml + 06-历史/世界大事年表.md
  count: 9
  layer_note: 关系是【原作】直出（「长期结盟」「水火不容」「联手暗算」都是原文）；covet 那一组是【设计】—— 原作没写祂们具体觊觎谁，但写了祂们是隐秘存在。
  covet_note: ⚠️ covet 边**有方向**：写在前面的 a 觊觎后面的 b。反过来不成立（那一位另有打算）。
divine_relations:
