  # ================= M2.13：封印物（12 件） =================
  # 依据标记：`M2.13 依据`。三类的分工、掉落率与使用代价见 config/numeric.ts 的 NUMERIC.extraordinary。
  #
  # ## id 前缀（任务书 §六 的命名约定）
  #   wonder_*  神奇物品 —— **被动**生效（在背包里就管用），掉落率 0.5% / 1% / 3%
  #   sealed_*  封印物   —— **主动**使用（.使用），有严重代价，掉落率 0.1% / 0.3% / 1%
  #   charm_*   符咒     —— 一次性，掉落率 2% / 4% / 8%
  # 前缀不是装饰：它同时是 `type` 字段的取值，报告里的「按类型统计」直接按它分组。
  #
  # ## 两条必须写清楚的边界
  #
  # 1. **与 M2.9 的三件老符咒不是一回事。** 符咒·灼烧 / 净除 / 定身 是**战斗专用消耗品**
  #    （`battle` 字段：对生物的直接伤害 / 清状态 / 定身），它们只在打起来的时候有意义。
  #    M2.13 的 `charm_*` 是**背包里的一张一次性牌**（走 `.使用`，走 `effect`）。
  #    把两者并进同一个 `type` 会让「符咒」这一个词指两样东西。
  #
  # 2. **全部可交易。** 封印物是**非绑定物品**（掉落时给 `unbound`）——
  #    「序列 9 的玩家找序列 7 的玩家买封印物」是这一轮想要的社交入口（任务书 §5.5）：
  #    序列 9 的人进不去 `min_seq: 7` 的地点（那里掉落率最高），但他们买得到。
  #
  # ## 封印物的定位（写在这里，因为读内容表的人先看到这里）
  #
  # **核心不是「给高序列玩家更多工具」，是「让序列 9 的玩家有可能打赢序列 8 的生物」。**
  # 命运骰子给他一次重抽的机会，封印之刃给他一次无视序列差拦截的机会 ——
  # 各只有一次，而且各有代价（MAD +5 / COR +8）。疯狂不会因为一件物品消失。

  # ---- 神奇物品 4 件（被动：在背包里就生效，不需要 .使用） ----
  - id: wonder_divination_crystal
    name: 占卜水晶
    kind: trinket
    type: wonder
    rarity: 2
    effect: { divinationBonus: 1 }
    sideEffect: { mad: 1 }
    note: 每天多看一次，代价是每天多一次耳鸣
  - id: wonder_lucky_coin
    name: 幸运硬币
    kind: trinket
    type: wonder
    rarity: 2
    effect: { tradeTaxMultiplier: 0.8 }
    note: 它落地的声音很轻，税官听不见
  - id: wonder_night_cloak
    name: 夜行披风
    kind: trinket
    type: wonder
    rarity: 2
    effect: { exploreDangerMultiplierNight: 0.85, exploreDangerMultiplierDay: 1.1 }
    note: 白天穿它太显眼了
  - id: wonder_record_notes
    name: 记录笔记
    kind: trinket
    type: wonder
    rarity: 2
    effect: { playDigMultiplier: 1.1 }
    note: 写下来的东西比记住的更容易变成自己的

  # ---- 封印物 5 件（主动：.使用，用完之后还在，但每次都要付代价） ----
  - id: sealed_fate_dice
    name: 命运骰子
    kind: trinket
    type: sealed
    rarity: 5
    sealLevel: 4
    effect: { reroll: true }
    sideEffect: { mad: 5 }
    note: 掷出去的那一刻，你已经不确定刚才那一次到底有没有发生过
  - id: sealed_blade
    name: 封印之刃
    kind: trinket
    type: sealed
    rarity: 5
    sealLevel: 5
    effect: { ignoreSequenceGap: true, hitModifier: 1.0 }
    sideEffect: { cor: 8 }
    note: 刀身上缠着七道封条。每一次握紧它，那些封条就松一点
  - id: sealed_grey_fog_eye
    name: 灰雾之眼
    kind: trinket
    type: sealed
    rarity: 4
    sealLevel: 3
    effect: { reveal: [ location, hp, sequence ] }
    sideEffect: { mad: 8 }
    note: 它替你看。看得越多，回来的越少
  - id: sealed_time_hourglass
    name: 时间沙漏
    kind: trinket
    type: sealed
    rarity: 5
    sealLevel: 4
    note: 倒过来一次，里面的沙就不再落回去了 —— 它变成了一件单纯的收藏（M2.85：行动值移除后，原效果已下线）
  - id: sealed_blood_moon_blade
    name: 血月之刃
    kind: trinket
    type: sealed
    rarity: 4
    sealLevel: 3
    effect: { damageMultiplier: 2 }
    sideEffect: { cor: 5 }
    note: 它开刃的方式和别的刀不一样 —— 先见血，再出鞘

  # ---- 符咒 3 件（一次性：用了就从背包里扣掉） ----
  - id: charm_exorcism
    name: 驱邪符
    kind: consumable
    type: charm
    rarity: 2
    effect: { cor: -20 }
    note: 烧掉的时候，灰是往上升的
  - id: charm_invisibility
    name: 隐身符
    kind: consumable
    type: charm
    rarity: 3
    effect: { hideWantedHours: 1 }
    note: 一个小时内，没有人在看你 —— 也没有人记得你刚才在哪
  - id: charm_teleport
    name: 传送符
    kind: consumable
    type: charm
    rarity: 3
    effect: { teleportToMarked: true }
    note: 撕开的地方，另一边是你去过的地方

