  # M2.31（P16 落地）：**第一个真实的物品变体** —— 「改装」行动（perfect 序列 5）的产物。
  # 它不是新物品，是淬火匕首的**另一个状态**；加载时展开成 `淬火匕首#retrofit`。
  # ⚠️ 这一条落地时**故意让物品总数断言红一次**（验收要求「新增变体时断言变红」）。
  - id: 淬火匕首
    name: 淬火匕首
    kind: trinket
    bindable: true
    note: 刃口淬过火，比看上去重
    variants:
      - id: retrofit
        name: 改装过的淬火匕首
        note: 刀柄被拆过一次，重新装上去的时候角度变了 —— 现在它更适合撬，而不是割

