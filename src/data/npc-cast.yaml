# 世界人物名册（M2.164）
#
# 用户拍板：「**大量 NPC**（按类型铺开：教会 / 官方 / 地下 / 学者 / 普通人…）」。
#
# 与 npc-tracks.yaml 的分工：
#
#   npc-tracks   **谁在路上**（原作记载的 41 位强者：晋升轨迹，静态）
#   npc-cast     **谁在城里**（世界的居民：巡警、码头工、旧书商、教士、医生…）
#
# 在这张表之前，全世界的 NPC 只有那 41 位 —— 于是阴谋只能发生在半神与半神之间。
#
# ⚠️ 两条硬规矩（加载器会拦，不是提示）：
#   ① 名册的 id **不许**与 npc-tracks 撞车 —— 否则「他死了」会写在错误的身份上
#   ② `city` 必须是 cities.yaml 的 id，`location` 必须是**该城** locations 里的 id
#      （城在那儿但地点不属于它 = 人在一个到不了的地方）
#
# 读取点：场景渲染（街上站着谁）· npc-scheme 的阴谋池 · npc-relations 的好感对象
#        · 世界 tick 的死亡 / 复活 / 蛊惑（npc-life.ts）
meta:
  source: M2.164 项目设计（世界居民名册：身份 / 常驻 / 性情 / 用途标签）
  count: 124
  kind_note: 身份（kind）是**内容分类**，不是判定开关 —— 判定要按身份分档时走显式的 Record<NpcKind, …>（漏键 tsc 就红）。
  tag_note: tags 是中文自由标签（这个人能做什么、知道什么），机制按标签筛选；它不是枚举，因为标签是内容，会一条一条长出来。
  death_note: ⚠️ 这张表是**静态内容**：谁还活着是运行期状态，存在 npc_life 表里（见 src/domain/world/npc-life.ts）。
