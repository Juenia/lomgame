# 边界输入（M2.62）—— 让世界有外面。
#
# ## 为什么需要它
#
# 在它之前这个世界是**封闭**的：因蒂斯、南大陆、苏尼亚海是区域名，
# 但它们与外界的往来没有任何机制；「外神」「殖民」「外来物种」
# 只出现在地点描述与生态漂移里；58 个地点里没有一个知道自己挨着外面。
#
# 一个完全封闭的世界会僵化 —— 它只能在自己内部循环。
#
# ## 三类边界
#
#   port      港口：贸易与移民进来的地方，也是外来污染最容易上岸的地方
#   frontier  边境：陆地接壤，军事威胁从这儿来
#   rift      裂隙：灵界 / 星界的口子。不是地理边界，是**规则边界**
#
# ## 张力是累积的，不是掷骰的
#
# 每条边界每小时累积 base_pressure 的张力，攒到 1 就发生一次输入事件，然后重来。
# 掷骰的问题是「一个高关注的边界可能连续三十天什么都没发生」，
# 而那让「边界」变成一个没有存在感的概念。
# 累积制保证事情**一定会发生**，只是早晚 —— 关注度越高，来得越快。
#
# 张力由**绝对时刻**算出（不是每次 tick 加一点），所以补跑与逐小时跑结果一致。

foreign_powers:

