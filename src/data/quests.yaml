# 委托表（M2.85 RPG 化 D）
#
# 共 24 条：8 类委托人 × 三种委托（猎杀 / 探路 / 跑腿）。
#
# ⚠️ 这不是新造的世界观 —— 是把已有的机制接起来：**交好的 NPC 会请你办事**。
#
#   · 委托人按途径分（占卜师 / 雇佣武士 / 守夜人 / 老船长 / 猎手 / 治安官 / 药剂师 / 掮客）
#
#   · 门槛是**好感**（猎杀要 40、其余 25）—— 与 npc-relation.ts 的亲近档位对齐
#
#   · 完成后给好感 + 便士，并写进 npc_deeds（他会记着这件事）
#
meta:
  source: M2.85 RPG 化 D：**任务系统** —— 用现有机制组合出「委托」
  count: 24
  note: ⚠️ 委托不是新造的世界观，而是把已有的东西接起来：**交好的 NPC 会请你办事**（用户拍板「交好的 NPC 可能在某个时刻帮助玩家」的反面）。
  gate_note: 接委托的门槛是 **好感**（hunt 要 40、其余 25）—— 与 npc-relation.ts 的「亲近」档位对齐（≥25 warm / ≥60 close）。
  reward_note: 奖励数值是项目派生值（好感 + 便士）；没有原作依据，因为原著里没有「任务面板」这种东西。
quests:
  - id: quest_seer_hunt
    kind: hunt
    from: 占卜师
    minAffinity: 40
    minSequence: 9
    title: 猎杀：占卜师的托付
    text: 去把那片灰雾里的东西处理掉 —— 它不该待在离人这么近的地方。
    condition: 击败一只指定途径的生物
    targetPathway: seer
    reward:
      affinity: 12
      penny: 40
      note: 他记你这份人情
      equipmentChance: 0.06
    tier: 2
  - id: quest_seer_explore
    kind: explore
    from: 占卜师
    minAffinity: 25
    minSequence: 9
    title: 探路：占卜师的托付
    text: 去那片灰雾里的东西看一眼。看清楚就行，别多待。
    condition: 到过指定地点
    reward:
      affinity: 8
      penny: 20
      note: 他欠你一次
      equipmentChance: 0
    tier: 1
  - id: quest_seer_deliver
    kind: deliver
    from: 占卜师
    minAffinity: 25
    minSequence: 9
    title: 跑腿：占卜师的托付
    text: 把这件东西送到那片灰雾里的东西 —— 别问为什么，也别打开。
    condition: 把物品带到指定地点
    reward:
      affinity: 8
      penny: 20
      note: 他欠你一次
      equipmentChance: 0
    tier: 1
