# 航线（M2.7 主任务三）：城市之间的有向边。每条边**两个方向各一条记录**，
# 因为「顺流而下 8 小时」与「逆流而上 12 小时」本来就该是两个数。
#
# 前 5 对来自任务书 §3.3 的航线表，**一个数没改**：
#   廷根市 → 贝克兰德   陆路  8h   20 便士  危险 0.2
#   贝克兰德 → 普利兹港 陆路 12h   30 便士  危险 0.3
#   普利兹港 → 苏尼亚海 海路 24h  100 便士  危险 0.5
#   苏尼亚海 → 拜朗     海路 48h  200 便士  危险 0.7
#   贝克兰德 → 特里尔   海路 72h  300 便士  危险 0.6
#
# 另外 2 对是 M2.7 的**补充边**（任务书没写，理由如下）：
#   廷根市 → 普利兹港   陆路 10h   25 便士  危险 0.25
#     —— 出生在廷根（权重 30，最大的一群）的玩家如果只能去贝克兰德，
#        「移动」这条路在 3 天的实例测试里只剩一个目的地，看不出地理的意义。
#   普利兹港 → 特里尔   海路 36h  120 便士  危险 0.55
#     —— 因蒂斯与鲁恩之间原本只有 72h / 300 便士的航线（要绕整个大陆），
#        补一条近海航线之后，两个国家之间第一次有了「当天出发、一天半到」的选择。
#
# events 是路途事件池（事件 id 见 src/domain/geo/events.ts）：
#   陆路：盗匪 / 野兽 / 迷雾 / 同行旅人 / 灵界渗透
#   海路：风浪 / 海怪 / 迷雾 / 幽灵船 / 同行旅人 / 灵界渗透
# 池子只决定「这条路上可能出现什么」；具体抽中谁由 numeric.geo.seaEvents / landEvents 的权重决定。
routes:
